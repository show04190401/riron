フラット35は全期間固定金利の住宅ローンです。\n【ひっかけ】「10年固定」は固定金利期間選択型の説明です。"}, {"id": "mc:22ca2b2524", "c": 1, "s": "問題1-7", "st": 2, "q": "固定費が2,000万円、変動費率が60％の企業の損益分岐点売上高として、正しいものはどれか。", "o": ["3,333万円", "4,000万円", "5,000万円", "8,000万円"], "a": 2, "e": "正解は「5,000万円」です。\n【根拠】損益分岐点売上高＝固定費÷（1－変動費率）＝2,000万円÷0.4＝5,000万円です。\n【ひっかけ】変動費率で割ると3,333万円になります。分母は限界利益率（1－変動費率）です。"}, {"id": "mc:13b6c13653", "c": 1, "s": "問題1-7", "st": 2, "q": "次の財務データから求めたA社の流動比率として、正しいものはどれか。流動資産：6,000万円、うち当座資産：3,600万円、流動負債：4,000万円、総資本：2億円、自己資本：8,000万円。", "o": ["40％", "66.7％", "90％", "150％"], "a": 3, "e": "正解は「150％」です。\n【根拠】流動比率＝6,000万円÷4,000万円×100＝150％です。\n【ひっかけ】当座比率は3,600÷4,000＝90％、自己資本比率は8,000÷2億＝40％です。"}, {"id": "mc:b400cc6874", "c": 1, "s": "問題1-7", "st": 2, "q": "消費者信用に関する次の記述のうち、最も適切なものはどれか。", "o": ["総量規制は、銀行のカードローンにも適用される。", "クレジットカードのショッピング枠の利用は、総量規制の対象外である。", "総量規制により、貸金業者からの借入れは原則として年収の2分の1までとなる。", "リボルビング払いでは、利用残高にかかわらず手数料は発生しない。"], "a": 1, "e": "正解は「クレジットカードのショッピング枠の利用は、総量規制の対象外である。」です。\n【根拠】ショッピングは貸金業法の「貸付け」ではないため、総量規制の対象外です。\n【ひっかけ】総量規制は年収の3分の1まで、銀行は対象外、リボ払いは残高に手数料がかかります。"}, {"id": "mc:68c2f5071c", "c": 2, "s": "問題2-1", "st": 2, "q": "保険契約者保護機構に関する次の記述のうち、最も適切なものはどれか。", "o": ["生命保険契約は、原則として破綻時点の責任準備金等の80％まで補償される。", "家計地震保険は、保険金の100％が補償される。", "少額短期保険業者の保険契約も、補償の対象となる。", "国内で営業する外国保険会社の日本支店との契約は、補償の対象外である。"], "a": 1, "e": "正解は「家計地震保険は、保険金の100％が補償される。」です。\n【根拠】自賠責保険と家計地震保険は100％補償されます。\n【ひっかけ】生命保険は90％です。少額短期保険と共済は対象外、外国保険会社の日本支店との契約は対象です。"}, {"id": "mc:895da6423c", "c": 2, "s": "問題2-2", "st": 2, "q": "生命保険の保険料の払込みが困難になった場合の対応に関する次の記述のうち、最も不適切なものはどれか。", "o": ["払済保険に変更すると、保険期間は変わらず、保険金額が少なくなる。", "延長保険に変更すると、保険金額は変わらず、保険期間が元の契約より短くなることがある。", "自動振替貸付は、解約返戻金の範囲内で保険会社が保険料を立て替える制度である。", "失効した契約を復活させる場合、告知や診査は不要である。"], "a": 3, "e": "正解は「失効した契約を復活させる場合、告知や診査は不要である。」です。\n【根拠】復活には告知又は診査が必要です。\n【ひっかけ】復活後の保険料率は失効前と同じです。"}, {"id": "mc:179906aec2", "c": 2, "s": "問題2-2", "st": 2, "q": "生命保険の契約に関する次の記述のうち、最も適切なものはどれか。", "o": ["責任開始日は、保険会社が契約を承諾した日である。", "告知義務違反による解除権は、契約締結から5年を経過すると消滅する。", "予定利率を高く設定すると、保険料は高くなる。", "無配当保険は、有配当保険に比べて保険料が高い。"], "a": 1, "e": "正解は「告知義務違反による解除権は、契約締結から5年を経過すると消滅する。」です。\n【根拠】解除権は、原因を知った時から1か月、又は契約締結から5年で消滅します。\n【ひっかけ】責任開始日は3要件がそろった日、予定利率が高いと保険料は安く、無配当保険は保険料が割安です。"}, {"id": "mc:69cbe336be", "c": 2, "s": "問題2-2", "st": 2, "q": "個人年金保険に関する次の記述のうち、最も適切なものはどれか。", "o": ["確定年金は、被保険者が死亡すると年金の支払が終了する。", "有期年金は、被保険者の生死にかかわらず一定期間年金が支払われる。", "終身年金は、被保険者が生存している限り年金が支払われる。", "変額個人年金保険は、年金原資に最低保証がない商品に限られる。"], "a": 2, "e": "正解は「終身年金は、被保険者が生存している限り年金が支払われる。」です。\n【根拠】終身年金は、被保険者が生存している限り一生涯支払われます。\n【ひっかけ】確定年金は生死に関係なく一定期間、有期年金は生存中の一定期間です。変額個人年金には年金原資の最低保証があるものもあります。"}, {"id": "mc:315d909c15", "c": 2, "s": "問題2-3", "st": 2, "q": "契約者（保険料負担者）、被保険者、死亡保険金受取人の組合せのうち、死亡保険金が相続税の課税対象となるものはどれか。", "o": ["契約者：夫／被保険者：夫／受取人：妻", "契約者：妻／被保険者：夫／受取人：妻", "契約者：夫／被保険者：妻／受取人：子", "契約者：子／被保険者：夫／受取人：子"], "a": 0, "e": "正解は「契約者：夫／被保険者：夫／受取人：妻」です。\n【根拠】契約者＝被保険者の死亡保険金は相続税の対象です。\n【ひっかけ】契約者＝受取人は所得税（一時所得）、三者がすべて異なる場合は贈与税です。"}, {"id": "mc:fe75ae1130", "c": 2, "s": "問題2-3", "st": 2, "q": "生命保険料控除に関する次の記述のうち、最も不適切なものはどれか（2012年以後の契約）。", "o": ["一般の生命保険料控除の所得税の限度額は4万円である。", "がん保険の保険料は、介護医療保険料控除の対象となる。", "住民税の控除限度額の合計は7万円である。", "所得税の控除限度額の合計は15万円である。"], "a": 3, "e": "正解は「所得税の控除限度額の合計は15万円である。」です。\n【根拠】新契約の所得税の控除限度額は、3区分の合計で12万円です。\n【ひっかけ】旧契約（一般5万円・個人年金5万円）が絡む場合も、合計の上限は12万円です。"}, {"id": "mc:eb8bc1a3a7", "c": 2, "s": "問題2-4", "st": 2, "q": "損害保険に関する次の記述のうち、最も適切なものはどれか。", "o": ["軽過失により隣家を焼失させた場合、失火責任法により隣家への損害賠償責任を負う。", "地震保険は、火災保険に付帯せずに単独で契約できる。", "自賠責保険は、対人賠償事故のみが補償の対象である。", "個人賠償責任保険は、業務遂行中の事故も補償の対象となる。"], "a": 2, "e": "正解は「自賠責保険は、対人賠償事故のみが補償の対象である。」です。\n【根拠】自賠責保険は対人賠償のみです。\n【ひっかけ】軽過失の失火は責任を負わず、地震保険は火災保険に付帯、業務中の事故は個人賠償責任保険の対象外です。"}, {"id": "mc:e0dd0bbfac", "c": 2, "s": "問題2-4", "st": 2, "q": "地震保険に関する次の記述のうち、最も不適切なものはどれか。", "o": ["保険金額は、火災保険の保険金額の30％〜50％の範囲内で設定する。", "保険金額の上限は、建物5,000万円、家財1,000万円である。", "地震による火災で建物が焼失した場合、火災保険から保険金が支払われる。", "所得税の地震保険料控除の限度額は5万円である。"], "a": 2, "e": "正解は「地震による火災で建物が焼失した場合、火災保険から保険金が支払われる。」です。\n【根拠】地震・噴火・津波を原因とする火災損害は、火災保険では補償されません。\n【ひっかけ】地震火災に備えるには地震保険（又は火災保険の地震火災費用保険金）が必要です。"}, {"id": "mc:0eb2715c78", "c": 2, "s": "問題2-4", "st": 2, "q": "事業活動に伴うリスクと保険の組合せとして、最も不適切なものはどれか。", "o": ["製造した製品の欠陥による事故の賠償責任―生産物賠償責任保険", "店舗の床が濡れていて客が転倒した事故の賠償責任―施設所有（管理）者賠償責任保険", "クリーニング店が客から預かった衣類を紛失した賠償責任―受託者賠償責任保険", "飲食店が提供した料理による客の食中毒の賠償責任―受託者賠償責任保険"], "a": 3, "e": "正解は「飲食店が提供した料理による客の食中毒の賠償責任―受託者賠償責任保険」です。\n【根拠】提供した料理による事故は、生産物賠償責任保険（PL保険）の対象です。\n【ひっかけ】受託者賠償責任保険は、他人から預かった物の損害が対象です。"}, {"id": "mc:8ee8207808", "c": 2, "s": "問題2-4", "st": 2, "q": "傷害保険に関する次の記述のうち、最も適切なものはどれか。", "o": ["普通傷害保険は、細菌性食中毒を補償する。", "国内旅行傷害保険は、地震によるけがを補償する。", "海外旅行傷害保険は、細菌性食中毒も地震によるけがも補償する。", "家族傷害保険では、別居の未婚の子は被保険者とならない。"], "a": 2, "e": "正解は「海外旅行傷害保険は、細菌性食中毒も地震によるけがも補償する。」です。\n【根拠】海外旅行傷害保険は、細菌性食中毒も地震・噴火・津波によるけがも補償します。\n【ひっかけ】普通傷害保険は食中毒を補償せず、国内旅行傷害保険は地震を補償せず、別居の未婚の子は家族傷害保険の対象です。"}, {"id": "mc:619a3b0cf4", "c": 2, "s": "問題2-5", "st": 2, "q": "法人を契約者とする生命保険の経理処理に関する次の記述のうち、最も適切なものはどれか。", "o": ["終身保険（受取人：法人）の支払保険料は、全額を損金に算入する。", "最高解約返戻率が50％以下の定期保険（受取人：法人）の支払保険料は、原則として全額を損金に算入する。", "福利厚生プランの養老保険の支払保険料は、全額を資産に計上する。", "法人が受け取った死亡保険金は、益金に算入しない。"], "a": 1, "e": "正解は「最高解約返戻率が50％以下の定期保険（受取人：法人）の支払保険料は、原則として全額を損金に算入する。」です。\n【根拠】最高解約返戻率50％以下の定期保険・第三分野保険は、原則として全額損金です。\n【ひっかけ】終身保険は資産計上、福利厚生プランは2分の1損金、受け取った保険金は益金（資産計上額との差額は雑収入など）です。"}, {"id": "mc:84e33632f2", "c": 3, "s": "問題3-1", "st": 2, "q": "経済指標とその公表機関の組合せとして、最も不適切なものはどれか。", "o": ["国内総生産（GDP）―内閣府", "景気動向指数―内閣府", "消費者物価指数―日本銀行", "全国企業短期経済観測調査―日本銀行"], "a": 2, "e": "正解は「消費者物価指数―日本銀行」です。\n【根拠】消費者物価指数は総務省が公表します。\n【ひっかけ】日本銀行が公表するのは、日銀短観、企業物価指数、マネーストック統計などです。"}, {"id": "mc:b74fc2db10", "c": 3, "s": "問題3-2", "st": 2, "q": "表面利率0.8％、残存期間5年の固定利付債券を、額面100円あたり101円で購入した場合の最終利回り（単利・年率）として、最も適切なものはどれか（小数点以下第3位四捨五入）。", "o": ["0.59％", "0.60％", "0.79％", "0.99％"], "a": 0, "e": "正解は「0.59％」です。\n【根拠】（0.8＋（100－101）÷5）÷101×100＝0.6÷101×100≒0.594…≒0.59％です。\n【ひっかけ】額面（100円）で割ると0.60％になってしまいます。分母は購入価格です。"}, {"id": "mc:cba66a8282", "c": 3, "s": "問題3-2", "st": 2, "q": "表面利率1.2％の固定利付債券を、額面100円あたり96円で購入した場合の直接利回りとして、正しいものはどれか（小数点以下第3位四捨五入）。", "o": ["1.15％", "1.20％", "1.25％", "5.21％"], "a": 2, "e": "正解は「1.25％」です。\n【根拠】直接利回り＝1.2÷96×100＝1.25％です。\n【ひっかけ】額面で割ると1.20％になります。直接利回りに償還差益は含めません。"}, {"id": "mc:c1a9ca5fef", "c": 3, "s": "問題3-2", "st": 2, "q": "100万円を年利2％・半年複利で1年間預け入れた場合の元利合計額として、正しいものはどれか（税金は考慮しない）。", "o": ["1,020,000円", "1,020,100円", "1,040,000円", "1,040,400円"], "a": 1, "e": "正解は「1,020,100円」です。\n【根拠】半年複利では半年ごとに1％ずつ利息が付きます。100万円×1.01×1.01＝1,020,100円です。\n【ひっかけ】単利なら1,020,000円です。1％と2％の取り違えにも注意します。"}, {"id": "mc:e6f3fb8799", "c": 3, "s": "問題3-3", "st": 2, "q": "次のデータに基づくA社のPBRとして、正しいものはどれか。株価：2,400円、1株当たり純利益：160円、1株当たり純資産：1,600円、1株当たり年間配当金：48円。", "o": ["1.5倍", "15倍", "2.0％", "10％"], "a": 0, "e": "正解は「1.5倍」です。\n【根拠】PBR＝株価÷1株当たり純資産＝2,400÷1,600＝1.5倍です。\n【ひっかけ】PERは2,400÷160＝15倍、配当利回りは48÷2,400＝2.0％、ROEは160÷1,600＝10％です。"}, {"id": "mc:bfcb8e58a9", "c": 3, "s": "問題3-3", "st": 2, "q": "信用取引に関する次の記述のうち、最も適切なものはどれか。", "o": ["委託保証金は、約定代金の20％以上かつ20万円以上が必要である。", "制度信用取引の返済期限は、最長6か月である。", "一般信用取引の対象銘柄は、取引所が選定する。", "信用取引では、売りから取引を始めることはできない。"], "a": 1, "e": "正解は「制度信用取引の返済期限は、最長6か月である。」です。\n【根拠】制度信用取引の返済期限は最長6か月です。\n【ひっかけ】保証金は30％以上かつ30万円以上、一般信用取引の銘柄は証券会社が決め、信用取引では売りから始められます（空売り）。"}, {"id": "mc:7b3a25c942", "c": 3, "s": "問題3-4", "st": 2, "q": "NISAに関する次の記述のうち、最も不適切なものはどれか。", "o": ["つみたて投資枠と成長投資枠は、同一年中に併用できる。", "非課税保有限度額は1,800万円で、そのうち成長投資枠は1,200万円までである。", "口座を開設できるのは、日本に住む20歳以上の者である。", "NISA口座で生じた損失は、他の口座の利益と損益通算できない。"], "a": 2, "e": "正解は「口座を開設できるのは、日本に住む20歳以上の者である。」です。\n【根拠】NISA口座は、日本に住む18歳以上の者が開設できます。\n【ひっかけ】成年年齢の引下げにあわせて18歳以上となっています。"}, {"id": "mc:a49de5aab6", "c": 3, "s": "問題3-4", "st": 2, "q": "投資信託に関する次の記述のうち、最も適切なものはどれか。", "o": ["信託報酬は、購入時に一度だけ支払う費用である。", "元本払戻金（特別分配金）は、配当所得として課税される。", "ドル・コスト平均法は、定額で継続購入することで平均購入単価を抑える効果が期待できる。", "パッシブ運用は、ベンチマークを上回る運用成果をめざす。"], "a": 2, "e": "正解は「ドル・コスト平均法は、定額で継続購入することで平均購入単価を抑える効果が期待できる。」です。\n【根拠】定額で買うと、安いときに多くの口数を買えるため平均購入単価が下がりやすくなります。\n【ひっかけ】信託報酬は保有期間中に差し引かれ、元本払戻金は非課税、ベンチマークを上回ることをめざすのはアクティブ運用です。"}, {"id": "mc:aa364eb90b", "c": 3, "s": "問題3-5", "st": 2, "q": "A資産の期待収益率が3％、B資産の期待収益率が7％のとき、A資産を60％、B資産を40％組み入れたポートフォリオの期待収益率として、正しいものはどれか。", "o": ["4.2％", "4.6％", "5.0％", "5.4％"], "a": 1, "e": "正解は「4.6％」です。\n【根拠】3％×0.6＋7％×0.4＝1.8％＋2.8％＝4.6％です。\n【ひっかけ】期待収益率は組入比率による加重平均です（リスクは単純な加重平均になりません）。"}, {"id": "mc:8e4995214e", "c": 3, "s": "問題3-5", "st": 2, "q": "米ドル建て定期預金1万ドル（預入時TTS151円、TTM150円、TTB149円）が、1年後に利率2％で満期を迎えた。満期時のTTSが152円、TTMが151円、TTBが150円のとき、円換算した元利金額として正しいものはどれか（税金は考慮しない）。", "o": ["1,520,000円", "1,530,000円", "1,540,200円", "1,550,400円"], "a": 1, "e": "正解は「1,530,000円」です。\n【根拠】元利金は10,000ドル×1.02＝10,200ドル。外貨を円に換えるのでTTB150円を使い、10,200×150＝1,530,000円です。\n【ひっかけ】TTMを使うと1,540,200円、TTSを使うと1,550,400円になります。"}, {"id": "mc:931fec68e4", "c": 3, "s": "問題3-5", "st": 2, "q": "リスクに関する次の記述のうち、最も不適切なものはどれか。", "o": ["相関係数が－1の2資産を組み合わせると、リスク低減効果は最大となる。", "アンシステマティック・リスクは、分散投資により低減できる。", "システマティック・リスクは、分散投資により消去できる。", "標準偏差が大きいほど、リターンのばらつきが大きい。"], "a": 2, "e": "正解は「システマティック・リスクは、分散投資により消去できる。」です。\n【根拠】システマティック・リスク（市場リスク）は、分散投資をしても消せません。\n【ひっかけ】分散投資で減らせるのは、個別銘柄に固有のリスクです。"}, {"id": "mc:1bca0a7b42", "c": 3, "s": "問題3-6", "st": 2, "q": "預金保険制度の保護の対象となるものとして、最も適切なものはどれか。", "o": ["外貨預金", "譲渡性預金", "円建ての定期預金", "銀行で購入した投資信託"], "a": 2, "e": "正解は「円建ての定期預金」です。\n【根拠】円建ての定期預金は、元本1,000万円までとその利息等が保護されます。\n【ひっかけ】外貨預金・譲渡性預金は対象外、投資信託は預金ではないため対象外です。"}, {"id": "mc:adef68e018", "c": 3, "s": "問題3-7", "st": 2, "q": "金融商品の課税に関する次の記述のうち、最も適切なものはどれか。", "o": ["預貯金の利子は、申告分離課税の対象である。", "外貨建MMFの為替差益は非課税である。", "上場株式等の配当は、申告不要を選択できる（大口株主等を除く）。", "外貨預金の為替差益は、為替予約がない場合も源泉分離課税である。"], "a": 2, "e": "正解は「上場株式等の配当は、申告不要を選択できる（大口株主等を除く）。」です。\n【根拠】上場株式等の配当は、総合課税・申告分離課税・申告不要から選べます。\n【ひっかけ】預貯金の利子は源泉分離課税、外貨建MMFの為替差益は申告分離課税、予約なしの外貨預金の為替差益は雑所得です。"}, {"id": "mc:4d847c6a10", "c": 3, "s": "問題3-7", "st": 2, "q": "上場株式の譲渡損失との損益通算に関する次の記述のうち、最も不適切なものはどれか。", "o": ["申告分離課税を選択した上場株式等の配当と損益通算できる。", "特定公社債の利子と損益通算できる。", "総合課税を選択した上場株式の配当と損益通算できる。", "控除しきれない損失は、確定申告により翌年以後3年間繰り越せる。"], "a": 2, "e": "正解は「総合課税を選択した上場株式の配当と損益通算できる。」です。\n【根拠】総合課税を選択した配当とは損益通算できません。\n【ひっかけ】損益通算するには、配当について申告分離課税を選択します。"}, {"id": "mc:fdd8893200", "c": 4, "s": "問題4-2", "st": 2, "q": "勤続年数30年4か月で退職し、退職金3,000万円を受け取った場合の退職所得の金額として、正しいものはどれか（障害者となったことによる退職ではない）。", "o": ["715万円", "750万円", "1,430万円", "1,500万円"], "a": 0, "e": "正解は「715万円」です。\n【根拠】勤続年数は31年（1年未満の端数は切上げ）。退職所得控除額＝800万円＋70万円×（31年－20年）＝1,570万円。退職所得＝（3,000万円－1,570万円）×1/2＝715万円です。\n【ひっかけ】端数を切り捨てて30年で計算すると750万円、2分の1を忘れると1,430万円になります。"}, {"id": "mc:d491d0d48b", "c": 4, "s": "問題4-2", "st": 2, "q": "個人事業主の減価償却に関する次の記述のうち、最も不適切なものはどれか。", "o": ["償却方法を選定しなかった場合の法定償却方法は定額法である。", "建物の償却方法は定額法に限られる。", "取得価額10万円未満の資産は、全額をその年の必要経費にできる。", "取得価額20万円未満の資産は、一括償却資産として5年間で均等償却できる。"], "a": 3, "e": "正解は「取得価額20万円未満の資産は、一括償却資産として5年間で均等償却できる。」です。\n【根拠】一括償却資産は3年間で均等に償却します。\n【ひっかけ】法人も同じく、一括償却資産は3年です。"}, {"id": "mc:acd567c6f8", "c": 4, "s": "問題4-2", "st": 2, "q": "所得税における所得の区分に関する次の記述のうち、最も適切なものはどれか。", "o": ["事業的規模でない不動産の貸付けによる所得は、雑所得となる。", "会社員が受け取った生命保険の満期保険金（契約者は本人）は、一時所得となる。", "個人年金保険の年金は、公的年金等として雑所得となる。", "上場株式の配当金は、利子所得となる。"], "a": 1, "e": "正解は「会社員が受け取った生命保険の満期保険金（契約者は本人）は、一時所得となる。」です。\n【根拠】契約者＝受取人の満期保険金は一時所得です。\n【ひっかけ】不動産の貸付けは規模にかかわらず不動産所得、個人年金は公的年金等以外の雑所得、配当金は配当所得です。"}, {"id": "mc:539cff2a8d", "c": 4, "s": "問題4-3", "st": 2, "q": "所得税における損益通算に関する次の記述のうち、最も適切なものはどれか。", "o": ["一時所得の損失は、給与所得と損益通算できる。", "不動産所得の損失のうち、建物の取得に要した負債の利子に相当する部分は、損益通算できない。", "生活に通常必要でない資産の譲渡損失は、原則として損益通算できない。", "雑所得の損失は、事業所得と損益通算できる。"], "a": 2, "e": "正解は「生活に通常必要でない資産の譲渡損失は、原則として損益通算できない。」です。\n【根拠】ゴルフ会員権や別荘など、生活に通常必要でない資産の譲渡損失は損益通算できません。\n【ひっかけ】損益通算できない不動産所得の損失は「土地」の取得に要した負債の利子部分です。一時所得・雑所得の損失は損益通算できません。"}, {"id": "mc:85a3e9c77c", "c": 4, "s": "問題4-4", "st": 2, "q": "所得控除に関する次の記述のうち、最も不適切なものはどれか。", "o": ["医療費控除の上限額は200万円である。", "セルフメディケーション税制と通常の医療費控除は、選択適用である。", "16歳未満の扶養親族は、扶養控除の対象とならない。", "盗難による損失は、雑損控除の対象とならない。"], "a": 3, "e": "正解は「盗難による損失は、雑損控除の対象とならない。」です。\n【根拠】災害・盗難・横領による損失は雑損控除の対象です。対象外なのは詐欺・恐喝による損失です。\n【ひっかけ】医療費控除・セルフメディケーション税制・扶養控除の記述はいずれも適切です。"}, {"id": "mc:e4e00844bb", "c": 4, "s": "問題4-4", "st": 2, "q": "医療費控除の対象となるものとして、最も適切なものはどれか。", "o": ["健康診断で異常が見つからなかった場合の人間ドックの費用", "美容整形の費用", "病気の治療のために通院した際の電車代", "疲労回復のためのビタミン剤の購入費"], "a": 2, "e": "正解は「病気の治療のために通院した際の電車代」です。\n【根拠】通院のための電車・バス代は対象です。\n【ひっかけ】異常のなかった人間ドック、美容整形、予防・健康増進のための医薬品は対象外です。"}, {"id": "mc:1b5b57013a", "c": 4, "s": "問題4-4", "st": 2, "q": "所得税の所得控除に関する次の記述のうち、最も適切なものはどれか。", "o": ["特定扶養親族に係る扶養控除の額は38万円である。", "同居特別障害者に係る障害者控除の額は75万円である。", "ふるさと納税のワンストップ特例は、寄附先が10自治体以内であれば利用できる。", "詐欺による損失は、雑損控除の対象となる。"], "a": 1, "e": "正解は「同居特別障害者に係る障害者控除の額は75万円である。」です。\n【根拠】障害者27万円、特別障害者40万円、同居特別障害者75万円です。\n【ひっかけ】特定扶養親族は63万円、ワンストップ特例は5自治体以内、詐欺の損失は雑損控除の対象外です。"}, {"id": "mc:afd4a7c852", "c": 4, "s": "問題4-5", "st": 2, "q": "住宅借入金等特別控除に関する次の記述のうち、最も適切なものはどれか。", "o": ["控除を受ける年の合計所得金額が3,000万円以下でなければならない。", "住宅ローンの返済期間は5年以上であればよい。", "給与所得者は、適用を受ける最初の年分から年末調整により控除を受けることができる。", "住宅を取得した日から6か月以内に居住の用に供する必要がある。"], "a": 3, "e": "正解は「住宅を取得した日から6か月以内に居住の用に供する必要がある。」です。\n【根拠】取得等の日から6か月以内に居住し、その年の12月31日まで引き続き居住していることが要件です。\n【ひっかけ】合計所得金額は2,000万円以下、返済期間は10年以上、初年度は確定申告が必要です。"}, {"id": "mc:5d07bf529f", "c": 4, "s": "問題4-5", "st": 2, "q": "所得税・住民税に関する次の記述のうち、最も適切なものはどれか。", "o": ["住民税は、その年の所得に対してその年に課税される。", "住民税は、1月1日現在の住所地の市町村が課税する。", "更正の請求は、法定申告期限から3年以内に行う。", "白色申告者も、純損失を3年間繰り越すことができる。"], "a": 1, "e": "正解は「住民税は、1月1日現在の住所地の市町村が課税する。」です。\n【根拠】住民税は1月1日の住所地で、前年の所得に課税されます。\n【ひっかけ】更正の請求は5年以内、純損失の繰越控除は原則として青色申告者のみです。"}, {"id": "mc:f2a6c55460", "c": 4, "s": "問題4-6", "st": 2, "q": "法人税の交際費等に関する次の記述のうち、最も適切なものはどれか。", "o": ["期末資本金の額が1億円以下の法人（一定の法人を除く）は、年800万円までの交際費等を損金に算入できる。", "1人あたり2万円以下の飲食費（社内飲食費を除く）は、交際費等から除かれる。", "中小法人は、接待飲食費の全額を損金に算入できる。", "交際費等は、法人の規模にかかわらず全額が損金不算入となる。"], "a": 0, "e": "正解は「期末資本金の額が1億円以下の法人（一定の法人を除く）は、年800万円までの交際費等を損金に算入できる。」です。\n【根拠】中小法人は、年800万円の定額控除限度額と接待飲食費の50％のいずれかを選択できます。\n【ひっかけ】飲食費の除外基準は1人あたり1万円以下です。接待飲食費は50％までです。"}, {"id": "mc:227ea4dd47", "c": 4, "s": "問題4-6", "st": 2, "q": "法人税に関する次の記述のうち、最も不適切なものはどれか。", "o": ["定期同額給与は、損金に算入することができる役員給与である。", "事前確定届出給与は、所定の時期に確定額を支給する旨を税務署長に届け出た役員給与である。", "期末資本金の額が1億円以下の法人（一定の法人を除く）は、交際費等のうち年800万円までを損金に算入できる。", "法人税の申告期限は、原則として事業年度終了の日の翌日から3か月以内である。"], "a": 3, "e": "正解は「法人税の申告期限は、原則として事業年度終了の日の翌日から3か月以内である。」です。\n【根拠】法人税の申告期限は、原則として事業年度終了の日の翌日から2か月以内です。\n【ひっかけ】申告期限の延長の特例を受けている場合は、別に期限が延びます。"}, {"id": "mc:73bc7d477e", "c": 4, "s": "問題4-6", "st": 2, "q": "消費税に関する次の記述のうち、最も不適切なものはどれか。", "o": ["基準期間の課税売上高が1,000万円以下の事業者は、原則として免税事業者となる。", "個人事業者の基準期間は、その年の前々年である。", "簡易課税制度は、基準期間の課税売上高が1億円以下の事業者が選択できる。", "免税事業者でも、適格請求書発行事業者の登録を受けることができる。"], "a": 2, "e": "正解は「簡易課税制度は、基準期間の課税売上高が1億円以下の事業者が選択できる。」です。\n【根拠】簡易課税制度は、基準期間の課税売上高が5,000万円以下の事業者が選択できます。\n【ひっかけ】免税点の1,000万円と、簡易課税の5,000万円を区別して押さえます。"}, {"id": "mc:546c62caf6", "c": 4, "s": "問題4-6", "st": 2, "q": "法人税・消費税に関する次の記述のうち、最も不適切なものはどれか。", "o": ["中小法人等の欠損金は、翌期以後10年間繰り越して控除できる。", "大法人の欠損金の繰越控除は、所得の50％が限度である。", "簡易課税制度は、基準期間の課税売上高が1億円以下の事業者が選択できる。", "適格請求書発行事業者は、課税事業者である。"], "a": 2, "e": "正解は「簡易課税制度は、基準期間の課税売上高が1億円以下の事業者が選択できる。」です。\n【根拠】簡易課税制度は、基準期間の課税売上高が5,000万円以下の事業者が選択できます。\n【ひっかけ】1億円は、他の制度（少額特例など）の基準と混同しやすい数字です。"}, {"id": "mc:168f34ffad", "c": 5, "s": "問題5-1", "st": 2, "q": "土地の価格に関する次の記述のうち、最も適切なものはどれか。", "o": ["公示価格は、都道府県が毎年7月1日を基準日として公表する。", "相続税路線価は、公示価格の80％程度が目安とされる。", "固定資産税評価額は、毎年評価替えが行われる。", "基準地標準価格は、国土交通省が毎年1月1日を基準日として公表する。"], "a": 1, "e": "正解は「相続税路線価は、公示価格の80％程度が目安とされる。」です。\n【根拠】相続税路線価は公示価格の80％、固定資産税評価額は70％程度が目安です。\n【ひっかけ】公示価格は国土交通省・1月1日、基準地標準価格は都道府県・7月1日、固定資産税評価額は3年ごとの評価替えです。"}, {"id": "mc:a385436ade", "c": 5, "s": "問題5-2", "st": 2, "q": "宅地建物取引業法に基づく媒介契約に関する次の記述のうち、最も適切なものはどれか。", "o": ["一般媒介契約では、物件を指定流通機構に登録する義務がある。", "専任媒介契約の有効期間は、最長6か月である。", "専属専任媒介契約では、業務の処理状況を1週間に1回以上報告しなければならない。", "専属専任媒介契約でも、依頼者が自ら見つけた相手方と直接契約できる。"], "a": 2, "e": "正解は「専属専任媒介契約では、業務の処理状況を1週間に1回以上報告しなければならない。」です。\n【根拠】専属専任媒介契約は1週間に1回以上、専任媒介契約は2週間に1回以上の報告が必要です。\n【ひっかけ】一般媒介は登録義務なし、有効期間は最長3か月、専属専任では自己発見取引はできません。"}, {"id": "mc:b2553cfa6a", "c": 5, "s": "問題5-3", "st": 2, "q": "借地借家法に関する次の記述のうち、最も適切なものはどれか。", "o": ["一般定期借地権の存続期間は30年以上である。", "事業用定期借地権等の設定契約は、公正証書によらなければならない。", "建物譲渡特約付借地権の存続期間は50年以上である。", "定期借家契約では、期間を1年未満とすることはできない。"], "a": 1, "e": "正解は「事業用定期借地権等の設定契約は、公正証書によらなければならない。」です。\n【根拠】事業用定期借地権等は、公正証書で契約しなければなりません。\n【ひっかけ】一般定期借地権は50年以上、建物譲渡特約付借地権は30年以上、定期借家契約は1年未満も可能です。"}, {"id": "mc:d31dd7918c", "c": 5, "s": "問題5-3", "st": 2, "q": "借地借家法に関する次の記述のうち、最も不適切なものはどれか。", "o": ["借地上に借地権者本人名義で登記された建物があれば、借地権を第三者に対抗できる。", "借家権は、建物の引渡しを受けていれば、その後の建物の取得者に対抗できる。", "普通借家契約で期間を6か月とした場合、期間の定めがないものとみなされる。", "定期借家契約は、公正証書でしなければ効力を生じない。"], "a": 3, "e": "正解は「定期借家契約は、公正証書でしなければ効力を生じない。」です。\n【根拠】定期借家契約は書面（又は電磁的記録）で締結すればよく、公正証書は不要です。\n【ひっかけ】公正証書が必要なのは事業用定期借地権等です。"}, {"id": "mc:6ea2fbb5f0", "c": 5, "s": "問題5-4", "st": 2, "q": "幅員6mの市道に面した、第一種住居地域内の300㎡の敷地（指定容積率300％、法定乗数10分の4）に建築できる建物の延べ面積の最高限度として、正しいものはどれか。", "o": ["600㎡", "720㎡", "900㎡", "1,080㎡"], "a": 1, "e": "正解は「720㎡」です。\n【根拠】6m×4/10＝240％と指定容積率300％の低いほう240％を使います。300㎡×240％＝720㎡です。\n【ひっかけ】指定容積率のまま計算すると900㎡になります。前面道路が12m未満かを必ず確認します。"}, {"id": "mc:d33aa8af99", "c": 5, "s": "問題5-4", "st": 2, "q": "建築基準法に関する次の記述のうち、最も適切なものはどれか。", "o": ["工業専用地域でも、住宅を建築することができる。", "建築物が防火地域と準防火地域にわたる場合は、原則として厳しいほうの規制が適用される。", "敷地が2つの用途地域にわたる場合、建ぺい率は敷地の過半が属する地域の数値による。", "特定行政庁が指定する角地は、容積率が10％加算される。"], "a": 1, "e": "正解は「建築物が防火地域と準防火地域にわたる場合は、原則として厳しいほうの規制が適用される。」です。\n【根拠】防火規制は、原則として厳しいほう（防火地域）が建築物の全部に適用されます。\n【ひっかけ】工業専用地域には住宅を建てられず、建ぺい率は加重平均、角地の緩和は建ぺい率の10％加算です。"}, {"id": "mc:cd27581ebe", "c": 5, "s": "問題5-4", "st": 2, "q": "防火地域・準防火地域の指定のない第一種住居地域内にある、角地に該当しない360㎡の土地（指定建ぺい率60％）に建築できる建物の建築面積の最高限度として、正しいものはどれか。", "o": ["180㎡", "216㎡", "252㎡", "288㎡"], "a": 1, "e": "正解は「216㎡」です。\n【根拠】360㎡×60％＝216㎡です。緩和の適用がないため、指定建ぺい率のまま計算します。\n【ひっかけ】角地や防火地域の耐火建築物等なら70％（252㎡）になります。"}, {"id": "mc:89b0828e7b", "c": 5, "s": "問題5-5", "st": 2, "q": "不動産に係る税金に関する次の記述のうち、最も不適切なものはどれか。", "o": ["相続による不動産の取得には、不動産取得税は課されない。", "固定資産税の納税義務者は、毎年1月1日現在の所有者である。", "小規模住宅用地の固定資産税の課税標準は、価格の6分の1である。", "贈与による不動産の取得には、不動産取得税は課されない。"], "a": 3, "e": "正解は「贈与による不動産の取得には、不動産取得税は課されない。」です。\n【根拠】贈与による取得には不動産取得税が課されます。\n【ひっかけ】非課税となるのは相続・法人の合併などによる取得です。"}, {"id": "mc:4611a05f4e", "c": 5, "s": "問題5-5", "st": 2, "q": "不動産の取得・保有に係る税金に関する次の記述のうち、最も適切なものはどれか。", "o": ["不動産取得税は、市町村が課税する。", "相続による所有権移転登記の登録免許税の税率は2％である。", "要件を満たす新築住宅は、不動産取得税の課税標準から1,200万円を控除できる。", "都市計画税の標準税率は1.4％である。"], "a": 2, "e": "正解は「要件を満たす新築住宅は、不動産取得税の課税標準から1,200万円を控除できる。」です。\n【根拠】床面積50㎡以上240㎡以下などの要件を満たす新築住宅は、1,200万円控除されます。\n【ひっかけ】不動産取得税は都道府県税、相続登記は0.4％、都市計画税は制限税率0.3％（1.4％は固定資産税の標準税率）です。"}, {"id": "mc:ec9661e67d", "c": 5, "s": "問題5-6", "st": 2, "q": "居住用財産の譲渡に関する特例について、次の記述のうち最も適切なものはどれか。", "o": ["3,000万円特別控除は、所有期間が10年を超えていなければ適用を受けられない。", "3,000万円特別控除は、子に譲渡した場合にも適用を受けられる。", "軽減税率の特例は、3,000万円特別控除と併用できる。", "特定の居住用財産の買換え特例は、3,000万円特別控除と併用できる。"], "a": 2, "e": "正解は「軽減税率の特例は、3,000万円特別控除と併用できる。」です。\n【根拠】3,000万円特別控除と軽減税率の特例は併用できます。\n【ひっかけ】3,000万円特別控除に所有期間の要件はなく、子（直系血族）への譲渡は対象外、買換え特例とは選択適用です。"}, {"id": "mc:359581f407", "c": 5, "s": "問題5-6", "st": 2, "q": "土地の有効活用の方式に関する次の記述のうち、最も適切なものはどれか。", "o": ["事業受託方式では、デベロッパーが建設資金を負担する。", "等価交換方式では、土地所有者は建設資金を負担せずに建物の一部を取得できる。", "建設協力金方式では、建物はテナントの所有となる。", "定期借地権方式では、土地所有者が建物の建設資金を負担する。"], "a": 1, "e": "正解は「等価交換方式では、土地所有者は建設資金を負担せずに建物の一部を取得できる。」です。\n【根拠】等価交換方式は、土地を出資して建物の一部（と土地の一部）を取得します。\n【ひっかけ】事業受託方式は土地所有者が資金を負担、建設協力金方式は建物が土地所有者の所有、定期借地権方式は資金負担なしです。"}, {"id": "mc:f249f103cd", "c": 6, "s": "問題6-1", "st": 2, "q": "相続時精算課税に関する次の記述のうち、最も適切なものはどれか。", "o": ["贈与者は、贈与をした年の1月1日において65歳以上の父母・祖父母である。", "特別控除額の累計額は3,000万円である。", "特別控除額を超える部分の税率は一律20％である。", "一度選択した後でも、翌年以降は暦年課税に戻ることができる。"], "a": 2, "e": "正解は「特別控除額を超える部分の税率は一律20％である。」です。\n【根拠】特別控除額（累計2,500万円）と基礎控除（年110万円）を超える部分には一律20％が課されます。\n【ひっかけ】贈与者は60歳以上、特別控除額は2,500万円、暦年課税には戻れません。"}, {"id": "mc:1cfcdbdab9", "c": 6, "s": "問題6-2", "st": 2, "q": "被相続人の相続人が、配偶者、長男、長女（既に死亡）の子である孫2人の場合、孫1人の法定相続分として正しいものはどれか。", "o": ["4分の1", "6分の1", "8分の1", "12分の1"], "a": 2, "e": "正解は「8分の1」です。\n【根拠】配偶者2分の1、子の分2分の1を長男と長女で4分の1ずつ。長女の4分の1を孫2人で分けるので、孫1人は8分の1です。\n【ひっかけ】代襲相続人は、被代襲者の相続分を均等に分けます。"}, {"id": "mc:d0cf341055", "c": 6, "s": "問題6-2", "st": 2, "q": "遺言に関する次の記述のうち、最も適切なものはどれか。", "o": ["公正証書遺言は、家庭裁判所の検認が必要である。", "秘密証書遺言は、検認が不要である。", "法務局で保管された自筆証書遺言は、検認が不要である。", "遺言は、いったん作成すると撤回できない。"], "a": 2, "e": "正解は「法務局で保管された自筆証書遺言は、検認が不要である。」です。\n【根拠】自筆証書遺言書保管制度を利用した遺言書は、検認が不要です。\n【ひっかけ】公正証書遺言は検認不要、秘密証書遺言は検認が必要、遺言はいつでも撤回できます。"}, {"id": "mc:0c127661ba", "c": 6, "s": "問題6-3", "st": 2, "q": "相続人が配偶者・長男・長女の3人で、長女が相続を放棄した場合、遺産に係る基礎控除額として正しいものはどれか。", "o": ["4,200万円", "4,800万円", "5,400万円", "6,000万円"], "a": 1, "e": "正解は「4,800万円」です。\n【根拠】相続を放棄した者も法定相続人の数に含めるため、3,000万円＋600万円×3人＝4,800万円です。\n【ひっかけ】放棄した長女を除いて2人で計算すると4,200万円となり誤りです。"}, {"id": "mc:75d796fa00", "c": 6, "s": "問題6-3", "st": 2, "q": "相続税額の2割加算の対象となる者として、最も適切なものはどれか。", "o": ["被相続人の配偶者", "被相続人の父母", "代襲相続人である被相続人の孫", "被相続人の兄弟姉妹"], "a": 3, "e": "正解は「被相続人の兄弟姉妹」です。\n【根拠】兄弟姉妹は、配偶者・1親等の血族のいずれにも当たらないため、2割加算の対象です。\n【ひっかけ】父母は1親等の血族、代襲相続人の孫は除外されます。"}, {"id": "mc:78e4939856", "c": 6, "s": "問題6-3", "st": 2, "q": "相続税の申告が必要となる場合として、最も適切なものはどれか（いずれも各種特例を適用しなければ課税価格の合計額が基礎控除額を超えるものとする）。", "o": ["小規模宅地等の特例を適用すると課税価格の合計額が基礎控除額以下となる場合", "生命保険金の非課税金額を差し引くと課税価格の合計額が基礎控除額以下となる場合", "死亡退職金の非課税金額を差し引くと課税価格の合計額が基礎控除額以下となる場合", "債務控除により課税価格の合計額が基礎控除額以下となる場合"], "a": 0, "e": "正解は「小規模宅地等の特例を適用すると課税価格の合計額が基礎控除額以下となる場合」です。\n【根拠】小規模宅地等の特例は、申告することが適用の要件です。特例を使って基礎控除以下になる場合も申告が必要です。\n【ひっかけ】非課税金額や債務控除は、申告をしなくても差し引いて計算できます。"}, {"id": "mc:086418b78a", "c": 6, "s": "問題6-4", "st": 2, "q": "自用地評価額1億円、借地権割合60％、借家権割合30％、賃貸割合100％の貸家建付地の評価額として、正しいものはどれか。", "o": ["4,000万円", "7,000万円", "8,200万円", "9,400万円"], "a": 2, "e": "正解は「8,200万円」です。\n【根拠】1億円×（1－0.6×0.3×1.0）＝1億円×0.82＝8,200万円です。\n【ひっかけ】貸宅地として計算すると1億円×（1－0.6）＝4,000万円になります。"}, {"id": "mc:92a9a4cb82", "c": 6, "s": "問題6-4", "st": 2, "q": "小規模宅地等の特例の限度面積と減額割合の組合せとして、最も適切なものはどれか。", "o": ["特定居住用宅地等：330㎡・80％", "特定事業用宅地等：330㎡・80％", "貸付事業用宅地等：200㎡・80％", "特定居住用宅地等：240㎡・50％"], "a": 0, "e": "正解は「特定居住用宅地等：330㎡・80％」です。\n【根拠】特定居住用宅地等は330㎡・80％です。\n【ひっかけ】特定事業用宅地等は400㎡・80％、貸付事業用宅地等は200㎡・50％です。"}, {"id": "mc:5fd1b71547", "c": 6, "s": "問題6-4", "st": 2, "q": "相続税における財産の評価に関する次の記述のうち、最も不適切なものはどれか。", "o": ["自用家屋は、固定資産税評価額×1.0で評価する。", "建築中の家屋は、費用現価の70％で評価する。", "使用貸借により子が借りている親の土地は、貸宅地として評価する。", "取引相場のあるゴルフ会員権は、通常の取引価格の70％で評価する。"], "a": 2, "e": "正解は「使用貸借により子が借りている親の土地は、貸宅地として評価する。」です。\n【根拠】使用貸借で貸している土地は、自用地として評価します。\n【ひっかけ】使用貸借による借地権の価額はゼロだからです。"}, {"id": "mc:d87e58cd9b", "c": 6, "s": "問題6-4", "st": 2, "q": "自用地評価額8,000万円、借地権割合70％の宅地に設定された借地権の相続税評価額として、正しいものはどれか。", "o": ["2,400万円", "4,000万円", "5,600万円", "8,000万円"], "a": 2, "e": "正解は「5,600万円」です。\n【根拠】借地権＝自用地評価額×借地権割合＝8,000万円×70％＝5,600万円です。\n【ひっかけ】貸宅地（底地）なら8,000万円×（1－70％）＝2,400万円です。"}, {"id": "mc:cd2db1ad47", "c": 6, "s": "問題6-6", "st": 2, "q": "成年後見制度に関する次の記述のうち、最も不適切なものはどれか。", "o": ["法定後見制度には、後見・保佐・補助の3類型がある。", "任意後見契約は、公正証書によって締結する。", "任意後見契約は、契約を締結した時点で効力が生じる。", "成年後見人が成年被後見人の居住用不動産を売却するには、家庭裁判所の許可が必要である。"], "a": 2, "e": "正解は「任意後見契約は、契約を締結した時点で効力が生じる。」です。\n【根拠】任意後見契約は、家庭裁判所が任意後見監督人を選任した時から効力が生じます。\n【ひっかけ】判断能力があるうちに契約し、低下した後に効力が生じる仕組みです。"}, {"id": "mc:dfdd6f29f8", "c": 6, "s": "問題6-6", "st": 2, "q": "遺産分割に関する次の記述のうち、最も適切なものはどれか。", "o": ["代償分割で代償金を受け取った相続人の課税価格には、代償金は加算されない。", "被相続人は、遺言で相続開始から5年を超えない期間、遺産の分割を禁止できる。", "換価分割は、特定の相続人が財産を取得し、他の相続人に金銭を支払う方法である。", "遺産分割協議は、相続人の過半数の合意で成立する。"], "a": 1, "e": "正解は「被相続人は、遺言で相続開始から5年を超えない期間、遺産の分割を禁止できる。」です。\n【根拠】遺言による分割の禁止は、5年を超えない期間に限られます。\n【ひっかけ】代償金は受け取った者の課税価格に加算します。財産を取得して他の相続人に金銭を払うのは代償分割で、換価分割は財産を売って代金を分ける方法です。分割協議は相続人全員の合意が必要です。"}]};

function bkOpen(){ return new Promise((res,rej)=>{ try{ if(!window.indexedDB) return rej(new Error("noidb")); const r=indexedDB.open(BK_DB,1);
  r.onupgradeneeded=()=>{ const db=r.result; if(!db.objectStoreNames.contains("snaps")) db.createObjectStore("snaps",{keyPath:"id"}); };
  r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error||new Error("idb")); r.onblocked=()=>rej(new Error("blocked")); }catch(e){ rej(e); } }); }
function bkPut(rec){ return bkOpen().then(db=>new Promise((res,rej)=>{ const tx=db.transaction("snaps","readwrite"); tx.objectStore("snaps").put(rec); tx.oncomplete=()=>{db.close();res(true);}; tx.onerror=()=>{db.close();rej(tx.error);}; tx.onabort=()=>{db.close();rej(tx.error);}; })); }
function bkAll(){ return bkOpen().then(db=>new Promise((res,rej)=>{ const tx=db.transaction("snaps","readonly"); const rq=tx.objectStore("snaps").getAll(); rq.onsuccess=()=>{db.close();res(rq.result||[]);}; rq.onerror=()=>{db.close();rej(rq.error);}; })); }
function bkDel(ids){ if(!ids.length) return Promise.resolve(); return bkOpen().then(db=>new Promise(res=>{ const tx=db.transaction("snaps","readwrite"); const st=tx.objectStore("snaps"); ids.forEach(id=>st.delete(id)); tx.oncomplete=()=>{db.close();res();}; tx.onerror=()=>{db.close();res();}; })); }

function migrateMap(obj){
  const out={};
  for(const k in obj||{}){
    const nk=BYID[k]?k:(MIG[k]||null);
    if(!nk||!BYID[nk]) continue;
    if(!out[nk]) out[nk]=obj[k];
  }
  return out;
}
function upgradeAnswered(a){

    const r=a[id];
    if(r.box===undefined){
      if(r.r==="ng"){r.box=0;r.due=(r.at||Date.now())+DAY;}
      else {r.box=3;r.due=(r.at||Date.now())+30*DAY;}
    }
  }

}
function loadInto(s,isImport){
  const out={};
  // 前回この版で読めずに取っておいた記録（orphans）も、今の版で読めるようになっていれば戻す
  const po=(s.orphans&&typeof s.orphans==="object")?s.orphans:{};
  s=Object.assign({},s); out.orphans={};
  for(const k in ORPH_KEYS){ const src=Object.assign({},po[k]||{},s[k]||{}); s[k]=src; const o={};
    for(const id in src){ const nk=BYID[id]?id:(MIG[id]||null); if(!nk||!BYID[nk]) o[id]=src[id]; } out.orphans[k]=o; }
  out.notes=migrateMap(s.notes);
  out.daily=s.daily||{};
  out.memo=migrateMap(s.memo);
  out.rounds=s.rounds||{};
  // 以前の「覚えた」記録は、その規定の1回目として引き継ぐ
  for(const id in out.memo){ const q=BYID[id]; if(q&&q.pid&&!(out.rounds[q.pid]||[]).length) out.rounds[q.pid]=[out.memo[id].at]; }
  out.answered=upgradeAnswered(migrateMap(s.answered));
  // 読み込み時は、一度きりのリセット判定を通さない（書き出しに missReset がない
  // 古いテキストでも、間違いの記録をそのまま引き継ぐため）
  out.mistakes=(isImport||(s.missReset||0)>=MISS_RESET)?migrateMap(s.mistakes):{};
  out.settingsAt=s.settingsAt||0;
  out.settings=Object.assign({...DEFAULT_SETTINGS},s.settings||{}); if(![60,80,95].includes(out.settings.pass)) out.settings.pass=80; if(s.clozeLevel&&!(s.settings&&s.settings.clozeLevel)) out.settings.clozeLevel=s.clozeLevel;
  out.dd=(s.dd&&typeof s.dd==="object")?s.dd:{[(isImport?"imp-"+(s.at||"x"):"old-"+DEV)]:{...(s.daily||{})}};
  out.daily=sumDD(out.dd);
  return out;
}

/* ───────── 記録（間隔を空けた復習） ───────── */
function todayKey(t){const d=new Date(t||Date.now());return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function schedule(id,ok){
  const now=Date.now(), a=store.answered[id];
  const tk=todayKey(now); store.dd=store.dd||{}; const md=store.dd[DEV]=store.dd[DEV]||{}; md[tk]=(md[tk]||0)+1; store.daily=sumDD(store.dd);
  let box;
  if(!ok) box=0;
  else if(!a) box=3;
  else if(a.box>=3 && a.r==="ok") box=4;
  else box=Math.min((a.r==="ng"?0:a.box)+1,3);
  store.answered[id]={r:ok?"ok":"ng",at:now,box,due:box>=4?null:now+(SRS[setting("srs")]||SRS.std)[box]*DAY};
  state.keep.add(id);
}
function isDue(a){return !!(a&&a.due&&a.due<=Date.now());}
function miss(id,detail){schedule(id,false); const m=Object.assign({n:0},store.mistakes[id]||{}); m.n=(m.n||0)+1; m.last=Date.now(); m.resolved=false; m.prev=Object.assign({at:m.last},detail||{}); store.mistakes[id]=m; persist(); counts();}
// 暗記の進捗は「テキストの記録」から数える（規定ごとに1回目の記録があれば暗記済み）
const clozePids=()=>Object.keys(PT);
const pidDone=(p,n)=>((store.rounds||{})[p]||[]).length>=(n||1);
// 間違いを「解決済み」にする。表示中の行はすぐ消し、その後で一覧を描き直す（途中で表示の更新に失敗しても記録は残す）
// 画面下に短いお知らせを出す（操作が受け付けられたか分かるように）
function toast(msg){ let t=document.getElementById("toast"); if(!t){ t=document.createElement("div"); t.id="toast"; t.setAttribute("role","status"); document.body.appendChild(t); }
  t.textContent=msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),3500); }
function resolveMistake(id,rowEl,noRender){
  let mm=store.mistakes[id];
  if(!mm){ const q=byId(id); const k=Object.keys(store.mistakes).find(x=>byId(x)===q); if(k) mm=store.mistakes[k]; }
  if(!mm){ toast("この問題の間違いの記録が見つかりませんでした"); return; }
  mm=Object.assign({},mm,{resolved:true,last:Date.now()});
  const key=store.mistakes[id]?id:Object.keys(store.mistakes).find(x=>byId(x)===byId(id));
  store.mistakes[key]=mm;
  if(rowEl&&rowEl.parentNode) rowEl.remove();
  const qq=byId(id); toast("解決済みにしました"+(qq?"（"+qq.s+"）":""));
  try{ persist(); }catch(e){}
  try{ counts(); }catch(e){ toast("表示の更新でエラー："+e.message); }
  if(noRender) return;
  try{ const y=window.scrollY; render(); window.scrollTo(0,y); }catch(e){ toast("表示の更新でエラー："+e.message); }
}
function unresolveMistake(id){
  const key=store.mistakes[id]?id:Object.keys(store.mistakes).find(x=>byId(x)===byId(id)); if(!key) return;
  store.mistakes[key]=Object.assign({},store.mistakes[key],{resolved:false,last:Date.now()});
  const qq=byId(id); toast("未解決に戻しました"+(qq?"（"+qq.s+"）":""));
  try{ persist(); }catch(e){} try{ counts(); }catch(e){}
  try{ const y=window.scrollY; render(); window.scrollTo(0,y); }catch(e){ toast("表示の更新でエラー："+e.message); }
}
function hit(id){schedule(id,true); const m=store.mistakes[id]; if(m && !m.resolved){store.mistakes[id]=Object.assign({},m,{resolved:true,last:Date.now()});} persist(); counts();}

const state={speakingId:null,speakingPid:null,mode:"cloze", ch:0, star:0, query:"", sec:"", barOpen:false, nav:"home", setTab:0, progTab:0, order:{}, ans:{}, missFilter:"open", missMode:"dict", resetArmed:false, armed:"", review:null, noteReview:null, allOpen:false, keep:new Set(), showAnswered:false, ansResetArmed:false};

const esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const fmtDay=t=>{const d=new Date(t);return `${d.getMonth()+1}/${d.getDate()}(${"日月火水木金土"[d.getDay()]})`;};
const fmtDate=t=>{const d=new Date(t);return (d.getMonth()+1)+"/"+d.getDate();};

function preview(q){

  if(isWrite(q)) return q.title;
  return q.q;
}
const DEF_CH=10; // 暗記だけの「用語の意義」まとめ
const isDef=q=>q.mode==="cloze"&&/意義/.test(q.title||"");
const inChK=(q,k)=>k===0||(k===DEF_CH?isDef(q):q.c===k);
const inCh=q=>inChK(q,state.ch);
const inStar=q=>state.star===0||q.st===state.star;
const inSec=q=>!state.sec||(q.mode==="sog"?q.rank===state.sec:secOf(q)===state.sec);
const inScope=q=>inCh(q)&&inStar(q)&&inSec(q);
// 記述は、回答済みもいつも出す（書いて覚える形式のため）
function visibleInList(q){if(q.mode==="cloze"||isWrite(q)) return true; const a=store.answered[q.id]; return state.showAnswered||!a||isDue(a);}

/* ───────── 検索 ───────── */
function searchHits(ignoreCh){
  const raw=state.query.trim(); if(!raw) return [];
  const inScope=q=>(ignoreCh||inCh(q))&&inStar(q);
  const pm=raw.match(/^問題\s*(\d)\s*[-－ー―]\s*(\d+)$/);
  const all=QMODES.flatMap(m=>DATA[m]);
  if(pm){const pid=pm[1]+"-"+pm[2]; return all.filter(q=>q.pid===pid&&inScope(q));}
  const words=raw.split(/[\s　]+/).filter(Boolean);
  return all.filter(q=>{
    if(!inScope(q)) return false;
    const hay=[q.s,q.t,q.q,q.e,q.title,q.text,(q.o||[]).join(" ")].filter(Boolean).join(" ").replace(/\[\[|\]\]/g,"");
    return words.every(w=>hay.includes(w));
  });
}
function setQuery(v){state.query=v; const inp=$("#q-search"); if(inp.value!==v) inp.value=v; $("#q-clear").hidden=!v; renderChips(); render(); window.scrollTo({top:0});}

/* ───────── 章・重要度チップ ───────── */
function poolForChips(){
  if(QMODES.includes(state.mode)) return DATA[state.mode].filter(q=>inStar(q)&&visibleInList(q));
  if(state.mode==="miss") return Object.keys(store.mistakes).filter(id=>{const q=byId(id);return q&&inStar(q)&&q.mode===state.missMode&&(state.missFilter==="all"||!store.mistakes[id].resolved);}).map(byId);
  if(state.mode==="notes") return Object.keys(store.notes).filter(byId).map(byId).filter(inStar);
  return QMODES.flatMap(m=>DATA[m]).filter(inStar);
}
function renderChips(){

  [...Object.entries(state.query?CH:chMap(state.mode)).map(([k,v])=>[+k,v]),...((state.mode==="cloze"&&!state.query&&DATA.cloze.some(isDef))?[[DEF_CH,"用語の意義"]]:[])].forEach(([k,label])=>{

/* ───────── 目次（問題番号での絞り込み） ─────────
   「目次」を押すと 5-1・5-2… の並びが出て、タブのように押して切り替えられる */
function secOf(q){ const m=/(\d+)-(\d+)/.exec(q.s||""); return m?m[1]+"-"+m[2]:""; }
function secKeys(){
  if(state.mode==="sog"){ const c={}; DATA.sog.filter(q=>inCh(q)).forEach(q=>{ if(q.rank) c[q.rank]=(c[q.rank]||0)+1; }); return ["A","B","C"].filter(r=>c[r]).map(r=>[r,c[r]]); }
  const seen=new Map();
  (DATA[state.mode]||[]).filter(q=>inCh(q)&&inStar(q)).forEach(q=>{
    const k=secOf(q); if(!k) return; seen.set(k,(seen.get(k)||0)+1);
  });
  return [...seen.entries()].sort((a,b)=>{
    const [c1,s1]=a[0].split("-").map(Number), [c2,s2]=b[0].split("-").map(Number);
    return c1-c2||s1-s2;
  });
}
function renderSecs(){
  const box=$("#secs"); if(!box) return;
  // 章を選んだときだけ、その章の問題番号を出す（「すべて」のときは出さない）
  const on=state.nav==="list"&&QMODES.includes(state.mode)&&!state.query&&state.ch!==0;
  box.hidden=!on; box.innerHTML="";
  if(!on) return;
  const ks=secKeys();
  if(!ks.length){ box.hidden=true; return; }
  let sel=null;
  ks.forEach(([k])=>{
    const b=document.createElement("button");
    b.className="chip sec"; b.textContent=state.mode==="sog"?k+"ランク":k;
    b.setAttribute("aria-pressed",state.sec===k);
    if(state.sec===k) sel=b;
    // 選んである番号をもう一度押すと、章の全部に戻る（暗記は規定ごとに見るので、戻さない）
    b.onclick=()=>{ state.sec=(state.sec===k&&state.mode!=="cloze"?"":k); renderChips(); render(); window.scrollTo({top:0}); };
    box.appendChild(b);
  });
  if(sel) sel.scrollIntoView({inline:"center",block:"nearest"});
}

function shuffle(m){const a=state.order[m];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}}
function dueCount(m){return DATA[m].filter(q=>isDue(store.answered[q.id])).length;}

/* 一覧は画面に入ったぶんだけ順に描く（入力欄が一度に増えると打鍵が重くなるため） */
let lazyIO=null;
function lazyList(list,items,make,tailHtml){
  if(lazyIO){lazyIO.disconnect();lazyIO=null;}
  const BATCH=12; let i=0;
  const mark=document.createElement("div"); mark.className="lazymark"; list.appendChild(mark);
  function flush(){
    const frag=document.createDocumentFragment();
    for(let k=0;k<BATCH&&i<items.length;k++,i++) frag.appendChild(make(items[i],i));
    list.insertBefore(frag,mark);
    if(i>=items.length){
      if(lazyIO){lazyIO.disconnect();lazyIO=null;}
      if(tailHtml) mark.insertAdjacentHTML("beforebegin",tailHtml);
      mark.remove();
    }
  }
  function pump(){
    flush();
    if(i<items.length) requestAnimationFrame(()=>{
      if(mark.isConnected&&mark.getBoundingClientRect().top<innerHeight+800) pump();
    });
  }
  pump();
  if(i<items.length){
    lazyIO=new IntersectionObserver(es=>{if(es.some(e=>e.isIntersecting)) pump();},{rootMargin:"800px"});
    lazyIO.observe(mark);
  }
}
function render(){
  const home=state.nav==="home", isList=state.nav==="list";
  const qlist=isList&&QMODES.includes(state.mode);
  $("#back").hidden=home; $("#homebtn").hidden=home; $("#gear").hidden=false;
  $("#chips").hidden=true; $("#stars").hidden=true;
  $("#tools").hidden=!isList;
  const sr=document.querySelector(".searchrow"); if(sr) sr.hidden=!qlist;
  // 検索できない画面では、検索のボタンを出さず、検索欄も閉じておく
  const tg=$("#bartgl"); if(tg){ tg.hidden=!qlist; if(!qlist&&state.barOpen) setBarOpen(false); }
  renderTools();
  const list=$("#list"); list.innerHTML="";
  if(home){ renderHome(list); counts(); return; }
  if(state.nav==="qmenu"){ renderQMenu(list); counts(); return; }
  if(state.nav==="chapters"){ renderChapters(list); counts(); return; }
  if(state.query){
    const hs=searchHits();
    if(!hs.length) list.innerHTML='<p class="empty">該当する問題はありません。語句を短くするか、章・重要度の絞り込みを「すべて」にしてください。</p>';
    lazyList(list,hs.slice(0,80),(q,i)=>card(q,i+1,"s|"),
      hs.length>80?`<p class="empty">ほか ${hs.length-80}問。語句を追加して絞り込んでください。</p>`:"");
  } else if(QMODES.includes(state.mode)){
    const keep=state.keep; state.keep=new Set();
    const all=state.order[state.mode].map(i=>DATA[state.mode][i]).filter(inScope);
    let qs=all.filter(q=>visibleInList(q)||keep.has(q.id));
    qs.forEach(q=>{ if(keep.has(q.id)) state.keep.add(q.id); });
    const due=qs.filter(q=>isDue(store.answered[q.id])&&!keep.has(q.id));
    // 暗記はテキストの順番のまま（復習の問題を先頭に寄せない）
    if(state.mode!=="cloze") qs=due.concat(qs.filter(q=>!due.includes(q)));
    if(!qs.length){list.innerHTML=all.length?'<p class="empty">この範囲の問題はすべて回答済みで、今日の復習もありません。「回答済みも表示」で見直せます。</p>':'<p class="empty">この範囲の問題はありません。</p>';}
    let lastPid=null;
    // 暗記：規定（問題1-1など）ごとに、並んでいる最後の問題の右下へ「暗記完了」ボタンを置く
    state.memLast=new Set();
    if(state.mode==="cloze") qs.forEach((q,i)=>{ if(q.pid&&(!qs[i+1]||qs[i+1].pid!==q.pid)) state.memLast.add(q.id); });
    lazyList(list,qs,(q,i)=>card(q,i+1,""));
  } else if(state.mode==="miss"){
    renderMiss(list);
  } else if(state.mode==="notes"){
    renderNotes(list);
  } else if(state.mode==="stats"){
    renderProgress(list);
  } else {
    renderSettings(list);
  }
  counts();
}

function renderStatsTable(wrap){
  const cell=(qs,mode)=>{
    if(mode==="cloze"){ const ps=[...new Set(qs.map(q=>q.pid))].filter(p=>PT[p]);
      // テキストの記録の回転ごとに、記録した規定の数を並べる（記録のある回転まで。なければ1回転目）
      const all=clozePids(), mx=Math.min(5,Math.max(1,...all.map(p=>((store.rounds||{})[p]||[]).length)));
      return `<td>${[...Array(mx)].map((_,i)=>{ const n=ps.filter(p=>pidDone(p,i+1)).length, pct=ps.length?Math.round(n/ps.length*100):0;

  };
  let h=`<div class="st2">章ごとの回答数・正答率</div><div class="tablewrap"><table class="stats"><thead><tr><th>章</th>${["cloze",...REC_MODES].map(m=>`<th>${m==="cloze"?"暗記":MODE_LABEL[m]}</th>`).join("")}</tr></thead><tbody>`;

  h+=`<tr class="total"><th>合計</th>${["cloze",...REC_MODES].map(m=>cell(DATA[m],m)).join("")}</tr></tbody></table></div><p class="legend2">各マス：回答数/問題数、右は直近の正答率。暗記は、テキストの記録で各回転まで記録した規定の数/規定数と、その割合です。帯は済んだ割合です。</p>`;
  wrap.innerHTML=h;
}

  const days=daysToExam();
  const tiles=`<div class="tiles">
    <div class="tile"><span class="tl">今日の回答</span><span class="tv">${today}${goal?`<small>/${goal}問</small>`:"<small>問</small>"}</span>${goal?`<div class="bar2"><span style="width:${Math.min(100,Math.round(today/goal*100))}%"></span></div>`:""}</div>
    <div class="tile"><span class="tl">連続学習</span><span class="tv">${streakDays()}<small>日</small></span></div>
    <div class="tile"><span class="tl">今日の復習</span><span class="tv">${allDue}<small>問</small></span></div>
    <div class="tile"><span class="tl">未解決の間違い</span><span class="tv">${openMiss}<small>問</small></span></div>
    ${days!==null&&days>=0?`<div class="tile"><span class="tl">試験まで</span><span class="tv">${days}<small>日</small></span></div>`:""}
  </div>`;
  const wk=[...Array(14)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-13+i);return {k:todayKey(d),d};});
  const mx=Math.max(1,...wk.map(w=>(store.daily||{})[w.k]||0),goal||0);
  const spark=`<div class="spark" role="img" aria-label="直近14日の回答数">${wk.map(w=>{const v=(store.daily||{})[w.k]||0;return `<div class="sp"><span class="spv" style="height:${Math.round(v/mx*100)}%" title="${w.d.getMonth()+1}/${w.d.getDate()}：${v}問"></span><span class="spd">${w.d.getDate()}</span></div>`;}).join("")}</div>`;
  const stWrap=document.createElement("div"); renderStatsTable(stWrap);
  const secP=sec("学習",tiles+`<div class="st2">直近14日の回答数</div>`+spark+stWrap.innerHTML);
  list.appendChild(secP);
  // 暗記の回転記録（規定ごとに5回転まで）
  const R=store.rounds||(store.rounds={});
  const pids=Object.keys(PT).sort((a,b)=>{const[x1,y1]=a.split("-").map(Number),[x2,y2]=b.split("-").map(Number);return x1-x2||y1-y2;});
  const ROUNDS=5;
  const cnt=n=>pids.filter(p=>(R[p]||[]).length>=n).length;
  const summary=`<div class="rsum">${[1,2,3,4,5].map(n=>`<div class="rs"><span class="tl">${n}回転目</span><span class="tv">${cnt(n)}<small>/${pids.length}</small></span></div>`).join("")}</div>`;
  let rows="";
  const selCh=state.recCh||0;
  const toc=`<div class="chips rtoc">${[[0,"すべて"],...Object.entries(CH).map(([k,v])=>[+k,v])].map(([k,v])=>{
      const ps=pids.filter(p=>k===0||+p.split("-")[0]===k); const dn=ps.filter(p=>(R[p]||[]).length>0).length;
      return `<button class="chip ch" data-rch="${k}" aria-pressed="${selCh===k}"><span class="cn">${k>100?k-100:(k||"")}</span><span class="nm">${v}<span class="ct">${dn}/${ps.length}</span></span></button>`;
    }).join("")}</div>`;
  Object.entries(CH).forEach(([k,v])=>{
    if(selCh&&+k!==selCh) return;
    const ps=pids.filter(p=>+p.split("-")[0]===+k);
    if(!ps.length) return;
    const closed=selCh?false:(setting("recClosed")||[]).includes(+k);
    const dn=ps.filter(p=>(R[p]||[]).length>0).length;
    rows+=`<details class="rgrp" data-ch="${k}"${closed?"":" open"}><summary class="rch"><span class="num">${k}</span>${v}<span class="mc">${dn}/${ps.length}</span></summary>`;
    ps.forEach(p=>{
      const ds=R[p]||[];
      rows+=`<div class="ritem"><div class="rp"><b>${p}</b><span>${esc(PT[p]||"")}</span></div><div class="rslots">${[...Array(ROUNDS)].map((_,i)=>{
        const t=ds[i];
        if(t) return `<button class="rc done${i===ds.length-1?" last":""}" data-p="${p}" data-i="${i}" title="${i===ds.length-1?"押すと取り消します":""}"><span class="ri">${i+1}回目</span>${fmtDay(t)}</button>`;
        if(i===ds.length) return `<button class="rc next" data-p="${p}" data-i="${i}" aria-label="${p}の${i+1}回目を今日の日付で記録"><span class="ri">${i+1}回目</span>＋</button>`;
        return `<span class="rc empty"><span class="ri">${i+1}回目</span></span>`;
      }).join("")}</div></div>`;
    });
    rows+=`</details>`;
  });
  const secR=sec("テキストの記録",`<div class="recbody">${summary}${toc}
    <div class="rlist">${rows}</div></div>`);
  secR.querySelectorAll("[data-rch]").forEach(b=>b.onclick=()=>{ state.recCh=+b.dataset.rch; const y=window.scrollY; render(); window.scrollTo(0,y); });
  secR.querySelectorAll("details.rgrp").forEach(d=>d.addEventListener("toggle",()=>{
    const k=+d.dataset.ch; let c=(setting("recClosed")||[]).filter(x=>x!==k); if(!d.open) c.push(k);
    store.settings=touchSettings({recClosed:c}); persist();
  }));
  // 記録・学習をタブで切り替える
  const PR_TABS=[["記録",secR],["学習",secP]];
  const ptabs=document.createElement("div"); ptabs.className="settabs";
  PR_TABS.forEach(([nm],i)=>{
    const b=document.createElement("button");
    b.className="chip settab"; b.textContent=nm;
    b.setAttribute("aria-pressed",state.progTab===i);
    b.onclick=()=>{ state.progTab=i; render(); window.scrollTo({top:0}); };
    ptabs.appendChild(b);
  });
  list.insertBefore(ptabs,list.firstChild);
  list.insertBefore(secR,secP);
  PR_TABS.forEach(([nm,el],i)=>{ el.hidden=(i!==state.progTab); });
  secR.querySelectorAll("[data-pidspeak]").forEach(b=>b.onclick=()=>{ const p=b.dataset.pidspeak; state.speakingPid===p?stopSpeak():speakPid(p); });
  secR.querySelectorAll(".rc.next").forEach(b=>b.onclick=()=>{ const p=b.dataset.p; R[p]=(R[p]||[]).concat(Date.now()); persist(); counts(); const y=window.scrollY; render(); window.scrollTo(0,y); });
  secR.querySelectorAll(".rc.done.last").forEach(b=>b.onclick=()=>{ const p=b.dataset.p; R[p]=(R[p]||[]).slice(0,-1); persist(); counts(); const y=window.scrollY; render(); window.scrollTo(0,y); });
}

// 画面の色（ライト・ダーク）。「端末に合わせる」ではアプリ側の指定を元に戻す
const HOST_THEME=document.documentElement.getAttribute("data-theme");
function applyTheme(){ const t=setting("theme"), r=document.documentElement;
  if(t==="light"||t==="dark") r.setAttribute("data-theme",t);
  else if(HOST_THEME) r.setAttribute("data-theme",HOST_THEME); else r.removeAttribute("data-theme");
  setThemeColor(); }
/* ライトでもダークでも、画面のいちばん上（時刻や電池が出る帯）を本文と同じ色にする。
   端末はこの指定の色でその帯を塗るので、本文と同じ背景色を入れ直す。
   色が変わったときは、指定を古いものごと消して新しく付け直す（端末に気づかせるため） */
function setThemeColor(){
  const bg=getComputedStyle(document.documentElement).getPropertyValue("--bar-solid").trim()||getComputedStyle(document.body).backgroundColor;
  if(!bg) return;
  const all=document.querySelectorAll('meta[name="theme-color"]');
  if(all.length===1&&!all[0].hasAttribute("media")&&all[0].getAttribute("content")===bg) return;
  all.forEach(m=>m.remove());
  const m=document.createElement("meta"); m.setAttribute("name","theme-color"); m.setAttribute("content",bg); document.head.appendChild(m);
}
if(window.matchMedia){ try{ window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>setTimeout(setThemeColor,0)); }catch(e){} }
function applyFont(){applyTheme();document.body.style.fontSize={s:"14px",m:"15px",l:"17px",xl:"19px"}[setting("font")]||"15px";document.body.style.lineHeight=setting("lh")==="wide"?"2.1":"1.8";}
function setSetting(k,v){store.settings=touchSettings({[k]:v});persist();if(k==="font"||k==="lh"||k==="theme")applyFont(); if(k==="examDate") updateHeader();if(k==="order"){SHUFFLE_MODES.forEach(m=>{if(v==="random")shuffle(m);else state.order[m]=DATA[m].map((_,i)=>i);});}render();}
function renderSettings(list){

  const row=(title,desc,ctrl)=>`<div class="setrow"><div><div class="st">${title}</div><div class="sd">${desc}</div></div>${ctrl}</div>`;
  const danger=(id,label,confirmLabel,desc,btn)=>row(label,desc,state.armed===id
      ?`<div class="seg"><button class="btn" data-cancel="1">やめる</button><button class="btn danger" data-do="${id}">${confirmLabel}</button></div>`
      :`<button class="btn" data-arm="${id}">${btn||label}</button>`);
  const answeredIn=m=>DATA[m].filter(q=>store.answered[q.id]).length;
  const sec=(title,html,desc)=>{const x=document.createElement("section");x.className="summary settings";x.innerHTML=`<h2>${title}</h2>${desc?`<p>${desc}</p>`:""}`+html;return x;};
  const secG=sec("学習目標",

    row("試験日","試験までの残り日数をページ上部と学習に表示します。",`<input type="date" id="set-exam" class="sel" value="${esc(setting("examDate")||"")}">`));
  const secM=sec("暗記・読み上げ",
    ""+

    (TTS_OK?row("読み上げの速さ","1.0倍〜2.0倍の間で選べます。",`<div class="slider"><button class="btn ratebtn" id="set-rate-dn" aria-label="遅くする">−</button><input type="range" id="set-rate" min="1" max="2" step="0.1" value="${Math.min(2,Math.max(1,+setting("rate")||1))}" aria-label="読み上げの速さ"><output id="set-rate-v">${(Math.min(2,Math.max(1,+setting("rate")||1))).toFixed(1)}倍</output><button class="btn ratebtn" id="set-rate-up" aria-label="速くする">＋</button><button class="btn" id="set-rate-try">試しに聞く</button></div>`)+
      row("端末の声の種類","「自動」は、この端末にある日本語の声からいちばん自然なものを選びます。いま使う声："+voiceNowLabel()+"。／もっと自然にするには、端末の「設定」→「アクセシビリティ」→「読み上げコンテンツ」→「声」→「日本語」で、Kyoko か Otoya の「プレミアム」を入れてから、このアプリを開き直してください。",`<select id="set-voice" class="sel"><option value=""${!setting("voice")||setting("voice")==="__auto__"?" selected":""}>自動（いちばん自然な声）</option><option value="__system__"${setting("voice")==="__system__"?" selected":""}>端末の設定どおり</option>${voicesSorted().map(v=>{const q=voiceQ(v);return `<option value="${esc(vid(v))}"${(setting("voice")===vid(v)||setting("voice")===v.name)?" selected":""}>${esc(v.name)}${q.n?"（"+q.n+"）":""}</option>`;}).join("")}</select>`)+
      row("読み上げの連続再生","オンにすると、読み終わったら次の規定を続けて読み上げます。",opt("autoNext",[["off","オフ"],["on","オン"]])):""));
  const secQ=sec("正誤・選択",
    row("正誤・選択の出題順","ランダムにすると、タブを開くたびに並びが変わります。暗記は常にテキスト順です。",opt("order",[["text","テキスト順"],["random","ランダム"]]))+
    row("選択肢の並び","オンにすると、選択問題の選択肢を毎回入れ替えます。位置で覚えてしまうのを防げます。",opt("optShuffle",[["off","固定"],["on","毎回入れ替える"]]))+
    row("回答後の動き","正誤・選択で答えたあと、次の問題へ自動で画面を送ります。",opt("after",[["stay","その場にとどまる"],["okonly","正解なら次へ"],["always","常に次へ"]]))+
    row("復習の間隔","間違えた問題・正解した問題が「復習」として戻ってくるまでの日数です。",opt("srs",[["short","短め 1・2・4・14日"],["std","標準 1・3・7・30日"],["long","長め 2・5・14・60日"]])));
  const secD=sec("表示",
    row("画面の色","「端末に合わせる」は、端末やアプリのライト・ダークの設定に従います。",opt("theme",[["auto","端末に合わせる"],["light","ライト"],["dark","ダーク"]]))+
    row("文字の大きさ","",opt("font",[["s","小"],["m","標準"],["l","大"],["xl","特大"]]))+
    row("行間","",opt("lh",[["std","標準"],["wide","広め"]]))+
    row("重要度（いちご）の表示","いちご2つ（頻出）・いちご1つ（補足）で、各問題の重要度を表示します。",opt("showStar",[["on","表示"],["off","非表示"]]))+
    row("解説動画を開くアプリ","「Brave」は、ホンダさんのYouTube解説をBraveアプリで開きます（広告が表示されません）。Braveが入っていない端末では「通常」を選んでください。",opt("ytApp",[["brave","Brave"],["web","通常"]])));
  const secB=sec("リセット",
    REC_MODES.map(m=>danger("ans-"+m,`${MODE_LABEL[m]}をリセット`,"未回答に戻す",`回答済み ${answeredIn(m)}問 / ${DATA[m].length}問`,"リセット")).join("")+
    danger("ans-all","すべての形式をリセット","全部を未回答に戻す",`回答済み ${REC_MODES.reduce((s,m)=>s+answeredIn(m),0)}問`,"リセット"),
    "回答済みの記録を消して、未回答の状態に戻します。間違いの記録と付箋は残ります。");
  const secC=sec("記録の管理",
    row("記録の書き出し","回答・間違い・付箋・暗記の記録・設定をテキストにしてコピーします。メモ帳などに貼って保管できるほか、オフライン版とclaude.ai版の間で記録を移すときにも使います。",`<button class="btn" id="bk-export">書き出してコピー</button>`)+
    row("記録の読み込み","書き出したテキストを貼り付けて読み込みます。この端末の記録はそのまま残り、読み込んだ記録が足されます（回答数は端末ごとに合計し、同じ問題の回答や付箋は新しい方を残します）。同じテキストを2回読み込んでも二重には数えません。",`<div class="bk"><textarea id="bk-text" rows="2" class="sel" placeholder="ここに貼り付け"></textarea><div class="seg"><button class="btn primary" id="bk-import">読み込む</button></div></div><div class="sd" id="bk-msg"></div>`)+
    row("ファイルに保存・ファイルから読み込む","記録をファイル（.json）として保存します。読み込むと、この端末の記録に合わせます（上の「読み込む」と同じ）。コピーと貼り付けがうまくいかないときにも使えます。",`<div class="seg"><button class="btn" id="bk-file-save">ファイルに保存</button><button class="btn" id="bk-file-open">ファイルから読み込む</button></div><input type="file" id="bk-file" accept=".json,.txt,application/json,text/plain" hidden><div class="sd" id="bk-file-msg"></div>`)+
    row("バックアップから戻す","この端末には、毎日1回と、消す・読み込むなどの操作の直前に、記録の控えが自動で残ります。選んだ時点の記録を、今の記録に合わせて戻します（今の記録は消えません）。",`<div id="bk-snaps" class="bksnaps"><div class="sd">確認しています…</div></div>`)+
    danger("miss","間違いの記録を消す","全て消す",`記録 ${Object.keys(store.mistakes).filter(byId).length}問`,"消す")+
    danger("notes","付箋を全て外す","全て外す",`付箋 ${Object.keys(store.notes).filter(byId).length}枚（メモも消えます）`,"外す"));
  // 設定はタブで切り替える（表示 → 読み上げ → 記述 → 目標 → リセット → 記録）
  const SET_TABS=[["表示",secD],["音声",secM],["出題",secQ],["目標",secG],["リセット",secB],["記録",secC]];
  const tabs=document.createElement("div"); tabs.className="settabs";
  SET_TABS.forEach(([name],i)=>{
    const b=document.createElement("button");
    b.className="chip settab"; b.textContent=name;
    b.setAttribute("aria-pressed",state.setTab===i);
    b.onclick=()=>{ state.setTab=i; render(); window.scrollTo({top:0}); };
    tabs.appendChild(b);
  });
  list.appendChild(tabs);
  // 中身は全部置いたうえで、選んでいないものを隠す（どのタブのボタンも効くようにするため）
  SET_TABS.forEach(([name,el],i)=>{ el.hidden=(i!==state.setTab); list.appendChild(el); });
  const selTab=tabs.children[state.setTab]; if(selTab) selTab.scrollIntoView({inline:"center",block:"nearest"});
  const ex=list.querySelector("#set-exam"); if(ex) ex.onchange=()=>setSetting("examDate",ex.value);

  const fmsg=list.querySelector("#bk-file-msg");
  list.querySelector("#bk-file-save").onclick=()=>{

      // claude.ai 上では、画面の確認を通して保存する（直接のダウンロードは許されないため）
      if(window.claude&&window.claude.use){ fmsg.textContent="保存の確認を表示しています…";
        window.claude.use("downloads").then(dl=>{ if(!dl) throw {code:"unavailable"}; return dl.save({filename:name,data:txt}); })
          .then(()=>{ fmsg.textContent="「"+name+"」を保存しました。"; })
          .catch(e=>{ fmsg.textContent=(e&&e.code==="declined")?"保存を取りやめました。":"ここではファイルに保存できませんでした。上の「書き出してコピー」を使ってください。"; });
        return; }
      const url=URL.createObjectURL(new Blob([txt],{type:"application/json"})); const a=document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000);
      fmsg.textContent="「"+name+"」を保存しました。保存されないときは、上の「書き出してコピー」を使ってください。";
    }catch(e){ fmsg.textContent="ファイルに保存できませんでした。上の「書き出してコピー」を使ってください。"; }
  };
  const fin=list.querySelector("#bk-file");
  list.querySelector("#bk-file-open").onclick=()=>{ fin.value=""; fin.click(); };
  fin.onchange=()=>{ const f=fin.files&&fin.files[0]; if(!f) return;
    const rd=new FileReader(); rd.onload=()=>{ try{ const o=parseBackup(String(rd.result||"")); snapshot("import"); mergeRecords(loadInto(o,true)); persist(); applyFont(); counts(); render();
        const m=document.querySelector("#bk-file-msg"); if(m) m.textContent="この端末の記録に、ファイルの記録を合わせました。"; }
      catch(e){ const m=document.querySelector("#bk-file-msg"); if(m) m.textContent=backupError(e); } };
    rd.onerror=()=>{ fmsg.textContent="ファイルを開けませんでした。"; }; rd.readAsText(f); };
  // ── バックアップから戻す ──
  renderSnaps(list.querySelector("#bk-snaps"));
  list.querySelector("#bk-export").onclick=()=>{
    const txt=JSON.stringify(exportObj());
    const ta=list.querySelector("#bk-text"); ta.value=txt;
    copyText(txt).then(ok=>{ msg.textContent=ok?"コピーしました。もう一方の端末の「記録の読み込み」に貼り付けて「読み込む」を押してください。":"自動でコピーできませんでした。上の欄を長押しして「すべてを選択」→「コピー」してください。"; if(!ok){ ta.focus(); ta.setSelectionRange(0,txt.length); } });
  };
  const imp=list.querySelector("#bk-import"); if(imp) imp.onclick=()=>{ const v=list.querySelector("#bk-text").value.trim(); if(!v){msg.textContent="書き出したテキストを貼り付けてから押してください。";return;}
    try{ const o=parseBackup(v); snapshot("import");
      mergeRecords(loadInto(o,true)); persist(); applyFont(); counts(); state.armed=""; state.importText=""; render();
      const m=document.querySelector("#bk-msg"); if(m) m.textContent="この端末の記録に、読み込んだ記録を合わせました。";
    }catch(e){ msg.textContent=backupError(e); }
  };
  const bc=list.querySelector("#bk-cancel"); if(bc) bc.onclick=()=>{ state.armed=""; state.importText=""; render(); const m=document.querySelector("#bk-msg"); if(m) m.textContent="読み込みを取りやめました。"; };
  list.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{const k=b.dataset.k,v=b.dataset.v;setSetting(k,/^\d+(\.\d+)?$/.test(v)?+v:v);});
  const rs=list.querySelector("#set-rate");
  if(rs){
    rs.oninput=()=>{list.querySelector("#set-rate-v").textContent=(+rs.value).toFixed(1)+"倍";};
    rs.onchange=()=>{store.settings=touchSettings({rate:+rs.value});persist();};
    const step=d=>{const v=Math.round(Math.min(2,Math.max(1,+rs.value+d))*10)/10;rs.value=v;rs.oninput();rs.onchange();};
    list.querySelector("#set-rate-dn").onclick=()=>step(-0.1);
    list.querySelector("#set-rate-up").onclick=()=>step(0.1);
    const tb=list.querySelector("#set-rate-try"); if(sampling) setTryBtn(true); tb.onclick=()=>{store.settings=touchSettings({rate:+rs.value});persist();sampleSpeak(true);};
  }
  const vs=list.querySelector("#set-voice");
  if(vs) vs.onchange=()=>{store.settings=touchSettings({voice:vs.value});persist();pickVoice();sampleSpeak();};
  list.querySelectorAll("[data-arm]").forEach(b=>b.onclick=()=>{state.armed=b.dataset.arm;render();});
  list.querySelectorAll("[data-cancel]").forEach(b=>b.onclick=()=>{state.armed="";render();});
  list.querySelectorAll("[data-do]").forEach(b=>b.onclick=()=>{
    const id=b.dataset.do; snapshot("del-"+id);
    if(id.startsWith("ans-")){
      const ms=id==="ans-all"?REC_MODES:[id.slice(4)];
      ms.forEach(m=>{DATA[m].forEach(q=>{delete store.answered[q.id];Object.keys(state.ans).filter(k=>k.endsWith(q.id)).forEach(k=>delete state.ans[k]);});state.order[m]=DATA[m].map((_,i)=>i);if(setting("order")==="random"&&SHUFFLE_MODES.includes(m))shuffle(m);});
    } else if(id==="miss") store.mistakes={};
    else if(id==="notes") store.notes={};
    state.armed=""; state.keep=new Set(); persist(); render();
  });
}

/* ───────── バックアップ一覧 ───────── */
const SNAP_REASON={day:"毎日の控え",import:"読み込みの直前","del-miss":"間違いの記録を消す直前","del-notes":"付箋を外す直前",restore:"戻す直前",savefail:"保存できなかったとき",rescue:"読めなかった保存データ"};
function snapLabel(r){ if(SNAP_REASON[r]) return SNAP_REASON[r]; if(/^del-ans-/.test(r)) return "回答の記録を消す直前"; return "控え"; }
function fmtAt(t){ const d=new Date(t); return (d.getMonth()+1)+"/"+d.getDate()+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }
function snapCounts(o){ const n=x=>Object.keys(x||{}).length; return "回答 "+n(o.answered)+"・間違い "+n(o.mistakes)+"・付箋 "+n(o.notes); }
function restoreFrom(o,box){ snapshot("restore"); mergeRecords(loadInto(o,true)); persist(); applyFont(); counts(); render(); toast("選んだ時点の記録を、今の記録に合わせました。"); }
function renderSnaps(box){
  if(!box) return;
  const items=[];
  rescueKeys().forEach(k=>{ let raw=""; try{ raw=localStorage.getItem(k)||""; }catch(e){} items.push({id:k,kind:"rescue",reason:"rescue",at:+k.split("-rescue-")[1]||0,data:raw,ls:true}); });
  const draw=list=>{
    box.innerHTML="";
    if(LOAD_RESCUE){ const w=document.createElement("div"); w.className="sd bkwarn"; w.textContent="起動時に保存データの一部を読めなかったため、元のデータを消さずに退避しました。下の「読めなかった保存データ」から、テキストとしてコピーできます。"; box.appendChild(w); }
    if(!list.length){ const p=document.createElement("div"); p.className="sd"; p.textContent="まだ控えはありません（明日以降、または消す・読み込む操作をすると残ります）。"; box.appendChild(p); return; }
    list.sort((a,b)=>b.at-a.at).forEach(r=>{
      let o=null; try{ o=JSON.parse(r.data); if(o&&o.app!=="fp2-gakka") o=null; }catch(e){ o=null; }
      const el=document.createElement("div"); el.className="bksnap";
      const t=document.createElement("div"); t.className="bkst"; t.textContent=fmtAt(r.at)+"　"+snapLabel(r.reason);
      const c=document.createElement("div"); c.className="sd"; c.textContent=o?snapCounts(o):"このアプリでは読めない形のため、テキストとしてコピーできます";
      const b=document.createElement("button"); b.className="btn";
      if(o){ b.textContent="戻す"; b.onclick=()=>restoreFrom(o,box); }
      else { b.textContent="コピー"; b.onclick=()=>copyText(r.data).then(ok=>toast(ok?"コピーしました。メモ帳などに貼って保管してください。":"コピーできませんでした。")); }
      el.append(t,c,b); box.appendChild(el);
    });
  };
  bkAll().then(all=>draw(items.concat(all))).catch(()=>{ draw(items); const p=document.createElement("div"); p.className="sd"; p.textContent="この環境では自動の控えを残せません。「ファイルに保存」か「書き出してコピー」で控えを残してください。"; box.appendChild(p); });
}
/* ───────── 間違い ───────── */
function missIds(mode){
  return Object.keys(store.mistakes).filter(id=>{const q=byId(id);return q&&q.mode===(mode||state.missMode)&&inScope(q)&&(state.missFilter==="all"||!store.mistakes[id].resolved);})
    .sort((a,b)=>(store.mistakes[b].n-store.mistakes[a].n)||(store.mistakes[b].last-store.mistakes[a].last));
}
function startReview(){
  const ids=missIds(); if(!ids.length) return;
  ids.forEach(id=>delete state.ans["r|"+id]);
  state.review=ids; render(); window.scrollTo({top:0});
}
function renderMiss(list){
  if(state.review){
    state.review.forEach((id,n)=>{const q=byId(id); if(q) list.appendChild(card(q,n+1,"r|"));});
    return;
  }
  const tabs=document.createElement("div"); tabs.className="subtabs"; tabs.setAttribute("role","tablist");
  REC_MODES.forEach(m=>{
    const b=document.createElement("button"); b.className="subtab"; b.id="mt-"+m; b.setAttribute("role","tab");
    b.setAttribute("aria-selected",state.missMode===m);
    b.innerHTML=`${MODE_LABEL[m]}<small>${missIds(m).length}問</small>`;
    b.onclick=()=>{state.missMode=m;renderChips();render();};
    tabs.appendChild(b);
  });
  list.appendChild(tabs);
  const ids=missIds();
  const sum=document.createElement("section"); sum.className="summary";
  sum.innerHTML=`<h2>間違えた問題</h2><p>選択・正誤で不正解またはスキップ、記述でキーワードが合格ラインに届かなかったときに自動で記録します。問題を開くと「前回の間違いを見る」で直前の間違い箇所を確認できます。「開いて解き直す」で問題を解き直せます。正解するか「解決（復習から外す）」を押すと、一覧から外れて「解決済み」になります。</p>`;
  list.appendChild(sum);
  if(!ids.length){list.insertAdjacentHTML("beforeend",`<p class="empty">${MODE_LABEL[state.missMode]}の${state.missFilter==="open"?"未解決の問題はありません。":"記録はまだありません。"}</p>`);return;}
  ids.forEach(id=>{
    const q=byId(id), m=store.mistakes[id];
    const d=document.createElement("details"); d.className="item";
    if(store.notes[id]){d.classList.add("tagged");d.style.setProperty("--tagc","var(--tag-y)");}
    d.innerHTML=`<summary><span class="meta"><span class="badge">${MODE_LABEL[q.mode]}</span><span class="badge ${m.resolved?"done":"miss"}">${m.resolved?"解決済み":"間違い "+m.n+"回"}</span>${q.mode==="kob"||q.mode==="sog"?"":`<span class="stb">${starLabel(q.st)}</span>`}<span>${chName(q.c)} ・ ${esc(q.s)}</span><span>最終 ${fmtDate(m.last)}</span></span><span class="preview">${esc(preview(q))}</span><span class="opener"><span class="oc">▶</span><span class="ol">開いて解き直す</span></span></summary>`;
    d.addEventListener("toggle",()=>{ const ol=d.querySelector(".ol"); if(ol) ol.textContent=d.open?"閉じる":"開いて解き直す"; if(d.open && !d.querySelector(".q")){ delete state.ans["r|"+id]; d.appendChild(card(q,"","r|")); } });
    // 「解決」ボタンは開閉部分（summary）の外に置く（端末によっては summary 内のボタンが反応しないため）
    const w=document.createElement("div"); w.className="mwrap"; w.dataset.id=id; w.appendChild(d);
    if(!m.resolved){
      // 「解決」ボタンは行の下に独立して置く（重ね置きをやめ、iPhone でも確実に押せるように）
      const ft=document.createElement("div"); ft.className="mfoot";
      const rb=document.createElement("button"); rb.type="button"; rb.className="btn resolvebtn"; rb.textContent="解決（復習から外す）";
      let fired=false; const go=e=>{ e.preventDefault(); e.stopPropagation(); if(fired) return; fired=true; resolveMistake(id, state.missFilter!=="all"?w:null); };
      rb.addEventListener("touchend",go,{passive:false}); rb.addEventListener("click",go);
      ft.appendChild(rb); w.appendChild(ft);
    } else {
      // 解決済みの問題は「未解決に戻す」で復習の一覧に戻せる
      const ft=document.createElement("div"); ft.className="mfoot";
      const ub=document.createElement("button"); ub.type="button"; ub.className="btn unresolvebtn"; ub.textContent="未解決に戻す";
      let fired=false; const go=e=>{ e.preventDefault(); e.stopPropagation(); if(fired) return; fired=true; unresolveMistake(id); };
      ub.addEventListener("touchend",go,{passive:false}); ub.addEventListener("click",go);
      ft.appendChild(ub); w.appendChild(ft);
    }
    list.appendChild(w);
  });
}

function applyTag(el,id){
  const n=store.notes[id];
  el.classList.toggle("tagged",!!n);
  if(n){el.style.setProperty("--tagc","var(--tag-y)");el.style.setProperty("--tagsoft","var(--tag-y-soft)");}
  else{el.style.removeProperty("--tagc");el.style.removeProperty("--tagsoft");}
  const band=el.querySelector(".noteband"); band.textContent=n?n.memo||"":"";
  const pin=el.querySelector(".tagbtn"); pin.classList.toggle("on",!!n); pin.setAttribute("aria-pressed",!!n);
  pin.setAttribute("aria-label",n?"付箋を外す":"付箋を貼る");
  pin.title=n?"付箋あり（押すと外れます）":"付箋を貼る";
  const mb=el.querySelector(".memobtn"); mb.hidden=!n; const ml=n&&n.memo?"メモを編集":"メモを書く"; mb.setAttribute("aria-label",ml); mb.title=ml; mb.classList.toggle("has",!!(n&&n.memo));
}
function afterNoteChange(id){persist();syncTags(id);counts();if(state.mode==="notes"&&!state.noteReview&&!state.query){renderChips();render();}}
function togglePin(el,id){
  const n=store.notes[id];
  if(!n){store.notes[id]={memo:"",at:Date.now()};afterNoteChange(id);return;}
  delete store.notes[id]; const ed=el.querySelector(".editor"); if(ed) ed.remove(); afterNoteChange(id);
}
function openEditor(el,id){
  let ed=el.querySelector(".editor");

  const n=store.notes[id]; if(!n) return;
  ed=document.createElement("div"); ed.className="editor";
  const tid="memo-"+id.replace(":","-")+(el.dataset.ctx?"-"+el.dataset.ctx[0]:"");
  ed.innerHTML=`<textarea id="${tid}" rows="2" placeholder="備考（任意）">${esc(n.memo||"")}</textarea>
    <div class="row"><button class="btn" data-act="del">付箋を外す</button><button class="btn" data-act="cancel">閉じる</button><button class="btn primary" data-act="save">メモを保存</button></div>`;
  ed.querySelector('[data-act="cancel"]').onclick=()=>ed.remove();
  ed.querySelector('[data-act="save"]').onclick=()=>{if(!store.notes[id])return;store.notes[id].memo=ed.querySelector("textarea").value.trim();ed.remove();afterNoteChange(id);};

function syncTags(id){document.querySelectorAll(`.q[data-id="${id}"]`).forEach(el=>{

/* 暗記：規定（問題1-1など）の最後のカードの下に、テキストの「要旨」「内容解説」などを出す。PNOTES[pid]=[[見出し,[ブロック]],...] */
function pnoteBox(q){
  const n=q.pid&&PNOTES[q.pid]; if(!n) return "";
  const same=DATA.cloze.filter(c=>c.pid===q.pid); if(!same.length||same[same.length-1].id!==q.id) return "";
  const tx=t=>esc(String(t)).replace(/\{\{(.+?)\|(.+?)\}\}/g,'<span class="pn-frac"><span>$1</span><span>$2</span></span>').replace(/\[\[(.+?)\]\]/g,(m,x)=>`<span class="pn-box${x.length<=10?" pn-nw":""}">${x}</span>`).replace(/\n/g,"<br>");
  const cell=c=>{ if(c===null) return ""; const o=typeof c==="object"?c:{t:c}; const tag=o.h?"th":"td";
    const at=`${o.c?` colspan="${o.c}"`:""}${o.r?` rowspan="${o.r}"`:""}`;
    if(o.d) return `<${tag}${at} class="pn-diag"><span class="pn-dtr">${tx(o.d[0])}</span><span class="pn-dbl">${tx(o.d[1])}</span></${tag}>`;
    return `<${tag}${at}>${tx(o.t)}</${tag}>`; };
  const blk=b=>{const [k,a]=b;
    if(k==="p") return `<p>${tx(a)}</p>`;
    if(k==="h") return `<h5>${tx(a)}</h5>`;
    if(k==="note") return `<p class="pn-note">${tx(a)}</p>`;
    if(k==="list") return `<ul class="pn-list">${a.map(x=>`<li>${tx(x)}</li>`).join("")}</ul>`;
    if(k==="terms") return `<dl class="pn-terms">${a.map(([t,d])=>`<dt>${tx(t)}</dt><dd>${tx(d)}</dd>`).join("")}</dl>`;
    if(k==="grid") return `<div class="pn-tw"><table class="pn-t">${a.map(r=>`<tr>${r.map(cell).join("")}</tr>`).join("")}</table></div>`;
    if(k==="flow") return `<ol class="pn-flow">${a.map(x=>`<li>${tx(x)}</li>`).join("")}</ol>`;
    if(k==="time") return `<div class="pn-time" style="--n:${a.length}"><div class="pn-line"></div>${a.map(([l,d])=>`<div class="pn-pt"><span class="pn-dot"></span><b>${tx(l)}</b>${d?`<small>${tx(d)}</small>`:""}</div>`).join("")}</div>`;
    if(k==="qa") return `<div class="pn-qa">${a.map(([x,y])=>`<div class="pn-q"><b>問</b><span>${tx(x)}</span></div><div class="pn-a"><b>答</b><span>${tx(y)}</span></div>`).join("")}</div>`;
    return "";};
  return `<details class="pnote"><summary>問題${esc(q.pid)} の解説</summary><div class="pn-b">${n.map(([h,bs])=>`<section class="pn-sec"><h4>${esc(h)}</h4>${bs.map(blk).join("")}</section>`).join("")}</div></details>`;
}
function relBox(q){
  if(setting("showRel")!=="on") return "";
  const rel=(REL[q.pid]||[]);

  return `<div class="rel"><span class="rl">あわせて出題</span>${rel.map(p=>`<button class="relbtn" data-pid="${p}">問題${p} ${esc(PT[p]||"")}</button>`).join("")}</div>`;

function hondaPick(q){ const txt=(q.q||"")+(q.title||"")+(q.t||"")+(q.o||[]).join("");
  for(const r of (HRULE[q.pid]||[])){ if(r[0]===null||new RegExp(r[0]).test(txt)) return r[1]?{code:r[1],id:HVID[r[1]],t:r[2]||0}:null; }
  return null; }
const fmtT=s=>Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
function ytUrl(q){ const h=hondaPick(q);
  return h ? `https://www.youtube.com/watch?v=${h.id}${h.t?`&t=${h.t}s`:""}` : YT_CH+"/search?query="+encodeURIComponent(ytKw(q)); }
function ytBox(q){ if(!q.pid||!PT[q.pid]) return ""; const h=hondaPick(q);
  const lab=h ? `完全${h.code}${h.t?"・"+fmtT(h.t)+"〜":""}` : esc(ytKw(q))+"の動画を検索";
  return `<a class="ytlink" href="${esc(ytHref(q))}" data-url="${esc(ytUrl(q))}" target="_blank" rel="noopener"><span class="ytico">▶</span>ホンダさんの解説（${lab}）</a>`; }
/* Braveで開けなかったとき（アプリに切り替わらなかったとき）は、リンクのコピーと通常のブラウザで開く方法を出す */

  const url=a.dataset.url; let box=a.nextElementSibling;
  if(box&&box.classList.contains("ythelp")) return;
  box=document.createElement("div"); box.className="ythelp";
  box.innerHTML=`<p>Braveが開かなかったときは、リンクをコピーして、Braveのアドレス欄に貼り付けてください。</p>
    <div class="seg"><button class="btn" data-ycopy>リンクをコピー</button><a class="btn" href="${esc(url)}" target="_blank" rel="noopener">通常のブラウザで開く</a></div>`;
  a.after(box);
  box.querySelector("[data-ycopy]").onclick=e=>{ const b=e.currentTarget;
    copyText(url).then(ok=>{ b.textContent=ok===false?"コピーできませんでした":"コピーしました"; }); };
}
document.addEventListener("click",e=>{

function card(q,no,ctx){

  if(q.mode==="cloze"){
    const lv=1; // テキストは隠さない
    let html;
    if(lv===3){
      const parts=withBreaks(q.t.replace(/\[\[|\]\]/g,"")).split(/(?<=[、。])|(?=[\u2028\u2029])/).filter(Boolean);
      const merged=[];
      parts.forEach(x=>{ if(merged.length&&/^[）」』\)]+[、。]?$/.test(x)) merged[merged.length-1]+=x; else merged.push(x); });
      html=merged.map(x=>{
        const br=x.startsWith("\u2028"), tb=x.startsWith("\u2029"); let body=x.replace(/[\u2028\u2029]/g,"");
        let mark="";
        const mm=body.match(/^([⑴-⒂①-⑳イロハニホヘト]　?)/);
        if(mm&&(br||merged[0]===x)){ mark=mm[1]; body=body.slice(mark.length); }
        return (br?"<br>":tb?'<br class="tb">':"")+esc(mark)+(body?`<span class="blank" role="button" tabindex="0" aria-label="答えを表示">${esc(body)}</span>`:"");
      }).join("");
    } else {
      const src=hideSame(lv===2&&q.t2?q.t2:q.t);
      html=esc(withBreaks(src)).replace(/\[\[(.+?)\]\]/g,(_,x)=>`<span class="blank" role="button" tabindex="0" aria-label="答えを表示">${x}</span>`).replace(/\u2028/g,"<br>").replace(/\u2029/g,'<br class="tb">');

      // タップした行（⑴・①・イなどの項目）を特定し、その行の先頭から読む
      let line=-1; const kids=[...qt.children]; let t=e.target;

  } else {

  el.querySelector(".tagbtn").onclick=()=>togglePin(el,q.id);

  applyTag(el,q.id);

// タップ位置 → 本文の何文字目か
function tapOffset(root,e){
  let node=null,off=0;
  if(document.caretPositionFromPoint){ const p=document.caretPositionFromPoint(e.clientX,e.clientY); if(p){node=p.offsetNode;off=p.offset;} }
  else if(document.caretRangeFromPoint){ const r=document.caretRangeFromPoint(e.clientX,e.clientY); if(r){node=r.startContainer;off=r.startOffset;} }
  if(!node||!root.contains(node)) return null;
  if(node.nodeType!==3){ // 要素上：その要素の先頭とみなす
    const w0=document.createTreeWalker(node,NodeFilter.SHOW_TEXT); const f=w0.nextNode(); if(!f) return null; node=f; off=0; }
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT); let n,tot=0;
  while((n=w.nextNode())){ if(n===node) return tot+off; tot+=n.nodeValue.length; }
  return null;
}

/* ───────── 暗記：同じ規定内の同じ語句はすべて隠す ───────── */
function hideSame(src){
  // ⑴・①などの番号だけの語は、項目の見出し番号まで隠してしまうので対象外
  const words=[...new Set([...src.matchAll(/\[\[(.+?)\]\]/g)].map(m=>m[1]))].filter(w=>!/^[〔〕\d\s]*[⑴-⒂①-⑳イロハニホヘト][⑴-⒂①-⑳イロハニホヘト〔〕\d\s]*$/.test(w)).sort((a,b)=>b.length-a.length);
  if(!words.length) return src;
  const K=/[一-龥々ァ-ヴー]/, D=/[0-9０-９,.]/;
  return src.split(/(\[\[.+?\]\])/).map(part=>{
    if(part.startsWith("[[")) return part;
    let out="", i=0;
    while(i<part.length){
      let hit=null;
      for(const w of words){
        if(part.startsWith(w,i)){
          const prev=part[i-1]||"", next=part[i+w.length]||"";
          const isNum=/^[0-9]/.test(w);
          const okB=isNum?(!D.test(prev)&&!D.test(next)):(!K.test(prev)||!K.test(w[0]))&&(!K.test(next)||!K.test(w[w.length-1]));
          if(okB){hit=w;break;}
        }
      }
      if(hit){ out+="[["+hit+"]]"; i+=hit.length; } else { out+=part[i]; i++; }
    }
    return out;
  }).join("");
}

/* ───────── 暗記の改行（①・イなどの前） ───────── */
function withBreaks(t){
  if(t.indexOf("\n")>=0){
    const MK=/^(?:\[\[)?(?:[⑴-⒇①-⑳]|[イロハニホヘト](?:　|\]\]　))/, HD=/^(?:\[\[)?(?:[【〔]|\d+．)/;
    let inItem=false;
    return t.split("\n").map((l,i)=>{
      let sep=" ";
      if(MK.test(l)) inItem=true;
      else if(HD.test(l)) inItem=false;
      else if(inItem&&i>0) sep=" ";
      return (i?sep:"")+l;
    }).join("");
  }
  let out="";
  const chars=[...t];
  let dep=0; const last={p:0,c:0}; let blank=false;
  chars.forEach((ch,i)=>{
    const prev=chars[i-1]||"", next=chars[i+1]||"";
    let br=false;
    if(ch==="（"||ch==="(") dep++;
    else if(ch==="）"||ch===")") dep=Math.max(0,dep-1);
    // 空欄（[[…]]）の中では改行も空白の置き換えもしない。
    // 途中で切ると「[[」「]]」がそのまま画面に出てしまうため
    if(ch==="["&&next==="[") blank=true;
    if(ch==="]"&&prev==="]") blank=false;
    if(blank){ out+=ch; return; }
    // かっこの中の⑴・①・イなどは参照なので改行・空白を入れない
    if(dep>0&&/[⑴-⒂①-⑳イロハニホヘト]/.test(ch)){ out+=ch; return; }
    // 「⑴居住無制限納税義務者　相続又は…」の見出しと本文の間の空白は改行（同じ項目内）にする
    if(ch==="　"&&dep===0&&i>=2&&!/[　\s⑴-⒂①-⑳イロハニホヘト]/.test(prev)&&next&&!/[　\s]/.test(next)){ out+="\u2029"; return; }
    // 後ろに助詞・接続詞が続く番号（「⑴かつ⑵に該当」「①又は②」など）は参照なので改行しない
    const REF_NEXT=/[の⑴-⒂①-⑳、～かにをがはとで及又若並まや）]/;
    if(i>0&&/[⑴-⒂]/.test(ch)&&!/[⑴-⒂〕、「]/.test(prev)&&!REF_NEXT.test(next)&&prev!=="[") br=true;
    if(i>0&&/[①-⑳]/.test(ch)&&!/[⑴-⒂〕①-⑳、]/.test(prev)&&!REF_NEXT.test(next)&&prev!=="[") br=true;
    // 文の終わり（。）や見出しの後に来る⑴・①は、次が「①から⑤」のような参照の書き出しでも項目として改行する
    // 直前の項目の次の番号で、すぐ下の段の番号が続く場合（「…もの⑶①宗教…」の⑶）も項目として改行する
    if(!br&&i>0&&dep===0&&prev!=="["&&!/[⑴-⒂①-⑳〔〕、「]/.test(prev)){
      const lower=/[⑴-⒂]/.test(ch)?/[①-⑳]/:/[①-⑳]/.test(ch)?/[イロハニホヘト]/:null;
      const n2=/[⑴-⒂]/.test(ch)?ch.charCodeAt(0)-0x2473:ch.charCodeAt(0)-0x245F, f2=/[⑴-⒂]/.test(ch)?"p":"c";
      if(lower&&lower.test(next)&&n2===(last[f2]||0)+1) br=true;
      // 文やかっこ書きの終わりの後の次の番号（「…除く。）②①の財産を…」の②）
      if(/[。）)]/.test(prev)&&n2===(last[f2]||0)+1) br=true;
    }
    if(!br&&i>0&&/[⑴-⒂①-⑳]/.test(ch)&&(prev==="。"||(prev==="　"&&!/[⑴-⒂①-⑳イロハニホヘト]/.test(chars[i-2]||"")))){
      const fam=/[⑴-⒂]/.test(ch)?"p":"c", n=fam==="p"?ch.charCodeAt(0)-0x2473:ch.charCodeAt(0)-0x245F;
      const sameNext=fam==="p"?/[⑴-⒂]/.test(next):/[①-⑳]/.test(next);
      // 直前の項目の次の番号（⑤の後の⑥）か、新しい並びの先頭（①・⑴）で後ろが助詞でも同じ種類の番号でもないとき
      if(n===(last[fam]||0)+1||(n===1&&(fam==="c"||!last.p)&&!sameNext&&!/[のにはがをとで、及又か～]/.test(next))) br=true;
    }
    if(i>0&&/[イロハニホヘト]/.test(ch)&&!/[ァ-ヴー、・①-⑳]/.test(prev)&&!/[ァ-ヴー、・の]/.test(next)&&prev!=="[") br=true;
    if((br||i===0)&&/[⑴-⒂]/.test(ch)){ last.p=ch.charCodeAt(0)-0x2473; last.c=/[①-⑳]/.test(next)?next.charCodeAt(0)-0x245F:0; }
    if((br||i===0)&&/[①-⑳]/.test(ch)) last.c=ch.charCodeAt(0)-0x245F;
    // 計算式の記号の説明（「A…全ての相続人が…」「B…」「C…」）は記号ごとに改行する
    if(i>0&&dep===0&&/[A-ZＡ-Ｚ]/.test(ch)&&next==="…"&&!/[A-ZＡ-Ｚa-z×÷＋－+\-\u2028\u2029]/.test(prev)&&!out.endsWith("\u2029")) br=true;
    const isMark=(br||i===0)&&/[⑴-⒂①-⑳イロハニホヘト]/.test(ch)&&!/[　\s]/.test(next);
    out+=(br?"\u2028":"")+ch+(isMark&&(br||/[⑴-⒂①-⑳]/.test(ch))?"　":"");
  });
  // 見出しの直後に次の項目（①など）が続く場合は、項目の改行だけにする
  return out.replace(/\u2029(\]\])?\u2028/g,"$1\u2028");
}
// 改行ごとに段落化し、①・イなどは2行目以降を1字下げ（ぶら下げ）
function hangIndent(html){
  let lv=0;  // 直前の項目の段（計算式の記号の説明行をその本文にそろえるため）
  return html.split("<br>").map(seg=>{
    const txt=seg.replace(/<[^>]+>/g,""), first=txt.charAt(0);
    let cls=/^【\d+】/.test(txt)?"lp lh":/^〔根拠〕/.test(txt)?"lp lref":/[⑴-⒂]/.test(first)?"li li1":/[①-⑳]/.test(first)?"li li2":/[イロハニホヘト]/.test(first)?"li li3":"lp";
    if(cls!=="lp") lv=+cls.slice(-1);
    else if(/^[A-ZＡ-Ｚ]…/.test(txt)&&lv) cls="lp lc"+lv;
    else lv=0;
    return `<span class="${cls}">${seg}</span>`;
  }).join("");
}

/* ───────── 音声入力（記述） ───────── */
let dictRec=null, dictBtn=null;
function stopDictation(){ if(dictRec){ try{dictRec.stop();}catch(e){} } }
function toggleDictation(ta,btn,el){
  if(dictRec&&dictBtn===btn){ stopDictation(); return; }
  stopDictation();
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  const note=t=>{ let n=el.querySelector(".micnote"); if(!n){ n=document.createElement("p"); n.className="micnote hint"; btn.closest(".microw").after(n); } n.textContent=t; };
  if(!SR){ note("この端末では音声入力ボタンが使えません。入力欄を押して、キーボードのマイクのボタンから音声入力してください。"); ta.focus(); return; }
  const r=new SR(); r.lang="ja-JP"; r.continuous=true; r.interimResults=true;
  const base=ta.value; let fin="";
  r.onresult=ev=>{ let interim=""; for(let i=ev.resultIndex;i<ev.results.length;i++){ const x=ev.results[i]; if(x.isFinal) fin+=x[0].transcript; else interim+=x[0].transcript; }
    ta.value=base+fin+interim; ta.dispatchEvent(new Event("input")); };
  r.onerror=ev=>{ if(ev.error==="not-allowed"||ev.error==="service-not-allowed") note("マイクの使用が許可されていません。設定アプリでマイクを許可するか、キーボードのマイクのボタンから音声入力してください。"); };
  r.onend=()=>{ ta.value=base+fin; ta.dispatchEvent(new Event("input")); btn.setAttribute("aria-pressed","false"); btn.textContent="🎤 音声入力"; const nn=el.querySelector(".micnote"); if(nn&&/音声入力中/.test(nn.textContent)) nn.remove(); if(dictRec===r){ dictRec=null; dictBtn=null; } };
  try{ r.start(); }catch(e){ note("音声入力を始められませんでした。キーボードのマイクのボタンから音声入力してください。"); return; }
  dictRec=r; dictBtn=btn; btn.setAttribute("aria-pressed","true"); btn.textContent="■ 停止"; note("音声入力中です。話してください。終わったら「■ 停止」を押します。");
}
function norm(s){
  return s.replace(/[０-９Ａ-Ｚａ-ｚ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0))
          .replace(/(\d)[,，](?=\d)/g,"$1").replace(/[／]/g,"/").replace(/[\s　]+/g,"");
}
function gradeKw(q,input){
  const ni=norm(input||""), kw=q.kw||[];
  const hits=kw.filter(k=>ni.includes(norm(k)));
  const kwRate=kw.length?hits.length/kw.length:0;
  // 書いた範囲だけでなく条文全体と比べる（書いていない部分は一致しなかった字として数える）
  const nt=norm(q.text||""); let cov=0;
  if(ni&&nt){ try{ cov=lcsOps(nt,ni).same/nt.length; }catch(e){ cov=0; } }
  const rate=Math.min(kwRate,cov);
  return {kw,hits,miss:kw.filter(k=>!hits.includes(k)),rate,kwRate,cov,ok:kw.length>0&&rate>=setting("pass")/100};
}
// 記述の解答（条文）を暗記と同じく⑴・①などで改行して表示する
function dispText(q){
  const cz=DATA.cloze.find(c=>c.s===q.s);
  if(cz){ const p=cz.t.replace(/\[\[|\]\]/g,""); if(p.replace(/[\s　]/g,"")===q.text.replace(/[\s　]/g,"")) return withBreaks(p); }
  return withBreaks(q.text);
}
// 問題文に出てくる「〔2〕」などの参照先（同じ問題番号の別の項目）を、開いて確認できるようにする
function refBox(q){
  if(!q.pid) return "";
  const txt=q.q+" "+(q.o||[]).join(" ");
  const keys=[...new Set([...txt.matchAll(/(?:(\d+)[-－](\d+))?〔(\d+)〕/g)].map(m=>(m[1]?m[1]+"-"+m[2]:q.pid)+"〔"+m[3]+"〕"))];
  const items=keys.map(k=>({k,c:DATA.cloze.find(c=>c.s==="問題"+k)})).filter(x=>x.c);
  if(!items.length) return "";
  const lab=items.map(x=>`問題${esc(x.k)}${esc(x.c.title||"")}`).join("・");
  const body=items.map(x=>`<div class="refitem"><div class="refh">問題${esc(x.k)}${esc(x.c.title||"")}</div><div class="qtext">${hangIndent(esc(withBreaks(x.c.t.replace(/\[\[|\]\]/g,""))).replace(/\u2028/g,"<br>").replace(/\u2029/g,"<br>"))}</div></div>`).join("");
  return `<details class="refbox"><summary>参照先：${lab}<span class="refo">（開いて条文を見る）</span></summary>${body}</details>`;
}
function kwHighlight(q,g){
  const kw=q.kw||[]; const t=dispText(q); const spans=[];
  kw.forEach(k=>{const p=t.indexOf(k); if(p>=0) spans.push([p,p+k.length,k]);});
  spans.sort((a,b)=>a[0]-b[0]);
  let out="",pos=0;
  spans.forEach(([s,e,k])=>{ if(s<pos) return; const cls=!g?"kwn":g.hits.includes(k)?"kwok":"kwng"; out+=esc(t.slice(pos,s))+`<span class="${cls}">${esc(t.slice(s,e))}</span>`; pos=e; });
  out+=esc(t.slice(pos));
  return hangIndent(out.replace(/\u2028/g,"<br>").replace(/\u2029/g,'<br class="tb">'));
}
function lcsOps(a,b){
  const n=a.length,m=b.length, dp=[];
  for(let i=0;i<=n;i++) dp.push(new Uint16Array(m+1));
  for(let i=n-1;i>=0;i--) for(let j=m-1;j>=0;j--) dp[i][j]=a[i]===b[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const ops=[]; let i=0,j=0;
  const push=(t,ch)=>{const l=ops[ops.length-1]; if(l&&l[0]===t) l[1]+=ch; else ops.push([t,ch]);};
  while(i<n&&j<m){ if(a[i]===b[j]){push("=",a[i]);i++;j++;} else if(dp[i+1][j]>=dp[i][j+1]){push("-",a[i]);i++;} else {push("+",b[j]);j++;} }
  while(i<n) push("-",a[i++]); while(j<m) push("+",b[j++]);
  return {ops,same:dp[0][0]};
}
// 条文（正解）の表示上の改行位置を、空白を除いた比較用の文字位置に置き換える
function diffBreaks(q){
  const s=new Set(); if(!q) return s;
  const t=[...dispText(q)]; let k=0;
  t.forEach((ch,i)=>{
    if(ch===" "||ch===" "){ if(k>0) s.add(k); return; }
    if(/\s/.test(ch)) return;
    if((ch===","||ch==="，")){ let p=i-1; while(p>=0&&/\s/.test(t[p])) p--; if(p>=0&&/[0-9０-９]/.test(t[p])&&/[0-9０-９]/.test(t[i+1]||"")) return; }
    k+=ch.length;
  });
  return s;
}
function renderOps(ops,brk,upto){
  let out="", ai=0;
  const wrap=(t,x)=>t==="="?esc(x):t==="-"?`<mark>${esc(x)}</mark>`:`<del>${esc(x)}</del>`;
  (upto==null?ops:ops.slice(0,upto)).forEach(([t,s])=>{
    if(t==="+"){ out+=wrap(t,s); return; }
    let seg="";
    for(const ch of s){ if(ai>0&&brk.has(ai)){ if(seg) out+=wrap(t,seg); seg=""; out+="<br>"; } seg+=ch; ai+=ch.length; }
    if(seg) out+=wrap(t,seg);
  });
  return out;
}
// 前回の文章の間違い箇所：条文全体と比べ、書いていない部分も赤字で示す
function prevDiff(q,input){
  const {ops}=lcsOps(norm(q.text),norm(input||""));
  let last=ops.length-1; while(last>=0&&ops[last][0]==="-") last--;
  // 書いていない部分も、書けていない語句と同じく赤字で表示する
  return renderOps(ops,diffBreaks(q));
}
function charDiff(answer,input,q){
  const a=norm(answer), b=norm(input||"");
  const {ops}=lcsOps(a,b);
  return renderOps(ops,diffBreaks(q));
}
function kwChips(g){
  return `<div class="kwlist">${g.kw.map(k=>`<span class="kwc ${g.hits.includes(k)?"ok":"ng"}">${g.hits.includes(k)?"✓":"✗"} ${esc(k)}</span>`).join("")}</div>`;
}

    ${kwChips(g)}${ptsBox(q)}

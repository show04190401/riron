3", "st": 1, "q": "生命保険を解約して受け取った解約返戻金は、契約者が受け取る場合、一時所得として所得税の課税対象となる。", "a": true, "e": "正しい記述です。\n【根拠】解約返戻金－払込保険料－特別控除50万円の2分の1が総所得金額に算入されます。\n【ひっかけ】一時払養老保険などで5年以内に解約した場合は、源泉分離課税です。"}, {"id": "tf:a0f28b7e95", "c": 2, "s": "問題2-3", "st": 2, "q": "リビング・ニーズ特約に基づいて被保険者が受け取った生前給付保険金は、所得税の課税対象となる。", "a": false, "e": "誤りです。\n【根拠】リビング・ニーズ特約の保険金は非課税です。\n【ひっかけ】使い残したまま本人が死亡すると、その残額は相続財産になります。"}, {"id": "tf:19b367f337", "c": 2, "s": "問題2-3", "st": 1, "q": "2011年以前に締結した旧契約と2012年以後に締結した新契約の両方の一般の生命保険料がある場合、所得税の一般の生命保険料控除の上限は4万円である。", "a": true, "e": "正しい記述です。\n【根拠】新旧両方の控除を適用する場合、その区分の上限は4万円です（旧契約だけで計算した方が有利なら5万円）。\n【ひっかけ】3区分の合計の上限は12万円です。"}, {"id": "tf:488b7e56cc", "c": 2, "s": "問題2-3", "st": 2, "q": "2012年以後に締結した介護医療保険契約の介護医療保険料控除の所得税の控除限度額は、5万円である。", "a": false, "e": "誤りです。\n【根拠】新契約の各区分の所得税の控除限度額は4万円です。\n【ひっかけ】5万円は旧契約（一般・個人年金）の限度額です。"}, {"id": "tf:47117dcc79", "c": 2, "s": "問題2-3", "st": 2, "q": "個人年金保険料控除の適用を受けるためには、保険料の払込期間が5年以上であることが要件である。", "a": false, "e": "誤りです。\n【根拠】保険料の払込期間は10年以上であることが要件です。\n【ひっかけ】確定年金などは、年金受取開始が60歳以後で受取期間10年以上であることも要件です。"}, {"id": "tf:daa5bbc388", "c": 2, "s": "問題2-3", "st": 2, "q": "契約者（保険料負担者）と満期保険金受取人が同一である養老保険の満期保険金（保険期間10年）は、贈与税の課税対象となる。", "a": false, "e": "誤りです。\n【根拠】契約者＝受取人の満期保険金は、所得税（一時所得）の課税対象です。\n【ひっかけ】契約者と受取人が異なる場合は贈与税です。"}, {"id": "tf:c31ef2303c", "c": 2, "s": "問題2-3", "st": 1, "q": "被保険者の配偶者が受け取った入院給付金は、一時所得として課税される。", "a": false, "e": "誤りです。\n【根拠】被保険者の配偶者・直系血族・生計を一にする親族が受け取った入院給付金も、非課税です。\n【ひっかけ】本人が受け取る場合と同じく非課税です。"}, {"id": "tf:05d21021d6", "c": 2, "s": "問題2-3", "st": 2, "q": "高度障害保険金は、一時所得として所得税の課税対象となる。", "a": false, "e": "誤りです。\n【根拠】高度障害保険金は、身体の傷害に基因して支払われる保険金として非課税です。\n【ひっかけ】死亡保険金とは課税関係が異なります。"}, {"id": "tf:4c8ac2fde9", "c": 2, "s": "問題2-3", "st": 1, "q": "団体信用生命保険の保険料は、生命保険料控除の対象となる。", "a": false, "e": "誤りです。\n【根拠】団体信用生命保険の保険料は、生命保険料控除の対象外です。\n【ひっかけ】保険金がローン残高の返済に充てられるためです。"}, {"id": "tf:278d8d73f2", "c": 2, "s": "問題2-4", "st": 2, "q": "失火責任法では、軽過失により隣家を焼失させた場合でも、隣家に対して損害賠償責任を負う。", "a": false, "e": "誤りです。\n【根拠】失火責任法により、重大な過失がなければ不法行為による損害賠償責任を負いません。\n【ひっかけ】借家人が借家を焼失させた場合は、家主に対して債務不履行責任を負います。区別が頻出です。"}, {"id": "tf:a5de940652", "c": 2, "s": "問題2-4", "st": 2, "q": "地震保険は、火災保険に付帯して契約する必要があり、地震保険単独で契約することはできない。", "a": true, "e": "正しい記述です。\n【根拠】地震保険は火災保険に付帯して契約します。火災保険の契約期間の途中からでも付帯できます。\n【ひっかけ】保険金額は火災保険の30％〜50％の範囲内で、建物5,000万円・家財1,000万円が上限です。"}, {"id": "tf:824a0ea36b", "c": 2, "s": "問題2-4", "st": 2, "q": "地震保険の保険金額は、主契約である火災保険の保険金額の30％〜50％の範囲内で、建物は1,000万円、家財は500万円が上限である。", "a": false, "e": "誤りです。\n【根拠】上限は建物5,000万円、家財1,000万円です。\n【ひっかけ】地震を原因とする火災損害は、火災保険では補償されません。"}, {"id": "tf:16c6e49dda", "c": 2, "s": "問題2-4", "st": 2, "q": "自動車損害賠償責任保険（自賠責保険）の支払限度額は、被害者1人につき死亡の場合3,000万円、傷害の場合120万円である。", "a": true, "e": "正しい記述です。\n【根拠】後遺障害は、常時介護を要する場合で4,000万円が上限です。\n【ひっかけ】自賠責保険は対人賠償のみで、物損は補償されません。"}, {"id": "tf:b7b416ca3c", "c": 2, "s": "問題2-4", "st": 1, "q": "自動車保険の対人賠償保険では、運転者の父母が事故によりけがをした場合も補償の対象となる。", "a": false, "e": "誤りです。\n【根拠】対人賠償保険では、運転者本人やその配偶者・父母・子の死傷は補償されません。\n【ひっかけ】その場合は、人身傷害補償保険などで補償されます。"}, {"id": "tf:b4ebe19d65", "c": 2, "s": "問題2-4", "st": 2, "q": "個人賠償責任保険では、業務遂行中に他人の物を壊した場合の賠償責任も補償の対象となる。", "a": false, "e": "誤りです。\n【根拠】業務遂行中の事故は個人賠償責任保険の対象外です。\n【ひっかけ】自動車の運転による事故や、他人から借りた物の損壊も対象外です。"}, {"id": "tf:6718fe0ce4", "c": 2, "s": "問題2-4", "st": 1, "q": "地震保険料控除の所得税の控除限度額は5万円である。", "a": true, "e": "正しい記述です。\n【根拠】所得税は地震保険料の全額で最高5万円、住民税は2分の1で最高2万5,000円です。\n【ひっかけ】火災保険料は、地震保険料控除の対象外です。"}, {"id": "tf:f16942c7f6", "c": 2, "s": "問題2-4", "st": 2, "q": "普通傷害保険では、細菌性食中毒は補償の対象とならない。", "a": true, "e": "正しい記述です。\n【根拠】普通傷害保険では、細菌性食中毒や地震・噴火・津波によるけがは補償されません。\n【ひっかけ】海外旅行傷害保険は、細菌性食中毒も地震などによるけがも補償します。"}, {"id": "tf:809c99ac52", "c": 2, "s": "問題2-4", "st": 2, "q": "国内旅行傷害保険では、地震・噴火・津波によるけがも補償の対象となる。", "a": false, "e": "誤りです。\n【根拠】国内旅行傷害保険は細菌性食中毒を補償しますが、地震・噴火・津波によるけがは補償しません。\n【ひっかけ】海外旅行傷害保険とあわせて整理します。"}, {"id": "tf:d4f699e1d1", "c": 2, "s": "問題2-4", "st": 1, "q": "家族傷害保険の被保険者には、生計を一にする別居の未婚の子も含まれる。", "a": true, "e": "正しい記述です。\n【根拠】本人・配偶者・生計を一にする同居の親族・生計を一にする別居の未婚の子が対象です。\n【ひっかけ】家族の範囲は、事故の時点で判定します。"}, {"id": "tf:ec8a194a56", "c": 2, "s": "問題2-4", "st": 2, "q": "飲食店が提供した料理で客が食中毒になった場合の損害賠償責任は、施設所有（管理）者賠償責任保険で補償される。", "a": false, "e": "誤りです。\n【根拠】提供した料理（製品・仕事の結果）による事故は、生産物賠償責任保険（PL保険）で補償されます。\n【ひっかけ】施設所有（管理）者賠償責任保険は、施設の管理不備や業務遂行中の事故が対象です。"}, {"id": "tf:3b73fb712d", "c": 2, "s": "問題2-4", "st": 1, "q": "自動車保険の車両保険のエコノミー型（車対車＋A）では、単独事故や当て逃げによる損害は補償されない。", "a": true, "e": "正しい記述です。\n【根拠】エコノミー型は、一般型に比べ保険料が安い代わりに補償範囲が狭くなります。\n【ひっかけ】相手が特定できる車同士の事故は補償されます。"}, {"id": "tf:6eaf349c23", "c": 2, "s": "問題2-4", "st": 1, "q": "火災保険の保険金額を再調達価額（新価）で設定すると、損害額に応じて、同等の建物を新たに建てるのに必要な額が補償される。", "a": true, "e": "正しい記述です。\n【根拠】再調達価額（新価）で契約すると、時価で契約する場合と異なり、減価分を差し引かずに補償されます。\n【ひっかけ】時価は、再調達価額から経年による減価を差し引いた額です。"}, {"id": "tf:dca34405a2", "c": 2, "s": "問題2-4", "st": 1, "q": "住宅総合保険では、洪水などによる水災の損害も補償の対象となる。", "a": true, "e": "正しい記述です。\n【根拠】住宅総合保険は、火災・風災に加え、水災や盗難なども補償します。\n【ひっかけ】住宅火災保険では、水災は補償されません。"}, {"id": "tf:c15cd0a859", "c": 2, "s": "問題2-4", "st": 2, "q": "地震保険において、損害の程度が大半損と認定された場合、保険金額の50％が支払われる。", "a": false, "e": "誤りです。\n【根拠】大半損は保険金額の60％です。全損100％、小半損30％、一部損5％です。\n【ひっかけ】数字の入れ替えに注意します。"}, {"id": "tf:ec355376af", "c": 2, "s": "問題2-4", "st": 1, "q": "地震保険の保険料は、建物の所在地と構造によって異なる。", "a": true, "e": "正しい記述です。\n【根拠】地震の危険度は地域と建物の構造によって異なるため、保険料も異なります。\n【ひっかけ】保険会社によって保険料が異なることはありません。"}, {"id": "tf:1ebb2738b1", "c": 2, "s": "問題2-4", "st": 2, "q": "地震保険の免震建築物割引と耐震等級割引は、重複して適用を受けることができる。", "a": false, "e": "誤りです。\n【根拠】地震保険の割引は、重複して適用できません。\n【ひっかけ】免震建築物割引・耐震等級3の割引率は50％です。"}, {"id": "tf:f3482ecf8c", "c": 2, "s": "問題2-4", "st": 1, "q": "地震が発生した日の翌日から起算して10日を経過した後に生じた損害は、地震保険の補償の対象とならない。", "a": true, "e": "正しい記述です。\n【根拠】地震と損害との因果関係の確認が難しくなるためです。\n【ひっかけ】数字を変える出題に注意します。"}, {"id": "tf:4ca1246195", "c": 2, "s": "問題2-4", "st": 1, "q": "自賠責保険では、被害者が加害者の加入する保険会社に直接、保険金の支払を請求することができる。", "a": true, "e": "正しい記述です。\n【根拠】被害者請求といいます。\n【ひっかけ】仮渡金の制度もあります。"}, {"id": "tf:c79b142ef8", "c": 2, "s": "問題2-4", "st": 1, "q": "自動車保険のノンフリート等級は、対人賠償保険金を受け取る事故が1件あった場合、翌年の等級が3等級下がる。", "a": true, "e": "正しい記述です。\n【根拠】3等級ダウン事故です。車両保険の一部の事故などは1等級ダウン事故やノーカウント事故となります。\n【ひっかけ】等級は1から20まであります。"}, {"id": "tf:7c9c8bed4a", "c": 2, "s": "問題2-4", "st": 2, "q": "人身傷害補償保険では、被保険者自身の過失割合に相当する部分は補償されない。", "a": false, "e": "誤りです。\n【根拠】人身傷害補償保険は、過失割合にかかわらず、実際の損害額を保険金額の範囲内で補償します。\n【ひっかけ】対人賠償保険は、相手方への賠償を補償します。"}, {"id": "tf:679b57cda9", "c": 2, "s": "問題2-4", "st": 1, "q": "搭乗者傷害保険は、契約車両に搭乗中の者が死傷した場合に、実際の損害額にかかわらず、あらかじめ定めた金額が支払われる。", "a": true, "e": "正しい記述です。\n【根拠】搭乗者傷害保険は定額払です。\n【ひっかけ】人身傷害補償保険は実損払です。"}, {"id": "tf:872139a253", "c": 2, "s": "問題2-4", "st": 2, "q": "個人賠償責任保険では、被保険者の子が自転車で走行中に歩行者にけがをさせた場合の賠償責任も補償の対象となる。", "a": true, "e": "正しい記述です。\n【根拠】日常生活の事故による賠償責任が対象で、自転車事故も含まれます。\n【ひっかけ】自動車の運転による事故や、業務中の事故は対象外です。"}, {"id": "tf:2085f576b8", "c": 2, "s": "問題2-4", "st": 1, "q": "個人賠償責任保険では、友人から借りたカメラを誤って壊した場合の賠償責任も補償される。", "a": false, "e": "誤りです。\n【根拠】他人から借りた物や預かった物の損害は、原則として個人賠償責任保険の対象外です。\n【ひっかけ】受託品を補償する特約がある商品もあります。"}, {"id": "tf:8bb9107091", "c": 2, "s": "問題2-4", "st": 1, "q": "事業者が火災などで営業を休止した場合の利益の減少は、店舗休業保険（利益保険）で補償することができる。", "a": true, "e": "正しい記述です。\n【根拠】店舗休業保険や利益保険は、休業による喪失利益などを補償します。\n【ひっかけ】建物や設備の損害は、火災保険で補償します。"}, {"id": "tf:569fcd8d0e", "c": 2, "s": "問題2-4", "st": 1, "q": "労働災害総合保険は、政府の労災保険の給付に上乗せして補償するための保険である。", "a": true, "e": "正しい記述です。\n【根拠】法定外補償や、事業主の使用者賠償責任を補償します。\n【ひっかけ】政府の労災保険の代わりになるものではありません。"}, {"id": "tf:cb64d2be4f", "c": 2, "s": "問題2-4", "st": 2, "q": "火災保険では、建物と家財は別々の保険の対象であり、家財を補償するには家財を保険の対象とする必要がある。", "a": true, "e": "正しい記述です。\n【根拠】建物だけを対象にした場合、家財の損害は補償されません。\n【ひっかけ】1個又は1組の価額が30万円を超える貴金属や美術品は、明記物件として申告が必要です。"}, {"id": "tf:156410bf60", "c": 2, "s": "問題2-4", "st": 2, "q": "隣家からのもらい火で自宅が焼失した場合、原則として隣家に損害賠償を請求できないため、自宅の火災保険で備える必要がある。", "a": true, "e": "正しい記述です。\n【根拠】失火責任法により、隣家に重大な過失がなければ損害賠償を請求できません。\n【ひっかけ】自分の失火で隣家に損害を与えた場合に備える類焼損害特約もあります。"}, {"id": "tf:47cc602c35", "c": 2, "s": "問題2-4", "st": 1, "q": "地震を原因とする火災による損害は、火災保険の地震火災費用保険金で、保険金額の一定割合（例：5％）が支払われる場合がある。", "a": true, "e": "正しい記述です。\n【根拠】地震火災費用保険金は少額であり、本格的な備えには地震保険が必要です。\n【ひっかけ】地震による火災は、火災保険の本体では補償されません。"}, {"id": "tf:122c890e83", "c": 2, "s": "問題2-4", "st": 2, "q": "自賠責保険は、運転者自身のけがも補償の対象とする。", "a": false, "e": "誤りです。\n【根拠】自賠責保険は、他人（被害者）の死傷だけを補償します。運転者自身のけがは対象外です。\n【ひっかけ】運転者自身のけがは、人身傷害補償保険などで備えます。"}, {"id": "tf:34777f6685", "c": 2, "s": "問題2-4", "st": 1, "q": "自動車保険の対物賠償保険は、自動車事故で他人の車や建物などの財物に損害を与えた場合の賠償責任を補償する。", "a": true, "e": "正しい記述です。\n【根拠】自賠責保険には対物の補償がないため、任意保険で備えます。\n【ひっかけ】自分の車の損害は車両保険で補償します。"}, {"id": "tf:d965112d78", "c": 2, "s": "問題2-4", "st": 1, "q": "自動車保険の運転者の年齢条件を「30歳以上補償」にすると、全年齢補償に比べて保険料は高くなる。", "a": false, "e": "誤りです。\n【根拠】年齢条件を設けると、補償される範囲が狭くなるため保険料は安くなります。\n【ひっかけ】運転者を本人・配偶者に限定するなどの条件でも、保険料は安くなります。"}, {"id": "tf:add4708b78", "c": 2, "s": "問題2-4", "st": 1, "q": "交通事故傷害保険は、交通事故のほか、駅の構内やエレベーターでの事故によるけがも補償の対象とする。", "a": true, "e": "正しい記述です。\n【根拠】交通乗用具（エレベーター・エスカレーターを含む）の事故や、駅構内での事故などが対象です。\n【ひっかけ】家族全員を対象とするファミリー交通傷害保険もあります。"}, {"id": "tf:2e8caa244b", "c": 2, "s": "問題2-4", "st": 1, "q": "海外旅行傷害保険の補償期間は、海外旅行の目的で住居を出発してから住居に帰着するまでである。", "a": true, "e": "正しい記述です。\n【根拠】日本国内の移動中の事故も補償されます。\n【ひっかけ】国内旅行傷害保険も、住居を出発してから帰着するまでです。"}, {"id": "tf:0d77738a7e", "c": 2, "s": "問題2-4", "st": 1, "q": "地震保険の保険期間は、最長5年である。", "a": true, "e": "正しい記述です。\n【根拠】地震保険は、1年又は2年から5年の長期契約ができます。\n【ひっかけ】主契約の火災保険の保険期間の範囲内で設定します。"}, {"id": "tf:b5d1f34184", "c": 2, "s": "問題2-4", "st": 2, "q": "地震保険の家財の保険金額の上限は5,000万円である。", "a": false, "e": "誤りです。\n【根拠】家財の上限は1,000万円です。建物の上限が5,000万円です。\n【ひっかけ】数字の入れ替えに注意します。"}, {"id": "tf:98a9cbb341", "c": 2, "s": "問題2-4", "st": 2, "q": "自賠責保険の傷害による損害の支払限度額は、被害者1人につき3,000万円である。", "a": false, "e": "誤りです。\n【根拠】傷害は120万円です。死亡は3,000万円、後遺障害は最高4,000万円です。\n【ひっかけ】数字の組合せを問う出題が多い論点です。"}, {"id": "tf:9e613ab1d4", "c": 2, "s": "問題2-4", "st": 1, "q": "任意の対人賠償保険では、自賠責保険から支払われる金額を超える部分が補償される。", "a": true, "e": "正しい記述です。\n【根拠】任意保険は、自賠責保険の上乗せとして機能します。\n【ひっかけ】対人賠償の保険金額は無制限で契約することが一般的です。"}, {"id": "tf:c87525563c", "c": 2, "s": "問題2-4", "st": 1, "q": "自動車保険の車両保険（エコノミー型）では、車両の盗難による損害も補償される。", "a": true, "e": "正しい記述です。\n【根拠】エコノミー型（車対車＋A）でも、盗難や火災、台風・洪水などの損害は補償されます。\n【ひっかけ】単独事故や当て逃げは補償されません。"}, {"id": "tf:486f0c5545", "c": 2, "s": "問題2-4", "st": 2, "q": "個人賠償責任保険では、自動車の運転中に他人にけがをさせた場合の賠償責任も補償される。", "a": false, "e": "誤りです。\n【根拠】自動車の所有・使用・管理による事故は対象外です。\n【ひっかけ】自動車事故は、自動車保険で備えます。"}, {"id": "tf:fba4a38434", "c": 2, "s": "問題2-4", "st": 1, "q": "普通傷害保険では、熱中症（日射病）によるけがも、特約を付けなくても補償される。", "a": false, "e": "誤りです。\n【根拠】熱中症は、普通傷害保険では原則として補償されず、特約を付ける必要があります。\n【ひっかけ】細菌性食中毒も、普通傷害保険の補償対象外です。"}, {"id": "tf:3f38ede6f6", "c": 2, "s": "問題2-4", "st": 1, "q": "海外旅行傷害保険では、旅行中に発病した病気の治療費用も補償の対象とすることができる。", "a": true, "e": "正しい記述です。\n【根拠】疾病治療費用や救援者費用なども補償できます。\n【ひっかけ】海外では医療費が高額になることがあるため重要です。"}, {"id": "tf:affbfcc8cf", "c": 2, "s": "問題2-4", "st": 1, "q": "自動車保険のノンフリート等級が低いほど、保険料の割引率が高くなる。", "a": false, "e": "誤りです。\n【根拠】等級が高いほど割引率が高く、等級が低いほど保険料は高くなります（割増になる等級もあります）。\n【ひっかけ】新規契約は通常6等級からです。"}, {"id": "tf:8b1d828b6e", "c": 2, "s": "問題2-4", "st": 1, "q": "2006年12月31日までに締結した一定の長期損害保険契約の保険料は、経過措置により地震保険料控除の対象となる。", "a": true, "e": "正しい記述です。\n【根拠】旧長期損害保険料として、所得税は最高1万5,000円まで控除できます。\n【ひっかけ】地震保険料と合わせた控除の上限は5万円です。"}, {"id": "tf:3b21ffcdef", "c": 2, "s": "問題2-5", "st": 2, "q": "がん保険では、通常、契約日から90日間（3か月）の免責期間が設けられている。", "a": true, "e": "正しい記述です。\n【根拠】免責期間中にがんと診断されても、保険金は支払われません。\n【ひっかけ】入院給付金の支払日数には、通常限度がありません。"}, {"id": "tf:e5d10a89b1", "c": 2, "s": "問題2-5", "st": 1, "q": "先進医療特約で対象となる先進医療は、契約時点において厚生労働大臣が定めているものに限られる。", "a": false, "e": "誤りです。\n【根拠】対象となるのは、療養を受けた時点で厚生労働大臣が定める先進医療です。\n【ひっかけ】契約時点ではなく「療養時点」が基準です。"}, {"id": "tf:fcbec694a5", "c": 2, "s": "問題2-5", "st": 2, "q": "法人が契約者・満期保険金受取人、役員・従業員全員が被保険者、死亡保険金受取人が被保険者の遺族である養老保険の保険料は、その2分の1を損金に算入できる。", "a": true, "e": "正しい記述です。\n【根拠】いわゆる福利厚生プラン（ハーフタックスプラン）で、2分の1を保険料（損金）、2分の1を保険料積立金（資産）とします。\n【ひっかけ】特定の役員だけを被保険者とすると、2分の1は給与扱いになります。"}, {"id": "tf:13ce8f7347", "c": 2, "s": "問題2-5", "st": 1, "q": "法人が契約者・死亡保険金受取人である終身保険の支払保険料は、全額を損金に算入できる。", "a": false, "e": "誤りです。\n【根拠】終身保険の保険料は、保険料積立金として資産に計上します。\n【ひっかけ】最高解約返戻率50％以下の定期保険は、原則として全額損金です。"}, {"id": "tf:4eeabae085", "c": 2, "s": "問題2-5", "st": 1, "q": "医療保険で、退院後180日以内に同じ病気で再入院した場合は、通常、前後の入院を1回の入院とみなして支払限度日数が計算される。", "a": true, "e": "正しい記述です。\n【根拠】多くの医療保険で、180日以内の同じ原因の再入院は1回の入院とみなされます。\n【ひっかけ】がん保険の入院給付金は、支払日数の限度がないのが一般的です。"}, {"id": "tf:5374e3ca7b", "c": 2, "s": "問題2-5", "st": 1, "q": "法人が受取人である定期保険の死亡保険金を受け取った場合、資産計上額がないときは、その全額を雑収入として益金に算入する。", "a": true, "e": "正しい記述です。\n【根拠】受け取った保険金は益金です。資産計上している保険料積立金があれば、それを取り崩して差額を雑収入とします。\n【ひっかけ】役員への死亡退職金に充てた場合、その退職金は損金になります（不相当に高額な部分を除く）。"}, {"id": "tf:ec36330e6a", "c": 2, "s": "問題2-5", "st": 1, "q": "がん保険の診断給付金は、がんと診断確定されたときに一時金で支払われる。", "a": true, "e": "正しい記述です。\n【根拠】診断給付金は一時金で、複数回支払われる商品もあります。\n【ひっかけ】がん保険には通常90日の免責期間があります。"}, {"id": "tf:8e41b59006", "c": 2, "s": "問題2-5", "st": 1, "q": "所得補償保険は、病気やけがで就業できなくなった場合の所得の減少を補償する損害保険である。", "a": true, "e": "正しい記述です。\n【根拠】所得補償保険は損害保険会社が扱う商品で、国内外を問わず補償されます。\n【ひっかけ】生命保険会社には、就業不能保険があります。"}, {"id": "tf:4b92bb2d80", "c": 2, "s": "問題2-5", "st": 1, "q": "公的介護保険連動型の介護保障保険は、公的介護保険の要介護認定に連動して保険金が支払われる。", "a": true, "e": "正しい記述です。\n【根拠】要介護2以上などの認定を受けると、保険金が支払われるタイプがあります。\n【ひっかけ】保険会社独自の基準で支払うタイプもあります。"}, {"id": "tf:ef661f4d31", "c": 2, "s": "問題2-5", "st": 2, "q": "法人が契約者で、最高解約返戻率が50％超70％以下の定期保険の支払保険料は、保険期間の当初4割の期間について、その40％を資産に計上し、残りを損金に算入する。", "a": true, "e": "正しい記述です。\n【根拠】最高解約返戻率50％超70％以下は40％、70％超85％以下は60％を資産計上します（当初4割期間）。\n【ひっかけ】50％以下は原則として全額損金です。"}, {"id": "tf:fad462e8b9", "c": 2, "s": "問題2-5", "st": 1, "q": "法人が契約者で受取人も法人の保険を解約し、解約返戻金を受け取った場合は、資産に計上していた保険料積立金との差額を雑収入又は雑損失として処理する。", "a": true, "e": "正しい記述です。\n【根拠】解約返戻金と資産計上額の差額が益金又は損金になります。\n【ひっかけ】資産計上額がなければ、解約返戻金の全額が益金です。"}, {"id": "tf:bca5b8ace7", "c": 2, "s": "問題2-5", "st": 1, "q": "個人事業主が従業員を被保険者とし、死亡保険金受取人を従業員の遺族とする定期保険の保険料は、必要経費に算入できる。", "a": true, "e": "正しい記述です。\n【根拠】従業員の福利厚生のための保険料は、必要経費になります。\n【ひっかけ】事業主自身を被保険者とする保険料は、必要経費ではなく生命保険料控除の対象です。"}, {"id": "tf:af58c300c9", "c": 2, "s": "問題2-5", "st": 2, "q": "個人事業主が自分を被保険者とする生命保険の保険料を支払った場合、その保険料は事業所得の必要経費に算入できる。", "a": false, "e": "誤りです。\n【根拠】事業主本人の生命保険料は必要経費にならず、生命保険料控除の対象となります。\n【ひっかけ】従業員のための保険料と区別します。"}, {"id": "tf:484fea51f7", "c": 2, "s": "問題2-5", "st": 1, "q": "法人が受け取った火災保険金で、焼失した建物に代わる建物を取得した場合、一定の要件を満たせば圧縮記帳ができる。", "a": true, "e": "正しい記述です。\n【根拠】圧縮記帳により、保険差益に対する課税を繰り延べることができます。\n【ひっかけ】受け取った保険金は、原則として益金です。"}, {"id": "tf:f1efbac357", "c": 2, "s": "問題2-5", "st": 1, "q": "個人が受け取った積立型の損害保険の満期返戻金は、一時所得として所得税の課税対象となる。", "a": true, "e": "正しい記述です。\n【根拠】契約者＝受取人の場合、満期返戻金は一時所得です。\n【ひっかけ】損害に対して受け取る保険金は非課税です。"}, {"id": "tf:0b021ebda5", "c": 2, "s": "問題2-5", "st": 1, "q": "個人事業主が、店舗と住宅を兼ねた建物の火災保険料を支払った場合、店舗部分に対応する保険料は必要経費に算入できる。", "a": true, "e": "正しい記述です。\n【根拠】事業用部分に対応する保険料は必要経費になります。\n【ひっかけ】住宅部分の地震保険料は、地震保険料控除の対象になります。"}, {"id": "tf:3043929409", "c": 2, "s": "問題2-5", "st": 1, "q": "医療保険の手術給付金は、所定の手術を受けた場合に、入院給付金日額の一定倍数などの金額が支払われる。", "a": true, "e": "正しい記述です。\n【根拠】給付倍率は手術の種類によって異なる商品が一般的です。\n【ひっかけ】本人が受け取る手術給付金は非課税です。"}, {"id": "tf:a67764fc18", "c": 2, "s": "問題2-5", "st": 1, "q": "法人が支払った役員を被保険者とする医療保険（給付金の受取人は法人）の保険料は、最高解約返戻率が50％以下であれば、原則として全額を損金に算入できる。", "a": true, "e": "正しい記述です。\n【根拠】第三分野の保険も、定期保険と同じ基準で取り扱います。\n【ひっかけ】給付金の受取人が役員本人の場合も、全員加入なら福利厚生費として損金です（特定の役員のみなら給与）。"}, {"id": "tf:08025107b3", "c": 2, "s": "問題2-5", "st": 1, "q": "法人が契約者・被保険者が従業員・受取人が法人の医療保険から入院給付金を受け取った場合、法人の益金に算入される。", "a": true, "e": "正しい記述です。\n【根拠】法人が受け取った給付金は益金です。\n【ひっかけ】その給付金を見舞金として従業員に支払えば、社会通念上相当な額は損金になります。"}, {"id": "tf:7abfc0b2f2", "c": 2, "s": "問題2-5", "st": 1, "q": "法人が支払った自動車保険の保険料は、原則として損金に算入できる。", "a": true, "e": "正しい記述です。\n【根拠】掛け捨ての損害保険料は、期間に応じて損金になります。\n【ひっかけ】積立型の損害保険の積立保険料部分は、資産に計上します。"}, {"id": "tf:a787690410", "c": 2, "s": "問題2-5", "st": 2, "q": "がん保険の入院給付金は、通常、1回の入院につき60日などの支払限度日数が設けられている。", "a": false, "e": "誤りです。\n【根拠】がん保険の入院給付金は、通常、支払日数の限度がありません。\n【ひっかけ】医療保険には、1入院・通算の支払限度日数があります。"}, {"id": "tf:52a6f6c7d3", "c": 2, "s": "問題2-5", "st": 2, "q": "先進医療の技術料は、公的医療保険の対象であり、自己負担は3割である。", "a": false, "e": "誤りです。\n【根拠】先進医療の技術料は公的医療保険の対象外で、全額自己負担です。\n【ひっかけ】診察・検査・入院料など通常の治療と共通する部分は、公的医療保険の対象です。"}, {"id": "tf:53e0f33132", "c": 2, "s": "問題2-5", "st": 1, "q": "医療保険の保険料は、一般の生命保険料控除の対象となる。", "a": false, "e": "誤りです。\n【根拠】2012年以後の契約では、医療保険の保険料は介護医療保険料控除の対象です。\n【ひっかけ】2011年以前の契約では、一般の生命保険料控除の対象でした。"}, {"id": "tf:e7697621c4", "c": 2, "s": "問題2-5", "st": 2, "q": "法人が特定の役員だけを被保険者とする養老保険（満期保険金受取人は法人、死亡保険金受取人は役員の遺族）の保険料は、2分の1を損金に算入できる。", "a": false, "e": "誤りです。\n【根拠】特定の役員だけを被保険者とする場合、福利厚生プランの要件を満たさず、2分の1は役員給与となります。\n【ひっかけ】役員・従業員の全員を被保険者とすることが原則です。"}, {"id": "tf:7cc37bb263", "c": 2, "s": "問題2-5", "st": 1, "q": "法人が受け取った損害保険金は、益金に算入される。", "a": true, "e": "正しい記述です。\n【根拠】受け取った保険金は益金です。\n【ひっかけ】代替資産を取得すれば、圧縮記帳で課税を繰り延べられる場合があります。"}, {"id": "tf:81e277b3e2", "c": 3, "s": "問題3-1", "st": 2, "q": "景気動向指数は、内閣府が毎月公表しており、CIは主として景気変動の大きさやテンポを、DIは景気の各経済部門への波及度合いを測定する。", "a": true, "e": "正しい記述です。\n【根拠】現在はCIを中心とした公表形態となっています。\n【ひっかけ】CIとDIの説明を入れ替える出題に注意します。"}, {"id": "tf:31d7e9378d", "c": 3, "s": "問題3-1", "st": 2, "q": "全国企業短期経済観測調査（日銀短観）は、内閣府が毎月公表する。", "a": false, "e": "誤りです。\n【根拠】日銀短観は、日本銀行が四半期ごと（年4回）に公表します。\n【ひっかけ】内閣府が公表するのはGDPや景気動向指数です。"}, {"id": "tf:af9e4655e7", "c": 3, "s": "問題3-1", "st": 1, "q": "消費者物価指数は総務省が、企業物価指数は日本銀行が公表している。", "a": true, "e": "正しい記述です。\n【根拠】消費者物価指数は総務省、企業物価指数は日本銀行が毎月公表します。\n【ひっかけ】公表機関の入れ替えが頻出です。"}, {"id": "tf:c9b16c1261", "c": 3, "s": "問題3-1", "st": 1, "q": "マネーストック統計は、金融機関や中央政府が保有する預金も含めた通貨量の残高を示す。", "a": false, "e": "誤りです。\n【根拠】マネーストックには、金融機関や中央政府が保有する預金などは含まれません。\n【ひっかけ】一般法人・個人・地方公共団体などの通貨保有主体が保有する通貨量です。"}, {"id": "tf:eacb1fe9a7", "c": 3, "s": "問題3-1", "st": 2, "q": "日本銀行が国債等を買い入れる公開市場操作（買いオペ）を行うと、一般に市中の資金量が増え、金利の低下要因となる。", "a": true, "e": "正しい記述です。\n【根拠】買いオペは市場に資金を供給するため、金利の低下要因になります。\n【ひっかけ】売りオペは資金を吸収し、金利の上昇要因になります。"}, {"id": "tf:639496fcec", "c": 3, "s": "問題3-1", "st": 1, "q": "景気動向指数のDIは、一般に50％を上回ると景気拡張の局面、50％を下回ると景気後退の局面とされる。", "a": true, "e": "正しい記述です。\n【根拠】一致指数のDIが50％を上回れば拡張、下回れば後退とみます。\n【ひっかけ】CIは、上昇・下降の大きさで景気を判断します。"}, {"id": "tf:a3c6e8d9d5", "c": 3, "s": "問題3-1", "st": 1, "q": "GDPデフレーターは、名目GDPを実質GDPで除して求める。", "a": true, "e": "正しい記述です。\n【根拠】GDPデフレーターは、経済全体の物価の動きを示します。\n【ひっかけ】名目GDPが増えても、物価上昇分を除いた実質GDPは増えていないことがあります。"}, {"id": "tf:f946603cb6", "c": 3, "s": "問題3-1", "st": 2, "q": "景気動向指数において、有効求人倍率（除学卒）は先行系列に採用されている。", "a": false, "e": "誤りです。\n【根拠】有効求人倍率（除学卒）は一致系列です。新規求人数（除学卒）が先行系列です。\n【ひっかけ】求人の「新規」と「有効」の違いを問う出題です。"}, {"id": "tf:848fd7ffa9", "c": 3, "s": "問題3-1", "st": 2, "q": "景気動向指数において、完全失業率は遅行系列に採用されている。", "a": true, "e": "正しい記述です。\n【根拠】完全失業率、家計消費支出、法人税収入などは遅行系列です。\n【ひっかけ】東証株価指数やマネーストック（M2）は先行系列です。"}, {"id": "tf:5500301bed", "c": 3, "s": "問題3-1", "st": 1, "q": "景気動向指数において、東証株価指数は一致系列に採用されている。", "a": false, "e": "誤りです。\n【根拠】東証株価指数は先行系列です。\n【ひっかけ】株価は景気に先行して動く傾向があります。"}, {"id": "tf:0dcee6e6e2", "c": 3, "s": "問題3-1", "st": 2, "q": "一般に、日本の金利が上昇すると、円高の要因となる。", "a": true, "e": "正しい記述です。\n【根拠】円で運用する魅力が高まり、円が買われやすくなるためです。\n【ひっかけ】日本の金利が低下すると、円安の要因になります。"}, {"id": "tf:2a3aeea802", "c": 3, "s": "問題3-1", "st": 2, "q": "一般に、円高になると輸入物価は上昇しやすい。", "a": false, "e": "誤りです。\n【根拠】円高になると、同じ外貨建ての商品を少ない円で買えるため、輸入物価は下落しやすくなります。\n【ひっかけ】円安は輸入物価の上昇要因です。"}, {"id": "tf:44ebc15c7f", "c": 3, "s": "問題3-1", "st": 1, "q": "一般に、日本の貿易黒字が拡大すると、円高の要因となる。", "a": true, "e": "正しい記述です。\n【根拠】輸出企業が受け取った外貨を円に替えるため、円が買われやすくなります。\n【ひっかけ】貿易赤字の拡大は円安の要因です。"}, {"id": "tf:120ae672f4", "c": 3, "s": "問題3-1", "st": 1, "q": "日本銀行が預金準備率を引き下げると、一般に市中の資金量が増え、金利の低下要因となる。", "a": true, "e": "正しい記述です。\n【根拠】金融機関が日本銀行に預けておくべき額が減り、貸出しに回せる資金が増えます。\n【ひっかけ】預金準備率の引上げは、金融引締めです。"}, {"id": "tf:08bd1cf049", "c": 3, "s": "問題3-1", "st": 1, "q": "マネタリーベースは、日本銀行券発行高、貨幣流通高及び日銀当座預金の合計である。", "a": true, "e": "正しい記述です。\n【根拠】マネタリーベースは、日本銀行が世の中に直接供給する通貨の量です。\n【ひっかけ】マネーストックは、一般法人や個人などが保有する通貨の量です。"}, {"id": "tf:b98664a461", "c": 3, "s": "問題3-1", "st": 1, "q": "政府が公共投資を増やしたり減税を行ったりすることは、景気を刺激する財政政策である。", "a": true, "e": "正しい記述です。\n【根拠】財政政策は政府、金融政策は日本銀行が行います。\n【ひっかけ】公開市場操作は金融政策です。"}, {"id": "tf:8d2d1f3a62", "c": 3, "s": "問題3-1", "st": 1, "q": "消費者物価指数の上昇は、一般に金利の低下要因となる。", "a": false, "e": "誤りです。\n【根拠】物価の上昇は、一般に金利の上昇要因です。\n【ひっかけ】物価が上がると、お金の価値の目減りを補うために高い金利が求められます。"}, {"id": "tf:4a641a2b36", "c": 3, "s": "問題3-1", "st": 2, "q": "国内総生産（GDP）は、日本銀行が四半期ごとに公表している。", "a": false, "e": "誤りです。\n【根拠】GDPは内閣府が公表します。\n【ひっかけ】日本銀行が公表するのは、日銀短観・企業物価指数・マネーストック統計などです。"}, {"id": "tf:97744dcf9c", "c": 3, "s": "問題3-1", "st": 1, "q": "日銀短観の業況判断DIは、業況が「良い」と回答した企業の割合から「悪い」と回答した企業の割合を差し引いて求める。", "a": true, "e": "正しい記述です。\n【根拠】プラスなら業況が良いと考える企業が多いことを示します。\n【ひっかけ】日銀短観は年4回公表されます。"}, {"id": "tf:91b8de3111", "c": 3, "s": "問題3-1", "st": 2, "q": "日本銀行が国債を売却する売りオペレーションを行うと、一般に市中の資金量が増加する。", "a": false, "e": "誤りです。\n【根拠】売りオペは市中から資金を吸収するため、資金量が減り、金利の上昇要因となります。\n【ひっかけ】買いオペは資金を供給します。"}, {"id": "tf:ac83fabd92", "c": 3, "s": "問題3-1", "st": 1, "q": "景気動向指数のCIは、構成する指標の動きを合成して、景気変動の大きさやテンポを測るものである。", "a": true, "e": "正しい記述です。\n【根拠】CIの一致指数が上昇していれば、景気は拡張局面にあるとみます。\n【ひっかけ】DIは、改善している指標の割合で、景気の波及度合いを測ります。"}, {"id": "tf:772c7602b5", "c": 3, "s": "問題3-2", "st": 2, "q": "一般に、市場金利が上昇すると既発債券の価格は下落する。", "a": true, "e": "正しい記述です。\n【根拠】金利が上がると、利率の低い既発債の魅力が下がるため、価格が下落します。\n【ひっかけ】金利と債券価格は逆に動きます。"}, {"id": "tf:50b2c5b9c4", "c": 3, "s": "問題3-2", "st": 2, "q": "他の条件が同じであれば、残存期間が短い債券ほど、金利変動に対する価格変動が大きい。", "a": false, "e": "誤りです。\n【根拠】残存期間が長い債券ほど、金利変動に対する価格変動（デュレーション）が大きくなります。\n【ひっかけ】表面利率が低いほど価格変動が大きい点もあわせて押さえます。"}, {"id": "tf:00781adf25", "c": 3, "s": "問題3-2", "st": 2, "q": "格付けがBB（ダブルB）以上の債券は、一般に投資適格債とされる。", "a": false, "e": "誤りです。\n【根拠】投資適格債とされるのは、BBB（トリプルB）以上です。\n【ひっかけ】BB以下は投機的格付債（ハイ・イールド債）とされます。"}, {"id": "tf:8b48cdf276", "c": 3, "s": "問題3-2", "st": 1, "q": "表面利率1.0％、残存期間4年の固定利付債券を額面100円あたり98円で購入した場合の最終利回り（単利）は、約1.53％である。", "a": true, "e": "正しい記述です。\n【根拠】（1.0＋（100－98）÷4）÷98×100＝1.5÷98×100≒1.53％です。\n【ひっかけ】割るのは額面ではなく購入価格です。"}, {"id": "tf:800d4547e7", "c": 3, "s": "問題3-2", "st": 2, "q": "個人向け国債は、いずれの種類も発行後6か月を経過すれば中途換金できる。", "a": false, "e": "誤りです。\n【根拠】個人向け国債は、発行から1年を経過すれば中途換金できます。\n【ひっかけ】中途換金時は、直前2回分の各利子（税引前）相当額×0.79685が差し引かれます。"}, {"id": "tf:e81e368f40", "c": 3, "s": "問題3-2", "st": 1, "q": "個人向け国債の適用利率の下限は、いずれの種類も年0.05％である。", "a": true, "e": "正しい記述です。\n【根拠】変動10年・固定5年・固定3年とも、下限は年0.05％です。\n【ひっかけ】変動10年の利率は半年ごとに見直されます。"}, {"id": "tf:3f75506f96", "c": 3, "s": "問題3-2", "st": 2, "q": "直接利回りは、債券の表面利率を購入価格で除して求める。", "a": true, "e": "正しい記述です。\n【根拠】直接利回り＝表面利率÷購入価格×100です。償還差益は考えません。\n【ひっかけ】最終利回りは、償還差損益を加えて計算します。"}, {"id": "tf:9ca31a97a1", "c": 3, "s": "問題3-2", "st": 2, "q": "応募者利回りとは、既発債を時価で購入し、償還まで保有した場合の利回りをいう。", "a": false, "e": "誤りです。\n【根拠】応募者利回りは、新発債を発行価格で購入し償還まで保有した場合の利回りです。\n【ひっかけ】既発債を購入し償還まで保有した場合は最終利回りです。"}, {"id": "tf:68a3c2636b", "c": 3, "s": "問題3-2", "st": 1, "q": "割引債のデュレーションは、その債券の残存期間と等しい。", "a": true, "e": "正しい記述です。\n【根拠】途中で利息の支払がない割引債は、デュレーション＝残存期間です。\n【ひっかけ】利付債のデュレーションは残存期間より短くなります。"}, {"id": "tf:1995823500", "c": 3, "s": "問題3-2", "st": 2, "q": "スーパー定期預金は、預入金額にかかわらず半年複利で利息が計算される。", "a": false, "e": "誤りです。\n【根拠】300万円未満は単利です。300万円以上の個人は、預入期間3年以上なら半年複利も選べます。\n【ひっかけ】大口定期預金（1,000万円以上）は単利です。"}, {"id": "tf:cbd207a649", "c": 3, "s": "問題3-2", "st": 1, "q": "大口定期預金は、預入金額が1,000万円以上の定期預金で、利息は単利で計算される。", "a": true, "e": "正しい記述です。\n【根拠】大口定期預金の金利は、金融機関との相対で決まることもあります。\n【ひっかけ】スーパー定期の300万円という基準と区別します。"}, {"id": "tf:9fafa52cf8", "c": 3, "s": "問題3-2", "st": 1, "q": "期日指定定期預金は、1年複利で利息が計算され、据置期間経過後は満期日を指定して引き出すことができる。", "a": true, "e": "正しい記述です。\n【根拠】据置期間は1年、最長預入期間は3年です。\n【ひっかけ】スーパー定期預金とは利息の計算方法が異なります。"}, {"id": "tf:f57bfa3215", "c": 3, "s": "問題3-2", "st": 1, "q": "貯蓄預金は、給与の受取口座や公共料金の自動引落し口座として利用することができる。", "a": false, "e": "誤りです。\n【根拠】貯蓄預金は、給与の受取や公共料金の引落しには利用できません。\n【ひっかけ】普通預金との違いが問われます。"}, {"id": "tf:3925814dcb", "c": 3, "s": "問題3-2", "st": 2, "q": "仕組預金は、デリバティブを組み込んだ預金で、原則として中途解約できず、中途解約すると元本割れすることがある。", "a": true, "e": "正しい記述です。\n【根拠】金融機関の判断で満期が延長・短縮されるものもあります。\n【ひっかけ】預金保険制度の対象となるのは、元本部分（及び通常の利息相当分）です。"}, {"id": "tf:43fb26cee6", "c": 3, "s": "問題3-2", "st": 1, "q": "アンダーパー発行の債券を発行時に購入し、償還まで保有すると、償還差益が生じる。", "a": true, "e": "正しい記述です。\n【根拠】額面より低い価格で購入し、額面で償還されるため差益が出ます。\n【ひっかけ】額面より高いオーバーパー発行では償還差損が生じます。"}, {"id": "tf:3e29a30ecd", "c": 3, "s": "問題3-2", "st": 2, "q": "債券の信用格付けが引き下げられると、一般にその債券の価格は上昇する。", "a": false, "e": "誤りです。\n【根拠】格付けが下がると、債券の価格は下落し、利回りは上昇します。\n【ひっかけ】信用度が低い債券ほど、高い利回りが求められます。"}, {"id": "tf:1c3e181cc2", "c": 3, "s": "問題3-2", "st": 1, "q": "個人向け国債（変動10年）の適用利率は、基準金利に0.66を乗じて求め、半年ごとに見直される。", "a": true, "e": "正しい記述です。\n【根拠】下限は年0.05％です。\n【ひっかけ】固定5年は基準金利－0.05％、固定3年は基準金利－0.03％です。"}, {"id": "tf:5cbff479ba", "c": 3, "s": "問題3-2", "st": 1, "q": "個人向け国債は、額面1万円単位で購入することができる。", "a": true, "e": "正しい記述です。\n【根拠】個人向け国債は、1万円単位で毎月発行されます。\n【ひっかけ】購入できるのは個人に限られます。"}, {"id": "tf:46d279c8a1", "c": 3, "s": "問題3-2", "st": 2, "q": "債券を購入した後に売却する場合の所有期間利回りは、（表面利率＋（売却価格－購入価格）÷所有期間）÷購入価格×100で求める。", "a": true, "e": "正しい記述です。\n【根拠】最終利回りの「償還価格」を「売却価格」に、「残存期間」を「所有期間」に置き換えた式です。\n【ひっかけ】分母は購入価格です。"}, {"id": "tf:73a7082604", "c": 3, "s": "問題3-2", "st": 1, "q": "債券の期限前償還リスクとは、償還期限より前に償還されることで、予定していた運用ができなくなるリスクをいう。", "a": true, "e": "正しい記述です。\n【根拠】金利が下がったときに期限前償還されると、低い金利で再運用することになります。\n【ひっかけ】発行体が債務を履行できなくなるのは、信用リスク（デフォルトリスク）です。"}, {"id": "tf:ca27700cc3", "c": 3, "s": "問題3-2", "st": 1, "q": "固定金利の預金は、金利上昇局面で預け入れると、その後の金利上昇の恩恵を受けやすい。", "a": false, "e": "誤りです。\n【根拠】固定金利は、預入後に金利が上昇しても適用金利は変わらず、恩恵を受けられません。\n【ひっかけ】金利上昇局面では、変動金利型や短期の預金が有利とされます。"}, {"id": "tf:d31c137ecf", "c": 3, "s": "問題3-2", "st": 2, "q": "オーバーパーで購入した利付債券を償還まで保有すると、償還差益が生じる。", "a": false, "e": "誤りです。\n【根拠】額面より高い価格（オーバーパー）で購入すると、償還時に差損が生じます。\n【ひっかけ】アンダーパーで購入すると償還差益が生じます。"}, {"id": "tf:c55f6f7cfe", "c": 3, "s": "問題3-2", "st": 2, "q": "他の条件が同じであれば、表面利率が高い債券ほど、金利変動による価格変動は大きい。", "a": false, "e": "誤りです。\n【根拠】表面利率が低い債券ほど、金利変動による価格変動が大きくなります。\n【ひっかけ】残存期間が長い債券ほど、価格変動が大きくなります。"}, {"id": "tf:426291032a", "c": 3, "s": "問題3-2", "st": 1, "q": "個人向け国債（固定5年）は、発行から1年経過すれば、国の買取りによる中途換金ができる。", "a": true, "e": "正しい記述です。\n【根拠】すべての種類で、発行から1年経過すれば中途換金できます。\n【ひっかけ】直前2回分の各利子（税引前）相当額×0.79685が差し引かれます。"}, {"id": "tf:bf72068d3b", "c": 3, "s": "問題3-2", "st": 1, "q": "債券の格付けがAAA（トリプルA）からBB（ダブルB）に引き下げられた場合、その債券は投資適格債に該当しなくなる。", "a": true, "e": "正しい記述です。\n【根拠】BBB以上が投資適格、BB以下は投機的格付です。\n【ひっかけ】格付けの引下げは、一般に価格の下落要因です。"}, {"id": "tf:21f2c9637d", "c": 3, "s": "問題3-3", "st": 2, "q": "PER（株価収益率）は、株価を1株当たり純資産で除して求める。", "a": false, "e": "誤りです。\n【根拠】PERは株価÷1株当たり純利益です。\n【ひっかけ】株価÷1株当たり純資産はPBRです。"}, {"id": "tf:9153548e4a", "c": 3, "s": "問題3-3", "st": 2, "q": "ROE（自己資本利益率）は、当期純利益を自己資本で除して求める。", "a": true, "e": "正しい記述です。\n【根拠】ROE＝当期純利益÷自己資本×100です。\n【ひっかけ】ROA（総資産利益率）は、利益÷総資産で求めます。"}, {"id": "tf:ac193e7cfc", "c": 3, "s": "問題3-3", "st": 2, "q": "上場株式の普通取引は、約定日から起算して3営業日目に受渡しが行われる。", "a": true, "e": "正しい記述です。\n【根拠】約定日を含めて3営業日目に受渡しが行われます。\n【ひっかけ】「4営業日目」としていた時期がありますが、現在は3営業日目です。"}, {"id": "tf:02475a056d", "c": 3, "s": "問題3-3", "st": 2, "q": "日経平均株価は、時価総額加重型の株価指数であり、時価総額の大きい銘柄の影響を受けやすい。", "a": false, "e": "誤りです。\n【根拠】日経平均株価は株価平均型の指数で、値がさ株（株価の高い銘柄）の影響を受けやすいです。\n【ひっかけ】時価総額加重型はTOPIXです。"}, {"id": "tf:647b5b7844", "c": 3, "s": "問題3-3", "st": 1, "q": "株価が1,200円、1株当たり年間配当金が30円の場合、配当利回りは2.5％である。", "a": true, "e": "正しい記述です。\n【根拠】30円÷1,200円×100＝2.5％です。\n【ひっかけ】配当性向（配当÷1株当たり純利益）と区別します。"}, {"id": "tf:395b090735", "c": 3, "s": "問題3-3", "st": 2, "q": "信用取引の委託保証金は、約定代金の30％以上で、かつ30万円以上が必要である。", "a": true, "e": "正しい記述です。\n【根拠】委託保証金率30％以上・最低30万円が必要です。\n【ひっかけ】数字を入れ替える出題に注意します。"}, {"id": "tf:ebe182b27d", "c": 3, "s": "問題3-3", "st": 1, "q": "制度信用取引の返済期限は、最長1年である。", "a": false, "e": "誤りです。\n【根拠】制度信用取引の返済期限は最長6か月です。\n【ひっかけ】一般信用取引は、証券会社と顧客の間で返済期限を決めます。"}, {"id": "tf:443cb89862", "c": 3, "s": "問題3-3", "st": 2, "q": "成行注文は、指値注文に優先して売買が成立する。", "a": true, "e": "正しい記述です。\n【根拠】価格優先の原則により、成行注文は指値注文に優先します。\n【ひっかけ】同じ価格の指値注文は、先に出された注文が優先します（時間優先の原則）。"}, {"id": "tf:685271f874", "c": 3, "s": "問題3-3", "st": 1, "q": "上場株式の配当を受け取るには、権利確定日の2営業日前の権利付最終日までに株式を購入する必要がある。", "a": true, "e": "正しい記述です。\n【根拠】受渡しが約定日から3営業日目のため、権利付最終日に買えば権利確定日に株主名簿に載ります。\n【ひっかけ】権利付最終日の翌営業日を権利落ち日といいます。"}, {"id": "tf:0e4c19e362", "c": 3, "s": "問題3-3", "st": 1, "q": "株式累積投資（るいとう）は、毎月一定額で同じ銘柄を継続的に購入する方法であり、ドル・コスト平均法の効果が期待できる。", "a": true, "e": "正しい記述です。\n【根拠】単元未満でも購入できます。\n【ひっかけ】株価が安いときに多くの株数を買えます。"}, {"id": "tf:0f467ef62d", "c": 3, "s": "問題3-3", "st": 1, "q": "東京証券取引所の市場区分は、プライム市場、スタンダード市場、グロース市場の3つである。", "a": true, "e": "正しい記述です。\n【根拠】2022年4月から、この3区分となっています。\n【ひっかけ】名古屋・福岡・札幌にも証券取引所があります。"}, {"id": "tf:f3f3b63fc8", "c": 3, "s": "問題3-3", "st": 1, "q": "JPX日経インデックス400は、ROEや営業利益などの指標をもとに選ばれた400銘柄で構成される株価指数である。", "a": true, "e": "正しい記述です。\n【根拠】投資者にとって魅力の高い会社で構成されます。\n【ひっかけ】日経平均株価は225銘柄の株価平均型の指数です。"}, {"id": "tf:3b1a409f64", "c": 3, "s": "問題3-3", "st": 1, "q": "ダウ・ジョーンズ工業株価平均（NYダウ）は、米国の代表的な30銘柄で構成される株価指数である。", "a": true, "e": "正しい記述です。\n【根拠】NYダウは株価平均型の指数です。\n【ひっかけ】S&P500は、米国の代表的な500銘柄の時価総額加重型の指数です。"}, {"id": "tf:b560de936a", "c": 3, "s": "問題3-3", "st": 2, "q": "一般に、PERが低いほど、その株式は利益に比べて割安であると判断される。", "a": true, "e": "正しい記述です。\n【根拠】PER＝株価÷1株当たり純利益で、業種によって平均水準が異なります。\n【ひっかけ】PBRが1倍を下回ると、解散価値より株価が低いとされます。"}, {"id": "tf:555590bc18", "c": 3, "s": "問題3-3", "st": 1, "q": "株式分割が行われると、理論上、株価は分割比率に応じて下がる。", "a": true, "e": "正しい記述です。\n【根拠】1株を2株に分割すると、理論上の株価は2分の1になります。\n【ひっかけ】株主の持分の価値は変わりません。"}, {"id": "tf:5829ead4f0", "c": 3, "s": "問題3-3", "st": 2, "q": "指値注文の場合、買い注文では指定した価格以上で、売り注文では指定した価格以下でしか約定しない。", "a": false, "e": "誤りです。\n【根拠】買いの指値は指定した価格以下、売りの指値は指定した価格以上で約定します。\n【ひっかけ】成行注文は値段を指定しません。"}, {"id": "tf:c9516185e0", "c": 3, "s": "問題3-3", "st": 2, "q": "PBRが1倍を上回っている株式は、株価が1株当たり純資産を下回っている。", "a": false, "e": "誤りです。\n【根拠】PBRが1倍を上回っていれば、株価は1株当たり純資産を上回っています。\n【ひっかけ】PBRが1倍を下回ると、解散価値を下回っているとされます。"}, {"id": "tf:82ff0b4c10", "c": 3, "s": "問題3-3", "st": 1, "q": "ROEは、自己資本に対してどれだけの利益を上げたかを示す指標で、一般に高いほど資本効率が良いとされる。", "a": true, "e": "正しい記述です。\n【根拠】ROE＝当期純利益÷自己資本×100です。\n【ひっかけ】ROE＝PBR÷PERの関係もあります。"}, {"id": "tf:20421b1fa7", "c": 3, "s": "問題3-3", "st": 1, "q": "日経平均株価は、東京証券取引所スタンダード市場に上場する銘柄を対象とした株価指数である。", "a": false, "e": "誤りです。\n【根拠】日経平均株価は、プライム市場の代表的な225銘柄が対象です。\n【ひっかけ】TOPIXは、主に旧東証一部の銘柄を引き継いだ時価総額加重型の指数です。"}, {"id": "tf:8d0ef688b4", "c": 3, "s": "問題3-3", "st": 1, "q": "上場株式の単元株数は、原則として100株に統一されている。", "a": true, "e": "正しい記述です。\n【根拠】売買は単元株数の整数倍で行います。\n【ひっかけ】単元未満株を扱う証券会社もあります。"}, {"id": "tf:8b479915b5", "c": 3, "s": "問題3-4", "st": 2, "q": "信託財産留保額は、投資信託の保有期間中、信託財産から日々差し引かれる費用である。", "a": false, "e": "誤りです。\n【根拠】保有期間中に差し引かれるのは信託報酬です。信託財産留保額は、解約時に差し引かれます。\n【ひっかけ】信託財産留保額は信託財産に残り、残った受益者に還元されます。"}, {"id": "tf:80f0b16b58", "c": 3, "s": "問題3-4", "st": 2, "q": "追加型株式投資信託の分配金のうち、元本払戻金（特別分配金）は非課税である。", "a": true, "e": "正しい記述です。\n【根拠】元本払戻金は元本の一部の払戻しとされ、非課税です。受け取ると個別元本は下がります。\n【ひっかけ】普通分配金は配当所得として課税されます。"}, {"id": "tf:e149231a7f", "c": 3, "s": "問題3-4", "st": 1, "q": "ETF（上場投資信託）は、証券取引所に上場しているため指値注文や成行注文ができるが、信用取引はできない。", "a": false, "e": "誤りです。\n【根拠】ETFは上場株式と同様に信用取引もできます。\n【ひっかけ】非上場の投資信託は、1日1回算出される基準価額で取引します。"}, {"id": "tf:dabc73f042", "c": 3, "s": "問題3-4", "st": 2, "q": "NISAのつみたて投資枠の年間投資上限額は120万円、成長投資枠の年間投資上限額は240万円である。", "a": true, "e": "正しい記述です。\n【根拠】両方の枠を併用でき、年間合計360万円まで投資できます。\n【ひっかけ】非課税保有限度額は生涯1,800万円（うち成長投資枠1,200万円）です。"}, {"id": "tf:749359d3f4", "c": 3, "s": "問題3-4", "st": 2, "q": "NISA口座で保有する上場株式を売却して生じた損失は、特定口座で生じた譲渡益と損益通算することができる。", "a": false, "e": "誤りです。\n【根拠】NISA口座の損失は、損益通算も繰越控除もできません。\n【ひっかけ】利益が非課税である代わりに、損失はなかったものとされます。"}, {"id": "tf:e3d9656cee", "c": 3, "s": "問題3-4", "st": 1, "q": "NISAの非課税保有限度額は、保有商品を売却すると、その翌年以降に売却した商品の簿価分の枠が再利用できる。", "a": true, "e": "正しい記述です。\n【根拠】非課税保有限度額は買付額（簿価）で管理され、売却した分は翌年以降に枠が復活します。\n【ひっかけ】年間投資枠（360万円）までという制限は残ります。"}, {"id": "tf:a3c310d12c", "c": 3, "s": "問題3-4", "st": 2, "q": "ドル・コスト平均法により毎月一定額ずつ投資信託を購入すると、毎月一定口数ずつ購入する場合に比べ、平均購入単価を低く抑える効果が期待できる。", "a": true, "e": "正しい記述です。\n【根拠】価格が安いときに多く、高いときに少なく買うことになるためです。\n【ひっかけ】一定口数ずつ買う方法ではこの効果はありません。"}, {"id": "tf:c33f2db7dc", "c": 3, "s": "問題3-4", "st": 1, "q": "投資信託の交付目論見書は、顧客から請求があった場合にのみ交付すればよい。", "a": false, "e": "誤りです。\n【根拠】交付目論見書は、投資家に必ず交付しなければなりません（あらかじめ又は同時に）。\n【ひっかけ】請求があった場合に交付するのは請求目論見書です。"}, {"id": "tf:d6b3d6b02f", "c": 3, "s": "問題3-4", "st": 1, "q": "上場投資信託（ETF）の分配金は、配当所得として課税される。", "a": true, "e": "正しい記述です。\n【根拠】ETFの分配金は上場株式の配当と同様、配当所得です。\n【ひっかけ】J-REITと同様に、配当控除の対象にならないETFもあります。"}, {"id": "tf:9d57542d96", "c": 3, "s": "問題3-4", "st": 2, "q": "契約型（委託者指図型）投資信託において、信託財産の保管・管理を行うのは受託会社（信託銀行）である。", "a": true, "e": "正しい記述です。\n【根拠】委託会社（運用会社）が運用の指図を行い、受託会社が保管・管理を行い、販売会社が販売を行います。\n【ひっかけ】受託会社の倒産でも信託財産は分別管理されているため保護されます。"}, {"id": "tf:81e1003d84", "c": 3, "s": "問題3-4", "st": 1, "q": "投資信託の基準価額は、原則として1日1回算出される。", "a": true, "e": "正しい記述です。\n【根拠】基準価額は、純資産総額÷受益権口数で計算します。\n【ひっかけ】ETFは取引所で時々刻々と価格が変わります。"}, {"id": "tf:c2eb744529", "c": 3, "s": "問題3-4", "st": 1, "q": "ブラインド方式とは、投資信託の購入・換金の申込時点で、適用される基準価額がわからない方式をいう。", "a": true, "e": "正しい記述です。\n【根拠】申込日の当日の基準価額（取引終了後に算出）で約定することが多いため、申込時にはわかりません。\n【ひっかけ】公正な取引のための仕組みです。"}, {"id": "tf:9fec6fa15a", "c": 3, "s": "問題3-4", "st": 2, "q": "公社債投資信託は、株式を一切組み入れることができない。", "a": true, "e": "正しい記述です。\n【根拠】公社債投資信託は、株式を組み入れられません。\n【ひっかけ】株式を組み入れていなくても、組み入れられる約款なら株式投資信託です。"}, {"id": "tf:45d9866dd7", "c": 3, "s": "問題3-4", "st": 1, "q": "株式投資信託は、約款上株式を組み入れることができる投資信託であり、実際に株式を組み入れていなくても株式投資信託に分類される。", "a": true, "e": "正しい記述です。\n【根拠】分類は約款で決まります。\n【ひっかけ】公社債投資信託との違いが問われます。"}, {"id": "tf:543553be01", "c": 3, "s": "問題3-4", "st": 2, "q": "ボトムアップ・アプローチは、個別企業の調査・分析をもとに銘柄を選択して、ポートフォリオを構築する手法である。", "a": true, "e": "正しい記述です。\n【根拠】マクロ経済の分析から配分を決めるのはトップダウン・アプローチです。\n【ひっかけ】両者の入れ替えに注意します。"}, {"id": "tf:50733b79de", "c": 3, "s": "問題3-4", "st": 1, "q": "購入時手数料がかからない投資信託を、ノーロード・ファンドという。", "a": true, "e": "正しい記述です。\n【根拠】ノーロード・ファンドでも、信託報酬はかかります。\n【ひっかけ】信託報酬は保有期間中ずっとかかる費用です。"}, {"id": "tf:769a9783a9", "c": 3, "s": "問題3-4", "st": 1, "q": "J-REIT（上場不動産投資信託）は、投資法人の形態をとる会社型の投資信託である。", "a": true, "e": "正しい記述です。\n【根拠】J-REITは投資法人が発行する投資証券を取引所で売買します。\n【ひっかけ】利益の90％超を分配するなどの要件を満たすと、実質的に法人税がかかりません。"}, {"id": "tf:9f4bb4caee", "c": 3, "s": "問題3-4", "st": 2, "q": "NISAの成長投資枠では、毎月分配型の投資信託を購入することはできない。", "a": true, "e": "正しい記述です。\n【根拠】成長投資枠では、信託期間20年未満・毎月分配型・高レバレッジ型の投資信託は対象外です。\n【ひっかけ】つみたて投資枠は、一定の要件を満たす投資信託に限られます。"}, {"id": "tf:4e0b853a0d", "c": 3, "s": "問題3-4", "st": 2, "q": "NISAの年間投資枠のうち、その年に使わなかった部分は翌年に繰り越すことができる。", "a": false, "e": "誤りです。\n【根拠】使わなかった年間投資枠は、翌年に繰り越せません。\n【ひっかけ】非課税保有期間は無期限です。"}, {"id": "tf:79af5e9274", "c": 3, "s": "問題3-4", "st": 1, "q": "NISA口座で上場株式の配当金を非課税で受け取るには、配当金の受取方法として株式数比例配分方式を選択する必要がある。", "a": true, "e": "正しい記述です。\n【根拠】証券口座で受け取る株式数比例配分方式でなければ、配当金は課税されます。\n【ひっかけ】郵便局などで受け取る方式では非課税になりません。"}, {"id": "tf:6adb087738", "c": 3, "s": "問題3-4", "st": 1, "q": "NISAの非課税保有期間は、無期限である。", "a": true, "e": "正しい記述です。\n【根拠】2024年からのNISAは、非課税保有期間が無期限です。\n【ひっかけ】旧一般NISAは5年、旧つみたてNISAは20年でした。"}, {"id": "tf:e0849a55b9", "c": 3, "s": "問題3-4", "st": 2, "q": "追加型株式投資信託で、分配金の支払後の基準価額が受益者の個別元本を下回る場合、その下回る部分の分配金は普通分配金として課税される。", "a": false, "e": "誤りです。\n【根拠】個別元本を下回る部分は元本払戻金（特別分配金）として非課税です。\n【ひっかけ】受け取った後は、個別元本がその分だけ下がります。"}, {"id": "tf:5819bed8d2", "c": 3, "s": "問題3-4", "st": 1, "q": "投資信託の信託報酬は、販売会社・委託会社・受託会社に配分される。", "a": true, "e": "正しい記述です。\n【根拠】信託報酬は、運用・管理・販売の対価として3者で分けます。\n【ひっかけ】信託報酬は保有期間中にかかります。"}, {"id": "tf:0b08b4af0e", "c": 3, "s": "問題3-4", "st": 2, "q": "インデックス型（パッシブ運用）の投資信託は、一般にアクティブ運用の投資信託より信託報酬が高い。", "a": false, "e": "誤りです。\n【根拠】インデックス型は、銘柄調査の費用が少ないため、一般に信託報酬が低くなります。\n【ひっかけ】アクティブ運用は、調査・分析の費用がかかるため信託報酬が高めです。"}, {"id": "tf:849078317f", "c": 3, "s": "問題3-4", "st": 2, "q": "ETFは、非上場の投資信託と同様に、1日1回算出される基準価額でしか売買できない。", "a": false, "e": "誤りです。\n【根拠】ETFは取引所に上場しており、取引時間中の市場価格で売買できます。\n【ひっかけ】指値注文・成行注文・信用取引もできます。"}, {"id": "tf:2d55176e75", "c": 3, "s": "問題3-4", "st": 1, "q": "NISA口座で保有している投資信託を売却した場合、売却した年の年間投資枠が復活する。", "a": false, "e": "誤りです。\n【根拠】非課税保有限度額は、売却した翌年以降に復活します。年間投資枠は復活しません。\n【ひっかけ】生涯で1,800万円という非課税保有限度額で管理されます。"}, {"id": "tf:41f5133823", "c": 3, "s": "問題3-4", "st": 2, "q": "NISAのつみたて投資枠と成長投資枠を合わせた年間投資上限額は、360万円である。", "a": true, "e": "正しい記述です。\n【根拠】つみたて投資枠120万円と成長投資枠240万円の合計です。\n【ひっかけ】非課税保有限度額は1,800万円（うち成長投資枠1,200万円）です。"}, {"id": "tf:8d6d293780", "c": 3, "s": "問題3-5", "st": 2, "q": "2資産間の相関係数が－1である場合、分散投資によるリスク低減効果は得られない。", "a": false, "e": "誤りです。\n【根拠】相関係数が－1のとき、リスク低減効果は最大となります。リスク低減効果がないのは＋1のときです。\n【ひっかけ】相関係数は－1から＋1の範囲の値をとります。"}, {"id": "tf:eec605c607", "c": 3, "s": "問題3-5", "st": 1, "q": "シャープ・レシオは、ポートフォリオの収益率から無リスク資産利子率を差し引いた値を、標準偏差で除して求める。", "a": true, "e": "正しい記述です。\n【根拠】値が大きいほど、とったリスクに見合ったリターンを得られたと評価されます。\n【ひっかけ】分母は標準偏差（リスク）であり、ベータではありません。"}, {"id": "tf:229c9f4443", "c": 3, "s": "問題3-5", "st": 2, "q": "オプション取引において、オプションの買い手の最大損失は、支払ったプレミアムに限定される。", "a": true, "e": "正しい記述です。\n【根拠】買い手は不利なときに権利を放棄すればよいため、損失はプレミアムに限定されます。\n【ひっかけ】売り手の損失は、コールの売りでは無限定となりえます。"}, {"id": "tf:ffbf3ea991", "c": 3, "s": "問題3-5", "st": 2, "q": "TTSは、顧客が外貨を円に換える際に適用される為替レートである。", "a": false, "e": "誤りです。\n【根拠】TTSは顧客が円を外貨に換える（銀行が外貨を売る）ときのレートです。\n【ひっかけ】外貨を円に換えるときはTTBです。"}, {"id": "tf:ec6ddde00d", "c": 3, "s": "問題3-5", "st": 1, "q": "外貨預金の為替差益は、雑所得として総合課税の対象となる。", "a": true, "e": "正しい記述です。\n【根拠】外貨預金の為替差益は雑所得（総合課税）です。\n【ひっかけ】利子は源泉分離課税（20.315％）です。"}, {"id": "tf:238c1e2db2", "c": 3, "s": "問題3-5", "st": 2, "q": "システマティック・リスク（市場リスク）は、銘柄を分散することで低減できる。", "a": false, "e": "誤りです。\n【根拠】分散投資で低減できるのは、個別銘柄に固有のアンシステマティック・リスクです。\n【ひっかけ】システマティック・リスクは、市場全体に共通するため分散しても消えません。"}, {"id": "tf:aa1e43d755", "c": 3, "s": "問題3-5", "st": 1, "q": "オプションのプレミアムは、他の条件が同じであれば、満期までの残存期間が長いほど高くなる。", "a": true, "e": "正しい記述です。\n【根拠】残存期間が長いほど、権利行使で利益が出る可能性が高まるためです。\n【ひっかけ】ボラティリティ（価格変動率）が高いほど、プレミアムは高くなります。"}, {"id": "tf:8badce9615", "c": 3, "s": "問題3-5", "st": 1, "q": "金利スワップ取引では、通常、元本の交換は行われない。", "a": true, "e": "正しい記述です。\n【根拠】金利スワップは、同じ通貨で固定金利と変動金利などの利息部分だけを交換します。\n【ひっかけ】通貨スワップでは、元本の交換が行われます。"}, {"id": "tf:cffacf0282", "c": 3, "s": "問題3-5", "st": 2, "q": "サムライ債とは、外国の発行体が日本国内で発行する円建ての債券である。", "a": true, "e": "正しい記述です。\n【根拠】サムライ債は円建てのため、為替リスクはありません（発行体の信用リスクはあります）。\n【ひっかけ】外貨建てで日本国内で発行するものはショーグン債です。"}, {"id": "tf:1cb45ddfa0", "c": 3, "s": "問題3-5", "st": 2, "q": "デュアルカレンシー債は、払込みと利払いが円で行われ、償還が外貨で行われる債券である。", "a": true, "e": "正しい記述です。\n【根拠】償還時の為替レートによって、円換算の償還金額が変わります。\n【ひっかけ】利払いが外貨で行われるのはリバース・デュアルカレンシー債です。"}, {"id": "tf:3252abef56", "c": 3, "s": "問題3-5", "st": 1, "q": "外貨建てMMFは、購入時手数料はかからないが、換金時には解約手数料がかかる。", "a": false, "e": "誤りです。\n【根拠】外貨建てMMFは、購入時・換金時の手数料がかかりません（為替手数料はかかります）。\n【ひっかけ】原則としていつでも換金できます。"}, {"id": "tf:4d791d7022", "c": 3, "s": "問題3-5", "st": 2, "q": "外貨預金の預入時より円安になってから払い戻すと、為替差益が生じる。", "a": true, "e": "正しい記述です。\n【根拠】円安になると、同じ外貨をより多くの円に換えられます。\n【ひっかけ】為替手数料を考えると、わずかな円安では差益が出ないこともあります。"}, {"id": "tf:28280d74f0", "c": 3, "s": "問題3-5", "st": 1, "q": "TTMは、TTSとTTBの中間のレートである。", "a": true, "e": "正しい記述です。\n【根拠】TTMは仲値（中値）といい、TTSとTTBの基準となるレートです。\n【ひっかけ】米ドルの為替手数料は、通常片道1円程度です。"}, {"id": "tf:1c6a5f2d0b", "c": 3, "s": "問題3-5", "st": 1, "q": "アメリカンタイプのオプションは、満期日にだけ権利を行使することができる。", "a": false, "e": "誤りです。\n【根拠】アメリカンタイプは満期日までいつでも権利を行使でき、満期日にだけ行使できるのはヨーロピアンタイプです。\n【ひっかけ】名前と内容の入れ替えに注意します。"}, {"id": "tf:a55260d79c", "c": 3, "s": "問題3-5", "st": 2, "q": "プット・オプションの買いは、原資産の価格の下落に備えるヘッジとして利用できる。", "a": true, "e": "正しい記述です。\n【根拠】プット（売る権利）を買っておくと、価格が下がっても決められた価格で売れます。\n【ひっかけ】コール・オプションの買いは、価格上昇で利益が出ます。"}, {"id": "tf:7640df99be", "c": 3, "s": "問題3-5", "st": 2, "q": "保有する株式の値下がりリスクを回避するために、株価指数先物を買うことを売りヘッジという。", "a": false, "e": "誤りです。\n【根拠】値下がりに備えて先物を売ることが売りヘッジです。\n【ひっかけ】将来購入する予定の資産の値上がりに備えて先物を買うことを買いヘッジといいます。"}, {"id": "tf:4c35880914", "c": 3, "s": "問題3-5", "st": 1, "q": "先物取引は証拠金を差し入れて取引するため、少ない資金で大きな金額の取引を行うことができる。", "a": true, "e": "正しい記述です。\n【根拠】これをレバレッジ効果といいます。損失も大きくなる可能性があります。\n【ひっかけ】差金決済で取引を終えることができます。"}, {"id": "tf:3c76e0a74d", "c": 3, "s": "問題3-5", "st": 1, "q": "通貨スワップでは、通常、元本の交換が行われる。", "a": true, "e": "正しい記述です。\n【根拠】通貨スワップは、異なる通貨の元本と金利を交換します。\n【ひっかけ】金利スワップは、元本の交換を行いません。"}, {"id": "tf:cefba39e64", "c": 3, "s": "問題3-5", "st": 1, "q": "アセットアロケーションとは、運用資金を株式・債券・不動産などの資産クラスにどのように配分するかを決めることである。", "a": true, "e": "正しい記述です。\n【根拠】運用成果は、個別銘柄の選択より資産配分の影響が大きいとされます。\n【ひっかけ】値動きで配分比率がずれたときに元に戻すことをリバランスといいます。"}, {"id": "tf:e5cc8340fe", "c": 3, "s": "問題3-5", "st": 2, "q": "ポートフォリオのリスクは、組み入れた各資産のリスク（標準偏差）を組入比率で加重平均した値に等しい。", "a": false, "e": "誤りです。\n【根拠】相関係数が1未満であれば、ポートフォリオのリスクは各資産のリスクの加重平均より小さくなります。\n【ひっかけ】期待収益率は加重平均で求められます。リスクとの違いが頻出です。"}, {"id": "tf:e4ab845f3e", "c": 3, "s": "問題3-5", "st": 1, "q": "標準偏差が大きい資産ほど、リターンのばらつきが大きく、リスクが高いとされる。", "a": true, "e": "正しい記述です。\n【根拠】標準偏差はリスクの大きさを表す指標です。\n【ひっかけ】期待収益率±標準偏差の範囲に、約68％の確率で収まるとされます（正規分布の場合）。"}, {"id": "tf:706f2137cf", "c": 3, "s": "問題3-5", "st": 2, "q": "外貨預金の預入時より払戻時に円高になっていると、為替差益が生じる。", "a": false, "e": "誤りです。\n【根拠】円高になると、同じ外貨を少ない円にしか換えられず、為替差損が生じます。\n【ひっかけ】円安になると為替差益が生じます。"}, {"id": "tf:d8d893698b", "c": 3, "s": "問題3-5", "st": 1, "q": "外貨預金は、為替相場の変動により円換算の元本が預入時を下回ることがある。", "a": true, "e": "正しい記述です。\n【根拠】外貨預金には為替リスクがあります。\n【ひっかけ】預金保険制度の対象外でもあります。"}, {"id": "tf:73d3c71902", "c": 3, "s": "問題3-5", "st": 2, "q": "2資産の相関係数が＋1の場合、2資産を組み合わせることで分散投資によるリスク低減効果が最大となる。", "a": false, "e": "誤りです。\n【根拠】相関係数が＋1の場合は、リスク低減効果はありません。最大になるのは－1のときです。\n【ひっかけ】相関係数は－1から＋1の値をとります。"}, {"id": "tf:d761482be7", "c": 3, "s": "問題3-5", "st": 1, "q": "シャープ・レシオの値が大きいほど、リスクに見合った効率的な運用がなされたと評価される。", "a": true, "e": "正しい記述です。\n【根拠】（収益率－無リスク資産利子率）÷標準偏差で求めます。\n【ひっかけ】同じ収益率でも、リスクが小さいほうが高く評価されます。"}, {"id": "tf:1682210362", "c": 3, "s": "問題3-5", "st": 2, "q": "オプション取引において、コール・オプションの売り手の損失は、受け取ったプレミアムに限定される。", "a": false, "e": "誤りです。\n【根拠】コールの売り手は、原資産価格が上がるほど損失が膨らみ、損失は無限定となりえます。\n【ひっかけ】損失がプレミアムに限定されるのは、オプションの買い手です。"}, {"id": "tf:8d8e8c9eca", "c": 3, "s": "問題3-5", "st": 1, "q": "先物取引は、原則として取引所で行われる取引であり、取引条件が標準化されている。", "a": true, "e": "正しい記述です。\n【根拠】先物取引は取引所取引で、限月や取引単位が決められています。\n【ひっかけ】先渡取引（フォワード）は相対取引です。"}, {"id": "tf:eb98845e0b", "c": 3, "s": "問題3-6", "st": 2, "q": "決済用預金は、預金保険制度により全額が保護される。", "a": true, "e": "正しい記述です。\n【根拠】無利息・要求払い・決済サービスの提供の3要件を満たす決済用預金は、全額保護されます。\n【ひっかけ】その他の預金は元本1,000万円までとその利息等が保護されます。"}, {"id": "tf:b4a0c2c50d", "c": 3, "s": "問題3-6", "st": 2, "q": "外貨預金は、預金保険制度により元本1,000万円までとその利息等が保護される。", "a": false, "e": "誤りです。\n【根拠】外貨預金は預金保険制度の保護の対象外です。\n【ひっかけ】譲渡性預金も対象外です。"}, {"id": "tf:128fdc5f62", "c": 3, "s": "問題3-6", "st": 1, "q": "銀行で購入した投資信託は、日本投資者保護基金の補償の対象となる。", "a": false, "e": "誤りです。\n【根拠】銀行は日本投資者保護基金の会員ではないため、補償の対象外です。\n【ひっかけ】投資信託は分別管理されているため、販売会社が破綻しても通常は財産が保全されます。"}, {"id": "tf:6c5fcb951c", "c": 3, "s": "問題3-6", "st": 1, "q": "消費者契約法による保護の対象には、法人は含まれない。", "a": true, "e": "正しい記述です。\n【根拠】消費者契約法の「消費者」は個人（事業として契約する場合を除く）です。\n【ひっかけ】金融サービス提供法の重要事項の説明義務は、原則として個人・法人とも対象です（特定顧客を除く）。"}, {"id": "tf:904303714f", "c": 3, "s": "問題3-6", "st": 2, "q": "ゆうちょ銀行の貯金は、預金保険制度の保護の対象となる。", "a": true, "e": "正しい記述です。\n【根拠】ゆうちょ銀行も預金保険制度の対象です。\n【ひっかけ】外国銀行の在日支店は対象外です。"}, {"id": "tf:5c0a1f58d4", "c": 3, "s": "問題3-6", "st": 1, "q": "日本国内の銀行の海外支店の預金は、預金保険制度の保護の対象となる。", "a": false, "e": "誤りです。\n【根拠】国内銀行の海外支店の預金は対象外です。\n【ひっかけ】外国銀行の在日支店の預金も対象外です。"}, {"id": "tf:ac19723b89", "c": 3, "s": "問題3-6", "st": 1, "q": "金融機関が合併した場合、合併後1年間は、預金保険制度による保護の上限が合併前の金融機関の数に応じて適用される。", "a": true, "e": "正しい記述です。\n【根拠】2行が合併した場合、1年間は元本2,000万円まで保護されます。\n【ひっかけ】1年を過ぎると、1金融機関として1,000万円までになります。"}, {"id": "tf:f680318271", "c": 3, "s": "問題3-6", "st": 1, "q": "証券会社は、日本投資者保護基金に加入しなければならない。", "a": true, "e": "正しい記述です。\n【根拠】国内で業務を行う証券会社は、日本投資者保護基金への加入が義務付けられています。\n【ひっかけ】銀行は会員ではありません。"}, {"id": "tf:faee00a6a3", "c": 3, "s": "問題3-6", "st": 2, "q": "金融サービス提供法では、金融商品販売業者等が、不確実な事項について断定的判断を提供することを禁止している。", "a": true, "e": "正しい記述です。\n【根拠】「必ず値上がりします」などと説明することは禁止されています。\n【ひっかけ】違反して顧客が損害を被った場合、業者は損害賠償責任を負います。"}, {"id": "tf:84675e0496", "c": 3, "s": "問題3-6", "st": 1, "q": "金融商品取引業者は、顧客が特定投資家（プロ）である場合でも、契約締結前交付書面を必ず交付しなければならない。", "a": false, "e": "誤りです。\n【根拠】特定投資家（プロ）との取引では、契約締結前交付書面の交付義務など一部の行為規制が適用されません。\n【ひっかけ】一般投資家（アマ）が相手の場合は交付が必要です。"}, {"id": "tf:9b9e726f4a", "c": 3, "s": "問題3-6", "st": 1, "q": "消費者契約法に基づく取消権は、追認をすることができる時から1年間行使しないときは、時効により消滅する。", "a": true, "e": "正しい記述です。\n【根拠】契約締結の時から5年経過した場合も消滅します。\n【ひっかけ】数字の入れ替えに注意します。"}, {"id": "tf:7cc15e10b1", "c": 3, "s": "問題3-6", "st": 1, "q": "金融機関は、犯罪収益移転防止法により、200万円を超える現金の受払いなど一定の取引の際に、顧客の本人確認（取引時確認）を行わなければならない。", "a": true, "e": "正しい記述です。\n【根拠】口座開設時なども取引時確認が必要です。\n【ひっかけ】10万円を超える現金の振込みも対象です。"}, {"id": "tf:4de76ae389", "c": 3, "s": "問題3-6", "st": 2, "q": "当座預金は、預金保険制度により元本1,000万円までとその利息等が保護される。", "a": false, "e": "誤りです。\n【根拠】当座預金は決済用預金に該当するため、全額保護されます。\n【ひっかけ】利息の付く普通預金は、元本1,000万円までとその利息等です。"}, {"id": "tf:7f99dba508", "c": 3, "s": "問題3-6", "st": 1, "q": "日本投資者保護基金は、証券会社が破綻し、分別管理の不備によって顧客資産が返還されない場合に、1人あたり1,000万円まで補償する。", "a": true, "e": "正しい記述です。\n【根拠】証券会社は顧客資産を分別管理する義務があり、通常は破綻しても資産は返還されます。\n【ひっかけ】補償の対象外の商品もあります。"}, {"id": "tf:158e3f795e", "c": 3, "s": "問題3-6", "st": 1, "q": "金融サービス提供法は、法人顧客も保護の対象としている。", "a": true, "e": "正しい記述です。\n【根拠】金融サービス提供法は、原則として個人・法人の両方が対象です（特定顧客を除く）。\n【ひっかけ】消費者契約法は、個人（消費者）だけが対象です。"}, {"id": "tf:7869248fe5", "c": 3, "s": "問題3-6", "st": 2, "q": "金融商品取引法の適合性の原則とは、顧客の知識・経験・財産の状況・投資目的に照らして不適当な勧誘を行ってはならないとするものである。", "a": true, "e": "正しい記述です。\n【根拠】適合性の原則は、金融商品取引業者等の行為規制のひとつです。\n【ひっかけ】虚偽の説明や断定的判断の提供も禁止されています。"}, {"id": "tf:0d19c035bc", "c": 3, "s": "問題3-7", "st": 2, "q": "外貨建MMFの為替差益は、非課税である。", "a": false, "e": "誤りです。\n【根拠】2016年以後、外貨建MMFは特定公社債等として扱われ、為替差益を含む譲渡益は申告分離課税の対象です。\n【ひっかけ】以前は非課税だったことを使った出題です。"}, {"id": "tf:93a0703569", "c": 3, "s": "問題3-7", "st": 2, "q": "預入時に満期時の為替レートを予約した外貨定期預金の為替差益は、源泉分離課税の対象となる。", "a": true, "e": "正しい記述です。\n【根拠】預入時に為替予約を付けた場合の為替差益は、利子とともに20.315％の源泉分離課税です。\n【ひっかけ】予約を付けない場合の為替差益は雑所得（総合課税）です。"}, {"id": "tf:e83c615dfd", "c": 3, "s": "問題3-7", "st": 2, "q": "上場株式等の配当について申告分離課税を選択した場合、配当控除の適用を受けることができる。", "a": false, "e": "誤りです。\n【根拠】配当控除は総合課税を選択した場合に限り受けられます。\n【ひっかけ】申告分離課税を選ぶと、上場株式等の譲渡損失と損益通算できます。"}, {"id": "tf:17c57d2c13", "c": 3, "s": "問題3-7", "st": 2, "q": "特定口座の「源泉徴収あり」を選択した場合、上場株式の譲渡益について原則として確定申告は不要である。", "a": true, "e": "正しい記述です。\n【根拠】源泉徴収で課税が完了するため、確定申告は不要です（申告することもできます）。\n【ひっかけ】他の口座との損益通算や繰越控除を受けるには確定申告が必要です。"}, {"id": "tf:89cf4e4bdf", "c": 3, "s": "問題3-7", "st": 1, "q": "特定公社債の利子は、上場株式等の譲渡損失と損益通算することができる。", "a": true, "e": "正しい記述です。\n【根拠】特定公社債の利子・譲渡損益は、上場株式等と同じグループで損益通算できます。\n【ひっかけ】預貯金の利子は源泉分離課税のため、損益通算できません。"}, {"id": "tf:1e868cd2c9", "c": 3, "s": "問題3-7", "st": 1, "q": "個人が保有期間5年超の金地金を売却した場合、譲渡所得の金額の2分の1が総合課税の対象となる。", "a": true, "e": "正しい記述です。\n【根拠】金地金の売却益は総合課税の譲渡所得で、長期（5年超）なら2分の1が課税対象です。\n【ひっかけ】上場株式のような申告分離課税ではありません。"}, {"id": "tf:9f9fcbb281", "c": 3, "s": "問題3-7", "st": 2, "q": "上場株式の配当について総合課税を選択した場合、配当控除の適用を受けることができる。", "a": true, "e": "正しい記述です。\n【根拠】配当控除は税額控除で、課税総所得金額等が1,000万円以下の部分は配当所得の10％（所得税）です。\n【ひっかけ】申告分離課税や申告不要を選んだ場合は、配当控除を受けられません。"}, {"id": "tf:ab8628025f", "c": 3, "s": "問題3-7", "st": 1, "q": "発行済株式の3％以上を保有する大口株主等が受ける上場株式の配当は、申告分離課税を選択することができる。", "a": false, "e": "誤りです。\n【根拠】大口株主等の配当は、総合課税の対象です（少額配当を除き申告不要も選べません）。\n【ひっかけ】源泉徴収は20.42％（所得税のみ）です。"}, {"id": "tf:b710fbf8d5", "c": 3, "s": "問題3-7", "st": 2, "q": "公社債投資信託の分配金は、配当所得として課税される。", "a": false, "e": "誤りです。\n【根拠】公社債投資信託の分配金は利子所得です。\n【ひっかけ】株式投資信託の普通分配金は配当所得です。"}, {"id": "tf:f57bacb56d", "c": 3, "s": "問題3-7", "st": 2, "q": "特定口座で「源泉徴収なし」を選択した場合、上場株式の譲渡益について、原則として確定申告が必要である。", "a": true, "e": "正しい記述です。\n【根拠】証券会社が作成する年間取引報告書をもとに申告します。\n【ひっかけ】「源泉徴収あり」を選択すると、原則として確定申告は不要です。"}, {"id": "tf:9e6dabc717", "c": 3, "s": "問題3-7", "st": 1, "q": "外貨預金の為替差損は、他の雑所得と通算することができる。", "a": true, "e": "正しい記述です。\n【根拠】外貨預金の為替差損益は雑所得なので、他の雑所得とは通算できます。\n【ひっかけ】雑所得の損失は、給与所得など他の所得と損益通算できません。"}, {"id": "tf:ccd0340226", "c": 3, "s": "問題3-7", "st": 1, "q": "割引債の償還差益は、申告分離課税の対象となる。", "a": true, "e": "正しい記述です。\n【根拠】2016年以後、特定公社債である割引債の償還差益は20.315％の申告分離課税です。\n【ひっかけ】償還時に源泉徴収されます。"}, {"id": "tf:ce5b24362c", "c": 3, "s": "問題3-7", "st": 1, "q": "外国株式の配当について外国で課税された税額は、確定申告により外国税額控除を受けることができる。", "a": true, "e": "正しい記述です。\n【根拠】二重課税を調整するための制度です。総合課税又は申告分離課税で申告した場合に適用できます。\n【ひっかけ】外国株式の配当には、配当控除は適用されません。"}, {"id": "tf:1f7333a6dc", "c": 3, "s": "問題3-7", "st": 2, "q": "上場株式の譲渡益は、所得税・復興特別所得税15.315％と住民税5％の合計20.315％の申告分離課税である。", "a": true, "e": "正しい記述です。\n【根拠】特定口座（源泉徴収あり）なら源泉徴収で課税が完了します。\n【ひっかけ】非上場株式の譲渡益も申告分離課税（20.315％）です。"}, {"id": "tf:48bab122e0", "c": 3, "s": "問題3-7", "st": 2, "q": "上場株式等の譲渡損失の繰越控除を受けるためには、損失が生じた年に確定申告をするだけでよく、翌年以後は確定申告をする必要はない。", "a": false, "e": "誤りです。\n【根拠】損失が生じた年だけでなく、翌年以後も連続して確定申告をする必要があります。\n【ひっかけ】取引がない年も、繰越のための申告が必要です。"}, {"id": "tf:d9771f5125", "c": 3, "s": "問題3-7", "st": 2, "q": "総合課税を選択した上場株式の配当所得については、上場株式の譲渡損失と損益通算することができる。", "a": false, "e": "誤りです。\n【根拠】上場株式の譲渡損失と損益通算できるのは、申告分離課税を選択した配当所得です。\n【ひっかけ】総合課税を選ぶと配当控除を受けられますが、損益通算はできません。"}, {"id": "tf:1e156e447b", "c": 3, "s": "問題3-7", "st": 1, "q": "外貨預金の利子は、20.315％の源泉分離課税の対象となる。", "a": true, "e": "正しい記述です。\n【根拠】国内の預金の利子と同じく、源泉分離課税です。\n【ひっかけ】為替差益は原則として雑所得（総合課税）です。"}, {"id": "tf:2edbcd9d6e", "c": 4, "s": "問題4-1", "st": 2, "q": "所得税は、個人の所得を10種類に区分して計算し、総合課税の対象となる所得には超過累進税率が適用される。", "a": true, "e": "正しい記述です。\n【根拠】所得は10種類に区分され、総合課税の所得には5％〜45％の超過累進税率が適用されます。\n【ひっかけ】退職所得・山林所得や土地等の譲渡所得は分離課税です。"}, {"id": "tf:8de71b6e6a", "c": 4, "s": "問題4-1", "st": 1, "q": "給与所得者が勤務先から受け取る通勤手当は、金額にかかわらずその全額が非課税である。", "a": false, "e": "誤りです。\n【根拠】通勤手当の非課税限度額は、原則として月15万円です。\n【ひっかけ】宝くじの当せん金や遺族年金・障害年金は非課税です。"}, {"id": "tf:806611bae4", "c": 4, "s": "問題4-1", "st": 1, "q": "復興特別所得税の額は、基準所得税額に2.1％を乗じて計算する。", "a": true, "e": "正しい記述です。\n【根拠】2037年分まで、基準所得税額×2.1％を所得税とあわせて納めます。\n【ひっかけ】利子・配当などの源泉徴収税率15.315％は、15％×1.021で計算したものです。"}, {"id": "tf:3bd8cf77a2", "c": 4, "s": "問題4-1", "st": 2, "q": "居住者とは、国内に住所を有し、又は現在まで引き続いて1年以上居所を有する個人をいう。", "a": true, "e": "正しい記述です。\n【根拠】居住者は、原則として国内外のすべての所得に課税されます。\n【ひっかけ】非居住者は、国内源泉所得だけに課税されます。"}, {"id": "tf:7adc58d4ac", "c": 4, "s": "問題4-1", "st": 1, "q": "非居住者は、国内源泉所得及び国外源泉所得のすべてについて所得税が課される。", "a": false, "e": "誤りです。\n【根拠】非居住者は、国内源泉所得だけに課税されます。\n【ひっかけ】国内外すべての所得に課税されるのは、非永住者以外の居住者です。"}, {"id": "tf:53518ab707", "c": 4, "s": "問題4-1", "st": 1, "q": "所得税は、課税庁が税額を決定して納税者に通知する賦課課税方式を採用している。", "a": false, "e": "誤りです。\n【根拠】所得税は、納税者が自ら計算して申告・納付する申告納税方式です。\n【ひっかけ】固定資産税は賦課課税方式です。"}, {"id": "tf:1de3de2bf7", "c": 4, "s": "問題4-1", "st": 2, "q": "所得税の税率は、課税所得金額に応じて5％から45％までの7段階の超過累進税率である。", "a": true, "e": "正しい記述です。\n【根拠】課税所得金額195万円以下は5％、4,000万円超は45％です。\n【ひっかけ】住民税（所得割）は一律10％です。"}, {"id": "tf:79f0ea02fd", "c": 4, "s": "問題4-1", "st": 1, "q": "宝くじの当せん金は、一時所得として所得税の課税対象となる。", "a": false, "e": "誤りです。\n【根拠】宝くじの当せん金は非課税です。\n【ひっかけ】競馬の払戻金や懸賞の賞金は一時所得です。"}, {"id": "tf:1ef355fd15", "c": 4, "s": "問題4-1", "st": 2, "q": "退職所得や山林所得は、他の所得と合算して総合課税される。", "a": false, "e": "誤りです。\n【根拠】退職所得と山林所得は、他の所得と分けて税額を計算する分離課税です。\n【ひっかけ】給与所得や事業所得などは総合課税です。"}, {"id": "tf:cad28b6901", "c": 4, "s": "問題4-1", "st": 2, "q": "雇用保険の基本手当は、雑所得として所得税の課税対象となる。", "a": false, "e": "誤りです。\n【根拠】雇用保険の失業等給付は非課税です。\n【ひっかけ】健康保険の傷病手当金や出産手当金も非課税です。"}, {"id": "tf:e8dd671823", "c": 4, "s": "問題4-1", "st": 1, "q": "遺族が受け取る遺族年金は、非課税所得である。", "a": true, "e": "正しい記述です。\n【根拠】遺族年金・障害年金は非課税です。\n【ひっかけ】老齢年金は雑所得として課税されます。"}, {"id": "tf:d090bf0269", "c": 4, "s": "問題4-2", "st": 2, "q": "勤続年数が25年の者が受け取る退職金に係る退職所得控除額は、1,150万円である。", "a": true, "e": "正しい記述です。\n【根拠】800万円＋70万円×（25年－20年）＝1,150万円です。\n【ひっかけ】40万円×25年＝1,000万円と計算してしまう誤りに注意します。"}, {"id": "tf:62b305e661", "c": 4, "s": "問題4-2", "st": 2, "q": "退職所得控除額の計算において、勤続年数に1年未満の端数がある場合は、その端数を切り捨てる。", "a": false, "e": "誤りです。\n【根拠】1年未満の端数は1年に切り上げます。\n【ひっかけ】勤続20年1か月なら21年として計算します。"}, {"id": "tf:94895794ab", "c": 4, "s": "問題4-2", "st": 1, "q": "「退職所得の受給に関する申告書」を提出しなかった場合、退職手当等の収入金額に対して20.42％の税率で源泉徴収される。", "a": true, "e": "正しい記述です。\n【根拠】申告書を提出しない場合は、退職所得控除が適用されず、収入金額×20.42％が源泉徴収されます。その場合は確定申告で精算します。\n【ひっかけ】申告書を提出すれば、原則として確定申告は不要です。"}, {"id": "tf:b2afdc47e9", "c": 4, "s": "問題4-2", "st": 2, "q": "一時所得の金額は、総収入金額からその収入を得るために支出した金額を控除し、さらに特別控除額（最高50万円）を控除した金額であり、その全額が総所得金額に算入される。", "a": false, "e": "誤りです。\n【根拠】総所得金額に算入されるのは、一時所得の金額の2分の1です。\n【ひっかけ】退職所得も2分の1ですが、こちらは分離課税です。"}, {"id": "tf:9bd0f7d004", "c": 4, "s": "問題4-2", "st": 2, "q": "土地の譲渡所得が長期譲渡所得に該当するかどうかは、譲渡した日における所有期間が5年を超えるかどうかで判定する。", "a": false, "e": "誤りです。\n【根拠】譲渡した年の1月1日における所有期間が5年を超えるかどうかで判定します。\n【ひっかけ】「譲渡した日」とする出題が定番のひっかけです。"}, {"id": "tf:a7bb45fb06", "c": 4, "s": "問題4-2", "st": 1, "q": "土地・建物等の取得費が不明な場合には、譲渡収入金額の5％相当額を取得費とすることができる。", "a": true, "e": "正しい記述です。\n【根拠】概算取得費として、譲渡収入金額の5％を使えます。実際の取得費が5％より少ない場合も選べます。\n【ひっかけ】相続で取得した土地は、被相続人の取得費と取得時期を引き継ぎます。"}, {"id": "tf:7337148d60", "c": 4, "s": "問題4-2", "st": 1, "q": "賃貸借契約に際して受け取った敷金のうち、返還を要しない部分の金額は、不動産所得の総収入金額に算入する。", "a": true, "e": "正しい記述です。\n【根拠】返還を要しないことが確定した部分は、その確定した年の収入金額に算入します。\n【ひっかけ】返還を要する部分は、預り金であり収入ではありません。"}, {"id": "tf:a304ef75ef", "c": 4, "s": "問題4-2", "st": 2, "q": "個人事業主が取得した建物の減価償却方法は、定額法に限られる。", "a": true, "e": "正しい記述です。\n【根拠】1998年4月1日以後に取得した建物は、定額法に限られます。\n【ひっかけ】2016年4月1日以後に取得した建物附属設備・構築物も定額法に限られます。"}, {"id": "tf:fa3c79fda6", "c": 4, "s": "問題4-2", "st": 2, "q": "個人事業主が取得価額10万円未満の備品を購入した場合、その取得価額の全額をその年の必要経費に算入できる。", "a": true, "e": "正しい記述です。\n【根拠】10万円未満（又は使用可能期間1年未満）の少額減価償却資産は、全額必要経費にできます。\n【ひっかけ】20万円未満は一括償却資産（3年均等償却）を選べます。"}, {"id": "tf:a9260ec3d0", "c": 4, "s": "問題4-2", "st": 1, "q": "取得価額20万円未満の減価償却資産は、一括償却資産として5年間で均等に償却することができる。", "a": false, "e": "誤りです。\n【根拠】一括償却資産は3年間で均等に償却します。\n【ひっかけ】青色申告の中小事業者の特例は30万円未満・年300万円限度です。"}, {"id": "tf:38898a7038", "c": 4, "s": "問題4-2", "st": 2, "q": "不動産の貸付けが事業的規模に満たない場合、その不動産所得の損失は、他の所得と損益通算することができない。", "a": false, "e": "誤りです。\n【根拠】不動産所得の損失は、事業的規模かどうかにかかわらず損益通算できます（土地取得の負債利子部分を除く）。\n【ひっかけ】事業的規模でないと、青色申告特別控除（55万・65万円）や専従者給与などに制限があります。"}, {"id": "tf:c1c3159c89", "c": 4, "s": "問題4-2", "st": 1, "q": "生命保険の満期保険金を一時所得として計算する場合、収入を得るために支出した金額は、その契約者が払い込んだ保険料の総額である。", "a": true, "e": "正しい記述です。\n【根拠】（満期保険金－払込保険料の総額－特別控除50万円）×1/2が総所得金額に算入されます。\n【ひっかけ】契約者以外が負担した保険料は、支出した金額に含められません。"}, {"id": "tf:12935ccf49", "c": 4, "s": "問題4-2", "st": 1, "q": "ゴルフ会員権など総合課税の対象となる資産を譲渡した場合、取得の日から譲渡の日までの所有期間が5年を超えるものは長期譲渡所得となり、その2分の1が総所得金額に算入される。", "a": true, "e": "正しい記述です。\n【根拠】総合課税の譲渡所得は、譲渡の日までの所有期間で長期・短期を判定し、長期は2分の1が課税対象です。\n【ひっかけ】土地・建物等（分離課税）は、譲渡した年の1月1日の所有期間で判定します。違いが頻出です。"}, {"id": "tf:dcc949fe56", "c": 4, "s": "問題4-2", "st": 1, "q": "給与所得者が通勤費や研修費などを支出し、その合計額が一定額を超える場合は、特定支出控除の適用を受けることができる。", "a": true, "e": "正しい記述です。\n【根拠】特定支出の額が給与所得控除額の2分の1を超える場合に、その超える部分を控除できます。\n【ひっかけ】適用を受けるには確定申告が必要です。"}, {"id": "tf:2b215cd571", "c": 4, "s": "問題4-2", "st": 2, "q": "役員等としての勤続年数が5年以下の者が受け取る退職手当については、退職所得の計算上、2分の1を乗じない。", "a": true, "e": "正しい記述です。\n【根拠】特定役員退職手当等は、収入金額－退職所得控除額の全額が退職所得です。\n【ひっかけ】役員以外で勤続5年以下の場合は、300万円を超える部分に2分の1を掛けません。"}, {"id": "tf:66ad139b22", "c": 4, "s": "問題4-2", "st": 1, "q": "上場株式を借入金で取得した場合、その借入金の利子は、配当所得の計算上、収入金額から差し引くことができる。", "a": true, "e": "正しい記述です。\n【根拠】配当所得＝収入金額－株式などを取得するための負債の利子です（申告不要を選んだ場合などは差し引けません）。\n【ひっかけ】事業所得の必要経費とは区別します。"}, {"id": "tf:c981d30401", "c": 4, "s": "問題4-2", "st": 1, "q": "競馬の払戻金は、一時所得として課税される。", "a": true, "e": "正しい記述です。\n【根拠】営利を目的とする継続的な行為から生じたものでなければ、一時所得です。\n【ひっかけ】継続的・営利目的と認められる場合は雑所得とされることがあります。"}, {"id": "tf:21fe4222f7", "c": 4, "s": "問題4-2", "st": 2, "q": "法人から贈与を受けた金品は、贈与税の課税対象となる。", "a": false, "e": "誤りです。\n【根拠】法人からの贈与は、所得税（一時所得、業務に関するものは給与所得など）の課税対象です。\n【ひっかけ】贈与税は、個人から贈与を受けた場合に課税されます。"}, {"id": "tf:35f10c8bba", "c": 4, "s": "問題4-2", "st": 1, "q": "家具や衣服などの生活用動産を譲渡した場合の所得は、原則として非課税である。", "a": true, "e": "正しい記述です。\n【根拠】1個又は1組の価額が30万円を超える貴金属・美術品などは課税されます。\n【ひっかけ】生活用動産の譲渡損失は、なかったものとされます。"}, {"id": "tf:cc8f58c757", "c": 4, "s": "問題4-2", "st": 1, "q": "取得から5年を超えて保有している山林を伐採して譲渡した場合の所得は、事業所得となる。", "a": false, "e": "誤りです。\n【根拠】5年を超えて保有する山林の伐採・譲渡による所得は山林所得です。\n【ひっかけ】5年以内の場合は事業所得又は雑所得です。"}, {"id": "tf:c16f663987", "c": 4, "s": "問題4-2", "st": 1, "q": "山林所得の税額は、5分5乗方式により計算する。", "a": true, "e": "正しい記述です。\n【根拠】山林所得の金額を5で割った金額に税率を適用し、5倍して税額を求めます。\n【ひっかけ】長期間の所得が一度に生じるため、税負担を緩和する仕組みです。"}, {"id": "tf:7ecd6dcdf9", "c": 4, "s": "問題4-2", "st": 1, "q": "不動産の貸付けに際して受け取った礼金は、不動産所得の総収入金額に算入する。", "a": true, "e": "正しい記述です。\n【根拠】返還不要の礼金・権利金・更新料は不動産所得の収入です。\n【ひっかけ】返還を要する敷金は収入になりません。"}, {"id": "tf:5310771193", "c": 4, "s": "問題4-2", "st": 1, "q": "借地権の設定に際して受け取った権利金の額が、その土地の時価の2分の1を超える場合は、譲渡所得として課税される。", "a": true, "e": "正しい記述です。\n【根拠】土地の一部を譲渡したのと同じとみなされるためです。\n【ひっかけ】2分の1以下なら不動産所得です。"}, {"id": "tf:c79392020d", "c": 4, "s": "問題4-2", "st": 1, "q": "総合課税の対象となる譲渡所得の特別控除額は、短期と長期を合わせて年50万円である。", "a": true, "e": "正しい記述です。\n【根拠】短期譲渡所得から先に控除します。\n【ひっかけ】一時所得の特別控除（最高50万円）とは別枠です。"}, {"id": "tf:38b46d8cab", "c": 4, "s": "問題4-2", "st": 2, "q": "公的年金等に係る雑所得の金額は、公的年金等の収入金額から公的年金等控除額を差し引いて求める。", "a": true, "e": "正しい記述です。\n【根拠】公的年金等控除額は、年齢（65歳以上か未満か）と収入金額によって異なります。\n【ひっかけ】個人年金保険の年金は、公的年金等以外の雑所得です。"}, {"id": "tf:57ca16899f", "c": 4, "s": "問題4-2", "st": 2, "q": "預貯金の利子は、原則として20.315％の源泉分離課税により課税関係が終了する。", "a": true, "e": "正しい記述です。\n【根拠】確定申告をすることはできません。\n【ひっかけ】特定公社債の利子は申告分離課税です。"}, {"id": "tf:a23b6ccf9e", "c": 4, "s": "問題4-2", "st": 1, "q": "給与所得控除額は、給与の収入金額にかかわらず一定額である。", "a": false, "e": "誤りです。\n【根拠】給与所得控除額は、収入金額に応じて段階的に増え、上限があります。\n【ひっかけ】最低保障額が定められています。"}, {"id": "tf:50dee47e5a", "c": 4, "s": "問題4-2", "st": 2, "q": "勤続年数が10年の者の退職所得控除額は、800万円である。", "a": false, "e": "誤りです。\n【根拠】勤続20年以下は40万円×勤続年数なので、40万円×10年＝400万円です。\n【ひっかけ】800万円は勤続20年の場合です。"}, {"id": "tf:a2a82b8bb4", "c": 4, "s": "問題4-2", "st": 2, "q": "一時所得の特別控除額は、最高100万円である。", "a": false, "e": "誤りです。\n【根拠】一時所得の特別控除額は最高50万円です。\n【ひっかけ】総所得金額に算入するのは、特別控除後の金額の2分の1です。"}, {"id": "tf:27a6589e58", "c": 4, "s": "問題4-2", "st": 1, "q": "事業的規模でない不動産の貸付けを行っている場合、青色申告特別控除の額は最高10万円である。", "a": true, "e": "正しい記述です。\n【根拠】55万円・65万円の控除は、事業所得や事業的規模の不動産所得が対象です。\n【ひっかけ】事業的規模の目安は、いわゆる5棟10室です。"}, {"id": "tf:07e1ca2e8d", "c": 4, "s": "問題4-2", "st": 2, "q": "所有期間が4年の土地を譲渡した場合の譲渡所得は、短期譲渡所得として39.63％の税率で課税される。", "a": true, "e": "正しい記述です。\n【根拠】譲渡した年の1月1日における所有期間が5年以下なら短期譲渡所得です。\n【ひっかけ】所有期間が5年を超えると長期譲渡所得（20.315％）です。"}, {"id": "tf:1669c28d40", "c": 4, "s": "問題4-2", "st": 2, "q": "個人年金保険の年金は、公的年金等に係る雑所得として公的年金等控除の対象となる。", "a": false, "e": "誤りです。\n【根拠】個人年金保険の年金は、公的年金等以外の雑所得で、公的年金等控除は使えません。\n【ひっかけ】必要経費（払込保険料のうち対応部分）を差し引きます。"}, {"id": "tf:e51ddc0f00", "c": 4, "s": "問題4-3", "st": 2, "q": "不動産所得の金額の計算上生じた損失のうち、土地の取得に要した負債の利子に相当する部分の金額は、損益通算の対象とならない。", "a": true, "e": "正しい記述です。\n【根拠】土地の取得のための借入金の利子に相当する部分は、損益通算できません。\n【ひっかけ】建物の取得のための借入金の利子に相当する部分は、損益通算できます。"}, {"id": "tf:3acf3be9e0", "c": 4, "s": "問題4-3", "st": 2, "q": "雑所得の金額の計算上生じた損失は、他の所得と損益通算することができる。", "a": false, "e": "誤りです。\n【根拠】損益通算できるのは、不動産所得・事業所得・山林所得・譲渡所得の損失だけです。\n【ひっかけ】一時所得・雑所得の損失は損益通算できません。"}, {"id": "tf:88b71fb8aa", "c": 4, "s": "問題4-3", "st": 2, "q": "ゴルフ会員権の譲渡による損失は、給与所得と損益通算することができる。", "a": false, "e": "誤りです。\n【根拠】ゴルフ会員権など生活に通常必要でない資産の譲渡損失は、損益通算できません。\n【ひっかけ】譲渡所得の損失であっても、すべてが損益通算できるわけではありません。"}, {"id": "tf:5ea06b0703", "c": 4, "s": "問題4-3", "st": 2, "q": "上場株式等の譲渡損失は、申告分離課税を選択した上場株式等の配当所得と損益通算することができる。", "a": true, "e": "正しい記述です。\n【根拠】総合課税を選択した配当所得とは損益通算できません。\n【ひっかけ】控除しきれない損失は、確定申告により翌年以後3年間繰り越せます。"}, {"id": "tf:810a4e1965", "c": 4, "s": "問題4-3", "st": 1, "q": "青色申告者の純損失の金額は、翌年以後5年間にわたって繰り越して控除することができる。", "a": false, "e": "誤りです。\n【根拠】個人の純損失の繰越控除の期間は3年間です。\n【ひっかけ】法人の欠損金の繰越期間（10年）と混同させる出題です。"}, {"id": "tf:fcc99e1d01", "c": 4, "s": "問題4-3", "st": 2, "q": "別荘を貸し付けたことにより生じた不動産所得の損失は、他の所得と損益通算することができる。", "a": false, "e": "誤りです。\n【根拠】主に趣味・娯楽・保養のための別荘などは、生活に通常必要でない資産とされ、その損失は損益通算できません。\n【ひっかけ】通常の賃貸アパートの損失は損益通算できます。"}, {"id": "tf:0a33d6d598", "c": 4, "s": "問題4-3", "st": 1, "q": "山林所得の金額の計算上生じた損失は、他の所得と損益通算することができる。", "a": true, "e": "正しい記述です。\n【根拠】損益通算できるのは、不動産所得・事業所得・山林所得・譲渡所得の損失です。\n【ひっかけ】一時所得・雑所得の損失は損益通算できません。"}, {"id": "tf:87712c0c89", "c": 4, "s": "問題4-3", "st": 2, "q": "土地・建物等の譲渡による損失は、原則として他の所得と損益通算することができない。", "a": true, "e": "正しい記述です。\n【根拠】分離課税の土地・建物等の譲渡損失は、原則として損益通算できません。\n【ひっかけ】一定の居住用財産の譲渡損失は、特例で損益通算・繰越控除ができます。"}, {"id": "tf:91c45b9953", "c": 4, "s": "問題4-3", "st": 1, "q": "雑損控除で控除しきれなかった損失（雑損失）は、翌年以後3年間繰り越して控除することができる。", "a": true, "e": "正しい記述です。\n【根拠】雑損失の繰越控除は、青色申告者でなくても受けられます（特定非常災害は5年）。\n【ひっかけ】純損失の繰越控除は、原則として青色申告者です。"}, {"id": "tf:f9faeeb69c", "c": 4, "s": "問題4-3", "st": 1, "q": "白色申告者であっても、被災事業用資産の損失や変動所得の損失による純損失は、翌年以後3年間繰り越すことができる。", "a": true, "e": "正しい記述です。\n【根拠】白色申告者は、被災事業用資産の損失と変動所得の損失に限り、純損失の繰越控除を受けられます。\n【ひっかけ】青色申告者は、すべての純損失を繰り越せます。"}, {"id": "tf:56e69a0291", "c": 4, "s": "問題4-3", "st": 2, "q": "一時所得の金額の計算上生じた損失は、給与所得と損益通算することができる。", "a": false, "e": "誤りです。\n【根拠】一時所得の損失は損益通算できません。\n【ひっかけ】損益通算できるのは、不動産・事業・山林・譲渡所得の損失です。"}, {"id": "tf:a0b891afd9", "c": 4, "s": "問題4-3", "st": 1, "q": "不動産所得の損失のうち、建物の取得に要した借入金の利子に相当する部分は、損益通算の対象となる。", "a": true, "e": "正しい記述です。\n【根拠】損益通算できないのは、土地の取得に要した借入金の利子に相当する部分です。\n【ひっかけ】土地と建物の区別がポイントです。"}, {"id": "tf:367b6dbcd9", "c": 4, "s": "問題4-3", "st": 2, "q": "上場株式等の譲渡損失は、確定申告により翌年以後5年間繰り越して控除することができる。", "a": false, "e": "誤りです。\n【根拠】上場株式等の譲渡損失の繰越期間は3年間です。\n【ひっかけ】連続して確定申告をすることが必要です。"}, {"id": "tf:4140d2c4df", "c": 4, "s": "問題4-4", "st": 2, "q": "医療費控除の控除額の上限は200万円である。", "a": true, "e": "正しい記述です。\n【根拠】（医療費－補てん額）－10万円（総所得金額等が200万円未満なら5％）で、上限は200万円です。\n【ひっかけ】セルフメディケーション税制の上限は8万8,000円です。"}, {"id": "tf:7289e165c6", "c": 4, "s": "問題4-4", "st": 2, "q": "セルフメディケーション税制による医療費控除の特例は、通常の医療費控除と併用することができる。", "a": false, "e": "誤りです。\n【根拠】セルフメディケーション税制と通常の医療費控除は、どちらか一方の選択適用です。\n【ひっかけ】特例は、特定一般用医薬品等の購入費のうち1万2,000円を超える部分が対象です。"}, {"id": "tf:1ad42f3fc0", "c": 4, "s": "問題4-4", "st": 1, "q": "納税者が、生計を一にする配偶者の国民年金保険料を支払った場合、その金額は納税者の社会保険料控除の対象となる。", "a": true, "e": "正しい記述です。\n【根拠】生計を一にする親族の社会保険料を負担した場合も、負担した人の社会保険料控除の対象です。\n【ひっかけ】ただし、配偶者の年金から天引きされた保険料は、天引きされた配偶者の控除となります。"}, {"id": "tf:48e9fb3043", "c": 4, "s": "問題4-4", "st": 2, "q": "詐欺により生じた損失は、雑損控除の対象となる。", "a": false, "e": "誤りです。\n【根拠】雑損控除の対象は、災害・盗難・横領による損失です。詐欺・恐喝による損失は対象外です。\n【ひっかけ】生活に通常必要でない資産（別荘など）の損失も対象外です。"}, {"id": "tf:68799dd50a", "c": 4, "s": "問題4-4", "st": 2, "q": "特定扶養親族とは、その年の12月31日現在の年齢が19歳以上23歳未満の控除対象扶養親族をいい、扶養控除の額は63万円である。", "a": true, "e": "正しい記述です。\n【根拠】特定扶養親族の扶養控除は63万円です。\n【ひっかけ】16歳未満の扶養親族は扶養控除の対象外です。"}, {"id": "tf:2bd95cc3ed", "c": 4, "s": "問題4-4", "st": 2, "q": "配偶者控除は、納税者本人の合計所得金額が2,000万円以下であれば適用を受けることができる。", "a": false, "e": "誤りです。\n【根拠】配偶者控除は、本人の合計所得金額が1,000万円以下であることが要件です。\n【ひっかけ】2,000万円以下は住宅借入金等特別控除の所得要件です。"}, {"id": "tf:22d23def4a", "c": 4, "s": "問題4-4", "st": 1, "q": "青色事業専従者として給与の支払を受けている配偶者は、配偶者控除の対象とならない。", "a": true, "e": "正しい記述です。\n【根拠】青色事業専従者や事業専従者は、配偶者控除・扶養控除の対象外です。\n【ひっかけ】専従者給与として必要経費に算入しているため、二重の控除はできません。"}, {"id": "tf:00f67e5ffe", "c": 4, "s": "問題4-4", "st": 2, "q": "人間ドックの費用は、その結果、重大な疾病が発見され、引き続きその治療を受けた場合には、医療費控除の対象となる。", "a": true, "e": "正しい記述です。\n【根拠】治療に先立って行われる診察と同様に扱われるため、対象となります。\n【ひっかけ】異常がなかった場合は、医療費控除の対象外です。"}, {"id": "tf:89d1128be3", "c": 4, "s": "問題4-4", "st": 1, "q": "美容のための歯列矯正や美容整形の費用は、医療費控除の対象となる。", "a": false, "e": "誤りです。\n【根拠】容姿を美化するための費用は、医療費控除の対象外です。\n【ひっかけ】子どもの成長を阻害しないための歯列矯正など、治療目的なら対象となります。"}, {"id": "tf:608421bdcd", "c": 4, "s": "問題4-4", "st": 1, "q": "同居特別障害者に係る障害者控除の額は75万円である。", "a": true, "e": "正しい記述です。\n【根拠】障害者27万円、特別障害者40万円、同居特別障害者75万円です。\n【ひっかけ】扶養控除と障害者控除は重ねて適用できます。"}, {"id": "tf:0b3e926d38", "c": 4, "s": "問題4-4", "st": 2, "q": "ふるさと納税のワンストップ特例は、寄附先が10自治体以内であれば適用を受けることができる。", "a": false, "e": "誤りです。\n【根拠】ワンストップ特例は、1年間の寄附先が5自治体以内の場合に利用できます。\n【ひっかけ】医療費控除などで確定申告をする場合は、ワンストップ特例は使えません。"}, {"id": "tf:c6b4054f59", "c": 4, "s": "問題4-4", "st": 2, "q": "医療費控除の対象となる医療費には、自家用車で通院した場合のガソリン代や駐車場代も含まれる。", "a": false, "e": "誤りです。\n【根拠】自家用車のガソリン代・駐車場代は医療費控除の対象外です。\n【ひっかけ】電車・バスなどの通院費は対象です。"}, {"id": "tf:b6be55fa72", "c": 4, "s": "問題4-4", "st": 1, "q": "医療費控除の対象となる医療費には、出産のための検診や分娩の費用も含まれる。", "a": true, "e": "正しい記述です。\n【根拠】妊娠中の定期検診や分娩費用は対象です。\n【ひっかけ】出産育児一時金で補てんされた分は差し引きます。"}, {"id": "tf:f199e07693", "c": 4, "s": "問題4-4", "st": 1, "q": "納税者と生計を一にする配偶者や親族のために支払った医療費は、納税者の医療費控除の対象となる。", "a": true, "e": "正しい記述です。\n【根拠】生計を一にしていれば、所得の多い少ないは問いません。\n【ひっかけ】医療費は実際に支払った年の控除対象です。"}, {"id": "tf:ecacdbebba", "c": 4, "s": "問題4-4", "st": 1, "q": "保険金などで補てんされた金額が、その給付の目的となった医療費を上回る場合、その上回る部分は他の医療費から差し引かなければならない。", "a": false, "e": "誤りです。\n【根拠】補てん金は、給付の目的となった医療費から差し引くだけで、上回る部分を他の医療費から差し引く必要はありません。\n【ひっかけ】入院給付金は、その入院の医療費から差し引きます。"}, {"id": "tf:8560873264", "c": 4, "s": "問題4-4", "st": 1, "q": "医療費控除の適用を受けるためには、確定申告書に医療費控除の明細書を添付する必要がある。", "a": true, "e": "正しい記述です。\n【根拠】領収書の提出は不要ですが、5年間の保存が必要です。\n【ひっかけ】健康保険組合の医療費通知を添付することもできます。"}, {"id": "tf:3699682d1c", "c": 4, "s": "問題4-4", "st": 2, "q": "同一の配偶者について、配偶者控除と配偶者特別控除を重ねて適用を受けることはできない。", "a": true, "e": "正しい記述です。\n【根拠】配偶者の所得に応じて、どちらか一方の適用となります。\n【ひっかけ】配偶者特別控除も、本人の合計所得金額が1,000万円以下であることが要件です。"}, {"id": "tf:90d6de0404", "c": 4, "s": "問題4-4", "st": 1, "q": "扶養控除の対象となる親族の年齢は、その年の12月31日の現況で判定する。", "a": true, "e": "正しい記述です。\n【根拠】年の途中で死亡した場合は、死亡時の現況で判定します。\n【ひっかけ】その年中に死亡した親族も、要件を満たせば扶養控除の対象になります。"}, {"id": "tf:ff249a79f8", "c": 4, "s": "問題4-4", "st": 1, "q": "同居老親等に係る扶養控除の額は、58万円である。", "a": true, "e": "正しい記述です。\n【根拠】70歳以上の老人扶養親族は48万円、そのうち同居の直系尊属は58万円です。\n【ひっかけ】特定扶養親族は63万円です。"}, {"id": "tf:2c6accbfb3", "c": 4, "s": "問題4-4", "st": 1, "q": "ふるさと納税をした者がワンストップ特例の適用を受けた場合、寄附金控除は所得税からではなく住民税から控除される。", "a": true, "e": "正しい記述です。\n【根拠】ワンストップ特例では、所得税の控除分も含めて住民税から控除されます。\n【ひっかけ】確定申告をした場合は、所得税と住民税の両方から控除されます。"}, {"id": "tf:69e55757ce", "c": 4, "s": "問題4-4", "st": 2, "q": "医療費控除の額は、支払った医療費から一律に10万円を差し引いて求める。", "a": false, "e": "誤りです。\n【根拠】総所得金額等が200万円未満の場合は、10万円ではなく総所得金額等の5％を差し引きます。\n【ひっかけ】上限は200万円です。"}, {"id": "tf:e5efe02a19", "c": 4, "s": "問題4-4", "st": 1, "q": "生計を一にする子の国民年金保険料を親が支払った場合、その保険料は親の社会保険料控除の対象となる。", "a": true, "e": "正しい記述です。\n【根拠】生計を一にする親族の社会保険料を負担した場合は、負担した人が控除を受けられます。\n【ひっかけ】子の年金から天引きされた保険料は、子の控除になります。"}, {"id": "tf:74e85ef3c8", "c": 4, "s": "問題4-4", "st": 2, "q": "生命保険料控除は、税額控除である。", "a": false, "e": "誤りです。\n【根拠】生命保険料控除は所得控除です。\n【ひっかけ】税額控除には、住宅借入金等特別控除や配当控除があります。"}, {"id": "tf:dbcefffbeb", "c": 4, "s": "問題4-4", "st": 2, "q": "納税者本人の合計所得金額が1,000万円を超える場合でも、配偶者控除の適用を受けることができる。", "a": false, "e": "誤りです。\n【根拠】本人の合計所得金額が1,000万円を超えると、配偶者控除・配偶者特別控除は受けられません。\n【ひっかけ】本人の所得によって控除額が段階的に減ります。"}, {"id": "tf:9fd5fb0b9f", "c": 4, "s": "問題4-4", "st": 2, "q": "年齢16歳未満の扶養親族については、扶養控除の適用を受けることはできない。", "a": true, "e": "正しい記述です。\n【根拠】児童手当が支給されるため、16歳未満は扶養控除の対象外です。\n【ひっかけ】住民税の非課税限度額の判定などでは、扶養親族の数に含めます。"}, {"id": "tf:eedf2e096a", "c": 4, "s": "問題4-4", "st": 1, "q": "寄附金控除は、特定寄附金の合計額から5,000円を差し引いた金額である。", "a": false, "e": "誤りです。\n【根拠】差し引く金額は2,000円です。\n【ひっかけ】特定寄附金の額は、総所得金額等の40％が限度です。"}, {"id": "tf:87525c6999", "c": 4, "s": "問題4-4", "st": 1, "q": "雑損控除は、災害・盗難・横領によって住宅や家財などに損害を受けた場合に適用を受けることができる。", "a": true, "e": "正しい記述です。\n【根拠】詐欺や恐喝による損害は対象外です。\n【ひっかけ】災害減免法による所得税の軽減とは選択適用です。"}, {"id": "tf:306ef94438", "c": 4, "s": "問題4-5", "st": 2, "q": "住宅借入金等特別控除の適用を受けるためには、住宅ローンの返済期間が10年以上でなければならない。", "a": true, "e": "正しい記述です。\n【根拠】償還期間10年以上の借入金等であることが要件です。\n【ひっかけ】繰上げ返済で当初からの返済期間が10年未満になると、以後は適用を受けられません。"}, {"id": "tf:f248d8c0a8", "c": 4, "s": "問題4-5", "st": 2, "q": "住宅借入金等特別控除は、控除を受ける年の合計所得金額が3,000万円以下であれば適用を受けることができる。", "a": false, "e": "誤りです。\n【根拠】合計所得金額は2,000万円以下であることが要件です。\n【ひっかけ】床面積40㎡以上50㎡未満の新築等の場合は、合計所得金額1,000万円以下の年に限られます。"}, {"id": "tf:f5ba9b7151", "c": 4, "s": "問題4-5", "st": 1, "q": "給与所得者が住宅借入金等特別控除の適用を受ける場合、最初の年分は確定申告が必要であるが、2年目以降は年末調整で適用を受けることができる。", "a": true, "e": "正しい記述です。\n【根拠】初年度は確定申告が必要で、2年目以降は年末調整で適用されます。\n【ひっかけ】初年度から年末調整でよいとする出題に注意します。"}, {"id": "tf:c9c064a554", "c": 4, "s": "問題4-5", "st": 2, "q": "給与所得者で、給与・退職所得以外の所得金額の合計額が20万円を超える者は、確定申告が必要である。", "a": true, "e": "正しい記述です。\n【根拠】給与を1か所から受けていて年末調整を受けた人でも、給与・退職所得以外の所得が20万円を超えると確定申告が必要です。\n【ひっかけ】給与の収入金額が2,000万円を超える人も確定申告が必要です。"}, {"id": "tf:08553d97e0", "c": 4, "s": "問題4-5", "st": 2, "q": "年の途中で死亡した者の所得税の準確定申告は、相続人が相続の開始があったことを知った日の翌日から10か月以内に行う。", "a": false, "e": "誤りです。\n【根拠】準確定申告の期限は、相続の開始があったことを知った日の翌日から4か月以内です。\n【ひっかけ】10か月以内は相続税の申告期限です。"}, {"id": "tf:6c99c83ae2", "c": 4, "s": "問題4-5", "st": 1, "q": "その年の1月16日以後に新たに事業を開始した者が、その年分から青色申告の承認を受けようとする場合には、事業開始の日から2か月以内に承認申請書を提出する必要がある。", "a": true, "e": "正しい記述です。\n【根拠】原則はその年の3月15日まで、1月16日以後の開業は開業日から2か月以内です。\n【ひっかけ】期限を「3か月以内」とする出題に注意します。"}, {"id": "tf:6b567a48da", "c": 4, "s": "問題4-5", "st": 1, "q": "給与所得者は、青色申告の承認を受けることができる。", "a": false, "e": "誤りです。\n【根拠】青色申告ができるのは、不動産所得・事業所得・山林所得のある者です。\n【ひっかけ】給与所得だけの者は青色申告の対象外です。"}, {"id": "tf:832b263b5c", "c": 4, "s": "問題4-5", "st": 2, "q": "所得税の更正の請求は、原則として法定申告期限から5年以内に行うことができる。", "a": true, "e": "正しい記述です。\n【根拠】税額を多く申告していた場合などに、5年以内に更正の請求ができます。\n【ひっかけ】税額が少なかった場合は修正申告をします。"}, {"id": "tf:36cf6b15f5", "c": 4, "s": "問題4-5", "st": 1, "q": "青色申告者は、純損失の金額を前年分の所得に繰り戻して、所得税の還付を請求することができる。", "a": true, "e": "正しい記述です。\n【根拠】前年も青色申告をしていることなどを要件に、純損失の繰戻し還付を受けられます。\n【ひっかけ】白色申告者は、原則として純損失の繰越控除・繰戻し還付を受けられません（変動所得・被災事業用資産の損失を除く）。"}, {"id": "tf:d062e8d25e", "c": 4, "s": "問題4-5", "st": 2, "q": "住民税は、その年の12月31日現在の住所地の市町村において、その年の所得に対して課税される。", "a": false, "e": "誤りです。\n【根拠】住民税は、1月1日現在の住所地で、前年の所得に対して課税されます。\n【ひっかけ】年の途中で転居しても、その年度の住民税は1月1日の住所地に納めます。"}, {"id": "tf:c23b0a3bed", "c": 4, "s": "問題4-5", "st": 1, "q": "個人事業税の計算上、事業主控除として年290万円を控除することができる。", "a": true, "e": "正しい記述です。\n【根拠】個人事業税には、年290万円の事業主控除があります（営業期間が1年未満の場合は月割り）。\n【ひっかけ】個人事業税は都道府県税です。"}, {"id": "tf:ca00eb1650", "c": 4, "s": "問題4-5", "st": 1, "q": "青色申告者は、帳簿書類を原則として5年間保存しなければならない。", "a": false, "e": "誤りです。\n【根拠】帳簿書類の保存期間は原則7年間です（一部の書類は5年間）。\n【ひっかけ】数字の入れ替えに注意します。"}, {"id": "tf:aad71a5168", "c": 4, "s": "問題4-5", "st": 1, "q": "確定申告による所得税の納付期限は、原則として翌年3月15日である。", "a": true, "e": "正しい記述です。\n【根拠】振替納税を利用すると、引落日は4月中旬ごろになります。\n【ひっかけ】個人の消費税の申告・納付期限は3月31日です。"}, {"id": "tf:8acd75d937", "c": 4, "s": "問題4-5", "st": 1, "q": "予定納税基準額が15万円以上である者は、原則として7月と11月にそれぞれ予定納税基準額の3分の1を納付する。", "a": true, "e": "正しい記述です。\n【根拠】前年の所得をもとに計算した額を、2回に分けて前払いします。\n【ひっかけ】確定申告で精算します。"}, {"id": "tf:616b2b3a5c", "c": 4, "s": "問題4-5", "st": 1, "q": "確定申告をする義務のない者が還付申告をする場合、その年の翌年1月1日から5年間提出することができる。", "a": true, "e": "正しい記述です。\n【根拠】還付申告は2月16日より前でも提出できます。\n【ひっかけ】医療費控除などで還付を受ける場合に使います。"}, {"id": "tf:62aef42cad", "c": 4, "s": "問題4-5", "st": 1, "q": "給与を2か所以上から受けている者で、年末調整をされなかった給与の収入金額と給与所得・退職所得以外の所得金額の合計額が20万円を超える場合は、確定申告が必要である。", "a": true, "e": "正しい記述です。\n【根拠】従たる給与と他の所得の合計が20万円を超えると確定申告が必要です。\n【ひっかけ】給与の収入金額が2,000万円を超える者も確定申告が必要です。"}, {"id": "tf:0999dc158f", "c": 4, "s": "問題4-5", "st": 1, "q": "前々年の所得が300万円以下の青色申告者は、現金主義による所得計算の特例を選択することができる。", "a": true, "e": "正しい記述です。\n【根拠】収入・費用を現金の受払いで計上できる特例です。\n【ひっかけ】この特例を選ぶと、青色申告特別控除は10万円になります。"}, {"id": "tf:bafbeecce1", "c": 4, "s": "問題4-5", "st": 2, "q": "青色事業専従者給与として必要経費に算入するためには、所定の期限までに届出書を提出し、その金額の範囲内で支給する必要がある。", "a": true, "e": "正しい記述です。\n【根拠】届出書に記載した金額の範囲内で、労務の対価として相当な額が必要経費になります。\n【ひっかけ】受け取った専従者は給与所得として課税されます。"}, {"id": "tf:e086ec2503", "c": 4, "s": "問題4-5", "st": 1, "q": "青色事業専従者となるためには、年齢が18歳以上であることが要件である。", "a": false, "e": "誤りです。\n【根拠】年齢要件は15歳以上（その年の12月31日現在）です。\n【ひっかけ】その年の6か月を超える期間、事業にもっぱら従事することも要件です。"}, {"id": "tf:c2aa632503", "c": 4, "s": "問題4-5", "st": 1, "q": "白色申告者の事業専従者控除の限度額は、配偶者の場合86万円である。", "a": true, "e": "正しい記述です。\n【根拠】配偶者は86万円、その他の親族は50万円が上限です（所得による上限もあります）。\n【ひっかけ】青色事業専従者給与は、届出額の範囲内で相当な額を必要経費にできます。"}, {"id": "tf:839d75e38f", "c": 4, "s": "問題4-5", "st": 2, "q": "住民税の所得割の標準税率は、所得の金額にかかわらず一律10％である。", "a": true, "e": "正しい記述です。\n【根拠】道府県民税4％・市町村民税6％の合計10％です。\n【ひっかけ】所得税のような超過累進税率ではありません。"}, {"id": "tf:2a528be85e", "c": 4, "s": "問題4-5", "st": 1, "q": "給与所得者の住民税は、原則として毎月の給与から天引きされる特別徴収によって納付する。", "a": true, "e": "正しい記述です。\n【根拠】会社が6月から翌年5月までの12回に分けて天引きします。\n【ひっかけ】自営業者などは普通徴収（納税通知書で納付）です。"}, {"id": "tf:ba74c5cea8", "c": 4, "s": "問題4-5", "st": 1, "q": "住宅借入金等特別控除の適用を受けていた者が、転勤によりその住宅に居住しなくなった場合、その後再入居しても、一切適用を受けることはできない。", "a": false, "e": "誤りです。\n【根拠】一定の要件を満たせば、再入居した年以後の残りの控除期間について、再び適用を受けられます。\n【ひっかけ】転勤で家族も一緒に転居した場合などが対象です。"}, {"id": "tf:c73beedfd2", "c": 4, "s": "問題4-5", "st": 1, "q": "住宅借入金等特別控除は、入居した年とその前2年・後3年の間に、居住用財産の3,000万円特別控除などの適用を受けた場合は、適用を受けることができない。", "a": true, "e": "正しい記述です。\n【根拠】譲渡の特例と住宅ローン控除は、一定期間内では重ねて受けられません。\n【ひっかけ】どちらが有利か比較して選ぶことが大切です。"}, {"id": "tf:d5de3576a6", "c": 4, "s": "問題4-5", "st": 2, "q": "配当控除の額は、課税総所得金額等が1,000万円以下の場合、配当所得の金額の10％（所得税）である。", "a": true, "e": "正しい記述です。\n【根拠】1,000万円を超える部分に対応する配当所得は5％です。\n【ひっかけ】配当控除は税額控除で、所得控除ではありません。"}, {"id": "tf:1021d132a2", "c": 4, "s": "問題4-5", "st": 2, "q": "住宅借入金等特別控除は、所得控除の一種である。", "a": false, "e": "誤りです。\n【根拠】住宅借入金等特別控除は、所得税額から直接差し引く税額控除です。\n【ひっかけ】控除しきれない額は、一定額まで住民税から控除されます。"}, {"id": "tf:ee3bb816b5", "c": 4, "s": "問題4-5", "st": 1, "q": "住宅借入金等特別控除の適用対象となる住宅は、床面積の2分の1以上が専ら自己の居住の用に供されるものでなければならない。", "a": true, "e": "正しい記述です。\n【根拠】店舗併用住宅の場合は、居住用部分に対応する借入金が対象です。\n【ひっかけ】床面積は原則50㎡以上です。"}, {"id": "tf:5ece0f2358", "c": 4, "s": "問題4-5", "st": 2, "q": "給与所得者は、医療費控除の適用を受けるために、年末調整で手続をすることができる。", "a": false, "e": "誤りです。\n【根拠】医療費控除・雑損控除・寄附金控除（ワンストップ特例を除く）などは、確定申告で受けます。\n【ひっかけ】生命保険料控除や地震保険料控除は、年末調整で受けられます。"}, {"id": "tf:fd07b76660", "c": 4, "s": "問題4-5", "st": 1, "q": "青色申告の承認を受けている者は、帳簿書類を原則として7年間保存しなければならない。", "a": true, "e": "正しい記述です。\n【根拠】仕訳帳・総勘定元帳などは7年間保存します（一部の書類は5年）。\n【ひっかけ】電子帳簿保存も認められています。"}, {"id": "tf:c60f3d1979", "c": 4, "s": "問題4-5", "st": 2, "q": "青色申告者が65万円の青色申告特別控除を受けるためには、確定申告書を法定申告期限後に提出してもよい。", "a": false, "e": "誤りです。\n【根拠】55万円・65万円の控除は、期限内申告が要件です。\n【ひっかけ】期限後申告の場合は、10万円の控除になります。"}, {"id": "tf:80cb052b8c", "c": 4, "s": "問題4-5", "st": 1, "q": "個人事業税は、すべての業種に同じ税率で課される。", "a": false, "e": "誤りです。\n【根拠】個人事業税の税率は、業種によって3％〜5％です。\n【ひっかけ】事業主控除（年290万円）があります。"}, {"id": "tf:7ad26a81e8", "c": 4, "s": "問題4-6", "st": 2, "q": "期末資本金の額が1億円以下の法人（一定の法人を除く）は、交際費等の額のうち、年800万円までの定額控除限度額と接待飲食費の50％相当額のいずれかを選択して損金に算入できる。", "a": true, "e": "正しい記述です。\n【根拠】中小法人は、どちらか有利なほうを選択できます。\n【ひっかけ】大法人（資本金100億円超の法人を除く）は、接待飲食費の50％のみです。"}, {"id": "tf:13956d232b", "c": 4, "s": "問題4-6", "st": 2, "q": "法人が支出した飲食費のうち、1人あたり5,000円以下のものは、交際費等の範囲から除かれる。", "a": false, "e": "誤りです。\n【根拠】2024年4月1日以後に支出する飲食費は、1人あたり1万円以下であれば交際費等から除かれます（社内飲食費を除く）。\n【ひっかけ】改正前の基準（5,000円）を使う出題に注意します。"}, {"id": "tf:4ebb2179e9", "c": 4, "s": "問題4-6", "st": 1, "q": "法人税の確定申告書は、原則として各事業年度終了の日の翌日から2か月以内に提出しなければならない。", "a": true, "e": "正しい記述です。\n【根拠】申告期限の延長の特例を受けている場合は、さらに延長されます。\n【ひっかけ】個人の確定申告（3月15日まで）と混同しないようにします。"}, {"id": "tf:724869c57e", "c": 4, "s": "問題4-6", "st": 2, "q": "基準期間における課税売上高が1,000万円以下の事業者は、特定期間における課税売上高にかかわらず、免税事業者となる。", "a": false, "e": "誤りです。\n【根拠】特定期間の課税売上高が1,000万円を超えると、課税事業者となります（給与等支払額で判定することもできます）。\n【ひっかけ】インボイス発行事業者として登録した場合も、課税事業者となります。"}, {"id": "tf:95ffc386c1", "c": 4, "s": "問題4-6", "st": 1, "q": "簡易課税制度は、基準期間における課税売上高が5,000万円以下の事業者が選択することができる。", "a": true, "e": "正しい記述です。\n【根拠】簡易課税制度選択届出書は、原則として適用を受けようとする課税期間の初日の前日までに提出します。\n【ひっかけ】1億円以下などと数字を変える出題に注意します。"}, {"id": "tf:a44b4231df", "c": 4, "s": "問題4-6", "st": 2, "q": "中小法人等の青色申告事業年度に生じた欠損金は、翌期以後10年間繰り越して、所得の全額を限度に控除することができる。", "a": true, "e": "正しい記述です。\n【根拠】中小法人等は所得の全額まで、それ以外の法人は所得の50％までです。\n【ひっかけ】個人の純損失の繰越控除（3年）と区別します。"}, {"id": "tf:62772351e1", "c": 4, "s": "問題4-6", "st": 1, "q": "消費税の簡易課税制度を選択した事業者は、原則として2年間は継続して適用しなければならない。", "a": true, "e": "正しい記述です。\n【根拠】簡易課税制度選択不適用届出書は、2年間継続適用した後でなければ提出できません。\n【ひっかけ】課税事業者選択届出も、原則2年間継続適用が必要です。"}, {"id": "tf:f7a65f253d", "c": 4, "s": "問題4-6", "st": 1, "q": "免税事業者が適格請求書発行事業者の登録を受けた場合でも、免税事業者のままでいることができる。", "a": false, "e": "誤りです。\n【根拠】適格請求書発行事業者として登録すると、課税事業者として消費税の申告・納付が必要です。\n【ひっかけ】登録をやめれば、要件を満たす限り免税事業者に戻れます。"}, {"id": "tf:8bf2e1ae24", "c": 4, "s": "問題4-6", "st": 2, "q": "役員に対して毎月同額を支給する定期同額給与は、法人税の計算上、損金に算入することができる。", "a": true, "e": "正しい記述です。\n【根拠】定期同額給与・事前確定届出給与・業績連動給与は、要件を満たせば損金に算入できます（不相当に高額な部分を除く）。\n【ひっかけ】役員賞与は、事前確定届出給与として届け出ていなければ原則として損金不算入です。"}, {"id": "tf:0931465ae1", "c": 4, "s": "問題4-6", "st": 2, "q": "役員に支給する賞与は、事前に税務署長へ届出をしていなくても、損金に算入することができる。", "a": false, "e": "誤りです。\n【根拠】役員賞与を損金に算入するには、原則として事前確定届出給与として所定の期限までに届け出る必要があります。\n【ひっかけ】従業員への賞与は、届出なしで損金に算入できます。役員と従業員の違いが頻出です。"}, {"id": "tf:023d61e18c", "c": 4, "s": "問題4-6", "st": 1, "q": "法人が受け取った国内の株式の配当金は、一定の部分が益金不算入とされる。", "a": true, "e": "正しい記述です。\n【根拠】受取配当等の益金不算入です。法人間の二重課税を調整します。\n【ひっかけ】保有割合によって不算入となる割合が異なります。"}, {"id": "tf:a42ab1f96e", "c": 4, "s": "問題4-6", "st": 2, "q": "法人が納付した法人税は、損金に算入することができる。", "a": false, "e": "誤りです。\n【根拠】法人税や法人住民税は損金不算入です。\n【ひっかけ】法人事業税や固定資産税は、損金に算入できます。"}, {"id": "tf:fff62bd6dd", "c": 4, "s": "問題4-6", "st": 2, "q": "法人が建物以外の減価償却資産について償却方法を選定しなかった場合の法定償却方法は、定率法である。", "a": true, "e": "正しい記述です。\n【根拠】法人の法定償却方法は原則として定率法です（建物・建物附属設備・構築物は定額法）。\n【ひっかけ】個人の法定償却方法は定額法です。違いが頻出です。"}, {"id": "tf:245545a6fc", "c": 4, "s": "問題4-6", "st": 1, "q": "国や地方公共団体に対する寄附金は、法人の損金に全額算入することができる。", "a": true, "e": "正しい記述です。\n【根拠】国等への寄附金と指定寄附金は全額損金です。\n【ひっかけ】一般の寄附金は、一定の限度額までしか損金になりません。"}, {"id": "tf:57d7a11f7d", "c": 4, "s": "問題4-6", "st": 1, "q": "資本金1億円以下の中小法人の所得金額のうち、年800万円以下の部分には、軽減税率が適用される。", "a": true, "e": "正しい記述です。\n【根拠】年800万円以下の部分の法人税率は15％（特例）です。\n【ひっかけ】それを超える部分は23.2％です。"}, {"id": "tf:b6c04b377d", "c": 4, "s": "問題4-6", "st": 1, "q": "同族会社とは、株主等の上位3人以下とその同族関係者が、発行済株式の50％超を保有する会社をいう。", "a": true, "e": "正しい記述です。\n【根拠】日本の中小企業の多くは同族会社です。\n【ひっかけ】同族会社の行為計算否認などの規定があります。"}, {"id": "tf:1c3d624260", "c": 4, "s": "問題4-6", "st": 2, "q": "会社が役員に対し、時価1,000万円の土地を600万円で譲渡した場合、役員は時価との差額400万円について給与所得として課税される。", "a": true, "e": "正しい記述です。\n【根拠】会社から役員への低額譲渡では、差額が役員給与（給与所得）とされます。\n【ひっかけ】会社側では、その差額が役員給与として損金不算入となることがあります。"}, {"id": "tf:eb24f7dbdd", "c": 4, "s": "問題4-6", "st": 2, "q": "役員が会社に対し、時価1,000万円の土地を400万円で譲渡した場合、役員は時価の1,000万円で譲渡したものとみなされて譲渡所得が計算される。", "a": true, "e": "正しい記述です。\n【根拠】個人から法人への時価の2分の1未満の譲渡は、時価で譲渡したものとみなされます。\n【ひっかけ】会社は時価との差額600万円を受贈益として益金に算入します。"}, {"id": "tf:6dbffa8ba6", "c": 4, "s": "問題4-6", "st": 2, "q": "役員が会社に対し、時価1,000万円の土地を600万円で譲渡した場合、役員は時価の1,000万円で譲渡したものとみなされる。", "a": false, "e": "誤りです。\n【根拠】600万円は時価の2分の1以上なので、実際の譲渡価額600万円で譲渡所得を計算します（同族会社の行為計算否認の場合を除く）。\n【ひっかけ】時価の2分の1未満かどうかがポイントです。"}, {"id": "tf:b707de1341", "c": 4, "s": "問題4-6", "st": 2, "q": "会社が役員に無利息で金銭を貸し付けた場合、通常の利息相当額が役員の給与所得として課税される。", "a": true, "e": "正しい記述です。\n【根拠】役員が経済的利益を受けたとされます。\n【ひっかけ】役員が会社に無利息で貸し付けても、役員には課税されません。"}, {"id": "tf:6650971a12", "c": 4, "s": "問題4-6", "st": 2, "q": "役員が会社に無利息で金銭を貸し付けた場合、通常の利息相当額が役員の雑所得として課税される。", "a": false, "e": "誤りです。\n【根拠】役員から会社への無利息貸付けでは、役員に所得税は課税されません。\n【ひっかけ】会社から役員への無利息貸付けとの違いが頻出です。"}, {"id": "tf:253e98452f", "c": 4, "s": "問題4-6", "st": 1, "q": "役員が会社に時価を超える価額で資産を譲渡した場合、時価を超える部分は役員への給与とされる。", "a": true, "e": "正しい記述です。\n【根拠】時価までが譲渡所得、時価を超える部分が給与所得です。\n【ひっかけ】会社側では、その部分が役員給与となります。"}, {"id": "tf:68486ac327", "c": 4, "s": "問題4-6", "st": 2, "q": "土地の譲渡や住宅の貸付け（貸付期間1か月以上）は、消費税の非課税取引である。", "a": true, "e": "正しい記述です。\n【根拠】預貯金の利子、保険料、社会保険医療なども非課税取引です。\n【ひっかけ】建物の譲渡や店舗の貸付けは課税取引です。"}, {"id": "tf:1263699e55", "c": 4, "s": "問題4-6", "st": 2, "q": "建物の譲渡は、消費税の非課税取引である。", "a": false, "e": "誤りです。\n【根拠】建物の譲渡は課税取引です。土地の譲渡は非課税取引です。\n【ひっかけ】土地と建物の違いが頻出です。"}, {"id": "tf:33ec046f94", "c": 4, "s": "問題4-6", "st": 1, "q": "基準期間がない新設法人であっても、事業年度開始の日の資本金の額が1,000万円以上である場合は、消費税の課税事業者となる。", "a": true, "e": "正しい記述です。\n【根拠】資本金1,000万円以上の新設法人は、設立当初から課税事業者です。\n【ひっかけ】1,000万円未満なら、原則として設立当初2年間は免税事業者になれます。"}, {"id": "tf:acb3d61364", "c": 4, "s": "問題4-6", "st": 2, "q": "簡易課税制度のみなし仕入率は、小売業が90％、卸売業が80％である。", "a": false, "e": "誤りです。\n【根拠】卸売業が90％、小売業が80％です。\n【ひっかけ】製造業70％、その他60％、サービス業50％、不動産業40％です。"}, {"id": "tf:6759b48b92", "c": 4, "s": "問題4-6", "st": 1, "q": "個人事業者の消費税の確定申告期限は、原則として翌年3月31日である。", "a": true, "e": "正しい記述です。\n【根拠】所得税の確定申告期限（3月15日）とは異なります。\n【ひっかけ】法人は原則として課税期間の末日の翌日から2か月以内です。"}, {"id": "tf:ac4a3e1619", "c": 4, "s": "問題4-6", "st": 2, "q": "法人の交際費等のうち、取引先との飲食費で1人あたり1万円以下のものは、一定の要件を満たせば交際費等から除かれる。", "a": true, "e": "正しい記述です。\n【根拠】社内飲食費（自社の役員・従業員だけの飲食）は除外の対象外です。\n【ひっかけ】参加者や人数などを記載した書類の保存が必要です。"}, {"id": "tf:c294c375a8", "c": 4, "s": "問題4-6", "st": 2, "q": "法人が従業員に支給した賞与は、事前に税務署長に届け出なければ損金に算入できない。", "a": false, "e": "誤りです。\n【根拠】従業員への賞与は、届出なしで損金に算入できます。\n【ひっかけ】事前確定届出給与の届出が必要なのは、役員への賞与です。"}, {"id": "tf:7955a7b803", "c": 4, "s": "問題4-6", "st": 1, "q": "法人が役員に支給した給与のうち、不相当に高額な部分の金額は、損金に算入されない。", "a": true, "e": "正しい記述です。\n【根拠】職務の内容や同業他社の支給状況などから判断されます。\n【ひっかけ】役員退職給与も、不相当に高額な部分は損金不算入です。"}, {"id": "tf:5bc7ad6d51", "c": 4, "s": "問題4-6", "st": 1, "q": "法人が支払った固定資産税は、損金に算入することができない。", "a": false, "e": "誤りです。\n【根拠】固定資産税は損金に算入できます。\n【ひっかけ】法人税・法人住民税は損金不算入です。"}, {"id": "tf:184d35c456", "c": 4, "s": "問題4-6", "st": 2, "q": "消費税の課税事業者は、基準期間の課税売上高が1,000万円を超えた事業者に限られる。", "a": false, "e": "誤りです。\n【根拠】特定期間の課税売上高が1,000万円超の場合や、資本金1,000万円以上の新設法人、インボイス登録をした事業者なども課税事業者です。\n【ひっかけ】課税事業者を自ら選択することもできます。"}, {"id": "tf:11e31c3143", "c": 4, "s": "問題4-6", "st": 1, "q": "法人の消費税の確定申告期限は、原則として課税期間の末日の翌日から2か月以内である。", "a": true, "e": "正しい記述です。\n【根拠】個人事業者は翌年3月31日です。\n【ひっかけ】法人は、申告期限の延長の特例を受けられる場合があります。"}, {"id": "tf:82b9066ea5", "c": 5, "s": "問題5-1", "st": 2, "q": "不動産登記記録の権利部甲区には、抵当権に関する事項が記録される。", "a": false, "e": "誤りです。\n【根拠】抵当権など所有権以外の権利は、権利部乙区に記録されます。甲区は所有権に関する事項です。\n【ひっかけ】差押えは所有権に関する事項として甲区に記録されます。"}, {"id": "tf:2577ab81b0", "c": 5, "s": "問題5-1", "st": 2, "q": "不動産登記には公信力が認められていないため、登記記録を信頼して取引しても、真の権利者に対抗できないことがある。", "a": true, "e": "正しい記述です。\n【根拠】日本の不動産登記には公信力がありません。\n【ひっかけ】対抗力（第三者に権利を主張できる力）はあります。公信力と対抗力を混同しないようにします。"}, {"id": "tf:9f2a4416ea", "c": 5, "s": "問題5-1", "st": 1, "q": "仮登記には対抗力はないが、後に本登記をした場合、本登記の順位は仮登記の順位による。", "a": true, "e": "正しい記述です。\n【根拠】仮登記には順位保全の効力があります。\n【ひっかけ】「仮登記にも対抗力がある」とする出題に注意します。"}, {"id": "tf:903c04b0a9", "c": 5, "s": "問題5-1", "st": 1, "q": "登記事項証明書は、その不動産の利害関係人でなければ交付を請求することができない。", "a": false, "e": "誤りです。\n【根拠】手数料を納付すれば、誰でも交付を請求できます。\n【ひっかけ】オンラインで請求することもできます。"}, {"id": "tf:bcc9519138", "c": 5, "s": "問題5-1", "st": 2, "q": "相続税路線価は、国税庁が毎年1月1日を価格判定日として公表するもので、公示価格の70％程度が目安とされている。", "a": false, "e": "誤りです。\n【根拠】相続税路線価は公示価格の80％程度が目安です。\n【ひっかけ】70％程度が目安なのは固定資産税評価額です。"}, {"id": "tf:6df35102a9", "c": 5, "s": "問題5-1", "st": 2, "q": "基準地標準価格は、都道府県が毎年7月1日を価格判定の基準日として公表する。", "a": true, "e": "正しい記述です。\n【根拠】基準地標準価格（都道府県地価調査）は、7月1日時点の価格を9月ごろに公表します。\n【ひっかけ】公示価格は国土交通省が1月1日時点の価格を3月に公表します。"}, {"id": "tf:5041866bde", "c": 5, "s": "問題5-1", "st": 1, "q": "固定資産税評価額は、原則として3年ごとに評価替えが行われる。", "a": true, "e": "正しい記述です。\n【根拠】固定資産税評価額は、市町村が3年ごとに評価替えをします。\n【ひっかけ】公示価格・路線価は毎年公表されます。"}, {"id": "tf:95ff75b081", "c": 5, "s": "問題5-1", "st": 2, "q": "収益還元法のうちDCF法は、一期間の純収益を還元利回りで還元して収益価格を求める方法である。", "a": false, "e": "誤りです。\n【根拠】記述は直接還元法の説明です。DCF法は、複数期間の純収益と復帰価格をそれぞれ現在価値に割り引いて合計します。\n【ひっかけ】直接還元法とDCF法の入れ替えが頻出です。"}, {"id": "tf:e04fbb66c9", "c": 5, "s": "問題5-1", "st": 2, "q"

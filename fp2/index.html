[[不動産所得]]、[[事業所得]]、[[山林所得]]、[[譲渡所得]]の損失に限られる。\n⑵　損益通算できない主な損失\n不動産所得の損失のうち、[[土地の取得]]に要した負債の利子に相当する部分。\n[[ゴルフ会員権]]など、生活に通常必要でない資産の譲渡損失。\n一時所得・雑所得の損失。\n⑶　上場株式等の譲渡損失\n[[申告分離課税]]を選択した上場株式等の配当所得・利子所得と損益通算できる。\n控除しきれない損失は、確定申告により翌年以後[[3年間]]繰り越して控除できる。\n⑷　純損失の繰越控除\n[[青色申告者]]は、純損失の金額を翌年以後[[3年間]]繰り越して控除できる。"}, {"id": "cloze:f9c1935d7e", "c": 4, "s": "問題4-4〔1〕", "st": 2, "title": "主な所得控除", "t": "⑴　医療費控除\n（支払った医療費－保険金などで補てんされる金額）－[[10万円]]（総所得金額等が200万円未満の場合は総所得金額等の[[5％]]）。\n控除の上限は[[200万円]]。\n⑵　セルフメディケーション税制（医療費控除の特例）\n特定一般用医薬品等の購入費－[[1万2,000円]]。上限は[[8万8,000円]]。通常の医療費控除との[[選択適用]]。\n⑶　社会保険料控除・小規模企業共済等掛金控除\n支払った金額の[[全額]]が控除される。\n生計を一にする親族の社会保険料を負担した場合も、社会保険料控除の対象と[[なる]]。\n⑷　寄附金控除\n特定寄附金の額（総所得金額等の40％が限度）－[[2,000円]]。\n⑸　雑損控除\n生活に通常必要な資産について、災害・盗難・[[横領]]による損失が対象。[[詐欺]]・恐喝による損失は対象外。"}, {"id": "cloze:042e2ba645", "c": 4, "s": "問題4-4〔2〕", "st": 2, "title": "扶養控除・配偶者控除", "t": "⑴　扶養控除\n年齢[[16歳]]未満の扶養親族は対象外。\n一般の控除対象扶養親族（16歳以上）：[[38万円]]\n特定扶養親族（[[19歳]]以上[[23歳]]未満）：[[63万円]]\n老人扶養親族（[[70歳]]以上）：[[48万円]]（同居老親等は[[58万円]]）\n年齢は、その年の[[12月31日]]現在で判定する。\n⑵　配偶者控除\n納税者本人の合計所得金額が[[1,000万円]]以下であることが要件。\n配偶者が[[青色事業専従者]]として給与を受けている場合は、対象とならない。"}, {"id": "cloze:5ccdde094e", "c": 4, "s": "問題4-4〔3〕", "st": 2, "title": "人的控除・医療費控除の範囲", "t": "⑴　障害者控除\n障害者[[27万円]]、特別障害者[[40万円]]、同居特別障害者[[75万円]]。\n⑵　医療費控除の対象\n治療のための医薬品の購入費、通院のための電車・バス代は対象と[[なる]]。\n健康診断・人間ドックの費用は原則対象外だが、重大な疾病が見つかり[[治療]]を受けた場合は対象となる。\n美容整形の費用は対象[[外]]。\n⑶　寄附金控除とふるさと納税\n給与所得者などで確定申告が不要な者は、寄附先が[[5]]自治体以内であれば、[[ワンストップ特例]]により確定申告をせずに住民税の控除を受けられる。"}, {"id": "cloze:fd65598bf6", "c": 4, "s": "問題4-4〔4〕", "st": 2, "title": "所得控除の補足", "t": "⑴　配偶者控除と配偶者特別控除\n同じ配偶者について、配偶者控除と配偶者特別控除を[[重ねて]]受けることはできない。\n配偶者特別控除も、納税者本人の合計所得金額が[[1,000万円]]以下であることが要件。\n⑵　年齢の判定\n扶養控除などの年齢は、その年の[[12月31日]]の現況で判定する。年の途中で死亡した場合は、[[死亡時]]の現況で判定する。\n⑶　医療費控除の補てん\n保険金などで補てんされる金額は、その給付の目的となった[[医療費]]から差し引く。差し引ききれない金額を他の医療費から差し引く必要は[[ない]]。"}, {"id": "cloze:84b1da2a75", "c": 4, "s": "問題4-5〔1〕", "st": 2, "title": "住宅借入金等特別控除", "t": "⑴　主な要件\n床面積が[[50㎡]]以上（合計所得金額が[[1,000万円]]以下の年は、新築等について[[40㎡]]以上）で、床面積の[[2分の1]]以上が居住用であること。\n控除を受ける年の合計所得金額が[[2,000万円]]以下であること。\n借入金の返済期間が[[10年]]以上であること。\n取得等の日から[[6か月]]以内に居住し、適用を受ける年の[[12月31日]]まで引き続き居住していること。\n⑵　控除率\n年末借入金残高×[[0.7％]]\n⑶　手続\n適用を受ける最初の年は[[確定申告]]が必要。給与所得者は、2年目以降は[[年末調整]]で適用を受けられる。"}, {"id": "cloze:e05b1d8c34", "c": 4, "s": "問題4-5〔2〕", "st": 2, "title": "確定申告・青色申告", "t": "⑴　確定申告\n所得があった年の翌年[[2月16日]]から[[3月15日]]までに行う。\n給与所得者でも、給与の収入金額が[[2,000万円]]を超える場合や、給与所得・退職所得以外の所得金額が[[20万円]]を超える場合は、確定申告が必要。\n⑵　準確定申告\n年の途中で死亡した場合、相続人は、相続の開始があったことを知った日の翌日から[[4か月]]以内に申告する。\n⑶　青色申告\n対象は、[[不動産所得]]・[[事業所得]]・[[山林所得]]のある者。\n承認申請書は、適用を受けようとする年の[[3月15日]]まで（その年の1月16日以後に開業した場合は開業日から[[2か月]]以内）に提出する。\n⑷　青色申告特別控除\n不動産所得（事業的規模）又は事業所得があり、正規の簿記で記帳し、期限内に申告するなどの要件を満たすと[[55万円]]。さらに[[e-Tax]]による申告などの要件を満たすと[[65万円]]。それ以外は[[10万円]]。"}, {"id": "cloze:212cf04508", "c": 4, "s": "問題4-5〔3〕", "st": 2, "title": "申告の訂正・青色申告者の特典", "t": "⑴　更正の請求\n納めすぎた税金を返してもらう手続。原則として法定申告期限から[[5年]]以内。\n⑵　修正申告\n申告した税額が[[少なすぎた]]場合に行う。\n⑶　青色申告者の主な特典\n青色申告特別控除、[[青色事業専従者給与]]の必要経費算入、純損失の[[3年間]]の繰越控除、純損失の前年への[[繰戻し還付]]。\n帳簿書類は原則として[[7年間]]保存する。\n⑷　住民税と個人事業税\n住民税は、[[1月1日]]現在の住所地の市町村で、[[前年]]の所得に対して課税される。\n個人事業税には、[[事業主控除]]（年290万円）がある。"}, {"id": "cloze:b21c738f6b", "c": 4, "s": "問題4-5〔4〕", "st": 2, "title": "申告・納付の補足", "t": "⑴　納付\n確定申告による所得税は、原則として[[3月15日]]までに納付する。[[振替納税]]を利用すると、引落日は4月中旬ごろになる。\n⑵　予定納税\n前年の所得税額をもとに計算した予定納税基準額が[[15万円]]以上の場合、[[7月]]と[[11月]]に、それぞれ3分の1ずつ前払いする。\n⑶　還付申告\n確定申告をする義務のない者が還付を受けるための申告は、その年の翌年1月1日から[[5年間]]提出できる。\n⑷　青色事業専従者\n青色申告者と生計を一にする配偶者その他の親族で、年齢が[[15歳]]以上、その年の[[6か月]]を超える期間、事業にもっぱら従事する者。\n⑸　白色申告の事業専従者控除\n配偶者は最高[[86万円]]、それ以外の親族は1人につき最高[[50万円]]。\n⑹　住民税\n所得割の税率は一律[[10％]]。給与所得者は、毎月の給与から天引きされる[[特別徴収]]が原則。"}, {"id": "cloze:091dae8d52", "c": 4, "s": "問題4-6〔1〕", "st": 2, "title": "法人税", "t": "⑴　交際費等\n期末資本金の額が1億円以下の法人（一定の法人を除く）は、年[[800万円]]までの定額控除限度額と、接待飲食費の[[50％]]相当額のいずれかを選択して損金に算入できる。\n1人あたり[[1万円]]以下の飲食費（社内飲食費を除く）は、交際費等から除かれる。\n⑵　役員給与\n損金に算入できるのは、[[定期同額給与]]、[[事前確定届出給与]]、[[業績連動給与]]。\n不相当に高額な部分は、損金に算入されない。\n⑶　申告期限\n原則として、事業年度終了の日の翌日から[[2か月]]以内。"}, {"id": "cloze:07dc8da6b3", "c": 4, "s": "問題4-6〔2〕", "st": 2, "title": "消費税", "t": "⑴　納税義務の免除\n基準期間（個人は前々年、法人は原則前々事業年度）の課税売上高が[[1,000万円]]以下の事業者は、原則として免税事業者となる。\nただし、[[特定期間]]の課税売上高が1,000万円を超える場合は課税事業者となる（[[給与等支払額]]で判定することもできる）。\n⑵　簡易課税制度\n基準期間の課税売上高が[[5,000万円]]以下の事業者が選択できる。\n適用を受けようとする課税期間の初日の[[前日]]までに届出書を提出する。"}, {"id": "cloze:4818593503", "c": 4, "s": "問題4-6〔3〕", "st": 2, "title": "法人の欠損金・消費税の届出", "t": "⑴　欠損金の繰越控除\n青色申告書を提出した事業年度の欠損金は、翌期以後[[10年間]]繰り越して控除できる。\n中小法人等は所得の[[全額]]まで、それ以外の法人は所得の[[50％]]までが控除の限度。\n⑵　簡易課税制度\nいったん選択すると、原則として[[2年間]]は継続して適用しなければならない。\n⑶　適格請求書発行事業者（インボイス）\n免税事業者も登録を受けることができるが、登録すると[[課税事業者]]となる。"}, {"id": "cloze:dd307f0c1a", "c": 4, "s": "問題4-6〔4〕", "st": 2, "title": "法人税の補足", "t": "⑴　申告調整\n企業会計の利益に、[[益金算入]]・[[損金不算入]]を加算し、[[益金不算入]]・[[損金算入]]を減算して所得金額を求める。\n⑵　主な調整項目\n受取配当等の[[益金不算入]]、法人税・住民税の[[損金不算入]]、交際費等の[[損金不算入]]など。\n⑶　減価償却\n法人の法定償却方法は、原則として[[定率法]]（建物などは定額法）。\n⑷　税率\n普通法人の法人税率は[[23.2％]]。資本金1億円以下の中小法人は、所得金額のうち年[[800万円]]以下の部分に軽減税率（15％）が適用される。\n⑸　同族会社\n株主等の上位[[3人]]以下とその同族関係者で、発行済株式の[[50％]]超を保有する会社。"}, {"id": "cloze:895f55de4c", "c": 4, "s": "問題4-6〔5〕", "st": 2, "title": "会社と役員の取引", "t": "⑴　会社が役員に資産を低額で譲渡した場合\n会社：時価と譲渡価額の差額は役員への[[給与]]（損金不算入になることがある）。\n役員：時価と譲渡価額の差額は[[給与所得]]。\n⑵　役員が会社に資産を低額で譲渡した場合\n時価の[[2分の1]]未満で譲渡すると、役員は[[時価]]で譲渡したものとみなされて譲渡所得が課税される。\n会社は、時価と譲渡価額の差額を[[受贈益]]として益金に算入する。\n⑶　役員が会社に資産を高額で譲渡した場合\n時価を超える部分は、役員への[[給与]]とされる。\n⑷　金銭の貸借\n会社が役員に無利息で貸し付けると、通常の利息相当額が役員の[[給与所得]]となる。\n役員が会社に無利息で貸し付けても、役員に所得税は課税[[されない]]。"}, {"id": "cloze:dd62474b73", "c": 4, "s": "問題4-6〔6〕", "st": 2, "title": "消費税の補足", "t": "⑴　非課税取引\n[[土地]]の譲渡・貸付け（一時的なものを除く）、[[住宅]]の貸付け（1か月以上）、預貯金の利子、保険料、社会保険医療など。\n⑵　不課税取引\n寄附金、給与、配当など、対価を得て行う取引に当たらないもの。\n⑶　新設法人の特例\n基準期間がない法人でも、事業年度開始の日の資本金の額が[[1,000万円]]以上の場合は、課税事業者となる。\n⑷　簡易課税制度のみなし仕入率\n卸売業[[90％]]、小売業[[80％]]、製造業[[70％]]、その他[[60％]]、サービス業[[50％]]、不動産業[[40％]]。\n⑸　申告期限\n個人事業者は翌年[[3月31日]]、法人は原則として課税期間の末日の翌日から[[2か月]]以内。"}, {"id": "cloze:a78dce5506", "c": 5, "s": "問題5-1〔1〕", "st": 2, "title": "不動産登記", "t": "⑴　登記記録の構成\n[[表題部]]：土地の所在・地番・地目・地積、建物の所在・家屋番号・種類・構造・床面積などを記録する。\n権利部[[甲区]]：[[所有権]]に関する事項を記録する（差押えなどを含む）。\n権利部[[乙区]]：[[抵当権]]や賃借権など、所有権以外の権利に関する事項を記録する。\n⑵　登記の効力\n登記には[[対抗力]]はあるが、[[公信力]]はない。登記を信じて取引しても、真の権利者に対抗できないことがある。\n[[仮登記]]には対抗力はないが、本登記をしたときの[[順位を保全]]する効力がある。\n⑶　登記事項証明書\n手数料を納付すれば、[[誰でも]]交付を請求できる。"}, {"id": "cloze:67e4d7eceb", "c": 5, "s": "問題5-1〔2〕", "st": 2, "title": "土地の価格", "t": "⑴　[[公示価格]]\n[[国土交通省]]（土地鑑定委員会）が、毎年[[1月1日]]時点の価格を3月に公表する。\n⑵　[[基準地標準価格]]\n[[都道府県]]が、毎年[[7月1日]]時点の価格を9月に公表する。\n⑶　[[相続税路線価]]\n[[国税庁]]が、毎年[[1月1日]]時点の価格を7月に公表する。公示価格の[[80％]]程度が目安。\n⑷　[[固定資産税評価額]]\n[[市町村]]（東京23区は都）が、[[3年]]ごとに評価替えをする。公示価格の[[70％]]程度が目安。\n⑸　鑑定評価の手法\n[[原価法]]：再調達原価に減価修正を行って積算価格を求める。\n[[取引事例比較法]]：多数の取引事例に事情補正・時点修正などを行って比準価格を求める。\n[[収益還元法]]：将来生み出す純収益をもとに収益価格を求める。[[直接還元法]]と[[DCF法]]がある。"}, {"id": "cloze:6e67d233bb", "c": 5, "s": "問題5-1〔3〕", "st": 2, "title": "登記の手続", "t": "⑴　表示に関する登記\n建物を新築した場合などは、[[1か月]]以内に表題登記を申請しなければならない。\n⑵　権利に関する登記\n原則として申請の義務はないが、相続により不動産を取得した相続人は、取得を知った日から[[3年]]以内に相続登記を申請しなければならない（2024年4月から義務化）。\n権利に関する登記は、原則として登記権利者と登記義務者が[[共同]]で申請する。\n⑶　抵当権の順位\n同じ不動産に複数の抵当権が設定された場合、その順位は登記の[[先後]]による。\n⑷　直接還元法\n一期間の純収益÷[[還元利回り]]＝収益価格"}, {"id": "cloze:fe63cfa219", "c": 5, "s": "問題5-2〔1〕", "st": 2, "title": "宅地建物取引業法", "t": "⑴　媒介契約\n[[一般媒介契約]]：複数の業者に重ねて依頼できる。\n[[専任媒介契約]]：有効期間は[[3か月]]以内。業務の処理状況を[[2週間]]に1回以上報告する。\n[[専属専任媒介契約]]：有効期間は[[3か月]]以内。業務の処理状況を[[1週間]]に1回以上報告する。依頼者が自ら見つけた相手とも契約[[できない]]。\n⑵　報酬の上限（売買の媒介、税抜）\n売買代金が400万円を超える場合：売買代金×[[3％]]＋[[6万円]]\n⑶　宅建業者が自ら売主となる場合（買主は宅建業者以外）\n受け取る手付金は代金の[[20％]]を超えてはならない。手付は[[解約手付]]とされる。\n⑷　重要事項の説明\n[[契約締結前]]に、[[宅地建物取引士]]が書面（又は電磁的方法）を交付して説明する。"}, {"id": "cloze:2405a1394d", "c": 5, "s": "問題5-2〔2〕", "st": 2, "title": "売買契約に関する民法の規定", "t": "⑴　解約手付\n[[相手方が契約の履行に着手]]するまでは、買主は手付を[[放棄]]し、売主は手付の[[倍額]]を現実に提供して、契約を解除できる。\n⑵　契約不適合責任\n引き渡された目的物が契約の内容に適合しない場合、買主は売主に対して、追完請求・代金減額請求・損害賠償請求・契約の解除をすることができる。\n種類・品質に関する不適合は、買主が不適合を知った時から[[1年]]以内に売主に通知しなければならない。\n⑶　危険負担\n引渡し前に、当事者双方の責めに帰することができない事由で建物が滅失した場合、買主は代金の支払を[[拒む]]ことができる。"}, {"id": "cloze:f2bac2af43", "c": 5, "s": "問題5-2〔3〕", "st": 2, "title": "取引のその他のルール", "t": "⑴　宅地建物取引業の範囲\n自ら所有する建物を[[貸す]]こと（自ら貸主）は、宅地建物取引業に当たらない。\n⑵　賃貸の媒介の報酬\n貸主・借主から受け取れる報酬の合計は、借賃の[[1か月分]]＋消費税が上限。\n⑶　クーリング・オフ\n宅建業者が自ら売主となる売買で、事務所等[[以外]]の場所で申込み・契約をした買主は、書面で告げられた日から[[8日]]以内なら解除できる。\n⑷　契約不適合責任の特約\n宅建業者が自ら売主の場合、通知期間を引渡しの日から[[2年]]以上とする特約を除き、買主に不利な特約は無効。\n⑸　共有物\n[[保存行為]]は各共有者が単独で、[[管理行為]]は持分の価格の過半数で、[[変更行為]]（軽微なものを除く）は全員の同意で行う。\n自分の持分は、他の共有者の同意なく[[単独で]]処分できる。"}, {"id": "cloze:a7403a26c2", "c": 5, "s": "問題5-3〔1〕", "st": 2, "title": "借地借家法", "t": "⑴　普通借地権\n存続期間は[[30年]]以上（期間の定めがない場合は30年）。\n最初の更新後は[[20年]]以上、2回目以降の更新後は[[10年]]以上。\n⑵　定期借地権\n[[一般定期借地権]]：存続期間[[50年]]以上。書面（又は電磁的記録）で契約する。\n[[事業用定期借地権等]]：存続期間[[10年]]以上[[50年]]未満。[[公正証書]]で契約する。居住用の建物には設定できない。\n[[建物譲渡特約付借地権]]：存続期間[[30年]]以上。\n⑶　普通借家契約\n期間を[[1年未満]]とした場合は、期間の定めがないものとみなされる。\n賃貸人からの更新拒絶や解約の申入れには[[正当の事由]]が必要。\n⑷　定期借家契約\n[[書面]]（又は電磁的記録）で契約する。期間を1年未満とすることも[[できる]]。\n契約前に、更新がなく期間の満了で終了することを書面を交付して説明しなければならない。\n期間が1年以上の場合、賃貸人は期間満了の[[1年前から6か月前]]までに、終了する旨を通知しなければならない。\n⑸　造作買取請求権\n特約で[[排除できる]]。"}, {"id": "cloze:4721b86d96", "c": 5, "s": "問題5-3〔2〕", "st": 2, "title": "区分所有法", "t": "⑴　共用部分の持分\n各区分所有者の持分は、原則として専有部分の[[床面積]]の割合による。\n⑵　集会の決議\n規約の設定・変更・廃止：区分所有者及び議決権の各[[4分の3]]以上。\n建替え：区分所有者及び議決権の各[[5分の4]]以上。\n⑶　敷地利用権\n専有部分と敷地利用権は、規約に別段の定めがない限り、[[分離して処分できない]]。"}, {"id": "cloze:3743aa39fc", "c": 5, "s": "問題5-3〔3〕", "st": 2, "title": "借地権・借家権の対抗力", "t": "⑴　借地権の対抗力\n借地権の登記がなくても、借地上に[[借地権者本人名義]]で登記された建物を所有していれば、第三者に対抗できる。\n[[配偶者]]や子の名義で登記した建物では、対抗[[できない]]。\n⑵　借家権の対抗力\n借家権の登記がなくても、建物の[[引渡し]]を受けていれば、その後の建物の取得者に対抗できる。\n⑶　定期借家契約の中途解約\n床面積[[200㎡]]未満の居住用建物で、転勤・療養などやむを得ない事情により生活の本拠として使用することが困難となった場合、賃借人は中途解約を申し入れることができる。"}, {"id": "cloze:51dfecaa8e", "c": 5, "s": "問題5-4〔1〕", "st": 2, "title": "都市計画法・建築基準法", "t": "⑴　区域区分\n[[市街化区域]]：すでに市街地を形成している区域と、おおむね[[10年]]以内に優先的・計画的に市街化を図るべき区域。[[用途地域]]を定める。\n[[市街化調整区域]]：市街化を抑制すべき区域。原則として用途地域を定めない。\n⑵　開発許可\n市街化区域内で[[1,000㎡]]以上の開発行為を行う場合は、原則として都道府県知事等の許可が必要。\n⑶　接道義務\n建築物の敷地は、原則として幅員[[4m]]以上の道路に[[2m]]以上接していなければならない。\n幅員4m未満の道（[[2項道路]]）は、原則として道路の中心線から[[2m]]後退した線を道路の境界線とみなす。後退した部分は、建ぺい率・容積率の計算上、敷地面積に[[算入しない]]。\n⑷　建ぺい率の緩和\n[[防火地域]]内の耐火建築物等、準防火地域内の耐火建築物等・準耐火建築物等：[[10％]]加算。\n特定行政庁が指定する[[角地]]：[[10％]]加算。\n⑸　容積率の制限\n前面道路の幅員が[[12m]]未満の場合、指定容積率と、前面道路の幅員×法定乗数（住居系の用途地域は原則[[10分の4]]、その他は原則[[10分の6]]）のいずれか[[低い]]ほう。\n⑹　敷地が2つの地域にまたがる場合\n用途制限は、敷地の[[過半]]が属する地域の制限による。\n建ぺい率・容積率は、それぞれの地域の面積で[[加重平均]]する。"}, {"id": "cloze:517e203651", "c": 5, "s": "問題5-4〔2〕", "st": 2, "title": "農地法", "t": "⑴　[[3条]]（権利移動）\n農地を農地のまま売買などする場合は、[[農業委員会]]の許可が必要。\n⑵　[[4条]]（転用）\n自分の農地を農地以外に転用する場合は、原則として[[都道府県知事]]等の許可が必要。\n⑶　[[5条]]（転用目的の権利移動）\n農地を転用する目的で売買などする場合は、原則として[[都道府県知事]]等の許可が必要。\n⑷　市街化区域内の特例\n市街化区域内の農地について4条・5条の転用をする場合は、あらかじめ[[農業委員会]]に[[届け出れば]]、許可は不要。"}, {"id": "cloze:969aa584b3", "c": 5, "s": "問題5-4〔3〕", "st": 2, "title": "高さの制限など", "t": "⑴　絶対高さの制限\n第一種・第二種低層住居専用地域と田園住居地域では、建築物の高さは原則[[10m]]又は[[12m]]以下。\n⑵　斜線制限\n[[道路斜線制限]]はすべての用途地域に適用される。\n[[北側斜線制限]]は、第一種・第二種低層住居専用地域、田園住居地域、第一種・第二種中高層住居専用地域に適用される。\n[[隣地斜線制限]]は、第一種・第二種低層住居専用地域と田園住居地域には適用されない。\n⑶　開発許可の規模\n市街化区域：[[1,000㎡]]以上、非線引き区域・準都市計画区域：[[3,000㎡]]以上、都市計画区域・準都市計画区域外：[[1ha]]以上。\n⑷　生産緑地\n指定から[[30年]]を経過すると、市町村に買取りの申出ができる。特定生産緑地に指定されると、買取りの申出ができる時期が[[10年]]延長される。"}, {"id": "cloze:00c5f40d45", "c": 5, "s": "問題5-5〔1〕", "st": 2, "title": "取得時の税金", "t": "⑴　不動産取得税\n[[都道府県]]が課税する。[[相続]]や法人の合併による取得には課税されない。[[贈与]]による取得には課税される。\n宅地の課税標準は、固定資産税評価額の[[2分の1]]とする特例がある。\n⑵　登録免許税\n所有権移転登記の税率は、[[相続]]による場合は[[0.4％]]、売買・贈与による場合は原則[[2％]]。\n⑶　印紙税\n不動産の売買契約書に印紙を貼らなかった場合でも、契約は[[有効]]。ただし[[過怠税]]が課される。"}, {"id": "cloze:89abd90740", "c": 5, "s": "問題5-5〔2〕", "st": 2, "title": "保有時の税金", "t": "⑴　固定資産税\n毎年[[1月1日]]現在の固定資産課税台帳の所有者に、[[市町村]]が課税する。標準税率は[[1.4％]]。\n⑵　住宅用地の課税標準の特例\n小規模住宅用地（住宅1戸あたり[[200㎡]]以下の部分）：固定資産税は[[6分の1]]、都市計画税は[[3分の1]]。\n一般住宅用地（200㎡を超える部分）：固定資産税は[[3分の1]]、都市計画税は[[3分の2]]。\n⑶　都市計画税\n原則として[[市街化区域]]内の土地・家屋に課税する。制限税率は[[0.3％]]。"}, {"id": "cloze:df03f1757e", "c": 5, "s": "問題5-5〔3〕", "st": 2, "title": "税金の補足", "t": "⑴　課税標準\n不動産取得税・登録免許税（所有権の移転・保存）・固定資産税の課税標準は、原則として[[固定資産税評価額]]。\n抵当権設定登記の登録免許税の課税標準は、[[債権金額]]。\n⑵　不動産取得税の税率\n標準税率は4％。土地と住宅の取得は[[3％]]（特例）。\n⑶　消費税\n土地の譲渡は[[非課税]]、建物の譲渡は[[課税]]。\n⑷　固定資産税の納付\n原則として年[[4回]]に分けて納める。"}, {"id": "cloze:9fb52c6f59", "c": 5, "s": "問題5-6〔1〕", "st": 2, "title": "居住用財産の譲渡の特例", "t": "⑴　居住用財産の3,000万円特別控除\n所有期間の長短に[[関係なく]]適用を受けられる。\n配偶者・直系血族・生計を一にする親族などへの譲渡は[[適用できない]]。\n居住しなくなった日から[[3年]]を経過する日の属する年の[[12月31日]]までに譲渡することが必要。\n前年・前々年にこの特例などの適用を受けていないことが必要。\n⑵　軽減税率の特例\n譲渡した年の1月1日における所有期間が[[10年]]を超える居住用財産を譲渡した場合、課税長期譲渡所得金額のうち[[6,000万円]]以下の部分の税率は[[14.21％]]（所得税・復興特別所得税10.21％、住民税4％）。\n3,000万円特別控除と[[併用できる]]。\n⑶　特定の居住用財産の買換え特例\n所有期間[[10年]]超、居住期間[[10年]]以上、譲渡価額[[1億円]]以下などが要件。\n3,000万円特別控除とは[[選択適用]]。"}, {"id": "cloze:cfc9631e87", "c": 5, "s": "問題5-6〔2〕", "st": 2, "title": "不動産投資の指標", "t": "⑴　[[表面利回り（単純利回り）]]\n年間収入合計÷投資総額×100\n⑵　[[NOI利回り（純利回り）]]\n（年間収入合計－[[諸経費]]）÷投資総額×100\n⑶　[[DCF法]]\n将来の純収益と復帰価格（売却予想価格）を、それぞれ発生する時期に応じて[[現在価値]]に割り引き、合計して収益価格を求める。\n⑷　[[J-REIT（不動産投資信託）]]\n証券取引所に上場している。分配金は配当所得となるが、[[配当控除]]の適用は受けられない。"}, {"id": "cloze:e5c7d30719", "c": 5, "s": "問題5-6〔3〕", "st": 2, "title": "土地の有効活用", "t": "⑴　[[事業受託方式]]\n土地活用の企画から建設、管理・運営までをデベロッパーに任せる。資金は[[土地所有者]]が調達する。\n⑵　[[等価交換方式]]\n土地所有者が土地を出資し、デベロッパーが建設資金を出す。完成後、出資割合に応じて土地と建物を[[取得]]する。\n⑶　[[建設協力金方式]]\n入居予定の[[テナント]]から預かった建設協力金を建設資金に充てる。建物の所有者は[[土地所有者]]。\n⑷　[[定期借地権方式]]\n土地を貸して地代を得る。土地所有者の資金負担は[[ない]]。"}, {"id": "cloze:42f051a2e9", "c": 5, "s": "問題5-6〔4〕", "st": 2, "title": "その他の譲渡の特例", "t": "⑴　被相続人の居住用財産（空き家）の3,000万円特別控除\n[[1981年5月31日]]以前に建築された家屋などが対象。相続人が[[3人]]以上の場合、1人あたりの控除額は[[2,000万円]]。\n⑵　居住用財産の譲渡損失の損益通算・繰越控除\n一定の要件を満たせば、譲渡損失を他の所得と損益通算し、控除しきれない損失を翌年以後[[3年間]]繰り越せる。\n⑶　収用等の特別控除\n公共事業のために土地等を収用された場合、[[5,000万円]]の特別控除がある。"}, {"id": "cloze:a445a253d7", "c": 5, "s": "問題5-6〔5〕", "st": 2, "title": "譲渡所得の計算と投資判断", "t": "⑴　譲渡所得の計算\n譲渡収入金額－（[[取得費]]＋[[譲渡費用]]）－特別控除額\n⑵　譲渡費用になるもの\n仲介手数料、売買契約書の印紙代、譲渡のための建物の[[取壊し費用]]、借家人への立退料など。\n固定資産税の精算金は、譲渡収入金額に[[含める]]。\n⑶　建物の取得費\n取得価額から[[減価償却費相当額]]を差し引いた金額。\n⑷　NPV法とIRR法\n[[NPV法]]（正味現在価値法）：将来の収益の現在価値の合計が投資額を上回れば（NPVが[[正]]なら）投資に値する。\n[[IRR法]]（内部収益率法）：IRRが投資家の[[期待収益率]]を上回れば投資に値する。\n⑸　レバレッジ効果\n借入金の金利が投資の利回りより[[低い]]場合、借入れを利用すると自己資金に対する利回りが高まる。"}, {"id": "cloze:10ebb154b3", "c": 6, "s": "問題6-1〔1〕", "st": 2, "title": "贈与契約", "t": "⑴　贈与の成立\n贈与は、当事者の一方が財産を無償で与える意思を表示し、相手方が[[受諾]]することで成立する（[[諾成契約]]）。\n⑵　書面によらない贈与\n各当事者が解除できる。ただし、[[履行の終わった]]部分は解除できない。\n⑶　[[負担付贈与]]\n受贈者に一定の負担を課す贈与。贈与者は、負担の限度で売主と同じ担保責任を負う。\n⑷　[[死因贈与]]\n贈与者の死亡によって効力が生じる贈与。課税上は[[相続税]]の対象となる。\n⑸　[[定期贈与]]\n定期の給付を目的とする贈与。贈与者又は受贈者の死亡によって効力を失う。"}, {"id": "cloze:fabcebb686", "c": 6, "s": "問題6-1〔2〕", "st": 2, "title": "贈与税の計算と特例", "t": "⑴　暦年課税\n1月1日から12月31日までの1年間に受けた贈与財産の合計額から、基礎控除[[110万円]]を差し引いて税額を計算する。\n申告期間は、贈与を受けた年の翌年[[2月1日]]から[[3月15日]]まで。\n⑵　贈与税の配偶者控除\n婚姻期間が[[20年]]以上の配偶者から、居住用不動産又はその取得資金の贈与を受けた場合、最高[[2,000万円]]を控除できる（基礎控除と合わせて2,110万円）。\n同じ配偶者からは、一生に[[1回]]だけ適用できる。\n⑶　相続時精算課税\n贈与者は贈与の年の1月1日において[[60歳]]以上の父母・祖父母、受贈者は[[18歳]]以上の子・孫。\n年[[110万円]]の基礎控除のほか、累計[[2,500万円]]の特別控除がある。超えた部分の税率は一律[[20％]]。\n一度選択すると、その贈与者からの贈与について暦年課税に[[戻ることはできない]]。\n贈与者の相続時には、基礎控除を差し引いた後の贈与財産の価額を、[[贈与時]]の価額で相続財産に加算する。"}, {"id": "cloze:552d4fca87", "c": 6, "s": "問題6-1〔3〕", "st": 2, "title": "みなし贈与と非課税の財産", "t": "⑴　みなし贈与財産\n著しく低い価額で財産を譲り受けた場合の、時価との[[差額]]。\n借金を免除してもらった場合の、免除された[[債務]]の額。\n保険料を負担していない者が受け取った生命保険の[[満期保険金]]。\n⑵　贈与税が非課税となる主なもの\n扶養義務者から受けた[[生活費]]や[[教育費]]のうち通常必要と認められるもの（必要な都度、直接充てる場合）。\n社交上必要と認められる香典・祝物・見舞金。\n離婚による[[財産分与]]（過当なものを除く）。\n法人からの贈与（[[所得税]]の対象）。\n⑶　負担付贈与\n課税価格は、贈与財産の価額から[[負担額]]を差し引いた額。土地・建物は[[通常の取引価額]]で評価する。"}, {"id": "cloze:71f10573be", "c": 6, "s": "問題6-1〔4〕", "st": 2, "title": "贈与税の特例の要件", "t": "⑴　贈与税の配偶者控除\n婚姻期間20年以上（[[1年未満]]の端数は切り捨て）。贈与を受けた年の翌年[[3月15日]]までに居住し、その後も居住する見込みであること。税額がゼロでも[[申告]]が必要。\n⑵　住宅取得等資金の贈与の非課税\n受贈者は、贈与を受けた年の1月1日に[[18歳]]以上で、その年の合計所得金額が[[2,000万円]]以下（床面積40㎡以上50㎡未満の場合は1,000万円以下）。\n贈与者は、受贈者の[[直系尊属]]。暦年課税・相続時精算課税のどちらとも[[併用できる]]。\n⑶　相続時精算課税の届出\n最初の贈与を受けた年の翌年[[2月1日]]から[[3月15日]]までに、相続時精算課税選択届出書を提出する。\n⑷　贈与税の納付\n延納は最長[[5年]]。物納は[[できない]]。"}, {"id": "cloze:65e1f522e9", "c": 6, "s": "問題6-2〔1〕", "st": 2, "title": "法定相続人と法定相続分", "t": "⑴　相続順位\n配偶者は常に相続人。第1順位は[[子]]、第2順位は[[直系尊属]]、第3順位は[[兄弟姉妹]]。\n⑵　法定相続分\n配偶者と子：配偶者[[2分の1]]、子[[2分の1]]\n配偶者と直系尊属：配偶者[[3分の2]]、直系尊属[[3分の1]]\n配偶者と兄弟姉妹：配偶者[[4分の3]]、兄弟姉妹[[4分の1]]\n父母の一方だけを同じくする兄弟姉妹（半血兄弟姉妹）の相続分は、父母の双方を同じくする兄弟姉妹の[[2分の1]]。\n⑶　代襲相続\n子が相続開始以前に死亡・欠格・廃除により相続権を失った場合、その子（孫）が代襲する。\n兄弟姉妹の代襲は、その子（[[おい・めい]]）までに限られる。\n相続を[[放棄]]した者の子は、代襲相続人とならない。"}, {"id": "cloze:712e513bbd", "c": 6, "s": "問題6-2〔2〕", "st": 2, "title": "承認と放棄・遺言・遺留分", "t": "⑴　相続の放棄\n相続の開始があったことを知った時から[[3か月]]以内に、[[家庭裁判所]]に申述する。各相続人が[[単独]]で行うことができる。\n⑵　限定承認\n相続によって得た財産の限度で債務を弁済する。相続人[[全員]]が[[共同]]して行う必要がある。\n⑶　遺言\n[[自筆証書遺言]]は全文・日付・氏名を自書し押印する。財産目録は[[パソコン]]で作成してもよい（各ページに署名・押印）。\n[[法務局]]で保管されている自筆証書遺言と、[[公正証書遺言]]は、家庭裁判所の[[検認]]が不要。\n[[公正証書遺言]]の作成には、証人[[2人]]以上の立会いが必要。\n⑷　遺留分\n遺留分権利者は、[[兄弟姉妹]]以外の相続人。\n遺留分全体の割合は、直系尊属のみが相続人の場合は[[3分の1]]、それ以外は[[2分の1]]。\n遺留分侵害額請求権は、相続の開始と遺留分の侵害を知った時から[[1年]]、相続開始の時から[[10年]]で消滅する。"}, {"id": "cloze:1985022f3c", "c": 6, "s": "問題6-2〔3〕", "st": 2, "title": "相続人と承認・放棄の補足", "t": "⑴　相続人になれない者\n[[内縁]]の配偶者は相続人にならない。\n相続人の[[欠格]]（故意に被相続人を死亡させた場合など）は、手続なしで当然に相続権を失う。\n相続人の[[廃除]]は、被相続人の請求又は遺言により、[[家庭裁判所]]が決定する。\n⑵　法定相続分\n嫡出でない子の相続分は、嫡出子と[[同じ]]。\n⑶　単純承認とみなされる場合\n相続財産の全部又は一部を[[処分]]した場合や、[[3か月]]以内に限定承認・放棄をしなかった場合。\n⑷　遺産分割前の預貯金の払戻し\n各相続人は、遺産分割前でも、1つの金融機関から[[150万円]]を上限に、一定額の払戻しを受けられる。\n⑸　配偶者短期居住権\n被相続人の建物に無償で住んでいた配偶者は、遺産分割の確定などから最低[[6か月]]間、無償で住み続けられる。"}, {"id": "cloze:beb6732e89", "c": 6, "s": "問題6-3〔1〕", "st": 2, "title": "相続税の課税価格", "t": "⑴　非課税財産\n死亡保険金・死亡退職金のうち、それぞれ[[500万円]]×[[法定相続人の数]]までは非課税（相続人が受け取った場合に限る）。\n⑵　生前贈与加算（暦年課税分）\n相続・遺贈で財産を取得した者が、相続開始前[[7年]]以内に被相続人から受けた贈与財産は、相続財産に加算する。\n延長された4年間（相続開始前3年より前）に受けた贈与については、合計[[100万円]]までは加算しない。\n⑶　債務控除\n葬式費用は控除できる。[[香典返し]]の費用や[[法要]]の費用は控除できない。\n墓地・仏壇など非課税財産の未払代金は、控除[[できない]]。"}, {"id": "cloze:1ec9eb3f20", "c": 6, "s": "問題6-3〔2〕", "st": 2, "title": "相続税の総額と税額控除", "t": "⑴　遺産に係る基礎控除額\n[[3,000万円]]＋[[600万円]]×法定相続人の数\n⑵　法定相続人の数に算入できる養子の数\n被相続人に実子がいる場合は[[1人]]、実子がいない場合は[[2人]]まで。\n相続を放棄した者も、法定相続人の数に[[含める]]。\n⑶　相続税額の2割加算\n被相続人の[[配偶者]]と[[1親等の血族]]（代襲相続人となった孫を含む）以外の者は、相続税額が2割加算される。\n⑷　配偶者に対する相続税額の軽減\n配偶者が取得した財産が、[[1億6,000万円]]と[[配偶者の法定相続分相当額]]のいずれか多い金額までであれば、相続税はかからない。\n⑸　未成年者控除\n（[[18歳]]－相続開始時の年齢）×[[10万円]]\n⑹　障害者控除\n（[[85歳]]－相続開始時の年齢）×10万円（特別障害者は[[20万円]]）"}, {"id": "cloze:213683d1a9", "c": 6, "s": "問題6-3〔3〕", "st": 2, "title": "相続税の課税財産・控除の補足", "t": "⑴　みなし相続財産\n死亡後[[3年]]以内に支給が確定した死亡退職金は、相続財産とみなされる。\n⑵　弔慰金\n業務上の死亡は普通給与の[[3年分]]、業務外の死亡は普通給与の[[6か月分]]までは、相続税の対象とならない。\n⑶　非課税財産\n墓地・墓石・仏壇などの[[祭祀財産]]。相続税の申告期限までに[[国]]や地方公共団体などに寄付した財産。\n⑷　債務控除\n被相続人の未払いの所得税・住民税・[[固定資産税]]などは控除できる。通夜・本葬の費用や[[お布施]]は葬式費用として控除できる。\n相続を放棄した者は、債務を控除[[できない]]（実際に負担した葬式費用は控除できる）。\n⑸　相次相続控除\n今回の相続開始前[[10年]]以内に、被相続人が相続税を課されていた場合に適用される。\n⑹　孫養子の2割加算\n被相続人の養子となった孫（代襲相続人を除く）は、2割加算の[[対象となる]]。"}, {"id": "cloze:bb26401da5", "c": 6, "s": "問題6-4〔1〕", "st": 2, "title": "宅地の評価", "t": "⑴　評価方式\n市街地の宅地は[[路線価方式]]、それ以外は[[倍率方式]]（固定資産税評価額×倍率）で評価する。\n⑵　貸宅地（底地）\n自用地評価額×（1－[[借地権割合]]）\n⑶　貸家建付地\n自用地評価額×（1－借地権割合×[[借家権割合]]×[[賃貸割合]]）\n⑷　貸家\n固定資産税評価額×（1－借家権割合×賃貸割合）\n⑸　小規模宅地等の特例\n[[特定居住用宅地等]]：[[330㎡]]まで[[80％]]減額。\n[[特定事業用宅地等]]：[[400㎡]]まで[[80％]]減額。\n[[貸付事業用宅地等]]：[[200㎡]]まで[[50％]]減額。\n特定居住用宅地等と特定事業用宅地等を併用する場合は、最大[[730㎡]]まで適用できる。"}, {"id": "cloze:556649a58f", "c": 6, "s": "問題6-4〔2〕", "st": 2, "title": "金融資産・株式の評価", "t": "⑴　上場株式\n次のうち最も[[低い]]価額で評価する。\n課税時期の最終価格、課税時期の属する月の毎日の最終価格の月平均額、その[[前月]]の月平均額、その[[前々月]]の月平均額。\n⑵　取引相場のない株式\n同族株主等が取得した場合は[[原則的評価方式]]（類似業種比準方式・純資産価額方式など）、同族株主以外の株主等が取得した場合は[[配当還元方式]]で評価する。\n⑶　生命保険契約に関する権利\n相続開始時の[[解約返戻金]]相当額で評価する。\n⑷　定期預金\n預入高＋既経過利子（源泉徴収税額相当額を[[差し引いた]]額）で評価する。"}, {"id": "cloze:bc35bffaad", "c": 6, "s": "問題6-4〔3〕", "st": 2, "title": "その他の財産の評価", "t": "⑴　家屋\n自用家屋は[[固定資産税評価額]]×1.0で評価する。\n建築中の家屋は、[[費用現価]]の[[70％]]で評価する。\n⑵　借地権\n自用地評価額×[[借地権割合]]\n⑶　使用貸借\n親の土地を子が無償で借りて建物を建てた場合（[[使用貸借]]）、その土地は[[自用地]]として評価する。\n⑷　私道\n不特定多数の者の通行の用に供されている私道は、評価[[しない]]（0）。それ以外の私道は、自用地評価額の[[30％]]で評価する。\n⑸　ゴルフ会員権（取引相場のあるもの）\n通常の取引価格の[[70％]]で評価する。\n⑹　小規模宅地等の特例の要件\n配偶者が取得した特定居住用宅地等は、保有・居住の要件[[なし]]で適用を受けられる。\n同居親族が取得した場合は、相続税の[[申告期限]]まで保有し、居住し続けることが必要。"}, {"id": "cloze:0f025e1aa0", "c": 6, "s": "問題6-4〔4〕", "st": 2, "title": "宅地評価・小規模宅地等の特例の補足", "t": "⑴　路線価方式の補正\n[[奥行価格補正率]]で補正する。2つの路線に面する宅地は、補正後の価額が[[高い]]ほうを正面路線とする。\n角地は[[側方路線影響加算]]、表と裏の両方で路線に面する宅地は[[二方路線影響加算]]を行う。\n⑵　貸家建付地の賃貸割合\n一時的な空室は、賃貸されているものとして扱うことがある。\n⑶　特定居住用宅地等を取得できる親族\n[[配偶者]]は要件なし。\n[[同居親族]]は、申告期限まで保有し居住し続けること。\n同居親族がいない場合、相続開始前[[3年]]以内に自己や配偶者などの持家に住んでいない別居の親族（いわゆる[[家なき子]]）も対象。\n⑷　被相続人が老人ホームに入居していた場合\n[[要介護認定]]などを受けて入居していた場合は、もとの自宅の敷地も特定居住用宅地等の対象となりうる。\n⑸　相続開始前3年以内に新たに貸付けを始めた宅地\n原則として、貸付事業用宅地等の対象と[[ならない]]。"}, {"id": "cloze:5acb04b59b", "c": 6, "s": "問題6-4〔5〕", "st": 2, "title": "株式・その他の財産の評価", "t": "⑴　取引相場のない株式（原則的評価方式）\n[[大会社]]：類似業種比準方式（純資産価額方式も選択可）。\n[[中会社]]：類似業種比準方式と純資産価額方式の併用。\n[[小会社]]：純資産価額方式（併用方式も選択可）。\n⑵　類似業種比準方式の比準要素\n1株当たりの[[配当金額]]・[[利益金額]]・[[純資産価額]]。\n⑶　純資産価額方式\n相続税評価額による純資産から、評価差額に対する法人税等相当額（[[37％]]）を控除して計算する。\n⑷　その他\n証券投資信託は、課税時期の[[解約価額]]（解約請求の場合）などで評価する。\n外貨預金は、原則として[[TTB]]で円換算する。\n借家権は、取引慣行がない地域では評価[[しない]]。"}, {"id": "cloze:c3181e9459", "c": 6, "s": "問題6-5〔1〕", "st": 2, "title": "申告と納付", "t": "⑴　相続税の申告期限\n相続の開始があったことを知った日の翌日から[[10か月]]以内。\n⑵　延納\n金銭で一時に納付することが困難な場合、納付すべき税額が[[10万円]]を超えれば、担保を提供して分割納付できる。\n⑶　物納\n延納によっても金銭で納付することが困難な場合に認められる。\n第1順位は、[[不動産]]・船舶・国債・地方債・[[上場株式]]等。\n⑷　相続税の取得費加算の特例\n相続財産を、相続税の申告期限の翌日から[[3年]]以内に譲渡した場合、その財産に対応する相続税額を取得費に加算できる。"}, {"id": "cloze:16ffc381d0", "c": 6, "s": "問題6-5〔2〕", "st": 2, "title": "事業承継", "t": "⑴　遺留分に関する民法の特例（経営承継円滑化法）\n後継者が先代経営者から贈与等で取得した自社株式について、[[除外合意]]（遺留分算定の基礎財産から除外）や[[固定合意]]（評価額を合意時に固定）ができる。\n推定相続人全員の[[合意]]、[[経済産業大臣]]の確認、[[家庭裁判所]]の許可が必要。\n⑵　自社株の評価引下げ\n役員退職金を支給すると、利益と純資産が減少し、類似業種比準価額・純資産価額が[[下がる]]ことがある。"}, {"id": "cloze:7afc87f0a1", "c": 6, "s": "問題6-5〔3〕", "st": 2, "title": "自社株の承継の手法", "t": "⑴　相続した自社株の発行会社への譲渡\n相続税の申告期限の翌日から[[3年]]以内に、相続した非上場株式を発行会社に譲渡した場合、[[みなし配当]]課税は行われず、譲渡所得として課税される。\n⑵　種類株式\n[[拒否権付株式]]（黄金株）は、株主総会の決議事項について拒否権を持つ。後継者に議決権を集中させつつ、先代経営者が一定の影響力を残す方法などに使われる。\n[[議決権制限株式]]は、議決権の全部又は一部がない株式。後継者以外の相続人に渡す株式として使われる。"}, {"id": "cloze:d9507fe2f9", "c": 6, "s": "問題6-5〔4〕", "st": 2, "title": "相続税の申告と事業承継の補足", "t": "⑴　申告書の提出先\n被相続人の死亡時の住所地を所轄する[[税務署長]]。\n⑵　連帯納付義務\n各相続人は、相続により受けた利益の価額を限度として、他の相続人の相続税について[[連帯]]して納付する義務を負う。\n⑶　物納の収納価額\n原則として、相続税の課税価格の計算の基礎となった価額（小規模宅地等の特例の適用後の価額）。\n⑷　非上場株式等の相続税の納税猶予（特例措置）\n対象株式は[[全株]]、猶予割合は[[100％]]。\n一般措置は、発行済議決権株式の[[3分の2]]まで、相続税の[[80％]]が猶予される。"}, {"id": "cloze:d0d09bb294", "c": 6, "s": "問題6-6〔1〕", "st": 2, "title": "成年後見制度", "t": "⑴　法定後見制度\n判断能力の程度に応じて、[[後見]]・[[保佐]]・[[補助]]の3類型がある。[[家庭裁判所]]が後見人等を選任する。\n⑵　任意後見制度\n本人の判断能力が十分なうちに、[[公正証書]]で任意後見契約を結んでおく。判断能力が低下した後、家庭裁判所が[[任意後見監督人]]を選任した時から効力が生じる。\n⑶　成年後見人\n成年被後見人の居住用不動産を売却するには、[[家庭裁判所]]の許可が必要。"}, {"id": "cloze:3df9d2b0bb", "c": 6, "s": "問題6-6〔2〕", "st": 2, "title": "遺産分割と相続の手続", "t": "⑴　胎児\n相続については、すでに[[生まれた]]ものとみなす（死産の場合を除く）。\n⑵　養子\n[[普通養子]]は、実父母との親族関係が続く（実父母と養父母の両方の相続人となる）。\n[[特別養子]]は、実父母との親族関係が[[終了]]する。\n⑶　遺産分割の禁止\n被相続人は、遺言で、相続開始の時から[[5年]]を超えない期間、遺産の分割を禁止できる。\n⑷　遺産分割の方法\n[[現物分割]]：個々の財産をそのまま分ける。\n[[代償分割]]：特定の相続人が財産を取得し、他の相続人に[[代償金]]などを支払う。\n[[換価分割]]：財産を売却して、その代金を分ける。\n⑸　配偶者居住権\n存続期間は原則として[[終身]]。[[登記]]をすれば第三者に対抗できる。\n⑹　特別寄与料\n被相続人の療養看護などに尽くした[[相続人以外の親族]]は、相続人に対して特別寄与料を請求できる。"}, {"id": "cloze:aaa026bf1e", "c": 6, "s": "問題6-6〔3〕", "st": 2, "title": "成年後見と信託", "t": "⑴　法定後見の申立て\n本人、配偶者、[[4親等]]内の親族などが家庭裁判所に申し立てる。\n⑵　成年被後見人の行為\n成年被後見人がした法律行為は、日用品の購入などを除き、[[取り消す]]ことができる。\n⑶　保佐\n被保佐人が借金や不動産の売買などの重要な行為をするには、保佐人の[[同意]]が必要。\n⑷　民事信託（家族信託）\n財産を預ける[[委託者]]、預かって管理する[[受託者]]、利益を受ける[[受益者]]で構成される。\n信託財産から生じる利益は、原則として[[受益者]]に課税される。"}], "dict": [], "kob": [], "sog": [], "tf": [{"id": "tf:5857d4986b", "c": 1, "s": "問題1-1", "st": 2, "q": "税理士資格を有しないFPが、顧客から無償で依頼を受けて、その顧客の確定申告書を作成することは、税理士法に抵触しない。", "a": false, "e": "誤りです。\n【根拠】税理士資格のない者は、有償・無償を問わず、個別具体的な税務相談や税務書類の作成を行うことができません。\n【ひっかけ】「無償なら大丈夫」という出題が定番です。一般的な税法の解説や仮定の事例による計算は、資格がなくてもできます。"}, {"id": "tf:baf101c377", "c": 1, "s": "問題1-1", "st": 2, "q": "弁護士資格を有しないFPが、顧客の任意後見契約の受任者となることは、弁護士法に抵触しない。", "a": true, "e": "正しい記述です。\n【根拠】任意後見人（任意後見受任者）には、特別な資格は必要ありません。FPも就任できます。\n【ひっかけ】公正証書遺言の証人になることも資格は不要です。個別具体的な法律判断を示すことと区別します。"}, {"id": "tf:7f6966ea33", "c": 1, "s": "問題1-1", "st": 2, "q": "金融商品取引業の登録を受けていないFPが、顧客と投資顧問契約を結び、特定の銘柄の株式の購入を勧めることは、金融商品取引法に抵触する。", "a": true, "e": "正しい記述です。\n【根拠】投資助言・代理業の登録がない者が、投資顧問契約に基づいて個別の有価証券の投資判断を助言することはできません。\n【ひっかけ】景気動向や一般的な投資手法の説明であれば、登録がなくても行えます。"}, {"id": "tf:8f4f2f79de", "c": 1, "s": "問題1-1", "st": 2, "q": "保険募集人の登録を受けていないFPが、顧客の必要保障額を試算することは、保険業法に抵触する。", "a": false, "e": "誤りです。\n【根拠】必要保障額の試算や保険商品の一般的な説明は、保険募集には当たりません。\n【ひっかけ】禁止されるのは、保険の募集・勧誘（契約締結の代理・媒介）です。試算とは区別します。"}, {"id": "tf:fd431a81b1", "c": 1, "s": "問題1-1", "st": 2, "q": "毎年一定額を積み立てて、将来の元利合計額を求める場合には、年金終価係数を用いる。", "a": true, "e": "正しい記述です。\n【根拠】毎年の積立額×年金終価係数＝将来の元利合計です。\n【ひっかけ】「将来の目標額から毎年の積立額を求める」場合は減債基金係数を使います。入れ替えの出題が多いので注意します。"}, {"id": "tf:a0926a5941", "c": 1, "s": "問題1-1", "st": 2, "q": "住宅ローンの借入額をもとに、毎年の返済額を求める場合には、減債基金係数を用いる。", "a": false, "e": "誤りです。\n【根拠】借入額（現在の元本）から毎年の返済額を求めるには、資本回収係数を用います。\n【ひっかけ】減債基金係数は「将来の目標額」から「毎年の積立額」を求める係数です。"}, {"id": "tf:18b0be8ae8", "c": 1, "s": "問題1-1", "st": 2, "q": "将来、毎年一定額を受け取るために、現在いくらの元本が必要かを求める場合には、年金現価係数を用いる。", "a": true, "e": "正しい記述です。\n【根拠】毎年の受取額×年金現価係数＝現在必要な元本です。\n【ひっかけ】資本回収係数とは逆の関係（互いに逆数）です。"}, {"id": "tf:2ee8f18e05", "c": 1, "s": "問題1-1", "st": 1, "q": "現在の元本を一定期間複利で運用した場合の元利合計を求める場合には、現価係数を用いる。", "a": false, "e": "誤りです。\n【根拠】現在の元本から将来の元利合計を求めるのは、終価係数です。\n【ひっかけ】現価係数は「将来の目標額」から「現在必要な元本」を求めます。終価と現価は逆数の関係です。"}, {"id": "tf:68c2438980", "c": 1, "s": "問題1-1", "st": 2, "q": "社会保険労務士資格を有しないFPが、顧客の求めに応じて公的年金の受給見込額を試算することは、社会保険労務士法に抵触する。", "a": false, "e": "誤りです。\n【根拠】受給見込額の試算や制度の一般的な説明は、資格がなくても行えます。\n【ひっかけ】業として年金の裁定請求書の作成・提出の代行を行うことは、社会保険労務士の独占業務です。"}, {"id": "tf:5213fcb209", "c": 1, "s": "問題1-1", "st": 1, "q": "FPは、顧客から得た個人情報を、顧客の同意なく第三者に提供してはならない。", "a": true, "e": "正しい記述です。\n【根拠】顧客の利益を守るため、守秘義務を守ることがFPの職業倫理の基本です。\n【ひっかけ】顧客の利益より自己や第三者の利益を優先してはならない（顧客利益の優先）も職業倫理です。"}, {"id": "tf:07db5d4c7f", "c": 1, "s": "問題1-1", "st": 1, "q": "毎年30万円を年利1％で10年間積み立てた場合の元利合計額は、30万円に年金終価係数を乗じて求める。", "a": true, "e": "正しい記述です。\n【根拠】毎年の積立額×年金終価係数＝将来の元利合計です。\n【ひっかけ】将来の目標額から毎年の積立額を求めるときは減債基金係数です。"}, {"id": "tf:ea3e5a15fb", "c": 1, "s": "問題1-1", "st": 1, "q": "年金現価係数と資本回収係数は、互いに逆数の関係にある。", "a": true, "e": "正しい記述です。\n【根拠】年金現価係数＝1÷資本回収係数です。終価係数と現価係数、年金終価係数と減債基金係数も逆数の関係です。\n【ひっかけ】どの係数どうしが逆数かを問う出題があります。"}, {"id": "tf:2a6b3ef41e", "c": 1, "s": "問題1-1", "st": 2, "q": "弁護士資格を有しないFPが、報酬を得る目的で、顧客の代理人として他の相続人と遺産分割協議の交渉を行うことは、弁護士法に抵触する。", "a": true, "e": "正しい記述です。\n【根拠】報酬を得る目的で他人の法律事件の代理などを行うことは、弁護士法で禁止されています。\n【ひっかけ】相続の一般的な仕組みを説明することは、資格がなくてもできます。"}, {"id": "tf:d496017e56", "c": 1, "s": "問題1-1", "st": 2, "q": "減債基金係数は、現在の元本を複利運用した場合の将来の元利合計を求める係数である。", "a": false, "e": "誤りです。\n【根拠】減債基金係数は、将来の目標額を貯めるための毎年の積立額を求める係数です。\n【ひっかけ】現在の元本から将来の元利合計を求めるのは終価係数です。"}, {"id": "tf:f03e94b798", "c": 1, "s": "問題1-2", "st": 2, "q": "健康保険の傷病手当金は、業務外の病気やけがで連続して3日間休業した後、休業4日目から支給される。", "a": true, "e": "正しい記述です。\n【根拠】連続3日間の待期期間の後、4日目から支給されます。\n【ひっかけ】待期の3日間は有給休暇でもかまいません。「連続」が条件で、通算3日では足りません。"}, {"id": "tf:639d14b0d5", "c": 1, "s": "問題1-2", "st": 2, "q": "健康保険の傷病手当金の支給期間は、支給を開始した日から通算して2年である。", "a": false, "e": "誤りです。\n【根拠】傷病手当金の支給期間は、支給開始日から通算して1年6か月です。\n【ひっかけ】任意継続被保険者の加入期間（最長2年）と混同させる出題です。"}, {"id": "tf:7c4af399db", "c": 1, "s": "問題1-2", "st": 2, "q": "健康保険の任意継続被保険者となるためには、資格喪失日から20日以内に申出をする必要があり、加入できる期間は最長2年間である。", "a": true, "e": "正しい記述です。\n【根拠】資格喪失日の前日まで継続して2か月以上の被保険者期間があることも要件です。保険料は全額自己負担です。\n【ひっかけ】「14日以内」「最長1年」などと数字を変える出題が多い論点です。"}, {"id": "tf:86c87629e5", "c": 1, "s": "問題1-2", "st": 1, "q": "任意継続被保険者の保険料は、在職中と同様に事業主と被保険者が折半して負担する。", "a": false, "e": "誤りです。\n【根拠】任意継続被保険者の保険料は、全額を被保険者本人が負担します。\n【ひっかけ】在職中の「労使折半」と入れ替える出題です。"}, {"id": "tf:93cf8a8c75", "c": 1, "s": "問題1-2", "st": 2, "q": "高額療養費の対象となる自己負担額には、入院時の食事代や差額ベッド代も含まれる。", "a": false, "e": "誤りです。\n【根拠】入院時の食事代（標準負担額）や差額ベッド代、先進医療の技術料は、高額療養費の対象外です。\n【ひっかけ】保険診療の自己負担分だけが対象です。"}, {"id": "tf:c9ef1e406d", "c": 1, "s": "問題1-2", "st": 1, "q": "後期高齢者医療制度の被保険者は、原則として75歳以上の者である。", "a": true, "e": "正しい記述です。\n【根拠】75歳以上の者（一定の障害があると認定された65歳以上の者を含む）が被保険者となります。\n【ひっかけ】保険料は、原則として公的年金からの特別徴収（天引き）で納めます。"}, {"id": "tf:9795138955", "c": 1, "s": "問題1-2", "st": 2, "q": "70歳以上75歳未満の者の医療費の自己負担割合は、現役並み所得者を除き、原則として1割である。", "a": false, "e": "誤りです。\n【根拠】70歳以上75歳未満の自己負担割合は原則2割（現役並み所得者は3割）です。\n【ひっかけ】原則1割なのは75歳以上の後期高齢者医療制度です。"}, {"id": "tf:a8a9d093d5", "c": 1, "s": "問題1-2", "st": 2, "q": "健康保険の被扶養者となるための収入要件は、60歳以上の者については、原則として年収180万円未満である。", "a": true, "e": "正しい記述です。\n【根拠】原則は年収130万円未満、60歳以上の者や一定の障害者は180万円未満です。\n【ひっかけ】同居の場合は被保険者の年収の2分の1未満であることも必要です。"}, {"id": "tf:1987067638", "c": 1, "s": "問題1-2", "st": 1, "q": "国民健康保険には、原則として傷病手当金や出産手当金の給付はない。", "a": true, "e": "正しい記述です。\n【根拠】国民健康保険では、傷病手当金・出産手当金は市町村等の任意給付で、原則として支給されません。\n【ひっかけ】出産育児一時金は国民健康保険でも支給されます。"}, {"id": "tf:e6a3274f17", "c": 1, "s": "問題1-2", "st": 2, "q": "介護保険の第2号被保険者は、要介護状態となった原因にかかわらず介護保険の給付を受けることができる。", "a": false, "e": "誤りです。\n【根拠】第2号被保険者（40歳以上65歳未満）は、特定疾病（末期がんなど）が原因の場合に限り給付を受けられます。\n【ひっかけ】第1号被保険者（65歳以上）は、原因を問わず給付を受けられます。"}, {"id": "tf:f16ff71643", "c": 1, "s": "問題1-2", "st": 1, "q": "介護保険の第1号被保険者の保険料は、年額18万円以上の公的年金を受給している場合、原則として年金から天引きされる。", "a": true, "e": "正しい記述です。\n【根拠】年額18万円以上の年金受給者は特別徴収（天引き）、それ未満は普通徴収（口座振替など）です。\n【ひっかけ】第2号被保険者の保険料は、医療保険の保険料と一緒に徴収されます。"}, {"id": "tf:d1344ede97", "c": 1, "s": "問題1-2", "st": 1, "q": "健康保険の被保険者が業務外の事由により死亡した場合、埋葬を行う家族に埋葬料として5万円が支給される。", "a": true, "e": "正しい記述です。\n【根拠】埋葬料は5万円です。家族がいない場合は、実際に埋葬を行った者に埋葬費（5万円の範囲内の実費）が支給されます。\n【ひっかけ】被扶養者が死亡した場合は、家族埋葬料5万円が支給されます。"}, {"id": "tf:e7b7cb112e", "c": 1, "s": "問題1-2", "st": 1, "q": "国民健康保険の保険者は、都道府県と市町村（特別区を含む）である。", "a": true, "e": "正しい記述です。\n【根拠】2018年度から、都道府県も市町村とともに国民健康保険の保険者となっています。\n【ひっかけ】医師・弁護士などが加入する国民健康保険組合もあります。"}, {"id": "tf:9ea44dff9e", "c": 1, "s": "問題1-2", "st": 2, "q": "退職により健康保険の被保険者資格を喪失した者は、任意継続被保険者になるか、国民健康保険に加入するか、家族の健康保険の被扶養者になるかを選ぶことができる。", "a": true, "e": "正しい記述です。\n【根拠】要件を満たせば、いずれも選べます。\n【ひっかけ】任意継続は資格喪失日から20日以内、国民健康保険は原則14日以内の手続が必要です。"}, {"id": "tf:09288c89bf", "c": 1, "s": "問題1-2", "st": 1, "q": "資格喪失日の前日まで継続して1年以上被保険者であった者が、退職時に傷病手当金を受けている場合は、退職後も引き続き傷病手当金を受けることができる。", "a": true, "e": "正しい記述です。\n【根拠】継続給付として、支給開始日から通算1年6か月までの残りの期間を受けられます。\n【ひっかけ】任意継続被保険者になってから新たに病気になった場合は、傷病手当金は支給されません。"}, {"id": "tf:c51435c514", "c": 1, "s": "問題1-2", "st": 2, "q": "高額療養費の自己負担限度額は、70歳未満の者の場合、所得区分にかかわらず一律である。", "a": false, "e": "誤りです。\n【根拠】自己負担限度額は、年齢と所得区分によって異なります。\n【ひっかけ】直近12か月に3回以上該当した場合は、4回目から多数回該当として限度額が下がります。"}, {"id": "tf:255e69b18e", "c": 1, "s": "問題1-2", "st": 1, "q": "後期高齢者医療制度の保険料は、世帯単位で計算される。", "a": false, "e": "誤りです。\n【根拠】後期高齢者医療制度の保険料は、被保険者一人ひとりについて計算されます。\n【ひっかけ】国民健康保険の保険料（税）は、世帯単位で計算されます。"}, {"id": "tf:c285503c96", "c": 1, "s": "問題1-2", "st": 1, "q": "介護保険の要介護認定は、市町村（特別区を含む）が行う。", "a": true, "e": "正しい記述です。\n【根拠】要介護1〜5、要支援1・2の認定は、市町村が行います。\n【ひっかけ】介護保険の保険者も市町村です。"}, {"id": "tf:31030dc5ba", "c": 1, "s": "問題1-2", "st": 1, "q": "健康保険の保険料は、原則として事業主と被保険者が2分の1ずつ負担する。", "a": true, "e": "正しい記述です。\n【根拠】健康保険の保険料は労使折半です。\n【ひっかけ】任意継続被保険者は全額自己負担です。"}, {"id": "tf:d0522c9d5f", "c": 1, "s": "問題1-2", "st": 1, "q": "40歳以上65歳未満の健康保険の被保険者は、健康保険の保険料と合わせて介護保険の保険料を納める。", "a": true, "e": "正しい記述です。\n【根拠】第2号被保険者の介護保険料は、医療保険の保険料と一緒に徴収されます。\n【ひっかけ】40歳未満の者は介護保険の被保険者ではありません。"}, {"id": "tf:020b0da15a", "c": 1, "s": "問題1-2", "st": 1, "q": "健康保険の被扶養者の範囲のうち、被保険者の兄弟姉妹は、被保険者と同一世帯でなくても被扶養者となることができる。", "a": true, "e": "正しい記述です。\n【根拠】配偶者・子・孫・兄弟姉妹・直系尊属は、生計維持関係があれば同一世帯でなくてもかまいません。\n【ひっかけ】おじ・おばや配偶者の父母などは、同一世帯であることが必要です。"}, {"id": "tf:f2f7a83356", "c": 1, "s": "問題1-2", "st": 1, "q": "出産育児一時金は、医療機関等に直接支払われる直接支払制度を利用することができる。", "a": true, "e": "正しい記述です。\n【根拠】直接支払制度を利用すると、窓口で出産費用の全額を立て替える必要がなくなります。\n【ひっかけ】出産費用が一時金より少ない場合は、差額を請求できます。"}, {"id": "tf:0fa3935895", "c": 1, "s": "問題1-2", "st": 1, "q": "健康保険の傷病手当金は、標準報酬月額の平均額が30万円の場合、1日あたり約6,667円となる。", "a": true, "e": "正しい記述です。\n【根拠】30万円÷30日×2/3≒6,667円です。\n【ひっかけ】2/3を掛け忘れると1万円になります。"}, {"id": "tf:26d3f88295", "c": 1, "s": "問題1-2", "st": 2, "q": "健康保険の傷病手当金は、業務上の病気やけがで休業した場合にも支給される。", "a": false, "e": "誤りです。\n【根拠】健康保険の傷病手当金は、業務外の病気やけがが対象です。\n【ひっかけ】業務上の病気やけがは、労災保険の休業補償給付の対象です。"}, {"id": "tf:c73de56f37", "c": 1, "s": "問題1-2", "st": 2, "q": "健康保険の出産手当金は、被保険者の被扶養配偶者が出産した場合にも支給される。", "a": false, "e": "誤りです。\n【根拠】出産手当金は、被保険者本人が出産のため休業した場合に支給されます。\n【ひっかけ】被扶養者の出産には、家族出産育児一時金が支給されます。"}, {"id": "tf:a2b43607f9", "c": 1, "s": "問題1-2", "st": 1, "q": "健康保険の被扶養者となるためには、被保険者と同居している場合、原則として年収が130万円未満で、かつ被保険者の年収の2分の1未満でなければならない。", "a": true, "e": "正しい記述です。\n【根拠】別居の場合は、被保険者からの仕送り額より少ないことが要件です。\n【ひっかけ】60歳以上や一定の障害者は180万円未満です。"}, {"id": "tf:090a4012c9", "c": 1, "s": "問題1-2", "st": 1, "q": "後期高齢者医療制度の被保険者のうち、現役並み所得者の自己負担割合は3割である。", "a": true, "e": "正しい記述です。\n【根拠】原則1割、一定以上の所得がある者は2割、現役並み所得者は3割です。\n【ひっかけ】70歳以上75歳未満の原則は2割です。"}, {"id": "tf:ec0c0ec712", "c": 1, "s": "問題1-3", "st": 2, "q": "雇用保険の基本手当を受給するためには、原則として、離職の日以前2年間に被保険者期間が通算して12か月以上あることが必要である。", "a": true, "e": "正しい記述です。\n【根拠】倒産・解雇などによる離職の場合は、離職の日以前1年間に通算6か月以上でよいとされます。\n【ひっかけ】「1年間に12か月」などと期間を変える出題に注意します。"}, {"id": "tf:56caa60f6a", "c": 1, "s": "問題1-3", "st": 2, "q": "雇用保険の基本手当は、受給資格の決定を受けた日以後、通算して14日間の待期期間を経過した後に支給が開始される。", "a": false, "e": "誤りです。\n【根拠】待期期間は通算7日間です。\n【ひっかけ】自己都合退職の場合は、待期の後さらに原則1か月の給付制限があります。"}, {"id": "tf:3c4cb6374b", "c": 1, "s": "問題1-3", "st": 2, "q": "高年齢雇用継続基本給付金は、60歳以上65歳未満の被保険者の賃金が、60歳到達時の賃金の75％未満に低下した場合に支給される。", "a": true, "e": "正しい記述です。\n【根拠】60歳到達時の賃金月額の75％未満に低下した状態で雇用が継続している場合に支給されます。\n【ひっかけ】「85％未満」などと割合を変える出題に注意します。"}, {"id": "tf:97a336107e", "c": 1, "s": "問題1-3", "st": 2, "q": "労災保険の保険料は、事業主と労働者が折半して負担する。", "a": false, "e": "誤りです。\n【根拠】労災保険の保険料は、全額を事業主が負担します。\n【ひっかけ】雇用保険の保険料は事業主と労働者の双方が負担します（負担割合は異なります）。"}, {"id": "tf:2169ab85ea", "c": 1, "s": "問題1-3", "st": 1, "q": "労災保険の休業補償給付は、休業4日目から、1日につき給付基礎日額の60％相当額が支給される。", "a": true, "e": "正しい記述です。\n【根拠】休業4日目から給付基礎日額の60％が支給され、さらに休業特別支給金20％が上乗せされます。\n【ひっかけ】最初の3日間（待期期間）は、業務災害であれば事業主が休業補償を行います。"}, {"id": "tf:c750fbf575", "c": 1, "s": "問題1-3", "st": 1, "q": "労災保険は、通勤途中の事故による負傷については給付の対象としていない。", "a": false, "e": "誤りです。\n【根拠】通勤災害も労災保険の給付の対象です（通勤災害の場合は「休業給付」などと呼びます）。\n【ひっかけ】業務災害だけが対象と思わせる出題です。"}, {"id": "tf:4623e13baf", "c": 1, "s": "問題1-3", "st": 1, "q": "雇用保険の育児休業給付金の額は、休業開始から180日目までは休業開始時賃金日額×支給日数の67％相当額である。", "a": true, "e": "正しい記述です。\n【根拠】180日目までは67％、181日目以降は50％です。\n【ひっかけ】出生後休業支援給付金（13％）が上乗せされる場合もあります。"}, {"id": "tf:2ce3a25633", "c": 1, "s": "問題1-3", "st": 2, "q": "雇用保険の一般被保険者となるのは、原則として1週間の所定労働時間が20時間以上で、31日以上引き続き雇用されることが見込まれる者である。", "a": true, "e": "正しい記述です。\n【根拠】週20時間以上・31日以上の雇用見込みが要件です。\n【ひっかけ】パートやアルバイトでも、要件を満たせば被保険者になります。"}, {"id": "tf:a15133546f", "c": 1, "s": "問題1-3", "st": 2, "q": "正当な理由のない自己都合退職の場合、被保険者期間が20年以上であれば、基本手当の所定給付日数は150日である。", "a": true, "e": "正しい記述です。\n【根拠】自己都合退職などの一般の受給資格者は、10年未満90日、10年以上20年未満120日、20年以上150日です。\n【ひっかけ】倒産・解雇などの特定受給資格者は、年齢と被保険者期間によってより長くなります。"}, {"id": "tf:3b6e64d3af", "c": 1, "s": "問題1-3", "st": 2, "q": "雇用保険の基本手当の受給期間は、原則として離職の日の翌日から2年間である。", "a": false, "e": "誤りです。\n【根拠】受給期間は、原則として離職の日の翌日から1年間です。\n【ひっかけ】病気や出産などで働けない期間がある場合は、申出により最長4年まで延長できます。"}, {"id": "tf:c076c81f86", "c": 1, "s": "問題1-3", "st": 1, "q": "65歳以上で離職した雇用保険の被保険者には、基本手当に代えて高年齢求職者給付金が一時金で支給される。", "a": true, "e": "正しい記述です。\n【根拠】65歳以上の高年齢被保険者には、基本手当ではなく一時金が支給されます。\n【ひっかけ】年金と高年齢求職者給付金は、調整されずに両方受け取れます。"}, {"id": "tf:543ebc7244", "c": 1, "s": "問題1-3", "st": 1, "q": "一般教育訓練の教育訓練給付金の額は、受講費用の20％（上限10万円）である。", "a": true, "e": "正しい記述です。\n【根拠】一般教育訓練は20％・上限10万円です。\n【ひっかけ】特定一般教育訓練や専門実践教育訓練は、給付率と上限額が高くなります。"}, {"id": "tf:d07bf3e0f6", "c": 1, "s": "問題1-3", "st": 1, "q": "介護休業給付金は、同じ対象家族について通算93日を限度に、3回まで分割して受けることができる。", "a": true, "e": "正しい記述です。\n【根拠】介護休業給付金は、休業開始時賃金日額×支給日数の67％で、通算93日・3回までです。\n【ひっかけ】育児休業給付金と混同しないようにします。"}, {"id": "tf:d5c0ca9dc0", "c": 1, "s": "問題1-3", "st": 2, "q": "労災保険の療養補償給付を受ける場合、被災労働者は医療費の1割を負担する。", "a": false, "e": "誤りです。\n【根拠】労災保険の療養（補償）給付は、原則として自己負担がありません。\n【ひっかけ】健康保険の自己負担（原則3割）と区別します。"}, {"id": "tf:fd2a91ead1", "c": 1, "s": "問題1-3", "st": 1, "q": "中小事業主や一人親方などは、労災保険に特別加入することができる。", "a": true, "e": "正しい記述です。\n【根拠】労働者ではない中小事業主や一人親方なども、特別加入制度で労災保険に加入できます。\n【ひっかけ】原則として、労災保険は労働者を対象とする制度です。"}, {"id": "tf:f03e42da15", "c": 1, "s": "問題1-3", "st": 1, "q": "雇用保険の再就職手当は、基本手当の支給残日数が所定給付日数の3分の1以上ある場合などに支給される。", "a": true, "e": "正しい記述です。\n【根拠】支給残日数が多いほど、給付率が高くなります。\n【ひっかけ】早く再就職することを後押しするための給付です。"}, {"id": "tf:adb795976c", "c": 1, "s": "問題1-3", "st": 1, "q": "労災保険の障害（補償）給付は、障害等級1級から7級までは年金、8級から14級までは一時金で支給される。", "a": true, "e": "正しい記述です。\n【根拠】障害の程度が重い1〜7級は年金、8〜14級は一時金です。\n【ひっかけ】公的年金の障害厚生年金（1〜3級）と区別します。"}, {"id": "tf:2bd268812d", "c": 1, "s": "問題1-3", "st": 1, "q": "通勤の途中で合理的な経路を逸脱した場合でも、日用品の購入など日常生活上必要な行為をやむを得ない理由で最小限度行った場合は、合理的な経路に戻った後は通勤と認められる。", "a": true, "e": "正しい記述です。\n【根拠】逸脱・中断の間は通勤になりませんが、日常生活上必要な行為の場合は、経路に戻った後は再び通勤となります。\n【ひっかけ】映画鑑賞などの私的な行為の場合は、その後も通勤と認められません。"}, {"id": "tf:a436fe2946", "c": 1, "s": "問題1-3", "st": 1, "q": "雇用保険の基本手当の賃金日額は、原則として離職前6か月間に支払われた賃金の総額を180で除して求める。", "a": true, "e": "正しい記述です。\n【根拠】賞与は含みません。基本手当日額は、賃金日額のおおむね50％〜80％（60歳以上65歳未満は45％〜80％）です。\n【ひっかけ】賃金が低い人ほど給付率が高くなります。"}, {"id": "tf:87c322828c", "c": 1, "s": "問題1-3", "st": 2, "q": "育児休業給付金は、原則として子が3歳に達するまで支給される。", "a": false, "e": "誤りです。\n【根拠】育児休業給付金は、原則として子が1歳に達するまで（保育所に入れない場合などは最長2歳まで）支給されます。\n【ひっかけ】パパ・ママ育休プラスを使うと1歳2か月までになります。"}, {"id": "tf:0fae990e4a", "c": 1, "s": "問題1-3", "st": 1, "q": "倒産や解雇によって離職した特定受給資格者の基本手当の所定給付日数は、一般の受給資格者より長くなる場合がある。", "a": true, "e": "正しい記述です。\n【根拠】特定受給資格者の所定給付日数は、離職時の年齢と被保険者期間で決まり、最長330日です。\n【ひっかけ】自己都合退職の場合は、最長150日です。"}, {"id": "tf:aa22bf2781", "c": 1, "s": "問題1-3", "st": 2, "q": "一般の受給資格者が基本手当を受給するためには、離職の日以前1年間に被保険者期間が通算して6か月以上あれば足りる。", "a": false, "e": "誤りです。\n【根拠】一般の受給資格者は、離職の日以前2年間に被保険者期間が通算12か月以上必要です。\n【ひっかけ】1年間に6か月以上でよいのは、倒産・解雇などの特定受給資格者などです。"}, {"id": "tf:a88e0b44d9", "c": 1, "s": "問題1-3", "st": 2, "q": "高年齢雇用継続基本給付金は、65歳以上の被保険者の賃金が低下した場合に支給される。", "a": false, "e": "誤りです。\n【根拠】高年齢雇用継続基本給付金の対象は、60歳以上65歳未満の被保険者です。\n【ひっかけ】65歳以上で離職した場合は、高年齢求職者給付金です。"}, {"id": "tf:9319eba976", "c": 1, "s": "問題1-3", "st": 1, "q": "育児休業給付金は、父親が育児休業を取得した場合にも支給される。", "a": true, "e": "正しい記述です。\n【根拠】要件を満たせば、父親・母親とも受けられます。\n【ひっかけ】出生時育児休業給付金（産後パパ育休）もあります。"}, {"id": "tf:8f209c8f0b", "c": 1, "s": "問題1-3", "st": 1, "q": "単身赴任者が、赴任先の住居と帰省先の住居との間を移動する途中の事故は、要件を満たせば労災保険の通勤災害の対象となる。", "a": true, "e": "正しい記述です。\n【根拠】住居間の移動も、一定の要件で通勤とされます。\n【ひっかけ】複数の就業場所の間の移動も通勤に含まれます。"}, {"id": "tf:8180ed0ac2", "c": 1, "s": "問題1-4", "st": 2, "q": "老齢基礎年金の受給資格期間は、保険料納付済期間、保険料免除期間及び合算対象期間を合わせて10年以上である。", "a": true, "e": "正しい記述です。\n【根拠】2017年8月から、受給資格期間は25年から10年に短縮されています。\n【ひっかけ】合算対象期間（カラ期間）は受給資格期間には算入されますが、年金額には反映されません。"}, {"id": "tf:f225eb1ccd", "c": 1, "s": "問題1-4", "st": 2, "q": "老齢基礎年金を繰り上げて受給した場合、1か月あたり0.7％減額される。", "a": false, "e": "誤りです。\n【根拠】繰上げ受給の減額率は1か月あたり0.4％です（1962年4月2日以後生まれの者）。\n【ひっかけ】0.7％は繰下げ受給の増額率です。繰上げと繰下げの率を入れ替える出題が定番です。"}, {"id": "tf:04a5e3c50e", "c": 1, "s": "問題1-4", "st": 2, "q": "老齢基礎年金の繰下げ受給は最大75歳まで可能で、75歳まで繰り下げた場合の増額率は84％である。", "a": true, "e": "正しい記述です。\n【根拠】0.7％×120か月＝84％です。\n【ひっかけ】繰上げは最大60か月で減額率24％（0.4％×60か月）です。"}, {"id": "tf:e5a7191b44", "c": 1, "s": "問題1-4", "st": 2, "q": "国民年金の第1号被保険者は、国民年金基金に加入している場合であっても、付加保険料を納付することができる。", "a": false, "e": "誤りです。\n【根拠】国民年金基金の加入員は、付加保険料を納付できません。\n【ひっかけ】iDeCoとの同時加入は可能です。付加年金は月400円の保険料で、200円×納付月数の年金が加算されます。"}, {"id": "tf:2c4f68c730", "c": 1, "s": "問題1-4", "st": 2, "q": "保険料の免除を受けた期間の保険料は、10年以内であれば追納することができる。", "a": true, "e": "正しい記述です。\n【根拠】免除・納付猶予・学生納付特例を受けた期間の保険料は、10年以内に追納できます。\n【ひっかけ】未納の保険料を後から納付できるのは原則2年以内です。追納（10年）と区別します。"}, {"id": "tf:15cc937462", "c": 1, "s": "問題1-4", "st": 2, "q": "65歳から支給される老齢厚生年金は、厚生年金保険の被保険者期間が1年以上ある者でなければ受給できない。", "a": false, "e": "誤りです。\n【根拠】65歳からの老齢厚生年金は、老齢基礎年金の受給資格期間を満たし、被保険者期間が1か月以上あれば受給できます。\n【ひっかけ】1年以上が必要なのは、60歳台前半の特別支給の老齢厚生年金です。"}, {"id": "tf:20bbb6271d", "c": 1, "s": "問題1-4", "st": 2, "q": "老齢厚生年金の加給年金額は、厚生年金保険の被保険者期間が20年以上ある者に、生計を維持している65歳未満の配偶者がいる場合に加算される。", "a": true, "e": "正しい記述です。\n【根拠】被保険者期間20年以上と、生計維持関係にある65歳未満の配偶者（又は18歳到達年度末までの子など）が要件です。\n【ひっかけ】配偶者が65歳になると加給年金は終わり、要件を満たせば配偶者の老齢基礎年金に振替加算が付きます。"}, {"id": "tf:d67e406f01", "c": 1, "s": "問題1-4", "st": 1, "q": "在職老齢年金の仕組みでは、総報酬月額相当額と基本月額の合計が支給停止調整額を超える場合、超えた額の全額が支給停止となる。", "a": false, "e": "誤りです。\n【根拠】支給停止されるのは、支給停止調整額を超えた額の2分の1です。\n【ひっかけ】支給停止調整額は年度ごとに見直されます。仕組み（超えた額の2分の1）を押さえます。"}, {"id": "tf:7776d20cb7", "c": 1, "s": "問題1-4", "st": 2, "q": "国民年金の第3号被保険者は、第2号被保険者に扶養される20歳以上60歳未満の配偶者であり、自ら保険料を納付する必要はない。", "a": true, "e": "正しい記述です。\n【根拠】第3号被保険者の保険料は、配偶者が加入する厚生年金保険の制度全体で負担されます。\n【ひっかけ】第2号被保険者が65歳以上で老齢年金の受給権がある場合、その配偶者は第3号被保険者になれません。"}, {"id": "tf:a51ad95966", "c": 1, "s": "問題1-4", "st": 2, "q": "学生納付特例の適用を受けた期間は、老齢基礎年金の受給資格期間には算入されるが、追納しなければ年金額には反映されない。", "a": true, "e": "正しい記述です。\n【根拠】学生納付特例・納付猶予の期間は、受給資格期間に算入されますが、年金額には反映されません。\n【ひっかけ】全額免除期間は、国庫負担分（2分の1）が年金額に反映されます。"}, {"id": "tf:933f750a12", "c": 1, "s": "問題1-4", "st": 2, "q": "老齢基礎年金と老齢厚生年金の繰下げ受給は、どちらか一方だけを行うことができる。", "a": true, "e": "正しい記述です。\n【根拠】繰下げは別々に行えます。\n【ひっかけ】繰上げは、老齢基礎年金と老齢厚生年金を同時に行う必要があります。"}, {"id": "tf:e35cb82f7d", "c": 1, "s": "問題1-4", "st": 1, "q": "老齢基礎年金の繰上げ受給を請求した場合、老齢厚生年金は繰り上げずに65歳から受給することができる。", "a": false, "e": "誤りです。\n【根拠】繰上げは、老齢基礎年金と老齢厚生年金を同時に請求しなければなりません。\n【ひっかけ】繰下げは別々にできる点と混同させる出題です。"}, {"id": "tf:1f694b8bcd", "c": 1, "s": "問題1-4", "st": 1, "q": "国民年金の第1号被保険者は、出産予定月の前月から4か月間、保険料が免除される。", "a": true, "e": "正しい記述です。\n【根拠】産前産後期間の保険料免除で、免除期間は保険料納付済期間として扱われます（多胎妊娠は3か月前から6か月間）。\n【ひっかけ】申請が必要ですが、所得の要件はありません。"}, {"id": "tf:a5dce17de3", "c": 1, "s": "問題1-4", "st": 2, "q": "国民年金の学生納付特例は、学生本人の所得だけで判定される。", "a": true, "e": "正しい記述です。\n【根拠】学生納付特例は、本人の前年所得が一定以下であれば適用されます。\n【ひっかけ】納付猶予制度（50歳未満）は、本人と配偶者の所得で判定します。"}, {"id": "tf:864de966c8", "c": 1, "s": "問題1-4", "st": 1, "q": "国民年金の保険料の納付猶予制度は、60歳未満の者が対象である。", "a": false, "e": "誤りです。\n【根拠】納付猶予制度は、50歳未満の者が対象です。\n【ひっかけ】学生は学生納付特例を利用します。"}, {"id": "tf:4fbe98ea12", "c": 1, "s": "問題1-4", "st": 1, "q": "国民年金の保険料は、最大2年分を前納することができ、前納すると保険料が割り引かれる。", "a": true, "e": "正しい記述です。\n【根拠】前納（6か月・1年・2年）や口座振替の早割で、保険料が割り引かれます。\n【ひっかけ】未納の保険料を後から納付できるのは原則2年以内です。"}, {"id": "tf:7192e652ff", "c": 1, "s": "問題1-4", "st": 1, "q": "厚生年金保険の被保険者で、65歳以上で老齢年金の受給権を有する者は、国民年金の第2号被保険者とならない。", "a": true, "e": "正しい記述です。\n【根拠】65歳以上で老齢年金の受給権がある厚生年金保険の被保険者は、第2号被保険者になりません。\n【ひっかけ】その者に扶養されている配偶者は、第3号被保険者になれません。"}, {"id": "tf:81e67c47af", "c": 1, "s": "問題1-4", "st": 2, "q": "振替加算は、加給年金額の対象となっていた配偶者が65歳になったときに、その配偶者の老齢基礎年金に加算される。", "a": true, "e": "正しい記述です。\n【根拠】配偶者が1966年4月1日以前生まれであることが要件です。\n【ひっかけ】加給年金は配偶者が65歳になると終わり、振替加算に切り替わります。"}, {"id": "tf:6cc35c07c6", "c": 1, "s": "問題1-4", "st": 1, "q": "老齢基礎年金の繰下げの申出は、65歳到達日から1年を経過する前でも行うことができる。", "a": false, "e": "誤りです。\n【根拠】繰下げの申出は、66歳到達日（65歳到達日から1年を経過した日）以後に行えます。\n【ひっかけ】66歳になる前に請求すると、65歳からの本来の年金を受け取ることになります。"}, {"id": "tf:fd685be956", "c": 1, "s": "問題1-4", "st": 1, "q": "70歳到達後に繰下げの申出をせずに老齢年金を一括で受け取ることを選択した場合、請求の5年前に繰下げの申出をしたものとみなして増額された年金が支払われる。", "a": true, "e": "正しい記述です。\n【根拠】特例的な繰下げみなし増額制度です（80歳到達前の請求が対象）。\n【ひっかけ】時効により5年より前の分は受け取れないため、その不利益を減らす仕組みです。"}, {"id": "tf:a36baecbac", "c": 1, "s": "問題1-4", "st": 2, "q": "老齢厚生年金は、厚生年金保険の被保険者期間が20年以上なければ受給できない。", "a": false, "e": "誤りです。\n【根拠】65歳からの老齢厚生年金は、老齢基礎年金の受給資格期間を満たし、被保険者期間が1か月以上あれば受給できます。\n【ひっかけ】20年以上が要件なのは加給年金です。"}, {"id": "tf:eb032d0b11", "c": 1, "s": "問題1-4", "st": 2, "q": "老齢基礎年金の年金額の計算において、2009年4月以後の保険料全額免除期間は、その月数の2分の1が反映される。", "a": true, "e": "正しい記述です。\n【根拠】2009年4月以後の全額免除期間は2分の1（国庫負担分）、それより前は3分の1が反映されます。\n【ひっかけ】学生納付特例・納付猶予の期間は、追納しなければ年金額に反映されません。"}, {"id": "tf:5b19e1212b", "c": 1, "s": "問題1-4", "st": 1, "q": "60歳以上65歳未満の者は、老齢基礎年金が満額に満たない場合、国民年金に任意加入して保険料を納付することができる。", "a": true, "e": "正しい記述です。\n【根拠】任意加入すると、480月に近づけて年金額を増やせます。\n【ひっかけ】受給資格期間を満たしていない者は、70歳まで任意加入できる特例があります。"}, {"id": "tf:dd94ec3986", "c": 1, "s": "問題1-4", "st": 2, "q": "国民年金の第1号被保険者は、付加保険料の納付と個人型確定拠出年金（iDeCo）への加入を併用することができる。", "a": true, "e": "正しい記述です。\n【根拠】付加年金とiDeCoは併用できます（掛金の上限は付加保険料と合わせて月6万8,000円）。\n【ひっかけ】国民年金基金と付加保険料は併用できません。"}, {"id": "tf:b2fc7d308c", "c": 1, "s": "問題1-4", "st": 1, "q": "合算対象期間（カラ期間）には、1986年3月以前に会社員の配偶者で国民年金に任意加入しなかった期間が含まれる。", "a": true, "e": "正しい記述です。\n【根拠】当時は会社員の配偶者の加入が任意だったため、加入しなかった期間はカラ期間になります。\n【ひっかけ】カラ期間は受給資格期間には算入されますが、年金額には反映されません。"}, {"id": "tf:c9faa4a9f6", "c": 1, "s": "問題1-4", "st": 2, "q": "在職老齢年金の仕組みは、65歳以上で厚生年金保険の被保険者として働く者には適用されない。", "a": false, "e": "誤りです。\n【根拠】在職老齢年金の仕組みは、60歳台前半だけでなく65歳以上の在職者にも適用されます。\n【ひっかけ】70歳以上で厚生年金保険の適用事業所に勤める者も、同じ仕組みで調整されます。"}, {"id": "tf:bd4b722013", "c": 1, "s": "問題1-4", "st": 1, "q": "加給年金額の対象となる子は、18歳到達年度の末日までの子（障害等級1級・2級の子は20歳未満）である。", "a": true, "e": "正しい記述です。\n【根拠】配偶者のほか、子も加給年金の対象です。\n【ひっかけ】遺族基礎年金の「子」の範囲と同じです。"}, {"id": "tf:ee7d2ddb59", "c": 1, "s": "問題1-4", "st": 1, "q": "老齢厚生年金の報酬比例部分は、平均標準報酬額と被保険者期間の月数をもとに計算される。", "a": true, "e": "正しい記述です。\n【根拠】2003年4月以後の期間は、平均標準報酬額×5.481/1000×被保険者期間の月数で計算します。\n【ひっかけ】賞与も標準賞与額として計算に含まれます。"}, {"id": "tf:7d41b92d2d", "c": 1, "s": "問題1-4", "st": 1, "q": "日本国内に住所を有する20歳以上60歳未満の外国人は、国民年金の被保険者とならない。", "a": false, "e": "誤りです。\n【根拠】国籍は問わず、日本国内に住所がある20歳以上60歳未満の人は国民年金に加入します。\n【ひっかけ】短期滞在の外国人には、脱退一時金の制度があります。"}, {"id": "tf:2683e9ce07", "c": 1, "s": "問題1-4", "st": 1, "q": "国民年金の第3号被保険者となるためには、原則として年収が130万円未満であることが必要である。", "a": true, "e": "正しい記述です。\n【根拠】健康保険の被扶養者と同様の基準です。\n【ひっかけ】第2号被保険者の配偶者であることも要件です。"}, {"id": "tf:4e0bada3c9", "c": 1, "s": "問題1-4", "st": 2, "q": "老齢基礎年金の繰上げ受給を請求した後でも、受給開始前であれば取り消すことができる。", "a": false, "e": "誤りです。\n【根拠】繰上げ請求の後は、取り消すことはできません。\n【ひっかけ】繰上げ後に障害の状態になっても、原則として障害基礎年金を請求できないなどのデメリットがあります。"}, {"id": "tf:4c6ce0e2dc", "c": 1, "s": "問題1-4", "st": 1, "q": "老齢基礎年金の繰上げ受給をすると、原則として、その後に障害の状態になっても障害基礎年金を請求することができない。", "a": true, "e": "正しい記述です。\n【根拠】繰上げ受給者は65歳に達したものとみなされるため、事後重症による障害基礎年金などは請求できません。\n【ひっかけ】寡婦年金も受けられなくなります。"}, {"id": "tf:e0d0120134", "c": 1, "s": "問題1-4", "st": 2, "q": "老齢厚生年金の繰下げ受給をしても、加給年金額は増額されない。", "a": true, "e": "正しい記述です。\n【根拠】加給年金は繰下げによる増額の対象外で、繰下げ待機中は支給されません。\n【ひっかけ】加給年金を受け取りたい場合は、老齢基礎年金だけを繰り下げる方法もあります。"}, {"id": "tf:4199063d9f", "c": 1, "s": "問題1-4", "st": 2, "q": "在職老齢年金の仕組みにより、老齢厚生年金と老齢基礎年金の両方が支給停止の対象となる。", "a": false, "e": "誤りです。\n【根拠】支給停止の対象は老齢厚生年金で、老齢基礎年金は支給停止されません。\n【ひっかけ】加給年金は、老齢厚生年金が全額支給停止になると支給停止されます。"}, {"id": "tf:bef5078aa9", "c": 1, "s": "問題1-4", "st": 1, "q": "厚生年金保険の被保険者となるのは、原則として70歳未満の者である。", "a": true, "e": "正しい記述です。\n【根拠】70歳に達すると、厚生年金保険の被保険者資格を失います（受給資格期間を満たしていない場合は任意加入が可能）。\n【ひっかけ】健康保険は75歳未満まで加入します。"}, {"id": "tf:44d2f67054", "c": 1, "s": "問題1-5", "st": 2, "q": "遺族基礎年金は、死亡した者によって生計を維持されていた子のない配偶者にも支給される。", "a": false, "e": "誤りです。\n【根拠】遺族基礎年金を受けられるのは「子のある配偶者」又は「子」です。\n【ひっかけ】子のない配偶者は対象外です。遺族厚生年金は子のない配偶者も対象になります。"}, {"id": "tf:c5357f68ab", "c": 1, "s": "問題1-5", "st": 2, "q": "遺族基礎年金の対象となる子とは、18歳到達年度の末日までの間にある子、又は20歳未満で障害等級1級・2級に該当する子をいう。", "a": true, "e": "正しい記述です。\n【根拠】いずれも婚姻をしていないことが条件です。\n【ひっかけ】「20歳未満の子」とだけ書いて障害の要件を落とす出題に注意します。"}, {"id": "tf:3d2b595dc2", "c": 1, "s": "問題1-5", "st": 2, "q": "遺族厚生年金の額は、死亡した者の老齢厚生年金の報酬比例部分の額の3分の2相当額である。", "a": false, "e": "誤りです。\n【根拠】遺族厚生年金の額は、報酬比例部分の額の4分の3相当額です。\n【ひっかけ】3分の2は健康保険の傷病手当金・出産手当金の割合です。"}, {"id": "tf:d9d7cf5d63", "c": 1, "s": "問題1-5", "st": 1, "q": "夫の死亡当時30歳未満で子のない妻が受ける遺族厚生年金は、5年間の有期給付となる。", "a": true, "e": "正しい記述です。\n【根拠】30歳未満で子のない妻への遺族厚生年金は、5年間で終わります。\n【ひっかけ】中高齢寡婦加算は、夫の死亡時40歳以上65歳未満の妻が対象です。年齢を混同しないようにします。"}, {"id": "tf:228cfa60a7", "c": 1, "s": "問題1-5", "st": 2, "q": "障害基礎年金の1級の年金額は、2級の年金額の1.25倍である。", "a": true, "e": "正しい記述です。\n【根拠】1級は2級の1.25倍です。子がいる場合は子の加算額が付きます。\n【ひっかけ】障害基礎年金は1級・2級のみで、3級はありません。3級があるのは障害厚生年金です。"}, {"id": "tf:63bf3262ff", "c": 1, "s": "問題1-5", "st": 2, "q": "個人型確定拠出年金（iDeCo）の老齢給付金を一時金で受け取った場合、一時所得として課税される。", "a": false, "e": "誤りです。\n【根拠】iDeCoの老齢給付金を一時金で受け取ると退職所得、年金で受け取ると雑所得（公的年金等）となります。\n【ひっかけ】一時所得として課税されるのは、生命保険の満期保険金（契約者＝受取人）などです。"}, {"id": "tf:fe2af63fe9", "c": 1, "s": "問題1-5", "st": 2, "q": "個人型確定拠出年金（iDeCo）の掛金は、その全額が小規模企業共済等掛金控除の対象となる。", "a": true, "e": "正しい記述です。\n【根拠】iDeCoの掛金は全額が所得控除（小規模企業共済等掛金控除）の対象です。\n【ひっかけ】社会保険料控除や生命保険料控除ではありません。"}, {"id": "tf:33529b0fd1", "c": 1, "s": "問題1-5", "st": 1, "q": "国民年金基金の掛金の上限は、個人型確定拠出年金の掛金と合わせて月額6万8,000円である。", "a": true, "e": "正しい記述です。\n【根拠】第1号被保険者の上乗せ制度は、国民年金基金とiDeCoの掛金を合わせて月額6万8,000円が上限です（付加保険料を納める場合はその分を含みます）。\n【ひっかけ】国民年金基金の掛金も、全額が社会保険料控除の対象です。"}, {"id": "tf:85d4620ca2", "c": 1, "s": "問題1-5", "st": 1, "q": "妻が死亡した場合に夫が遺族厚生年金の受給権者となるには、妻の死亡当時に夫が55歳以上であることが必要である。", "a": true, "e": "正しい記述です。\n【根拠】夫・父母・祖父母が遺族厚生年金を受けるには、死亡当時55歳以上であることが必要で、支給は原則60歳からです。\n【ひっかけ】夫が遺族基礎年金を受ける場合（子のある夫）は、年齢要件はありません。"}, {"id": "tf:067dd343b2", "c": 1, "s": "問題1-5", "st": 1, "q": "企業型確定拠出年金のマッチング拠出において、加入者が拠出する掛金の額は、事業主掛金の額を超えることができない。", "a": true, "e": "正しい記述です。\n【根拠】加入者掛金は事業主掛金を超えられず、合計額は拠出限度額以内でなければなりません。\n【ひっかけ】加入者掛金も、全額が小規模企業共済等掛金控除の対象です。"}, {"id": "tf:031ad1d4f4", "c": 1, "s": "問題1-5", "st": 2, "q": "国民年金の第3号被保険者は、個人型確定拠出年金（iDeCo）に加入することができない。", "a": false, "e": "誤りです。\n【根拠】第3号被保険者もiDeCoに加入できます。\n【ひっかけ】国民年金基金に加入できるのは第1号被保険者（と一定の任意加入被保険者）です。"}, {"id": "tf:41b2a0e2c4", "c": 1, "s": "問題1-5", "st": 2, "q": "障害基礎年金の障害認定日は、原則として初診日から起算して1年6か月を経過した日である。", "a": true, "e": "正しい記述です。\n【根拠】その期間内に治った（症状が固定した）場合は、その日が障害認定日です。\n【ひっかけ】傷病手当金の支給期間（1年6か月）と数字が同じなので混同しないようにします。"}, {"id": "tf:33768add8c", "c": 1, "s": "問題1-5", "st": 1, "q": "障害基礎年金の保険料納付要件は、原則として初診日の前日において、初診日の属する月の前々月までの被保険者期間のうち、保険料納付済期間と免除期間の合計が3分の2以上あることである。", "a": true, "e": "正しい記述です。\n【根拠】特例として、初診日の前々月までの直近1年間に未納がなければよいとされます（初診日に65歳未満の場合）。\n【ひっかけ】老齢年金の受給資格期間（10年）とは別の要件です。"}, {"id": "tf:ec0dd80f7c", "c": 1, "s": "問題1-5", "st": 2, "q": "寡婦年金は、夫の死亡当時に夫に生計を維持されていた婚姻期間10年以上の妻に、60歳から65歳になるまで支給される。", "a": true, "e": "正しい記述です。\n【根拠】夫の第1号被保険者としての保険料納付済期間等が10年以上あることなどが要件です。\n【ひっかけ】額は、夫の第1号被保険者期間で計算した老齢基礎年金の4分の3です。"}, {"id": "tf:1c3845f8b5", "c": 1, "s": "問題1-5", "st": 2, "q": "寡婦年金と死亡一時金の両方の受給要件を満たす場合は、両方を受け取ることができる。", "a": false, "e": "誤りです。\n【根拠】寡婦年金と死亡一時金は、どちらか一方を選んで受け取ります。\n【ひっかけ】死亡一時金は、第1号被保険者として36月以上保険料を納付した者が死亡した場合に支給されます。"}, {"id": "tf:b9ec3254f6", "c": 1, "s": "問題1-5", "st": 2, "q": "被保険者期間が300月未満の厚生年金保険の被保険者が在職中に死亡した場合、遺族厚生年金の額は300月とみなして計算される。", "a": true, "e": "正しい記述です。\n【根拠】短期要件に該当する場合は、被保険者期間を300月とみなして計算します。\n【ひっかけ】長期要件（受給資格期間25年以上の者の死亡）の場合は、実際の被保険者期間で計算します。"}, {"id": "tf:c7cdbce79d", "c": 1, "s": "問題1-5", "st": 2, "q": "65歳以上の者が老齢厚生年金と遺族厚生年金の受給権を有する場合、遺族厚生年金が優先して全額支給され、老齢厚生年金は支給停止となる。", "a": false, "e": "誤りです。\n【根拠】65歳以上では老齢厚生年金が優先して支給され、遺族厚生年金は老齢厚生年金より多い部分だけが支給されます。\n【ひっかけ】自分の保険料を年金に反映させるための仕組みです。"}, {"id": "tf:6f0cf693bb", "c": 1, "s": "問題1-5", "st": 2, "q": "遺族年金や障害年金は、所得税の課税対象とならない。", "a": true, "e": "正しい記述です。\n【根拠】遺族年金・障害年金は非課税です。\n【ひっかけ】老齢年金は雑所得（公的年金等）として課税されます。"}, {"id": "tf:c518b9ca64", "c": 1, "s": "問題1-5", "st": 1, "q": "公的年金等の収入金額が400万円以下で、公的年金等以外の所得金額が20万円以下である者は、所得税の確定申告をする必要はない。", "a": true, "e": "正しい記述です。\n【根拠】確定申告不要制度です。ただし、医療費控除などで還付を受けるには申告が必要です。\n【ひっかけ】住民税の申告は別に必要になる場合があります。"}, {"id": "tf:707db8df8f", "c": 1, "s": "問題1-5", "st": 2, "q": "確定給付企業年金は、加入者の運用の結果によって将来の給付額が変動する制度である。", "a": false, "e": "誤りです。\n【根拠】確定給付企業年金は、給付額があらかじめ約束されており、運用の責任は事業主にあります。\n【ひっかけ】加入者の運用結果で給付額が変わるのは、確定拠出年金です。"}, {"id": "tf:9b829ce5f7", "c": 1, "s": "問題1-5", "st": 2, "q": "企業型確定拠出年金の掛金は原則として事業主が拠出し、運用の指図は加入者が行う。", "a": true, "e": "正しい記述です。\n【根拠】運用のリスクは加入者が負います。\n【ひっかけ】転職時は、個人別管理資産を転職先の制度やiDeCoに移換できます（ポータビリティ）。"}, {"id": "tf:9a8b06ad38", "c": 1, "s": "問題1-5", "st": 1, "q": "個人型確定拠出年金（iDeCo）の老齢給付金は、75歳になるまでの間に受給を開始しなければならない。", "a": true, "e": "正しい記述です。\n【根拠】受給開始時期は、60歳から75歳までの間で選べます。\n【ひっかけ】通算加入者等期間が10年未満の場合は、受給開始可能年齢が遅くなります。"}, {"id": "tf:c9d0a6c746", "c": 1, "s": "問題1-5", "st": 2, "q": "中小企業退職金共済（中退共）には、事業主本人や役員も加入することができる。", "a": false, "e": "誤りです。\n【根拠】中退共は従業員のための制度で、事業主本人や役員（使用人兼務役員を除く）は加入できません。\n【ひっかけ】事業主や役員の退職金準備には、小規模企業共済があります。"}, {"id": "tf:1130267b3b", "c": 1, "s": "問題1-5", "st": 1, "q": "中小企業退職金共済の掛金は、事業主が全額を負担し、法人の場合は損金、個人事業主の場合は必要経費に算入できる。", "a": true, "e": "正しい記述です。\n【根拠】掛金は全額事業主負担で、従業員の給与にはなりません。\n【ひっかけ】新規加入時などに、国の掛金助成があります。"}, {"id": "tf:1c52c5dbf1", "c": 1, "s": "問題1-5", "st": 1, "q": "国民年金基金の1口目は、終身年金でなければならない。", "a": true, "e": "正しい記述です。\n【根拠】1口目は終身年金（A型・B型）から選び、2口目以降は終身年金と確定年金から選べます。\n【ひっかけ】掛金は全額社会保険料控除の対象です。"}, {"id": "tf:ca689e8711", "c": 1, "s": "問題1-5", "st": 1, "q": "小規模企業共済の共済金を一括で受け取った場合、退職所得として課税される。", "a": true, "e": "正しい記述です。\n【根拠】一括受取は退職所得、分割受取は公的年金等の雑所得です。\n【ひっかけ】iDeCoの受取と同じ整理です。"}, {"id": "tf:bc55da4102", "c": 1, "s": "問題1-5", "st": 2, "q": "障害厚生年金には、障害等級3級に該当する場合の年金と、3級より軽い障害の場合の一時金である障害手当金がある。", "a": true, "e": "正しい記述です。\n【根拠】障害手当金は一時金です。\n【ひっかけ】障害基礎年金は1級・2級のみです。"}, {"id": "tf:2990d42c33", "c": 1, "s": "問題1-5", "st": 1, "q": "遺族年金の受給要件のうち生計維持関係は、原則として遺族の前年の年収が1,000万円未満であることとされる。", "a": false, "e": "誤りです。\n【根拠】原則として前年の年収が850万円未満（所得655万5千円未満）であることです。\n【ひっかけ】数字を変える出題に注意します。"}, {"id": "tf:a065a7369f", "c": 1, "s": "問題1-5", "st": 1, "q": "公的年金は、原則として毎年偶数月に、それぞれの前月までの2か月分が支払われる。", "a": true, "e": "正しい記述です。\n【根拠】年6回、偶数月の15日に支払われます。\n【ひっかけ】年金を受ける権利は、5年で時効になります。"}, {"id": "tf:357d47c23b", "c": 1, "s": "問題1-5", "st": 1, "q": "企業型確定拠出年金の加入者は、規約で定めれば70歳未満まで加入することができる。", "a": true, "e": "正しい記述です。\n【根拠】企業型DCは、厚生年金保険の被保険者であれば規約により70歳未満まで加入できます。\n【ひっかけ】iDeCoは、国民年金の被保険者であれば65歳未満まで加入できます。"}, {"id": "tf:c522185c63", "c": 1, "s": "問題1-5", "st": 1, "q": "個人型確定拠出年金（iDeCo）の掛金は、月額5,000円以上、1,000円単位で設定する。", "a": true, "e": "正しい記述です。\n【根拠】掛金は月額5,000円以上、1,000円単位で、年単位でまとめて拠出することもできます。\n【ひっかけ】上限額は加入者の区分によって異なります。"}, {"id": "tf:c2a3a65a29", "c": 1, "s": "問題1-5", "st": 2, "q": "個人型確定拠出年金（iDeCo）の資産は、一定の場合を除き、60歳になる前に引き出すことはできない。", "a": true, "e": "正しい記述です。\n【根拠】老後資金のための制度であり、原則として60歳まで引き出せません。\n【ひっかけ】加入者が死亡した場合は死亡一時金、一定の障害の状態になった場合は障害給付金を受けられます。"}, {"id": "tf:f0a505bc26", "c": 1, "s": "問題1-5", "st": 2, "q": "遺族基礎年金は、子のある妻には支給されるが、子のある夫には支給されない。", "a": false, "e": "誤りです。\n【根拠】2014年4月から、子のある夫にも遺族基礎年金が支給されます。\n【ひっかけ】対象は「子のある配偶者」又は「子」です。"}, {"id": "tf:9cd37552c3", "c": 1, "s": "問題1-5", "st": 2, "q": "夫の死亡当時30歳未満で子のない妻に支給される遺族厚生年金は、終身にわたって支給される。", "a": false, "e": "誤りです。\n【根拠】30歳未満で子のない妻の遺族厚生年金は、5年間の有期給付です。\n【ひっかけ】30歳以上なら、原則として終身支給されます。"}, {"id": "tf:04f54de40d", "c": 1, "s": "問題1-5", "st": 2, "q": "中高齢寡婦加算は、子のある妻が遺族基礎年金を受給している間も、遺族厚生年金に加算される。", "a": false, "e": "誤りです。\n【根拠】遺族基礎年金を受けている間は、中高齢寡婦加算は支給停止されます。\n【ひっかけ】子が18歳到達年度末を過ぎて遺族基礎年金が終わると、中高齢寡婦加算が支給されます。"}, {"id": "tf:93494b93a9", "c": 1, "s": "問題1-5", "st": 1, "q": "障害基礎年金の受給権者に生計を維持している子がいる場合、子の加算額が加算される。", "a": true, "e": "正しい記述です。\n【根拠】障害基礎年金には子の加算があります。\n【ひっかけ】配偶者の加算は、障害厚生年金（1級・2級）の配偶者加給年金額です。"}, {"id": "tf:b1e1be50d1", "c": 1, "s": "問題1-5", "st": 1, "q": "障害厚生年金の1級・2級の受給権者に生計を維持している65歳未満の配偶者がいる場合、配偶者加給年金額が加算される。", "a": true, "e": "正しい記述です。\n【根拠】障害厚生年金の配偶者加給年金額です。\n【ひっかけ】3級には加算はありません。"}, {"id": "tf:c442f92e79", "c": 1, "s": "問題1-5", "st": 2, "q": "個人型確定拠出年金（iDeCo）の掛金は、社会保険料控除の対象となる。", "a": false, "e": "誤りです。\n【根拠】iDeCoの掛金は、小規模企業共済等掛金控除の対象です。\n【ひっかけ】国民年金基金の掛金は、社会保険料控除の対象です。"}, {"id": "tf:40f9b34764", "c": 1, "s": "問題1-5", "st": 1, "q": "公務員は、個人型確定拠出年金（iDeCo）に加入することができない。", "a": false, "e": "誤りです。\n【根拠】公務員も第2号被保険者としてiDeCoに加入できます。\n【ひっかけ】2017年から、公務員や第3号被保険者も加入できるようになりました。"}, {"id": "tf:1de1d2883c", "c": 1, "s": "問題1-5", "st": 1, "q": "企業型確定拠出年金の事業主掛金は、従業員の給与所得として課税される。", "a": false, "e": "誤りです。\n【根拠】事業主掛金は、従業員の給与所得になりません。\n【ひっかけ】事業主は全額を損金に算入できます。"}, {"id": "tf:d0932602c2", "c": 1, "s": "問題1-5", "st": 2, "q": "国民年金基金の掛金は、小規模企業共済等掛金控除の対象となる。", "a": false, "e": "誤りです。\n【根拠】国民年金基金の掛金は、社会保険料控除の対象です。\n【ひっかけ】iDeCoと小規模企業共済の掛金が、小規模企業共済等掛金控除の対象です。"}, {"id": "tf:1b1746d372", "c": 1, "s": "問題1-5", "st": 1, "q": "小規模企業共済には、従業員も加入することができる。", "a": false, "e": "誤りです。\n【根拠】小規模企業共済は、個人事業主や小規模企業の役員などのための制度で、従業員は加入できません。\n【ひっかけ】従業員の退職金準備には中小企業退職金共済があります。"}, {"id": "tf:3189eb0f2b", "c": 1, "s": "問題1-6", "st": 2, "q": "元金均等返済は、元利均等返済に比べて、返済期間・金利などの条件が同じであれば総返済額が少ない。", "a": true, "e": "正しい記述です。\n【根拠】元金均等返済は元金の減り方が早いため、支払う利息の総額が少なくなります。\n【ひっかけ】その代わり、当初の返済額は元金均等返済のほうが多くなります。"}, {"id": "tf:06f4a8a241", "c": 1, "s": "問題1-6", "st": 2, "q": "住宅ローンの繰上げ返済において、返済額軽減型は、期間短縮型に比べて利息の軽減効果が大きい。", "a": false, "e": "誤りです。\n【根拠】同じ額を繰上げ返済した場合、利息の軽減効果が大きいのは期間短縮型です。\n【ひっかけ】返済額軽減型は、毎回の返済額を減らしたいときに向いています。"}, {"id": "tf:c147c7cbc7", "c": 1, "s": "問題1-6", "st": 1, "q": "フラット35の融資額の上限は8,000万円で、金利は全期間固定である。", "a": true, "e": "正しい記述です。\n【根拠】フラット35は全期間固定金利で、融資額は100万円以上8,000万円以下です。\n【ひっかけ】金利は取扱金融機関ごとに異なります。"}, {"id": "tf:ce7a3606e7", "c": 1, "s": "問題1-6", "st": 2, "q": "日本学生支援機構の第一種奨学金は、在学中も卒業後も利息が付かない。", "a": true, "e": "正しい記述です。\n【根拠】第一種奨学金は無利息、第二種奨学金は利息付き（在学中は無利息）です。\n【ひっかけ】国の教育ローンと奨学金は併用できます。"}, {"id": "tf:ee2389c18a", "c": 1, "s": "問題1-6", "st": 1, "q": "国の教育ローン（教育一般貸付）の融資限度額は、学生・生徒1人につき原則500万円である。", "a": false, "e": "誤りです。\n【根拠】融資限度額は学生・生徒1人につき原則350万円です（一定の海外留学などは450万円）。\n【ひっかけ】金額を入れ替える出題に注意します。"}, {"id": "tf:204a2b7c72", "c": 1, "s": "問題1-6", "st": 1, "q": "住宅ローンの金利タイプのうち、変動金利型は、一般に金利が半年ごとに見直され、返済額は5年ごとに見直される。", "a": true, "e": "正しい記述です。\n【根拠】多くの変動金利型は、金利は半年ごと、返済額は5年ごとに見直されます（元利均等返済の場合）。\n【ひっかけ】返済額の見直し時は、前回の返済額の1.25倍が上限とされることが多いです。"}, {"id": "tf:f6b2e63ca0", "c": 1, "s": "問題1-6", "st": 2, "q": "フラット35では、融資率（住宅の建設費・購入価額に対する借入額の割合）が9割を超える場合、9割以下の場合に比べて金利が高く設定されている。", "a": true, "e": "正しい記述です。\n【根拠】融資率9割超の場合は、金利が上乗せされます。\n【ひっかけ】フラット35は、保証人が不要で、繰上返済の手数料もかかりません。"}, {"id": "tf:84a159f4c4", "c": 1, "s": "問題1-6", "st": 1, "q": "フラット35は、中古住宅の購入資金には利用することができない。", "a": false, "e": "誤りです。\n【根拠】フラット35は、新築だけでなく、技術基準を満たす中古住宅の購入にも利用できます。\n【ひっかけ】他の金融機関の住宅ローンからの借換えにも利用できます。"}, {"id": "tf:4164af9a48", "c": 1, "s": "問題1-6", "st": 1, "q": "フラット35の申込みができるのは、申込時の年齢が70歳未満の者である。", "a": true, "e": "正しい記述です。\n【根拠】申込時の年齢は原則70歳未満です（親子リレー返済を利用する場合は70歳以上も可）。\n【ひっかけ】完済時の年齢は80歳までです。"}, {"id": "tf:c75dd44052", "c": 1, "s": "問題1-6", "st": 1, "q": "国の教育ローン（教育一般貸付）の資金は、入学金や授業料に限られ、受験費用や在学のための住居費用には使えない。", "a": false, "e": "誤りです。\n【根拠】受験費用や、自宅外通学のための住居費用、教科書代などにも使えます。\n【ひっかけ】融資額は学生・生徒1人につき原則350万円以内です。"}, {"id": "tf:bee5228e20", "c": 1, "s": "問題1-6", "st": 1, "q": "元利均等返済では、返済当初は毎回の返済額に占める利息の割合が大きい。", "a": true, "e": "正しい記述です。\n【根拠】元利均等返済は、当初は利息部分が多く、元金の減りが遅くなります。\n【ひっかけ】元金均等返済は、毎回の元金部分が一定です。"}, {"id": "tf:eb12e7994b", "c": 1, "s": "問題1-6", "st": 2, "q": "財形住宅貯蓄と財形年金貯蓄は、合わせて元本550万円までの利子が非課税となる。", "a": true, "e": "正しい記述です。\n【根拠】財形年金貯蓄の保険型などは元本385万円までです。\n【ひっかけ】一般財形貯蓄には非課税の扱いがありません。"}, {"id": "tf:3d899a2560", "c": 1, "s": "問題1-6", "st": 1, "q": "財形年金貯蓄の契約は、年齢にかかわらず締結することができる。", "a": false, "e": "誤りです。\n【根拠】財形年金貯蓄と財形住宅貯蓄は、契約時に55歳未満の勤労者が対象です。\n【ひっかけ】一般財形貯蓄には年齢の要件はありません。"}, {"id": "tf:e6899b4acd", "c": 1, "s": "問題1-6", "st": 1, "q": "日本学生支援機構の第二種奨学金の利率は、在学中は無利息である。", "a": true, "e": "正しい記述です。\n【根拠】第二種奨学金は、在学中は無利息で、卒業後に利息が付きます（上限年3％）。\n【ひっかけ】第一種奨学金は無利息です。"}, {"id": "tf:10046d1608", "c": 1, "s": "問題1-6", "st": 1, "q": "国の教育ローン（教育一般貸付）の返済期間は、最長18年である。", "a": true, "e": "正しい記述です。\n【根拠】教育一般貸付の返済期間は最長18年です。\n【ひっかけ】在学期間中は利息のみの返済にすることもできます。"}, {"id": "tf:b8ca68523e", "c": 1, "s": "問題1-6", "st": 1, "q": "一般に、全期間固定金利型の住宅ローンは、変動金利型に比べて借入当初の金利が低い。", "a": false, "e": "誤りです。\n【根拠】一般に、全期間固定金利型は、変動金利型より借入当初の金利が高く設定されます。\n【ひっかけ】金利上昇のリスクを金融機関が負うためです。"}, {"id": "tf:0b9c74c352", "c": 1, "s": "問題1-6", "st": 1, "q": "フラット35を利用する場合、保証料が必要である。", "a": false, "e": "誤りです。\n【根拠】フラット35は保証料が不要で、保証人も不要です。\n【ひっかけ】融資手数料は金融機関によって異なります。"}, {"id": "tf:d471c2c72f", "c": 1, "s": "問題1-6", "st": 2, "q": "住宅ローンの繰上げ返済で期間短縮型を選択すると、毎月の返済額が減少する。", "a": false, "e": "誤りです。\n【根拠】期間短縮型は、毎月の返済額は変わらず返済期間が短くなります。\n【ひっかけ】毎月の返済額が減るのは返済額軽減型です。"}, {"id": "tf:64188646ed", "c": 1, "s": "問題1-6", "st": 1, "q": "国の教育ローン（教育一般貸付）は、学生本人だけが申し込むことができ、保護者は申し込めない。", "a": false, "e": "誤りです。\n【根拠】教育一般貸付は、原則として学生・生徒の保護者が申し込みます。\n【ひっかけ】日本学生支援機構の奨学金は、学生本人が申し込みます。"}, {"id": "tf:1b7451669e", "c": 1, "s": "問題1-6", "st": 1, "q": "日本学生支援機構の第一種奨学金は、第二種奨学金に比べて、学力基準や家計基準が厳しい。", "a": true, "e": "正しい記述です。\n【根拠】無利息の第一種奨学金は、選考基準が厳しくなっています。\n【ひっかけ】第一種と第二種を併用することもできます。"}, {"id": "tf:75e553f2b1", "c": 1, "s": "問題1-7", "st": 2, "q": "流動比率は、流動資産を流動負債で除して求め、一般に高いほど短期的な支払能力が高いとされる。", "a": true, "e": "正しい記述です。\n【根拠】流動比率＝流動資産÷流動負債×100です。\n【ひっかけ】当座比率は、流動資産のうち換金性の高い当座資産を分子にします。"}, {"id": "tf:cbedf97d61", "c": 1, "s": "問題1-7", "st": 2, "q": "自己資本比率は、自己資本を流動負債で除して求める。", "a": false, "e": "誤りです。\n【根拠】自己資本比率は、自己資本÷総資本（負債＋純資産）×100で求めます。\n【ひっかけ】分母を取り違える出題に注意します。"}, {"id": "tf:68262726ef", "c": 1, "s": "問題1-7", "st": 1, "q": "損益分岐点比率は、低いほど収益力が高く、売上高が減少しても赤字になりにくいとされる。", "a": true, "e": "正しい記述です。\n【根拠】損益分岐点比率＝損益分岐点売上高÷実際の売上高×100です。\n【ひっかけ】安全余裕率（100％－損益分岐点比率）は高いほど安全です。"}, {"id": "tf:1a1d165188", "c": 1, "s": "問題1-7", "st": 1, "q": "株式や社債の発行による資金調達は、間接金融に分類される。", "a": false, "e": "誤りです。\n【根拠】株式・社債の発行による資金調達は直接金融です。\n【ひっかけ】金融機関からの借入れが間接金融です。"}, {"id": "tf:19ab2f6962", "c": 1, "s": "問題1-7", "st": 2, "q": "貸金業法の総量規制により、銀行のカードローンも含めて、個人の借入れの総額は年収の3分の1までに制限される。", "a": false, "e": "誤りです。\n【根拠】総量規制は貸金業者からの借入れが対象で、銀行のカードローンは対象外です。\n【ひっかけ】クレジットカードのショッピング利用も対象外です（キャッシングは対象）。"}, {"id": "tf:18f0efd041", "c": 1, "s": "問題1-7", "st": 2, "q": "損益計算書において、営業利益は、売上総利益から販売費及び一般管理費を差し引いて求める。", "a": true, "e": "正しい記述です。\n【根拠】売上総利益＝売上高－売上原価、営業利益＝売上総利益－販管費、経常利益＝営業利益＋営業外収益－営業外費用です。\n【ひっかけ】支払利息は営業外費用です。"}, {"id": "tf:ca9a5dc7bb", "c": 1, "s": "問題1-7", "st": 2, "q": "借入金の支払利息は、損益計算書上、販売費及び一般管理費に計上される。", "a": false, "e": "誤りです。\n【根拠】支払利息は営業外費用に計上されます。\n【ひっかけ】営業利益には影響せず、経常利益に影響します。"}, {"id": "tf:7b2fb9ad08", "c": 1, "s": "問題1-7", "st": 1, "q": "信用保証協会は、中小企業が金融機関から融資を受ける際に、その債務を保証する公的機関である。", "a": true, "e": "正しい記述です。\n【根拠】信用保証協会の保証を付けた融資を、信用保証付融資（マル保融資）といいます。\n【ひっかけ】保証を受けるには保証料が必要です。"}, {"id": "tf:cabf775fbd", "c": 1, "s": "問題1-7", "st": 1, "q": "インパクトローンとは、資金使途に制限のない外貨建ての融資である。", "a": true, "e": "正しい記述です。\n【根拠】外貨で借り入れるため、為替変動のリスクがあります。\n【ひっかけ】ABLは、在庫や売掛金を担保とする融資です。"}, {"id": "tf:7817f30e6f", "c": 1, "s": "問題1-7", "st": 1, "q": "利息制限法では、元本が100万円以上の場合の上限金利は年15％である。", "a": true, "e": "正しい記述です。\n【根拠】10万円未満は年20％、10万円以上100万円未満は年18％、100万円以上は年15％です。\n【ひっかけ】出資法の上限金利は年20％です。"}, {"id": "tf:04fc5916be", "c": 1, "s": "問題1-7", "st": 2, "q": "クレジットカードのキャッシング（金銭の借入れ）は、貸金業法の総量規制の対象となる。", "a": true, "e": "正しい記述です。\n【根拠】キャッシングは貸付けに当たるため、総量規制の対象です。\n【ひっかけ】ショッピング枠の利用は対象外です。"}, {"id": "tf:0ca9fe9219", "c": 1, "s": "問題1-7", "st": 1, "q": "固定比率は、固定資産を自己資本で除して求め、一般に低いほど財務の安全性が高いとされる。", "a": true, "e": "正しい記述です。\n【根拠】固定資産を返済不要の自己資本でどれだけまかなっているかをみる指標です。\n【ひっかけ】流動比率は高いほど、固定比率は低いほど安全とされます。"}, {"id": "tf:f96b417712", "c": 1, "s": "問題1-7", "st": 1, "q": "少人数私募債は、親族や取引先など少人数を対象に発行する社債で、資金調達の方法として直接金融に分類される。", "a": true, "e": "正しい記述です。\n【根拠】社債の発行による資金調達は直接金融です。\n【ひっかけ】金融機関からの借入れは間接金融です。"}, {"id": "tf:404d900387", "c": 1, "s": "問題1-7", "st": 1, "q": "割賦販売法の支払停止の抗弁により、クレジットで購入した商品に欠陥があり販売業者との間で問題が解決しない場合は、クレジット会社への支払を停止することができる。", "a": true, "e": "正しい記述です。\n【根拠】一定の要件を満たす個別信用購入あっせん・包括信用購入あっせんについて認められています。\n【ひっかけ】クレジットカードは、名義人以外の者が使うことはできません。"}, {"id": "tf:3105966b75", "c": 1, "s": "問題1-7", "st": 1, "q": "個人再生手続では、住宅資金特別条項を利用することで、住宅ローンを返済しながら住宅を手放さずに他の債務を減額できる場合がある。", "a": true, "e": "正しい記述です。\n【根拠】住宅ローン以外の債務を減額し、住宅を残せる場合があります。\n【ひっかけ】自己破産で免責を受けると、原則として債務の支払義務がなくなりますが、財産は処分されます。"}, {"id": "tf:d64e8b0f85", "c": 1, "s": "問題1-7", "st": 2, "q": "流動比率が100％を下回っている企業は、短期的な支払能力が高いとされる。", "a": false, "e": "誤りです。\n【根拠】流動比率が100％を下回ると、流動負債を流動資産でまかなえず、短期的な支払能力が低いとされます。\n【ひっかけ】一般に200％以上が望ましいとされます。"}, {"id": "tf:d0e6220631", "c": 1, "s": "問題1-7", "st": 1, "q": "固定費が増加すると、他の条件が同じであれば、損益分岐点売上高は上昇する。", "a": true, "e": "正しい記述です。\n【根拠】損益分岐点売上高＝固定費÷（1－変動費率）なので、固定費が増えると上昇します。\n【ひっかけ】変動費率が上がっても、損益分岐点売上高は上昇します。"}, {"id": "tf:a97008cb0d", "c": 1, "s": "問題1-7", "st": 2, "q": "銀行のカードローンは、貸金業法の総量規制の対象となる。", "a": false, "e": "誤りです。\n【根拠】銀行は貸金業者ではないため、銀行のカードローンは総量規制の対象外です。\n【ひっかけ】各銀行が自主的に審査基準を設けています。"}, {"id": "tf:4d2e992ec7", "c": 1, "s": "問題1-8", "st": 2, "q": "キャッシュフロー表の可処分所得は、年収から所得税・住民税・社会保険料を差し引いた金額である。", "a": true, "e": "正しい記述です。\n【根拠】可処分所得＝年収－（所得税＋住民税＋社会保険料）です。\n【ひっかけ】生命保険料や住宅ローンの返済額は差し引きません。"}, {"id": "tf:aedcedf838", "c": 1, "s": "問題1-8", "st": 2, "q": "キャッシュフロー表の可処分所得を求める際には、年収から生命保険料も差し引く。", "a": false, "e": "誤りです。\n【根拠】可処分所得の計算で差し引くのは、所得税・住民税・社会保険料だけです。\n【ひっかけ】生命保険料は支出の項目に入れます。"}, {"id": "tf:cba3ba0af8", "c": 1, "s": "問題1-8", "st": 2, "q": "現在200万円の支出が年2％で上昇する場合、3年後の支出額は、200万円×（1＋0.02）³で求める。", "a": true, "e": "正しい記述です。\n【根拠】将来の金額＝現在の金額×（1＋変動率）^経過年数です。\n【ひっかけ】×（1＋0.02×3）と単利で計算しないよう注意します。"}, {"id": "tf:7ea7087b30", "c": 1, "s": "問題1-8", "st": 2, "q": "個人バランスシートでは、保有する株式や不動産を取得したときの価額で計上する。", "a": false, "e": "誤りです。\n【根拠】個人バランスシートの資産は、作成時点の時価で計上します。\n【ひっかけ】生命保険は解約返戻金相当額で計上します。"}, {"id": "tf:c33258f9b2", "c": 1, "s": "問題1-8", "st": 1, "q": "キャッシュフロー表の金融資産残高は、前年末の金融資産残高に運用利率を加味し、その年の年間収支を加減して求める。", "a": true, "e": "正しい記述です。\n【根拠】金融資産残高＝前年末残高×（1＋運用利率）±年間収支です。\n【ひっかけ】その年の年間収支には運用利率を掛けません。"}, {"id": "tf:556782361c", "c": 1, "s": "問題1-8", "st": 1, "q": "個人バランスシートの純資産は、資産の合計額から負債の合計額を差し引いて求める。", "a": true, "e": "正しい記述です。\n【根拠】純資産＝資産合計－負債合計です。\n【ひっかけ】純資産がマイナスの状態を債務超過といいます。"}, {"id": "tf:c46e5b80cd", "c": 1, "s": "問題1-8", "st": 2, "q": "キャッシュフロー表の可処分所得を求める際には、年収から財形貯蓄の積立額も差し引く。", "a": false, "e": "誤りです。\n【根拠】可処分所得で差し引くのは、所得税・住民税・社会保険料だけです。\n【ひっかけ】財形貯蓄は貯蓄の一種で、差し引きません。"}, {"id": "tf:393c7b5159", "c": 1, "s": "問題1-8", "st": 1, "q": "個人バランスシートでは、住宅ローンの残高を負債に計上する。", "a": true, "e": "正しい記述です。\n【根拠】住宅ローンや自動車ローンの残高は負債です。\n【ひっかけ】資産は時価で計上します。"}, {"id": "tf:32442cbcf8", "c": 2, "s": "問題2-1", "st": 2, "q": "生命保険契約のクーリング・オフは、契約の申込日又はクーリング・オフについて記載された書面を受け取った日のいずれか遅い日から起算して8日以内であれば、書面又は電磁的記録により行うことができる。", "a": true, "e": "正しい記述です。\n【根拠】いずれか遅い日から8日以内に、書面又は電磁的記録で申込みを撤回できます。\n【ひっかけ】「早い日から」「14日以内」と変える出題に注意します。保険期間1年以内の契約は対象外です。"}, {"id": "tf:e29de1c858", "c": 2, "s": "問題2-1", "st": 1, "q": "保険期間が1年以内の損害保険契約も、クーリング・オフの対象となる。", "a": false, "e": "誤りです。\n【根拠】保険期間が1年以内の契約は、クーリング・オフの対象外です。\n【ひっかけ】法人契約や、医師の診査を終えた後の契約も対象外です。"}, {"id": "tf:f0519f5b24", "c": 2, "s": "問題2-1", "st": 2, "q": "生命保険会社が破綻した場合、生命保険契約者保護機構により、原則として破綻時点の責任準備金等の80％まで補償される。", "a": false, "e": "誤りです。\n【根拠】生命保険の補償は、原則として責任準備金等の90％までです（高予定利率契約を除く）。\n【ひっかけ】損害保険は契約の種類によって80％〜100％です。生保の90％と混同させる出題です。"}, {"id": "tf:979c76f6a8", "c": 2, "s": "問題2-1", "st": 1, "q": "損害保険会社が破綻した場合、自賠責保険と家計地震保険は、保険金の全額が補償される。", "a": true, "e": "正しい記述です。\n【根拠】自賠責保険と家計地震保険は、損害保険契約者保護機構により100％補償されます。\n【ひっかけ】火災保険や自動車保険（任意）などは、破綻後3か月以内の事故は100％、それ以後は80％です。"}, {"id": "tf:5f73f6a5ec", "c": 2, "s": "問題2-1", "st": 2, "q": "ソルベンシー・マージン比率が200％以上であれば、保険会社の保険金等の支払余力は一定の水準を満たしているとされる。", "a": true, "e": "正しい記述です。\n【根拠】200％を下回ると、金融庁による早期是正措置の対象となります。\n【ひっかけ】「100％以上」と数字を変える出題に注意します。"}, {"id": "tf:27bdd940f6", "c": 2, "s": "問題2-1", "st": 1, "q": "少額短期保険業者と締結した保険契約は、保険契約者保護機構の補償の対象となる。", "a": false, "e": "誤りです。\n【根拠】少額短期保険は、保険契約者保護機構の補償の対象外です。\n【ひっかけ】共済も同様に対象外です。少額短期保険の保険金額の上限は、原則1被保険者あたり1,000万円です。"}, {"id": "tf:4af1bd225e", "c": 2, "s": "問題2-1", "st": 2, "q": "保険法では、保険法の規定よりも保険契約者等に不利な内容の特約は無効とされる。", "a": true, "e": "正しい記述です。\n【根拠】片面的強行規定といい、保険契約者等を保護するための規定です。\n【ひっかけ】有利な特約は有効です。"}, {"id": "tf:26250528d6", "c": 2, "s": "問題2-1", "st": 2, "q": "保険法は、保険会社との保険契約に適用され、JAやこくみん共済などの共済契約には適用されない。", "a": false, "e": "誤りです。\n【根拠】保険法は、共済契約にも適用されます。\n【ひっかけ】保険業法は、主に保険会社などの事業者を規制する法律です。"}, {"id": "tf:d97e2349a3", "c": 2, "s": "問題2-1", "st": 1, "q": "保険法では、保険契約者等は、保険会社から告知を求められた事項について事実を告知すればよいとされている。", "a": true, "e": "正しい記述です。\n【根拠】質問応答義務といいます。保険会社が質問していない事項まで自発的に告知する必要はありません。\n【ひっかけ】以前の商法では自発的申告義務とされていました。"}, {"id": "tf:ffbab7b37e", "c": 2, "s": "問題2-1", "st": 1, "q": "保険法では、保険金を請求する権利は、これを行使することができる時から5年間行使しないときは時効により消滅する。", "a": false, "e": "誤りです。\n【根拠】保険金を請求する権利の時効は3年です。\n【ひっかけ】公的年金を受ける権利の時効（5年）と区別します。"}, {"id": "tf:7281962e11", "c": 2, "s": "問題2-1", "st": 1, "q": "保険業法では、保険会社等に対し、顧客の意向を把握して、それに沿った保険商品を提案・説明することを求めている。", "a": true, "e": "正しい記述です。\n【根拠】意向把握義務といいます。\n【ひっかけ】契約の判断に必要な情報を提供する情報提供義務もあります。"}, {"id": "tf:7f87787c70", "c": 2, "s": "問題2-1", "st": 1, "q": "高予定利率契約については、生命保険契約者保護機構による補償の割合が90％より低くなる場合がある。", "a": true, "e": "正しい記述です。\n【根拠】破綻時から過去5年間の予定利率が基準利率を超える契約は、補償率が引き下げられます。\n【ひっかけ】原則は責任準備金等の90％です。"}, {"id": "tf:13ace46d0c", "c": 2, "s": "問題2-1", "st": 2, "q": "少額短期保険業者が引き受ける保険の保険金額の上限は、1被保険者あたり総額1,000万円である。", "a": true, "e": "正しい記述です。\n【根拠】死亡保険や医療保険など、保険の種類ごとにも上限があります。\n【ひっかけ】少額短期保険は保険契約者保護機構の補償の対象外です。"}, {"id": "tf:b338d0fe8e", "c": 2, "s": "問題2-1", "st": 2, "q": "少額短期保険業者と締結した保険契約の保険料は、生命保険料控除の対象となる。", "a": false, "e": "誤りです。\n【根拠】少額短期保険の保険料は、生命保険料控除・地震保険料控除の対象外です。\n【ひっかけ】少額短期保険は、保険期間が生命保険・医療保険は1年、損害保険は2年までです。"}, {"id": "tf:d3a8112a1a", "c": 2, "s": "問題2-1", "st": 2, "q": "生命保険契約のクーリング・オフ期間は、契約の申込日から起算して8日以内であり、書面の受領日は考慮されない。", "a": false, "e": "誤りです。\n【根拠】申込日又はクーリング・オフについて記載された書面を受け取った日の、いずれか遅い日から8日以内です。\n【ひっかけ】書面を受け取っていなければ、期間は始まりません。"}, {"id": "tf:d6c41fa005", "c": 2, "s": "問題2-1", "st": 2, "q": "生命保険会社が破綻した場合、保険契約者保護機構により、破綻時点の責任準備金等の全額が補償される。", "a": false, "e": "誤りです。\n【根拠】補償は原則として責任準備金等の90％までです。\n【ひっかけ】保険金額の90％ではなく、責任準備金等の90％である点にも注意します。"}, {"id": "tf:5b3a5f98ba", "c": 2, "s": "問題2-1", "st": 2, "q": "ソルベンシー・マージン比率が100％以上であれば、保険会社の健全性の基準を満たしているとされる。", "a": false, "e": "誤りです。\n【根拠】健全性の基準は200％以上です。\n【ひっかけ】200％を下回ると、早期是正措置の対象になります。"}, {"id": "tf:abdb0e2452", "c": 2, "s": "問題2-1", "st": 1, "q": "保険法では、保険契約者等は、保険会社から質問されていない事項についても、重要な事実を自発的に告知しなければならない。", "a": false, "e": "誤りです。\n【根拠】保険法では、保険会社が告知を求めた事項に答えればよい（質問応答義務）とされます。\n【ひっかけ】以前の商法の自発的申告義務と混同させる出題です。"}, {"id": "tf:93c8c7e7e5", "c": 2, "s": "問題2-1", "st": 1, "q": "少額短期保険業者が引き受ける生命保険の保険期間の上限は、5年である。", "a": false, "e": "誤りです。\n【根拠】少額短期保険の保険期間は、生命保険・医療保険は1年、損害保険は2年までです。\n【ひっかけ】保険金額の上限は、1被保険者あたり総額1,000万円です。"}, {"id": "tf:6197e8dbec", "c": 2, "s": "問題2-2", "st": 2, "q": "定期保険は、保険期間中に死亡した場合に死亡保険金が支払われるほか、保険期間満了時に満期保険金が支払われる。", "a": false, "e": "誤りです。\n【根拠】定期保険には満期保険金がありません（いわゆる掛け捨て）。\n【ひっかけ】死亡保険金と同額の満期保険金があるのは養老保険です。"}, {"id": "tf:3cc198fb0a", "c": 2, "s": "問題2-2", "st": 2, "q": "収入保障保険の死亡保険金を一時金で受け取る場合、受取総額は年金形式で受け取る場合より少なくなる。", "a": true, "e": "正しい記述です。\n【根拠】一時金で受け取ると、年金で受け取る分の運用益が差し引かれるため、受取総額は少なくなります。\n【ひっかけ】収入保障保険は、経過とともに保障額が減っていくため、同じ保険金額の定期保険より保険料が割安です。"}, {"id": "tf:3a71064d2d", "c": 2, "s": "問題2-2", "st": 2, "q": "変額保険（終身型）の死亡保険金には最低保証があるが、解約返戻金には最低保証がない。", "a": true, "e": "正しい記述です。\n【根拠】変額保険の死亡・高度障害保険金には基本保険金額の最低保証がありますが、解約返戻金・満期保険金には最低保証がありません。\n【ひっかけ】「解約返戻金にも最低保証がある」とする出題に注意します。"}, {"id": "tf:421c4ed88a", "c": 2, "s": "問題2-2", "st": 2, "q": "払済保険とは、保険料の払込みを中止して、その時点の解約返戻金をもとに、保険金額を変えずに定期保険に変更するものである。", "a": false, "e": "誤りです。\n【根拠】記述は延長保険の説明です。払済保険は、保険期間を変えずに保険金額を減らします。\n【ひっかけ】「保険期間を変えない＝払済」「保険金額を変えない＝延長」と覚えます。"}, {"id": "tf:1e37593818", "c": 2, "s": "問題2-2", "st": 1, "q": "払済保険や延長保険に変更した場合、元の契約に付加されていた特約は原則として消滅する。", "a": true, "e": "正しい記述です。\n【根拠】払済保険・延長保険に変更すると、特約は原則として消滅します（リビング・ニーズ特約などは除かれます）。\n【ひっかけ】自動振替貸付は保険料を立て替えるだけなので、契約内容は変わりません。"}, {"id": "tf:d78e23469e", "c": 2, "s": "問題2-2", "st": 1, "q": "失効した生命保険契約を復活させる場合、復活後の保険料は、復活時の年齢・保険料率で計算される。", "a": false, "e": "誤りです。\n【根拠】復活後の保険料は、失効前の保険料率が適用されます。\n【ひっかけ】復活には告知又は診査と、延滞保険料（及び利息）の払込みが必要です。"}, {"id": "tf:7595b72201", "c": 2, "s": "問題2-2", "st": 2, "q": "生命保険会社の責任開始日は、保険会社の承諾を前提として、申込み・告知（診査）・第1回保険料の払込みの3つがそろった日である。", "a": true, "e": "正しい記述です。\n【根拠】3つがそろった日から保障が始まります。\n【ひっかけ】保険会社の承諾日ではありません。承諾は責任開始日にさかのぼって効力が生じます。"}, {"id": "tf:08dc13b8a1", "c": 2, "s": "問題2-2", "st": 2, "q": "告知義務違反があった場合、保険会社は契約締結から10年を経過するまでは、いつでも契約を解除することができる。", "a": false, "e": "誤りです。\n【根拠】解除権は、原因を知った時から1か月行使しないとき、又は契約締結から5年を経過したときに消滅します。\n【ひっかけ】数字を変える出題に注意します。"}, {"id": "tf:ba8b19d222", "c": 2, "s": "問題2-2", "st": 2, "q": "生命保険の保険料の計算において、予定利率を低く設定すると、保険料は安くなる。", "a": false, "e": "誤りです。\n【根拠】予定利率が低いと運用で見込める収益が減るため、保険料は高くなります。\n【ひっかけ】予定死亡率・予定事業費率は、高く設定すると保険料が高くなります。"}, {"id": "tf:ae58a3e40b", "c": 2, "s": "問題2-2", "st": 1, "q": "生命保険の剰余金は、主に死差益・利差益・費差益の3つから生じる。", "a": true, "e": "正しい記述です。\n【根拠】予定と実際の差から生じる3利源で、契約者配当の財源となります。\n【ひっかけ】無配当保険は、配当がない分だけ保険料が割安です。"}, {"id": "tf:c78438102b", "c": 2, "s": "問題2-2", "st": 1, "q": "更新型の定期保険特約付終身保険は、更新時の年齢で保険料が計算されるため、通常、更新後の保険料は更新前より高くなる。", "a": true, "e": "正しい記述です。\n【根拠】更新時には健康状態の告知は不要ですが、保険料は更新時の年齢で再計算されます。\n【ひっかけ】保険料が上がる点を見落とさせる出題が多い論点です。"}, {"id": "tf:6558d35b7c", "c": 2, "s": "問題2-2", "st": 2, "q": "個人年金保険の有期年金は、年金受取期間中に被保険者が死亡した場合でも、残りの期間の年金が遺族に支払われる。", "a": false, "e": "誤りです。\n【根拠】有期年金は、被保険者が生存している場合に限り年金が支払われます。\n【ひっかけ】生死にかかわらず一定期間支払われるのは確定年金です。"}, {"id": "tf:b79c6e16f5", "c": 2, "s": "問題2-2", "st": 2, "q": "生命保険の保険料のうち純保険料は、予定死亡率と予定利率をもとに計算される。", "a": true, "e": "正しい記述です。\n【根拠】付加保険料は予定事業費率をもとに計算されます。\n【ひっかけ】予定利率は純保険料、予定事業費率は付加保険料に関わります。"}, {"id": "tf:28f0dab565", "c": 2, "s": "問題2-2", "st": 1, "q": "生命保険の付加保険料は、予定死亡率をもとに計算される。", "a": false, "e": "誤りです。\n【根拠】付加保険料は、保険会社の事業経費に充てる部分で、予定事業費率をもとに計算されます。\n【ひっかけ】予定死亡率は純保険料の計算に使います。"}, {"id": "tf:093e56b632", "c": 2, "s": "問題2-2", "st": 2, "q": "保険料を前納した場合、払込期日が到来していない保険料は保険会社が預かっており、途中で解約すると未経過分の保険料が返還される。", "a": true, "e": "正しい記述です。\n【根拠】前納は毎年の払込期日に充当されるため、未経過分は返還されます。\n【ひっかけ】一時払いは、保険期間全体の保険料として払い込むものです。"}, {"id": "tf:9ecccd74c9", "c": 2, "s": "問題2-2", "st": 2, "q": "生命保険料を前納した場合、前納した保険料の全額をその年の生命保険料控除の対象とすることができる。", "a": false, "e": "誤りです。\n【根拠】前納の場合は、その年の払込期日が到来して充当された分だけが控除の対象です。\n【ひっかけ】一時払いは、払い込んだ年だけが控除の対象です。"}, {"id": "tf:8db8634ca9", "c": 2, "s": "問題2-2", "st": 2, "q": "契約転換制度を利用する場合、告知や診査は不要である。", "a": false, "e": "誤りです。\n【根拠】転換時には告知又は診査が必要です。\n【ひっかけ】保険料は転換時の年齢・保険料率で計算されます。"}, {"id": "tf:5f578f34b9", "c": 2, "s": "問題2-2", "st": 1, "q": "契約者貸付制度は、解約返戻金の一定範囲内で保険会社から貸付けを受けられる制度である。", "a": true, "e": "正しい記述です。\n【根拠】所定の利息がかかります。返済前に保険金の支払事由が生じた場合は、貸付金の元利合計を差し引いて支払われます。\n【ひっかけ】貸付額が解約返戻金を超えると、契約が失効することがあります。"}, {"id": "tf:78159be7f8", "c": 2, "s": "問題2-2", "st": 2, "q": "逓減定期保険は、保険期間の経過とともに保険金額が減少し、保険料も同時に減少していく。", "a": false, "e": "誤りです。\n【根拠】逓減定期保険は保険金額が減少しますが、保険料は一定です。\n【ひっかけ】逓増定期保険は、保険金額が増加します。"}, {"id": "tf:397ad52f76", "c": 2, "s": "問題2-2", "st": 1, "q": "学資（こども）保険では、一般に、契約者（親）が死亡した場合、以後の保険料の払込みが免除される。", "a": true, "e": "正しい記述です。\n【根拠】払込みが免除されても、祝金や満期保険金は契約どおり受け取れます。\n【ひっかけ】育英年金が支払われるタイプもあります。"}, {"id": "tf:607b3a85d9", "c": 2, "s": "問題2-2", "st": 1, "q": "総合福祉団体定期保険は、企業が契約者となり、役員・従業員を被保険者とする保険期間1年の定期保険である。", "a": true, "e": "正しい記述です。\n【根拠】死亡退職金などの財源として使われ、保険料は損金に算入されます。\n【ひっかけ】加入には被保険者の同意が必要です。"}, {"id": "tf:dc8c2e049e", "c": 2, "s": "問題2-2", "st": 2, "q": "外貨建て生命保険は、円換算した保険金額や解約返戻金が為替相場の変動によって増減する。", "a": true, "e": "正しい記述です。\n【根拠】外貨建て保険には為替リスクがあります。\n【ひっかけ】為替手数料もかかります。"}, {"id": "tf:43509fef0c", "c": 2, "s": "問題2-2", "st": 1, "q": "市場価格調整（MVA）がある保険では、解約時の市場金利が契約時より上昇していると、解約返戻金が増加する。", "a": false, "e": "誤りです。\n【根拠】市場金利が上昇していると、解約返戻金は減少します。金利が低下していると増加します。\n【ひっかけ】債券価格と金利の関係と同じ考え方です。"}, {"id": "tf:5840e53d63", "c": 2, "s": "問題2-2", "st": 1, "q": "保証期間付終身年金では、保証期間中に被保険者が死亡した場合、残りの保証期間の年金又は一時金が遺族に支払われる。", "a": true, "e": "正しい記述です。\n【根拠】保証期間経過後は、被保険者が生存している限り年金が支払われます。\n【ひっかけ】保証期間のない終身年金は、死亡するとそこで終わります。"}, {"id": "tf:a2e462c526", "c": 2, "s": "問題2-2", "st": 1, "q": "変額保険の資産は、一般勘定で運用される。", "a": false, "e": "誤りです。\n【根拠】変額保険の資産は、特別勘定で運用されます。\n【ひっかけ】定額の保険は一般勘定で運用されます。"}, {"id": "tf:e88b69d122", "c": 2, "s": "問題2-2", "st": 1, "q": "定期保険を更新する場合、健康状態についての告知や診査は不要である。", "a": true, "e": "正しい記述です。\n【根拠】更新時には告知・診査は不要ですが、保険料は更新時の年齢で計算されます。\n【ひっかけ】契約転換には告知・診査が必要です。"}, {"id": "tf:cca8d965be", "c": 2, "s": "問題2-2", "st": 1, "q": "終身保険の保険料を短期払い（例：60歳払込満了）にすると、終身払いに比べて毎回の保険料は高くなる。", "a": true, "e": "正しい記述です。\n【根拠】払込期間が短いほど、1回あたりの保険料は高くなります。\n【ひっかけ】払込総額は終身払いより少なくなることがあります。"}, {"id": "tf:8fd95b81b4", "c": 2, "s": "問題2-2", "st": 2, "q": "低解約返戻金型終身保険は、保険料払込期間中の解約返戻金を低く抑えることで、保険料を割安にした保険である。", "a": true, "e": "正しい記述です。\n【根拠】払込期間満了後は、通常の終身保険と同水準の解約返戻金になります。\n【ひっかけ】払込期間中に解約すると、払込保険料を大きく下回ることがあります。"}, {"id": "tf:faebe3c8e8", "c": 2, "s": "問題2-2", "st": 1, "q": "定期保険特約付終身保険は、定期保険を主契約とし、終身保険を特約として付加した保険である。", "a": false, "e": "誤りです。\n【根拠】主契約は終身保険で、定期保険が特約です。\n【ひっかけ】特約は主契約が消滅すると、原則として一緒に消滅します。"}, {"id": "tf:bdbc29b8d9", "c": 2, "s": "問題2-2", "st": 1, "q": "利率変動型積立終身保険（アカウント型保険）では、保険料の払込期間中は積立部分と保障部分（特約）に分かれており、払込期間満了後に積立金を終身保険などに移行できる。", "a": true, "e": "正しい記述です。\n【根拠】積立部分の利率は、一定期間ごとに見直されます。\n【ひっかけ】積立金の引出しができる商品もあります。"}, {"id": "tf:4e6bfce46e", "c": 2, "s": "問題2-2", "st": 2, "q": "引受基準緩和型医療保険の保険料は、一般の医療保険の保険料より割安である。", "a": false, "e": "誤りです。\n【根拠】引受基準緩和型は、持病がある人も加入しやすい代わりに、保険料は割高です。\n【ひっかけ】加入後一定期間は、給付が削減される商品もあります。"}, {"id": "tf:9eb392dbe7", "c": 2, "s": "問題2-2", "st": 2, "q": "特定疾病保障保険の特定疾病保険金を受け取った場合、その契約は消滅する。", "a": true, "e": "正しい記述です。\n【根拠】特定疾病保険金と死亡保険金は、どちらか一方しか支払われません。\n【ひっかけ】特定疾病以外の原因で死亡した場合も、死亡保険金が支払われます。"}, {"id": "tf:c04c58dea9", "c": 2, "s": "問題2-2", "st": 1, "q": "指定代理請求特約は、被保険者本人が保険金を請求できない特別な事情がある場合に、あらかじめ指定した代理人が請求できる特約である。", "a": true, "e": "正しい記述です。\n【根拠】がんの告知を受けていない場合などに使われます。特約保険料はかかりません。\n【ひっかけ】代理人の範囲は、配偶者や3親等内の親族などです。"}, {"id": "tf:ca91ab13e5", "c": 2, "s": "問題2-2", "st": 2, "q": "必要保障額は、世帯主が死亡した場合の遺族の支出総額から、遺族の収入見込額を差し引いて求める。", "a": true, "e": "正しい記述です。\n【根拠】必要保障額は、子の成長とともに一般に減少していきます。\n【ひっかけ】団体信用生命保険の付いた住宅ローンの返済額は、支出に含めません。"}, {"id": "tf:00ffeb56c7", "c": 2, "s": "問題2-2", "st": 2, "q": "団体信用生命保険付きの住宅ローンがある場合、必要保障額の計算上、住宅ローンの残りの返済額を遺族の支出に含める。", "a": false, "e": "誤りです。\n【根拠】死亡時にはローン残高が保険金で返済されるため、ローンの返済額は支出に含めません。\n【ひっかけ】住居費として、管理費や固定資産税などは含めます。"}, {"id": "tf:832bff3a07", "c": 2, "s": "問題2-2", "st": 1, "q": "団体信用生命保険の保険金は、被保険者の遺族ではなく住宅ローンの債権者である金融機関に支払われ、ローン残高の返済に充てられる。", "a": true, "e": "正しい記述です。\n【根拠】団体信用生命保険の保険金受取人は金融機関です。\n【ひっかけ】そのため、遺族の相続財産にはなりません。"}, {"id": "tf:04183608c7", "c": 2, "s": "問題2-2", "st": 1, "q": "生命保険の契約者配当金を保険料と相殺した場合、生命保険料控除の対象となる保険料は、支払った保険料から配当金を差し引いた金額となる。", "a": true, "e": "正しい記述です。\n【根拠】配当金を差し引いた後の金額が控除の対象です。\n【ひっかけ】配当金を積み立てた場合も、受け取った配当金は払込保険料から差し引きます。"}, {"id": "tf:5b1de4dcf4", "c": 2, "s": "問題2-2", "st": 1, "q": "団体定期保険（Bグループ保険）は、従業員が任意に加入し、保険料を従業員が負担する保険期間1年の定期保険である。", "a": true, "e": "正しい記述です。\n【根拠】Bグループ保険は、任意加入で保険料は従業員負担です。\n【ひっかけ】総合福祉団体定期保険（Aグループ）は、保険料を企業が負担します。"}, {"id": "tf:3ab472ea21", "c": 2, "s": "問題2-2", "st": 2, "q": "定期保険は、一般に終身保険に比べて解約返戻金が多い。", "a": false, "e": "誤りです。\n【根拠】定期保険は掛け捨て型で、解約返戻金はないか、あってもわずかです。\n【ひっかけ】終身保険は貯蓄性があり、解約返戻金があります。"}, {"id": "tf:22c229fc1c", "c": 2, "s": "問題2-2", "st": 2, "q": "終身保険の解約返戻金は、いつ解約しても払込保険料の総額を上回る。", "a": false, "e": "誤りです。\n【根拠】契約から間もない時期に解約すると、解約返戻金は払込保険料の総額を下回ります。\n【ひっかけ】低解約返戻金型では、払込期間中の解約返戻金がさらに少なくなります。"}, {"id": "tf:d62eb2c1a6", "c": 2, "s": "問題2-2", "st": 2, "q": "収入保障保険の保険金額（年金総額）は、保険期間を通じて一定である。", "a": false, "e": "誤りです。\n【根拠】収入保障保険は、時間の経過とともに受け取れる年金の総額が減少していきます。\n【ひっかけ】そのため、同じ保障額の定期保険より保険料が割安です。"}, {"id": "tf:abe6c904c3", "c": 2, "s": "問題2-2", "st": 2, "q": "変額保険（終身型）の死亡保険金には、基本保険金額の最低保証がない。", "a": false, "e": "誤りです。\n【根拠】変額保険の死亡・高度障害保険金には、基本保険金額の最低保証があります。\n【ひっかけ】解約返戻金や満期保険金には最低保証がありません。"}, {"id": "tf:dc65e89c58", "c": 2, "s": "問題2-2", "st": 2, "q": "個人年金保険の確定年金は、年金受取期間中に被保険者が死亡した場合、年金の支払が終了する。", "a": false, "e": "誤りです。\n【根拠】確定年金は、被保険者の生死にかかわらず、残りの期間の年金又は一時金が遺族に支払われます。\n【ひっかけ】被保険者が死亡すると終わるのは、有期年金や保証期間のない終身年金です。"}, {"id": "tf:c12ff24976", "c": 2, "s": "問題2-2", "st": 2, "q": "払済保険に変更すると、元の契約より保険期間が短くなる。", "a": false, "e": "誤りです。\n【根拠】払済保険は、保険期間を変えずに保険金額を減らします。\n【ひっかけ】保険期間が短くなることがあるのは延長保険です。"}, {"id": "tf:f3825602c6", "c": 2, "s": "問題2-2", "st": 2, "q": "延長保険に変更すると、保険金額は元の契約より少なくなる。", "a": false, "e": "誤りです。\n【根拠】延長保険は、保険金額を変えずに保険期間を調整します。\n【ひっかけ】保険金額が少なくなるのは払済保険です。"}, {"id": "tf:592fd266d5", "c": 2, "s": "問題2-2", "st": 1, "q": "自動振替貸付は、解約返戻金を超える額であっても保険料を立て替える制度である。", "a": false, "e": "誤りです。\n【根拠】自動振替貸付は、解約返戻金の範囲内で保険料を立て替えます。\n【ひっかけ】解約返戻金が不足すると、契約は失効します。"}, {"id": "tf:4e7a049ae2", "c": 2, "s": "問題2-2", "st": 1, "q": "失効した生命保険契約は、期間の制限なく、いつでも復活することができる。", "a": false, "e": "誤りです。\n【根拠】復活できるのは、失効後一定期間内（一般に3年以内）です。\n【ひっかけ】復活には告知又は診査と延滞保険料の払込みが必要です。"}, {"id": "tf:c62061a000", "c": 2, "s": "問題2-3", "st": 2, "q": "2012年1月1日以後に締結した生命保険契約に係る生命保険料控除の所得税の控除限度額は、一般・介護医療・個人年金の合計で12万円である。", "a": true, "e": "正しい記述です。\n【根拠】各区分4万円、合計12万円が限度です。\n【ひっかけ】住民税は各2万8,000円、合計7万円が限度です。"}, {"id": "tf:ce1cfad103", "c": 2, "s": "問題2-3", "st": 2, "q": "契約者（保険料負担者）と被保険者が夫、死亡保険金受取人が妻である生命保険契約において、妻が受け取る死亡保険金は所得税（一時所得）の課税対象となる。", "a": false, "e": "誤りです。\n【根拠】契約者＝被保険者の死亡保険金は、相続税の課税対象です。\n【ひっかけ】契約者＝受取人なら所得税（一時所得）、三者がすべて異なれば贈与税です。"}, {"id": "tf:223206ed07", "c": 2, "s": "問題2-3", "st": 2, "q": "契約者（保険料負担者）と死亡保険金受取人が妻、被保険者が夫である生命保険契約において、妻が受け取る死亡保険金は所得税（一時所得）の課税対象となる。", "a": true, "e": "正しい記述です。\n【根拠】契約者＝受取人の場合、自分が負担した保険料で自分が受け取るため、所得税（一時所得）となります。\n【ひっかけ】相続税の「死亡保険金の非課税金額」は使えません。"}, {"id": "tf:f7f8df1496", "c": 2, "s": "問題2-3", "st": 2, "q": "契約者（保険料負担者）が夫、被保険者が妻、死亡保険金受取人が子である生命保険契約において、子が受け取る死亡保険金は贈与税の課税対象となる。", "a": true, "e": "正しい記述です。\n【根拠】契約者・被保険者・受取人がすべて異なる場合は、贈与税の対象です。\n【ひっかけ】保険料を負担した夫から、子への贈与とみなされます。"}, {"id": "tf:aa724bb691", "c": 2, "s": "問題2-3", "st": 2, "q": "被保険者が受け取る入院給付金や手術給付金は、一時所得として所得税の課税対象となる。", "a": false, "e": "誤りです。\n【根拠】身体の傷害・疾病に基因して受け取る入院給付金・手術給付金は非課税です。\n【ひっかけ】高度障害保険金やリビング・ニーズ特約の保険金も非課税です。"}, {"id": "tf:8b9f6f4150", "c": 2, "s": "問題2-3", "st": 1, "q": "個人年金保険の年金を受け取った場合、公的年金等以外の雑所得として所得税の課税対象となる。", "a": true, "e": "正しい記述です。\n【根拠】契約者＝年金受取人の個人年金は、雑所得（公的年金等以外）です。\n【ひっかけ】公的年金等控除の対象にはなりません。"}, {"id": "tf:21f3d3017d", "c": 2, "s": "問題2-3", "st": 1, "q": "2011年12月31日以前に締結した生命保険契約（旧契約）に係る一般の生命保険料控除の所得税の控除限度額は5万円である。", "a": true, "e": "正しい記述です。\n【根拠】旧契約は、一般・個人年金の各区分で所得税5万円が限度です。\n【ひっかけ】新契約は各4万円です。新旧の契約がある場合の上限計算に注意します。"}, {"id": "tf:d1e94657ce", "c": 2, "s": "問題2-3", "st": 1, "q": "医療保険やがん保険の保険料は、介護医療保険料控除の対象となる。", "a": true, "e": "正しい記述です。\n【根拠】2012年以後の契約では、医療保険・がん保険・介護保険などは介護医療保険料控除の対象です。\n【ひっかけ】定期保険・終身保険は一般の生命保険料控除です。"}, {"id": "tf:94f91eb216", "c": 2, "s": "問題2-3", "st": 2, "q": "一時払養老保険（保険期間5年以下）の満期保険金のうち差益部分は、金融類似商品として20.315％の源泉分離課税の対象となる。", "a": true, "e": "正しい記述です。\n【根拠】保険期間が5年以下（又は5年以内に解約）の一時払養老保険などの差益は源泉分離課税です。\n【ひっかけ】保険期間が5年超で5年経過後に受け取る場合は、一時所得です。"}, {"id": "tf:f822a33f23", "c": 2, "s": "問題2-3", "st": 1, "q": "契約者と年金受取人が同一である個人年金保険の年金は、その年に受け取った年金額から、それに対応する払込保険料を差し引いた金額が雑所得となる。", "a": true, "e": "正しい記述です。\n【根拠】雑所得（公的年金等以外）の金額＝年金額－必要経費（払込保険料のうちその年の年金に対応する部分）です。\n【ひっかけ】公的年金等控除は適用されません。"}, {"id": "tf:867fa84c6b", "c": 2, "s": "問題2-

, "a": 1, "e": "正解は「定期保険特約付終身保険の主契約は、定期保険である。」です。\n【根拠】主契約は終身保険で、定期保険は特約です。\n【ひっかけ】主契約が消滅すると、特約も原則として消滅します。"}, {"id": "mc:1a85118761", "c": 2, "s": "問題2-2", "st": 2, "q": "生命保険の商品に関する次の記述のうち、最も適切なものはどれか。", "o": ["定期保険は、終身保険より解約返戻金が多い。", "収入保障保険の年金総額は、経過とともに減少する。", "変額保険の死亡保険金には、最低保証がない。", "確定年金は、被保険者が死亡すると年金の支払が終わる。"], "a": 1, "e": "正解は「収入保障保険の年金総額は、経過とともに減少する。」です。\n【根拠】収入保障保険は、受け取れる年金総額が時間とともに減少します。\n【ひっかけ】定期保険は解約返戻金がほぼなく、変額保険の死亡保険金は最低保証あり、確定年金は生死に関係なく支払われます。"}, {"id": "mc:315d909c15", "c": 2, "s": "問題2-3", "st": 2, "q": "契約者（保険料負担者）、被保険者、死亡保険金受取人の組合せのうち、死亡保険金が相続税の課税対象となるものはどれか。", "o": ["契約者：夫／被保険者：夫／受取人：妻", "契約者：妻／被保険者：夫／受取人：妻", "契約者：夫／被保険者：妻／受取人：子", "契約者：子／被保険者：夫／受取人：子"], "a": 0, "e": "正解は「契約者：夫／被保険者：夫／受取人：妻」です。\n【根拠】契約者＝被保険者の死亡保険金は相続税の対象です。\n【ひっかけ】契約者＝受取人は所得税（一時所得）、三者がすべて異なる場合は贈与税です。"}, {"id": "mc:c2657b49ee", "c": 2, "s": "問題2-3", "st": 2, "q": "2012年以後に締結した生命保険契約について、一般の生命保険料を年間10万円支払った場合の所得税の生命保険料控除の額として、正しいものはどれか。", "o": ["2万5,000円", "3万5,000円", "4万円", "5万円"], "a": 2, "e": "正解は「4万円」です。\n【根拠】新契約は、年間支払保険料が8万円を超えると控除額は一律4万円です。\n【ひっかけ】5万円は旧契約の上限額です。"}, {"id": "mc:88d7ba605f", "c": 2, "s": "問題2-3", "st": 2, "q": "契約者・年金受取人が本人の個人年金保険で、その年に受け取った年金額が100万円、払込保険料総額が1,200万円、年金の受取総額（見込額）が1,500万円の場合、その年の雑所得の金額として正しいものはどれか。", "o": ["0円", "20万円", "50万円", "100万円"], "a": 1, "e": "正解は「20万円」です。\n【根拠】必要経費＝100万円×1,200万/1,500万＝80万円。雑所得＝100万－80万＝20万円です。\n【ひっかけ】公的年金等控除は使えません。"}, {"id": "mc:4a966f2419", "c": 2, "s": "問題2-3", "st": 2, "q": "契約者・満期保険金受取人が本人の養老保険（保険期間20年）で、満期保険金1,000万円、払込保険料総額800万円の場合、総所得金額に算入される一時所得の金額として正しいものはどれか（他に一時所得はない）。", "o": ["75万円", "100万円", "150万円", "200万円"], "a": 0, "e": "正解は「75万円」です。\n【根拠】一時所得＝1,000万－800万－50万＝150万円。総所得金額に算入するのはその2分の1の75万円です。\n【ひっかけ】2分の1を忘れると150万円になります。"}, {"id": "mc:9d8abed767", "c": 2, "s": "問題2-3", "st": 2, "q": "契約者（保険料負担者）・被保険者・死亡保険金受取人と課税される税金の組合せとして、最も不適切なものはどれか。", "o": ["夫・夫・妻―相続税", "妻・夫・妻―所得税", "夫・妻・子―贈与税", "子・夫・子―相続税"], "a": 3, "e": "正解は「子・夫・子―相続税」です。\n【根拠】契約者（子）＝受取人（子）なので、所得税（一時所得）です。\n【ひっかけ】契約者＝被保険者は相続税、三者が異なれば贈与税です。"}, {"id": "mc:fe75ae1130", "c": 2, "s": "問題2-3", "st": 2, "q": "生命保険料控除に関する次の記述のうち、最も不適切なものはどれか（2012年以後の契約）。", "o": ["一般の生命保険料控除の所得税の限度額は4万円である。", "がん保険の保険料は、介護医療保険料控除の対象となる。", "住民税の控除限度額の合計は7万円である。", "所得税の控除限度額の合計は15万円である。"], "a": 3, "e": "正解は「所得税の控除限度額の合計は15万円である。」です。\n【根拠】新契約の所得税の控除限度額は、3区分の合計で12万円です。\n【ひっかけ】旧契約（一般5万円・個人年金5万円）が絡む場合も、合計の上限は12万円です。"}, {"id": "mc:5d38ac74e1", "c": 2, "s": "問題2-3", "st": 2, "q": "生命保険と税金に関する次の記述のうち、最も不適切なものはどれか。", "o": ["保険期間5年以下の一時払養老保険の満期差益は、源泉分離課税の対象となる。", "契約者が受け取る解約返戻金は、一時所得となる。", "リビング・ニーズ特約の保険金は、一時所得となる。", "少額短期保険の保険料は、生命保険料控除の対象とならない。"], "a": 2, "e": "正解は「リビング・ニーズ特約の保険金は、一時所得となる。」です。\n【根拠】リビング・ニーズ特約の保険金は非課税です。\n【ひっかけ】入院給付金・手術給付金・高度障害保険金なども非課税です。"}, {"id": "mc:8f76b38595", "c": 2, "s": "問題2-3", "st": 2, "q": "保険金・給付金と課税関係の組合せとして、最も適切なものはどれか。", "o": ["被保険者の配偶者が受け取った入院給付金―一時所得", "高度障害保険金―非課税", "契約者＝受取人の満期保険金―贈与税", "団体信用生命保険の保険料―生命保険料控除"], "a": 1, "e": "正解は「高度障害保険金―非課税」です。\n【根拠】高度障害保険金は非課税です。\n【ひっかけ】配偶者が受け取る入院給付金も非課税、契約者＝受取人の満期保険金は一時所得、団信は控除対象外です。"}, {"id": "mc:eb8bc1a3a7", "c": 2, "s": "問題2-4", "st": 2, "q": "損害保険に関する次の記述のうち、最も適切なものはどれか。", "o": ["軽過失により隣家を焼失させた場合、失火責任法により隣家への損害賠償責任を負う。", "地震保険は、火災保険に付帯せずに単独で契約できる。", "自賠責保険は、対人賠償事故のみが補償の対象である。", "個人賠償責任保険は、業務遂行中の事故も補償の対象となる。"], "a": 2, "e": "正解は「自賠責保険は、対人賠償事故のみが補償の対象である。」です。\n【根拠】自賠責保険は対人賠償のみです。\n【ひっかけ】軽過失の失火は責任を負わず、地震保険は火災保険に付帯、業務中の事故は個人賠償責任保険の対象外です。"}, {"id": "mc:e0dd0bbfac", "c": 2, "s": "問題2-4", "st": 2, "q": "地震保険に関する次の記述のうち、最も不適切なものはどれか。", "o": ["保険金額は、火災保険の保険金額の30％〜50％の範囲内で設定する。", "保険金額の上限は、建物5,000万円、家財1,000万円である。", "地震による火災で建物が焼失した場合、火災保険から保険金が支払われる。", "所得税の地震保険料控除の限度額は5万円である。"], "a": 2, "e": "正解は「地震による火災で建物が焼失した場合、火災保険から保険金が支払われる。」です。\n【根拠】地震・噴火・津波を原因とする火災損害は、火災保険では補償されません。\n【ひっかけ】地震火災に備えるには地震保険（又は火災保険の地震火災費用保険金）が必要です。"}, {"id": "mc:b0b789bea6", "c": 2, "s": "問題2-4", "st": 2, "q": "火災保険の保険金額が3,000万円の建物に付帯する地震保険の保険金額の上限として、正しいものはどれか。", "o": ["900万円", "1,500万円", "3,000万円", "5,000万円"], "a": 1, "e": "正解は「1,500万円」です。\n【根拠】地震保険の保険金額は、火災保険の保険金額の30％〜50％の範囲（建物は5,000万円が上限）。3,000万円×50％＝1,500万円です。\n【ひっかけ】5,000万円は建物の地震保険の絶対的な上限です。"}, {"id": "mc:a085e6541e", "c": 2, "s": "問題2-4", "st": 2, "q": "地震保険の保険金額が1,000万円の建物が、地震により一部損と認定された場合に支払われる保険金として正しいものはどれか。", "o": ["10万円", "50万円", "300万円", "600万円"], "a": 1, "e": "正解は「50万円」です。\n【根拠】一部損は保険金額の5％。1,000万円×5％＝50万円です。\n【ひっかけ】小半損は30％、大半損は60％です。"}, {"id": "mc:0eb2715c78", "c": 2, "s": "問題2-4", "st": 2, "q": "事業活動に伴うリスクと保険の組合せとして、最も不適切なものはどれか。", "o": ["製造した製品の欠陥による事故の賠償責任―生産物賠償責任保険", "店舗の床が濡れていて客が転倒した事故の賠償責任―施設所有（管理）者賠償責任保険", "クリーニング店が客から預かった衣類を紛失した賠償責任―受託者賠償責任保険", "飲食店が提供した料理による客の食中毒の賠償責任―受託者賠償責任保険"], "a": 3, "e": "正解は「飲食店が提供した料理による客の食中毒の賠償責任―受託者賠償責任保険」です。\n【根拠】提供した料理による事故は、生産物賠償責任保険（PL保険）の対象です。\n【ひっかけ】受託者賠償責任保険は、他人から預かった物の損害が対象です。"}, {"id": "mc:8ee8207808", "c": 2, "s": "問題2-4", "st": 2, "q": "傷害保険に関する次の記述のうち、最も適切なものはどれか。", "o": ["普通傷害保険は、細菌性食中毒を補償する。", "国内旅行傷害保険は、地震によるけがを補償する。", "海外旅行傷害保険は、細菌性食中毒も地震によるけがも補償する。", "家族傷害保険では、別居の未婚の子は被保険者とならない。"], "a": 2, "e": "正解は「海外旅行傷害保険は、細菌性食中毒も地震によるけがも補償する。」です。\n【根拠】海外旅行傷害保険は、細菌性食中毒も地震・噴火・津波によるけがも補償します。\n【ひっかけ】普通傷害保険は食中毒を補償せず、国内旅行傷害保険は地震を補償せず、別居の未婚の子は家族傷害保険の対象です。"}, {"id": "mc:0389ee5baf", "c": 2, "s": "問題2-4", "st": 2, "q": "地震保険に関する次の記述のうち、最も適切なものはどれか。", "o": ["損害が一部損と認定された場合、保険金額の10％が支払われる。", "損害が小半損と認定された場合、保険金額の30％が支払われる。", "免震建築物割引と耐震等級割引は重複して適用できる。", "保険料は、保険会社ごとに異なる。"], "a": 1, "e": "正解は「損害が小半損と認定された場合、保険金額の30％が支払われる。」です。\n【根拠】小半損は30％です。全損100％、大半損60％、一部損5％です。\n【ひっかけ】割引は重複できず、保険料は所在地と構造で決まり、保険会社による差はありません。"}, {"id": "mc:0787424195", "c": 2, "s": "問題2-4", "st": 2, "q": "自動車保険に関する次の記述のうち、最も適切なものはどれか。", "o": ["人身傷害補償保険では、被保険者自身の過失部分は補償されない。", "搭乗者傷害保険は、実際の損害額を補償する実損払である。", "対人賠償保険金を受け取る事故が1件あると、翌年のノンフリート等級は3等級下がる。", "自賠責保険では、被害者が保険会社に直接請求することはできない。"], "a": 2, "e": "正解は「対人賠償保険金を受け取る事故が1件あると、翌年のノンフリート等級は3等級下がる。」です。\n【根拠】対人賠償事故は3等級ダウン事故です。\n【ひっかけ】人身傷害は過失に関係なく補償、搭乗者傷害は定額払、自賠責は被害者請求ができます。"}, {"id": "mc:36a27eb4f8", "c": 2, "s": "問題2-4", "st": 2, "q": "賠償責任保険などに関する次の記述のうち、最も不適切なものはどれか。", "o": ["個人賠償責任保険は、子の自転車事故による賠償責任も補償する。", "個人賠償責任保険は、友人から借りた物を壊した場合も補償する。", "店舗休業保険は、休業による喪失利益を補償する。", "労働災害総合保険は、政府の労災保険に上乗せして補償する。"], "a": 1, "e": "正解は「個人賠償責任保険は、友人から借りた物を壊した場合も補償する。」です。\n【根拠】借りた物・預かった物の損害は、原則として個人賠償責任保険の対象外です。\n【ひっかけ】受託者賠償責任保険や特約で補償します。"}, {"id": "mc:c6b63709dd", "c": 2, "s": "問題2-4", "st": 2, "q": "火災保険に関する次の記述のうち、最も適切なものはどれか。", "o": ["建物を対象とする火災保険では、家財の損害も補償される。", "隣家からのもらい火による損害は、隣家に必ず賠償を請求できる。", "1個の価額が30万円を超える貴金属は、明記物件として申告しなければ補償されない。", "地震による火災の損害は、火災保険の本体で全額補償される。"], "a": 2, "e": "正解は「1個の価額が30万円を超える貴金属は、明記物件として申告しなければ補償されない。」です。\n【根拠】30万円を超える貴金属・美術品などは、明記物件として申告が必要です。\n【ひっかけ】建物と家財は別、もらい火は原則として賠償を請求できず、地震火災は火災保険本体では補償されません。"}, {"id": "mc:67d9f4314c", "c": 2, "s": "問題2-4", "st": 2, "q": "傷害保険に関する次の記述のうち、最も適切なものはどれか。", "o": ["交通事故傷害保険は、エレベーターでの事故を補償しない。", "海外旅行傷害保険は、住居を出発してから帰着するまでの事故を補償する。", "普通傷害保険は、地震によるけがを補償する。", "国内旅行傷害保険は、細菌性食中毒を補償しない。"], "a": 1, "e": "正解は「海外旅行傷害保険は、住居を出発してから帰着するまでの事故を補償する。」です。\n【根拠】海外旅行傷害保険は、日本国内の移動中も補償します。\n【ひっかけ】交通事故傷害保険はエレベーター事故も対象、普通傷害保険は地震を補償せず、国内旅行傷害保険は細菌性食中毒を補償します。"}, {"id": "mc:e8ac6be6e6", "c": 2, "s": "問題2-4", "st": 2, "q": "自動車保険に関する次の記述のうち、最も不適切なものはどれか。", "o": ["自賠責保険は、運転者自身のけがは補償しない。", "対物賠償保険は、他人の財物への損害賠償を補償する。", "運転者の年齢条件を設けると、保険料は高くなる。", "車両保険のエコノミー型は、当て逃げを補償しない。"], "a": 2, "e": "正解は「運転者の年齢条件を設けると、保険料は高くなる。」です。\n【根拠】年齢条件を設けると補償範囲が狭くなるため、保険料は安くなります。\n【ひっかけ】運転者の範囲を限定した場合も同じです。"}, {"id": "mc:f5cb1d2ed7", "c": 2, "s": "問題2-4", "st": 2, "q": "自賠責保険の支払限度額（被害者1人あたり）の組合せとして、正しいものはどれか（死亡／傷害／常時介護を要する後遺障害）。", "o": ["3,000万円／120万円／4,000万円", "3,000万円／300万円／3,000万円", "4,000万円／120万円／3,000万円", "2,000万円／120万円／4,000万円"], "a": 0, "e": "正解は「3,000万円／120万円／4,000万円」です。\n【根拠】死亡3,000万円、傷害120万円、常時介護を要する後遺障害4,000万円です。\n【ひっかけ】数字の組合せを確実に覚えます。"}, {"id": "mc:0aecb0a0e2", "c": 2, "s": "問題2-4", "st": 2, "q": "損害保険に関する次の記述のうち、最も不適切なものはどれか。", "o": ["地震保険の保険期間は、最長5年である。", "車両保険のエコノミー型でも、盗難は補償される。", "個人賠償責任保険は、自動車事故による賠償責任も補償する。", "海外旅行傷害保険では、病気の治療費用も補償できる。"], "a": 2, "e": "正解は「個人賠償責任保険は、自動車事故による賠償責任も補償する。」です。\n【根拠】自動車事故は個人賠償責任保険の対象外です。\n【ひっかけ】業務中の事故も対象外です。"}, {"id": "mc:619a3b0cf4", "c": 2, "s": "問題2-5", "st": 2, "q": "法人を契約者とする生命保険の経理処理に関する次の記述のうち、最も適切なものはどれか。", "o": ["終身保険（受取人：法人）の支払保険料は、全額を損金に算入する。", "最高解約返戻率が50％以下の定期保険（受取人：法人）の支払保険料は、原則として全額を損金に算入する。", "福利厚生プランの養老保険の支払保険料は、全額を資産に計上する。", "法人が受け取った死亡保険金は、益金に算入しない。"], "a": 1, "e": "正解は「最高解約返戻率が50％以下の定期保険（受取人：法人）の支払保険料は、原則として全額を損金に算入する。」です。\n【根拠】最高解約返戻率50％以下の定期保険・第三分野保険は、原則として全額損金です。\n【ひっかけ】終身保険は資産計上、福利厚生プランは2分の1損金、受け取った保険金は益金（資産計上額との差額は雑収入など）です。"}, {"id": "mc:44cbfad485", "c": 2, "s": "問題2-5", "st": 2, "q": "法人が契約者で、役員・従業員全員を被保険者とする福利厚生プランの養老保険（満期保険金受取人は法人、死亡保険金受取人は被保険者の遺族）の年間保険料が100万円の場合の経理処理として、正しいものはどれか。", "o": ["全額を保険料（損金）とする。", "全額を保険料積立金（資産）とする。", "50万円を保険料（損金）、50万円を保険料積立金（資産）とする。", "40万円を保険料積立金（資産）、60万円を保険料（損金）とする。"], "a": 2, "e": "正解は「50万円を保険料（損金）、50万円を保険料積立金（資産）とする。」です。\n【根拠】福利厚生プランは、2分の1を損金、2分の1を資産に計上します。\n【ひっかけ】40％資産計上は、最高解約返戻率50％超70％以下の定期保険の処理です。"}, {"id": "mc:f0c50a9264", "c": 2, "s": "問題2-5", "st": 2, "q": "法人が契約者・死亡保険金受取人、役員が被保険者である定期保険（最高解約返戻率75％）の年間保険料100万円について、保険期間の当初4割期間に資産計上する金額として正しいものはどれか。", "o": ["0円", "40万円", "60万円", "100万円"], "a": 2, "e": "正解は「60万円」です。\n【根拠】最高解約返戻率70％超85％以下は、当初4割期間に支払保険料の60％を資産計上します。100万円×60％＝60万円です。\n【ひっかけ】50％超70％以下なら40％（40万円）、50％以下なら全額損金（0円）です。"}, {"id": "mc:0d537bbf95", "c": 2, "s": "問題2-5", "st": 2, "q": "個人事業主の保険料の取扱いに関する次の記述のうち、最も適切なものはどれか。", "o": ["事業主本人を被保険者とする生命保険料は、必要経費に算入できる。", "従業員を被保険者とし、遺族を受取人とする定期保険の保険料は、必要経費に算入できる。", "店舗兼住宅の火災保険料は、全額を必要経費に算入できる。", "事業主本人の医療保険料は、必要経費に算入できる。"], "a": 1, "e": "正解は「従業員を被保険者とし、遺族を受取人とする定期保険の保険料は、必要経費に算入できる。」です。\n【根拠】従業員の福利厚生のための保険料は必要経費です。\n【ひっかけ】事業主本人の保険料は生命保険料控除の対象、店舗兼住宅は店舗部分のみが必要経費です。"}, {"id": "mc:3f907134ae", "c": 2, "s": "問題2-5", "st": 2, "q": "医療保障に関する次の記述のうち、最も適切なものはどれか。", "o": ["がん保険の入院給付金には、通常、支払日数の限度がない。", "先進医療の技術料は、公的医療保険の対象となる。", "2012年以後に契約した医療保険の保険料は、一般の生命保険料控除の対象となる。", "医療保険の入院給付金を被保険者本人が受け取ると、一時所得となる。"], "a": 0, "e": "正解は「がん保険の入院給付金には、通常、支払日数の限度がない。」です。\n【根拠】がん保険の入院給付金は、支払日数無制限が一般的です。\n【ひっかけ】先進医療の技術料は全額自己負担、医療保険料は介護医療保険料控除、入院給付金は非課税です。"}, {"id": "mc:84e33632f2", "c": 3, "s": "問題3-1", "st": 2, "q": "経済指標とその公表機関の組合せとして、最も不適切なものはどれか。", "o": ["国内総生産（GDP）―内閣府", "景気動向指数―内閣府", "消費者物価指数―日本銀行", "全国企業短期経済観測調査―日本銀行"], "a": 2, "e": "正解は「消費者物価指数―日本銀行」です。\n【根拠】消費者物価指数は総務省が公表します。\n【ひっかけ】日本銀行が公表するのは、日銀短観、企業物価指数、マネーストック統計などです。"}, {"id": "mc:506cab0be5", "c": 3, "s": "問題3-1", "st": 2, "q": "景気動向指数の採用系列とその区分の組合せとして、最も適切なものはどれか。", "o": ["新規求人数（除学卒）―一致系列", "有効求人倍率（除学卒）―先行系列", "完全失業率―遅行系列", "東証株価指数―遅行系列"], "a": 2, "e": "正解は「完全失業率―遅行系列」です。\n【根拠】完全失業率は遅行系列です。\n【ひっかけ】新規求人数・東証株価指数は先行系列、有効求人倍率は一致系列です。"}, {"id": "mc:c466ddec9a", "c": 3, "s": "問題3-1", "st": 2, "q": "金利・為替の一般的な関係に関する次の記述のうち、最も不適切なものはどれか。", "o": ["日本の金利の上昇は、円高の要因となる。", "円高は、輸入物価の下落要因となる。", "物価の上昇は、金利の低下要因となる。", "日本の貿易黒字の拡大は、円高の要因となる。"], "a": 2, "e": "正解は「物価の上昇は、金利の低下要因となる。」です。\n【根拠】物価の上昇は、一般に金利の上昇要因です。\n【ひっかけ】景気拡大も金利の上昇要因です。"}, {"id": "mc:bd2bcc3420", "c": 3, "s": "問題3-1", "st": 2, "q": "金融政策・経済指標に関する次の記述のうち、最も適切なものはどれか。", "o": ["GDPは日本銀行が公表する。", "売りオペレーションは、市中の資金量を増やす。", "日銀短観の業況判断DIは、「良い」の割合から「悪い」の割合を差し引いて求める。", "預金準備率の引上げは、金融緩和策である。"], "a": 2, "e": "正解は「日銀短観の業況判断DIは、「良い」の割合から「悪い」の割合を差し引いて求める。」です。\n【根拠】業況判断DIは「良い」－「悪い」で求めます。\n【ひっかけ】GDPは内閣府、売りオペは資金吸収、預金準備率の引上げは金融引締めです。"}, {"id": "mc:b74fc2db10", "c": 3, "s": "問題3-2", "st": 2, "q": "表面利率0.8％、残存期間5年の固定利付債券を、額面100円あたり101円で購入した場合の最終利回り（単利・年率）として、最も適切なものはどれか（小数点以下第3位四捨五入）。", "o": ["0.59％", "0.60％", "0.79％", "0.99％"], "a": 0, "e": "正解は「0.59％」です。\n【根拠】（0.8＋（100－101）÷5）÷101×100＝0.6÷101×100≒0.594…≒0.59％です。\n【ひっかけ】額面（100円）で割ると0.60％になってしまいます。分母は購入価格です。"}, {"id": "mc:2b43f08e00", "c": 3, "s": "問題3-2", "st": 2, "q": "表面利率1.5％、残存期間4年の固定利付債券を、額面100円あたり98円で購入した場合の最終利回り（単利・年率）として、正しいものはどれか（小数点以下第3位四捨五入）。", "o": ["1.53％", "1.96％", "2.00％", "2.04％"], "a": 3, "e": "正解は「2.04％」です。\n【根拠】（1.5＋（100－98）÷4）÷98×100＝2.0÷98×100≒2.04％です。\n【ひっかけ】額面で割ると2.00％になります。"}, {"id": "mc:3f5b087d59", "c": 3, "s": "問題3-2", "st": 2, "q": "表面利率1.0％、償還期限5年の新発債を、発行価格99円で購入した場合の応募者利回り（単利・年率）として、正しいものはどれか（小数点以下第3位四捨五入）。", "o": ["0.99％", "1.01％", "1.20％", "1.21％"], "a": 3, "e": "正解は「1.21％」です。\n【根拠】（1.0＋（100－99）÷5）÷99×100＝1.2÷99×100≒1.21％です。\n【ひっかけ】額面で割ると1.20％になります。"}, {"id": "mc:cba66a8282", "c": 3, "s": "問題3-2", "st": 2, "q": "表面利率1.2％の固定利付債券を、額面100円あたり96円で購入した場合の直接利回りとして、正しいものはどれか（小数点以下第3位四捨五入）。", "o": ["1.15％", "1.20％", "1.25％", "5.21％"], "a": 2, "e": "正解は「1.25％」です。\n【根拠】直接利回り＝1.2÷96×100＝1.25％です。\n【ひっかけ】額面で割ると1.20％になります。直接利回りに償還差益は含めません。"}, {"id": "mc:c1a9ca5fef", "c": 3, "s": "問題3-2", "st": 2, "q": "100万円を年利2％・半年複利で1年間預け入れた場合の元利合計額として、正しいものはどれか（税金は考慮しない）。", "o": ["1,020,000円", "1,020,100円", "1,040,000円", "1,040,400円"], "a": 1, "e": "正解は「1,020,100円」です。\n【根拠】半年複利では半年ごとに1％ずつ利息が付きます。100万円×1.01×1.01＝1,020,100円です。\n【ひっかけ】単利なら1,020,000円です。1％と2％の取り違えにも注意します。"}, {"id": "mc:29a1b897d9", "c": 3, "s": "問題3-2", "st": 2, "q": "預貯金に関する次の記述のうち、最も適切なものはどれか。", "o": ["スーパー定期預金は、預入金額にかかわらず半年複利である。", "大口定期預金は、預入金額300万円以上の定期預金である。", "期日指定定期預金は、1年複利で利息が計算される。", "貯蓄預金は、公共料金の自動引落し口座にできる。"], "a": 2, "e": "正解は「期日指定定期預金は、1年複利で利息が計算される。」です。\n【根拠】期日指定定期預金は1年複利です。\n【ひっかけ】スーパー定期は300万円未満が単利、大口定期は1,000万円以上、貯蓄預金は引落しに使えません。"}, {"id": "mc:35b1ceabd7", "c": 3, "s": "問題3-2", "st": 2, "q": "表面利率2.0％、購入価格101円の債券を2年間保有し、103円で売却した場合の所有期間利回り（単利・年率）として、正しいものはどれか（小数点以下第3位四捨五入）。", "o": ["1.98％", "2.94％", "2.97％", "3.96％"], "a": 2, "e": "正解は「2.97％」です。\n【根拠】（2.0＋（103－101）÷2）÷101×100＝3.0÷101×100≒2.97％です。\n【ひっかけ】売買差益を2年で割り忘れると3.96％、売却価格で割ると2.91％になります。"}, {"id": "mc:861f0a32ff", "c": 3, "s": "問題3-2", "st": 2, "q": "債券に関する次の記述のうち、最も適切なものはどれか。", "o": ["オーバーパーで購入し償還まで保有すると、償還差益が生じる。", "表面利率が高い債券ほど、金利変動による価格変動が大きい。", "BB格の債券は、投資適格債に該当する。", "個人向け国債は、発行から1年経過すれば中途換金できる。"], "a": 3, "e": "正解は「個人向け国債は、発行から1年経過すれば中途換金できる。」です。\n【根拠】個人向け国債は、発行から1年経過すれば中途換金できます。\n【ひっかけ】オーバーパーは償還差損、表面利率が低いほど価格変動が大きく、BB格は投機的格付です。"}, {"id": "mc:e6f3fb8799", "c": 3, "s": "問題3-3", "st": 2, "q": "次のデータに基づくA社のPBRとして、正しいものはどれか。株価：2,400円、1株当たり純利益：160円、1株当たり純資産：1,600円、1株当たり年間配当金：48円。", "o": ["1.5倍", "15倍", "2.0％", "10％"], "a": 0, "e": "正解は「1.5倍」です。\n【根拠】PBR＝株価÷1株当たり純資産＝2,400÷1,600＝1.5倍です。\n【ひっかけ】PERは2,400÷160＝15倍、配当利回りは48÷2,400＝2.0％、ROEは160÷1,600＝10％です。"}, {"id": "mc:7f582bc0dd", "c": 3, "s": "問題3-3", "st": 2, "q": "株価が2,000円、1株当たり純利益が100円、1株当たり純資産が1,000円の株式のPERとPBRの組合せとして、正しいものはどれか。", "o": ["PER20倍・PBR2倍", "PER2倍・PBR20倍", "PER10倍・PBR2倍", "PER20倍・PBR10倍"], "a": 0, "e": "正解は「PER20倍・PBR2倍」です。\n【根拠】PER＝2,000÷100＝20倍、PBR＝2,000÷1,000＝2倍です。\n【ひっかけ】ROE＝100÷1,000＝10％です。"}, {"id": "mc:bfcb8e58a9", "c": 3, "s": "問題3-3", "st": 2, "q": "信用取引に関する次の記述のうち、最も適切なものはどれか。", "o": ["委託保証金は、約定代金の20％以上かつ20万円以上が必要である。", "制度信用取引の返済期限は、最長6か月である。", "一般信用取引の対象銘柄は、取引所が選定する。", "信用取引では、売りから取引を始めることはできない。"], "a": 1, "e": "正解は「制度信用取引の返済期限は、最長6か月である。」です。\n【根拠】制度信用取引の返済期限は最長6か月です。\n【ひっかけ】保証金は30％以上かつ30万円以上、一般信用取引の銘柄は証券会社が決め、信用取引では売りから始められます（空売り）。"}, {"id": "mc:8534a05bb5", "c": 3, "s": "問題3-3", "st": 2, "q": "株式の取引に関する次の記述のうち、最も不適切なものはどれか。", "o": ["成行注文は、指値注文に優先して売買が成立する。", "上場株式の普通取引の受渡しは、約定日から3営業日目である。", "配当を受け取るには、権利確定日の当日に株式を購入すればよい。", "株式分割が行われると、理論上の株価は分割比率に応じて下がる。"], "a": 2, "e": "正解は「配当を受け取るには、権利確定日の当日に株式を購入すればよい。」です。\n【根拠】受渡しに3営業日かかるため、権利確定日の2営業日前（権利付最終日）までに購入する必要があります。\n【ひっかけ】権利付最終日の翌営業日は権利落ち日です。"}, {"id": "mc:790e699a92", "c": 3, "s": "問題3-3", "st": 2, "q": "A社の株価が1,500円、当期純利益が30億円、発行済株式数が1億株、年間配当金総額が12億円のとき、A社の配当性向として正しいものはどれか。", "o": ["0.8％", "20％", "40％", "50％"], "a": 2, "e": "正解は「40％」です。\n【根拠】配当性向＝配当金総額÷当期純利益×100＝12億÷30億×100＝40％です。\n【ひっかけ】1株当たり配当金は12円、配当利回りは12÷1,500＝0.8％、PERは1,500÷30＝50倍です。"}, {"id": "mc:7f87c54a22", "c": 3, "s": "問題3-3", "st": 2, "q": "株式の投資指標に関する次の記述のうち、最も不適切なものはどれか。", "o": ["PERは、株価を1株当たり純利益で除して求める。", "PBRが1倍を上回る株式は、株価が1株当たり純資産を下回っている。", "ROEは、当期純利益を自己資本で除して求める。", "配当利回りは、1株当たり配当金を株価で除して求める。"], "a": 1, "e": "正解は「PBRが1倍を上回る株式は、株価が1株当たり純資産を下回っている。」です。\n【根拠】PBRが1倍を上回っていれば、株価は1株当たり純資産を上回っています。\n【ひっかけ】1倍を下回ると、株価が解散価値を下回っているとされます。"}, {"id": "mc:7b3a25c942", "c": 3, "s": "問題3-4", "st": 2, "q": "NISAに関する次の記述のうち、最も不適切なものはどれか。", "o": ["つみたて投資枠と成長投資枠は、同一年中に併用できる。", "非課税保有限度額は1,800万円で、そのうち成長投資枠は1,200万円までである。", "口座を開設できるのは、日本に住む20歳以上の者である。", "NISA口座で生じた損失は、他の口座の利益と損益通算できない。"], "a": 2, "e": "正解は「口座を開設できるのは、日本に住む20歳以上の者である。」です。\n【根拠】NISA口座は、日本に住む18歳以上の者が開設できます。\n【ひっかけ】成年年齢の引下げにあわせて18歳以上となっています。"}, {"id": "mc:3ce4214c5b", "c": 3, "s": "問題3-4", "st": 2, "q": "NISAに関する次の記述のうち、最も不適切なものはどれか。", "o": ["つみたて投資枠と成長投資枠を合わせた年間投資上限額は360万円である。", "非課税保有限度額は1,800万円である。", "成長投資枠の非課税保有限度額は1,200万円である。", "売却した年に、その簿価分の年間投資枠が復活する。"], "a": 3, "e": "正解は「売却した年に、その簿価分の年間投資枠が復活する。」です。\n【根拠】売却で復活するのは非課税保有限度額で、翌年以降に復活します。\n【ひっかけ】年間投資枠（360万円）は復活しません。"}, {"id": "mc:a49de5aab6", "c": 3, "s": "問題3-4", "st": 2, "q": "投資信託に関する次の記述のうち、最も適切なものはどれか。", "o": ["信託報酬は、購入時に一度だけ支払う費用である。", "元本払戻金（特別分配金）は、配当所得として課税される。", "ドル・コスト平均法は、定額で継続購入することで平均購入単価を抑える効果が期待できる。", "パッシブ運用は、ベンチマークを上回る運用成果をめざす。"], "a": 2, "e": "正解は「ドル・コスト平均法は、定額で継続購入することで平均購入単価を抑える効果が期待できる。」です。\n【根拠】定額で買うと、安いときに多くの口数を買えるため平均購入単価が下がりやすくなります。\n【ひっかけ】信託報酬は保有期間中に差し引かれ、元本払戻金は非課税、ベンチマークを上回ることをめざすのはアクティブ運用です。"}, {"id": "mc:4af279fd0f", "c": 3, "s": "問題3-4", "st": 2, "q": "投資信託に関する次の記述のうち、最も適切なものはどれか。", "o": ["委託者指図型投資信託の信託財産を保管・管理するのは、販売会社である。", "公社債投資信託には、株式を組み入れることができる。", "ブラインド方式では、申込時点で適用される基準価額がわからない。", "ノーロード・ファンドには、信託報酬がかからない。"], "a": 2, "e": "正解は「ブラインド方式では、申込時点で適用される基準価額がわからない。」です。\n【根拠】公正な取引のため、申込時点では基準価額がわからない方式がとられています。\n【ひっかけ】保管・管理は受託会社、公社債投信は株式を組み入れられず、ノーロードでも信託報酬はかかります。"}, {"id": "mc:d244638891", "c": 3, "s": "問題3-4", "st": 2, "q": "NISAに関する次の記述のうち、最も適切なものはどれか。", "o": ["使わなかった年間投資枠は、翌年に繰り越せる。", "成長投資枠で、毎月分配型の投資信託を購入できる。", "非課税保有期間は無期限である。", "上場株式の配当金は、受取方法にかかわらず非課税となる。"], "a": 2, "e": "正解は「非課税保有期間は無期限である。」です。\n【根拠】非課税保有期間は無期限です。\n【ひっかけ】年間投資枠は繰り越せず、毎月分配型は成長投資枠の対象外、配当金は株式数比例配分方式でなければ課税されます。"}, {"id": "mc:c9b82ceec1", "c": 3, "s": "問題3-4", "st": 2, "q": "基準価額10,500円のときに購入した追加型株式投資信託（個別元本10,500円）が、決算で1,000円の分配を行い、分配後の基準価額が10,200円となった。分配金の内訳として正しいものはどれか。", "o": ["普通分配金1,000円", "普通分配金700円・元本払戻金300円", "普通分配金300円・元本払戻金700円", "元本払戻金1,000円"], "a": 1, "e": "正解は「普通分配金700円・元本払戻金300円」です。\n【根拠】分配後の基準価額10,200円は、個別元本10,500円を300円下回ります。この300円が元本払戻金（非課税）で、残りの700円が普通分配金です。\n【ひっかけ】分配後の基準価額と個別元本の差が元本払戻金です。分配後の個別元本は10,200円になります。"}, {"id": "mc:aa364eb90b", "c": 3, "s": "問題3-5", "st": 2, "q": "A資産の期待収益率が3％、B資産の期待収益率が7％のとき、A資産を60％、B資産を40％組み入れたポートフォリオの期待収益率として、正しいものはどれか。", "o": ["4.2％", "4.6％", "5.0％", "5.4％"], "a": 1, "e": "正解は「4.6％」です。\n【根拠】3％×0.6＋7％×0.4＝1.8％＋2.8％＝4.6％です。\n【ひっかけ】期待収益率は組入比率による加重平均です（リスクは単純な加重平均になりません）。"}, {"id": "mc:1a5fa364a3", "c": 3, "s": "問題3-5", "st": 2, "q": "期待収益率5％の資産Aに70％、期待収益率2％の資産Bに30％投資したポートフォリオの期待収益率として、正しいものはどれか。", "o": ["3.5％", "3.8％", "4.1％", "7.0％"], "a": 2, "e": "正解は「4.1％」です。\n【根拠】5％×0.7＋2％×0.3＝3.5％＋0.6％＝4.1％です。\n【ひっかけ】単純平均すると3.5％になります。"}, {"id": "mc:9cea28a0cc", "c": 3, "s": "問題3-5", "st": 2, "q": "TTS150円、TTM149円、TTB148円のときに、1万米ドルの外貨預金をするために必要な円の金額として正しいものはどれか（その他の手数料は考慮しない）。", "o": ["148万円", "149万円", "150万円", "151万円"], "a": 2, "e": "正解は「150万円」です。\n【根拠】円を外貨に換えるときはTTSを使います。1万ドル×150円＝150万円です。\n【ひっかけ】外貨を円に戻すときはTTBです。"}, {"id": "mc:8e4995214e", "c": 3, "s": "問題3-5", "st": 2, "q": "米ドル建て定期預金1万ドル（預入時TTS151円、TTM150円、TTB149円）が、1年後に利率2％で満期を迎えた。満期時のTTSが152円、TTMが151円、TTBが150円のとき、円換算した元利金額として正しいものはどれか（税金は考慮しない）。", "o": ["1,520,000円", "1,530,000円", "1,540,200円", "1,550,400円"], "a": 1, "e": "正解は「1,530,000円」です。\n【根拠】元利金は10,000ドル×1.02＝10,200ドル。外貨を円に換えるのでTTB150円を使い、10,200×150＝1,530,000円です。\n【ひっかけ】TTMを使うと1,540,200円、TTSを使うと1,550,400円になります。"}, {"id": "mc:931fec68e4", "c": 3, "s": "問題3-5", "st": 2, "q": "リスクに関する次の記述のうち、最も不適切なものはどれか。", "o": ["相関係数が－1の2資産を組み合わせると、リスク低減効果は最大となる。", "アンシステマティック・リスクは、分散投資により低減できる。", "システマティック・リスクは、分散投資により消去できる。", "標準偏差が大きいほど、リターンのばらつきが大きい。"], "a": 2, "e": "正解は「システマティック・リスクは、分散投資により消去できる。」です。\n【根拠】システマティック・リスク（市場リスク）は、分散投資をしても消せません。\n【ひっかけ】分散投資で減らせるのは、個別銘柄に固有のリスクです。"}, {"id": "mc:6bcfbc390d", "c": 3, "s": "問題3-5", "st": 2, "q": "外国債券に関する次の記述のうち、最も適切なものはどれか。", "o": ["サムライ債は、外国の発行体が日本国内で発行する外貨建ての債券である。", "ショーグン債は、外国の発行体が日本国内で発行する円建ての債券である。", "デュアルカレンシー債は、払込みと利払いが円、償還が外貨で行われる。", "リバース・デュアルカレンシー債は、利払いが円、償還が外貨で行われる。"], "a": 2, "e": "正解は「デュアルカレンシー債は、払込みと利払いが円、償還が外貨で行われる。」です。\n【根拠】デュアルカレンシー債は、払込み・利払いが円、償還が外貨です。\n【ひっかけ】サムライ債は円建て、ショーグン債は外貨建て、リバースは利払いが外貨です。"}, {"id": "mc:619d2c8fba", "c": 3, "s": "問題3-5", "st": 2, "q": "デリバティブ取引に関する次の記述のうち、最も不適切なものはどれか。", "o": ["コール・オプションの買い手は、原資産価格が上昇すると利益を得る。", "ヨーロピアンタイプのオプションは、満期日にのみ権利を行使できる。", "保有株式の値下がりに備えて株価指数先物を買うことを、売りヘッジという。", "金利スワップでは、通常、元本の交換は行われない。"], "a": 2, "e": "正解は「保有株式の値下がりに備えて株価指数先物を買うことを、売りヘッジという。」です。\n【根拠】値下がりに備えて先物を売ることが売りヘッジです。\n【ひっかけ】先物を買うのは買いヘッジで、将来購入する予定の資産の値上がりに備えます。"}, {"id": "mc:36b942861a", "c": 3, "s": "問題3-5", "st": 2, "q": "ポートフォリオ理論に関する次の記述のうち、最も適切なものはどれか。", "o": ["ポートフォリオのリスクは、各資産のリスクの加重平均に必ず等しい。", "相関係数が＋1の資産を組み合わせると、リスク低減効果は最大になる。", "期待収益率は、各資産の期待収益率を組入比率で加重平均して求める。", "標準偏差が小さいほど、リスクが高い。"], "a": 2, "e": "正解は「期待収益率は、各資産の期待収益率を組入比率で加重平均して求める。」です。\n【根拠】期待収益率は加重平均で求めます。\n【ひっかけ】リスクは相関係数が1未満なら加重平均より小さくなり、低減効果が最大なのは－1、標準偏差が大きいほどリスクが高いです。"}, {"id": "mc:8c81038c89", "c": 3, "s": "問題3-5", "st": 2, "q": "ポートフォリオAの収益率が8％、標準偏差が10％、ポートフォリオBの収益率が6％、標準偏差が5％、無リスク資産利子率が1％のとき、シャープ・レシオの組合せとして正しいものはどれか。", "o": ["A：0.7／B：1.0", "A：0.8／B：1.2", "A：0.7／B：1.2", "A：1.0／B：1.0"], "a": 0, "e": "正解は「A：0.7／B：1.0」です。\n【根拠】A＝（8－1）÷10＝0.7、B＝（6－1）÷5＝1.0です。Bのほうが効率的な運用といえます。\n【ひっかけ】無リスク資産利子率を引き忘れると、A0.8・B1.2になります。"}, {"id": "mc:e66deda6ab", "c": 3, "s": "問題3-5", "st": 2, "q": "外貨預金と為替に関する次の記述のうち、最も適切なものはどれか。", "o": ["預入時より円高で払い戻すと、為替差益が生じる。", "外貨預金は、預金保険制度で保護される。", "外貨預金の利子は、源泉分離課税である。", "為替予約のない外貨預金の為替差益は、非課税である。"], "a": 2, "e": "正解は「外貨預金の利子は、源泉分離課税である。」です。\n【根拠】外貨預金の利子は20.315％の源泉分離課税です。\n【ひっかけ】円高は為替差損、外貨預金は預金保険の対象外、為替差益は雑所得です。"}, {"id": "mc:1bca0a7b42", "c": 3, "s": "問題3-6", "st": 2, "q": "預金保険制度の保護の対象となるものとして、最も適切なものはどれか。", "o": ["外貨預金", "譲渡性預金", "円建ての定期預金", "銀行で購入した投資信託"], "a": 2, "e": "正解は「円建ての定期預金」です。\n【根拠】円建ての定期預金は、元本1,000万円までとその利息等が保護されます。\n【ひっかけ】外貨預金・譲渡性預金は対象外、投資信託は預金ではないため対象外です。"}, {"id": "mc:80fa1067ed", "c": 3, "s": "問題3-6", "st": 2, "q": "A銀行に、決済用預金500万円、普通預金800万円、定期預金400万円を預けている個人が、A銀行の破綻時に預金保険制度で保護される元本の上限として正しいものはどれか。", "o": ["1,000万円", "1,300万円", "1,500万円", "1,700万円"], "a": 2, "e": "正解は「1,500万円」です。\n【根拠】決済用預金500万円は全額保護。普通預金と定期預金は合わせて元本1,000万円まで。合計1,500万円（とその利息等）です。\n【ひっかけ】すべてを合算して1,000万円とする誤りに注意します。"}, {"id": "mc:1742302d95", "c": 3, "s": "問題3-6", "st": 2, "q": "預金保険制度の対象となるものとして、最も適切なものはどれか。", "o": ["国内銀行の海外支店の円預金", "外国銀行の在日支店の預金", "ゆうちょ銀行の定期貯金", "国内銀行の外貨預金"], "a": 2, "e": "正解は「ゆうちょ銀行の定期貯金」です。\n【根拠】ゆうちょ銀行の貯金は対象です。\n【ひっかけ】海外支店・外国銀行の在日支店・外貨預金は対象外です。"}, {"id": "mc:922305cd46", "c": 3, "s": "問題3-6", "st": 2, "q": "金融商品の取引に関する法律の記述として、最も不適切なものはどれか。", "o": ["金融サービス提供法は、断定的判断の提供を禁止している。", "消費者契約法の取消権は、追認できる時から1年で時効により消滅する。", "金融商品取引法の適合性の原則は、特定投資家にも全面的に適用される。", "消費者契約法は、法人を保護の対象としていない。"], "a": 2, "e": "正解は「金融商品取引法の適合性の原則は、特定投資家にも全面的に適用される。」です。\n【根拠】特定投資家（プロ）との取引では、適合性の原則など一部の行為規制が適用されません。\n【ひっかけ】一般投資家との取引で特に重要な規制です。"}, {"id": "mc:bd4672ae74", "c": 3, "s": "問題3-6", "st": 2, "q": "セーフティネットと法律に関する次の記述のうち、最も適切なものはどれか。", "o": ["当座預金は、元本1,000万円まで保護される。", "日本投資者保護基金の補償の上限は、1人あたり1,000万円である。", "金融サービス提供法は、法人顧客を保護の対象としていない。", "消費者契約法は、法人も保護の対象とする。"], "a": 1, "e": "正解は「日本投資者保護基金の補償の上限は、1人あたり1,000万円である。」です。\n【根拠】日本投資者保護基金の補償は1人1,000万円までです。\n【ひっかけ】当座預金は全額保護、金融サービス提供法は法人も対象、消費者契約法は個人のみです。"}, {"id": "mc:adef68e018", "c": 3, "s": "問題3-7", "st": 2, "q": "金融商品の課税に関する次の記述のうち、最も適切なものはどれか。", "o": ["預貯金の利子は、申告分離課税の対象である。", "外貨建MMFの為替差益は非課税である。", "上場株式等の配当は、申告不要を選択できる（大口株主等を除く）。", "外貨預金の為替差益は、為替予約がない場合も源泉分離課税である。"], "a": 2, "e": "正解は「上場株式等の配当は、申告不要を選択できる（大口株主等を除く）。」です。\n【根拠】上場株式等の配当は、総合課税・申告分離課税・申告不要から選べます。\n【ひっかけ】預貯金の利子は源泉分離課税、外貨建MMFの為替差益は申告分離課税、予約なしの外貨預金の為替差益は雑所得です。"}, {"id": "mc:4d847c6a10", "c": 3, "s": "問題3-7", "st": 2, "q": "上場株式の譲渡損失との損益通算に関する次の記述のうち、最も不適切なものはどれか。", "o": ["申告分離課税を選択した上場株式等の配当と損益通算できる。", "特定公社債の利子と損益通算できる。", "総合課税を選択した上場株式の配当と損益通算できる。", "控除しきれない損失は、確定申告により翌年以後3年間繰り越せる。"], "a": 2, "e": "正解は「総合課税を選択した上場株式の配当と損益通算できる。」です。\n【根拠】総合課税を選択した配当とは損益通算できません。\n【ひっかけ】損益通算するには、配当について申告分離課税を選択します。"}, {"id": "mc:bb84b4f926", "c": 3, "s": "問題3-7", "st": 2, "q": "上場株式の配当に関する次の記述のうち、最も適切なものはどれか。", "o": ["申告分離課税を選択すると、配当控除の適用を受けられる。", "大口株主等が受ける配当も、申告分離課税を選択できる。", "総合課税を選択すると、配当控除の適用を受けられる。", "申告不要を選択すると、上場株式の譲渡損失と損益通算できる。"], "a": 2, "e": "正解は「総合課税を選択すると、配当控除の適用を受けられる。」です。\n【根拠】配当控除は総合課税を選択した場合だけ受けられます。\n【ひっかけ】大口株主等は総合課税、損益通算には申告分離課税での申告が必要です。"}, {"id": "mc:e7cc5e4521", "c": 3, "s": "問題3-7", "st": 2, "q": "投資信託の分配金の課税に関する次の記述のうち、最も適切なものはどれか。", "o": ["公社債投資信託の分配金は、配当所得となる。", "株式投資信託の普通分配金は、配当所得となる。", "株式投資信託の元本払戻金は、配当所得となる。", "J-REITの分配金は、配当控除の対象となる。"], "a": 1, "e": "正解は「株式投資信託の普通分配金は、配当所得となる。」です。\n【根拠】株式投資信託の普通分配金は配当所得です。\n【ひっかけ】公社債投信は利子所得、元本払戻金は非課税、J-REITは配当控除の対象外です。"}, {"id": "mc:e5c514bbdc", "c": 3, "s": "問題3-7", "st": 2, "q": "上場株式等の課税に関する次の記述のうち、最も不適切なものはどれか。", "o": ["上場株式の譲渡益の税率は、20.315％である。", "譲渡損失の繰越控除には、翌年以後も連続して確定申告が必要である。", "総合課税を選択した配当は、譲渡損失と損益通算できる。", "特定口座（源泉徴収あり）では、原則として確定申告は不要である。"], "a": 2, "e": "正解は「総合課税を選択した配当は、譲渡損失と損益通算できる。」です。\n【根拠】譲渡損失と損益通算できるのは、申告分離課税を選択した配当です。\n【ひっかけ】配当控除と損益通算は、どちらか一方しか選べません。"}, {"id": "mc:e8b6e4f6b1", "c": 4, "s": "問題4-1", "st": 2, "q": "課税総所得金額が500万円の者の所得税額（復興特別所得税を除く）として、正しいものはどれか。速算表：330万円超695万円以下は税率20％、控除額427,500円。", "o": ["427,500円", "572,500円", "1,000,000円", "1,427,500円"], "a": 1, "e": "正解は「572,500円」です。\n【根拠】500万円×20％－427,500円＝572,500円です。\n【ひっかけ】控除額を差し引き忘れると100万円になります。"}, {"id": "mc:648e7643cd", "c": 4, "s": "問題4-1", "st": 2, "q": "所得税の納税義務者に関する次の記述のうち、最も適切なものはどれか。", "o": ["居住者は、国内源泉所得だけに課税される。", "非居住者は、国内外のすべての所得に課税される。", "非永住者は、居住者に含まれる。", "国内に1年以上居所を有する個人でも、住所がなければ非居住者である。"], "a": 2, "e": "正解は「非永住者は、居住者に含まれる。」です。\n【根拠】非永住者は居住者の一類型です。\n【ひっかけ】居住者はすべての所得、非居住者は国内源泉所得だけに課税されます。1年以上居所があれば居住者です。"}, {"id": "mc:dfe34645e7", "c": 4, "s": "問題4-1", "st": 2, "q": "所得税が非課税となるものとして、最も適切なものはどれか。", "o": ["老齢基礎年金", "雇用保険の基本手当", "生命保険の満期保険金（契約者＝受取人）", "個人年金保険の年金"], "a": 1, "e": "正解は「雇用保険の基本手当」です。\n【根拠】雇用保険の失業等給付は非課税です。\n【ひっかけ】老齢年金は雑所得、満期保険金は一時所得、個人年金は雑所得です。"}, {"id": "mc:fdd8893200", "c": 4, "s": "問題4-2", "st": 2, "q": "勤続年数30年4か月で退職し、退職金3,000万円を受け取った場合の退職所得の金額として、正しいものはどれか（障害者となったことによる退職ではない）。", "o": ["715万円", "750万円", "1,430万円", "1,500万円"], "a": 0, "e": "正解は「715万円」です。\n【根拠】勤続年数は31年（1年未満の端数は切上げ）。退職所得控除額＝800万円＋70万円×（31年－20年）＝1,570万円。退職所得＝（3,000万円－1,570万円）×1/2＝715万円です。\n【ひっかけ】端数を切り捨てて30年で計算すると750万円、2分の1を忘れると1,430万円になります。"}, {"id": "mc:c8c9eb5e74", "c": 4, "s": "問題4-2", "st": 2, "q": "給与所得の金額が500万円、一時所得の総収入金額が200万円（その収入を得るために支出した金額100万円）の者の総所得金額として、正しいものはどれか。", "o": ["525万円", "550万円", "575万円", "600万円"], "a": 0, "e": "正解は「525万円」です。\n【根拠】一時所得＝200万－100万－50万＝50万円。総所得金額には2分の1の25万円を算入し、500万＋25万＝525万円です。\n【ひっかけ】2分の1を忘れると550万円になります。"}, {"id": "mc:1fbee4b336", "c": 4, "s": "問題4-2", "st": 2, "q": "勤続20年で退職し、退職金2,000万円を受け取った場合の退職所得の金額として、正しいものはどれか（障害者となったことによる退職ではなく、役員ではない）。", "o": ["500万円", "600万円", "700万円", "1,200万円"], "a": 1, "e": "正解は「600万円」です。\n【根拠】退職所得控除額＝40万円×20年＝800万円。（2,000万－800万）×1/2＝600万円です。\n【ひっかけ】2分の1を掛け忘れると1,200万円になります。"}, {"id": "mc:d491d0d48b", "c": 4, "s": "問題4-2", "st": 2, "q": "個人事業主の減価償却に関する次の記述のうち、最も不適切なものはどれか。", "o": ["償却方法を選定しなかった場合の法定償却方法は定額法である。", "建物の償却方法は定額法に限られる。", "取得価額10万円未満の資産は、全額をその年の必要経費にできる。", "取得価額20万円未満の資産は、一括償却資産として5年間で均等償却できる。"], "a": 3, "e": "正解は「取得価額20万円未満の資産は、一括償却資産として5年間で均等償却できる。」です。\n【根拠】一括償却資産は3年間で均等に償却します。\n【ひっかけ】法人も同じく、一括償却資産は3年です。"}, {"id": "mc:acd567c6f8", "c": 4, "s": "問題4-2", "st": 2, "q": "所得税における所得の区分に関する次の記述のうち、最も適切なものはどれか。", "o": ["事業的規模でない不動産の貸付けによる所得は、雑所得となる。", "会社員が受け取った生命保険の満期保険金（契約者は本人）は、一時所得となる。", "個人年金保険の年金は、公的年金等として雑所得となる。", "上場株式の配当金は、利子所得となる。"], "a": 1, "e": "正解は「会社員が受け取った生命保険の満期保険金（契約者は本人）は、一時所得となる。」です。\n【根拠】契約者＝受取人の満期保険金は一時所得です。\n【ひっかけ】不動産の貸付けは規模にかかわらず不動産所得、個人年金は公的年金等以外の雑所得、配当金は配当所得です。"}, {"id": "mc:db485fdb83", "c": 4, "s": "問題4-2", "st": 2, "q": "所得の区分に関する次の記述のうち、最も不適切なものはどれか。", "o": ["競馬の払戻金は、原則として一時所得である。", "法人から受けた贈与は、贈与税の課税対象である。", "5年を超えて保有する山林の伐採・譲渡による所得は、山林所得である。", "借地権の設定で時価の2分の1を超える権利金を受け取ると、譲渡所得となる。"], "a": 1, "e": "正解は「法人から受けた贈与は、贈与税の課税対象である。」です。\n【根拠】法人からの贈与は所得税（一時所得など）の課税対象です。\n【ひっかけ】贈与税は、個人からの贈与が対象です。"}, {"id": "mc:c41cca00de", "c": 4, "s": "問題4-2", "st": 2, "q": "勤続年数4年の役員が退職金1,000万円を受け取った場合の退職所得の金額として、正しいものはどれか。", "o": ["420万円", "840万円", "920万円", "1,000万円"], "a": 1, "e": "正解は「840万円」です。\n【根拠】退職所得控除額＝40万円×4年＝160万円（最低80万円より多い）。特定役員退職手当等なので2分の1を掛けず、1,000万－160万＝840万円です。\n【ひっかけ】2分の1を掛けると420万円になります。"}, {"id": "mc:665cc74662", "c": 4, "s": "問題4-2", "st": 2, "q": "所得税の計算に関する次の記述のうち、最も適切なものはどれか。", "o": ["勤続10年の退職所得控除額は800万円である。", "一時所得の特別控除額は最高100万円である。", "所有期間4年の土地の譲渡は、短期譲渡所得となる。", "個人年金保険の年金は、公的年金等控除の対象となる。"], "a": 2, "e": "正解は「所有期間4年の土地の譲渡は、短期譲渡所得となる。」です。\n【根拠】1月1日における所有期間5年以下は短期譲渡所得です。\n【ひっかけ】勤続10年は400万円、一時所得は最高50万円、個人年金は公的年金等以外の雑所得です。"}, {"id": "mc:539cff2a8d", "c": 4, "s": "問題4-3", "st": 2, "q": "所得税における損益通算に関する次の記述のうち、最も適切なものはどれか。", "o": ["一時所得の損失は、給与所得と損益通算できる。", "不動産所得の損失のうち、建物の取得に要した負債の利子に相当する部分は、損益通算できない。", "生活に通常必要でない資産の譲渡損失は、原則として損益通算できない。", "雑所得の損失は、事業所得と損益通算できる。"], "a": 2, "e": "正解は「生活に通常必要でない資産の譲渡損失は、原則として損益通算できない。」です。\n【根拠】ゴルフ会員権や別荘など、生活に通常必要でない資産の譲渡損失は損益通算できません。\n【ひっかけ】損益通算できない不動産所得の損失は「土地」の取得に要した負債の利子部分です。一時所得・雑所得の損失は損益通算できません。"}, {"id": "mc:afb50449bb", "c": 4, "s": "問題4-3", "st": 2, "q": "給与所得の金額が600万円、不動産所得の損失が150万円（うち土地取得のための借入金利子30万円）の場合、損益通算後の総所得金額として正しいものはどれか。", "o": ["450万円", "480万円", "570万円", "600万円"], "a": 1, "e": "正解は「480万円」です。\n【根拠】土地取得の借入金利子30万円分は損益通算できないため、通算できる損失は120万円。600万－120万＝480万円です。\n【ひっかけ】全額を通算すると450万円になります。"}, {"id": "mc:db7a6734d2", "c": 4, "s": "問題4-3", "st": 2, "q": "損益通算に関する次の記述のうち、最も適切なものはどれか。", "o": ["別荘の貸付けによる不動産所得の損失は、損益通算できる。", "山林所得の損失は、損益通算できる。", "土地の譲渡損失は、原則として損益通算できる。", "一時所得の損失は、損益通算できる。"], "a": 1, "e": "正解は「山林所得の損失は、損益通算できる。」です。\n【根拠】山林所得の損失は損益通算できます。\n【ひっかけ】別荘は生活に通常必要でない資産、土地の譲渡損失は原則不可、一時所得の損失も不可です。"}, {"id": "mc:fc183846f2", "c": 4, "s": "問題4-3", "st": 2, "q": "損益通算・繰越控除に関する次の記述のうち、最も不適切なものはどれか。", "o": ["一時所得の損失は、損益通算できない。", "建物の取得に要した借入金の利子に相当する不動産所得の損失は、損益通算できる。", "上場株式等の譲渡損失は、翌年以後5年間繰り越せる。", "青色申告者の純損失は、翌年以後3年間繰り越せる。"], "a": 2, "e": "正解は「上場株式等の譲渡損失は、翌年以後5年間繰り越せる。」です。\n【根拠】上場株式等の譲渡損失の繰越期間は3年間です。\n【ひっかけ】純損失・雑損失も原則3年です。"}, {"id": "mc:85a3e9c77c", "c": 4, "s": "問題4-4", "st": 2, "q": "所得控除に関する次の記述のうち、最も不適切なものはどれか。", "o": ["医療費控除の上限額は200万円である。", "セルフメディケーション税制と通常の医療費控除は、選択適用である。", "16歳未満の扶養親族は、扶養控除の対象とならない。", "盗難による損失は、雑損控除の対象とならない。"], "a": 3, "e": "正解は「盗難による損失は、雑損控除の対象とならない。」です。\n【根拠】災害・盗難・横領による損失は雑損控除の対象です。対象外なのは詐欺・恐喝による損失です。\n【ひっかけ】医療費控除・セルフメディケーション税制・扶養控除の記述はいずれも適切です。"}, {"id": "mc:b3c6f5b68e", "c": 4, "s": "問題4-4", "st": 2, "q": "総所得金額等が150万円の者が、1年間に医療費を30万円支払った（保険金等の補てんはない）場合の医療費控除の額として正しいものはどれか。", "o": ["15万円", "20万円", "22.5万円", "30万円"], "a": 2, "e": "正解は「22.5万円」です。\n【根拠】総所得金額等が200万円未満なので、足切り額は150万円×5％＝7.5万円。30万－7.5万＝22.5万円です。\n【ひっかけ】一律10万円を引くと20万円になります。"}, {"id": "mc:e4e00844bb", "c": 4, "s": "問題4-4", "st": 2, "q": "医療費控除の対象となるものとして、最も適切なものはどれか。", "o": ["健康診断で異常が見つからなかった場合の人間ドックの費用", "美容整形の費用", "病気の治療のために通院した際の電車代", "疲労回復のためのビタミン剤の購入費"], "a": 2, "e": "正解は「病気の治療のために通院した際の電車代」です。\n【根拠】通院のための電車・バス代は対象です。\n【ひっかけ】異常のなかった人間ドック、美容整形、予防・健康増進のための医薬品は対象外です。"}, {"id": "mc:1b5b57013a", "c": 4, "s": "問題4-4", "st": 2, "q": "所得税の所得控除に関する次の記述のうち、最も適切なものはどれか。", "o": ["特定扶養親族に係る扶養控除の額は38万円である。", "同居特別障害者に係る障害者控除の額は75万円である。", "ふるさと納税のワンストップ特例は、寄附先が10自治体以内であれば利用できる。", "詐欺による損失は、雑損控除の対象となる。"], "a": 1, "e": "正解は「同居特別障害者に係る障害者控除の額は75万円である。」です。\n【根拠】障害者27万円、特別障害者40万円、同居特別障害者75万円です。\n【ひっかけ】特定扶養親族は63万円、ワンストップ特例は5自治体以内、詐欺の損失は雑損控除の対象外です。"}, {"id": "mc:2247b7bdd4", "c": 4, "s": "問題4-4", "st": 2, "q": "医療費控除の対象となるものとして、最も適切なものはどれか。", "o": ["自家用車で通院した際のガソリン代", "出産のための分娩費用", "健康増進のためのサプリメント代", "異常のなかった人間ドックの費用"], "a": 1, "e": "正解は「出産のための分娩費用」です。\n【根拠】分娩費用は医療費控除の対象です。\n【ひっかけ】ガソリン代、予防・健康増進の費用、異常のない人間ドックは対象外です。"}, {"id": "mc:46aa07384f", "c": 4, "s": "問題4-4", "st": 2, "q": "1年間の医療費が50万円、そのうち入院費用30万円に対して入院給付金40万円を受け取った。総所得金額等は500万円である。医療費控除の額として正しいものはどれか。", "o": ["0円", "10万円", "20万円", "30万円"], "a": 1, "e": "正解は「10万円」です。\n【根拠】補てん金40万円は入院費用30万円から差し引き（上回る10万円は他から引かない）、残る医療費は20万円。20万円－10万円＝10万円です。\n【ひっかけ】50万－40万－10万＝0円と計算するのは誤りです。"}, {"id": "mc:1cdfbff031", "c": 4, "s": "問題4-4", "st": 2, "q": "扶養控除に関する次の記述のうち、最も不適切なものはどれか。", "o": ["16歳未満の扶養親族は、扶養控除の対象とならない。", "同居老親等に係る扶養控除の額は58万円である。", "年齢は、その年の1月1日の現況で判定する。", "年の途中で死亡した親族は、死亡時の現況で判定する。"], "a": 2, "e": "正解は「年齢は、その年の1月1日の現況で判定する。」です。\n【根拠】年齢は、その年の12月31日の現況で判定します。\n【ひっかけ】1月1日で判定するのは、住民税の住所地や固定資産税の納税義務者などです。"}, {"id": "mc:234d1b8668", "c": 4, "s": "問題4-4", "st": 2, "q": "所得控除に関する次の記述のうち、最も適切なものはどれか。", "o": ["生命保険料控除は税額控除である。", "寄附金控除は、特定寄附金の額から5,000円を差し引いた金額である。", "16歳未満の扶養親族は、扶養控除の対象とならない。", "本人の合計所得金額が1,000万円を超えても、配偶者控除を受けられる。"], "a": 2, "e": "正解は「16歳未満の扶養親族は、扶養控除の対象とならない。」です。\n【根拠】16歳未満は扶養控除の対象外です。\n【ひっかけ】生命保険料控除は所得控除、寄附金控除は2,000円を差し引き、本人所得1,000万円超は配偶者控除の対象外です。"}, {"id": "mc:afd4a7c852", "c": 4, "s": "問題4-5", "st": 2, "q": "住宅借入金等特別控除に関する次の記述のうち、最も適切なものはどれか。", "o": ["控除を受ける年の合計所得金額が3,000万円以下でなければならない。", "住宅ローンの返済期間は5年以上であればよい。", "給与所得者は、適用を受ける最初の年分から年末調整により控除を受けることができる。", "住宅を取得した日から6か月以内に居住の用に供する必要がある。"], "a": 3, "e": "正解は「住宅を取得した日から6か月以内に居住の用に供する必要がある。」です。\n【根拠】取得等の日から6か月以内に居住し、その年の12月31日まで引き続き居住していることが要件です。\n【ひっかけ】合計所得金額は2,000万円以下、返済期間は10年以上、初年度は確定申告が必要です。"}, {"id": "mc:a3ae321872", "c": 4, "s": "問題4-5", "st": 2, "q": "住宅借入金等の年末残高が3,000万円の場合の住宅借入金等特別控除額として、正しいものはどれか（控除率0.7％、借入限度額などの上限は考慮しない）。", "o": ["7万円", "21万円", "30万円", "35万円"], "a": 1, "e": "正解は「21万円」です。\n【根拠】3,000万円×0.7％＝21万円です。\n【ひっかけ】1％で計算すると30万円になります。"}, {"id": "mc:a76b261842", "c": 4, "s": "問題4-5", "st": 2, "q": "課税総所得金額等が600万円、そのうち上場株式の配当所得（総合課税を選択）が20万円の者の配当控除の額（所得税）として、正しいものはどれか。", "o": ["1万円", "2万円", "3万円", "4万円"], "a": 1, "e": "正解は「2万円」です。\n【根拠】課税総所得金額等が1,000万円以下なので、配当所得の10％。20万円×10％＝2万円です。\n【ひっかけ】1,000万円を超える部分に対応する配当所得は5％です。"}, {"id": "mc:5d07bf529f", "c": 4, "s": "問題4-5", "st": 2, "q": "所得税・住民税に関する次の記述のうち、最も適切なものはどれか。", "o": ["住民税は、その年の所得に対してその年に課税される。", "住民税は、1月1日現在の住所地の市町村が課税する。", "更正の請求は、法定申告期限から3年以内に行う。", "白色申告者も、純損失を3年間繰り越すことができる。"], "a": 1, "e": "正解は「住民税は、1月1日現在の住所地の市町村が課税する。」です。\n【根拠】住民税は1月1日の住所地で、前年の所得に課税されます。\n【ひっかけ】更正の請求は5年以内、純損失の繰越控除は原則として青色申告者のみです。"}, {"id": "mc:5f9ffb9733", "c": 4, "s": "問題4-5", "st": 2, "q": "所得税の申告・納付に関する次の記述のうち、最も不適切なものはどれか。", "o": ["予定納税基準額が15万円以上の者は、7月と11月に予定納税を行う。", "還付申告は、翌年1月1日から5年間提出できる。", "青色事業専従者の年齢要件は、18歳以上である。", "白色申告者の配偶者の事業専従者控除の上限は86万円である。"], "a": 2, "e": "正解は「青色事業専従者の年齢要件は、18歳以上である。」です。\n【根拠】青色事業専従者の年齢要件は15歳以上です。\n【ひっかけ】その年の6か月を超える期間、事業にもっぱら従事することも要件です。"}, {"id": "mc:b9387a7858", "c": 4, "s": "問題4-5", "st": 2, "q": "住民税に関する次の記述のうち、最も適切なものはどれか。", "o": ["住民税の所得割の税率は、5％から45％の超過累進税率である。", "給与所得者の住民税は、原則として特別徴収により納付する。", "住民税は、その年の所得に対してその年に課税される。", "住民税は、12月31日現在の住所地で課税される。"], "a": 1, "e": "正解は「給与所得者の住民税は、原則として特別徴収により納付する。」です。\n【根拠】給与所得者は、原則として特別徴収（給与天引き）です。\n【ひっかけ】所得割は一律10％、前年の所得に対して、1月1日現在の住所地で課税されます。"}, {"id": "mc:91d68fa279", "c": 4, "s": "問題4-5", "st": 2, "q": "年末調整で適用を受けることができるものとして、最も適切なものはどれか。", "o": ["医療費控除", "雑損控除", "地震保険料控除", "住宅借入金等特別控除（最初の年分）"], "a": 2, "e": "正解は「地震保険料控除」です。\n【根拠】地震保険料控除や生命保険料控除は年末調整で受けられます。\n【ひっかけ】医療費控除・雑損控除・住宅ローン控除の最初の年分は確定申告が必要です。"}, {"id": "mc:11883ed2ad", "c": 4, "s": "問題4-5", "st": 2, "q": "青色申告に関する次の記述のうち、最も適切なものはどれか。", "o": ["期限後申告でも、65万円の青色申告特別控除を受けられる。", "帳簿書類の保存期間は、原則として7年間である。", "給与所得者も青色申告ができる。", "青色事業専従者は、18歳以上でなければならない。"], "a": 1, "e": "正解は「帳簿書類の保存期間は、原則として7年間である。」です。\n【根拠】帳簿書類の保存期間は原則7年です。\n【ひっかけ】期限後申告は10万円、給与所得者は対象外、専従者は15歳以上です。"}, {"id": "mc:f2a6c55460", "c": 4, "s": "問題4-6", "st": 2, "q": "法人税の交際費等に関する次の記述のうち、最も適切なものはどれか。", "o": ["期末資本金の額が1億円以下の法人（一定の法人を除く）は、年800万円までの交際費等を損金に算入できる。", "1人あたり2万円以下の飲食費（社内飲食費を除く）は、交際費等から除かれる。", "中小法人は、接待飲食費の全額を損金に算入できる。", "交際費等は、法人の規模にかかわらず全額が損金不算入となる。"], "a": 0, "e": "正解は「期末資本金の額が1億円以下の法人（一定の法人を除く）は、年800万円までの交際費等を損金に算入できる。」です。\n【根拠】中小法人は、年800万円の定額控除限度額と接待飲食費の50％のいずれかを選択できます。\n【ひっかけ】飲食費の除外基準は1人あたり1万円以下です。接待飲食費は50％までです。"}, {"id": "mc:227ea4dd47", "c": 4, "s": "問題4-6", "st": 2, "q": "法人税に関する次の記述のうち、最も不適切なものはどれか。", "o": ["定期同額給与は、損金に算入することができる役員給与である。", "事前確定届出給与は、所定の時期に確定額を支給する旨を税務署長に届け出た役員給与である。", "期末資本金の額が1億円以下の法人（一定の法人を除く）は、交際費等のうち年800万円までを損金に算入できる。", "法人税の申告期限は、原則として事業年度終了の日の翌日から3か月以内である。"], "a": 3, "e": "正解は「法人税の申告期限は、原則として事業年度終了の日の翌日から3か月以内である。」です。\n【根拠】法人税の申告期限は、原則として事業年度終了の日の翌日から2か月以内です。\n【ひっかけ】申告期限の延長の特例を受けている場合は、別に期限が延びます。"}, {"id": "mc:73bc7d477e", "c": 4, "s": "問題4-6", "st": 2, "q": "消費税に関する次の記述のうち、最も不適切なものはどれか。", "o": ["基準期間の課税売上高が1,000万円以下の事業者は、原則として免税事業者となる。", "個人事業者の基準期間は、その年の前々年である。", "簡易課税制度は、基準期間の課税売上高が1億円以下の事業者が選択できる。", "免税事業者でも、適格請求書発行事業者の登録を受けることができる。"], "a": 2, "e": "正解は「簡易課税制度は、基準期間の課税売上高が1億円以下の事業者が選択できる。」です。\n【根拠】簡易課税制度は、基準期間の課税売上高が5,000万円以下の事業者が選択できます。\n【ひっかけ】免税点の1,000万円と、簡易課税の5,000万円を区別して押さえます。"}, {"id": "mc:546c62caf6", "c": 4, "s": "問題4-6", "st": 2, "q": "法人税・消費税に関する次の記述のうち、最も不適切なものはどれか。", "o": ["中小法人等の欠損金は、翌期以後10年間繰り越して控除できる。", "大法人の欠損金の繰越控除は、所得の50％が限度である。", "簡易課税制度は、基準期間の課税売上高が1億円以下の事業者が選択できる。", "適格請求書発行事業者は、課税事業者である。"], "a": 2, "e": "正解は「簡易課税制度は、基準期間の課税売上高が1億円以下の事業者が選択できる。」です。\n【根拠】簡易課税制度は、基準期間の課税売上高が5,000万円以下の事業者が選択できます。\n【ひっかけ】1億円は、他の制度（少額特例など）の基準と混同しやすい数字です。"}, {"id": "mc:da243860da", "c": 4, "s": "問題4-6", "st": 2, "q": "法人税の取扱いに関する次の記述のうち、最も適切なものはどれか。", "o": ["法人が納付した法人税は、損金に算入できる。", "法人の法定償却方法は、建物を含めて定率法である。", "国や地方公共団体への寄附金は、全額損金に算入できる。", "受取配当等は、全額が益金に算入される。"], "a": 2, "e": "正解は「国や地方公共団体への寄附金は、全額損金に算入できる。」です。\n【根拠】国等への寄附金は全額損金です。\n【ひっかけ】法人税は損金不算入、建物は定額法、受取配当等には益金不算入の制度があります。"}, {"id": "mc:d82f7ad3d5", "c": 4, "s": "問題4-6", "st": 2, "q": "役員Aが、自社に時価5,000万円の土地を2,000万円で譲渡した場合の課税関係として、最も適切なものはどれか（同族会社の行為計算否認は考慮しない）。", "o": ["Aは、2,000万円で譲渡したものとして譲渡所得を計算する。", "Aは、時価5,000万円で譲渡したものとみなされる。", "会社は、差額3,000万円を損金に算入する。", "Aは、差額3,000万円について給与所得として課税される。"], "a": 1, "e": "正解は「Aは、時価5,000万円で譲渡したものとみなされる。」です。\n【根拠】時価の2分の1（2,500万円）未満の譲渡なので、Aは時価5,000万円で譲渡したものとみなされます。\n【ひっかけ】会社は差額3,000万円を受贈益として益金に算入します。"}, {"id": "mc:b51abeee28", "c": 4, "s": "問題4-6", "st": 2, "q": "会社と役員の取引に関する次の記述のうち、最も不適切なものはどれか。", "o": ["会社が役員に資産を低額で譲渡すると、時価との差額は役員の給与所得となる。", "会社が役員に無利息で金銭を貸し付けると、利息相当額は役員の給与所得となる。", "役員が会社に無利息で金銭を貸し付けると、利息相当額は役員の雑所得となる。", "役員が会社に時価を超える価額で資産を譲渡すると、時価を超える部分は役員への給与となる。"], "a": 2, "e": "正解は「役員が会社に無利息で金銭を貸し付けると、利息相当額は役員の雑所得となる。」です。\n【根拠】役員から会社への無利息貸付けでは、役員に課税されません。\n【ひっかけ】会社から役員への無利息貸付けとの違いを押さえます。"}, {"id": "mc:0c1a96bb13", "c": 4, "s": "問題4-6", "st": 2, "q": "消費税の課税取引に該当するものとして、最も適切なものはどれか。", "o": ["土地の譲渡", "居住用アパートの家賃（貸付期間1年）", "事務所用建物の譲渡", "預金の利子"], "a": 2, "e": "正解は「事務所用建物の譲渡」です。\n【根拠】建物の譲渡は課税取引です。\n【ひっかけ】土地の譲渡、住宅の貸付け、預金の利子は非課税取引です。"}, {"id": "mc:93641254fd", "c": 4, "s": "問題4-6", "st": 2, "q": "消費税の簡易課税制度のみなし仕入率の組合せとして、正しいものはどれか（卸売業／小売業／サービス業）。", "o": ["90％／80％／50％", "80％／90％／50％", "90％／80％／60％", "80％／70％／40％"], "a": 0, "e": "正解は「90％／80％／50％」です。\n【根拠】卸売業90％、小売業80％、サービス業50％です。\n【ひっかけ】製造業70％、その他60％、不動産業40％です。"}, {"id": "mc:db5f9fcff5", "c": 4, "s": "問題4-6", "st": 2, "q": "法人税の損金算入に関する次の記述のうち、最も適切なものはどれか。", "o": ["従業員の賞与は、事前の届出がなければ損金に算入できない。", "固定資産税は、損金に算入できない。", "法人税は、損金に算入できる。", "役員給与のうち不相当に高額な部分は、損金に算入できない。"], "a": 3, "e": "正解は「役員給与のうち不相当に高額な部分は、損金に算入できない。」です。\n【根拠】不相当に高額な役員給与は損金不算入です。\n【ひっかけ】従業員賞与は届出不要、固定資産税は損金算入、法人税は損金不算入です。"}, {"id": "mc:168f34ffad", "c": 5, "s": "問題5-1", "st": 2, "q": "土地の価格に関する次の記述のうち、最も適切なものはどれか。", "o": ["公示価格は、都道府県が毎年7月1日を基準日として公表する。", "相続税路線価は、公示価格の80％程度が目安とされる。", "固定資産税評価額は、毎年評価替えが行われる。", "基準地標準価格は、国土交通省が毎年1月1日を基準日として公表する。"], "a": 1, "e": "正解は「相続税路線価は、公示価格の80％程度が目安とされる。」です。\n【根拠】相続税路線価は公示価格の80％、固定資産税評価額は70％程度が目安です。\n【ひっかけ】公示価格は国土交通省・1月1日、基準地標準価格は都道府県・7月1日、固定資産税評価額は3年ごとの評価替えです。"}, {"id": "mc:f8a3e745c6", "c": 5, "s": "問題5-1", "st": 2, "q": "不動産の価格とその公表機関の組合せとして、最も適切なものはどれか。", "o": ["公示価格―都道府県", "基準地標準価格―国土交通省", "相続税路線価―国税庁", "固定資産税評価額―国税庁"], "a": 2, "e": "正解は「相続税路線価―国税庁」です。\n【根拠】相続税路線価は国税庁が公表します。\n【ひっかけ】公示価格は国土交通省、基準地標準価格は都道府県、固定資産税評価額は市町村です。"}, {"id": "mc:751ebfefbe", "c": 5, "s": "問題5-1", "st": 2, "q": "不動産の登記に関する次の記述のうち、最も適切なものはどれか。", "o": ["権利に関する登記には、例外なく申請義務がない。", "相続登記は、取得を知った日から3年以内に申請しなければならない。", "抵当権の順位は、契約の締結の先後による。", "登記を信頼して取引すれば、必ず権利を取得できる。"], "a": 1, "e": "正解は「相続登記は、取得を知った日から3年以内に申請しなければならない。」です。\n【根拠】2024年4月から相続登記は義務化されています。\n【ひっかけ】抵当権の順位は登記の先後、登記に公信力はありません。"}, {"id": "mc:b2ffe9d397", "c": 5, "s": "問題5-1", "st": 2, "q": "年間の純収益が600万円、還元利回りが4％の賃貸不動産を、直接還元法で評価した収益価格として正しいものはどれか。", "o": ["2,400万円", "1億2,000万円", "1億5,000万円", "1億6,000万円"], "a": 2, "e": "正解は「1億5,000万円」です。\n【根拠】収益価格＝600万円÷0.04＝1億5,000万円です。\n【ひっかけ】純収益に還元利回りを掛ける誤りに注意します。"}, {"id": "mc:82c60482b8", "c": 5, "s": "問題5-1", "st": 2, "q": "土地の価格と登記に関する次の記述のうち、最も適切なものはどれか。", "o": ["公示価格は、7月1日を基準日として都道府県が公表する。", "固定資産税評価額は、公示価格の80％程度が目安である。", "権利部乙区には、所有権以外の権利に関する事項が記録される。", "仮登記には対抗力がある。"], "a": 2, "e": "正解は「権利部乙区には、所有権以外の権利に関する事項が記録される。」です。\n【根拠】乙区には抵当権などが記録されます。\n【ひっかけ】公示価格は1月1日・国土交通省、固定資産税評価額は70％程度、仮登記には対抗力がありません。"}, {"id": "mc:ee7dc62223", "c": 5, "s": "問題5-2", "st": 2, "q": "宅地建物取引業法に関する次の記述のうち、最も不適切なものはどれか。", "o": ["専任媒介契約の有効期間は3か月以内である。", "専属専任媒介契約では、1週間に1回以上業務の処理状況を報告する。", "宅建業者が自ら売主の場合、手付金は代金の20％が上限である。", "一般媒介契約では、指定流通機構への登録が義務付けられている。"], "a": 3, "e": "正解は「一般媒介契約では、指定流通機構への登録が義務付けられている。」です。\n【根拠】一般媒介契約には、指定流通機構への登録義務はありません。\n【ひっかけ】専任媒介は7日以内、専属専任媒介は5日以内に登録します。"}, {"id": "mc:a385436ade", "c": 5, "s": "問題5-2", "st": 2, "q": "宅地建物取引業法に基づく媒介契約に関する次の記述のうち、最も適切なものはどれか。", "o": ["一般媒介契約では、物件を指定流通機構に登録する義務がある。", "専任媒介契約の有効期間は、最長6か月である。", "専属専任媒介契約では、業務の処理状況を1週間に1回以上報告しなければならない。", "専属専任媒介契約でも、依頼者が自ら見つけた相手方と直接契約できる。"], "a": 2, "e": "正解は「専属専任媒介契約では、業務の処理状況を1週間に1回以上報告しなければならない。」です。\n【根拠】専属専任媒介契約は1週間に1回以上、専任媒介契約は2週間に1回以上の報告が必要です。\n【ひっかけ】一般媒介は登録義務なし、有効期間は最長3か月、専属専任では自己発見取引はできません。"}, {"id": "mc:db04791f31", "c": 5, "s": "問題5-2", "st": 2, "q": "宅地建物取引業法に関する次の記述のうち、最も適切なものはどれか。", "o": ["自ら所有するアパートを賃貸するには、宅地建物取引業の免許が必要である。", "事務所で締結した売買契約でも、クーリング・オフができる。", "宅建業者が自ら売主の場合、通知期間を引渡しから2年以上とする特約は有効である。", "重要事項の説明は、契約締結後に行えばよい。"], "a": 2, "e": "正解は「宅建業者が自ら売主の場合、通知期間を引渡しから2年以上とする特約は有効である。」です。\n【根拠】引渡しから2年以上とする特約は有効です。\n【ひっかけ】自ら貸主は免許不要、事務所での契約はクーリング・オフ不可、重要事項説明は契約締結前です。"}, {"id": "mc:ea53d8af20", "c": 5, "s": "問題5-2", "st": 2, "q": "共有に関する次の記述のうち、最も不適切なものはどれか。", "o": ["共有物の保存行為は、各共有者が単独で行える。", "共有物の賃貸などの管理行為は、持分の価格の過半数で決する。", "共有物全体の売却には、共有者全員の同意が必要である。", "自己の持分を売却するには、他の共有者全員の同意が必要である。"], "a": 3, "e": "正解は「自己の持分を売却するには、他の共有者全員の同意が必要である。」です。\n【根拠】自分の持分は、単独で自由に処分できます。\n【ひっかけ】共有物全体の処分と区別します。"}, {"id": "mc:8bbcf18c92", "c": 5, "s": "問題5-2", "st": 2, "q": "売買代金が3,000万円（税抜）の住宅の売買を媒介した宅建業者が、売主から受け取れる報酬の上限額（税抜）として、正しいものはどれか。", "o": ["90万円", "96万円", "105.6万円", "120万円"], "a": 1, "e": "正解は「96万円」です。\n【根拠】3,000万円×3％＋6万円＝96万円です。\n【ひっかけ】6万円を加え忘れると90万円です。"}, {"id": "mc:b2553cfa6a", "c": 5, "s": "問題5-3", "st": 2, "q": "借地借家法に関する次の記述のうち、最も適切なものはどれか。", "o": ["一般定期借地権の存続期間は30年以上である。", "事業用定期借地権等の設定契約は、公正証書によらなければならない。", "建物譲渡特約付借地権の存続期間は50年以上である。", "定期借家契約では、期間を1年未満とすることはできない。"], "a": 1, "e": "正解は「事業用定期借地権等の設定契約は、公正証書によらなければならない。」です。\n【根拠】事業用定期借地権等は、公正証書で契約しなければなりません。\n【ひっかけ】一般定期借地権は50年以上、建物譲渡特約付借地権は30年以上、定期借家契約は1年未満も可能です。"}, {"id": "mc:a354e98174", "c": 5, "s": "問題5-3", "st": 2, "q": "区分所有法の集会の決議要件の組合せとして、正しいものはどれか（規約の変更／建替え）。", "o": ["各過半数／各3分の4以上", "各4分の3以上／各5分の4以上", "各5分の4以上／各4分の3以上", "各3分の2以上／各5分の4以上"], "a": 1, "e": "正解は「各4分の3以上／各5分の4以上」です。\n【根拠】規約の設定・変更・廃止は各4分の3以上、建替えは各5分の4以上です。\n【ひっかけ】共用部分の重大な変更も各4分の3以上です。"}, {"id": "mc:d31dd7918c", "c": 5, "s": "問題5-3", "st": 2, "q": "借地借家法に関する次の記述のうち、最も不適切なものはどれか。", "o": ["借地上に借地権者本人名義で登記された建物があれば、借地権を第三者に対抗できる。", "借家権は、建物の引渡しを受けていれば、その後の建物の取得者に対抗できる。", "普通借家契約で期間を6か月とした場合、期間の定めがないものとみなされる。", "定期借家契約は、公正証書でしなければ効力を生じない。"], "a": 3, "e": "正解は「定期借家契約は、公正証書でしなければ効力を生じない。」です。\n【根拠】定期借家契約は書面（又は電磁的記録）で締結すればよく、公正証書は不要です。\n【ひっかけ】公正証書が必要なのは事業用定期借地権等です。"}, {"id": "mc:f2bc833844", "c": 5, "s": "問題5-3", "st": 2, "q": "借地借家法・区分所有法に関する次の記述のうち、最も適切なものはどれか。", "o": ["普通借家契約で一定期間賃料を減額しない特約は有効である。", "期間の定めのない建物賃貸借で賃借人が解約を申し入れた場合、6か月で終了する。", "区分所有者は、管理組合を当然に構成する。", "共用部分の重大な変更は、各5分の4以上の決議で行う。"], "a": 2, "e": "正解は「区分所有者は、管理組合を当然に構成する。」です。\n【根拠】区分所有者は当然に管理組合の構成員です。\n【ひっかけ】減額しない特約は無効、賃借人からの解約は3か月、重大変更は各4分の3以上です。"}, {"id": "mc:77572f89f1", "c": 5, "s": "問題5-3", "st": 2, "q": "借地権の存続期間の組合せとして、正しいものはどれか（普通借地権／一般定期借地権／事業用定期借地権等）。", "o": ["30年以上／50年以上／10年以上50年未満", "20年以上／30年以上／10年以上30年未満", "30年以上／30年以上／10年以上50年未満", "50年以上／50年以上／10年以上30年未満"], "a": 0, "e": "正解は「30年以上／50年以上／10年以上50年未満」です。\n【根拠】普通借地権30年以上、一般定期借地権50年以上、事業用定期借地権等10年以上50年未満です。\n【ひっかけ】建物譲渡特約付借地権は30年以上です。"}, {"id": "mc:6ea2fbb5f0", "c": 5, "s": "問題5-4", "st": 2, "q": "幅員6mの市道に面した、第一種住居地域内の300㎡の敷地（指定容積率300％、法定乗数10分の4）に建築できる建物の延べ面積の最高限度として、正しいものはどれか。", "o": ["600㎡", "720㎡", "900㎡", "1,080㎡"], "a": 1, "e": "正解は「720㎡」です。\n【根拠】6m×4/10＝240％と指定容積率300％の低いほう240％を使います。300㎡×240％＝720㎡です。\n【ひっかけ】指定容積率のまま計算すると900㎡になります。前面道路が12m未満かを必ず確認します。"}, {"id": "mc:4c7616543e", "c": 5, "s": "問題5-4", "st": 2, "q": "準防火地域内にある特定行政庁指定の角地300㎡（指定建ぺい率60％）に、耐火建築物を建築する場合の建築面積の最高限度として、正しいものはどれか。", "o": ["180㎡", "210㎡", "240㎡", "300㎡"], "a": 2, "e": "正解は「240㎡」です。\n【根拠】準防火地域内の耐火建築物で10％、角地で10％加算され、60％＋20％＝80％。300㎡×80％＝240㎡です。\n【ひっかけ】片方の緩和だけだと210㎡になります。"}, {"id": "mc:48d0c78bf0", "c": 5, "s": "問題5-4", "st": 2, "q": "幅員3mの2項道路（反対側も宅地）に20m接する200㎡の敷地（指定建ぺい率60％）の建築面積の最高限度として、正しいものはどれか。", "o": ["108㎡", "114㎡", "120㎡", "126㎡"], "a": 1, "e": "正解は「114㎡」です。\n【根拠】道路の中心線から2m後退するため、セットバックは0.5m。0.5m×20m＝10㎡を除いた190㎡が敷地面積。190㎡×60％＝114㎡です。\n【ひっかけ】セットバックを考慮しないと120㎡になります。"}, {"id": "mc:d33aa8af99", "c": 5, "s": "問題5-4", "st": 2, "q": "建築基準法に関する次の記述のうち、最も適切なものはどれか。", "o": ["工業専用地域でも、住宅を建築することができる。", "建築物が防火地域と準防火地域にわたる場合は、原則として厳しいほうの規制が適用される。", "敷地が2つの用途地域にわたる場合、建ぺい率は敷地の過半が属する地域の数値による。", "特定行政庁が指定する角地は、容積率が10％加算される。"], "a": 1, "e": "正解は「建築物が防火地域と準防火地域にわたる場合は、原則として厳しいほうの規制が適用される。」です。\n【根拠】防火規制は、原則として厳しいほう（防火地域）が建築物の全部に適用されます。\n【ひっかけ】工業専用地域には住宅を建てられず、建ぺい率は加重平均、角地の緩和は建ぺい率の10％加算です。"}, {"id": "mc:cd27581ebe", "c": 5, "s": "問題5-4", "st": 2, "q": "防火地域・準防火地域の指定のない第一種住居地域内にある、角地に該当しない360㎡の土地（指定建ぺい率60％）に建築できる建物の建築面積の最高限度として、正しいものはどれか。", "o": ["180㎡", "216㎡", "252㎡", "288㎡"], "a": 1, "e": "正解は「216㎡」です。\n【根拠】360㎡×60％＝216㎡です。緩和の適用がないため、指定建ぺい率のまま計算します。\n【ひっかけ】角地や防火地域の耐火建築物等なら70％（252㎡）になります。"}, {"id": "mc:cdc1c9a498", "c": 5, "s": "問題5-4", "st": 2, "q": "建築基準法の高さの制限に関する次の記述のうち、最も適切なものはどれか。", "o": ["道路斜線制限は、住居系の用途地域にだけ適用される。", "北側斜線制限は、商業地域にも適用される。", "隣地斜線制限は、第一種低層住居専用地域には適用されない。", "第一種中高層住居専用地域には、10m又は12mの絶対高さの制限がある。"], "a": 2, "e": "正解は「隣地斜線制限は、第一種低層住居専用地域には適用されない。」です。\n【根拠】低層住居専用地域・田園住居地域には絶対高さの制限があるため、隣地斜線制限は適用されません。\n【ひっかけ】道路斜線はすべての地域、北側斜線は住居専用地域など、絶対高さは低層住居専用地域などです。"}, {"id": "mc:17250b7365", "c": 5, "s": "問題5-4", "st": 2, "q": "開発許可が必要となる開発行為の規模の組合せとして、正しいものはどれか（市街化区域／準都市計画区域／都市計画区域外）。", "o": ["500㎡／1,000㎡／3,000㎡", "1,000㎡／3,000㎡／1ha", "1,000㎡／1ha／3,000㎡", "3,000㎡／1,000㎡／1ha"], "a": 1, "e": "正解は「1,000㎡／3,000㎡／1ha」です。\n【根拠】市街化区域1,000㎡以上、準都市計画区域3,000㎡以上、都市計画区域外1ha以上です。\n【ひっかけ】市街化調整区域は、原則として規模にかかわらず許可が必要です。"}, {"id": "mc:8b13b691ae", "c": 5, "s": "問題5-4", "st": 2, "q": "幅員4mの市道（2項道路ではない）に面した、近隣商業地域内の200㎡の敷地（指定容積率400％、前面道路の法定乗数10分の6）の最大延べ面積として、正しいものはどれか。", "o": ["320㎡", "480㎡", "800㎡", "960㎡"], "a": 1, "e": "正解は「480㎡」です。\n【根拠】4m×6/10＝240％と指定容積率400％の低いほう240％を使います。200㎡×240％＝480㎡です。\n【ひっかけ】指定容積率のままだと800㎡になります。"}, {"id": "mc:89b0828e7b", "c": 5, "s": "問題5-5", "st": 2, "q": "不動産に係る税金に関する次の記述のうち、最も不適切なものはどれか。", "o": ["相続による不動産の取得には、不動産取得税は課されない。", "固定資産税の納税義務者は、毎年1月1日現在の所有者である。", "小規模住宅用地の固定資産税の課税標準は、価格の6分の1である。", "贈与による不動産の取得には、不動産取得税は課されない。"], "a": 3, "e": "正解は「贈与による不動産の取得には、不動産取得税は課されない。」です。\n【根拠】贈与による取得には不動産取得税が課されます。\n【ひっかけ】非課税となるのは相続・法人の合併などによる取得です。"}, {"id": "mc:cf68f7a962", "c": 5, "s": "問題5-5", "st": 2, "q": "固定資産税評価額3,000万円・面積300㎡の住宅用地（住宅1戸）の固定資産税の課税標準として、正しいものはどれか。", "o": ["500万円", "666.7万円", "1,000万円", "3,000万円"], "a": 1, "e": "正解は「666.7万円」です。\n【根拠】200㎡までの部分：2,000万円×1/6≒333.3万円。200㎡を超える100㎡の部分：1,000万円×1/3≒333.3万円。合計666.7万円です。\n【ひっかけ】全体を1/6とすると500万円になります。"}, {"id": "mc:4611a05f4e", "c": 5, "s": "問題5-5", "st": 2, "q": "不動産の取得・保有に係る税金に関する次の記述のうち、最も適切なものはどれか。", "o": ["不動産取得税は、市町村が課税する。", "相続による所有権移転登記の登録免許税の税率は2％である。", "要件を満たす新築住宅は、不動産取得税の課税標準から1,200万円を控除できる。", "都市計画税の標準税率は1.4％である。"], "a": 2, "e": "正解は「要件を満たす新築住宅は、不動産取得税の課税標準から1,200万円を控除できる。」です。\n【根拠】床面積50㎡以上240㎡以下などの要件を満たす新築住宅は、1,200万円控除されます。\n【ひっかけ】不動産取得税は都道府県税、相続登記は0.4％、都市計画税は制限税率0.3％（1.4％は固定資産税の標準税率）です。"}, {"id": "mc:cad8a62deb", "c": 5, "s": "問題5-5", "st": 2, "q": "不動産に係る税金の課税標準に関する次の記述のうち、最も不適切なものはどれか。", "o": ["不動産取得税の課税標準は、原則として固定資産税評価額である。", "所有権移転登記の登録免許税の課税標準は、固定資産税評価額である。", "抵当権設定登記の登録免許税の課税標準は、固定資産税評価額である。", "固定資産税の課税標準は、固定資産税評価額である。"], "a": 2, "e": "正解は「抵当権設定登記の登録免許税の課税標準は、固定資産税評価額である。」です。\n【根拠】抵当権設定登記の課税標準は債権金額です。\n【ひっかけ】住宅用家屋の取得のための借入れでは、税率の軽減措置があります。"}, {"id": "mc:9ba29e28c0", "c": 5, "s": "問題5-5", "st": 2, "q": "不動産の税金に関する次の記述のうち、最も不適切なものはどれか。", "o": ["相続による所有権移転登記には、登録免許税が課される。", "固定資産税の1.4％は標準税率であり、市町村が異なる税率を定めることができる。", "一般住宅用地の固定資産税の課税標準は、価格の6分の1である。", "不動産取得税は、相続による取得には課されない。"], "a": 2, "e": "正解は「一般住宅用地の固定資産税の課税標準は、価格の6分の1である。」です。\n【根拠】一般住宅用地（200㎡超の部分）は3分の1、小規模住宅用地（200㎡以下の部分）が6分の1です。\n【ひっかけ】都市計画税は3分の2・3分の1です。"}, {"id": "mc:ec9661e67d", "c": 5, "s": "問題5-6", "st": 2, "q": "居住用財産の譲渡に関する特例について、次の記述のうち最も適切なものはどれか。", "o": ["3,000万円特別控除は、所有期間が10年を超えていなければ適用を受けられない。", "3,000万円特別控除は、子に譲渡した場合にも適用を受けられる。", "軽減税率の特例は、3,000万円特別控除と併用できる。", "特定の居住用財産の買換え特例は、3,000万円特別控除と併用できる。"], "a": 2, "e": "正解は「軽減税率の特例は、3,000万円特別控除と併用できる。」です。\n【根拠】3,000万円特別控除と軽減税率の特例は併用できます。\n【ひっかけ】3,000万円特別控除に所有期間の要件はなく、子（直系血族）への譲渡は対象外、買換え特例とは選択適用です。"}, {"id": "mc:4671cb007a", "c": 5, "s": "問題5-6", "st": 2, "q": "所有期間12年の居住用財産を譲渡し、譲渡益が7,000万円であった。3,000万円特別控除と軽減税率の特例を適用した場合の税額（所得税・復興特別所得税・住民税の合計）として、正しいものはどれか。", "o": ["568.4万円", "812.6万円", "994.7万円", "1,422.1万円"], "a": 0, "e": "正解は「568.4万円」です。\n【根拠】課税長期譲渡所得＝7,000万－3,000万＝4,000万円。6,000万円以下なので14.21％。4,000万×14.21％＝568.4万円です。\n【ひっかけ】軽減税率を使わず20.315％で計算すると812.6万円になります。"}, {"id": "mc:359581f407", "c": 5, "s": "問題5-6", "st": 2, "q": "土地の有効活用の方式に関する次の記述のうち、最も適切なものはどれか。", "o": ["事業受託方式では、デベロッパーが建設資金を負担する。", "等価交換方式では、土地所有者は建設資金を負担せずに建物の一部を取得できる。", "建設協力金方式では、建物はテナントの所有となる。", "定期借地権方式では、土地所有者が建物の建設資金を負担する。"], "a": 1, "e": "正解は「等価交換方式では、土地所有者は建設資金を負担せずに建物の一部を取得できる。」です。\n【根拠】等価交換方式は、土地を出資して建物の一部（と土地の一部）を取得します。\n【ひっかけ】事業受託方式は土地所有者が資金を負担、建設協力金方式は建物が土地所有者の所有、定期借地権方式は資金負担なしです。"}, {"id": "mc:d0cc7df039", "c": 5, "s": "問題5-6", "st": 2, "q": "取得費が不明な土地を5,000万円で譲渡し、仲介手数料などの譲渡費用が150万円かかった。概算取得費を用いた場合の譲渡所得の金額（特別控除前）として、正しいものはどれか。", "o": ["4,500万円", "4,600万円", "4,750万円", "4,850万円"], "a": 1, "e": "正解は「4,600万円」です。\n【根拠】概算取得費＝5,000万円×5％＝250万円。5,000万－250万－150万＝4,600万円です。\n【ひっかけ】譲渡費用を差し引き忘れると4,750万円、取得費を差し引き忘れると4,850万円になります。"}, {"id": "mc:bcc5d78847", "c": 5, "s": "問題5-6", "st": 2, "q": "居住用財産の譲渡に関する次の記述のうち、最も適切なものはどれか。", "o": ["相続した土地の所有期間は、相続した日から計算する。", "固定資産税の精算金は、譲渡収入金額に含めない。", "居住しなくなってから3年を経過する日の属する年の12月31日までの譲渡なら、3,000万円特別控除を受けられる。", "居住用財産の譲渡損失は、どのような場合も損益通算できない。"], "a": 2, "e": "正解は「居住しなくなってから3年を経過する日の属する年の12月31日までの譲渡なら、3,000万円特別控除を受けられる。」です。\n【根拠】居住しなくなった日から3年を経過する日の属する年の年末までの譲渡が対象です。\n【ひっかけ】相続は取得時期を引き継ぎ、精算金は収入に含め、一定の居住用財産の譲渡損失は損益通算できます。"}, {"id": "mc:49d1bcfc63", "c": 5, "s": "問題5-6", "st": 2, "q": "不動産の投資判断に関する次の記述のうち、最も適切なものはどれか。", "o": ["NPVがマイナスであれば、投資に値すると判断する。", "IRRが期待収益率を上回れば、投資に値すると判断する。", "借入金の金利が利回りより高いと、自己資金の利回りは高まる。", "表面利回りは、諸経費を差し引いて計算する。"], "a": 1, "e": "正解は「IRRが期待収益率を上回れば、投資に値すると判断する。」です。\n【根拠】IRRが期待収益率を上回れば投資に値します。\n【ひっかけ】NPVはプラスなら有利、レバレッジは金利が利回りより低いときに効き、表面利回りは諸経費を差し引きません。"}, {"id": "mc:cdc57fa7fb", "c": 5, "s": "問題5-6", "st": 2, "q": "年間賃料収入1,200万円、諸経費300万円、投資総額2億円の賃貸不動産について、表面利回りとNOI利回りの組合せとして正しいものはどれか。", "o": ["表面6.0％／NOI4.5％", "表面4.5％／NOI6.0％", "表面6.0％／NOI7.5％", "表面7.5％／NOI6.0％"], "a": 0, "e": "正解は「表面6.0％／NOI4.5％」です。\n【根拠】表面利回り＝1,200万÷2億＝6.0％、NOI利回り＝（1,200万－300万）÷2億＝4.5％です。\n【ひっかけ】NOI利回りは表面利回りより低くなります。"}, {"id": "mc:906f212a21", "c": 5, "s": "問題5-6", "st": 2, "q": "居住用財産の譲渡の特例に関する次の記述のうち、最も適切なものはどれか。", "o": ["3,000万円特別控除は、所有期間10年超が要件である。", "軽減税率の特例は、譲渡年の1月1日の所有期間10年超が要件である。", "買換え特例と3,000万円特別控除は併用できる。", "長期・短期の判定は、譲渡日までの所有期間で行う。"], "a": 1, "e": "正解は「軽減税率の特例は、譲渡年の1月1日の所有期間10年超が要件である。」です。\n【根拠】軽減税率の特例は所有期間10年超が要件です。\n【ひっかけ】3,000万円特別控除は所有期間を問わず、買換え特例とは選択、判定は1月1日時点です。"}, {"id": "mc:f249f103cd", "c": 6, "s": "問題6-1", "st": 2, "q": "相続時精算課税に関する次の記述のうち、最も適切なものはどれか。", "o": ["贈与者は、贈与をした年の1月1日において65歳以上の父母・祖父母である。", "特別控除額の累計額は3,000万円である。", "特別控除額を超える部分の税率は一律20％である。", "一度選択した後でも、翌年以降は暦年課税に戻ることができる。"], "a": 2, "e": "正解は「特別控除額を超える部分の税率は一律20％である。」です。\n【根拠】特別控除額（累計2,500万円）と基礎控除（年110万円）を超える部分には一律20％が課されます。\n【ひっかけ】贈与者は60歳以上、特別控除額は2,500万円、暦年課税には戻れません。"}, {"id": "mc:b5288d67eb", "c": 6, "s": "問題6-1", "st": 2, "q": "婚姻期間25年の妻が、夫から居住用不動産（評価額2,500万円）の贈与を受け、贈与税の配偶者控除の適用を受けた。その年に他の贈与はない。贈与税の課税価格（基礎控除後）として正しいものはどれか。", "o": ["0円", "390万円", "500万円", "2,390万円"], "a": 1, "e": "正解は「390万円」です。\n【根拠】2,500万円－配偶者控除2,000万円－基礎控除110万円＝390万円です。\n【ひっかけ】基礎控除を引き忘れると500万円になります。"}, {"id": "mc:297ee12181", "c": 6, "s": "問題6-1", "st": 2, "q": "相続時精算課税を選択した子が、同じ年に父から3,000万円の贈与を受けた（過去に精算課税の贈与はない）。その年の贈与税額として正しいものはどれか。", "o": ["0円", "78万円", "100万円", "122万円"], "a": 1, "e": "正解は「78万円」です。\n【根拠】3,000万円－基礎控除110万円－特別控除2,500万円＝390万円。390万円×20％＝78万円です。\n【ひっかけ】基礎控除を引き忘れると100万円になります。"}, {"id": "mc:183ef5c8b8", "c": 6, "s": "問題6-1", "st": 2, "q": "贈与税が課されないものとして、最も適切なものはどれか。", "o": ["父から著しく低い価額で土地を譲り受けた場合の時価との差額", "母に借金を免除してもらった場合の免除額", "扶養義務者から受けた教育費のうち、必要な都度直接充てた通常必要な額", "父が保険料を負担した保険の満期保険金を子が受け取った場合の保険金"], "a": 2, "e": "正解は「扶養義務者から受けた教育費のうち、必要な都度直接充てた通常必要な額」です。\n【根拠】通常必要な生活費・教育費で、必要な都度直接充てるものは非課税です。\n【ひっかけ】低額譲受・債務免除・保険料を負担していない満期保険金は、みなし贈与財産です。"}, {"id": "mc:8dc77ac7d2", "c": 6, "s": "問題6-1", "st": 2, "q": "父と母からそれぞれ200万円ずつ、合計400万円の贈与を受けた子（20歳）の暦年課税における贈与税の課税価格（基礎控除後）として、正しいものはどれか。", "o": ["180万円", "290万円", "310万円", "400万円"], "a": 1, "e": "正解は「290万円」です。\n【根拠】基礎控除は受贈者1人あたり110万円です。400万－110万＝290万円です。\n【ひっかけ】贈与者ごとに110万円を差し引くと180万円になりますが、誤りです。"}, {"id": "mc:c722562e78", "c": 6, "s": "問題6-1", "st": 2, "q": "贈与税の特例に関する次の記述のうち、最も適切なものはどれか。", "o": ["贈与税の配偶者控除の婚姻期間は、1年未満の端数を切り上げて計算する。", "贈与税の配偶者控除は、税額がゼロであれば申告不要である。", "住宅取得等資金の贈与の非課税は、相続時精算課税と併用できる。", "贈与税は物納できる。"], "a": 2, "e": "正解は「住宅取得等資金の贈与の非課税は、相続時精算課税と併用できる。」です。\n【根拠】住宅取得等資金の非課税は、暦年課税・精算課税どちらとも併用できます。\n【ひっかけ】婚姻期間は切捨て、配偶者控除は申告が必要、贈与税は物納できません。"}, {"id": "mc:6479d1a158", "c": 6, "s": "問題6-1", "st": 2, "q": "贈与に関する次の記述のうち、最も適切なものはどれか。", "o": ["書面による贈与は、履行前なら自由に解除できる。", "贈与税の申告書は、贈与者の住所地の税務署長に提出する。", "相続時精算課税の特別控除額は、贈与者ごとに累計2,500万円である。", "住宅取得等資金の贈与の非課税は、配偶者からの贈与にも適用される。"], "a": 2, "e": "正解は「相続時精算課税の特別控除額は、贈与者ごとに累計2,500万円である。」です。\n【根拠】特別控除額は、贈与者ごとの累計で2,500万円です。\n【ひっかけ】書面による贈与は解除できず、申告先は受贈者の住所地、住宅資金の非課税は直系尊属からの贈与に限られます。"}, {"id": "mc:1cfcdbdab9", "c": 6, "s": "問題6-2", "st": 2, "q": "被相続人の相続人が、配偶者、長男、長女（既に死亡）の子である孫2人の場合、孫1人の法定相続分として正しいものはどれか。", "o": ["4分の1", "6分の1", "8分の1", "12分の1"], "a": 2, "e": "正解は「8分の1」です。\n【根拠】配偶者2分の1、子の分2分の1を長男と長女で4分の1ずつ。長女の4分の1を孫2人で分けるので、孫1人は8分の1です。\n【ひっかけ】代襲相続人は、被代襲者の相続分を均等に分けます。"}, {"id": "mc:ab9f2148b5", "c": 6, "s": "問題6-2", "st": 2, "q": "被相続人の相続人が、配偶者と父・母の3人である場合、父の法定相続分として正しいものはどれか。", "o": ["1/3", "1/4", "1/6", "1/8"], "a": 2, "e": "正解は「1/6」です。\n【根拠】配偶者2/3、直系尊属1/3。父母で均等に分けるため、父は1/3×1/2＝1/6です。\n【ひっかけ】配偶者と子の場合（子1/2）と混同しないようにします。"}, {"id": "mc:bb962adbcc", "c": 6, "s": "問題6-2", "st": 2, "q": "被相続人の相続人が父と母の2人である場合、父の遺留分の割合として正しいものはどれか。", "o": ["1/2", "1/3", "1/4", "1/6"], "a": 3, "e": "正解は「1/6」です。\n【根拠】直系尊属のみが相続人の場合、遺留分全体は1/3。父の法定相続分1/2を掛けて、1/3×1/2＝1/6です。\n【ひっかけ】遺留分全体を1/2とすると1/4になります。"}, {"id": "mc:d0cf341055", "c": 6, "s": "問題6-2", "st": 2, "q": "遺言に関する次の記述のうち、最も適切なものはどれか。", "o": ["公正証書遺言は、家庭裁判所の検認が必要である。", "秘密証書遺言は、検認が不要である。", "法務局で保管された自筆証書遺言は、検認が不要である。", "遺言は、いったん作成すると撤回できない。"], "a": 2, "e": "正解は「法務局で保管された自筆証書遺言は、検認が不要である。」です。\n【根拠】自筆証書遺言書保管制度を利用した遺言書は、検認が不要です。\n【ひっかけ】公正証書遺言は検認不要、秘密証書遺言は検認が必要、遺言はいつでも撤回できます。"}, {"id": "mc:9fa294c75a", "c": 6, "s": "問題6-2", "st": 2, "q": "民法上の相続に関する次の記述のうち、最も不適切なものはどれか。", "o": ["内縁の配偶者は、法定相続人とならない。", "嫡出でない子の相続分は、嫡出子と同じである。", "相続財産の一部を売却すると、単純承認したものとみなされる。", "相続の放棄は、受理後3か月以内なら撤回できる。"], "a": 3, "e": "正解は「相続の放棄は、受理後3か月以内なら撤回できる。」です。\n【根拠】受理された相続の放棄は撤回できません。\n【ひっかけ】放棄は慎重に判断する必要があります。"}, {"id": "mc:a7e0574a9d", "c": 6, "s": "問題6-2", "st": 2, "q": "遺言・遺留分に関する次の記述のうち、最も適切なものはどれか。", "o": ["遺言は、20歳以上でなければすることができない。", "推定相続人は、公正証書遺言の証人になれる。", "相続開始前の遺留分の放棄には、家庭裁判所の許可が必要である。", "遺留分侵害額請求は、財産そのものの返還を請求するものである。"], "a": 2, "e": "正解は「相続開始前の遺留分の放棄には、家庭裁判所の許可が必要である。」です。\n【根拠】生前の遺留分放棄には家庭裁判所の許可が必要です。\n【ひっかけ】遺言は15歳以上、推定相続人は証人になれず、遺留分侵害額請求は金銭の請求です。"}, {"id": "mc:310ec9fc5d", "c": 6, "s": "問題6-2", "st": 2, "q": "被相続人の相続人が、配偶者と、父母の双方を同じくする兄、父だけを同じくする弟の3人である場合、弟の法定相続分として正しいものはどれか。", "o": ["1/8", "1/12", "1/6", "1/4"], "a": 1, "e": "正解は「1/12」です。\n【根拠】兄弟姉妹の相続分は全体の1/4。兄と弟は2：1で分けるので、弟は1/4×1/3＝1/12、兄は1/4×2/3＝1/6です。\n【ひっかけ】均等に分けると1/8になってしまいます。半血兄弟姉妹は全血の2分の1です。"}, {"id": "mc:e244f88368", "c": 6, "s": "問題6-2", "st": 2, "q": "民法上の相続に関する次の記述のうち、最も適切なものはどれか。", "o": ["相続を放棄した子の子は、代襲相続人となる。", "特別養子は、実父母の相続人にもなる。", "限定承認は、相続人全員が共同して行う必要がある。", "兄弟姉妹にも遺留分がある。"], "a": 2, "e": "正解は「限定承認は、相続人全員が共同して行う必要がある。」です。\n【根拠】限定承認は相続人全員で行います。\n【ひっかけ】放棄は代襲原因でなく、特別養子は実父母の相続人にならず、兄弟姉妹に遺留分はありません。"}, {"id": "mc:03609d93c2", "c": 6, "s": "問題6-2", "st": 2, "q": "被相続人の相続人が配偶者と子2人の場合、子1人の遺留分の割合として正しいものはどれか。", "o": ["1/4", "1/6", "1/8", "1/12"], "a": 2, "e": "正解は「1/8」です。\n【根拠】遺留分全体は1/2。子の法定相続分は1/2×1/2＝1/4。子1人の遺留分は1/2×1/4＝1/8です。\n【ひっかけ】法定相続分（1/4）と遺留分（1/8）を混同しないようにします。"}, {"id": "mc:0c127661ba", "c": 6, "s": "問題6-3", "st": 2, "q": "相続人が配偶者・長男・長女の3人で、長女が相続を放棄した場合、遺産に係る基礎控除額として正しいものはどれか。", "o": ["4,200万円", "4,800万円", "5,400万円", "6,000万円"], "a": 1, "e": "正解は「4,800万円」です。\n【根拠】相続を放棄した者も法定相続人の数に含めるため、3,000万円＋600万円×3人＝4,800万円です。\n【ひっかけ】放棄した長女を除いて2人で計算すると4,200万円となり誤りです。"}, {"id": "mc:75d796fa00", "c": 6, "s": "問題6-3", "st": 2, "q": "相続税額の2割加算の対象となる者として、最も適切なものはどれか。", "o": ["被相続人の配偶者", "被相続人の父母", "代襲相続人である被相続人の孫", "被相続人の兄弟姉妹"], "a": 3, "e": "正解は「被相続人の兄弟姉妹」です。\n【根拠】兄弟姉妹は、配偶者・1親等の血族のいずれにも当たらないため、2割加算の対象です。\n【ひっかけ】父母は1親等の血族、代襲相続人の孫は除外されます。"}, {"id": "mc:7cac0adfb9", "c": 6, "s": "問題6-3", "st": 2, "q": "被相続人に実子がなく、相続人が配偶者と養子3人である場合、相続税の遺産に係る基礎控除額として正しいものはどれか。", "o": ["4,200万円", "4,800万円", "5,400万円", "6,000万円"], "a": 1, "e": "正解は「4,800万円」です。\n【根拠】実子がいない場合、算入できる養子は2人まで。法定相続人の数は3人で、3,000万＋600万×3＝4,800万円です。\n【ひっかけ】養子3人を全員数えると5,400万円になります。"}, {"id": "mc:7daf5c85d5", "c": 6, "s": "問題6-3", "st": 2, "q": "相続人3人のうち1人が、被相続人の死亡保険金3,000万円を受け取った（他に受け取った者はいない）。相続税の課税価格に算入される保険金の額として正しいものはどれか。", "o": ["0円", "1,500万円", "2,500万円", "3,000万円"], "a": 1, "e": "正解は「1,500万円」です。\n【根拠】非課税金額＝500万円×法定相続人3人＝1,500万円。3,000万－1,500万＝1,500万円です。\n【ひっかけ】非課税金額は、相続人1人あたり500万円ではなく、500万円×法定相続人の数の全体の枠です。"}, {"id": "mc:78e4939856", "c": 6, "s": "問題6-3", "st": 2, "q": "相続税の申告が必要となる場合として、最も適切なものはどれか（いずれも各種特例を適用しなければ課税価格の合計額が基礎控除額を超えるものとする）。", "o": ["小規模宅地等の特例を適用すると課税価格の合計額が基礎控除額以下となる場合", "生命保険金の非課税金額を差し引くと課税価格の合計額が基礎控除額以下となる場合", "死亡退職金の非課税金額を差し引くと課税価格の合計額が基礎控除額以下となる場合", "債務控除により課税価格の合計額が基礎控除額以下となる場合"], "a": 0, "e": "正解は「小規模宅地等の特例を適用すると課税価格の合計額が基礎控除額以下となる場合」です。\n【根拠】小規模宅地等の特例は、申告することが適用の要件です。特例を使って基礎控除以下になる場合も申告が必要です。\n【ひっかけ】非課税金額や債務控除は、申告をしなくても差し引いて計算できます。"}, {"id": "mc:efd91683f5", "c": 6, "s": "問題6-3", "st": 2, "q": "相続税の課税価格に関する次の記述のうち、最も適切なものはどれか。", "o": ["死亡後5年以内に支給が確定した死亡退職金は、相続財産とみなされる。", "業務上の死亡による弔慰金は、普通給与の3年分まで非課税である。", "香典返しの費用は、葬式費用として控除できる。", "相続を放棄した者は、自ら負担した葬式費用も控除できない。"], "a": 1, "e": "正解は「業務上の死亡による弔慰金は、普通給与の3年分まで非課税である。」です。\n【根拠】業務上の死亡は3年分、業務外は6か月分までが非課税です。\n【ひっかけ】死亡退職金は3年以内、香典返しは控除不可、放棄者でも負担した葬式費用は控除できます。"}, {"id": "mc:825d39e53a", "c": 6, "s": "問題6-3", "st": 2, "q": "相続税額の加算・控除に関する次の記述のうち、最も不適切なものはどれか。", "o": ["代襲相続人でない孫養子は、2割加算の対象となる。", "配偶者に対する相続税額の軽減は、内縁の配偶者にも適用される。", "相次相続控除は、前回の相続から10年以内の場合に適用される。", "生前贈与加算された財産の贈与税額は、相続税額から控除できる。"], "a": 1, "e": "正解は「配偶者に対する相続税額の軽減は、内縁の配偶者にも適用される。」です。\n【根拠】配偶者の税額軽減は、法律上の配偶者だけが対象です。\n【ひっかけ】内縁の配偶者は相続人でもありません。"}, {"id": "mc:a1e2c3b03a", "c": 6, "s": "問題6-3", "st": 2, "q": "被相続人の相続人が、配偶者・実子1人・養子2人の場合、相続税の遺産に係る基礎控除額として正しいものはどれか。", "o": ["4,800万円", "5,400万円", "4,200万円", "6,000万円"], "a": 0, "e": "正解は「4,800万円」です。\n【根拠】実子がいるため、算入できる養子は1人。法定相続人の数は配偶者・実子・養子1人の3人で、3,000万円＋600万円×3＝4,800万円です。\n【ひっかけ】養子2人を数えると5,400万円になります。"}, {"id": "mc:170f350afa", "c": 6, "s": "問題6-3", "st": 2, "q": "相続税の計算に関する次の記述のうち、最も不適切なものはどれか。", "o": ["兄弟姉妹は、2割加算の対象となる。", "未成年者控除は、18歳に達するまでの年数1年につき10万円である。", "相続税の申告期限は、相続の開始を知った日の翌日から6か月以内である。", "被相続人の確実な債務は、債務控除の対象となる。"], "a": 2, "e": "正解は「相続税の申告期限は、相続の開始を知った日の翌日から6か月以内である。」です。\n【根拠】相続税の申告期限は10か月以内です。\n【ひっかけ】準確定申告は4か月、相続放棄は3か月です。"}, {"id": "mc:086418b78a", "c": 6, "s": "問題6-4", "st": 2, "q": "自用地評価額1億円、借地権割合60％、借家権割合30％、賃貸割合100％の貸家建付地の評価額として、正しいものはどれか。", "o": ["4,000万円", "7,000万円", "8,200万円", "9,400万円"], "a": 2, "e": "正解は「8,200万円」です。\n【根拠】1億円×（1－0.6×0.3×1.0）＝1億円×0.82＝8,200万円です。\n【ひっかけ】貸宅地として計算すると1億円×（1－0.6）＝4,000万円になります。"}, {"id": "mc:92a9a4cb82", "c": 6, "s": "問題6-4", "st": 2, "q": "小規模宅地等の特例の限度面積と減額割合の組合せとして、最も適切なものはどれか。", "o": ["特定居住用宅地等：330㎡・80％", "特定事業用宅地等：330㎡・80％", "貸付事業用宅地等：200㎡・80％", "特定居住用宅地等：240㎡・50％"], "a": 0, "e": "正解は「特定居住用宅地等：330㎡・80％」です。\n【根拠】特定居住用宅地等は330㎡・80％です。\n【ひっかけ】特定事業用宅地等は400㎡・80％、貸付事業用宅地等は200㎡・50％です。"}, {"id": "mc:1fd2a28934", "c": 6, "s": "問題6-4", "st": 2, "q": "自用地評価額5,000万円、借地権割合70％、借家権割合30％、賃貸割合80％の貸家建付地の評価額として、正しいものはどれか。", "o": ["1,500万円", "3,950万円", "4,160万円", "4,750万円"], "a": 2, "e": "正解は「4,160万円」です。\n【根拠】5,000万円×（1－0.7×0.3×0.8）＝5,000万円×0.832＝4,160万円です。\n【ひっかけ】賃貸割合を考慮しないと3,950万円になります。"}, {"id": "mc:56718277df", "c": 6, "s": "問題6-4", "st": 2, "q": "相続税評価額6,000万円・面積300㎡の貸付事業用宅地等について、小規模宅地等の特例を最大限適用した後の評価額として、正しいものはどれか。", "o": ["2,000万円", "3,000万円", "4,000万円", "4,800万円"], "a": 2, "e": "正解は「4,000万円」です。\n【根拠】200㎡まで50％減額。減額＝6,000万円×200/300×50％＝2,000万円。6,000万－2,000万＝4,000万円です。\n【ひっかけ】全体を50％減額すると3,000万円になります。"}, {"id": "mc:5fd1b71547", "c": 6, "s": "問題6-4", "st": 2, "q": "相続税における財産の評価に関する次の記述のうち、最も不適切なものはどれか。", "o": ["自用家屋は、固定資産税評価額×1.0で評価する。", "建築中の家屋は、費用現価の70％で評価する。", "使用貸借により子が借りている親の土地は、貸宅地として評価する。", "取引相場のあるゴルフ会員権は、通常の取引価格の70％で評価する。"], "a": 2, "e": "正解は「使用貸借により子が借りている親の土地は、貸宅地として評価する。」です。\n【根拠】使用貸借で貸している土地は、自用地として評価します。\n【ひっかけ】使用貸借による借地権の価額はゼロだからです。"}, {"id": "mc:d87e58cd9b", "c": 6, "s": "問題6-4", "st": 2, "q": "自用地評価額8,000万円、借地権割合70％の宅地に設定された借地権の相続税評価額として、正しいものはどれか。", "o": ["2,400万円", "4,000万円", "5,600万円", "8,000万円"], "a": 2, "e": "正解は「5,600万円」です。\n【根拠】借地権＝自用地評価額×借地権割合＝8,000万円×70％＝5,600万円です。\n【ひっかけ】貸宅地（底地）なら8,000万円×（1－70％）＝2,400万円です。"}, {"id": "mc:cca810cfb5", "c": 6, "s": "問題6-4", "st": 2, "q": "小規模宅地等の特例に関する次の記述のうち、最も適切なものはどれか。", "o": ["同居親族が取得した特定居住用宅地等は、申告期限前に売却しても適用を受けられる。", "配偶者が取得した特定居住用宅地等は、申告期限まで居住し続けなければ適用を受けられない。", "特定居住用宅地等と特定事業用宅地等は、合計730㎡まで併用できる。", "相続開始前3年以内に貸付けを始めた宅地も、原則として貸付事業用宅地等に該当する。"], "a": 2, "e": "正解は「特定居住用宅地等と特定事業用宅地等は、合計730㎡まで併用できる。」です。\n【根拠】330㎡＋400㎡＝730㎡まで併用できます。\n【ひっかけ】同居親族は保有・居住継続が必要、配偶者は要件なし、3年以内の新規貸付けは原則対象外です。"}, {"id": "mc:f326228893", "c": 6, "s": "問題6-4", "st": 2, "q": "取引相場のない株式の評価に関する次の記述のうち、最も不適切なものはどれか。", "o": ["同族株主等が取得した大会社の株式は、原則として類似業種比準方式で評価する。", "中会社の株式は、類似業種比準方式と純資産価額方式の併用で評価する。", "同族株主以外の株主等が取得した株式は、原則として配当還元方式で評価する。", "純資産価額方式では、評価差額の50％を法人税等相当額として控除する。"], "a": 3, "e": "正解は「純資産価額方式では、評価差額の50％を法人税等相当額として控除する。」です。\n【根拠】控除するのは評価差額の37％です。\n【ひっかけ】類似業種比準方式の比準要素は、配当・利益・純資産です。"}, {"id": "mc:a92de5b957", "c": 6, "s": "問題6-4", "st": 2, "q": "自用地評価額1億円の宅地（特定居住用宅地等、面積400㎡）について、小規模宅地等の特例を最大限適用した場合の相続税の課税価格に算入する価額として、正しいものはどれか。", "o": ["2,000万円", "3,400万円", "5,000万円", "8,250万円"], "a": 1, "e": "正解は「3,400万円」です。\n【根拠】330㎡分が80％減額されます。減額＝1億円×330/400×80％＝6,600万円。1億円－6,600万円＝3,400万円です。\n【ひっかけ】全体を80％減額すると2,000万円ですが、限度面積は330㎡です。"}, {"id": "mc:22a743904c", "c": 6, "s": "問題6-4", "st": 2, "q": "相続財産の評価に関する次の記述のうち、最も適切なものはどれか。", "o": ["貸宅地は、自用地評価額×借地権割合で評価する。", "上場株式は、課税時期の終値のみで評価する。", "生命保険契約に関する権利は、解約返戻金相当額で評価する。", "貸付事業用宅地等は、400㎡まで80％減額される。"], "a": 2, "e": "正解は「生命保険契約に関する権利は、解約返戻金相当額で評価する。」です。\n【根拠】生命保険契約に関する権利は、解約返戻金相当額です。\n【ひっかけ】貸宅地は×（1－借地権割合）、上場株式は4つの価額のうち最も低いもの、貸付事業用は200㎡・50％です。"}, {"id": "mc:65298bd5f0", "c": 6, "s": "問題6-5", "st": 2, "q": "相続税の申告・納付に関する次の記述のうち、最も適切なものはどれか。", "o": ["申告書は、相続人の住所地の税務署長に提出する。", "各相続人は、他の相続人の相続税について連帯納付義務を負う。", "小規模宅地等の特例を受けた土地の物納の収納価額は、特例適用前の価額である。", "相続税は物納できない。"], "a": 1, "e": "正解は「各相続人は、他の相続人の相続税について連帯納付義務を負う。」です。\n【根拠】受けた利益を限度に連帯納付義務を負います。\n【ひっかけ】提出先は被相続人の住所地、収納価額は特例適用後、相続税は物納できます。"}, {"id": "mc:5fc9a5905b", "c": 6, "s": "問題6-5", "st": 2, "q": "非上場株式等の相続税の納税猶予（特例措置）に関する次の記述のうち、最も適切なものはどれか。", "o": ["対象株式は発行済議決権株式の3分の2までである。", "猶予される割合は、相続税の80％である。", "対象株式に上限はなく、相続税の全額が猶予される。", "特例承継計画の提出は不要である。"], "a": 2, "e": "正解は「対象株式に上限はなく、相続税の全額が猶予される。」です。\n【根拠】特例措置は全株・100％です。\n【ひっかけ】3分の2・80％は一般措置です。特例措置には特例承継計画の提出が必要です。"}, {"id": "mc:49c6d890bc", "c": 6, "s": "問題6-5", "st": 2, "q": "相続税の納付に関する次の記述のうち、最も適切なものはどれか。", "o": ["延納の許可を受けるには、原則として担保の提供が必要である。", "金銭一時納付が困難なら、延納を経ずに物納できる。", "納税猶予を受けた後継者が死亡すると、猶予税額を直ちに納付しなければならない。", "物納の第1順位には、動産が含まれる。"], "a": 0, "e": "正解は「延納の許可を受けるには、原則として担保の提供が必要である。」です。\n【根拠】延納には原則として担保が必要です。\n【ひっかけ】物納は延納でも困難な場合のみ、後継者の死亡で猶予税額は免除、第1順位は不動産・国債・上場株式などです。"}, {"id": "mc:cd2db1ad47", "c": 6, "s": "問題6-6", "st": 2, "q": "成年後見制度に関する次の記述のうち、最も不適切なものはどれか。", "o": ["法定後見制度には、後見・保佐・補助の3類型がある。", "任意後見契約は、公正証書によって締結する。", "任意後見契約は、契約を締結した時点で効力が生じる。", "成年後見人が成年被後見人の居住用不動産を売却するには、家庭裁判所の許可が必要である。"], "a": 2, "e": "正解は「任意後見契約は、契約を締結した時点で効力が生じる。」です。\n【根拠】任意後見契約は、家庭裁判所が任意後見監督人を選任した時から効力が生じます。\n【ひっかけ】判断能力があるうちに契約し、低下した後に効力が生じる仕組みです。"}, {"id": "mc:dfdd6f29f8", "c": 6, "s": "問題6-6", "st": 2, "q": "遺産分割に関する次の記述のうち、最も適切なものはどれか。", "o": ["代償分割で代償金を受け取った相続人の課税価格には、代償金は加算されない。", "被相続人は、遺言で相続開始から5年を超えない期間、遺産の分割を禁止できる。", "換価分割は、特定の相続人が財産を取得し、他の相続人に金銭を支払う方法である。", "遺産分割協議は、相続人の過半数の合意で成立する。"], "a": 1, "e": "正解は「被相続人は、遺言で相続開始から5年を超えない期間、遺産の分割を禁止できる。」です。\n【根拠】遺言による分割の禁止は、5年を超えない期間に限られます。\n【ひっかけ】代償金は受け取った者の課税価格に加算します。財産を取得して他の相続人に金銭を払うのは代償分割で、換価分割は財産を売って代金を分ける方法です。分割協議は相続人全員の合意が必要です。"}, {"id": "mc:46fff7526d", "c": 6, "s": "問題6-6", "st": 2, "q": "成年後見制度・信託に関する次の記述のうち、最も不適切なものはどれか。", "o": ["後見開始の審判は、4親等内の親族も請求できる。", "成年被後見人の日用品の購入は、取り消すことができない。", "被保佐人が不動産を売却するには、保佐人の同意が必要である。", "民事信託の信託財産から生じる利益は、原則として受託者に課税される。"], "a": 3, "e": "正解は「民事信託の信託財産から生じる利益は、原則として受託者に課税される。」です。\n【根拠】原則として受益者に課税されます。\n【ひっかけ】受託者は財産の管理を行うだけで、利益は受益者に帰属します。"}]};

function mergeDD(a,b){const o={};[a||{},b||{}].forEach(x=>{for(const k in x){o[k]=o[k]||{};for(const t in x[k])o[k][t]=Math.max(o[k][t]||0,x[k][t]||0);}});return o;}
function sumDD(dd){const o={};for(const k in dd||{})for(const t in dd[k])o[t]=(o[t]||0)+dd[k][t];return o;}
// 暗記の回転の記録は、両方の日付を合わせる
function mergeRounds(a,b){const o={...(a||{})};for(const k in b||{}){o[k]=[...new Set([...(o[k]||[]),...(b[k]||[])])].sort((x,y)=>x-y);}return o;}

const BK_DB=KEY+"-bk";
function bkOpen(){ return new Promise((res,rej)=>{ try{ if(!window.indexedDB) return rej(new Error("noidb")); const r=indexedDB.open(BK_DB,1);
  r.onupgradeneeded=()=>{ const db=r.result; if(!db.objectStoreNames.contains("snaps")) db.createObjectStore("snaps",{keyPath:"id"}); };
  r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error||new Error("idb")); r.onblocked=()=>rej(new Error("blocked")); }catch(e){ rej(e); } }); }
function bkPut(rec){ return bkOpen().then(db=>new Promise((res,rej)=>{ const tx=db.transaction("snaps","readwrite"); tx.objectStore("snaps").put(rec); tx.oncomplete=()=>{db.close();res(true);}; tx.onerror=()=>{db.close();rej(tx.error);}; tx.onabort=()=>{db.close();rej(tx.error);}; })); }
function bkAll(){ return bkOpen().then(db=>new Promise((res,rej)=>{ const tx=db.transaction("snaps","readonly"); const rq=tx.objectStore("snaps").getAll(); rq.onsuccess=()=>{db.close();res(rq.result||[]);}; rq.onerror=()=>{db.close();rej(rq.error);}; })); }
function bkDel(ids){ if(!ids.length) return Promise.resolve(); return bkOpen().then(db=>new Promise(res=>{ const tx=db.transaction("snaps","readwrite"); const st=tx.objectStore("snaps"); ids.forEach(id=>st.delete(id)); tx.oncomplete=()=>{db.close();res();}; tx.onerror=()=>{db.close();res();}; })); }
// 古い控えの整理：毎日の控えは新しい14日分、操作直前の控えは新しい20件を残す（退避した壊れたデータは消さない）
function bkPrune(){ return bkAll().then(all=>{ const day=all.filter(r=>r.kind==="day").sort((a,b)=>b.at-a.at), op=all.filter(r=>r.kind==="op").sort((a,b)=>b.at-a.at);
  return bkDel(day.slice(14).map(r=>r.id).concat(op.slice(20).map(r=>r.id))); }).catch(()=>{}); }
function snapData(){ return JSON.stringify(Object.assign(exportObj(),{at:new Date().toISOString()})); }
function snapshot(reason){ let data; try{ data=snapData(); }catch(e){ return Promise.resolve(false); }
  const at=Date.now(); return bkPut({id:"op-"+at+"-"+Math.random().toString(36).slice(2,6),kind:"op",reason,at,data}).then(()=>{ bkPrune(); return true; }).catch(()=>false); }
function dailySnapshot(){ const id="day-"+todayKey(); return bkAll().then(all=>{ if(all.some(r=>r.id===id)) return; return bkPut({id,kind:"day",reason:"day",at:Date.now(),data:snapData()}).then(bkPrune); }).catch(()=>{}); }
function rescueRaw(raw){
  const at=Date.now();
  try{ localStorage.setItem(KEY+"-rescue-"+at,raw); LOAD_RESCUE=KEY+"-rescue-"+at; }
  catch(e){ SAVE_BLOCKED=true; LOAD_RESCUE="idb"; } // 退避できるまで、元のデータを上書きしない
  bkPut({id:"rescue-"+at,kind:"rescue",reason:"rescue",at,data:raw}).then(()=>{ SAVE_BLOCKED=false; }).catch(()=>{});
}
function rescueKeys(){ const out=[]; try{ for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k&&k.indexOf(KEY+"-rescue-")===0) out.push(k); } }catch(e){} return out.sort(); }

function mergeOrphans(a,b){ const out={}; for(const k in ORPH_KEYS) out[k]=mergeMap((a&&a[k])||{},(b&&b[k])||{},ORPH_KEYS[k]); return out; }
function exportObj(){ return {app:"fp2-gakka",v:2,at:new Date().toISOString(),memo:store.memo,rounds:store.rounds,mistakes:store.mistakes,notes:store.notes,answered:store.answered,daily:store.daily,dd:store.dd||{},orphans:store.orphans||{},settings:store.settings,settingsAt:store.settingsAt||0,missReset:store.missReset||MISS_RESET}; }
function migrateMap(obj){
  const out={};
  for(const k in obj||{}){
    const nk=BYID[k]?k:(MIG[k]||null);
    if(!nk||!BYID[nk]) continue;
    if(!out[nk]) out[nk]=obj[k];
  }
  return out;
}
function upgradeAnswered(a){
  for(const id in a){
    const r=a[id];
    if(r.box===undefined){
      if(r.r==="ng"){r.box=0;r.due=(r.at||Date.now())+DAY;}
      else {r.box=3;r.due=(r.at||Date.now())+30*DAY;}
    }
  }
  return a;
}
function loadInto(s,isImport){
  const out={};
  // 前回この版で読めずに取っておいた記録（orphans）も、今の版で読めるようになっていれば戻す
  const po=(s.orphans&&typeof s.orphans==="object")?s.orphans:{};
  s=Object.assign({},s); out.orphans={};
  for(const k in ORPH_KEYS){ const src=Object.assign({},po[k]||{},s[k]||{}); s[k]=src; const o={};
    for(const id in src){ const nk=BYID[id]?id:(MIG[id]||null); if(!nk||!BYID[nk]) o[id]=src[id]; } out.orphans[k]=o; }
  out.notes=migrateMap(s.notes);
  out.daily=s.daily||{};
  out.memo=migrateMap(s.memo);
  out.rounds=s.rounds||{};
  // 以前の「覚えた」記録は、その規定の1回目として引き継ぐ
  for(const id in out.memo){ const q=BYID[id]; if(q&&q.pid&&!(out.rounds[q.pid]||[]).length) out.rounds[q.pid]=[out.memo[id].at]; }
  out.answered=upgradeAnswered(migrateMap(s.answered));
  // 読み込み時は、一度きりのリセット判定を通さない（書き出しに missReset がない
  // 古いテキストでも、間違いの記録をそのまま引き継ぐため）
  out.mistakes=(isImport||(s.missReset||0)>=MISS_RESET)?migrateMap(s.mistakes):{};
  out.settingsAt=s.settingsAt||0;
  out.settings=Object.assign({...DEFAULT_SETTINGS},s.settings||{}); if(![60,80,95].includes(out.settings.pass)) out.settings.pass=80; if(s.clozeLevel&&!(s.settings&&s.settings.clozeLevel)) out.settings.clozeLevel=s.clozeLevel;
  out.dd=(s.dd&&typeof s.dd==="object")?s.dd:{[(isImport?"imp-"+(s.at||"x"):"old-"+DEV)]:{...(s.daily||{})}};
  out.daily=sumDD(out.dd);
  return out;
}

function persist(){

    try{ localStorage.setItem(KEY,JSON.stringify(store)); lastSavedAt=Date.now(); saveWarned=false; }
    catch(e){ if(!saveWarned){ saveWarned=true; snapshot("savefail"); setTimeout(()=>toast("この端末に記録を保存できませんでした（空き容量不足など）。設定→記録で「ファイルに保存」をしておいてください。"),0); } }
  }
  if(!dbRef) return;

    try{await dbRef.set({mistakes:store.mistakes,notes:store.notes,answered:store.answered,daily:store.daily,dd:store.dd||{},memo:store.memo,rounds:store.rounds,settings:store.settings,settingsAt:store.settingsAt||0,missReset:store.missReset,orphans:store.orphans||{},v:2}); setSync("");}

// クリップボードへのコピー（iPhone・iPadでも確実にコピーできるよう、選択してコピーする方法を先に試す）
function copyText(txt){ return new Promise(res=>{ let ok=false;
  try{ const t=document.createElement("textarea"); t.value=txt; t.setAttribute("readonly",""); t.style.cssText="position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;font-size:16px"; document.body.appendChild(t);
    t.focus({preventScroll:true}); t.select(); t.setSelectionRange(0,txt.length);

// 貼り付けた記録を読む（前後の余分な文字や、メモ帳で変わった引用符も受け付ける）
function parseBackup(v){ v=String(v||"").replace(/[\u201C\u201D\u201E\u2033]/g,'"').replace(/[\u2018\u2019]/g,"'").replace(/\u00A0/g," "); const i=v.indexOf("{"), j=v.lastIndexOf("}"); if(i<0||j<i) throw new Error("fmt");
  let o; try{ o=JSON.parse(v.slice(i,j+1)); }catch(e){ throw new Error("fmt"); }
  if(o.app!=="fp2-gakka"){ const e=new Error("app"); e.app=o.app; throw e; } return o; }

function mergeRecords(d){

  store.answered=mergeMap(d.answered,store.answered||{},"at");

function mergeMap(a,b,key){const out={...a}; for(const k in b){ if(!out[k] || (b[k][key]||0)>(out[k][key]||0)) out[k]=b[k]; } return out;}

function todayKey(t){const d=new Date(t||Date.now());return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function schedule(id,ok){
  const now=Date.now(), a=store.answered[id];
  const tk=todayKey(now); store.dd=store.dd||{}; const md=store.dd[DEV]=store.dd[DEV]||{}; md[tk]=(md[tk]||0)+1; store.daily=sumDD(store.dd);
  let box;
  if(!ok) box=0;
  else if(!a) box=3;
  else if(a.box>=3 && a.r==="ok") box=4;
  else box=Math.min((a.r==="ng"?0:a.box)+1,3);
  store.answered[id]={r:ok?"ok":"ng",at:now,box,due:box>=4?null:now+(SRS[setting("srs")]||SRS.std)[box]*DAY};
  state.keep.add(id);
}
function isDue(a){return !!(a&&a.due&&a.due<=Date.now());}
function miss(id,detail){schedule(id,false); const m=Object.assign({n:0},store.mistakes[id]||{}); m.n=(m.n||0)+1; m.last=Date.now(); m.resolved=false; m.prev=Object.assign({at:m.last},detail||{}); store.mistakes[id]=m; persist(); counts();}

function resolveMistake(id,rowEl,noRender){
  let mm=store.mistakes[id];
  if(!mm){ const q=byId(id); const k=Object.keys(store.mistakes).find(x=>byId(x)===q); if(k) mm=store.mistakes[k]; }
  if(!mm){ toast("この問題の間違いの記録が見つかりませんでした"); return; }
  mm=Object.assign({},mm,{resolved:true,last:Date.now()});
  const key=store.mistakes[id]?id:Object.keys(store.mistakes).find(x=>byId(x)===byId(id));
  store.mistakes[key]=mm;
  if(rowEl&&rowEl.parentNode) rowEl.remove();
  const qq=byId(id); toast("解決済みにしました"+(qq?"（"+qq.s+"）":""));
  try{ persist(); }catch(e){}
  try{ counts(); }catch(e){ toast("表示の更新でエラー："+e.message); }

}

function searchHits(ignoreCh){
  const raw=state.query.trim(); if(!raw) return [];
  const inScope=q=>(ignoreCh||inCh(q))&&inStar(q);
  const pm=raw.match(/^問題\s*(\d)\s*[-－ー―]\s*(\d+)$/);
  const all=QMODES.flatMap(m=>DATA[m]);
  if(pm){const pid=pm[1]+"-"+pm[2]; return all.filter(q=>q.pid===pid&&inScope(q));}
  const words=raw.split(/[\s　]+/).filter(Boolean);
  return all.filter(q=>{
    if(!inScope(q)) return false;
    const hay=[q.s,q.t,q.q,q.e,q.title,q.text,(q.o||[]).join(" ")].filter(Boolean).join(" ").replace(/\[\[|\]\]/g,"");
    return words.every(w=>hay.includes(w));
  });
}

    b.onclick=()=>{state.star=k; state.sec=""; renderChips(); render(); window.scrollTo({top:0});};
    sc.appendChild(b);
  });
  renderSecs();
}

/* ───────── 目次（問題番号での絞り込み） ─────────
   「目次」を押すと 5-1・5-2… の並びが出て、タブのように押して切り替えられる */
function secOf(q){ const m=/(\d+)-(\d+)/.exec(q.s||""); return m?m[1]+"-"+m[2]:""; }
function secKeys(){
  if(state.mode==="sog"){ const c={}; DATA.sog.filter(q=>inCh(q)).forEach(q=>{ if(q.rank) c[q.rank]=(c[q.rank]||0)+1; }); return ["A","B","C"].filter(r=>c[r]).map(r=>[r,c[r]]); }
  const seen=new Map();
  (DATA[state.mode]||[]).filter(q=>inCh(q)&&inStar(q)).forEach(q=>{
    const k=secOf(q); if(!k) return; seen.set(k,(seen.get(k)||0)+1);
  });
  return [...seen.entries()].sort((a,b)=>{
    const [c1,s1]=a[0].split("-").map(Number), [c2,s2]=b[0].split("-").map(Number);
    return c1-c2||s1-s2;
  });
}
function renderSecs(){
  const box=$("#secs"); if(!box) return;
  // 章を選んだときだけ、その章の問題番号を出す（「すべて」のときは出さない）
  const on=state.nav==="list"&&QMODES.includes(state.mode)&&!state.query&&state.ch!==0;
  box.hidden=!on; box.innerHTML="";
  if(!on) return;
  const ks=secKeys();
  if(!ks.length){ box.hidden=true; return; }
  let sel=null;
  ks.forEach(([k])=>{
    const b=document.createElement("button");
    b.className="chip sec"; b.textContent=state.mode==="sog"?k+"ランク":(PT[k]||k); b.title="問題"+k;
    b.setAttribute("aria-pressed",state.sec===k);
    if(state.sec===k) sel=b;
    // 選んである番号をもう一度押すと、章の全部に戻る（暗記は規定ごとに見るので、戻さない）
    b.onclick=()=>{ state.sec=(state.sec===k&&state.mode!=="cloze"?"":k); renderChips(); render(); window.scrollTo({top:0}); };
    box.appendChild(b);
  });
  if(sel) sel.scrollIntoView({inline:"center",block:"nearest"});
}

  const add=(label,fn,cls="btn",id)=>{const b=document.createElement("button");b.className=cls;b.textContent=label;if(id)b.id=id;b.onclick=fn;t.appendChild(b);return b;};
  const span=document.createElement("span"); span.className="score"; span.id="score"; t.appendChild(span);
  if(state.query){ add("検索をやめる",()=>setQuery(""),"btn","btn-endsearch"); return; }
  if(QMODES.includes(state.mode)){

    if(state.mode!=="cloze"&&!["dict","kob","sog"].includes(state.mode)) add(state.showAnswered?"未回答と復習だけ表示":"回答済みも表示",()=>{state.showAnswered=!state.showAnswered;state.ansResetArmed=false;renderChips();render();},"btn","btn-showans");
  } else if(state.mode==="miss"){

    if(state.review) add("一覧に戻る",()=>{state.review=null;render();},"btn","btn-back");

function shuffle(m){const a=state.order[m];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}}
function dueCount(m){return DATA[m].filter(q=>isDue(store.answered[q.id])).length;}
function counts(){
  const open=Object.keys(store.mistakes).filter(id=>byId(id)&&!store.mistakes[id].resolved).length;
  updateHeader();
  const sc=$("#score"); if(!sc) return;
  if(state.query){ sc.textContent=`「${state.query}」の検索結果 ${searchHits().length}問（回答済みも表示）`; return; }
  if(state.mode==="cloze"){ sc.textContent=""; return; }
  if(QMODES.includes(state.mode)){

    sc.textContent=vals.length?`未回答 ${rest}問・今日の復習 ${due}問（直近の正解 ${ok}/${vals.length}）`:"";

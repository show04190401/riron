　[[事業受託方式]]\n土地活用の企画から建設、管理・運営までをデベロッパーに任せる。資金は[[土地所有者]]が調達する。\n⑵　[[等価交換方式]]\n土地所有者が土地を出資し、デベロッパーが建設資金を出す。完成後、出資割合に応じて土地と建物を[[取得]]する。\n⑶　[[建設協力金方式]]\n入居予定の[[テナント]]から預かった建設協力金を建設資金に充てる。建物の所有者は[[土地所有者]]。\n⑷　[[定期借地権方式]]\n土地を貸して地代を得る。土地所有者の資金負担は[[ない]]。"}, {"id": "cloze:42f051a2e9", "c": 5, "s": "問題5-6〔4〕", "st": 2, "title": "その他の譲渡の特例", "t": "⑴　被相続人の居住用財産（空き家）の3,000万円特別控除\n[[1981年5月31日]]以前に建築された家屋などが対象。相続人が[[3人]]以上の場合、1人あたりの控除額は[[2,000万円]]。\n⑵　居住用財産の譲渡損失の損益通算・繰越控除\n一定の要件を満たせば、譲渡損失を他の所得と損益通算し、控除しきれない損失を翌年以後[[3年間]]繰り越せる。\n⑶　収用等の特別控除\n公共事業のために土地等を収用された場合、[[5,000万円]]の特別控除がある。"}, {"id": "cloze:10ebb154b3", "c": 6, "s": "問題6-1〔1〕", "st": 2, "title": "贈与契約", "t": "⑴　贈与の成立\n贈与は、当事者の一方が財産を無償で与える意思を表示し、相手方が[[受諾]]することで成立する（[[諾成契約]]）。\n⑵　書面によらない贈与\n各当事者が解除できる。ただし、[[履行の終わった]]部分は解除できない。\n⑶　[[負担付贈与]]\n受贈者に一定の負担を課す贈与。贈与者は、負担の限度で売主と同じ担保責任を負う。\n⑷　[[死因贈与]]\n贈与者の死亡によって効力が生じる贈与。課税上は[[相続税]]の対象となる。\n⑸　[[定期贈与]]\n定期の給付を目的とする贈与。贈与者又は受贈者の死亡によって効力を失う。"}, {"id": "cloze:fabcebb686", "c": 6, "s": "問題6-1〔2〕", "st": 2, "title": "贈与税の計算と特例", "t": "⑴　暦年課税\n1月1日から12月31日までの1年間に受けた贈与財産の合計額から、基礎控除[[110万円]]を差し引いて税額を計算する。\n申告期間は、贈与を受けた年の翌年[[2月1日]]から[[3月15日]]まで。\n⑵　贈与税の配偶者控除\n婚姻期間が[[20年]]以上の配偶者から、居住用不動産又はその取得資金の贈与を受けた場合、最高[[2,000万円]]を控除できる（基礎控除と合わせて2,110万円）。\n同じ配偶者からは、一生に[[1回]]だけ適用できる。\n⑶　相続時精算課税\n贈与者は贈与の年の1月1日において[[60歳]]以上の父母・祖父母、受贈者は[[18歳]]以上の子・孫。\n年[[110万円]]の基礎控除のほか、累計[[2,500万円]]の特別控除がある。超えた部分の税率は一律[[20％]]。\n一度選択すると、その贈与者からの贈与について暦年課税に[[戻ることはできない]]。\n贈与者の相続時には、基礎控除を差し引いた後の贈与財産の価額を、[[贈与時]]の価額で相続財産に加算する。"}, {"id": "cloze:65e1f522e9", "c": 6, "s": "問題6-2〔1〕", "st": 2, "title": "法定相続人と法定相続分", "t": "⑴　相続順位\n配偶者は常に相続人。第1順位は[[子]]、第2順位は[[直系尊属]]、第3順位は[[兄弟姉妹]]。\n⑵　法定相続分\n配偶者と子：配偶者[[2分の1]]、子[[2分の1]]\n配偶者と直系尊属：配偶者[[3分の2]]、直系尊属[[3分の1]]\n配偶者と兄弟姉妹：配偶者[[4分の3]]、兄弟姉妹[[4分の1]]\n父母の一方だけを同じくする兄弟姉妹（半血兄弟姉妹）の相続分は、父母の双方を同じくする兄弟姉妹の[[2分の1]]。\n⑶　代襲相続\n子が相続開始以前に死亡・欠格・廃除により相続権を失った場合、その子（孫）が代襲する。\n兄弟姉妹の代襲は、その子（[[おい・めい]]）までに限られる。\n相続を[[放棄]]した者の子は、代襲相続人とならない。"}, {"id": "cloze:712e513bbd", "c": 6, "s": "問題6-2〔2〕", "st": 2, "title": "承認と放棄・遺言・遺留分", "t": "⑴　相続の放棄\n相続の開始があったことを知った時から[[3か月]]以内に、[[家庭裁判所]]に申述する。各相続人が[[単独]]で行うことができる。\n⑵　限定承認\n相続によって得た財産の限度で債務を弁済する。相続人[[全員]]が[[共同]]して行う必要がある。\n⑶　遺言\n[[自筆証書遺言]]は全文・日付・氏名を自書し押印する。財産目録は[[パソコン]]で作成してもよい（各ページに署名・押印）。\n[[法務局]]で保管されている自筆証書遺言と、[[公正証書遺言]]は、家庭裁判所の[[検認]]が不要。\n[[公正証書遺言]]の作成には、証人[[2人]]以上の立会いが必要。\n⑷　遺留分\n遺留分権利者は、[[兄弟姉妹]]以外の相続人。\n遺留分全体の割合は、直系尊属のみが相続人の場合は[[3分の1]]、それ以外は[[2分の1]]。\n遺留分侵害額請求権は、相続の開始と遺留分の侵害を知った時から[[1年]]、相続開始の時から[[10年]]で消滅する。"}, {"id": "cloze:beb6732e89", "c": 6, "s": "問題6-3〔1〕", "st": 2, "title": "相続税の課税価格", "t": "⑴　非課税財産\n死亡保険金・死亡退職金のうち、それぞれ[[500万円]]×[[法定相続人の数]]までは非課税（相続人が受け取った場合に限る）。\n⑵　生前贈与加算（暦年課税分）\n相続・遺贈で財産を取得した者が、相続開始前[[7年]]以内に被相続人から受けた贈与財産は、相続財産に加算する。\n延長された4年間（相続開始前3年より前）に受けた贈与については、合計[[100万円]]までは加算しない。\n⑶　債務控除\n葬式費用は控除できる。[[香典返し]]の費用や[[法要]]の費用は控除できない。\n墓地・仏壇など非課税財産の未払代金は、控除[[できない]]。"}, {"id": "cloze:1ec9eb3f20", "c": 6, "s": "問題6-3〔2〕", "st": 2, "title": "相続税の総額と税額控除", "t": "⑴　遺産に係る基礎控除額\n[[3,000万円]]＋[[600万円]]×法定相続人の数\n⑵　法定相続人の数に算入できる養子の数\n被相続人に実子がいる場合は[[1人]]、実子がいない場合は[[2人]]まで。\n相続を放棄した者も、法定相続人の数に[[含める]]。\n⑶　相続税額の2割加算\n被相続人の[[配偶者]]と[[1親等の血族]]（代襲相続人となった孫を含む）以外の者は、相続税額が2割加算される。\n⑷　配偶者に対する相続税額の軽減\n配偶者が取得した財産が、[[1億6,000万円]]と[[配偶者の法定相続分相当額]]のいずれか多い金額までであれば、相続税はかからない。\n⑸　未成年者控除\n（[[18歳]]－相続開始時の年齢）×[[10万円]]\n⑹　障害者控除\n（[[85歳]]－相続開始時の年齢）×10万円（特別障害者は[[20万円]]）"}, {"id": "cloze:bb26401da5", "c": 6, "s": "問題6-4〔1〕", "st": 2, "title": "宅地の評価", "t": "⑴　評価方式\n市街地の宅地は[[路線価方式]]、それ以外は[[倍率方式]]（固定資産税評価額×倍率）で評価する。\n⑵　貸宅地（底地）\n自用地評価額×（1－[[借地権割合]]）\n⑶　貸家建付地\n自用地評価額×（1－借地権割合×[[借家権割合]]×[[賃貸割合]]）\n⑷　貸家\n固定資産税評価額×（1－借家権割合×賃貸割合）\n⑸　小規模宅地等の特例\n[[特定居住用宅地等]]：[[330㎡]]まで[[80％]]減額。\n[[特定事業用宅地等]]：[[400㎡]]まで[[80％]]減額。\n[[貸付事業用宅地等]]：[[200㎡]]まで[[50％]]減額。\n特定居住用宅地等と特定事業用宅地等を併用する場合は、最大[[730㎡]]まで適用できる。"}, {"id": "cloze:556649a58f", "c": 6, "s": "問題6-4〔2〕", "st": 2, "title": "金融資産・株式の評価", "t": "⑴　上場株式\n次のうち最も[[低い]]価額で評価する。\n課税時期の最終価格、課税時期の属する月の毎日の最終価格の月平均額、その[[前月]]の月平均額、その[[前々月]]の月平均額。\n⑵　取引相場のない株式\n同族株主等が取得した場合は[[原則的評価方式]]（類似業種比準方式・純資産価額方式など）、同族株主以外の株主等が取得した場合は[[配当還元方式]]で評価する。\n⑶　生命保険契約に関する権利\n相続開始時の[[解約返戻金]]相当額で評価する。\n⑷　定期預金\n預入高＋既経過利子（源泉徴収税額相当額を[[差し引いた]]額）で評価する。"}, {"id": "cloze:bc35bffaad", "c": 6, "s": "問題6-4〔3〕", "st": 2, "title": "その他の財産の評価", "t": "⑴　家屋\n自用家屋は[[固定資産税評価額]]×1.0で評価する。\n建築中の家屋は、[[費用現価]]の[[70％]]で評価する。\n⑵　借地権\n自用地評価額×[[借地権割合]]\n⑶　使用貸借\n親の土地を子が無償で借りて建物を建てた場合（[[使用貸借]]）、その土地は[[自用地]]として評価する。\n⑷　私道\n不特定多数の者の通行の用に供されている私道は、評価[[しない]]（0）。それ以外の私道は、自用地評価額の[[30％]]で評価する。\n⑸　ゴルフ会員権（取引相場のあるもの）\n通常の取引価格の[[70％]]で評価する。\n⑹　小規模宅地等の特例の要件\n配偶者が取得した特定居住用宅地等は、保有・居住の要件[[なし]]で適用を受けられる。\n同居親族が取得した場合は、相続税の[[申告期限]]まで保有し、居住し続けることが必要。"}, {"id": "cloze:c3181e9459", "c": 6, "s": "問題6-5〔1〕", "st": 2, "title": "申告と納付", "t": "⑴　相続税の申告期限\n相続の開始があったことを知った日の翌日から[[10か月]]以内。\n⑵　延納\n金銭で一時に納付することが困難な場合、納付すべき税額が[[10万円]]を超えれば、担保を提供して分割納付できる。\n⑶　物納\n延納によっても金銭で納付することが困難な場合に認められる。\n第1順位は、[[不動産]]・船舶・国債・地方債・[[上場株式]]等。\n⑷　相続税の取得費加算の特例\n相続財産を、相続税の申告期限の翌日から[[3年]]以内に譲渡した場合、その財産に対応する相続税額を取得費に加算できる。"}, {"id": "cloze:16ffc381d0", "c": 6, "s": "問題6-5〔2〕", "st": 2, "title": "事業承継", "t": "⑴　遺留分に関する民法の特例（経営承継円滑化法）\n後継者が先代経営者から贈与等で取得した自社株式について、[[除外合意]]（遺留分算定の基礎財産から除外）や[[固定合意]]（評価額を合意時に固定）ができる。\n推定相続人全員の[[合意]]、[[経済産業大臣]]の確認、[[家庭裁判所]]の許可が必要。\n⑵　自社株の評価引下げ\n役員退職金を支給すると、利益と純資産が減少し、類似業種比準価額・純資産価額が[[下がる]]ことがある。"}, {"id": "cloze:7afc87f0a1", "c": 6, "s": "問題6-5〔3〕", "st": 2, "title": "自社株の承継の手法", "t": "⑴　相続した自社株の発行会社への譲渡\n相続税の申告期限の翌日から[[3年]]以内に、相続した非上場株式を発行会社に譲渡した場合、[[みなし配当]]課税は行われず、譲渡所得として課税される。\n⑵　種類株式\n[[拒否権付株式]]（黄金株）は、株主総会の決議事項について拒否権を持つ。後継者に議決権を集中させつつ、先代経営者が一定の影響力を残す方法などに使われる。\n[[議決権制限株式]]は、議決権の全部又は一部がない株式。後継者以外の相続人に渡す株式として使われる。"}, {"id": "cloze:d0d09bb294", "c": 6, "s": "問題6-6〔1〕", "st": 2, "title": "成年後見制度", "t": "⑴　法定後見制度\n判断能力の程度に応じて、[[後見]]・[[保佐]]・[[補助]]の3類型がある。[[家庭裁判所]]が後見人等を選任する。\n⑵　任意後見制度\n本人の判断能力が十分なうちに、[[公正証書]]で任意後見契約を結んでおく。判断能力が低下した後、家庭裁判所が[[任意後見監督人]]を選任した時から効力が生じる。\n⑶　成年後見人\n成年被後見人の居住用不動産を売却するには、[[家庭裁判所]]の許可が必要。"}, {"id": "cloze:3df9d2b0bb", "c": 6, "s": "問題6-6〔2〕", "st": 2, "title": "遺産分割と相続の手続", "t": "⑴　胎児\n相続については、すでに[[生まれた]]ものとみなす（死産の場合を除く）。\n⑵　養子\n[[普通養子]]は、実父母との親族関係が続く（実父母と養父母の両方の相続人となる）。\n[[特別養子]]は、実父母との親族関係が[[終了]]する。\n⑶　遺産分割の禁止\n被相続人は、遺言で、相続開始の時から[[5年]]を超えない期間、遺産の分割を禁止できる。\n⑷　遺産分割の方法\n[[現物分割]]：個々の財産をそのまま分ける。\n[[代償分割]]：特定の相続人が財産を取得し、他の相続人に[[代償金]]などを支払う。\n[[換価分割]]：財産を売却して、その代金を分ける。\n⑸　配偶者居住権\n存続期間は原則として[[終身]]。[[登記]]をすれば第三者に対抗できる。\n⑹　特別寄与料\n被相続人の療養看護などに尽くした[[相続人以外の親族]]は、相続人に対して特別寄与料を請求できる。"}], "dict": [], "kob": [], "sog": [], "tf": [{"id": "tf:5857d4986b", "c": 1, "s": "問題1-1", "st": 2, "q": "税理士資格を有しないFPが、顧客から無償で依頼を受けて、その顧客の確定申告書を作成することは、税理士法に抵触しない。", "a": false, "e": "誤りです。\n【根拠】税理士資格のない者は、有償・無償を問わず、個別具体的な税務相談や税務書類の作成を行うことができません。\n【ひっかけ】「無償なら大丈夫」という出題が定番です。一般的な税法の解説や仮定の事例による計算は、資格がなくてもできます。"}, {"id": "tf:baf101c377", "c": 1, "s": "問題1-1", "st": 2, "q": "弁護士資格を有しないFPが、顧客の任意後見契約の受任者となることは、弁護士法に抵触しない。", "a": true, "e": "正しい記述です。\n【根拠】任意後見人（任意後見受任者）には、特別な資格は必要ありません。FPも就任できます。\n【ひっかけ】公正証書遺言の証人になることも資格は不要です。個別具体的な法律判断を示すことと区別します。"}, {"id": "tf:7f6966ea33", "c": 1, "s": "問題1-1", "st": 2, "q": "金融商品取引業の登録を受けていないFPが、顧客と投資顧問契約を結び、特定の銘柄の株式の購入を勧めることは、金融商品取引法に抵触する。", "a": true, "e": "正しい記述です。\n【根拠】投資助言・代理業の登録がない者が、投資顧問契約に基づいて個別の有価証券の投資判断を助言することはできません。\n【ひっかけ】景気動向や一般的な投資手法の説明であれば、登録がなくても行えます。"}, {"id": "tf:8f4f2f79de", "c": 1, "s": "問題1-1", "st": 2, "q": "保険募集人の登録を受けていないFPが、顧客の必要保障額を試算することは、保険業法に抵触する。", "a": false, "e": "誤りです。\n【根拠】必要保障額の試算や保険商品の一般的な説明は、保険募集には当たりません。\n【ひっかけ】禁止されるのは、保険の募集・勧誘（契約締結の代理・媒介）です。試算とは区別します。"}, {"id": "tf:fd431a81b1", "c": 1, "s": "問題1-1", "st": 2, "q": "毎年一定額を積み立てて、将来の元利合計額を求める場合には、年金終価係数を用いる。", "a": true, "e": "正しい記述です。\n【根拠】毎年の積立額×年金終価係数＝将来の元利合計です。\n【ひっかけ】「将来の目標額から毎年の積立額を求める」場合は減債基金係数を使います。入れ替えの出題が多いので注意します。"}, {"id": "tf:a0926a5941", "c": 1, "s": "問題1-1", "st": 2, "q": "住宅ローンの借入額をもとに、毎年の返済額を求める場合には、減債基金係数を用いる。", "a": false, "e": "誤りです。\n【根拠】借入額（現在の元本）から毎年の返済額を求めるには、資本回収係数を用います。\n【ひっかけ】減債基金係数は「将来の目標額」から「毎年の積立額」を求める係数です。"}, {"id": "tf:18b0be8ae8", "c": 1, "s": "問題1-1", "st": 2, "q": "将来、毎年一定額を受け取るために、現在いくらの元本が必要かを求める場合には、年金現価係数を用いる。", "a": true, "e": "正しい記述です。\n【根拠】毎年の受取額×年金現価係数＝現在必要な元本です。\n【ひっかけ】資本回収係数とは逆の関係（互いに逆数）です。"}, {"id": "tf:2ee8f18e05", "c": 1, "s": "問題1-1", "st": 1, "q": "現在の元本を一定期間複利で運用した場合の元利合計を求める場合には、現価係数を用いる。", "a": false, "e": "誤りです。\n【根拠】現在の元本から将来の元利合計を求めるのは、終価係数です。\n【ひっかけ】現価係数は「将来の目標額」から「現在必要な元本」を求めます。終価と現価は逆数の関係です。"}, {"id": "tf:f03e94b798", "c": 1, "s": "問題1-2", "st": 2, "q": "健康保険の傷病手当金は、業務外の病気やけがで連続して3日間休業した後、休業4日目から支給される。", "a": true, "e": "正しい記述です。\n【根拠】連続3日間の待期期間の後、4日目から支給されます。\n【ひっかけ】待期の3日間は有給休暇でもかまいません。「連続」が条件で、通算3日では足りません。"}, {"id": "tf:639d14b0d5", "c": 1, "s": "問題1-2", "st": 2, "q": "健康保険の傷病手当金の支給期間は、支給を開始した日から通算して2年である。", "a": false, "e": "誤りです。\n【根拠】傷病手当金の支給期間は、支給開始日から通算して1年6か月です。\n【ひっかけ】任意継続被保険者の加入期間（最長2年）と混同させる出題です。"}, {"id": "tf:7c4af399db", "c": 1, "s": "問題1-2", "st": 2, "q": "健康保険の任意継続被保険者となるためには、資格喪失日から20日以内に申出をする必要があり、加入できる期間は最長2年間である。", "a": true, "e": "正しい記述です。\n【根拠】資格喪失日の前日まで継続して2か月以上の被保険者期間があることも要件です。保険料は全額自己負担です。\n【ひっかけ】「14日以内」「最長1年」などと数字を変える出題が多い論点です。"}, {"id": "tf:86c87629e5", "c": 1, "s": "問題1-2", "st": 1, "q": "任意継続被保険者の保険料は、在職中と同様に事業主と被保険者が折半して負担する。", "a": false, "e": "誤りです。\n【根拠】任意継続被保険者の保険料は、全額を被保険者本人が負担します。\n【ひっかけ】在職中の「労使折半」と入れ替える出題です。"}, {"id": "tf:93cf8a8c75", "c": 1, "s": "問題1-2", "st": 2, "q": "高額療養費の対象となる自己負担額には、入院時の食事代や差額ベッド代も含まれる。", "a": false, "e": "誤りです。\n【根拠】入院時の食事代（標準負担額）や差額ベッド代、先進医療の技術料は、高額療養費の対象外です。\n【ひっかけ】保険診療の自己負担分だけが対象です。"}, {"id": "tf:c9ef1e406d", "c": 1, "s": "問題1-2", "st": 1, "q": "後期高齢者医療制度の被保険者は、原則として75歳以上の者である。", "a": true, "e": "正しい記述です。\n【根拠】75歳以上の者（一定の障害があると認定された65歳以上の者を含む）が被保険者となります。\n【ひっかけ】保険料は、原則として公的年金からの特別徴収（天引き）で納めます。"}, {"id": "tf:9795138955", "c": 1, "s": "問題1-2", "st": 2, "q": "70歳以上75歳未満の者の医療費の自己負担割合は、現役並み所得者を除き、原則として1割である。", "a": false, "e": "誤りです。\n【根拠】70歳以上75歳未満の自己負担割合は原則2割（現役並み所得者は3割）です。\n【ひっかけ】原則1割なのは75歳以上の後期高齢者医療制度です。"}, {"id": "tf:a8a9d093d5", "c": 1, "s": "問題1-2", "st": 2, "q": "健康保険の被扶養者となるための収入要件は、60歳以上の者については、原則として年収180万円未満である。", "a": true, "e": "正しい記述です。\n【根拠】原則は年収130万円未満、60歳以上の者や一定の障害者は180万円未満です。\n【ひっかけ】同居の場合は被保険者の年収の2分の1未満であることも必要です。"}, {"id": "tf:1987067638", "c": 1, "s": "問題1-2", "st": 1, "q": "国民健康保険には、原則として傷病手当金や出産手当金の給付はない。", "a": true, "e": "正しい記述です。\n【根拠】国民健康保険では、傷病手当金・出産手当金は市町村等の任意給付で、原則として支給されません。\n【ひっかけ】出産育児一時金は国民健康保険でも支給されます。"}, {"id": "tf:e6a3274f17", "c": 1, "s": "問題1-2", "st": 2, "q": "介護保険の第2号被保険者は、要介護状態となった原因にかかわらず介護保険の給付を受けることができる。", "a": false, "e": "誤りです。\n【根拠】第2号被保険者（40歳以上65歳未満）は、特定疾病（末期がんなど）が原因の場合に限り給付を受けられます。\n【ひっかけ】第1号被保険者（65歳以上）は、原因を問わず給付を受けられます。"}, {"id": "tf:f16ff71643", "c": 1, "s": "問題1-2", "st": 1, "q": "介護保険の第1号被保険者の保険料は、年額18万円以上の公的年金を受給している場合、原則として年金から天引きされる。", "a": true, "e": "正しい記述です。\n【根拠】年額18万円以上の年金受給者は特別徴収（天引き）、それ未満は普通徴収（口座振替など）です。\n【ひっかけ】第2号被保険者の保険料は、医療保険の保険料と一緒に徴収されます。"}, {"id": "tf:ec0c0ec712", "c": 1, "s": "問題1-3", "st": 2, "q": "雇用保険の基本手当を受給するためには、原則として、離職の日以前2年間に被保険者期間が通算して12か月以上あることが必要である。", "a": true, "e": "正しい記述です。\n【根拠】倒産・解雇などによる離職の場合は、離職の日以前1年間に通算6か月以上でよいとされます。\n【ひっかけ】「1年間に12か月」などと期間を変える出題に注意します。"}, {"id": "tf:56caa60f6a", "c": 1, "s": "問題1-3", "st": 2, "q": "雇用保険の基本手当は、受給資格の決定を受けた日以後、通算して14日間の待期期間を経過した後に支給が開始される。", "a": false, "e": "誤りです。\n【根拠】待期期間は通算7日間です。\n【ひっかけ】自己都合退職の場合は、待期の後さらに原則1か月の給付制限があります。"}, {"id": "tf:3c4cb6374b", "c": 1, "s": "問題1-3", "st": 2, "q": "高年齢雇用継続基本給付金は、60歳以上65歳未満の被保険者の賃金が、60歳到達時の賃金の75％未満に低下した場合に支給される。", "a": true, "e": "正しい記述です。\n【根拠】60歳到達時の賃金月額の75％未満に低下した状態で雇用が継続している場合に支給されます。\n【ひっかけ】「85％未満」などと割合を変える出題に注意します。"}, {"id": "tf:97a336107e", "c": 1, "s": "問題1-3", "st": 2, "q": "労災保険の保険料は、事業主と労働者が折半して負担する。", "a": false, "e": "誤りです。\n【根拠】労災保険の保険料は、全額を事業主が負担します。\n【ひっかけ】雇用保険の保険料は事業主と労働者の双方が負担します（負担割合は異なります）。"}, {"id": "tf:2169ab85ea", "c": 1, "s": "問題1-3", "st": 1, "q": "労災保険の休業補償給付は、休業4日目から、1日につき給付基礎日額の60％相当額が支給される。", "a": true, "e": "正しい記述です。\n【根拠】休業4日目から給付基礎日額の60％が支給され、さらに休業特別支給金20％が上乗せされます。\n【ひっかけ】最初の3日間（待期期間）は、業務災害であれば事業主が休業補償を行います。"}, {"id": "tf:c750fbf575", "c": 1, "s": "問題1-3", "st": 1, "q": "労災保険は、通勤途中の事故による負傷については給付の対象としていない。", "a": false, "e": "誤りです。\n【根拠】通勤災害も労災保険の給付の対象です（通勤災害の場合は「休業給付」などと呼びます）。\n【ひっかけ】業務災害だけが対象と思わせる出題です。"}, {"id": "tf:4623e13baf", "c": 1, "s": "問題1-3", "st": 1, "q": "雇用保険の育児休業給付金の額は、休業開始から180日目までは休業開始時賃金日額×支給日数の67％相当額である。", "a": true, "e": "正しい記述です。\n【根拠】180日目までは67％、181日目以降は50％です。\n【ひっかけ】出生後休業支援給付金（13％）が上乗せされる場合もあります。"}, {"id": "tf:8180ed0ac2", "c": 1, "s": "問題1-4", "st": 2, "q": "老齢基礎年金の受給資格期間は、保険料納付済期間、保険料免除期間及び合算対象期間を合わせて10年以上である。", "a": true, "e": "正しい記述です。\n【根拠】2017年8月から、受給資格期間は25年から10年に短縮されています。\n【ひっかけ】合算対象期間（カラ期間）は受給資格期間には算入されますが、年金額には反映されません。"}, {"id": "tf:f225eb1ccd", "c": 1, "s": "問題1-4", "st": 2, "q": "老齢基礎年金を繰り上げて受給した場合、1か月あたり0.7％減額される。", "a": false, "e": "誤りです。\n【根拠】繰上げ受給の減額率は1か月あたり0.4％です（1962年4月2日以後生まれの者）。\n【ひっかけ】0.7％は繰下げ受給の増額率です。繰上げと繰下げの率を入れ替える出題が定番です。"}, {"id": "tf:04a5e3c50e", "c": 1, "s": "問題1-4", "st": 2, "q": "老齢基礎年金の繰下げ受給は最大75歳まで可能で、75歳まで繰り下げた場合の増額率は84％である。", "a": true, "e": "正しい記述です。\n【根拠】0.7％×120か月＝84％です。\n【ひっかけ】繰上げは最大60か月で減額率24％（0.4％×60か月）です。"}, {"id": "tf:e5a7191b44", "c": 1, "s": "問題1-4", "st": 2, "q": "国民年金の第1号被保険者は、国民年金基金に加入している場合であっても、付加保険料を納付することができる。", "a": false, "e": "誤りです。\n【根拠】国民年金基金の加入員は、付加保険料を納付できません。\n【ひっかけ】iDeCoとの同時加入は可能です。付加年金は月400円の保険料で、200円×納付月数の年金が加算されます。"}, {"id": "tf:2c4f68c730", "c": 1, "s": "問題1-4", "st": 2, "q": "保険料の免除を受けた期間の保険料は、10年以内であれば追納することができる。", "a": true, "e": "正しい記述です。\n【根拠】免除・納付猶予・学生納付特例を受けた期間の保険料は、10年以内に追納できます。\n【ひっかけ】未納の保険料を後から納付できるのは原則2年以内です。追納（10年）と区別します。"}, {"id": "tf:15cc937462", "c": 1, "s": "問題1-4", "st": 2, "q": "65歳から支給される老齢厚生年金は、厚生年金保険の被保険者期間が1年以上ある者でなければ受給できない。", "a": false, "e": "誤りです。\n【根拠】65歳からの老齢厚生年金は、老齢基礎年金の受給資格期間を満たし、被保険者期間が1か月以上あれば受給できます。\n【ひっかけ】1年以上が必要なのは、60歳台前半の特別支給の老齢厚生年金です。"}, {"id": "tf:20bbb6271d", "c": 1, "s": "問題1-4", "st": 2, "q": "老齢厚生年金の加給年金額は、厚生年金保険の被保険者期間が20年以上ある者に、生計を維持している65歳未満の配偶者がいる場合に加算される。", "a": true, "e": "正しい記述です。\n【根拠】被保険者期間20年以上と、生計維持関係にある65歳未満の配偶者（又は18歳到達年度末までの子など）が要件です。\n【ひっかけ】配偶者が65歳になると加給年金は終わり、要件を満たせば配偶者の老齢基礎年金に振替加算が付きます。"}, {"id": "tf:d67e406f01", "c": 1, "s": "問題1-4", "st": 1, "q": "在職老齢年金の仕組みでは、総報酬月額相当額と基本月額の合計が支給停止調整額を超える場合、超えた額の全額が支給停止となる。", "a": false, "e": "誤りです。\n【根拠】支給停止されるのは、支給停止調整額を超えた額の2分の1です。\n【ひっかけ】支給停止調整額は年度ごとに見直されます。仕組み（超えた額の2分の1）を押さえます。"}, {"id": "tf:7776d20cb7", "c": 1, "s": "問題1-4", "st": 2, "q": "国民年金の第3号被保険者は、第2号被保険者に扶養される20歳以上60歳未満の配偶者であり、自ら保険料を納付する必要はない。", "a": true, "e": "正しい記述です。\n【根拠】第3号被保険者の保険料は、配偶者が加入する厚生年金保険の制度全体で負担されます。\n【ひっかけ】第2号被保険者が65歳以上で老齢年金の受給権がある場合、その配偶者は第3号被保険者になれません。"}, {"id": "tf:a51ad95966", "c": 1, "s": "問題1-4", "st": 2, "q": "学生納付特例の適用を受けた期間は、老齢基礎年金の受給資格期間には算入されるが、追納しなければ年金額には反映されない。", "a": true, "e": "正しい記述です。\n【根拠】学生納付特例・納付猶予の期間は、受給資格期間に算入されますが、年金額には反映されません。\n【ひっかけ】全額免除期間は、国庫負担分（2分の1）が年金額に反映されます。"}, {"id": "tf:933f750a12", "c": 1, "s": "問題1-4", "st": 2, "q": "老齢基礎年金と老齢厚生年金の繰下げ受給は、どちらか一方だけを行うことができる。", "a": true, "e": "正しい記述です。\n【根拠】繰下げは別々に行えます。\n【ひっかけ】繰上げは、老齢基礎年金と老齢厚生年金を同時に行う必要があります。"}, {"id": "tf:e35cb82f7d", "c": 1, "s": "問題1-4", "st": 1, "q": "老齢基礎年金の繰上げ受給を請求した場合、老齢厚生年金は繰り上げずに65歳から受給することができる。", "a": false, "e": "誤りです。\n【根拠】繰上げは、老齢基礎年金と老齢厚生年金を同時に請求しなければなりません。\n【ひっかけ】繰下げは別々にできる点と混同させる出題です。"}, {"id": "tf:44d2f67054", "c": 1, "s": "問題1-5", "st": 2, "q": "遺族基礎年金は、死亡した者によって生計を維持されていた子のない配偶者にも支給される。", "a": false, "e": "誤りです。\n【根拠】遺族基礎年金を受けられるのは「子のある配偶者」又は「子」です。\n【ひっかけ】子のない配偶者は対象外です。遺族厚生年金は子のない配偶者も対象になります。"}, {"id": "tf:c5357f68ab", "c": 1, "s": "問題1-5", "st": 2, "q": "遺族基礎年金の対象となる子とは、18歳到達年度の末日までの間にある子、又は20歳未満で障害等級1級・2級に該当する子をいう。", "a": true, "e": "正しい記述です。\n【根拠】いずれも婚姻をしていないことが条件です。\n【ひっかけ】「20歳未満の子」とだけ書いて障害の要件を落とす出題に注意します。"}, {"id": "tf:3d2b595dc2", "c": 1, "s": "問題1-5", "st": 2, "q": "遺族厚生年金の額は、死亡した者の老齢厚生年金の報酬比例部分の額の3分の2相当額である。", "a": false, "e": "誤りです。\n【根拠】遺族厚生年金の額は、報酬比例部分の額の4分の3相当額です。\n【ひっかけ】3分の2は健康保険の傷病手当金・出産手当金の割合です。"}, {"id": "tf:d9d7cf5d63", "c": 1, "s": "問題1-5", "st": 1, "q": "夫の死亡当時30歳未満で子のない妻が受ける遺族厚生年金は、5年間の有期給付となる。", "a": true, "e": "正しい記述です。\n【根拠】30歳未満で子のない妻への遺族厚生年金は、5年間で終わります。\n【ひっかけ】中高齢寡婦加算は、夫の死亡時40歳以上65歳未満の妻が対象です。年齢を混同しないようにします。"}, {"id": "tf:228cfa60a7", "c": 1, "s": "問題1-5", "st": 2, "q": "障害基礎年金の1級の年金額は、2級の年金額の1.25倍である。", "a": true, "e": "正しい記述です。\n【根拠】1級は2級の1.25倍です。子がいる場合は子の加算額が付きます。\n【ひっかけ】障害基礎年金は1級・2級のみで、3級はありません。3級があるのは障害厚生年金です。"}, {"id": "tf:63bf3262ff", "c": 1, "s": "問題1-5", "st": 2, "q": "個人型確定拠出年金（iDeCo）の老齢給付金を一時金で受け取った場合、一時所得として課税される。", "a": false, "e": "誤りです。\n【根拠】iDeCoの老齢給付金を一時金で受け取ると退職所得、年金で受け取ると雑所得（公的年金等）となります。\n【ひっかけ】一時所得として課税されるのは、生命保険の満期保険金（契約者＝受取人）などです。"}, {"id": "tf:fe2af63fe9", "c": 1, "s": "問題1-5", "st": 2, "q": "個人型確定拠出年金（iDeCo）の掛金は、その全額が小規模企業共済等掛金控除の対象となる。", "a": true, "e": "正しい記述です。\n【根拠】iDeCoの掛金は全額が所得控除（小規模企業共済等掛金控除）の対象です。\n【ひっかけ】社会保険料控除や生命保険料控除ではありません。"}, {"id": "tf:33529b0fd1", "c": 1, "s": "問題1-5", "st": 1, "q": "国民年金基金の掛金の上限は、個人型確定拠出年金の掛金と合わせて月額6万8,000円である。", "a": true, "e": "正しい記述です。\n【根拠】第1号被保険者の上乗せ制度は、国民年金基金とiDeCoの掛金を合わせて月額6万8,000円が上限です（付加保険料を納める場合はその分を含みます）。\n【ひっかけ】国民年金基金の掛金も、全額が社会保険料控除の対象です。"}, {"id": "tf:85d4620ca2", "c": 1, "s": "問題1-5", "st": 1, "q": "妻が死亡した場合に夫が遺族厚生年金の受給権者となるには、妻の死亡当時に夫が55歳以上であることが必要である。", "a": true, "e": "正しい記述です。\n【根拠】夫・父母・祖父母が遺族厚生年金を受けるには、死亡当時55歳以上であることが必要で、支給は原則60歳からです。\n【ひっかけ】夫が遺族基礎年金を受ける場合（子のある夫）は、年齢要件はありません。"}, {"id": "tf:067dd343b2", "c": 1, "s": "問題1-5", "st": 1, "q": "企業型確定拠出年金のマッチング拠出において、加入者が拠出する掛金の額は、事業主掛金の額を超えることができない。", "a": true, "e": "正しい記述です。\n【根拠】加入者掛金は事業主掛金を超えられず、合計額は拠出限度額以内でなければなりません。\n【ひっかけ】加入者掛金も、全額が小規模企業共済等掛金控除の対象です。"}, {"id": "tf:031ad1d4f4", "c": 1, "s": "問題1-5", "st": 2, "q": "国民年金の第3号被保険者は、個人型確定拠出年金（iDeCo）に加入することができない。", "a": false, "e": "誤りです。\n【根拠】第3号被保険者もiDeCoに加入できます。\n【ひっかけ】国民年金基金に加入できるのは第1号被保険者（と一定の任意加入被保険者）です。"}, {"id": "tf:3189eb0f2b", "c": 1, "s": "問題1-6", "st": 2, "q": "元金均等返済は、元利均等返済に比べて、返済期間・金利などの条件が同じであれば総返済額が少ない。", "a": true, "e": "正しい記述です。\n【根拠】元金均等返済は元金の減り方が早いため、支払う利息の総額が少なくなります。\n【ひっかけ】その代わり、当初の返済額は元金均等返済のほうが多くなります。"}, {"id": "tf:06f4a8a241", "c": 1, "s": "問題1-6", "st": 2, "q": "住宅ローンの繰上げ返済において、返済額軽減型は、期間短縮型に比べて利息の軽減効果が大きい。", "a": false, "e": "誤りです。\n【根拠】同じ額を繰上げ返済した場合、利息の軽減効果が大きいのは期間短縮型です。\n【ひっかけ】返済額軽減型は、毎回の返済額を減らしたいときに向いています。"}, {"id": "tf:c147c7cbc7", "c": 1, "s": "問題1-6", "st": 1, "q": "フラット35の融資額の上限は8,000万円で、金利は全期間固定である。", "a": true, "e": "正しい記述です。\n【根拠】フラット35は全期間固定金利で、融資額は100万円以上8,000万円以下です。\n【ひっかけ】金利は取扱金融機関ごとに異なります。"}, {"id": "tf:ce7a3606e7", "c": 1, "s": "問題1-6", "st": 2, "q": "日本学生支援機構の第一種奨学金は、在学中も卒業後も利息が付かない。", "a": true, "e": "正しい記述です。\n【根拠】第一種奨学金は無利息、第二種奨学金は利息付き（在学中は無利息）です。\n【ひっかけ】国の教育ローンと奨学金は併用できます。"}, {"id": "tf:ee2389c18a", "c": 1, "s": "問題1-6", "st": 1, "q": "国の教育ローン（教育一般貸付）の融資限度額は、学生・生徒1人につき原則500万円である。", "a": false, "e": "誤りです。\n【根拠】融資限度額は学生・生徒1人につき原則350万円です（一定の海外留学などは450万円）。\n【ひっかけ】金額を入れ替える出題に注意します。"}, {"id": "tf:204a2b7c72", "c": 1, "s": "問題1-6", "st": 1, "q": "住宅ローンの金利タイプのうち、変動金利型は、一般に金利が半年ごとに見直され、返済額は5年ごとに見直される。", "a": true, "e": "正しい記述です。\n【根拠】多くの変動金利型は、金利は半年ごと、返済額は5年ごとに見直されます（元利均等返済の場合）。\n【ひっかけ】返済額の見直し時は、前回の返済額の1.25倍が上限とされることが多いです。"}, {"id": "tf:75e553f2b1", "c": 1, "s": "問題1-7", "st": 2, "q": "流動比率は、流動資産を流動負債で除して求め、一般に高いほど短期的な支払能力が高いとされる。", "a": true, "e": "正しい記述です。\n【根拠】流動比率＝流動資産÷流動負債×100です。\n【ひっかけ】当座比率は、流動資産のうち換金性の高い当座資産を分子にします。"}, {"id": "tf:cbedf97d61", "c": 1, "s": "問題1-7", "st": 2, "q": "自己資本比率は、自己資本を流動負債で除して求める。", "a": false, "e": "誤りです。\n【根拠】自己資本比率は、自己資本÷総資本（負債＋純資産）×100で求めます。\n【ひっかけ】分母を取り違える出題に注意します。"}, {"id": "tf:68262726ef", "c": 1, "s": "問題1-7", "st": 1, "q": "損益分岐点比率は、低いほど収益力が高く、売上高が減少しても赤字になりにくいとされる。", "a": true, "e": "正しい記述です。\n【根拠】損益分岐点比率＝損益分岐点売上高÷実際の売上高×100です。\n【ひっかけ】安全余裕率（100％－損益分岐点比率）は高いほど安全です。"}, {"id": "tf:1a1d165188", "c": 1, "s": "問題1-7", "st": 1, "q": "株式や社債の発行による資金調達は、間接金融に分類される。", "a": false, "e": "誤りです。\n【根拠】株式・社債の発行による資金調達は直接金融です。\n【ひっかけ】金融機関からの借入れが間接金融です。"}, {"id": "tf:19ab2f6962", "c": 1, "s": "問題1-7", "st": 2, "q": "貸金業法の総量規制により、銀行のカードローンも含めて、個人の借入れの総額は年収の3分の1までに制限される。", "a": false, "e": "誤りです。\n【根拠】総量規制は貸金業者からの借入れが対象で、銀行のカードローンは対象外です。\n【ひっかけ】クレジットカードのショッピング利用も対象外です（キャッシングは対象）。"}, {"id": "tf:32442cbcf8", "c": 2, "s": "問題2-1", "st": 2, "q": "生命保険契約のクーリング・オフは、契約の申込日又はクーリング・オフについて記載された書面を受け取った日のいずれか遅い日から起算して8日以内であれば、書面又は電磁的記録により行うことができる。", "a": true, "e": "正しい記述です。\n【根拠】いずれか遅い日から8日以内に、書面又は電磁的記録で申込みを撤回できます。\n【ひっかけ】「早い日から」「14日以内」と変える出題に注意します。保険期間1年以内の契約は対象外です。"}, {"id": "tf:e29de1c858", "c": 2, "s": "問題2-1", "st": 1, "q": "保険期間が1年以内の損害保険契約も、クーリング・オフの対象となる。", "a": false, "e": "誤りです。\n【根拠】保険期間が1年以内の契約は、クーリング・オフの対象外です。\n【ひっかけ】法人契約や、医師の診査を終えた後の契約も対象外です。"}, {"id": "tf:f0519f5b24", "c": 2, "s": "問題2-1", "st": 2, "q": "生命保険会社が破綻した場合、生命保険契約者保護機構により、原則として破綻時点の責任準備金等の80％まで補償される。", "a": false, "e": "誤りです。\n【根拠】生命保険の補償は、原則として責任準備金等の90％までです（高予定利率契約を除く）。\n【ひっかけ】損害保険は契約の種類によって80％〜100％です。生保の90％と混同させる出題です。"}, {"id": "tf:979c76f6a8", "c": 2, "s": "問題2-1", "st": 1, "q": "損害保険会社が破綻した場合、自賠責保険と家計地震保険は、保険金の全額が補償される。", "a": true, "e": "正しい記述です。\n【根拠】自賠責保険と家計地震保険は、損害保険契約者保護機構により100％補償されます。\n【ひっかけ】火災保険や自動車保険（任意）などは、破綻後3か月以内の事故は100％、それ以後は80％です。"}, {"id": "tf:5f73f6a5ec", "c": 2, "s": "問題2-1", "st": 2, "q": "ソルベンシー・マージン比率が200％以上であれば、保険会社の保険金等の支払余力は一定の水準を満たしているとされる。", "a": true, "e": "正しい記述です。\n【根拠】200％を下回ると、金融庁による早期是正措置の対象となります。\n【ひっかけ】「100％以上」と数字を変える出題に注意します。"}, {"id": "tf:27bdd940f6", "c": 2, "s": "問題2-1", "st": 1, "q": "少額短期保険業者と締結した保険契約は、保険契約者保護機構の補償の対象となる。", "a": false, "e": "誤りです。\n【根拠】少額短期保険は、保険契約者保護機構の補償の対象外です。\n【ひっかけ】共済も同様に対象外です。少額短期保険の保険金額の上限は、原則1被保険者あたり1,000万円です。"}, {"id": "tf:6197e8dbec", "c": 2, "s": "問題2-2", "st": 2, "q": "定期保険は、保険期間中に死亡した場合に死亡保険金が支払われるほか、保険期間満了時に満期保険金が支払われる。", "a": false, "e": "誤りです。\n【根拠】定期保険には満期保険金がありません（いわゆる掛け捨て）。\n【ひっかけ】死亡保険金と同額の満期保険金があるのは養老保険です。"}, {"id": "tf:3cc198fb0a", "c": 2, "s": "問題2-2", "st": 2, "q": "収入保障保険の死亡保険金を一時金で受け取る場合、受取総額は年金形式で受け取る場合より少なくなる。", "a": true, "e": "正しい記述です。\n【根拠】一時金で受け取ると、年金で受け取る分の運用益が差し引かれるため、受取総額は少なくなります。\n【ひっかけ】収入保障保険は、経過とともに保障額が減っていくため、同じ保険金額の定期保険より保険料が割安です。"}, {"id": "tf:3a71064d2d", "c": 2, "s": "問題2-2", "st": 2, "q": "変額保険（終身型）の死亡保険金には最低保証があるが、解約返戻金には最低保証がない。", "a": true, "e": "正しい記述です。\n【根拠】変額保険の死亡・高度障害保険金には基本保険金額の最低保証がありますが、解約返戻金・満期保険金には最低保証がありません。\n【ひっかけ】「解約返戻金にも最低保証がある」とする出題に注意します。"}, {"id": "tf:421c4ed88a", "c": 2, "s": "問題2-2", "st": 2, "q": "払済保険とは、保険料の払込みを中止して、その時点の解約返戻金をもとに、保険金額を変えずに定期保険に変更するものである。", "a": false, "e": "誤りです。\n【根拠】記述は延長保険の説明です。払済保険は、保険期間を変えずに保険金額を減らします。\n【ひっかけ】「保険期間を変えない＝払済」「保険金額を変えない＝延長」と覚えます。"}, {"id": "tf:1e37593818", "c": 2, "s": "問題2-2", "st": 1, "q": "払済保険や延長保険に変更した場合、元の契約に付加されていた特約は原則として消滅する。", "a": true, "e": "正しい記述です。\n【根拠】払済保険・延長保険に変更すると、特約は原則として消滅します（リビング・ニーズ特約などは除かれます）。\n【ひっかけ】自動振替貸付は保険料を立て替えるだけなので、契約内容は変わりません。"}, {"id": "tf:d78e23469e", "c": 2, "s": "問題2-2", "st": 1, "q": "失効した生命保険契約を復活させる場合、復活後の保険料は、復活時の年齢・保険料率で計算される。", "a": false, "e": "誤りです。\n【根拠】復活後の保険料は、失効前の保険料率が適用されます。\n【ひっかけ】復活には告知又は診査と、延滞保険料（及び利息）の払込みが必要です。"}, {"id": "tf:7595b72201", "c": 2, "s": "問題2-2", "st": 2, "q": "生命保険会社の責任開始日は、保険会社の承諾を前提として、申込み・告知（診査）・第1回保険料の払込みの3つがそろった日である。", "a": true, "e": "正しい記述です。\n【根拠】3つがそろった日から保障が始まります。\n【ひっかけ】保険会社の承諾日ではありません。承諾は責任開始日にさかのぼって効力が生じます。"}, {"id": "tf:08dc13b8a1", "c": 2, "s": "問題2-2", "st": 2, "q": "告知義務違反があった場合、保険会社は契約締結から10年を経過するまでは、いつでも契約を解除することができる。", "a": false, "e": "誤りです。\n【根拠】解除権は、原因を知った時から1か月行使しないとき、又は契約締結から5年を経過したときに消滅します。\n【ひっかけ】数字を変える出題に注意します。"}, {"id": "tf:ba8b19d222", "c": 2, "s": "問題2-2", "st": 2, "q": "生命保険の保険料の計算において、予定利率を低く設定すると、保険料は安くなる。", "a": false, "e": "誤りです。\n【根拠】予定利率が低いと運用で見込める収益が減るため、保険料は高くなります。\n【ひっかけ】予定死亡率・予定事業費率は、高く設定すると保険料が高くなります。"}, {"id": "tf:ae58a3e40b", "c": 2, "s": "問題2-2", "st": 1, "q": "生命保険の剰余金は、主に死差益・利差益・費差益の3つから生じる。", "a": true, "e": "正しい記述です。\n【根拠】予定と実際の差から生じる3利源で、契約者配当の財源となります。\n【ひっかけ】無配当保険は、配当がない分だけ保険料が割安です。"}, {"id": "tf:c78438102b", "c": 2, "s": "問題2-2", "st": 1, "q": "更新型の定期保険特約付終身保険は、更新時の年齢で保険料が計算されるため、通常、更新後の保険料は更新前より高くなる。", "a": true, "e": "正しい記述です。\n【根拠】更新時には健康状態の告知は不要ですが、保険料は更新時の年齢で再計算されます。\n【ひっかけ】保険料が上がる点を見落とさせる出題が多い論点です。"}, {"id": "tf:6558d35b7c", "c": 2, "s": "問題2-2", "st": 2, "q": "個人年金保険の有期年金は、年金受取期間中に被保険者が死亡した場合でも、残りの期間の年金が遺族に支払われる。", "a": false, "e": "誤りです。\n【根拠】有期年金は、被保険者が生存している場合に限り年金が支払われます。\n【ひっかけ】生死にかかわらず一定期間支払われるのは確定年金です。"}, {"id": "tf:c62061a000", "c": 2, "s": "問題2-3", "st": 2, "q": "2012年1月1日以後に締結した生命保険契約に係る生命保険料控除の所得税の控除限度額は、一般・介護医療・個人年金の合計で12万円である。", "a": true, "e": "正しい記述です。\n【根拠】各区分4万円、合計12万円が限度です。\n【ひっかけ】住民税は各2万8,000円、合計7万円が限度です。"}, {"id": "tf:ce1cfad103", "c": 2, "s": "問題2-3", "st": 2, "q": "契約者（保険料負担者）と被保険者が夫、死亡保険金受取人が妻である生命保険契約において、妻が受け取る死亡保険金は所得税（一時所得）の課税対象となる。", "a": false, "e": "誤りです。\n【根拠】契約者＝被保険者の死亡保険金は、相続税の課税対象です。\n【ひっかけ】契約者＝受取人なら所得税（一時所得）、三者がすべて異なれば贈与税です。"}, {"id": "tf:223206ed07", "c": 2, "s": "問題2-3", "st": 2, "q": "契約者（保険料負担者）と死亡保険金受取人が妻、被保険者が夫である生命保険契約において、妻が受け取る死亡保険金は所得税（一時所得）の課税対象となる。", "a": true, "e": "正しい記述です。\n【根拠】契約者＝受取人の場合、自分が負担した保険料で自分が受け取るため、所得税（一時所得）となります。\n【ひっかけ】相続税の「死亡保険金の非課税金額」は使えません。"}, {"id": "tf:f7f8df1496", "c": 2, "s": "問題2-3", "st": 2, "q": "契約者（保険料負担者）が夫、被保険者が妻、死亡保険金受取人が子である生命保険契約において、子が受け取る死亡保険金は贈与税の課税対象となる。", "a": true, "e": "正しい記述です。\n【根拠】契約者・被保険者・受取人がすべて異なる場合は、贈与税の対象です。\n【ひっかけ】保険料を負担した夫から、子への贈与とみなされます。"}, {"id": "tf:aa724bb691", "c": 2, "s": "問題2-3", "st": 2, "q": "被保険者が受け取る入院給付金や手術給付金は、一時所得として所得税の課税対象となる。", "a": false, "e": "誤りです。\n【根拠】身体の傷害・疾病に基因して受け取る入院給付金・手術給付金は非課税です。\n【ひっかけ】高度障害保険金やリビング・ニーズ特約の保険金も非課税です。"}, {"id": "tf:8b9f6f4150", "c": 2, "s": "問題2-3", "st": 1, "q": "個人年金保険の年金を受け取った場合、公的年金等以外の雑所得として所得税の課税対象となる。", "a": true, "e": "正しい記述です。\n【根拠】契約者＝年金受取人の個人年金は、雑所得（公的年金等以外）です。\n【ひっかけ】公的年金等控除の対象にはなりません。"}, {"id": "tf:21f3d3017d", "c": 2, "s": "問題2-3", "st": 1, "q": "2011年12月31日以前に締結した生命保険契約（旧契約）に係る一般の生命保険料控除の所得税の控除限度額は5万円である。", "a": true, "e": "正しい記述です。\n【根拠】旧契約は、一般・個人年金の各区分で所得税5万円が限度です。\n【ひっかけ】新契約は各4万円です。新旧の契約がある場合の上限計算に注意します。"}, {"id": "tf:d1e94657ce", "c": 2, "s": "問題2-3", "st": 1, "q": "医療保険やがん保険の保険料は、介護医療保険料控除の対象となる。", "a": true, "e": "正しい記述です。\n【根拠】2012年以後の契約では、医療保険・がん保険・介護保険などは介護医療保険料控除の対象です。\n【ひっかけ】定期保険・終身保険は一般の生命保険料控除です。"}, {"id": "tf:278d8d73f2", "c": 2, "s": "問題2-4", "st": 2, "q": "失火責任法では、軽過失により隣家を焼失させた場合でも、隣家に対して損害賠償責任を負う。", "a": false, "e": "誤りです。\n【根拠】失火責任法により、重大な過失がなければ不法行為による損害賠償責任を負いません。\n【ひっかけ】借家人が借家を焼失させた場合は、家主に対して債務不履行責任を負います。区別が頻出です。"}, {"id": "tf:a5de940652", "c": 2, "s": "問題2-4", "st": 2, "q": "地震保険は、火災保険に付帯して契約する必要があり、地震保険単独で契約することはできない。", "a": true, "e": "正しい記述です。\n【根拠】地震保険は火災保険に付帯して契約します。火災保険の契約期間の途中からでも付帯できます。\n【ひっかけ】保険金額は火災保険の30％〜50％の範囲内で、建物5,000万円・家財1,000万円が上限です。"}, {"id": "tf:824a0ea36b", "c": 2, "s": "問題2-4", "st": 2, "q": "地震保険の保険金額は、主契約である火災保険の保険金額の30％〜50％の範囲内で、建物は1,000万円、家財は500万円が上限である。", "a": false, "e": "誤りです。\n【根拠】上限は建物5,000万円、家財1,000万円です。\n【ひっかけ】地震を原因とする火災損害は、火災保険では補償されません。"}, {"id": "tf:16c6e49dda", "c": 2, "s": "問題2-4", "st": 2, "q": "自動車損害賠償責任保険（自賠責保険）の支払限度額は、被害者1人につき死亡の場合3,000万円、傷害の場合120万円である。", "a": true, "e": "正しい記述です。\n【根拠】後遺障害は、常時介護を要する場合で4,000万円が上限です。\n【ひっかけ】自賠責保険は対人賠償のみで、物損は補償されません。"}, {"id": "tf:b7b416ca3c", "c": 2, "s": "問題2-4", "st": 1, "q": "自動車保険の対人賠償保険では、運転者の父母が事故によりけがをした場合も補償の対象となる。", "a": false, "e": "誤りです。\n【根拠】対人賠償保険では、運転者本人やその配偶者・父母・子の死傷は補償されません。\n【ひっかけ】その場合は、人身傷害補償保険などで補償されます。"}, {"id": "tf:b4ebe19d65", "c": 2, "s": "問題2-4", "st": 2, "q": "個人賠償責任保険では、業務遂行中に他人の物を壊した場合の賠償責任も補償の対象となる。", "a": false, "e": "誤りです。\n【根拠】業務遂行中の事故は個人賠償責任保険の対象外です。\n【ひっかけ】自動車の運転による事故や、他人から借りた物の損壊も対象外です。"}, {"id": "tf:6718fe0ce4", "c": 2, "s": "問題2-4", "st": 1, "q": "地震保険料控除の所得税の控除限度額は5万円である。", "a": true, "e": "正しい記述です。\n【根拠】所得税は地震保険料の全額で最高5万円、住民税は2分の1で最高2万5,000円です。\n【ひっかけ】火災保険料は、地震保険料控除の対象外です。"}, {"id": "tf:f16942c7f6", "c": 2, "s": "問題2-4", "st": 2, "q": "普通傷害保険では、細菌性食中毒は補償の対象とならない。", "a": true, "e": "正しい記述です。\n【根拠】普通傷害保険では、細菌性食中毒や地震・噴火・津波によるけがは補償されません。\n【ひっかけ】海外旅行傷害保険は、細菌性食中毒も地震などによるけがも補償します。"}, {"id": "tf:809c99ac52", "c": 2, "s": "問題2-4", "st": 2, "q": "国内旅行傷害保険では、地震・噴火・津波によるけがも補償の対象となる。", "a": false, "e": "誤りです。\n【根拠】国内旅行傷害保険は細菌性食中毒を補償しますが、地震・噴火・津波によるけがは補償しません。\n【ひっかけ】海外旅行傷害保険とあわせて整理します。"}, {"id": "tf:d4f699e1d1", "c": 2, "s": "問題2-4", "st": 1, "q": "家族傷害保険の被保険者には、生計を一にする別居の未婚の子も含まれる。", "a": true, "e": "正しい記述です。\n【根拠】本人・配偶者・生計を一にする同居の親族・生計を一にする別居の未婚の子が対象です。\n【ひっかけ】家族の範囲は、事故の時点で判定します。"}, {"id": "tf:ec8a194a56", "c": 2, "s": "問題2-4", "st": 2, "q": "飲食店が提供した料理で客が食中毒になった場合の損害賠償責任は、施設所有（管理）者賠償責任保険で補償される。", "a": false, "e": "誤りです。\n【根拠】提供した料理（製品・仕事の結果）による事故は、生産物賠償責任保険（PL保険）で補償されます。\n【ひっかけ】施設所有（管理）者賠償責任保険は、施設の管理不備や業務遂行中の事故が対象です。"}, {"id": "tf:3b73fb712d", "c": 2, "s": "問題2-4", "st": 1, "q": "自動車保険の車両保険のエコノミー型（車対車＋A）では、単独事故や当て逃げによる損害は補償されない。", "a": true, "e": "正しい記述です。\n【根拠】エコノミー型は、一般型に比べ保険料が安い代わりに補償範囲が狭くなります。\n【ひっかけ】相手が特定できる車同士の事故は補償されます。"}, {"id": "tf:3b21ffcdef", "c": 2, "s": "問題2-5", "st": 2, "q": "がん保険では、通常、契約日から90日間（3か月）の免責期間が設けられている。", "a": true, "e": "正しい記述です。\n【根拠】免責期間中にがんと診断されても、保険金は支払われません。\n【ひっかけ】入院給付金の支払日数には、通常限度がありません。"}, {"id": "tf:e5d10a89b1", "c": 2, "s": "問題2-5", "st": 1, "q": "先進医療特約で対象となる先進医療は、契約時点において厚生労働大臣が定めているものに限られる。", "a": false, "e": "誤りです。\n【根拠】対象となるのは、療養を受けた時点で厚生労働大臣が定める先進医療です。\n【ひっかけ】契約時点ではなく「療養時点」が基準です。"}, {"id": "tf:fcbec694a5", "c": 2, "s": "問題2-5", "st": 2, "q": "法人が契約者・満期保険金受取人、役員・従業員全員が被保険者、死亡保険金受取人が被保険者の遺族である養老保険の保険料は、その2分の1を損金に算入できる。", "a": true, "e": "正しい記述です。\n【根拠】いわゆる福利厚生プラン（ハーフタックスプラン）で、2分の1を保険料（損金）、2分の1を保険料積立金（資産）とします。\n【ひっかけ】特定の役員だけを被保険者とすると、2分の1は給与扱いになります。"}, {"id": "tf:13ce8f7347", "c": 2, "s": "問題2-5", "st": 1, "q": "法人が契約者・死亡保険金受取人である終身保険の支払保険料は、全額を損金に算入できる。", "a": false, "e": "誤りです。\n【根拠】終身保険の保険料は、保険料積立金として資産に計上します。\n【ひっかけ】最高解約返戻率50％以下の定期保険は、原則として全額損金です。"}, {"id": "tf:4eeabae085", "c": 2, "s": "問題2-5", "st": 1, "q": "医療保険で、退院後180日以内に同じ病気で再入院した場合は、通常、前後の入院を1回の入院とみなして支払限度日数が計算される。", "a": true, "e": "正しい記述です。\n【根拠】多くの医療保険で、180日以内の同じ原因の再入院は1回の入院とみなされます。\n【ひっかけ】がん保険の入院給付金は、支払日数の限度がないのが一般的です。"}, {"id": "tf:5374e3ca7b", "c": 2, "s": "問題2-5", "st": 1, "q": "法人が受取人である定期保険の死亡保険金を受け取った場合、資産計上額がないときは、その全額を雑収入として益金に算入する。", "a": true, "e": "正しい記述です。\n【根拠】受け取った保険金は益金です。資産計上している保険料積立金があれば、それを取り崩して差額を雑収入とします。\n【ひっかけ】役員への死亡退職金に充てた場合、その退職金は損金になります（不相当に高額な部分を除く）。"}, {"id": "tf:81e277b3e2", "c": 3, "s": "問題3-1", "st": 2, "q": "景気動向指数は、内閣府が毎月公表しており、CIは主として景気変動の大きさやテンポを、DIは景気の各経済部門への波及度合いを測定する。", "a": true, "e": "正しい記述です。\n【根拠】現在はCIを中心とした公表形態となっています。\n【ひっかけ】CIとDIの説明を入れ替える出題に注意します。"}, {"id": "tf:31d7e9378d", "c": 3, "s": "問題3-1", "st": 2, "q": "全国企業短期経済観測調査（日銀短観）は、内閣府が毎月公表する。", "a": false, "e": "誤りです。\n【根拠】日銀短観は、日本銀行が四半期ごと（年4回）に公表します。\n【ひっかけ】内閣府が公表するのはGDPや景気動向指数です。"}, {"id": "tf:af9e4655e7", "c": 3, "s": "問題3-1", "st": 1, "q": "消費者物価指数は総務省が、企業物価指数は日本銀行が公表している。", "a": true, "e": "正しい記述です。\n【根拠】消費者物価指数は総務省、企業物価指数は日本銀行が毎月公表します。\n【ひっかけ】公表機関の入れ替えが頻出です。"}, {"id": "tf:c9b16c1261", "c": 3, "s": "問題3-1", "st": 1, "q": "マネーストック統計は、金融機関や中央政府が保有する預金も含めた通貨量の残高を示す。", "a": false, "e": "誤りです。\n【根拠】マネーストックには、金融機関や中央政府が保有する預金などは含まれません。\n【ひっかけ】一般法人・個人・地方公共団体などの通貨保有主体が保有する通貨量です。"}, {"id": "tf:eacb1fe9a7", "c": 3, "s": "問題3-1", "st": 2, "q": "日本銀行が国債等を買い入れる公開市場操作（買いオペ）を行うと、一般に市中の資金量が増え、金利の低下要因となる。", "a": true, "e": "正しい記述です。\n【根拠】買いオペは市場に資金を供給するため、金利の低下要因になります。\n【ひっかけ】売りオペは資金を吸収し、金利の上昇要因になります。"}, {"id": "tf:639496fcec", "c": 3, "s": "問題3-1", "st": 1, "q": "景気動向指数のDIは、一般に50％を上回ると景気拡張の局面、50％を下回ると景気後退の局面とされる。", "a": true, "e": "正しい記述です。\n【根拠】一致指数のDIが50％を上回れば拡張、下回れば後退とみます。\n【ひっかけ】CIは、上昇・下降の大きさで景気を判断します。"}, {"id": "tf:772c7602b5", "c": 3, "s": "問題3-2", "st": 2, "q": "一般に、市場金利が上昇すると既発債券の価格は下落する。", "a": true, "e": "正しい記述です。\n【根拠】金利が上がると、利率の低い既発債の魅力が下がるため、価格が下落します。\n【ひっかけ】金利と債券価格は逆に動きます。"}, {"id": "tf:50b2c5b9c4", "c": 3, "s": "問題3-2", "st": 2, "q": "他の条件が同じであれば、残存期間が短い債券ほど、金利変動に対する価格変動が大きい。", "a": false, "e": "誤りです。\n【根拠】残存期間が長い債券ほど、金利変動に対する価格変動（デュレーション）が大きくなります。\n【ひっかけ】表面利率が低いほど価格変動が大きい点もあわせて押さえます。"}, {"id": "tf:00781adf25", "c": 3, "s": "問題3-2", "st": 2, "q": "格付けがBB（ダブルB）以上の債券は、一般に投資適格債とされる。", "a": false, "e": "誤りです。\n【根拠】投資適格債とされるのは、BBB（トリプルB）以上です。\n【ひっかけ】BB以下は投機的格付債（ハイ・イールド債）とされます。"}, {"id": "tf:8b48cdf276", "c": 3, "s": "問題3-2", "st": 1, "q": "表面利率1.0％、残存期間4年の固定利付債券を額面100円あたり98円で購入した場合の最終利回り（単利）は、約1.53％である。", "a": true, "e": "正しい記述です。\n【根拠】（1.0＋（100－98）÷4）÷98×100＝1.5÷98×100≒1.53％です。\n【ひっかけ】割るのは額面ではなく購入価格です。"}, {"id": "tf:800d4547e7", "c": 3, "s": "問題3-2", "st": 2, "q": "個人向け国債は、いずれの種類も発行後6か月を経過すれば中途換金できる。", "a": false, "e": "誤りです。\n【根拠】個人向け国債は、発行から1年を経過すれば中途換金できます。\n【ひっかけ】中途換金時は、直前2回分の各利子（税引前）相当額×0.79685が差し引かれます。"}, {"id": "tf:e81e368f40", "c": 3, "s": "問題3-2", "st": 1, "q": "個人向け国債の適用利率の下限は、いずれの種類も年0.05％である。", "a": true, "e": "正しい記述です。\n【根拠】変動10年・固定5年・固定3年とも、下限は年0.05％です。\n【ひっかけ】変動10年の利率は半年ごとに見直されます。"}, {"id": "tf:3f75506f96", "c": 3, "s": "問題3-2", "st": 2, "q": "直接利回りは、債券の表面利率を購入価格で除して求める。", "a": true, "e": "正しい記述です。\n【根拠】直接利回り＝表面利率÷購入価格×100です。償還差益は考えません。\n【ひっかけ】最終利回りは、償還差損益を加えて計算します。"}, {"id": "tf:9ca31a97a1", "c": 3, "s": "問題3-2", "st": 2, "q": "応募者利回りとは、既発債を時価で購入し、償還まで保有した場合の利回りをいう。", "a": false, "e": "誤りです。\n【根拠】応募者利回りは、新発債を発行価格で購入し償還まで保有した場合の利回りです。\n【ひっかけ】既発債を購入し償還まで保有した場合は最終利回りです。"}, {"id": "tf:68a3c2636b", "c": 3, "s": "問題3-2", "st": 1, "q": "割引債のデュレーションは、その債券の残存期間と等しい。", "a": true, "e": "正しい記述です。\n【根拠】途中で利息の支払がない割引債は、デュレーション＝残存期間です。\n【ひっかけ】利付債のデュレーションは残存期間より短くなります。"}, {"id": "tf:21f2c9637d", "c": 3, "s": "問題3-3", "st": 2, "q": "PER（株価収益率）は、株価を1株当たり純資産で除して求める。", "a": false, "e": "誤りです。\n【根拠】PERは株価÷1株当たり純利益です。\n【ひっかけ】株価÷1株当たり純資産はPBRです。"}, {"id": "tf:9153548e4a", "c": 3, "s": "問題3-3", "st": 2, "q": "ROE（自己資本利益率）は、当期純利益を自己資本で除して求める。", "a": true, "e": "正しい記述です。\n【根拠】ROE＝当期純利益÷自己資本×100です。\n【ひっかけ】ROA（総資産利益率）は、利益÷総資産で求めます。"}, {"id": "tf:ac193e7cfc", "c": 3, "s": "問題3-3", "st": 2, "q": "上場株式の普通取引は、約定日から起算して3営業日目に受渡しが行われる。", "a": true, "e": "正しい記述です。\n【根拠】約定日を含めて3営業日目に受渡しが行われます。\n【ひっかけ】「4営業日目」としていた時期がありますが、現在は3営業日目です。"}, {"id": "tf:02475a056d", "c": 3, "s": "問題3-3", "st": 2, "q": "日経平均株価は、時価総額加重型の株価指数であり、時価総額の大きい銘柄の影響を受けやすい。", "a": false, "e": "誤りです。\n【根拠】日経平均株価は株価平均型の指数で、値がさ株（株価の高い銘柄）の影響を受けやすいです。\n【ひっかけ】時価総額加重型はTOPIXです。"}, {"id": "tf:647b5b7844", "c": 3, "s": "問題3-3", "st": 1, "q": "株価が1,200円、1株当たり年間配当金が30円の場合、配当利回りは2.5％である。", "a": true, "e": "正しい記述です。\n【根拠】30円÷1,200円×100＝2.5％です。\n【ひっかけ】配当性向（配当÷1株当たり純利益）と区別します。"}, {"id": "tf:395b090735", "c": 3, "s": "問題3-3", "st": 2, "q": "信用取引の委託保証金は、約定代金の30％以上で、かつ30万円以上が必要である。", "a": true, "e": "正しい記述です。\n【根拠】委託保証金率30％以上・最低30万円が必要です。\n【ひっかけ】数字を入れ替える出題に注意します。"}, {"id": "tf:ebe182b27d", "c": 3, "s": "問題3-3", "st": 1, "q": "制度信用取引の返済期限は、最長1年である。", "a": false, "e": "誤りです。\n【根拠】制度信用取引の返済期限は最長6か月です。\n【ひっかけ】一般信用取引は、証券会社と顧客の間で返済期限を決めます。"}, {"id": "tf:8b479915b5", "c": 3, "s": "問題3-4", "st": 2, "q": "信託財産留保額は、投資信託の保有期間中、信託財産から日々差し引かれる費用である。", "a": false, "e": "誤りです。\n【根拠】保有期間中に差し引かれるのは信託報酬です。信託財産留保額は、解約時に差し引かれます。\n【ひっかけ】信託財産留保額は信託財産に残り、残った受益者に還元されます。"}, {"id": "tf:80f0b16b58", "c": 3, "s": "問題3-4", "st": 2, "q": "追加型株式投資信託の分配金のうち、元本払戻金（特別分配金）は非課税である。", "a": true, "e": "正しい記述です。\n【根拠】元本払戻金は元本の一部の払戻しとされ、非課税です。受け取ると個別元本は下がります。\n【ひっかけ】普通分配金は配当所得として課税されます。"}, {"id": "tf:e149231a7f", "c": 3, "s": "問題3-4", "st": 1, "q": "ETF（上場投資信託）は、証券取引所に上場しているため指値注文や成行注文ができるが、信用取引はできない。", "a": false, "e": "誤りです。\n【根拠】ETFは上場株式と同様に信用取引もできます。\n【ひっかけ】非上場の投資信託は、1日1回算出される基準価額で取引します。"}, {"id": "tf:dabc73f042", "c": 3, "s": "問題3-4", "st": 2, "q": "NISAのつみたて投資枠の年間投資上限額は120万円、成長投資枠の年間投資上限額は240万円である。", "a": true, "e": "正しい記述です。\n【根拠】両方の枠を併用でき、年間合計360万円まで投資できます。\n【ひっかけ】非課税保有限度額は生涯1,800万円（うち成長投資枠1,200万円）です。"}, {"id": "tf:749359d3f4", "c": 3, "s": "問題3-4", "st": 2, "q": "NISA口座で保有する上場株式を売却して生じた損失は、特定口座で生じた譲渡益と損益通算することができる。", "a": false, "e": "誤りです。\n【根拠】NISA口座の損失は、損益通算も繰越控除もできません。\n【ひっかけ】利益が非課税である代わりに、損失はなかったものとされます。"}, {"id": "tf:e3d9656cee", "c": 3, "s": "問題3-4", "st": 1, "q": "NISAの非課税保有限度額は、保有商品を売却すると、その翌年以降に売却した商品の簿価分の枠が再利用できる。", "a": true, "e": "正しい記述です。\n【根拠】非課税保有限度額は買付額（簿価）で管理され、売却した分は翌年以降に枠が復活します。\n【ひっかけ】年間投資枠（360万円）までという制限は残ります。"}, {"id": "tf:a3c310d12c", "c": 3, "s": "問題3-4", "st": 2, "q": "ドル・コスト平均法により毎月一定額ずつ投資信託を購入すると、毎月一定口数ずつ購入する場合に比べ、平均購入単価を低く抑える効果が期待できる。", "a": true, "e": "正しい記述です。\n【根拠】価格が安いときに多く、高いときに少なく買うことになるためです。\n【ひっかけ】一定口数ずつ買う方法ではこの効果はありません。"}, {"id": "tf:c33f2db7dc", "c": 3, "s": "問題3-4", "st": 1, "q": "投資信託の交付目論見書は、顧客から請求があった場合にのみ交付すればよい。", "a": false, "e": "誤りです。\n【根拠】交付目論見書は、投資家に必ず交付しなければなりません（あらかじめ又は同時に）。\n【ひっかけ】請求があった場合に交付するのは請求目論見書です。"}, {"id": "tf:d6b3d6b02f", "c": 3, "s": "問題3-4", "st": 1, "q": "上場投資信託（ETF）の分配金は、配当所得として課税される。", "a": true, "e": "正しい記述です。\n【根拠】ETFの分配金は上場株式の配当と同様、配当所得です。\n【ひっかけ】J-REITと同様に、配当控除の対象にならないETFもあります。"}, {"id": "tf:8d6d293780", "c": 3, "s": "問題3-5", "st": 2, "q": "2資産間の相関係数が－1である場合、分散投資によるリスク低減効果は得られない。", "a": false, "e": "誤りです。\n【根拠】相関係数が－1のとき、リスク低減効果は最大となります。リスク低減効果がないのは＋1のときです。\n【ひっかけ】相関係数は－1から＋1の範囲の値をとります。"}, {"id": "tf:eec605c607", "c": 3, "s": "問題3-5", "st": 1, "q": "シャープ・レシオは、ポートフォリオの収益率から無リスク資産利子率を差し引いた値を、標準偏差で除して求める。", "a": true, "e": "正しい記述です。\n【根拠】値が大きいほど、とったリスクに見合ったリターンを得られたと評価されます。\n【ひっかけ】分母は標準偏差（リスク）であり、ベータではありません。"}, {"id": "tf:229c9f4443", "c": 3, "s": "問題3-5", "st": 2, "q": "オプション取引において、オプションの買い手の最大損失は、支払ったプレミアムに限定される。", "a": true, "e": "正しい記述です。\n【根拠】買い手は不利なときに権利を放棄すればよいため、損失はプレミアムに限定されます。\n【ひっかけ】売り手の損失は、コールの売りでは無限定となりえます。"}, {"id": "tf:ffbf3ea991", "c": 3, "s": "問題3-5", "st": 2, "q": "TTSは、顧客が外貨を円に換える際に適用される為替レートである。", "a": false, "e": "誤りです。\n【根拠】TTSは顧客が円を外貨に換える（銀行が外貨を売る）ときのレートです。\n【ひっかけ】外貨を円に換えるときはTTBです。"}, {"id": "tf:ec6ddde00d", "c": 3, "s": "問題3-5", "st": 1, "q": "外貨預金の為替差益は、雑所得として総合課税の対象となる。", "a": true, "e": "正しい記述です。\n【根拠】外貨預金の為替差益は雑所得（総合課税）です。\n【ひっかけ】利子は源泉分離課税（20.315％）です。"}, {"id": "tf:238c1e2db2", "c": 3, "s": "問題3-5", "st": 2, "q": "システマティック・リスク（市場リスク）は、銘柄を分散することで低減できる。", "a": false, "e": "誤りです。\n【根拠】分散投資で低減できるのは、個別銘柄に固有のアンシステマティック・リスクです。\n【ひっかけ】システマティック・リスクは、市場全体に共通するため分散しても消えません。"}, {"id": "tf:aa1e43d755", "c": 3, "s": "問題3-5", "st": 1, "q": "オプションのプレミアムは、他の条件が同じであれば、満期までの残存期間が長いほど高くなる。", "a": true, "e": "正しい記述です。\n【根拠】残存期間が長いほど、権利行使で利益が出る可能性が高まるためです。\n【ひっかけ】ボラティリティ（価格変動率）が高いほど、プレミアムは高くなります。"}, {"id": "tf:8badce9615", "c": 3, "s": "問題3-5", "st": 1, "q": "金利スワップ取引では、通常、元本の交換は行われない。", "a": true, "e": "正しい記述です。\n【根拠】金利スワップは、同じ通貨で固定金利と変動金利などの利息部分だけを交換します。\n【ひっかけ】通貨スワップでは、元本の交換が行われます。"}, {"id": "tf:eb98845e0b", "c": 3, "s": "問題3-6", "st": 2, "q": "決済用預金は、預金保険制度により全額が保護される。", "a": true, "e": "正しい記述です。\n【根拠】無利息・要求払い・決済サービスの提供の3要件を満たす決済用預金は、全額保護されます。\n【ひっかけ】その他の預金は元本1,000万円までとその利息等が保護されます。"}, {"id": "tf:b4a0c2c50d", "c": 3, "s": "問題3-6", "st": 2, "q": "外貨預金は、預金保険制度により元本1,000万円までとその利息等が保護される。", "a": false, "e": "誤りです。\n【根拠】外貨預金は預金保険制度の保護の対象外です。\n【ひっかけ】譲渡性預金も対象外です。"}, {"id": "tf:128fdc5f62", "c": 3, "s": "問題3-6", "st": 1, "q": "銀行で購入した投資信託は、日本投資者保護基金の補償の対象となる。", "a": false, "e": "誤りです。\n【根拠】銀行は日本投資者保護基金の会員ではないため、補償の対象外です。\n【ひっかけ】投資信託は分別管理されているため、販売会社が破綻しても通常は財産が保全されます。"}, {"id": "tf:6c5fcb951c", "c": 3, "s": "問題3-6", "st": 1, "q": "消費者契約法による保護の対象には、法人は含まれない。", "a": true, "e": "正しい記述です。\n【根拠】消費者契約法の「消費者」は個人（事業として契約する場合を除く）です。\n【ひっかけ】金融サービス提供法の重要事項の説明義務は、原則として個人・法人とも対象です（特定顧客を除く）。"}, {"id": "tf:0d19c035bc", "c": 3, "s": "問題3-7", "st": 2, "q": "外貨建MMFの為替差益は、非課税である。", "a": false, "e": "誤りです。\n【根拠】2016年以後、外貨建MMFは特定公社債等として扱われ、為替差益を含む譲渡益は申告分離課税の対象です。\n【ひっかけ】以前は非課税だったことを使った出題です。"}, {"id": "tf:93a0703569", "c": 3, "s": "問題3-7", "st": 2, "q": "預入時に満期時の為替レートを予約した外貨定期預金の為替差益は、源泉分離課税の対象となる。", "a": true, "e": "正しい記述です。\n【根拠】預入時に為替予約を付けた場合の為替差益は、利子とともに20.315％の源泉分離課税です。\n【ひっかけ】予約を付けない場合の為替差益は雑所得（総合課税）です。"}, {"id": "tf:e83c615dfd", "c": 3, "s": "問題3-7", "st": 2, "q": "上場株式等の配当について申告分離課税を選択した場合、配当控除の適用を受けることができる。", "a": false, "e": "誤りです。\n【根拠】配当控除は総合課税を選択した場合に限り受けられます。\n【ひっかけ】申告分離課税を選ぶと、上場株式等の譲渡損失と損益通算できます。"}, {"id": "tf:17c57d2c13", "c": 3, "s": "問題3-7", "st": 2, "q": "特定口座の「源泉徴収あり」を選択した場合、上場株式の譲渡益について原則として確定申告は不要である。", "a": true, "e": "正しい記述です。\n【根拠】源泉徴収で課税が完了するため、確定申告は不要です（申告することもできます）。\n【ひっかけ】他の口座との損益通算や繰越控除を受けるには確定申告が必要です。"}, {"id": "tf:89cf4e4bdf", "c": 3, "s": "問題3-7", "st": 1, "q": "特定公社債の利子は、上場株式等の譲渡損失と損益通算することができる。", "a": true, "e": "正しい記述です。\n【根拠】特定公社債の利子・譲渡損益は、上場株式等と同じグループで損益通算できます。\n【ひっかけ】預貯金の利子は源泉分離課税のため、損益通算できません。"}, {"id": "tf:1e868cd2c9", "c": 3, "s": "問題3-7", "st": 1, "q": "個人が保有期間5年超の金地金を売却した場合、譲渡所得の金額の2分の1が総合課税の対象となる。", "a": true, "e": "正しい記述です。\n【根拠】金地金の売却益は総合課税の譲渡所得で、長期（5年超）なら2分の1が課税対象です。\n【ひっかけ】上場株式のような申告分離課税ではありません。"}, {"id": "tf:2edbcd9d6e", "c": 4, "s": "問題4-1", "st": 2, "q": "所得税は、個人の所得を10種類に区分して計算し、総合課税の対象となる所得には超過累進税率が適用される。", "a": true, "e": "正しい記述です。\n【根拠】所得は10種類に区分され、総合課税の所得には5％〜45％の超過累進税率が適用されます。\n【ひっかけ】退職所得・山林所得や土地等の譲渡所得は分離課税です。"}, {"id": "tf:8de71b6e6a", "c": 4, "s": "問題4-1", "st": 1, "q": "給与所得者が勤務先から受け取る通勤手当は、金額にかかわらずその全額が非課税である。", "a": false, "e": "誤りです。\n【根拠】通勤手当の非課税限度額は、原則として月15万円です。\n【ひっかけ】宝くじの当せん金や遺族年金・障害年金は非課税です。"}, {"id": "tf:806611bae4", "c": 4, "s": "問題4-1", "st": 1, "q": "復興特別所得税の額は、基準所得税額に2.1％を乗じて計算する。", "a": true, "e": "正しい記述です。\n【根拠】2037年分まで、基準所得税額×2.1％を所得税とあわせて納めます。\n【ひっかけ】利子・配当などの源泉徴収税率15.315％は、15％×1.021で計算したものです。"}, {"id": "tf:d090bf0269", "c": 4, "s": "問題4-2", "st": 2, "q": "勤続年数が25年の者が受け取る退職金に係る退職所得控除額は、1,150万円である。", "a": true, "e": "正しい記述です。\n【根拠】800万円＋70万円×（25年－20年）＝1,150万円です。\n【ひっかけ】40万円×25年＝1,000万円と計算してしまう誤りに注意します。"}, {"id": "tf:62b305e661", "c": 4, "s": "問題4-2", "st": 2, "q": "退職所得控除額の計算において、勤続年数に1年未満の端数がある場合は、その端数を切り捨てる。", "a": false, "e": "誤りです。\n【根拠】1年未満の端数は1年に切り上げます。\n【ひっかけ】勤続20年1か月なら21年として計算します。"}, {"id": "tf:94895794ab", "c": 4, "s": "問題4-2", "st": 1, "q": "「退職所得の受給に関する申告書」を提出しなかった場合、退職手当等の収入金額に対して20.42％の税率で源泉徴収される。", "a": true, "e": "正しい記述です。\n【根拠】申告書を提出しない場合は、退職所得控除が適用されず、収入金額×20.42％が源泉徴収されます。その場合は確定申告で精算します。\n【ひっかけ】申告書を提出すれば、原則として確定申告は不要です。"}, {"id": "tf:b2afdc47e9", "c": 4, "s": "問題4-2", "st": 2, "q": "一時所得の金額は、総収入金額からその収入を得るために支出した金額を控除し、さらに特別控除額（最高50万円）を控除した金額であり、その全額が総所得金額に算入される。", "a": false, "e": "誤りです。\n【根拠】総所得金額に算入されるのは、一時所得の金額の2分の1です。\n【ひっかけ】退職所得も2分の1ですが、こちらは分離課税です。"}, {"id": "tf:9bd0f7d004", "c": 4, "s": "問題4-2", "st": 2, "q": "土地の譲渡所得が長期譲渡所得に該当するかどうかは、譲渡した日における所有期間が5年を超えるかどうかで判定する。", "a": false, "e": "誤りです。\n【根拠】譲渡した年の1月1日における所有期間が5年を超えるかどうかで判定します。\n【ひっかけ】「譲渡した日」とする出題が定番のひっかけです。"}, {"id": "tf:a7bb45fb06", "c": 4, "s": "問題4-2", "st": 1, "q": "土地・建物等の取得費が不明な場合には、譲渡収入金額の5％相当額を取得費とすることができる。", "a": true, "e": "正しい記述です。\n【根拠】概算取得費として、譲渡収入金額の5％を使えます。実際の取得費が5％より少ない場合も選べます。\n【ひっかけ】相続で取得した土地は、被相続人の取得費と取得時期を引き継ぎます。"}, {"id": "tf:7337148d60", "c": 4, "s": "問題4-2", "st": 1, "q": "賃貸借契約に際して受け取った敷金のうち、返還を要しない部分の金額は、不動産所得の総収入金額に算入する。", "a": true, "e": "正しい記述です。\n【根拠】返還を要しないことが確定した部分は、その確定した年の収入金額に算入します。\n【ひっかけ】返還を要する部分は、預り金であり収入ではありません。"}, {"id": "tf:a304ef75ef", "c": 4, "s": "問題4-2", "st": 2, "q": "個人事業主が取得した建物の減価償却方法は、定額法に限られる。", "a": true, "e": "正しい記述です。\n【根拠】1998年4月1日以後に取得した建物は、定額法に限られます。\n【ひっかけ】2016年4月1日以後に取得した建物附属設備・構築物も定額法に限られます。"}, {"id": "tf:fa3c79fda6", "c": 4, "s": "問題4-2", "st": 2, "q": "個人事業主が取得価額10万円未満の備品を購入した場合、その取得価額の全額をその年の必要経費に算入できる。", "a": true, "e": "正しい記述です。\n【根拠】10万円未満（又は使用可能期間1年未満）の少額減価償却資産は、全額必要経費にできます。\n【ひっかけ】20万円未満は一括償却資産（3年均等償却）を選べます。"}, {"id": "tf:a9260ec3d0", "c": 4, "s": "問題4-2", "st": 1, "q": "取得価額20万円未満の減価償却資産は、一括償却資産として5年間で均等に償却することができる。", "a": false, "e": "誤りです。\n【根拠】一括償却資産は3年間で均等に償却します。\n【ひっかけ】青色申告の中小事業者の特例は30万円未満・年300万円限度です。"}, {"id": "tf:38898a7038", "c": 4, "s": "問題4-2", "st": 2, "q": "不動産の貸付けが事業的規模に満たない場合、その不動産所得の損失は、他の所得と損益通算することができない。", "a": false, "e": "誤りです。\n【根拠】不動産所得の損失は、事業的規模かどうかにかかわらず損益通算できます（土地取得の負債利子部分を除く）。\n【ひっかけ】事業的規模でないと、青色申告特別控除（55万・65万円）や専従者給与などに制限があります。"}, {"id": "tf:c1c3159c89", "c": 4, "s": "問題4-2", "st": 1, "q": "生命保険の満期保険金を一時所得として計算する場合、収入を得るために支出した金額は、その契約者が払い込んだ保険料の総額である。", "a": true, "e": "正しい記述です。\n【根拠】（満期保険金－払込保険料の総額－特別控除50万円）×1/2が総所得金額に算入されます。\n【ひっかけ】契約者以外が負担した保険料は、支出した金額に含められません。"}, {"id": "tf:12935ccf49", "c": 4, "s": "問題4-2", "st": 1, "q": "ゴルフ会員権など総合課税の対象となる資産を譲渡した場合、取得の日から譲渡の日までの所有期間が5年を超えるものは長期譲渡所得となり、その2分の1が総所得金額に算入される。", "a": true, "e": "正しい記述です。\n【根拠】総合課税の譲渡所得は、譲渡の日までの所有期間で長期・短期を判定し、長期は2分の1が課税対象です。\n【ひっかけ】土地・建物等（分離課税）は、譲渡した年の1月1日の所有期間で判定します。違いが頻出です。"}, {"id": "tf:e51ddc0f00", "c": 4, "s": "問題4-3", "st": 2, "q": "不動産所得の金額の計算上生じた損失のうち、土地の取得に要した負債の利子に相当する部分の金額は、損益通算の対象とならない。", "a": true, "e": "正しい記述です。\n【根拠】土地の取得のための借入金の利子に相当する部分は、損益通算できません。\n【ひっかけ】建物の取得のための借入金の利子に相当する部分は、損益通算できます。"}, {"id": "tf:3acf3be9e0", "c": 4, "s": "問題4-3", "st": 2, "q": "雑所得の金額の計算上生じた損失は、他の所得と損益通算することができる。", "a": false, "e": "誤りです。\n【根拠】損益通算できるのは、不動産所得・事業所得・山林所得・譲渡所得の損失だけです。\n【ひっかけ】一時所得・雑所得の損失は損益通算できません。"}, {"id": "tf:88b71fb8aa", "c": 4, "s": "問題4-3", "st": 2, "q": "ゴルフ会員権の譲渡による損失は、給与所得と損益通算することができる。", "a": false, "e": "誤りです。\n【根拠】ゴルフ会員権など生活に通常必要でない資産の譲渡損失は、損益通算できません。\n【ひっかけ】譲渡所得の損失であっても、すべてが損益通算できるわけではありません。"}, {"id": "tf:5ea06b0703", "c": 4, "s": "問題4-3", "st": 2, "q": "上場株式等の譲渡損失は、申告分離課税を選択した上場株式等の配当所得と損益通算することができる。", "a": true, "e": "正しい記述です。\n【根拠】総合課税を選択した配当所得とは損益通算できません。\n【ひっかけ】控除しきれない損失は、確定申告により翌年以後3年間繰り越せます。"}, {"id": "tf:810a4e1965", "c": 4, "s": "問題4-3", "st": 1, "q": "青色申告者の純損失の金額は、翌年以後5年間にわたって繰り越して控除することができる。", "a": false, "e": "誤りです。\n【根拠】個人の純損失の繰越控除の期間は3年間です。\n【ひっかけ】法人の欠損金の繰越期間（10年）と混同させる出題です。"}, {"id": "tf:4140d2c4df", "c": 4, "s": "問題4-4", "st": 2, "q": "医療費控除の控除額の上限は200万円である。", "a": true, "e": "正しい記述です。\n【根拠】（医療費－補てん額）－10万円（総所得金額等が200万円未満なら5％）で、上限は200万円です。\n【ひっかけ】セルフメディケーション税制の上限は8万8,000円です。"}, {"id": "tf:7289e165c6", "c": 4, "s": "問題4-4", "st": 2, "q": "セルフメディケーション税制による医療費控除の特例は、通常の医療費控除と併用することができる。", "a": false, "e": "誤りです。\n【根拠】セルフメディケーション税制と通常の医療費控除は、どちらか一方の選択適用です。\n【ひっかけ】特例は、特定一般用医薬品等の購入費のうち1万2,000円を超える部分が対象です。"}, {"id": "tf:1ad42f3fc0", "c": 4, "s": "問題4-4", "st": 1, "q": "納税者が、生計を一にする配偶者の国民年金保険料を支払った場合、その金額は納税者の社会保険料控除の対象となる。", "a": true, "e": "正しい記述です。\n【根拠】生計を一にする親族の社会保険料を負担した場合も、負担した人の社会保険料控除の対象です。\n【ひっかけ】ただし、配偶者の年金から天引きされた保険料は、天引きされた配偶者の控除となります。"}, {"id": "tf:48e9fb3043", "c": 4, "s": "問題4-4", "st": 2, "q": "詐欺により生じた損失は、雑損控除の対象となる。", "a": false, "e": "誤りです。\n【根拠】雑損控除の対象は、災害・盗難・横領による損失です。詐欺・恐喝による損失は対象外です。\n【ひっかけ】生活に通常必要でない資産（別荘など）の損失も対象外です。"}, {"id": "tf:68799dd50a", "c": 4, "s": "問題4-4", "st": 2, "q": "特定扶養親族とは、その年の12月31日現在の年齢が19歳以上23歳未満の控除対象扶養親族をいい、扶養控除の額は63万円である。", "a": true, "e": "正しい記述です。\n【根拠】特定扶養親族の扶養控除は63万円です。\n【ひっかけ】16歳未満の扶養親族は扶養控除の対象外です。"}, {"id": "tf:2bd95cc3ed", "c": 4, "s": "問題4-4", "st": 2, "q": "配偶者控除は、納税者本人の合計所得金額が2,000万円以下であれば適用を受けることができる。", "a": false, "e": "誤りです。\n【根拠】配偶者控除は、本人の合計所得金額が1,000万円以下であることが要件です。\n【ひっかけ】2,000万円以下は住宅借入金等特別控除の所得要件です。"}, {"id": "tf:22d23def4a", "c": 4, "s": "問題4-4", "st": 1, "q": "青色事業専従者として給与の支払を受けている配偶者は、配偶者控除の対象とならない。", "a": true, "e": "正しい記述です。\n【根拠】青色事業専従者や事業専従者は、配偶者控除・扶養控除の対象外です。\n【ひっかけ】専従者給与として必要経費に算入しているため、二重の控除はできません。"}, {"id": "tf:00f67e5ffe", "c": 4, "s": "問題4-4", "st": 2, "q": "人間ドックの費用は、その結果、重大な疾病が発見され、引き続きその治療を受けた場合には、医療費控除の対象となる。", "a": true, "e": "正しい記述です。\n【根拠】治療に先立って行われる診察と同様に扱われるため、対象となります。\n【ひっかけ】異常がなかった場合は、医療費控除の対象外です。"}, {"id": "tf:89d1128be3", "c": 4, "s": "問題4-4", "st": 1, "q": "美容のための歯列矯正や美容整形の費用は、医療費控除の対象となる。", "a": false, "e": "誤りです。\n【根拠】容姿を美化するための費用は、医療費控除の対象外です。\n【ひっかけ】子どもの成長を阻害しないための歯列矯正など、治療目的なら対象となります。"}, {"id": "tf:608421bdcd", "c": 4, "s": "問題4-4", "st": 1, "q": "同居特別障害者に係る障害者控除の額は75万円である。", "a": true, "e": "正しい記述です。\n【根拠】障害者27万円、特別障害者40万円、同居特別障害者75万円です。\n【ひっかけ】扶養控除と障害者控除は重ねて適用できます。"}, {"id": "tf:0b3e926d38", "c": 4, "s": "問題4-4", "st": 2, "q": "ふるさと納税のワンストップ特例は、寄附先が10自治体以内であれば適用を受けることができる。", "a": false, "e": "誤りです。\n【根拠】ワンストップ特例は、1年間の寄附先が5自治体以内の場合に利用できます。\n【ひっかけ】医療費控除などで確定申告をする場合は、ワンストップ特例は使えません。"}, {"id": "tf:306ef94438", "c": 4, "s": "問題4-5", "st": 2, "q": "住宅借入金等特別控除の適用を受けるためには、住宅ローンの返済期間が10年以上でなければならない。", "a": true, "e": "正しい記述です。\n【根拠】償還期間10年以上の借入金等であることが要件です。\n【ひっかけ】繰上げ返済で当初からの返済期間が10年未満になると、以後は適用を受けられません。"}, {"id": "tf:f248d8c0a8", "c": 4, "s": "問題4-5", "st": 2, "q": "住宅借入金等特別控除は、控除を受ける年の合計所得金額が3,000万円以下であれば適用を受けることができる。", "a": false, "e": "誤りです。\n【根拠】合計所得金額は2,000万円以下であることが要件です。\n【ひっかけ】床面積40㎡以上50㎡未満の新築等の場合は、合計所得金額1,000万円以下の年に限られます。"}, {"id": "tf:f5ba9b7151", "c": 4, "s": "問題4-5", "st": 1, "q": "給与所得者が住宅借入金等特別控除の適用を受ける場合、最初の年分は確定申告が必要であるが、2年目以降は年末調整で適用を受けることができる。", "a": true, "e": "正しい記述です。\n【根拠】初年度は確定申告が必要で、2年目以降は年末調整で適用されます。\n【ひっかけ】初年度から年末調整でよいとする出題に注意します。"}, {"id": "tf:c9c064a554", "c": 4, "s": "問題4-5", "st": 2, "q": "給与所得者で、給与・退職所得以外の所得金額の合計額が20万円を超える者は、確定申告が必要である。", "a": true, "e": "正しい記述です。\n【根拠】給与を1か所から受けていて年末調整を受けた人でも、給与・退職所得以外の所得が20万円を超えると確定申告が必要です。\n【ひっかけ】給与の収入金額が2,000万円を超える人も確定申告が必要です。"}, {"id": "tf:08553d97e0", "c": 4, "s": "問題4-5", "st": 2, "q": "年の途中で死亡した者の所得税の準確定申告は、相続人が相続の開始があったことを知った日の翌日から10か月以内に行う。", "a": false, "e": "誤りです。\n【根拠】準確定申告の期限は、相続の開始があったことを知った日の翌日から4か月以内です。\n【ひっかけ】10か月以内は相続税の申告期限です。"}, {"id": "tf:6c99c83ae2", "c": 4, "s": "問題4-5", "st": 1, "q": "その年の1月16日以後に新たに事業を開始した者が、その年分から青色申告の承認を受けようとする場合には、事業開始の日から2か月以内に承認申請書を提出する必要がある。", "a": true, "e": "正しい記述です。\n【根拠】原則はその年の3月15日まで、1月16日以後の開業は開業日から2か月以内です。\n【ひっかけ】期限を「3か月以内」とする出題に注意します。"}, {"id": "tf:6b567a48da", "c": 4, "s": "問題4-5", "st": 1, "q": "給与所得者は、青色申告の承認を受けることができる。", "a": false, "e": "誤りです。\n【根拠】青色申告ができるのは、不動産所得・事業所得・山林所得のある者です。\n【ひっかけ】給与所得だけの者は青色申告の対象外です。"}, {"id": "tf:832b263b5c", "c": 4, "s": "問題4-5", "st": 2, "q": "所得税の更正の請求は、原則として法定申告期限から5年以内に行うことができる。", "a": true, "e": "正しい記述です。\n【根拠】税額を多く申告していた場合などに、5年以内に更正の請求ができます。\n【ひっかけ】税額が少なかった場合は修正申告をします。"}, {"id": "tf:36cf6b15f5", "c": 4, "s": "問題4-5", "st": 1, "q": "青色申告者は、純損失の金額を前年分の所得に繰り戻して、所得税の還付を請求することができる。", "a": true, "e": "正しい記述です。\n【根拠】前年も青色申告をしていることなどを要件に、純損失の繰戻し還付を受けられます。\n【ひっかけ】白色申告者は、原則として純損失の繰越控除・繰戻し還付を受けられません（変動所得・被災事業用資産の損失を除く）。"}, {"id": "tf:d062e8d25e", "c": 4, "s": "問題4-5", "st": 2, "q": "住民税は、その年の12月31日現在の住所地の市町村において、その年の所得に対して課税される。", "a": false, "e": "誤りです。\n【根拠】住民税は、1月1日現在の住所地で、前年の所得に対して課税されます。\n【ひっかけ】年の途中で転居しても、その年度の住民税は1月1日の住所地に納めます。"}, {"id": "tf:c23b0a3bed", "c": 4, "s": "問題4-5", "st": 1, "q": "個人事業税の計算上、事業主控除として年290万円を控除することができる。", "a": true, "e": "正しい記述です。\n【根拠】個人事業税には、年290万円の事業主控除があります（営業期間が1年未満の場合は月割り）。\n【ひっかけ】個人事業税は都道府県税です。"}, {"id": "tf:ca00eb1650", "c": 4, "s": "問題4-5", "st": 1, "q": "青色申告者は、帳簿書類を原則として5年間保存しなければならない。", "a": false, "e": "誤りです。\n【根拠】帳簿書類の保存期間は原則7年間です（一部の書類は5年間）。\n【ひっかけ】数字の入れ替えに注意します。"}, {"id": "tf:7ad26a81e8", "c": 4, "s": "問題4-6", "st": 2, "q": "期末資本金の額が1億円以下の法人（一定の法人を除く）は、交際費等の額のうち、年800万円までの定額控除限度額と接待飲食費の50％相当額のいずれかを選択して損金に算入できる。", "a": true, "e": "正しい記述です。\n【根拠】中小法人は、どちらか有利なほうを選択できます。\n【ひっかけ】大法人（資本金100億円超の法人を除く）は、接待飲食費の50％のみです。"}, {"id": "tf:13956d232b", "c": 4, "s": "問題4-6", "st": 2, "q": "法人が支出した飲食費のうち、1人あたり5,000円以下のものは、交際費等の範囲から除かれる。", "a": false, "e": "誤りです。\n【根拠】2024年4月1日以後に支出する飲食費は、1人あたり1万円以下であれば交際費等から除かれます（社内飲食費を除く）。\n【ひっかけ】改正前の基準（5,000円）を使う出題に注意します。"}, {"id": "tf:4ebb2179e9", "c": 4, "s": "問題4-6", "st": 1, "q": "法人税の確定申告書は、原則として各事業年度終了の日の翌日から2か月以内に提出しなければならない。", "a": true, "e": "正しい記述です。\n【根拠】申告期限の延長の特例を受けている場合は、さらに延長されます。\n【ひっかけ】個人の確定申告（3月15日まで）と混同しないようにします。"}, {"id": "tf:724869c57e", "c": 4, "s": "問題4-6", "st": 2, "q": "基準期間における課税売上高が1,000万円以下の事業者は、特定期間における課税売上高にかかわらず、免税事業者となる。", "a": false, "e": "誤りです。\n【根拠】特定期間の課税売上高が1,000万円を超えると、課税事業者となります（給与等支払額で判定することもできます）。\n【ひっかけ】インボイス発行事業者として登録した場合も、課税事業者となります。"}, {"id": "tf:95ffc386c1", "c": 4, "s": "問題4-6", "st": 1, "q": "簡易課税制度は、基準期間における課税売上高が5,000万円以下の事業者が選択することができる。", "a": true, "e": "正しい記述です。\n【根拠】簡易課税制度選択届出書は、原則として適用を受けようとする課税期間の初日の前日までに提出します。\n【ひっかけ】1億円以下などと数字を変える出題に注意します。"}, {"id": "tf:a44b4231df", "c": 4, "s": "問題4-6", "st": 2, "q": "中小法人等の青色申告事業年度に生じた欠損金は、翌期以後10年間繰り越して、所得の全額を限度に控除することができる。", "a": true, "e": "正しい記述です。\n【根拠】中小法人等は所得の全額まで、それ以外の法人は所得の50％までです。\n【ひっかけ】個人の純損失の繰越控除（3年）と区別します。"}, {"id": "tf:62772351e1", "c": 4, "s": "問題4-6", "st": 1, "q": "消費税の簡易課税制度を選択した事業者は、原則として2年間は継続して適用しなければならない。", "a": true, "e": "正しい記述です。\n【根拠】簡易課税制度選択不適用届出書は、2年間継続適用した後でなければ提出できません。\n【ひっかけ】課税事業者選択届出も、原則2年間継続適用が必要です。"}, {"id": "tf:f7a65f253d", "c": 4, "s": "問題4-6", "st": 1, "q": "免税事業者が適格請求書発行事業者の登録を受けた場合でも、免税事業者のままでいることができる。", "a": false, "e": "誤りです。\n【根拠】適格請求書発行事業者として登録すると、課税事業者として消費税の申告・納付が必要です。\n【ひっかけ】登録をやめれば、要件を満たす限り免税事業者に戻れます。"}, {"id": "tf:8bf2e1ae24", "c": 4, "s": "問題4-6", "st": 2, "q": "役員に対して毎月同額を支給する定期同額給与は、法人税の計算上、損金に算入することができる。", "a": true, "e": "正しい記述です。\n【根拠】定期同額給与・事前確定届出給与・業績連動給与は、要件を満たせば損金に算入できます（不相当に高額な部分を除く）。\n【ひっかけ】役員賞与は、事前確定届出給与として届け出ていなければ原則として損金不算入です。"}, {"id": "tf:0931465ae1", "c": 4, "s": "問題4-6", "st": 2, "q": "役員に支給する賞与は、事前に税務署長へ届出をしていなくても、損金に算入することができる。", "a": false, "e": "誤りです。\n【根拠】役員賞与を損金に算入するには、原則として事前確定届出給与として所定の期限までに届け出る必要があります。\n【ひっかけ】従業員への賞与は、届出なしで損金に算入できます。役員と従業員の違いが頻出です。"}, {"id": "tf:82b9066ea5", "c": 5, "s": "問題5-1", "st": 2, "q": "不動産登記記録の権利部甲区には、抵当権に関する事項が記録される。", "a": false, "e": "誤りです。\n【根拠】抵当権など所有権以外の権利は、権利部乙区に記録されます。甲区は所有権に関する事項です。\n【ひっかけ】差押えは所有権に関する事項として甲区に記録されます。"}, {"id": "tf:2577ab81b0", "c": 5, "s": "問題5-1", "st": 2, "q": "不動産登記には公信力が認められていないため、登記記録を信頼して取引しても、真の権利者に対抗できないことがある。", "a": true, "e": "正しい記述です。\n【根拠】日本の不動産登記には公信力がありません。\n【ひっかけ】対抗力（第三者に権利を主張できる力）はあります。公信力と対抗力を混同しないようにします。"}, {"id": "tf:9f2a4416ea", "c": 5, "s": "問題5-1", "st": 1, "q": "仮登記には対抗力はないが、後に本登記をした場合、本登記の順位は仮登記の順位による。", "a": true, "e": "正しい記述です。\n【根拠】仮登記には順位保全の効力があります。\n【ひっかけ】「仮登記にも対抗力がある」とする出題に注意します。"}, {"id": "tf:903c04b0a9", "c": 5, "s": "問題5-1", "st": 1, "q": "登記事項証明書は、その不動産の利害関係人でなければ交付を請求することができない。", "a": false, "e": "誤りです。\n【根拠】手数料を納付すれば、誰でも交付を請求できます。\n【ひっかけ】オンラインで請求することもできます。"}, {"id": "tf:bcc9519138", "c": 5, "s": "問題5-1", "st": 2, "q": "相続税路線価は、国税庁が毎年1月1日を価格判定日として公表するもので、公示価格の70％程度が目安とされている。", "a": false, "e": "誤りです。\n【根拠】相続税路線価は公示価格の80％程度が目安です。\n【ひっかけ】70％程度が目安なのは固定資産税評価額です。"}, {"id": "tf:6df35102a9", "c": 5, "s": "問題5-1", "st": 2, "q": "基準地標準価格は、都道府県が毎年7月1日を価格判定の基準日として公表する。", "a": true, "e": "正しい記述です。\n【根拠】基準地標準価格（都道府県地価調査）は、7月1日時点の価格を9月ごろに公表します。\n【ひっかけ】公示価格は国土交通省が1月1日時点の価格を3月に公表します。"}, {"id": "tf:5041866bde", "c": 5, "s": "問題5-1", "st": 1, "q": "固定資産税評価額は、原則として3年ごとに評価替えが行われる。", "a": true, "e": "正しい記述です。\n【根拠】固定資産税評価額は、市町村が3年ごとに評価替えをします。\n【ひっかけ】公示価格・路線価は毎年公表されます。"}, {"id": "tf:95ff75b081", "c": 5, "s": "問題5-1", "st": 2, "q": "収益還元法のうちDCF法は、一期間の純収益を還元利回りで還元して収益価格を求める方法である。", "a": false, "e": "誤りです。\n【根拠】記述は直接還元法の説明です。DCF法は、複数期間の純収益と復帰価格をそれぞれ現在価値に割り引いて合計します。\n【ひっかけ】直接還元法とDCF法の入れ替えが頻出です。"}, {"id": "tf:e04fbb66c9", "c": 5, "s": "問題5-1", "st": 2, "q": "区分所有建物の登記記録上の専有部分の床面積は、壁その他の区画の内側線で囲まれた部分（内法面積）で記録される。", "a": true, "e": "正しい記述です。\n【根拠】区分建物の登記は内法面積です。\n【ひっかけ】マンションの広告などに使われる壁芯面積より小さくなります。住宅ローン控除などの床面積要件は登記面積で判定します。"}, {"id": "tf:b96f85ff48", "c": 5, "s": "問題5-1", "st": 1, "q": "法務局に備え付けられている公図は、土地の位置や形状を正確に示すものであり、現況と必ず一致する。", "a": false, "e": "誤りです。\n【根拠】公図は精度が低いものも多く、現況と一致するとは限りません。\n【ひっかけ】土地の形状や面積を確認するには、地積測量図なども参照します。"}, {"id": "tf:111d13c129", "c": 5, "s": "問題5-2", "st": 2, "q": "専任媒介契約の有効期間は3か月を超えることができず、宅建業者は依頼者に対し、業務の処理状況を1週間に1回以上報告しなければならない。", "a": false, "e": "誤りです。\n【根拠】専任媒介契約の報告義務は2週間に1回以上です。1週間に1回以上は専属専任媒介契約です。\n【ひっかけ】有効期間はどちらも3か月以内です。"}, {"id": "tf:56f9b5c7e6", "c": 5, "s": "問題5-2", "st": 2, "q": "宅建業者が自ら売主となる宅地の売買契約において、宅建業者でない買主から、代金の20％を超える手付金を受け取ることはできない。", "a": true, "e": "正しい記述です。\n【根拠】宅建業者が自ら売主の場合、手付は代金の20％が上限で、解約手付とされます。\n【ひっかけ】宅建業者同士の取引には、この制限は適用されません。"}, {"id": "tf:1d2d02466b", "c": 5, "s": "問題5-2", "st": 1, "q": "売買代金が1,000万円の宅地の売買を媒介した宅建業者が、依頼者の一方から受け取れる報酬の上限額は、36万円（税抜）である。", "a": true, "e": "正しい記述です。\n【根拠】1,000万円×3％＋6万円＝36万円（税抜）です。\n【ひっかけ】「＋6万円」を忘れる計算ミスに注意します。"}, {"id": "tf:6029dc5725", "c": 5, "s": "問題5-2", "st": 2, "q": "解約手付が交付された場合、売主は、買主が契約の履行に着手した後であっても、手付の倍額を現実に提供して契約を解除することができる。", "a": false, "e": "誤りです。\n【根拠】解約手付による解除は、相手方が契約の履行に着手するまでに限られます。\n【ひっかけ】自分が履行に着手していても、相手方が着手していなければ解除できます。"}, {"id": "tf:dd2c794478", "c": 5, "s": "問題5-2", "st": 2, "q": "売買の目的物の品質が契約の内容に適合しない場合、買主はその不適合を知った時から1年以内にその旨を売主に通知しなければ、契約不適合責任を追及できない。", "a": true, "e": "正しい記述です。\n【根拠】種類・品質に関する契約不適合は、知った時から1年以内の通知が必要です。\n【ひっかけ】売主が引渡しの時に不適合を知っていた場合などは、この期間制限は適用されません。"}, {"id": "tf:73aa5dd651", "c": 5, "s": "問題5-2", "st": 2, "q": "一般媒介契約を締結した宅建業者には、物件を指定流通機構（レインズ）に登録する義務はない。", "a": true, "e": "正しい記述です。\n【根拠】一般媒介契約にはレインズへの登録義務はありません。\n【ひっかけ】専任媒介は7日以内、専属専任媒介は5日以内（いずれも休業日を除く）に登録する義務があります。"}, {"id": "tf:8249300ca9", "c": 5, "s": "問題5-2", "st": 1, "q": "専属専任媒介契約では、依頼者は、自ら見つけた相手方と直接売買契約を結ぶことができる。", "a": false, "e": "誤りです。\n【根拠】専属専任媒介契約では、自己発見取引はできません。\n【ひっかけ】専任媒介契約では、自己発見取引ができます。"}, {"id": "tf:d276c373bf", "c": 5, "s": "問題5-3", "st": 2, "q": "普通借地権の存続期間は、当事者間で期間の定めをしなかった場合、30年となる。", "a": true, "e": "正しい記述です。\n【根拠】普通借地権の存続期間は30年以上で、定めがなければ30年です。\n【ひっかけ】最初の更新後は20年以上、2回目以降は10年以上です。"}, {"id": "tf:a975951707", "c": 5, "s": "問題5-3", "st": 2, "q": "一般定期借地権の設定契約は、公正証書によってしなければならない。", "a": false, "e": "誤りです。\n【根拠】一般定期借地権は、書面（又は電磁的記録）で契約すれば足り、公正証書である必要はありません。\n【ひっかけ】公正証書が必要なのは事業用定期借地権等です。"}, {"id": "tf:67526531ee", "c": 5, "s": "問題5-3", "st": 2, "q": "事業用定期借地権等は、存続期間を10年以上50年未満として、居住用の賃貸マンションの敷地に設定することができる。", "a": false, "e": "誤りです。\n【根拠】事業用定期借地権等は、もっぱら事業の用に供する建物（居住用を除く）の所有を目的とする場合に限られます。\n【ひっかけ】賃貸マンションは居住用なので設定できません。"}, {"id": "tf:6aa628ded5", "c": 5, "s": "問題5-3", "st": 2, "q": "普通借家契約において、期間を1年未満と定めた場合、期間の定めがない建物賃貸借とみなされる。", "a": true, "e": "正しい記述です。\n【根拠】普通借家契約で1年未満の期間を定めると、期間の定めがないものとみなされます。\n【ひっかけ】定期借家契約では、1年未満の期間も有効に定められます。"}, {"id": "tf:a4c1e2a8d2", "c": 5, "s": "問題5-3", "st": 2, "q": "定期借家契約は、公正証書によって締結しなければ効力を生じない。", "a": false, "e": "誤りです。\n【根拠】定期借家契約は書面（又は電磁的記録）で締結すればよく、公正証書である必要はありません。\n【ひっかけ】契約前に、更新がない旨を記載した書面を交付して説明する必要があります。"}, {"id": "tf:6df72f2edf", "c": 5, "s": "問題5-3", "st": 1, "q": "建物の賃貸借契約において、賃借人の造作買取請求権を排除する特約は有効である。", "a": true, "e": "正しい記述です。\n【根拠】造作買取請求権は、特約で排除できます。\n【ひっかけ】賃借人に不利な特約が無効とされる規定と区別します。"}, {"id": "tf:c755aa78c0", "c": 5, "s": "問題5-3", "st": 2, "q": "区分所有建物の建替え決議は、集会において区分所有者及び議決権の各4分の3以上の多数で行う。", "a": false, "e": "誤りです。\n【根拠】建替え決議は、区分所有者及び議決権の各5分の4以上の多数が必要です。\n【ひっかけ】4分の3以上は規約の設定・変更・廃止などの特別決議です。"}, {"id": "tf:743fa1c607", "c": 5, "s": "問題5-3", "st": 2, "q": "借地上の建物を借地権者の配偶者名義で登記した場合でも、借地権を第三者に対抗することができる。", "a": false, "e": "誤りです。\n【根拠】借地権の対抗要件となるのは、借地権者本人名義で登記された建物です。\n【ひっかけ】家族名義の登記では対抗できないとした判例があります。"}, {"id": "tf:54b90aa773", "c": 5, "s": "問題5-3", "st": 2, "q": "建物の賃借人は、借家権の登記がなくても、建物の引渡しを受けていれば、その後にその建物を取得した者に借家権を対抗することができる。", "a": true, "e": "正しい記述です。\n【根拠】借地借家法により、建物の引渡しが借家権の対抗要件となります。\n【ひっかけ】借地権の対抗要件（本人名義の建物登記）と区別します。"}, {"id": "tf:ab64942b58", "c": 5, "s": "問題5-3", "st": 1, "q": "床面積200㎡未満の居住用建物の定期借家契約では、転勤などやむを得ない事情があれば、賃借人は中途解約を申し入れることができる。", "a": true, "e": "正しい記述です。\n【根拠】解約の申入れから1か月を経過すると契約が終了します。\n【ひっかけ】床面積200㎡以上の建物や事業用建物には、この規定は適用されません。"}, {"id": "tf:af3c3bebe5", "c": 5, "s": "問題5-3", "st": 1, "q": "普通借家契約において、賃貸人からの更新拒絶の通知は、期間満了の1年前から6か月前までにしなければならず、正当の事由が必要である。", "a": true, "e": "正しい記述です。\n【根拠】期間の定めがある普通借家契約では、この期間内の通知と正当の事由が必要です。\n【ひっかけ】期間の定めがない場合、賃貸人からの解約申入れは6か月前、正当の事由も必要です。"}, {"id": "tf:6d04fec151", "c": 5, "s": "問題5-4", "st": 2, "q": "市街化区域内において、1,000㎡以上の開発行為を行う場合は、原則として都道府県知事等の許可が必要である。", "a": true, "e": "正しい記述です。\n【根拠】市街化区域では1,000㎡以上の開発行為に許可が必要です（三大都市圏の一定区域は500㎡以上）。\n【ひっかけ】市街化調整区域では、原則として規模にかかわらず許可が必要です。"}, {"id": "tf:877c198286", "c": 5, "s": "問題5-4", "st": 2, "q": "建築基準法上、建築物の敷地は、原則として幅員4m以上の道路に1m以上接していなければならない。", "a": false, "e": "誤りです。\n【根拠】接道義務は、幅員4m以上の道路に2m以上接することです。\n【ひっかけ】数字を入れ替える出題に注意します。"}, {"id": "tf:26a7a024e4", "c": 5, "s": "問題5-4", "st": 2, "q": "建築基準法第42条第2項の道路に面する敷地のうち、セットバック部分は、建ぺい率・容積率の計算上、敷地面積に算入しない。", "a": true, "e": "正しい記述です。\n【根拠】セットバック部分は道路とみなされるため、敷地面積に算入しません。\n【ひっかけ】原則として道路の中心線から2m後退した線が道路の境界線とみなされます。"}, {"id": "tf:9f44dfe8ca", "c": 5, "s": "問題5-4", "st": 2, "q": "前面道路の幅員が12m未満の場合の容積率は、指定容積率と、前面道路の幅員に法定乗数を乗じた数値のうち、いずれか高いほうとなる。", "a": false, "e": "誤りです。\n【根拠】いずれか低いほうが適用されます。\n【ひっかけ】住居系の用途地域の法定乗数は原則10分の4、その他は原則10分の6です。"}, {"id": "tf:19b0dca21c", "c": 5, "s": "問題5-4", "st": 2, "q": "建築物の敷地が2つの用途地域にまたがる場合、その敷地の全部について、敷地の過半が属する用途地域の用途制限が適用される。", "a": true, "e": "正しい記述です。\n【根拠】用途制限は、敷地の過半が属する地域の制限によります。\n【ひっかけ】建ぺい率・容積率は加重平均で計算します。用途制限と取り扱いが違う点が頻出です。"}, {"id": "tf:786cb690f0", "c": 5, "s": "問題5-4", "st": 2, "q": "市街化区域内の農地を転用する目的で売買する場合、あらかじめ農業委員会に届け出れば、都道府県知事等の許可は不要である。", "a": true, "e": "正しい記述です。\n【根拠】市街化区域内の農地の4条・5条転用は、農業委員会への届出で足ります。\n【ひっかけ】3条（農地のままの権利移動）には、この特例はありません。"}, {"id": "tf:a549574e2a", "c": 5, "s": "問題5-4", "st": 2, "q": "工業専用地域では、住宅を建築することはできない。", "a": true, "e": "正しい記述です。\n【根拠】工業専用地域では、住宅・共同住宅・老人ホームなどは建築できません。\n【ひっかけ】工業地域では住宅を建てられますが、学校・病院は建てられません。"}, {"id": "tf:3c98cec551", "c": 5, "s": "問題5-4", "st": 2, "q": "建ぺい率の上限が80％とされている地域内で、防火地域内にある耐火建築物等については、建ぺい率の制限が適用されない。", "a": true, "e": "正しい記述です。\n【根拠】指定建ぺい率80％の地域内で、防火地域内の耐火建築物等は建ぺい率の制限がなくなります（100％）。\n【ひっかけ】それ以外の地域では、10％の加算です。"}, {"id": "tf:b32ec37404", "c": 5, "s": "問題5-4", "st": 2, "q": "建築物が防火地域と準防火地域にわたる場合は、原則として、その全部について敷地の過半が属する地域の規制が適用される。", "a": false, "e": "誤りです。\n【根拠】防火規制は、原則として建築物の全部について厳しいほう（防火地域）の規制が適用されます。\n【ひっかけ】過半主義が適用されるのは用途制限です。"}, {"id": "tf:6ce1e77111", "c": 5, "s": "問題5-4", "st": 1, "q": "農地を農地のまま売買する場合、市街化区域内であっても農業委員会の許可が必要である。", "a": true, "e": "正しい記述です。\n【根拠】農地法3条の許可には、市街化区域の特例（届出）はありません。\n【ひっかけ】市街化区域内の特例は、4条・5条（転用）だけです。"}, {"id": "tf:b18c8699ed", "c": 5, "s": "問題5-5", "st": 2, "q": "相続により不動産を取得した場合には、不動産取得税が課される。", "a": false, "e": "誤りです。\n【根拠】相続や法人の合併による取得には、不動産取得税は課されません。\n【ひっかけ】贈与による取得には課されます。相続と贈与の違いが頻出です。"}, {"id": "tf:652fdec86b", "c": 5, "s": "問題5-5", "st": 1, "q": "相続による所有権移転登記の登録免許税の税率は、0.4％である。", "a": true, "e": "正しい記述です。\n【根拠】相続による所有権移転登記は0.4％です。\n【ひっかけ】贈与・売買による所有権移転登記は原則2％です（売買の土地は軽減税率あり）。"}, {"id": "tf:ccb9f76c96", "c": 5, "s": "問題5-5", "st": 1, "q": "不動産の売買契約書に収入印紙を貼り付けなかった場合、その契約は無効となる。", "a": false, "e": "誤りです。\n【根拠】印紙を貼らなくても、契約自体は有効です。ただし過怠税が課されます。\n【ひっかけ】契約の効力と税の問題を区別します。"}, {"id": "tf:7e3fc7f9ad", "c": 5, "s": "問題5-5", "st": 2, "q": "固定資産税は、毎年1月1日現在において固定資産課税台帳に所有者として登録されている者に対して課される。", "a": true, "e": "正しい記述です。\n【根拠】年の途中で売買しても、その年度の納税義務者は1月1日時点の所有者です。\n【ひっかけ】実務では日割りで精算することが多いですが、税法上の納税義務者は変わりません。"}, {"id": "tf:8d77c5fa2e", "c": 5, "s": "問題5-5", "st": 2, "q": "住宅用地のうち、住宅1戸あたり200㎡以下の部分については、固定資産税の課税標準が3分の1となる。", "a": false, "e": "誤りです。\n【根拠】小規模住宅用地（200㎡以下の部分）の固定資産税の課税標準は6分の1です。\n【ひっかけ】3分の1は、200㎡以下の部分の都市計画税、又は200㎡超の部分の固定資産税です。"}, {"id": "tf:de30d18065", "c": 5, "s": "問題5-5", "st": 1, "q": "都市計画税の制限税率は0.3％である。", "a": true, "e": "正しい記述です。\n【根拠】都市計画税は、原則として市街化区域内の土地・家屋に課税され、制限税率は0.3％です。\n【ひっかけ】固定資産税の標準税率1.4％と区別します。"}, {"id": "tf:5a466db4af", "c": 5, "s": "問題5-5", "st": 2, "q": "新築住宅を取得した場合、一定の要件を満たせば、不動産取得税の課税標準から1,200万円を控除することができる。", "a": true, "e": "正しい記述です。\n【根拠】床面積50㎡以上240㎡以下などの要件を満たす新築住宅は、1,200万円が控除されます。\n【ひっかけ】控除額は1戸あたりで、土地には別の軽減措置があります。"}, {"id": "tf:88e8fab3bb", "c": 5, "s": "問題5-5", "st": 1, "q": "固定資産税の納税義務者が、年の途中で不動産を売却した場合、その年度の固定資産税は売主と買主に法律上按分して課される。", "a": false, "e": "誤りです。\n【根拠】その年度の固定資産税は、1月1日現在の所有者（売主）に全額課税されます。\n【ひっかけ】売買契約で日割り精算するのは当事者間の取決めです。"}, {"id": "tf:8647e7e26a", "c": 5, "s": "問題5-6", "st": 2, "q": "居住用財産を譲渡した場合の3,000万円特別控除は、譲渡した年の1月1日における所有期間が5年を超えていなければ適用を受けることができない。", "a": false, "e": "誤りです。\n【根拠】3,000万円特別控除には、所有期間の要件はありません。\n【ひっかけ】所有期間10年超が要件なのは、軽減税率の特例や買換え特例です。"}, {"id": "tf:2410996f40", "c": 5, "s": "問題5-6", "st": 1, "q": "居住用財産を配偶者に譲渡した場合には、居住用財産の3,000万円特別控除の適用を受けることができない。", "a": true, "e": "正しい記述です。\n【根拠】配偶者・直系血族・生計を一にする親族などへの譲渡は対象外です。\n【ひっかけ】兄弟姉妹でも、生計を一にしている場合は対象外です。"}, {"id": "tf:c01b5c7ddf", "c": 5, "s": "問題5-6", "st": 2, "q": "居住用財産の3,000万円特別控除と軽減税率の特例は、重ねて適用を受けることができる。", "a": true, "e": "正しい記述です。\n【根拠】3,000万円を控除した後の課税長期譲渡所得金額に、軽減税率を適用できます。\n【ひっかけ】3,000万円特別控除と買換え特例は選択適用で、併用できません。"}, {"id": "tf:59366950db", "c": 5, "s": "問題5-6", "st": 1, "q": "軽減税率の特例の適用を受ける場合、課税長期譲渡所得金額のうち6,000万円以下の部分の税率は、所得税・復興特別所得税・住民税を合わせて14.21％である。", "a": true, "e": "正しい記述です。\n【根拠】所得税・復興特別所得税10.21％、住民税4％、合計14.21％です。\n【ひっかけ】6,000万円を超える部分は通常の長期譲渡所得の税率（20.315％）です。"}, {"id": "tf:b7b368cc16", "c": 5, "s": "問題5-6", "st": 2, "q": "NOI利回りは、年間収入合計から諸経費を控除した純収益を、投資総額で除して求める。", "a": true, "e": "正しい記述です。\n【根拠】NOI利回り（純利回り）＝（年間収入合計－諸経費）÷投資総額×100です。\n【ひっかけ】表面利回りは、諸経費を差し引かずに計算します。"}, {"id": "tf:f1e563ce61", "c": 5, "s": "問題5-6", "st": 1, "q": "上場不動産投資信託（J-REIT）の分配金は、配当控除の適用を受けることができる。", "a": false, "e": "誤りです。\n【根拠】J-REITの分配金は配当所得ですが、配当控除の対象外です。\n【ひっかけ】J-REITは法人税が実質かからない仕組みのため、二重課税の調整（配当控除）がありません。"}, {"id": "tf:2700220caa", "c": 5, "s": "問題5-6", "st": 1, "q": "被相続人の居住用財産（空き家）に係る譲渡所得の特別控除の対象となる家屋は、1981年5月31日以前に建築されたものである。", "a": true, "e": "正しい記述です。\n【根拠】旧耐震基準の時期に建築された家屋（区分所有建物を除く）が対象です。\n【ひっかけ】相続人が3人以上の場合、1人あたりの控除額は2,000万円です。"}, {"id": "tf:641b5e0894", "c": 5, "s": "問題5-6", "st": 1, "q": "公共事業のために土地を収用された場合、譲渡益から最高3,000万円の特別控除を受けることができる。", "a": false, "e": "誤りです。\n【根拠】収用等の場合の特別控除は、最高5,000万円です。\n【ひっかけ】3,000万円は居住用財産の特別控除です。"}, {"id": "tf:e5b52fc0b8", "c": 5, "s": "問題5-6", "st": 2, "q": "等価交換方式による土地活用では、土地所有者が建設資金を負担する必要がない。", "a": true, "e": "正しい記述です。\n【根拠】土地を出資し、デベロッパーが建設資金を負担します。完成後、出資割合に応じて土地と建物の一部を取得します。\n【ひっかけ】事業受託方式は、土地所有者が資金を調達します。"}, {"id": "tf:db9297359c", "c": 5, "s": "問題5-6", "st": 1, "q": "建設協力金方式では、建物の所有者はテナントとなる。", "a": false, "e": "誤りです。\n【根拠】建設協力金方式では、テナントから預かった資金で土地所有者が建物を建て、建物の所有者は土地所有者です。\n【ひっかけ】土地所有者が建物を所有するため、相続税の評価で貸家建付地となります。"}, {"id": "tf:151d7d50a9", "c": 6, "s": "問題6-1", "st": 2, "q": "書面によらない贈与は、履行の終わった部分を除き、各当事者が解除することができる。", "a": true, "e": "正しい記述です。\n【根拠】書面によらない贈与は、履行が終わっていない部分に限り解除できます。\n【ひっかけ】書面による贈与は、原則として解除できません。"}, {"id": "tf:dcb7330aa9", "c": 6, "s": "問題6-1", "st": 2, "q": "死因贈与によって取得した財産は、贈与税の課税対象となる。", "a": false, "e": "誤りです。\n【根拠】死因贈与は贈与者の死亡で効力が生じるため、相続税の課税対象です。\n【ひっかけ】民法上は贈与ですが、課税は遺贈と同じく相続税です。"}, {"id": "tf:83f9223f40", "c": 6, "s": "問題6-1", "st": 2, "q": "贈与税の申告期間は、贈与を受けた年の翌年2月16日から3月15日までである。", "a": false, "e": "誤りです。\n【根拠】贈与税の申告期間は翌年2月1日から3月15日までです。\n【ひっかけ】所得税の確定申告（2月16日から）と混同させる出題です。"}, {"id": "tf:32d3031956", "c": 6, "s": "問題6-1", "st": 2, "q": "贈与税の配偶者控除の適用を受けるためには、贈与時点の婚姻期間が20年以上でなければならない。", "a": true, "e": "正しい記述です。\n【根拠】婚姻期間20年以上の配偶者から居住用不動産等の贈与を受けた場合に、最高2,000万円を控除できます。\n【ひっかけ】同じ配偶者からは一生に1回だけです。"}, {"id": "tf:c8e3ca1500", "c": 6, "s": "問題6-1", "st": 2, "q": "相続時精算課税の適用を受けた贈与財産は、贈与者の相続時に、相続時の価額で相続財産に加算される。", "a": false, "e": "誤りです。\n【根拠】加算されるのは贈与時の価額です（基礎控除110万円を差し引いた後）。\n【ひっかけ】値上がりが見込まれる財産を贈与すると有利になりうるのは、贈与時の価額で固定されるためです。"}, {"id": "tf:542ec794ec", "c": 6, "s": "問題6-1", "st": 2, "q": "相続時精算課税制度では、特別控除額2,500万円とは別に、毎年110万円の基礎控除がある。", "a": true, "e": "正しい記述です。\n【根拠】2024年1月1日以後の贈与から、年110万円の基礎控除が設けられました。基礎控除以下なら申告も不要です。\n【ひっかけ】暦年課税の基礎控除110万円とは別枠です。"}, {"id": "tf:22e4fbafda", "c": 6, "s": "問題6-1", "st": 1, "q": "相続時精算課税を選択した後でも、翌年以降の贈与については暦年課税に戻ることができる。", "a": false, "e": "誤りです。\n【根拠】一度選択すると、その贈与者からの贈与について暦年課税に戻ることはできません。\n【ひっかけ】他の贈与者（例えば母）からの贈与は、暦年課税のままにできます。"}, {"id": "tf:a536c81b81", "c": 6, "s": "問題6-1", "st": 1, "q": "相続時精算課税の贈与者は、贈与をした年の1月1日において60歳以上の父母又は祖父母である。", "a": true, "e": "正しい記述です。\n【根拠】受贈者は、その年の1月1日において18歳以上の子・孫（推定相続人である直系卑属又は孫）です。\n【ひっかけ】受贈者の年齢を20歳以上とする出題に注意します。"}, {"id": "tf:0f7dad43d4", "c": 6, "s": "問題6-1", "st": 1, "q": "贈与税の配偶者控除の適用を受けて納付すべき贈与税額がゼロとなる場合は、贈与税の申告書を提出する必要はない。", "a": false, "e": "誤りです。\n【根拠】贈与税の配偶者控除は、税額がゼロでも申告書の提出が必要です。\n【ひっかけ】相続時精算課税も、基礎控除（110万円）を超える贈与があれば申告が必要です。"}, {"id": "tf:9d3910e890", "c": 6, "s": "問題6-1", "st": 2, "q": "直系尊属から贈与を受けた、その年の1月1日において18歳以上の者は、暦年課税の贈与税の計算において特例税率を適用する。", "a": true, "e": "正しい記述です。\n【根拠】直系尊属（父母・祖父母など）からの贈与で受贈者が18歳以上なら、一般税率より低い特例税率です。\n【ひっかけ】兄弟姉妹や夫婦間の贈与は一般税率です。"}, {"id": "tf:1d85ffbb42", "c": 6, "s": "問題6-2", "st": 2, "q": "被相続人の配偶者と兄が相続人である場合、配偶者の法定相続分は3分の2である。", "a": false, "e": "誤りです。\n【根拠】配偶者と兄弟姉妹が相続人の場合、配偶者は4分の3、兄弟姉妹は4分の1です。\n【ひっかけ】3分の2は、配偶者と直系尊属が相続人の場合です。"}, {"id": "tf:7c4e05b600", "c": 6, "s": "問題6-2", "st": 2, "q": "相続を放棄した者の子は、放棄した者を代襲して相続人となる。", "a": false, "e": "誤りです。\n【根拠】相続放棄は代襲原因に当たらないため、放棄した者の子は代襲相続しません。\n【ひっかけ】代襲原因は、死亡・欠格・廃除の3つです。"}, {"id": "tf:8a17866229", "c": 6, "s": "問題6-2", "st": 2, "q": "兄弟姉妹が相続人となる場合の代襲相続は、兄弟姉妹の子（おい・めい）までに限られる。", "a": true, "e": "正しい記述です。\n【根拠】兄弟姉妹の代襲は1代限りで、おい・めいの子は代襲しません。\n【ひっかけ】子の代襲は、孫、ひ孫と続きます（再代襲）。"}, {"id": "tf:da2067c49d", "c": 6, "s": "問題6-2", "st": 2, "q": "相続の放棄をするためには、相続人全員が共同して家庭裁判所に申述しなければならない。", "a": false, "e": "誤りです。\n【根拠】相続の放棄は、各相続人が単独でできます。\n【ひっかけ】全員が共同して行う必要があるのは限定承認です。"}, {"id": "tf:b0516798f2", "c": 6, "s": "問題6-2", "st": 2, "q": "法務局で保管されている自筆証書遺言は、家庭裁判所の検認が不要である。", "a": true, "e": "正しい記述です。\n【根拠】自筆証書遺言書保管制度を利用した遺言書は、検認が不要です。\n【ひっかけ】公正証書遺言も検認不要です。法務局に保管していない自筆証書遺言は検認が必要です。"}, {"id": "tf:a8a47ef8b6", "c": 6, "s": "問題6-2", "st": 1, "q": "自筆証書遺言に添付する財産目録は、パソコンで作成することはできず、全文を自書しなければならない。", "a": false, "e": "誤りです。\n【根拠】財産目録は、パソコンでの作成や通帳のコピーの添付もできます。各ページに署名・押印が必要です。\n【ひっかけ】本文・日付・氏名は自書が必要です。"}, {"id": "tf:be2b331054", "c": 6, "s": "問題6-2", "st": 2, "q": "被相続人の兄弟姉妹には、遺留分が認められていない。", "a": true, "e": "正しい記述です。\n【根拠】遺留分権利者は、兄弟姉妹以外の相続人（配偶者・子・直系尊属）です。\n【ひっかけ】兄弟姉妹に財産を渡したくない場合は、遺言が特に有効です。"}, {"id": "tf:1edaa1faa1", "c": 6, "s": "問題6-2", "st": 2, "q": "相続人が被相続人の父母のみである場合、遺留分全体の割合は2分の1である。", "a": false, "e": "誤りです。\n【根拠】直系尊属のみが相続人の場合、遺留分全体の割合は3分の1です。\n【ひっかけ】それ以外の場合は2分の1です。"}, {"id": "tf:60fc82ac8a", "c": 6, "s": "問題6-2", "st": 1, "q": "相続開始時に胎児であった者は、相続については既に生まれたものとみなされる。", "a": true, "e": "正しい記述です。\n【根拠】胎児にも相続権があります（死産の場合を除く）。\n【ひっかけ】相続税の申告でも、胎児が生まれたものとして計算する場合があります。"}, {"id": "tf:476bc31f5f", "c": 6, "s": "問題6-2", "st": 2, "q": "普通養子縁組をした養子は、実父母との親族関係が終了するため、実父母の相続人とはならない。", "a": false, "e": "誤りです。\n【根拠】普通養子は実父母との関係が続き、実父母と養父母の両方の相続人となります。\n【ひっかけ】実父母との関係が終了するのは特別養子です。"}, {"id": "tf:c056a0923b", "c": 6, "s": "問題6-2", "st": 1, "q": "遺言は、遺言の方式に従えば、いつでもその全部又は一部を撤回することができる。", "a": true, "e": "正しい記述です。\n【根拠】遺言者は、いつでも遺言を撤回できます。前の遺言と抵触する遺言を作ると、その部分は撤回したものとみなされます。\n【ひっかけ】公正証書遺言を、自筆証書遺言で撤回することもできます。"}, {"id": "tf:399f43592f", "c": 6, "s": "問題6-2", "st": 1, "q": "秘密証書遺言は、証人2人以上の立会いが必要であり、家庭裁判所の検認も必要である。", "a": true, "e": "正しい記述です。\n【根拠】秘密証書遺言は、公証人と証人2人以上の前に提出して作成し、検認が必要です。\n【ひっかけ】公正証書遺言は検認が不要です。"}, {"id": "tf:bcadd8038a", "c": 6, "s": "問題6-3", "st": 2, "q": "相続人が受け取った死亡保険金のうち、500万円に法定相続人の数を乗じた金額までは、相続税が非課税となる。", "a": true, "e": "正しい記述です。\n【根拠】死亡保険金・死亡退職金それぞれについて、500万円×法定相続人の数が非課税です。\n【ひっかけ】相続を放棄した者が受け取った保険金には、非課税金額の適用はありません。"}, {"id": "tf:6504e69c79", "c": 6, "s": "問題6-3", "st": 2, "q": "相続税の計算上、相続を放棄した者は法定相続人の数に含めない。", "a": false, "e": "誤りです。\n【根拠】遺産に係る基礎控除額などの計算では、相続を放棄した者も法定相続人の数に含めます。\n【ひっかけ】放棄がなかったものとして数えます。"}, {"id": "tf:8fe737fbb8", "c": 6, "s": "問題6-3", "st": 2, "q": "被相続人に実子がいる場合、相続税の計算上、法定相続人の数に算入できる養子の数は1人までである。", "a": true, "e": "正しい記述です。\n【根拠】実子がいる場合は1人、実子がいない場合は2人までです。\n【ひっかけ】特別養子や配偶者の連れ子養子は、実子とみなされます。"}, {"id": "tf:ca820d2b70", "c": 6, "s": "問題6-3", "st": 2, "q": "法定相続人が配偶者と子2人の場合、遺産に係る基礎控除額は4,800万円である。", "a": true, "e": "正しい記述です。\n【根拠】3,000万円＋600万円×3人＝4,800万円です。\n【ひっかけ】「1,000万円×人数」としていたのは2014年以前の制度です。"}, {"id": "tf:a1f0b86f3d", "c": 6, "s": "問題6-3", "st": 2, "q": "葬式の際に受け取った香典の返礼費用（香典返し）は、債務控除の対象となる葬式費用に含まれる。", "a": false, "e": "誤りです。\n【根拠】香典返しの費用や法要（初七日・四十九日など）の費用は、葬式費用として控除できません。\n【ひっかけ】通夜・本葬の費用や火葬費用などは控除できます。"}, {"id": "tf:161bf1e06b", "c": 6, "s": "問題6-3", "st": 2, "q": "被相続人の孫（代襲相続人ではない）が遺贈により財産を取得した場合、その者の相続税額は2割加算の対象となる。", "a": true, "e": "正しい記述です。\n【根拠】配偶者と1親等の血族（代襲相続人の孫を含む）以外の者は、2割加算の対象です。\n【ひっかけ】代襲相続人となった孫は2割加算の対象外です。"}, {"id": "tf:e8edf354e9", "c": 6, "s": "問題6-3", "st": 2, "q": "配偶者に対する相続税額の軽減の適用を受けると、配偶者が取得した財産が1億円又は配偶者の法定相続分相当額のいずれか多い金額までは相続税がかからない。", "a": false, "e": "誤りです。\n【根拠】金額は1億6,000万円又は配偶者の法定相続分相当額のいずれか多い金額です。\n【ひっかけ】適用を受けるには、税額がゼロになる場合でも申告が必要です。"}, {"id": "tf:e610093c27", "c": 6, "s": "問題6-3", "st": 1, "q": "暦年課税による贈与財産の相続財産への加算期間は、相続開始前7年以内である。", "a": true, "e": "正しい記述です。\n【根拠】2024年1月1日以後の贈与から、加算期間が3年から7年に段階的に延長されています。\n【ひっかけ】延長された4年間に受けた贈与は、合計100万円まで加算されません。"}, {"id": "tf:9eaf6fef61", "c": 6, "s": "問題6-3", "st": 2, "q": "配偶者に対する相続税額の軽減の適用により納付すべき相続税額がゼロとなる場合でも、相続税の申告書を提出する必要がある。", "a": true, "e": "正しい記述です。\n【根拠】配偶者の税額軽減や小規模宅地等の特例は、申告することが適用の要件です。\n【ひっかけ】「税額がゼロなら申告不要」とする出題に注意します。"}, {"id": "tf:949a6c89c1", "c": 6, "s": "問題6-4", "st": 2, "q": "貸家建付地の評価額は、自用地評価額×（1－借地権割合×借家権割合×賃貸割合）で求める。", "a": true, "e": "正しい記述です。\n【根拠】賃貸アパートなどの敷地は、この算式で評価を下げることができます。\n【ひっかけ】貸宅地（底地）は、自用地評価額×（1－借地権割合）です。"}, {"id": "tf:0f2aca44ca", "c": 6, "s": "問題6-4", "st": 2, "q": "小規模宅地等の特例において、特定居住用宅地等は400㎡を限度に80％減額される。", "a": false, "e": "誤りです。\n【根拠】特定居住用宅地等は330㎡を限度に80％減額です。\n【ひっかけ】400㎡・80％は特定事業用宅地等です。"}, {"id": "tf:2e8a6963ca", "c": 6, "s": "問題6-4", "st": 2, "q": "小規模宅地等の特例において、貸付事業用宅地等は200㎡を限度に50％減額される。", "a": true, "e": "正しい記述です。\n【根拠】貸付事業用宅地等は200㎡まで50％減額です。\n【ひっかけ】他の区分と併用する場合は、面積の調整計算が必要です。"}, {"id": "tf:32e5da291f", "c": 6, "s": "問題6-4", "st": 2, "q": "上場株式は、課税時期の最終価格と、課税時期の属する月以前3か月間の各月の毎日の最終価格の月平均額のうち、最も高い価額で評価する。", "a": false, "e": "誤りです。\n【根拠】4つの価額のうち、最も低い価額で評価します。\n【ひっかけ】「最も高い」とする出題に注意します。"}, {"id": "tf:2004d57ce7", "c": 6, "s": "問題6-4", "st": 1, "q": "同族株主以外の株主等が取得した取引相場のない株式は、原則として配当還元方式で評価する。", "a": true, "e": "正しい記述です。\n【根拠】少数株主の株式は、配当還元方式で評価します。\n【ひっかけ】同族株主等が取得した場合は、原則的評価方式です。"}, {"id": "tf:f1fd9489e9", "c": 6, "s": "問題6-4", "st": 1, "q": "相続開始時において保険事故が発生していない生命保険契約に関する権利は、既に払い込んだ保険料の総額で評価する。", "a": false, "e": "誤りです。\n【根拠】生命保険契約に関する権利は、解約返戻金相当額で評価します。\n【ひっかけ】払込保険料の総額ではありません。"}, {"id": "tf:13b0b6e42d", "c": 6, "s": "問題6-4", "st": 2, "q": "親の所有する土地を子が無償で借りて建物を建てた場合（使用貸借）、その土地は相続税の計算上、自用地として評価する。", "a": true, "e": "正しい記述です。\n【根拠】使用貸借による借地権の価額はゼロとされ、土地は自用地評価です。\n【ひっかけ】地代を払う普通の借地なら、貸宅地として評価します。"}, {"id": "tf:43fcd05d92", "c": 6, "s": "問題6-4", "st": 1, "q": "不特定多数の者の通行の用に供されている私道は、自用地評価額の30％で評価する。", "a": false, "e": "誤りです。\n【根拠】不特定多数の者の通行の用に供されている私道は評価しません（ゼロ）。\n【ひっかけ】それ以外の私道（特定の者の通行用）が30％評価です。"}, {"id": "tf:4743760ba9", "c": 6, "s": "問題6-4", "st": 1, "q": "建築中の家屋の相続税評価額は、その家屋の費用現価の70％に相当する金額である。", "a": true, "e": "正しい記述です。\n【根拠】建築中の家屋は、課税時期までにかかった建築費用（費用現価）の70％で評価します。\n【ひっかけ】完成している家屋は、固定資産税評価額×1.0です。"}, {"id": "tf:960a1744d5", "c": 6, "s": "問題6-4", "st": 1, "q": "取引相場のあるゴルフ会員権は、課税時期の通常の取引価格の70％相当額で評価する。", "a": true, "e": "正しい記述です。\n【根拠】取引価格に含まれない預託金等がある場合は、別に加算します。\n【ひっかけ】上場株式のように、月平均などを比べる評価方法ではありません。"}, {"id": "tf:0022ee34e0", "c": 6, "s": "問題6-4", "st": 2, "q": "被相続人の配偶者が特定居住用宅地等を取得した場合、相続税の申告期限まで保有・居住していなければ、小規模宅地等の特例の適用を受けることはできない。", "a": false, "e": "誤りです。\n【根拠】配偶者が取得した場合は、保有・居住の要件はありません。\n【ひっかけ】同居親族が取得した場合は、申告期限までの保有・居住が必要です。"}, {"id": "tf:898098ab0f", "c": 6, "s": "問題6-5", "st": 2, "q": "相続税の申告書は、相続の開始があったことを知った日の翌日から10か月以内に提出しなければならない。", "a": true, "e": "正しい記述です。\n【根拠】申告期限は10か月以内で、納付期限も同じです。\n【ひっかけ】準確定申告（4か月以内）と区別します。"}, {"id": "tf:24e0fa05b9", "c": 6, "s": "問題6-5", "st": 1, "q": "相続税の物納において、上場株式は第1順位の物納財産である。", "a": true, "e": "正しい記述です。\n【根拠】第1順位は、不動産・船舶・国債・地方債・上場株式等です。\n【ひっかけ】物納は、延納によっても金銭納付が困難な場合に限り認められます。"}, {"id": "tf:8430dcbaf6", "c": 6, "s": "問題6-5", "st": 1, "q": "相続税の取得費加算の特例は、相続税の申告期限の翌日から5年以内に相続財産を譲渡した場合に適用を受けられる。", "a": false, "e": "誤りです。\n【根拠】申告期限の翌日から3年以内に譲渡した場合に適用されます。\n【ひっかけ】相続開始から3年10か月以内と覚えることもできます。"}, {"id": "tf:36fb7a106d", "c": 6, "s": "問題6-5", "st": 1, "q": "経営承継円滑化法による遺留分に関する民法の特例の適用を受けるためには、推定相続人全員の合意、経済産業大臣の確認及び家庭裁判所の許可が必要である。", "a": true, "e": "正しい記述です。\n【根拠】除外合意・固定合意をするには、この3つが必要です。\n【ひっかけ】合意だけで効力が生じるわけではありません。"}, {"id": "tf:75ddc9ff8c", "c": 6, "s": "問題6-5", "st": 1, "q": "相続により取得した非上場株式を、相続税の申告期限の翌日から3年以内に発行会社に譲渡した場合、みなし配当課税は行われない。", "a": true, "e": "正しい記述です。\n【根拠】この特例により、譲渡所得（20.315％）として課税され、相続税の取得費加算も使えます。\n【ひっかけ】通常、発行会社への譲渡（自己株式の取得）にはみなし配当課税が行われます。"}, {"id": "tf:b5089d76b1", "c": 6, "s": "問題6-6", "st": 1, "q": "被相続人は、遺言で、相続開始の時から10年間、遺産の分割を禁止することができる。", "a": false, "e": "誤りです。\n【根拠】遺言で分割を禁止できるのは、相続開始から5年を超えない期間です。\n【ひっかけ】数字を変える出題に注意します。"}, {"id": "tf:6d3d89e996", "c": 6, "s": "問題6-6", "st": 2, "q": "代償分割により、特定の相続人が他の相続人に代償金を支払った場合、代償金を受け取った相続人の相続税の課税価格には、その代償金の額が加算される。", "a": true, "e": "正しい記述です。\n【根拠】代償金を支払った者は課税価格から差し引き、受け取った者は加算します。\n【ひっかけ】代償金として土地などの資産を渡すと、渡した側に譲渡所得が生じます。"}, {"id": "tf:8527e2c4d4", "c": 6, "s": "問題6-6", "st": 1, "q": "配偶者居住権の存続期間は、別段の定めがない限り、配偶者の終身の間である。", "a": true, "e": "正しい記述です。\n【根拠】存続期間は原則として終身です。登記をすれば第三者に対抗できます。\n【ひっかけ】配偶者短期居住権とは別の制度です。"}, {"id": "tf:098996ef69", "c": 6, "s": "問題6-6", "st": 1, "q": "被相続人の療養看護に尽くした相続人以外の親族は、相続人に対して特別寄与料を請求することができる。", "a": true, "e": "正しい記述です。\n【根拠】特別寄与料は、相続人以外の親族（子の配偶者など）が請求できます。\n【ひっかけ】相続人の寄与は、寄与分として遺産分割で考慮されます。"}, {"id": "tf:d176e6f715", "c": 6, "s": "問題6-6", "st": 2, "q": "任意後見契約は、公正証書によって締結しなければならない。", "a": true, "e": "正しい記述です。\n【根拠】任意後見契約は公正証書で結びます。効力は、家庭裁判所が任意後見監督人を選任した時から生じます。\n【ひっかけ】法定後見は、家庭裁判所が後見人等を選任します。"}, {"id": "tf:b3caa11148", "c": 6, "s": "問題6-6", "st": 1, "q": "法定後見制度は、本人の判断能力の程度に応じて、後見・保佐・補助の3つの類型に分かれる。", "a": true, "e": "正しい記述です。\n【根拠】判断能力が最も低い場合が後見、次が保佐、軽い場合が補助です。\n【ひっかけ】任意後見には類型の区分はありません。"}], "mc": [{"id": "mc:35ba7903be", "c": 1, "s": "問題1-1", "st": 2, "q": "ファイナンシャル・プランナー（FP）の顧客に対する行為に関する次の記述のうち、関連法規に照らし、最も不適切なものはどれか。", "o": ["税理士資格を有しないFPが、顧客から無償で相談を受け、その顧客の所得税の具体的な納付税額を計算した。", "弁護士資格を有しないFPが、顧客の公正証書遺言作成の際に証人となった。", "生命保険募集人の登録を受けていないFPが、顧客の必要保障額を試算した。", "金融商品取引業の登録を受けていないFPが、景気動向や金利の見通しについて一般的な説明をした。"], "a": 0, "e": "正解は「税理士資格を有しないFPが、顧客から無償で相談を受け、その顧客の所得税の具体的な納付税額を計算した。」です。\n【根拠】個別具体的な税額計算は税務相談に当たり、無償でも税理士資格が必要です。\n【ひっかけ】証人・必要保障額の試算・一般的な経済の説明は、いずれも資格がなくても行えます。"}, {"id": "mc:356eb78f00", "c": 1, "s": "問題1-1", "st": 2, "q": "毎年一定額を複利で運用しながら積み立て、10年後に1,000万円を準備したい。毎年の積立額を求めるときに用いる係数として、最も適切なものはどれか。", "o": ["年金終価係数", "減債基金係数", "資本回収係数", "現価係数"], "a": 1, "e": "正解は「減債基金係数」です。\n【根拠】将来の目標額×減債基金係数＝毎年の積立額です。\n【ひっかけ】年金終価係数は、毎年の積立額から将来の元利合計を求めるときに使います（逆数の関係）。"}, {"id": "mc:0f08c6382a", "c": 1, "s": "問題1-1", "st": 2, "q": "1,000万円を年利2％で複利運用しながら、10年間にわたって毎年均等に取り崩す場合、毎年受け取れる金額として正しいものはどれか（係数：年利2％・10年の資本回収係数0.1113、年金現価係数8.9826、減債基金係数0.0913）。", "o": ["91.3万円", "100万円", "111.3万円", "898.3万円"], "a": 2, "e": "正解は「111.3万円」です。\n【根拠】現在の元本から毎年の取崩額を求めるには資本回収係数を使います。1,000万円×0.1113＝111.3万円です。\n【ひっかけ】減債基金係数を使うと91.3万円になります。どの係数を使うかを問う出題です。"}, {"id": "mc:88962a832f", "c": 1, "s": "問題1-1", "st": 2, "q": "毎年120万円を受け取るために、年利1％で複利運用する場合、10年間受け取るために現時点で必要な元本として正しいものはどれか（係数：年利1％・10年の年金現価係数9.4713、資本回収係数0.1056、年金終価係数10.4622）。", "o": ["1,136.6万円", "1,200.0万円", "1,255.5万円", "126.7万円"], "a": 0, "e": "正解は「1,136.6万円」です。\n【根拠】毎年の受取額×年金現価係数＝必要な元本。120万円×9.4713＝1,136.556万円≒1,136.6万円です。\n【ひっかけ】年金終価係数を使うと1,255.5万円になります。"}, {"id": "mc:9af3f63f3f", "c": 1, "s": "問題1-2", "st": 2, "q": "全国健康保険協会管掌健康保険の給付に関する次の記述のうち、最も適切なものはどれか。", "o": ["傷病手当金は、連続して3日間休業した後、4日目から支給される。", "傷病手当金の支給期間は、支給開始日から通算して2年である。", "出産手当金は、出産日以前56日から出産日後42日までの期間に支給される。", "出産育児一時金の額は、産科医療補償制度に加入する医療機関で出産した場合、1児につき42万円である。"], "a": 0, "e": "正解は「傷病手当金は、連続して3日間休業した後、4日目から支給される。」です。\n【根拠】傷病手当金は連続3日の待期の後、4日目から支給されます。\n【ひっかけ】支給期間は通算1年6か月、出産手当金は産前42日・産後56日、出産育児一時金は50万円です。"}, {"id": "mc:0911a739d6", "c": 1, "s": "問題1-2", "st": 2, "q": "介護保険に関する次の記述のうち、最も適切なものはどれか。", "o": ["第1号被保険者は、60歳以上の者である。", "第2号被保険者は、要介護状態となった原因を問わず給付を受けられる。", "介護サービスの利用者負担は、原則として1割である。", "第2号被保険者の保険料は、年金から天引きされる。"], "a": 2, "e": "正解は「介護サービスの利用者負担は、原則として1割である。」です。\n【根拠】利用者負担は原則1割で、一定以上の所得がある第1号被保険者は2割又は3割です。\n【ひっかけ】第1号は65歳以上、第2号は特定疾病の場合のみ給付、第2号の保険料は医療保険料と一緒に徴収されます。"}, {"id": "mc:95ed57aa08", "c": 1, "s": "問題1-3", "st": 2, "q": "雇用保険に関する次の記述のうち、最も不適切なものはどれか。", "o": ["基本手当の受給資格は、原則として離職の日以前2年間に被保険者期間が通算12か月以上あることである。", "基本手当の待期期間は、通算7日間である。", "高年齢雇用継続基本給付金は、賃金が60歳到達時の75％未満に低下した場合に支給される。", "雇用保険の保険料は、全額を事業主が負担する。"], "a": 3, "e": "正解は「雇用保険の保険料は、全額を事業主が負担する。」です。\n【根拠】雇用保険の保険料は事業主と労働者の双方が負担します。\n【ひっかけ】全額事業主負担なのは労災保険です。"}, {"id": "mc:bfda78665d", "c": 1, "s": "問題1-3", "st": 2, "q": "雇用保険の給付に関する次の記述のうち、最も適切なものはどれか。", "o": ["基本手当の待期期間は通算14日間である。", "育児休業給付金は、休業開始から180日目までは賃金日額の67％相当額である。", "高年齢雇用継続基本給付金は、65歳以上の者に支給される。", "労災保険の保険料は、労使折半である。"], "a": 1, "e": "正解は「育児休業給付金は、休業開始から180日目までは賃金日額の67％相当額である。」です。\n【根拠】育児休業給付金は180日目まで67％、以後50％です。\n【ひっかけ】待期は7日間、高年齢雇用継続基本給付金は60歳以上65歳未満、労災保険料は全額事業主負担です。"}, {"id": "mc:7a64d77839", "c": 1, "s": "問題1-4", "st": 2, "q": "公的年金に関する次の記述のうち、最も適切なものはどれか。", "o": ["老齢基礎年金の受給資格期間は25年である。", "老齢基礎年金を60歳0か月で繰上げ受給した場合の減額率は24％である（1962年4月2日以後生まれ）。", "老齢基礎年金の繰下げ受給による増額率は、1か月あたり0.4％である。", "合算対象期間は、老齢基礎年金の年金額の計算に反映される。"], "a": 1, "e": "正解は「老齢基礎年金を60歳0か月で繰上げ受給した場合の減額率は24％である（1962年4月2日以後生まれ）。」です。\n【根拠】0.4％×60か月＝24％です。\n【ひっかけ】受給資格期間は10年、繰下げの増額率は0.7％、合算対象期間は年金額に反映されません。"}, {"id": "mc:74d31a37c5", "c": 1, "s": "問題1-4", "st": 2, "q": "国民年金の付加年金に関する次の記述のうち、最も適切なものはどれか。", "o": ["付加保険料の額は月額200円である。", "付加年金の額は、400円に付加保険料納付月数を乗じた額である。", "国民年金基金の加入員は、付加保険料を納付することができない。", "第2号被保険者も付加保険料を納付することができる。"], "a": 2, "e": "正解は「国民年金基金の加入員は、付加保険料を納付することができない。」です。\n【根拠】国民年金基金の加入員は付加保険料を納付できません。\n【ひっかけ】付加保険料は月400円、付加年金は200円×納付月数です。対象は第1号被保険者（任意加入被保険者を含む）です。"}, {"id": "mc:99406d410b", "c": 1, "s": "問題1-4", "st": 2, "q": "国民年金に関する次の記述のうち、最も不適切なものはどれか。", "o": ["第3号被保険者は、自ら保険料を納付する必要はない。", "学生納付特例期間は、受給資格期間に算入される。", "老齢基礎年金の繰下げは、老齢厚生年金と別々に行うことができる。", "老齢基礎年金の繰上げは、老齢厚生年金と別々に行うことができる。"], "a": 3, "e": "正解は「老齢基礎年金の繰上げは、老齢厚生年金と別々に行うことができる。」です。\n【根拠】繰上げは老齢基礎年金と老齢厚生年金を同時に請求しなければなりません。\n【ひっかけ】繰下げは別々に行えます。"}, {"id": "mc:a6b64f326d", "c": 1, "s": "問題1-5", "st": 2, "q": "遺族給付に関する次の記述のうち、最も不適切なものはどれか。", "o": ["遺族基礎年金は、子のある配偶者又は子に支給される。", "遺族厚生年金の額は、死亡した者の報酬比例部分の4分の3相当額である。", "夫の死亡当時30歳未満で子のない妻に支給される遺族厚生年金は、5年間の有期給付である。", "中高齢寡婦加算は、夫の死亡当時30歳以上65歳未満の妻に加算される。"], "a": 3, "e": "正解は「中高齢寡婦加算は、夫の死亡当時30歳以上65歳未満の妻に加算される。」です。\n【根拠】中高齢寡婦加算の対象は、夫の死亡当時40歳以上65歳未満で、遺族基礎年金を受けられない妻です。\n【ひっかけ】30歳は「子のない妻の5年有期給付」の基準となる年齢です。"}, {"id": "mc:8b9d040222", "c": 1, "s": "問題1-5", "st": 2, "q": "個人型確定拠出年金（iDeCo）に関する次の記述のうち、最も適切なものはどれか。", "o": ["掛金は、生命保険料控除の対象となる。", "老齢給付金を年金で受け取った場合は、雑所得として課税される。", "老齢給付金を一時金で受け取った場合は、一時所得として課税される。", "通算加入者等期間に関係なく、60歳から老齢給付金を受け取ることができる。"], "a": 1, "e": "正解は「老齢給付金を年金で受け取った場合は、雑所得として課税される。」です。\n【根拠】年金で受け取ると雑所得（公的年金等控除の対象）です。\n【ひっかけ】掛金は小規模企業共済等掛金控除、一時金は退職所得です。60歳から受け取るには通算加入者等期間10年以上が必要です。"}, {"id": "mc:2302c84aa9", "c": 1, "s": "問題1-6", "st": 2, "q": "住宅ローンに関する次の記述のうち、最も不適切なものはどれか。", "o": ["元利均等返済は、毎回の返済額が一定である。", "元金均等返済は、元利均等返済に比べて当初の返済額が多い。", "同額を繰上げ返済する場合、期間短縮型は返済額軽減型より利息の軽減効果が大きい。", "フラット35は、借入時から10年間だけ金利が固定される住宅ローンである。"], "a": 3, "e": "正解は「フラット35は、借入時から10年間だけ金利が固定される住宅ローンである。」です。\n【根拠】

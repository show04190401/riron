: "区分所有建物の登記記録上の専有部分の床面積は、壁その他の区画の内側線で囲まれた部分（内法面積）で記録される。", "a": true, "e": "正しい記述です。\n【根拠】区分建物の登記は内法面積です。\n【ひっかけ】マンションの広告などに使われる壁芯面積より小さくなります。住宅ローン控除などの床面積要件は登記面積で判定します。"}, {"id": "tf:b96f85ff48", "c": 5, "s": "問題5-1", "st": 1, "q": "法務局に備え付けられている公図は、土地の位置や形状を正確に示すものであり、現況と必ず一致する。", "a": false, "e": "誤りです。\n【根拠】公図は精度が低いものも多く、現況と一致するとは限りません。\n【ひっかけ】土地の形状や面積を確認するには、地積測量図なども参照します。"}, {"id": "tf:f09b69848a", "c": 5, "s": "問題5-1", "st": 1, "q": "建物を新築した場合、所有者は1か月以内に表題登記を申請しなければならない。", "a": true, "e": "正しい記述です。\n【根拠】表示に関する登記には申請義務があります。\n【ひっかけ】権利に関する登記には、原則として申請義務がありません（相続登記を除く）。"}, {"id": "tf:65d10445db", "c": 5, "s": "問題5-1", "st": 2, "q": "相続により不動産の所有権を取得した相続人は、取得を知った日から3年以内に相続登記を申請しなければならない。", "a": true, "e": "正しい記述です。\n【根拠】2024年4月から相続登記が義務化され、正当な理由なく怠ると過料の対象です。\n【ひっかけ】2024年4月より前の相続にも適用されます。"}, {"id": "tf:a68c683b54", "c": 5, "s": "問題5-1", "st": 1, "q": "所有権移転登記などの権利に関する登記は、原則として登記権利者と登記義務者が共同で申請する。", "a": true, "e": "正しい記述です。\n【根拠】売買の場合は、買主（権利者）と売主（義務者）が共同で申請します。\n【ひっかけ】相続登記は、相続人が単独で申請できます。"}, {"id": "tf:dc408d074e", "c": 5, "s": "問題5-1", "st": 1, "q": "同一の不動産に複数の抵当権が設定された場合、その順位は抵当権設定契約の締結の先後による。", "a": false, "e": "誤りです。\n【根拠】抵当権の順位は、登記の先後によります。\n【ひっかけ】登記の対抗力が問われる論点です。"}, {"id": "tf:1f96bd49fa", "c": 5, "s": "問題5-1", "st": 2, "q": "不動産の売主が登記名義人でない場合、登記記録を信頼して購入した買主は、必ず所有権を取得できる。", "a": false, "e": "誤りです。\n【根拠】登記に公信力はないため、真の所有者から権利を主張されると所有権を取得できないことがあります。\n【ひっかけ】購入時には、登記記録だけでなく現地や本人確認も大切です。"}, {"id": "tf:20402bd369", "c": 5, "s": "問題5-1", "st": 2, "q": "直接還元法では、一期間の純収益を還元利回りで除して収益価格を求める。", "a": true, "e": "正しい記述です。\n【根拠】収益価格＝一期間の純収益÷還元利回りです。\n【ひっかけ】DCF法は、複数期間の純収益と復帰価格を現在価値に割り引いて合計します。"}, {"id": "tf:60f3506f8d", "c": 5, "s": "問題5-1", "st": 1, "q": "不動産の鑑定評価では、原価法・取引事例比較法・収益還元法のうち、原則としていずれか1つの手法だけを用いる。", "a": false, "e": "誤りです。\n【根拠】鑑定評価では、原則として複数の手法を併用します。\n【ひっかけ】原価法は積算価格、取引事例比較法は比準価格、収益還元法は収益価格を求めます。"}, {"id": "tf:18cfcf8579", "c": 5, "s": "問題5-1", "st": 1, "q": "相続税路線価は、路線に面する宅地の1㎡当たりの価額を千円単位で表示したものである。", "a": true, "e": "正しい記述です。\n【根拠】路線価図では、価額の後ろに借地権割合を示すアルファベットが付いています。\n【ひっかけ】Aは90％、Bは80％、Cは70％、Dは60％、Eは50％、Fは40％、Gは30％です。"}, {"id": "tf:0dc72fd436", "c": 5, "s": "問題5-1", "st": 1, "q": "固定資産課税台帳は、その不動産の所有者などが閲覧することができる。", "a": true, "e": "正しい記述です。\n【根拠】所有者や借地人・借家人などは、固定資産課税台帳を閲覧できます。\n【ひっかけ】固定資産税評価額は、登録免許税や不動産取得税の課税標準にも使われます。"}, {"id": "tf:262d29c0f6", "c": 5, "s": "問題5-1", "st": 2, "q": "公示価格は、毎年7月1日を基準日として、都道府県が公表する。", "a": false, "e": "誤りです。\n【根拠】公示価格は、毎年1月1日を基準日として国土交通省（土地鑑定委員会）が公表します。\n【ひっかけ】7月1日・都道府県は基準地標準価格です。"}, {"id": "tf:00f7ed3b8b", "c": 5, "s": "問題5-1", "st": 2, "q": "固定資産税評価額は、公示価格の80％程度が目安とされている。", "a": false, "e": "誤りです。\n【根拠】固定資産税評価額は公示価格の70％程度、相続税路線価は80％程度が目安です。\n【ひっかけ】数字の入れ替えに注意します。"}, {"id": "tf:139e733a14", "c": 5, "s": "問題5-1", "st": 2, "q": "不動産の登記記録の権利部乙区には、所有権以外の権利に関する事項が記録される。", "a": true, "e": "正しい記述です。\n【根拠】抵当権や賃借権などが記録されます。\n【ひっかけ】甲区には所有権に関する事項が記録されます。"}, {"id": "tf:2fec553297", "c": 5, "s": "問題5-1", "st": 2, "q": "仮登記をすれば、その権利を第三者に対抗することができる。", "a": false, "e": "誤りです。\n【根拠】仮登記には対抗力はありません。後に本登記をしたときの順位を保全する効力があります。\n【ひっかけ】本登記をして初めて対抗力が生じます。"}, {"id": "tf:3325e22541", "c": 5, "s": "問題5-1", "st": 1, "q": "原価法は、対象不動産の再調達原価を求め、これに減価修正を行って積算価格を求める手法である。", "a": true, "e": "正しい記述です。\n【根拠】主に建物の評価に適した手法です。\n【ひっかけ】取引事例比較法は比準価格、収益還元法は収益価格を求めます。"}, {"id": "tf:111d13c129", "c": 5, "s": "問題5-2", "st": 2, "q": "専任媒介契約の有効期間は3か月を超えることができず、宅建業者は依頼者に対し、業務の処理状況を1週間に1回以上報告しなければならない。", "a": false, "e": "誤りです。\n【根拠】専任媒介契約の報告義務は2週間に1回以上です。1週間に1回以上は専属専任媒介契約です。\n【ひっかけ】有効期間はどちらも3か月以内です。"}, {"id": "tf:56f9b5c7e6", "c": 5, "s": "問題5-2", "st": 2, "q": "宅建業者が自ら売主となる宅地の売買契約において、宅建業者でない買主から、代金の20％を超える手付金を受け取ることはできない。", "a": true, "e": "正しい記述です。\n【根拠】宅建業者が自ら売主の場合、手付は代金の20％が上限で、解約手付とされます。\n【ひっかけ】宅建業者同士の取引には、この制限は適用されません。"}, {"id": "tf:1d2d02466b", "c": 5, "s": "問題5-2", "st": 1, "q": "売買代金が1,000万円の宅地の売買を媒介した宅建業者が、依頼者の一方から受け取れる報酬の上限額は、36万円（税抜）である。", "a": true, "e": "正しい記述です。\n【根拠】1,000万円×3％＋6万円＝36万円（税抜）です。\n【ひっかけ】「＋6万円」を忘れる計算ミスに注意します。"}, {"id": "tf:6029dc5725", "c": 5, "s": "問題5-2", "st": 2, "q": "解約手付が交付された場合、売主は、買主が契約の履行に着手した後であっても、手付の倍額を現実に提供して契約を解除することができる。", "a": false, "e": "誤りです。\n【根拠】解約手付による解除は、相手方が契約の履行に着手するまでに限られます。\n【ひっかけ】自分が履行に着手していても、相手方が着手していなければ解除できます。"}, {"id": "tf:dd2c794478", "c": 5, "s": "問題5-2", "st": 2, "q": "売買の目的物の品質が契約の内容に適合しない場合、買主はその不適合を知った時から1年以内にその旨を売主に通知しなければ、契約不適合責任を追及できない。", "a": true, "e": "正しい記述です。\n【根拠】種類・品質に関する契約不適合は、知った時から1年以内の通知が必要です。\n【ひっかけ】売主が引渡しの時に不適合を知っていた場合などは、この期間制限は適用されません。"}, {"id": "tf:73aa5dd651", "c": 5, "s": "問題5-2", "st": 2, "q": "一般媒介契約を締結した宅建業者には、物件を指定流通機構（レインズ）に登録する義務はない。", "a": true, "e": "正しい記述です。\n【根拠】一般媒介契約にはレインズへの登録義務はありません。\n【ひっかけ】専任媒介は7日以内、専属専任媒介は5日以内（いずれも休業日を除く）に登録する義務があります。"}, {"id": "tf:8249300ca9", "c": 5, "s": "問題5-2", "st": 1, "q": "専属専任媒介契約では、依頼者は、自ら見つけた相手方と直接売買契約を結ぶことができる。", "a": false, "e": "誤りです。\n【根拠】専属専任媒介契約では、自己発見取引はできません。\n【ひっかけ】専任媒介契約では、自己発見取引ができます。"}, {"id": "tf:0cdef56d1f", "c": 5, "s": "問題5-2", "st": 2, "q": "自ら所有するアパートを賃貸する行為は、宅地建物取引業に該当するため、宅地建物取引業の免許が必要である。", "a": false, "e": "誤りです。\n【根拠】自ら貸主となる行為は宅地建物取引業に当たらず、免許は不要です。\n【ひっかけ】他人の物件の賃貸を媒介する場合は免許が必要です。"}, {"id": "tf:0419d011bd", "c": 5, "s": "問題5-2", "st": 1, "q": "宅建業者が居住用建物の賃貸借の媒介をする場合、貸主・借主の双方から受け取れる報酬の合計額は、借賃の1か月分＋消費税が上限である。", "a": true, "e": "正しい記述です。\n【根拠】居住用建物は、依頼者の承諾がなければ、一方からは0.5か月分＋消費税までです。\n【ひっかけ】売買の報酬（3％＋6万円）とは計算方法が異なります。"}, {"id": "tf:5fe2ea08ce", "c": 5, "s": "問題5-2", "st": 2, "q": "宅建業者が自ら売主となる宅地の売買契約を、宅建業者の事務所で締結した場合でも、買主はクーリング・オフにより契約を解除できる。", "a": false, "e": "誤りです。\n【根拠】事務所等で申込み・契約をした場合は、クーリング・オフはできません。\n【ひっかけ】喫茶店や買主の勤務先などで契約した場合が対象です。"}, {"id": "tf:92f5d34ce2", "c": 5, "s": "問題5-2", "st": 1, "q": "宅建業者が自ら売主となる売買契約において、契約不適合を通知する期間を引渡しの日から2年以上とする特約は有効である。", "a": true, "e": "正しい記述です。\n【根拠】この特約以外で、民法の規定より買主に不利な特約は無効です。\n【ひっかけ】宅建業者同士の取引には、この制限はありません。"}, {"id": "tf:b006258bc4", "c": 5, "s": "問題5-2", "st": 1, "q": "重要事項の説明を行う宅地建物取引士は、相手方から請求がなくても宅地建物取引士証を提示しなければならない。", "a": true, "e": "正しい記述です。\n【根拠】説明の際には、取引士証の提示が必要です。\n【ひっかけ】重要事項説明書には、宅地建物取引士の記名が必要です。"}, {"id": "tf:7528e6eb32", "c": 5, "s": "問題5-2", "st": 2, "q": "共有物の保存行為は、各共有者が単独で行うことができる。", "a": true, "e": "正しい記述です。\n【根拠】修繕などの保存行為は単独で行えます。\n【ひっかけ】賃貸などの管理行為は持分の過半数、売却などの変更行為は全員の同意が必要です。"}, {"id": "tf:49532ee819", "c": 5, "s": "問題5-2", "st": 2, "q": "共有者は、他の共有者全員の同意がなければ、自己の持分を第三者に譲渡することができない。", "a": false, "e": "誤りです。\n【根拠】自分の持分は、他の共有者の同意なく自由に処分できます。\n【ひっかけ】共有物全体を売却するには、全員の同意が必要です。"}, {"id": "tf:5f5685fcbc", "c": 5, "s": "問題5-2", "st": 1, "q": "建物の売買契約締結後、引渡し前に、売主・買主双方の責めに帰することができない事由で建物が滅失した場合、買主は代金の支払を拒むことができる。", "a": true, "e": "正しい記述です。\n【根拠】民法の危険負担の規定です（引渡し前の滅失は売主の負担）。\n【ひっかけ】引渡し後の滅失は、買主の負担になります。"}, {"id": "tf:6417a1a217", "c": 5, "s": "問題5-2", "st": 1, "q": "専属専任媒介契約を締結した宅建業者は、契約締結日から7日以内（休業日を除く）に指定流通機構に物件を登録しなければならない。", "a": false, "e": "誤りです。\n【根拠】専属専任媒介契約は5日以内、専任媒介契約は7日以内です。\n【ひっかけ】一般媒介契約には登録義務がありません。"}, {"id": "tf:9fc5d143f0", "c": 5, "s": "問題5-2", "st": 2, "q": "宅建業者が自ら売主となる売買契約において、買主が宅建業者でない場合、手付金の額は代金の30％まで受け取ることができる。", "a": false, "e": "誤りです。\n【根拠】手付金の上限は代金の20％です。\n【ひっかけ】受け取った手付は、解約手付とされます。"}, {"id": "tf:a9e6bcb58d", "c": 5, "s": "問題5-2", "st": 1, "q": "売買の目的物の種類・品質に関する契約不適合について、買主は不適合を知った時から1年以内に売主に通知する必要がある。", "a": true, "e": "正しい記述です。\n【根拠】期間内に通知すれば、その後に権利を行使できます。\n【ひっかけ】数量に関する不適合には、この期間制限はありません。"}, {"id": "tf:5e6c7fc0ef", "c": 5, "s": "問題5-2", "st": 1, "q": "売買代金が5,000万円の宅地の売買の媒介を行った宅建業者が、売主から受け取れる報酬の上限額は、156万円（税抜）である。", "a": true, "e": "正しい記述です。\n【根拠】5,000万円×3％＋6万円＝156万円です。\n【ひっかけ】税込では消費税が加算されます。"}, {"id": "tf:d276c373bf", "c": 5, "s": "問題5-3", "st": 2, "q": "普通借地権の存続期間は、当事者間で期間の定めをしなかった場合、30年となる。", "a": true, "e": "正しい記述です。\n【根拠】普通借地権の存続期間は30年以上で、定めがなければ30年です。\n【ひっかけ】最初の更新後は20年以上、2回目以降は10年以上です。"}, {"id": "tf:a975951707", "c": 5, "s": "問題5-3", "st": 2, "q": "一般定期借地権の設定契約は、公正証書によってしなければならない。", "a": false, "e": "誤りです。\n【根拠】一般定期借地権は、書面（又は電磁的記録）で契約すれば足り、公正証書である必要はありません。\n【ひっかけ】公正証書が必要なのは事業用定期借地権等です。"}, {"id": "tf:67526531ee", "c": 5, "s": "問題5-3", "st": 2, "q": "事業用定期借地権等は、存続期間を10年以上50年未満として、居住用の賃貸マンションの敷地に設定することができる。", "a": false, "e": "誤りです。\n【根拠】事業用定期借地権等は、もっぱら事業の用に供する建物（居住用を除く）の所有を目的とする場合に限られます。\n【ひっかけ】賃貸マンションは居住用なので設定できません。"}, {"id": "tf:6aa628ded5", "c": 5, "s": "問題5-3", "st": 2, "q": "普通借家契約において、期間を1年未満と定めた場合、期間の定めがない建物賃貸借とみなされる。", "a": true, "e": "正しい記述です。\n【根拠】普通借家契約で1年未満の期間を定めると、期間の定めがないものとみなされます。\n【ひっかけ】定期借家契約では、1年未満の期間も有効に定められます。"}, {"id": "tf:a4c1e2a8d2", "c": 5, "s": "問題5-3", "st": 2, "q": "定期借家契約は、公正証書によって締結しなければ効力を生じない。", "a": false, "e": "誤りです。\n【根拠】定期借家契約は書面（又は電磁的記録）で締結すればよく、公正証書である必要はありません。\n【ひっかけ】契約前に、更新がない旨を記載した書面を交付して説明する必要があります。"}, {"id": "tf:6df72f2edf", "c": 5, "s": "問題5-3", "st": 1, "q": "建物の賃貸借契約において、賃借人の造作買取請求権を排除する特約は有効である。", "a": true, "e": "正しい記述です。\n【根拠】造作買取請求権は、特約で排除できます。\n【ひっかけ】賃借人に不利な特約が無効とされる規定と区別します。"}, {"id": "tf:c755aa78c0", "c": 5, "s": "問題5-3", "st": 2, "q": "区分所有建物の建替え決議は、集会において区分所有者及び議決権の各4分の3以上の多数で行う。", "a": false, "e": "誤りです。\n【根拠】建替え決議は、区分所有者及び議決権の各5分の4以上の多数が必要です。\n【ひっかけ】4分の3以上は規約の設定・変更・廃止などの特別決議です。"}, {"id": "tf:743fa1c607", "c": 5, "s": "問題5-3", "st": 2, "q": "借地上の建物を借地権者の配偶者名義で登記した場合でも、借地権を第三者に対抗することができる。", "a": false, "e": "誤りです。\n【根拠】借地権の対抗要件となるのは、借地権者本人名義で登記された建物です。\n【ひっかけ】家族名義の登記では対抗できないとした判例があります。"}, {"id": "tf:54b90aa773", "c": 5, "s": "問題5-3", "st": 2, "q": "建物の賃借人は、借家権の登記がなくても、建物の引渡しを受けていれば、その後にその建物を取得した者に借家権を対抗することができる。", "a": true, "e": "正しい記述です。\n【根拠】借地借家法により、建物の引渡しが借家権の対抗要件となります。\n【ひっかけ】借地権の対抗要件（本人名義の建物登記）と区別します。"}, {"id": "tf:ab64942b58", "c": 5, "s": "問題5-3", "st": 1, "q": "床面積200㎡未満の居住用建物の定期借家契約では、転勤などやむを得ない事情があれば、賃借人は中途解約を申し入れることができる。", "a": true, "e": "正しい記述です。\n【根拠】解約の申入れから1か月を経過すると契約が終了します。\n【ひっかけ】床面積200㎡以上の建物や事業用建物には、この規定は適用されません。"}, {"id": "tf:af3c3bebe5", "c": 5, "s": "問題5-3", "st": 1, "q": "普通借家契約において、賃貸人からの更新拒絶の通知は、期間満了の1年前から6か月前までにしなければならず、正当の事由が必要である。", "a": true, "e": "正しい記述です。\n【根拠】期間の定めがある普通借家契約では、この期間内の通知と正当の事由が必要です。\n【ひっかけ】期間の定めがない場合、賃貸人からの解約申入れは6か月前、正当の事由も必要です。"}, {"id": "tf:ebb101829f", "c": 5, "s": "問題5-3", "st": 2, "q": "普通借地権の存続期間が満了し契約が更新されない場合、借地権者は地主に対し、建物を時価で買い取るよう請求することができる。", "a": true, "e": "正しい記述です。\n【根拠】建物買取請求権です。\n【ひっかけ】一般定期借地権や事業用定期借地権等では、建物買取請求権を排除する特約ができます。"}, {"id": "tf:f0ea861249", "c": 5, "s": "問題5-3", "st": 1, "q": "期間の定めのない建物賃貸借で、賃貸人から解約を申し入れる場合、正当の事由があれば、申入れの日から6か月を経過すると契約が終了する。", "a": true, "e": "正しい記述です。\n【根拠】賃貸人からの解約申入れは6か月前、正当の事由が必要です。\n【ひっかけ】賃借人からの解約申入れは、3か月を経過すると終了します。"}, {"id": "tf:fb0670d60b", "c": 5, "s": "問題5-3", "st": 1, "q": "普通借家契約において、一定期間賃料を減額しない旨の特約は有効である。", "a": false, "e": "誤りです。\n【根拠】賃料を減額しない特約は、賃借人に不利なため無効です。\n【ひっかけ】一定期間賃料を増額しない特約は有効です。"}, {"id": "tf:56f8dfe405", "c": 5, "s": "問題5-3", "st": 1, "q": "定期借家契約では、賃料の増減額請求権を排除する特約を定めることができる。", "a": true, "e": "正しい記述です。\n【根拠】賃料改定の特約があれば、借賃増減請求の規定は適用されません。\n【ひっかけ】普通借家契約との違いです。"}, {"id": "tf:95759f1cf9", "c": 5, "s": "問題5-3", "st": 1, "q": "区分所有建物の区分所有者は、全員で建物とその敷地等を管理するための団体（管理組合）を当然に構成する。", "a": true, "e": "正しい記述です。\n【根拠】区分所有者は、加入の意思にかかわらず当然に構成員になります。\n【ひっかけ】管理組合から脱退することはできません。"}, {"id": "tf:e1d91f3138", "c": 5, "s": "問題5-3", "st": 1, "q": "区分所有法では、管理者は少なくとも毎年1回集会を招集しなければならないとされている。", "a": true, "e": "正しい記述です。\n【根拠】管理者は毎年1回以上集会を招集し、事務の報告をします。\n【ひっかけ】区分所有者の5分の1以上で議決権の5分の1以上を有する者は、集会の招集を請求できます。"}, {"id": "tf:7500013d1a", "c": 5, "s": "問題5-3", "st": 1, "q": "共用部分の重大な変更は、区分所有者及び議決権の各4分の3以上の多数による集会の決議で決する。", "a": true, "e": "正しい記述です。\n【根拠】区分所有者の定数は、規約で過半数まで減らすことができます。\n【ひっかけ】建替えは各5分の4以上です。"}, {"id": "tf:ec140ed6ca", "c": 5, "s": "問題5-3", "st": 2, "q": "一般定期借地権の存続期間は、30年以上である。", "a": false, "e": "誤りです。\n【根拠】一般定期借地権の存続期間は50年以上です。\n【ひっかけ】30年以上は普通借地権と建物譲渡特約付借地権です。"}, {"id": "tf:bb9e4e4539", "c": 5, "s": "問題5-3", "st": 2, "q": "事業用定期借地権等は、書面で契約すれば公正証書でなくても有効である。", "a": false, "e": "誤りです。\n【根拠】事業用定期借地権等の設定契約は、公正証書によらなければなりません。\n【ひっかけ】一般定期借地権は、書面（又は電磁的記録）でかまいません。"}, {"id": "tf:3b7bccf897", "c": 5, "s": "問題5-3", "st": 1, "q": "建物譲渡特約付借地権は、設定後30年以上経過した日に借地上の建物を地主に譲渡する旨の特約を付けた借地権である。", "a": true, "e": "正しい記述です。\n【根拠】建物の譲渡により借地権が消滅します。\n【ひっかけ】契約は口頭でも成立します（書面が望ましい）。"}, {"id": "tf:7614643914", "c": 5, "s": "問題5-3", "st": 1, "q": "定期借家契約の期間が1年以上の場合、賃貸人は期間満了の1年前から6か月前までに、賃借人に契約が終了する旨を通知しなければならない。", "a": true, "e": "正しい記述です。\n【根拠】通知をしないと、契約の終了を賃借人に対抗できません（通知から6か月後に終了を主張できます）。\n【ひっかけ】期間1年未満の契約には通知義務はありません。"}, {"id": "tf:cb2b173a92", "c": 5, "s": "問題5-3", "st": 2, "q": "区分所有法では、規約の変更は区分所有者及び議決権の各過半数の決議で行う。", "a": false, "e": "誤りです。\n【根拠】規約の設定・変更・廃止は、各4分の3以上の特別決議が必要です。\n【ひっかけ】建替えは各5分の4以上です。"}, {"id": "tf:6d04fec151", "c": 5, "s": "問題5-4", "st": 2, "q": "市街化区域内において、1,000㎡以上の開発行為を行う場合は、原則として都道府県知事等の許可が必要である。", "a": true, "e": "正しい記述です。\n【根拠】市街化区域では1,000㎡以上の開発行為に許可が必要です（三大都市圏の一定区域は500㎡以上）。\n【ひっかけ】市街化調整区域では、原則として規模にかかわらず許可が必要です。"}, {"id": "tf:877c198286", "c": 5, "s": "問題5-4", "st": 2, "q": "建築基準法上、建築物の敷地は、原則として幅員4m以上の道路に1m以上接していなければならない。", "a": false, "e": "誤りです。\n【根拠】接道義務は、幅員4m以上の道路に2m以上接することです。\n【ひっかけ】数字を入れ替える出題に注意します。"}, {"id": "tf:26a7a024e4", "c": 5, "s": "問題5-4", "st": 2, "q": "建築基準法第42条第2項の道路に面する敷地のうち、セットバック部分は、建ぺい率・容積率の計算上、敷地面積に算入しない。", "a": true, "e": "正しい記述です。\n【根拠】セットバック部分は道路とみなされるため、敷地面積に算入しません。\n【ひっかけ】原則として道路の中心線から2m後退した線が道路の境界線とみなされます。"}, {"id": "tf:9f44dfe8ca", "c": 5, "s": "問題5-4", "st": 2, "q": "前面道路の幅員が12m未満の場合の容積率は、指定容積率と、前面道路の幅員に法定乗数を乗じた数値のうち、いずれか高いほうとなる。", "a": false, "e": "誤りです。\n【根拠】いずれか低いほうが適用されます。\n【ひっかけ】住居系の用途地域の法定乗数は原則10分の4、その他は原則10分の6です。"}, {"id": "tf:19b0dca21c", "c": 5, "s": "問題5-4", "st": 2, "q": "建築物の敷地が2つの用途地域にまたがる場合、その敷地の全部について、敷地の過半が属する用途地域の用途制限が適用される。", "a": true, "e": "正しい記述です。\n【根拠】用途制限は、敷地の過半が属する地域の制限によります。\n【ひっかけ】建ぺい率・容積率は加重平均で計算します。用途制限と取り扱いが違う点が頻出です。"}, {"id": "tf:786cb690f0", "c": 5, "s": "問題5-4", "st": 2, "q": "市街化区域内の農地を転用する目的で売買する場合、あらかじめ農業委員会に届け出れば、都道府県知事等の許可は不要である。", "a": true, "e": "正しい記述です。\n【根拠】市街化区域内の農地の4条・5条転用は、農業委員会への届出で足ります。\n【ひっかけ】3条（農地のままの権利移動）には、この特例はありません。"}, {"id": "tf:a549574e2a", "c": 5, "s": "問題5-4", "st": 2, "q": "工業専用地域では、住宅を建築することはできない。", "a": true, "e": "正しい記述です。\n【根拠】工業専用地域では、住宅・共同住宅・老人ホームなどは建築できません。\n【ひっかけ】工業地域では住宅を建てられますが、学校・病院は建てられません。"}, {"id": "tf:3c98cec551", "c": 5, "s": "問題5-4", "st": 2, "q": "建ぺい率の上限が80％とされている地域内で、防火地域内にある耐火建築物等については、建ぺい率の制限が適用されない。", "a": true, "e": "正しい記述です。\n【根拠】指定建ぺい率80％の地域内で、防火地域内の耐火建築物等は建ぺい率の制限がなくなります（100％）。\n【ひっかけ】それ以外の地域では、10％の加算です。"}, {"id": "tf:b32ec37404", "c": 5, "s": "問題5-4", "st": 2, "q": "建築物が防火地域と準防火地域にわたる場合は、原則として、その全部について敷地の過半が属する地域の規制が適用される。", "a": false, "e": "誤りです。\n【根拠】防火規制は、原則として建築物の全部について厳しいほう（防火地域）の規制が適用されます。\n【ひっかけ】過半主義が適用されるのは用途制限です。"}, {"id": "tf:6ce1e77111", "c": 5, "s": "問題5-4", "st": 1, "q": "農地を農地のまま売買する場合、市街化区域内であっても農業委員会の許可が必要である。", "a": true, "e": "正しい記述です。\n【根拠】農地法3条の許可には、市街化区域の特例（届出）はありません。\n【ひっかけ】市街化区域内の特例は、4条・5条（転用）だけです。"}, {"id": "tf:6ab3a34ecb", "c": 5, "s": "問題5-4", "st": 1, "q": "市街化調整区域には、原則として用途地域を定めない。", "a": true, "e": "正しい記述です。\n【根拠】市街化を抑制すべき区域だからです。\n【ひっかけ】市街化区域には、少なくとも用途地域を定めます。"}, {"id": "tf:4457467022", "c": 5, "s": "問題5-4", "st": 2, "q": "第一種低層住居専用地域では、建築物の高さは原則として10m又は12mのうち都市計画で定める高さ以下でなければならない。", "a": true, "e": "正しい記述です。\n【根拠】絶対高さの制限です。第二種低層住居専用地域・田園住居地域も同じです。\n【ひっかけ】第一種中高層住居専用地域には絶対高さの制限はありません。"}, {"id": "tf:d80c6575ee", "c": 5, "s": "問題5-4", "st": 1, "q": "道路斜線制限は、すべての用途地域及び用途地域の指定のない区域に適用される。", "a": true, "e": "正しい記述です。\n【根拠】道路の採光・通風を確保するための制限です。\n【ひっかけ】北側斜線制限は、住居専用地域などに限って適用されます。"}, {"id": "tf:0231b571a3", "c": 5, "s": "問題5-4", "st": 1, "q": "北側斜線制限は、商業地域にも適用される。", "a": false, "e": "誤りです。\n【根拠】北側斜線制限は、低層住居専用地域・田園住居地域・中高層住居専用地域に適用されます。\n【ひっかけ】住宅の日当たりを守るための制限です。"}, {"id": "tf:1e62db4b02", "c": 5, "s": "問題5-4", "st": 1, "q": "隣地斜線制限は、第一種低層住居専用地域にも適用される。", "a": false, "e": "誤りです。\n【根拠】第一種・第二種低層住居専用地域と田園住居地域には、絶対高さの制限があるため隣地斜線制限は適用されません。\n【ひっかけ】道路斜線・北側斜線は適用されます。"}, {"id": "tf:b5ca58d97e", "c": 5, "s": "問題5-4", "st": 1, "q": "準都市計画区域内で開発行為を行う場合、原則として3,000㎡以上であれば開発許可が必要である。", "a": true, "e": "正しい記述です。\n【根拠】非線引き区域・準都市計画区域は3,000㎡以上、都市計画区域外は1ha以上です。\n【ひっかけ】市街化区域は1,000㎡以上です。"}, {"id": "tf:9a94b009f4", "c": 5, "s": "問題5-4", "st": 1, "q": "生産緑地は、指定から30年を経過すると、市町村長に対して買取りの申出をすることができる。", "a": true, "e": "正しい記述です。\n【根拠】特定生産緑地に指定されると、買取りの申出ができる時期が10年延長されます。\n【ひっかけ】生産緑地は、固定資産税が農地並みに軽減されます。"}, {"id": "tf:ee315199a9", "c": 5, "s": "問題5-4", "st": 2, "q": "建築物の敷地が2つの用途地域にわたる場合、容積率は、それぞれの地域の容積率を敷地面積の割合で加重平均して求める。", "a": true, "e": "正しい記述です。\n【根拠】建ぺい率も同様に加重平均します。\n【ひっかけ】用途制限は、敷地の過半が属する地域の制限が全体に適用されます。"}, {"id": "tf:1d3d4db2a2", "c": 5, "s": "問題5-4", "st": 2, "q": "市街化区域内の農地を転用する場合でも、都道府県知事等の許可が必要である。", "a": false, "e": "誤りです。\n【根拠】市街化区域内の農地の転用は、あらかじめ農業委員会に届け出れば許可は不要です。\n【ひっかけ】農地を農地のまま売買する3条許可には、この特例はありません。"}, {"id": "tf:68115bb459", "c": 5, "s": "問題5-4", "st": 1, "q": "建築基準法上の道路に該当しない幅員4m未満の道のうち、特定行政庁の指定を受けたものを2項道路という。", "a": true, "e": "正しい記述です。\n【根拠】法の施行時などに建物が立ち並んでいた幅員4m未満の道で、特定行政庁が指定したものです。\n【ひっかけ】原則として中心線から2m後退した線が道路の境界線とみなされます。"}, {"id": "tf:1e3cd8438a", "c": 5, "s": "問題5-4", "st": 1, "q": "防火地域内に耐火建築物等を建築する場合、指定建ぺい率に10％を加算することができる。", "a": true, "e": "正しい記述です。\n【根拠】指定建ぺい率80％の地域では、建ぺい率の制限がなくなります。\n【ひっかけ】準防火地域内の耐火・準耐火建築物等も10％加算されます。"}, {"id": "tf:67c3ca0a77", "c": 5, "s": "問題5-4", "st": 1, "q": "前面道路の幅員が12m以上の場合は、前面道路の幅員による容積率の制限を受けない。", "a": true, "e": "正しい記述です。\n【根拠】前面道路の幅員が12m未満の場合に、幅員×法定乗数との比較が必要になります。\n【ひっかけ】2つ以上の道路に面する場合は、幅員の広いほうで判定します。"}, {"id": "tf:47cc741a5b", "c": 5, "s": "問題5-4", "st": 1, "q": "第一種低層住居専用地域内では、原則として病院を建築することができない。", "a": true, "e": "正しい記述です。\n【根拠】第一種低層住居専用地域では、診療所は建てられますが、病院は建てられません。\n【ひっかけ】用途制限は地域ごとに細かく定められています。"}, {"id": "tf:b18c8699ed", "c": 5, "s": "問題5-5", "st": 2, "q": "相続により不動産を取得した場合には、不動産取得税が課される。", "a": false, "e": "誤りです。\n【根拠】相続や法人の合併による取得には、不動産取得税は課されません。\n【ひっかけ】贈与による取得には課されます。相続と贈与の違いが頻出です。"}, {"id": "tf:652fdec86b", "c": 5, "s": "問題5-5", "st": 1, "q": "相続による所有権移転登記の登録免許税の税率は、0.4％である。", "a": true, "e": "正しい記述です。\n【根拠】相続による所有権移転登記は0.4％です。\n【ひっかけ】贈与・売買による所有権移転登記は原則2％です（売買の土地は軽減税率あり）。"}, {"id": "tf:ccb9f76c96", "c": 5, "s": "問題5-5", "st": 1, "q": "不動産の売買契約書に収入印紙を貼り付けなかった場合、その契約は無効となる。", "a": false, "e": "誤りです。\n【根拠】印紙を貼らなくても、契約自体は有効です。ただし過怠税が課されます。\n【ひっかけ】契約の効力と税の問題を区別します。"}, {"id": "tf:7e3fc7f9ad", "c": 5, "s": "問題5-5", "st": 2, "q": "固定資産税は、毎年1月1日現在において固定資産課税台帳に所有者として登録されている者に対して課される。", "a": true, "e": "正しい記述です。\n【根拠】年の途中で売買しても、その年度の納税義務者は1月1日時点の所有者です。\n【ひっかけ】実務では日割りで精算することが多いですが、税法上の納税義務者は変わりません。"}, {"id": "tf:8d77c5fa2e", "c": 5, "s": "問題5-5", "st": 2, "q": "住宅用地のうち、住宅1戸あたり200㎡以下の部分については、固定資産税の課税標準が3分の1となる。", "a": false, "e": "誤りです。\n【根拠】小規模住宅用地（200㎡以下の部分）の固定資産税の課税標準は6分の1です。\n【ひっかけ】3分の1は、200㎡以下の部分の都市計画税、又は200㎡超の部分の固定資産税です。"}, {"id": "tf:de30d18065", "c": 5, "s": "問題5-5", "st": 1, "q": "都市計画税の制限税率は0.3％である。", "a": true, "e": "正しい記述です。\n【根拠】都市計画税は、原則として市街化区域内の土地・家屋に課税され、制限税率は0.3％です。\n【ひっかけ】固定資産税の標準税率1.4％と区別します。"}, {"id": "tf:5a466db4af", "c": 5, "s": "問題5-5", "st": 2, "q": "新築住宅を取得した場合、一定の要件を満たせば、不動産取得税の課税標準から1,200万円を控除することができる。", "a": true, "e": "正しい記述です。\n【根拠】床面積50㎡以上240㎡以下などの要件を満たす新築住宅は、1,200万円が控除されます。\n【ひっかけ】控除額は1戸あたりで、土地には別の軽減措置があります。"}, {"id": "tf:88e8fab3bb", "c": 5, "s": "問題5-5", "st": 1, "q": "固定資産税の納税義務者が、年の途中で不動産を売却した場合、その年度の固定資産税は売主と買主に法律上按分して課される。", "a": false, "e": "誤りです。\n【根拠】その年度の固定資産税は、1月1日現在の所有者（売主）に全額課税されます。\n【ひっかけ】売買契約で日割り精算するのは当事者間の取決めです。"}, {"id": "tf:366c3dfcd1", "c": 5, "s": "問題5-5", "st": 2, "q": "不動産取得税の課税標準は、原則として固定資産税評価額である。", "a": true, "e": "正しい記述です。\n【根拠】宅地は、課税標準を2分の1とする特例があります。\n【ひっかけ】実際の購入価格ではありません。"}, {"id": "tf:7ce42be344", "c": 5, "s": "問題5-5", "st": 2, "q": "抵当権設定登記の登録免許税の課税標準は、その不動産の固定資産税評価額である。", "a": false, "e": "誤りです。\n【根拠】抵当権設定登記の課税標準は、債権金額です。\n【ひっかけ】所有権の移転・保存登記は、固定資産税評価額が課税標準です。"}, {"id": "tf:2a5e0241c4", "c": 5, "s": "問題5-5", "st": 1, "q": "土地の取得に係る不動産取得税の税率は、特例により3％とされている。", "a": true, "e": "正しい記述です。\n【根拠】土地と住宅は3％、住宅以外の家屋は4％です。\n【ひっかけ】宅地は課税標準も2分の1になります。"}, {"id": "tf:1702f0ee71", "c": 5, "s": "問題5-5", "st": 2, "q": "宅地の譲渡には消費税が課されるが、建物の譲渡には消費税は課されない。", "a": false, "e": "誤りです。\n【根拠】土地の譲渡は非課税、建物の譲渡は課税です（事業者が行う場合）。\n【ひっかけ】個人が自宅を売却する場合は、事業として行うものではないため課税されません。"}, {"id": "tf:eb0a3aff0c", "c": 5, "s": "問題5-5", "st": 1, "q": "固定資産税は、原則として年4回に分けて納付する。", "a": true, "e": "正しい記述です。\n【根拠】市町村から送られる納税通知書で、4期に分けて納めます（一括納付も可）。\n【ひっかけ】固定資産税は賦課課税方式です。"}, {"id": "tf:337b0b050b", "c": 5, "s": "問題5-5", "st": 1, "q": "都市計画税は、原則として市街化調整区域内の土地・家屋に課される。", "a": false, "e": "誤りです。\n【根拠】都市計画税は、原則として市街化区域内の土地・家屋に課されます。\n【ひっかけ】制限税率は0.3％です。"}, {"id": "tf:a4efb075af", "c": 5, "s": "問題5-5", "st": 1, "q": "固定資産税の小規模住宅用地の特例は、賃貸アパートの敷地にも適用される。", "a": true, "e": "正しい記述です。\n【根拠】住宅の敷地であれば、自己の居住用に限らず適用されます。\n【ひっかけ】住宅1戸あたり200㎡以下の部分が小規模住宅用地です。"}, {"id": "tf:050e1bc1c7", "c": 5, "s": "問題5-5", "st": 1, "q": "不動産を贈与により取得した場合、不動産取得税は課されるが、登録免許税は課されない。", "a": false, "e": "誤りです。\n【根拠】贈与による所有権移転登記にも、登録免許税（原則2％）が課されます。\n【ひっかけ】相続による所有権移転登記は0.4％です。"}, {"id": "tf:0dd13b20e6", "c": 5, "s": "問題5-5", "st": 2, "q": "相続による不動産の取得には、登録免許税は課されない。", "a": false, "e": "誤りです。\n【根拠】相続による所有権移転登記にも、登録免許税（0.4％）が課されます。\n【ひっかけ】不動産取得税は、相続による取得には課されません。"}, {"id": "tf:8a735b7a11", "c": 5, "s": "問題5-5", "st": 1, "q": "固定資産税の税率は、全国一律で1.4％と定められている。", "a": false, "e": "誤りです。\n【根拠】1.4％は標準税率で、市町村が条例で異なる税率を定めることができます。\n【ひっかけ】都市計画税は、制限税率0.3％の範囲内で市町村が定めます。"}, {"id": "tf:5a36eddae6", "c": 5, "s": "問題5-5", "st": 1, "q": "固定資産税の一般住宅用地（住宅1戸あたり200㎡を超える部分）の課税標準は、価格の3分の1である。", "a": true, "e": "正しい記述です。\n【根拠】小規模住宅用地（200㎡以下の部分）は6分の1です。\n【ひっかけ】都市計画税は、それぞれ3分の2、3分の1です。"}, {"id": "tf:fe864a668c", "c": 5, "s": "問題5-5", "st": 1, "q": "不動産取得税は、不動産を取得したときに一度だけ課される税金である。", "a": true, "e": "正しい記述です。\n【根拠】不動産取得税は流通税で、取得時に1回課されます。\n【ひっかけ】固定資産税は、所有している間毎年課されます。"}, {"id": "tf:8647e7e26a", "c": 5, "s": "問題5-6", "st": 2, "q": "居住用財産を譲渡した場合の3,000万円特別控除は、譲渡した年の1月1日における所有期間が5年を超えていなければ適用を受けることができない。", "a": false, "e": "誤りです。\n【根拠】3,000万円特別控除には、所有期間の要件はありません。\n【ひっかけ】所有期間10年超が要件なのは、軽減税率の特例や買換え特例です。"}, {"id": "tf:2410996f40", "c": 5, "s": "問題5-6", "st": 1, "q": "居住用財産を配偶者に譲渡した場合には、居住用財産の3,000万円特別控除の適用を受けることができない。", "a": true, "e": "正しい記述です。\n【根拠】配偶者・直系血族・生計を一にする親族などへの譲渡は対象外です。\n【ひっかけ】兄弟姉妹でも、生計を一にしている場合は対象外です。"}, {"id": "tf:c01b5c7ddf", "c": 5, "s": "問題5-6", "st": 2, "q": "居住用財産の3,000万円特別控除と軽減税率の特例は、重ねて適用を受けることができる。", "a": true, "e": "正しい記述です。\n【根拠】3,000万円を控除した後の課税長期譲渡所得金額に、軽減税率を適用できます。\n【ひっかけ】3,000万円特別控除と買換え特例は選択適用で、併用できません。"}, {"id": "tf:59366950db", "c": 5, "s": "問題5-6", "st": 1, "q": "軽減税率の特例の適用を受ける場合、課税長期譲渡所得金額のうち6,000万円以下の部分の税率は、所得税・復興特別所得税・住民税を合わせて14.21％である。", "a": true, "e": "正しい記述です。\n【根拠】所得税・復興特別所得税10.21％、住民税4％、合計14.21％です。\n【ひっかけ】6,000万円を超える部分は通常の長期譲渡所得の税率（20.315％）です。"}, {"id": "tf:b7b368cc16", "c": 5, "s": "問題5-6", "st": 2, "q": "NOI利回りは、年間収入合計から諸経費を控除した純収益を、投資総額で除して求める。", "a": true, "e": "正しい記述です。\n【根拠】NOI利回り（純利回り）＝（年間収入合計－諸経費）÷投資総額×100です。\n【ひっかけ】表面利回りは、諸経費を差し引かずに計算します。"}, {"id": "tf:f1e563ce61", "c": 5, "s": "問題5-6", "st": 1, "q": "上場不動産投資信託（J-REIT）の分配金は、配当控除の適用を受けることができる。", "a": false, "e": "誤りです。\n【根拠】J-REITの分配金は配当所得ですが、配当控除の対象外です。\n【ひっかけ】J-REITは法人税が実質かからない仕組みのため、二重課税の調整（配当控除）がありません。"}, {"id": "tf:2700220caa", "c": 5, "s": "問題5-6", "st": 1, "q": "被相続人の居住用財産（空き家）に係る譲渡所得の特別控除の対象となる家屋は、1981年5月31日以前に建築されたものである。", "a": true, "e": "正しい記述です。\n【根拠】旧耐震基準の時期に建築された家屋（区分所有建物を除く）が対象です。\n【ひっかけ】相続人が3人以上の場合、1人あたりの控除額は2,000万円です。"}, {"id": "tf:641b5e0894", "c": 5, "s": "問題5-6", "st": 1, "q": "公共事業のために土地を収用された場合、譲渡益から最高3,000万円の特別控除を受けることができる。", "a": false, "e": "誤りです。\n【根拠】収用等の場合の特別控除は、最高5,000万円です。\n【ひっかけ】3,000万円は居住用財産の特別控除です。"}, {"id": "tf:e5b52fc0b8", "c": 5, "s": "問題5-6", "st": 2, "q": "等価交換方式による土地活用では、土地所有者が建設資金を負担する必要がない。", "a": true, "e": "正しい記述です。\n【根拠】土地を出資し、デベロッパーが建設資金を負担します。完成後、出資割合に応じて土地と建物の一部を取得します。\n【ひっかけ】事業受託方式は、土地所有者が資金を調達します。"}, {"id": "tf:db9297359c", "c": 5, "s": "問題5-6", "st": 1, "q": "建設協力金方式では、建物の所有者はテナントとなる。", "a": false, "e": "誤りです。\n【根拠】建設協力金方式では、テナントから預かった資金で土地所有者が建物を建て、建物の所有者は土地所有者です。\n【ひっかけ】土地所有者が建物を所有するため、相続税の評価で貸家建付地となります。"}, {"id": "tf:cf31cea963", "c": 5, "s": "問題5-6", "st": 2, "q": "土地を譲渡するために借家人に支払った立退料は、譲渡費用に含まれる。", "a": true, "e": "正しい記述です。\n【根拠】譲渡のために直接要した費用は、譲渡費用になります。\n【ひっかけ】仲介手数料や取壊し費用も譲渡費用です。"}, {"id": "tf:3189898c1a", "c": 5, "s": "問題5-6", "st": 1, "q": "不動産を譲渡した際に買主から受け取った固定資産税の精算金は、譲渡収入金額に含めない。", "a": false, "e": "誤りです。\n【根拠】固定資産税の精算金は、譲渡収入金額に含めます。\n【ひっかけ】納税義務者は1月1日の所有者のため、精算金は売買代金の一部とされます。"}, {"id": "tf:23c89c95e7", "c": 5, "s": "問題5-6", "st": 1, "q": "建物の取得費は、取得価額から減価償却費相当額を差し引いて求める。", "a": true, "e": "正しい記述です。\n【根拠】居住用建物でも、減価償却費相当額を差し引きます。\n【ひっかけ】土地は減価償却しません。"}, {"id": "tf:55baad6b0b", "c": 5, "s": "問題5-6", "st": 2, "q": "相続により取得した土地を譲渡した場合、その土地の所有期間は相続人が相続した日から計算する。", "a": false, "e": "誤りです。\n【根拠】相続で取得した資産は、被相続人の取得時期と取得費を引き継ぎます。\n【ひっかけ】そのため、相続後すぐに売っても長期譲渡所得になることがあります。"}, {"id": "tf:54c82639a5", "c": 5, "s": "問題5-6", "st": 1, "q": "居住用財産を譲渡して譲渡損失が生じた場合、一定の要件を満たせば、その損失を他の所得と損益通算し、控除しきれない損失を翌年以後3年間繰り越すことができる。", "a": true, "e": "正しい記述です。\n【根拠】居住用財産の買換え等の場合の譲渡損失、特定居住用財産の譲渡損失の特例です。\n【ひっかけ】土地・建物等の譲渡損失は、原則として損益通算できません。"}, {"id": "tf:f41b588408", "c": 5, "s": "問題5-6", "st": 1, "q": "居住用財産の3,000万円特別控除は、居住しなくなった日から3年を経過する日の属する年の12月31日までに譲渡しなければ、適用を受けられない。", "a": true, "e": "正しい記述です。\n【根拠】空き家にしてから時間がたちすぎると、適用を受けられません。\n【ひっかけ】建物を取り壊した場合は、取壊しから1年以内の契約などの要件があります。"}, {"id": "tf:bc22eda7d9", "c": 5, "s": "問題5-6", "st": 2, "q": "NPV法では、投資から得られる将来の収益の現在価値の合計が投資額を上回る場合、その投資は有利と判断される。", "a": true, "e": "正しい記述です。\n【根拠】NPV（正味現在価値）がプラスなら投資に値します。\n【ひっかけ】IRR法では、IRRが期待収益率を上回るかで判断します。"}, {"id": "tf:63b303d7fa", "c": 5, "s": "問題5-6", "st": 1, "q": "IRR（内部収益率）が投資家の期待収益率を下回る場合、その投資は有利と判断される。", "a": false, "e": "誤りです。\n【根拠】IRRが期待収益率を上回る場合に有利と判断されます。\n【ひっかけ】NPVがゼロになる割引率がIRRです。"}, {"id": "tf:fb1411a974", "c": 5, "s": "問題5-6", "st": 2, "q": "不動産投資で借入金の金利が投資の利回りより低い場合、借入れを利用することで自己資金に対する利回りを高めることができる。", "a": true, "e": "正しい記述です。\n【根拠】レバレッジ効果といいます。\n【ひっかけ】金利が利回りより高いと、逆に自己資金の利回りは下がります。"}, {"id": "tf:ae20e5c81d", "c": 5, "s": "問題5-6", "st": 2, "q": "不動産投資の表面利回りは、年間の賃料収入から諸経費を差し引いた純収益を投資総額で除して求める。", "a": false, "e": "誤りです。\n【根拠】表面利回りは、諸経費を差し引かない年間の賃料収入を投資総額で割ります。\n【ひっかけ】諸経費を差し引くのはNOI利回り（純利回り）です。"}, {"id": "tf:edda6f2dc4", "c": 5, "s": "問題5-6", "st": 1, "q": "事業受託方式による土地活用では、建設資金は土地所有者が調達する。", "a": true, "e": "正しい記述です。\n【根拠】デベロッパーに企画から管理まで任せますが、資金は土地所有者が負担します。\n【ひっかけ】等価交換方式は、土地所有者の資金負担がありません。"}, {"id": "tf:653eeccc22", "c": 5, "s": "問題5-6", "st": 1, "q": "定期借地権方式による土地活用では、土地所有者は建物の建設資金を負担しなければならない。", "a": false, "e": "誤りです。\n【根拠】定期借地権方式は土地を貸すだけなので、土地所有者に建設資金の負担はありません。\n【ひっかけ】期間満了後は、原則として更地で土地が返還されます。"}, {"id": "tf:a65807374d", "c": 5, "s": "問題5-6", "st": 2, "q": "土地・建物の譲渡所得が長期譲渡所得に該当するかどうかは、取得した日から譲渡した日までの所有期間で判定する。", "a": false, "e": "誤りです。\n【根拠】譲渡した年の1月1日における所有期間が5年を超えるかどうかで判定します。\n【ひっかけ】総合課税の譲渡所得（ゴルフ会員権など）は、譲渡日までの期間で判定します。"}, {"id": "tf:9433355b6d", "c": 5, "s": "問題5-6", "st": 2, "q": "居住用財産の3,000万円特別控除は、所有期間が10年以下の場合は適用を受けられない。", "a": false, "e": "誤りです。\n【根拠】3,000万円特別控除には、所有期間の要件はありません。\n【ひっかけ】所有期間10年超が要件なのは、軽減税率の特例です。"}, {"id": "tf:816c03ec4b", "c": 5, "s": "問題5-6", "st": 2, "q": "居住用財産の軽減税率の特例は、譲渡した年の1月1日における所有期間が10年を超えることが要件である。", "a": true, "e": "正しい記述です。\n【根拠】課税長期譲渡所得金額6,000万円以下の部分が14.21％になります。\n【ひっかけ】3,000万円特別控除と併用できます。"}, {"id": "tf:31cfa5fbb0", "c": 5, "s": "問題5-6", "st": 2, "q": "特定の居住用財産の買換え特例と、居住用財産の3,000万円特別控除は、併用することができる。", "a": false, "e": "誤りです。\n【根拠】買換え特例と3,000万円特別控除は選択適用です。\n【ひっかけ】3,000万円特別控除と軽減税率の特例は併用できます。"}, {"id": "tf:db3374188f", "c": 5, "s": "問題5-6", "st": 1, "q": "J-REITは、証券取引所に上場しており、上場株式と同様に市場価格で売買することができる。", "a": true, "e": "正しい記述です。\n【根拠】指値・成行注文ができ、少額から不動産に投資できます。\n【ひっかけ】分配金は配当所得ですが、配当控除は受けられません。"}, {"id": "tf:0a3bbe3019", "c": 5, "s": "問題5-6", "st": 1, "q": "等価交換方式では、土地所有者は土地を手放さずに、建物の全部を取得することができる。", "a": false, "e": "誤りです。\n【根拠】等価交換方式では、土地の一部（又は全部）を出資し、出資割合に応じて土地と建物の一部を取得します。\n【ひっかけ】建設資金を負担しない代わりに、土地の一部を手放します。"}, {"id": "tf:151d7d50a9", "c": 6, "s": "問題6-1", "st": 2, "q": "書面によらない贈与は、履行の終わった部分を除き、各当事者が解除することができる。", "a": true, "e": "正しい記述です。\n【根拠】書面によらない贈与は、履行が終わっていない部分に限り解除できます。\n【ひっかけ】書面による贈与は、原則として解除できません。"}, {"id": "tf:dcb7330aa9", "c": 6, "s": "問題6-1", "st": 2, "q": "死因贈与によって取得した財産は、贈与税の課税対象となる。", "a": false, "e": "誤りです。\n【根拠】死因贈与は贈与者の死亡で効力が生じるため、相続税の課税対象です。\n【ひっかけ】民法上は贈与ですが、課税は遺贈と同じく相続税です。"}, {"id": "tf:83f9223f40", "c": 6, "s": "問題6-1", "st": 2, "q": "贈与税の申告期間は、贈与を受けた年の翌年2月16日から3月15日までである。", "a": false, "e": "誤りです。\n【根拠】贈与税の申告期間は翌年2月1日から3月15日までです。\n【ひっかけ】所得税の確定申告（2月16日から）と混同させる出題です。"}, {"id": "tf:32d3031956", "c": 6, "s": "問題6-1", "st": 2, "q": "贈与税の配偶者控除の適用を受けるためには、贈与時点の婚姻期間が20年以上でなければならない。", "a": true, "e": "正しい記述です。\n【根拠】婚姻期間20年以上の配偶者から居住用不動産等の贈与を受けた場合に、最高2,000万円を控除できます。\n【ひっかけ】同じ配偶者からは一生に1回だけです。"}, {"id": "tf:c8e3ca1500", "c": 6, "s": "問題6-1", "st": 2, "q": "相続時精算課税の適用を受けた贈与財産は、贈与者の相続時に、相続時の価額で相続財産に加算される。", "a": false, "e": "誤りです。\n【根拠】加算されるのは贈与時の価額です（基礎控除110万円を差し引いた後）。\n【ひっかけ】値上がりが見込まれる財産を贈与すると有利になりうるのは、贈与時の価額で固定されるためです。"}, {"id": "tf:542ec794ec", "c": 6, "s": "問題6-1", "st": 2, "q": "相続時精算課税制度では、特別控除額2,500万円とは別に、毎年110万円の基礎控除がある。", "a": true, "e": "正しい記述です。\n【根拠】2024年1月1日以後の贈与から、年110万円の基礎控除が設けられました。基礎控除以下なら申告も不要です。\n【ひっかけ】暦年課税の基礎控除110万円とは別枠です。"}, {"id": "tf:22e4fbafda", "c": 6, "s": "問題6-1", "st": 1, "q": "相続時精算課税を選択した後でも、翌年以降の贈与については暦年課税に戻ることができる。", "a": false, "e": "誤りです。\n【根拠】一度選択すると、その贈与者からの贈与について暦年課税に戻ることはできません。\n【ひっかけ】他の贈与者（例えば母）からの贈与は、暦年課税のままにできます。"}, {"id": "tf:a536c81b81", "c": 6, "s": "問題6-1", "st": 1, "q": "相続時精算課税の贈与者は、贈与をした年の1月1日において60歳以上の父母又は祖父母である。", "a": true, "e": "正しい記述です。\n【根拠】受贈者は、その年の1月1日において18歳以上の子・孫（推定相続人である直系卑属又は孫）です。\n【ひっかけ】受贈者の年齢を20歳以上とする出題に注意します。"}, {"id": "tf:0f7dad43d4", "c": 6, "s": "問題6-1", "st": 1, "q": "贈与税の配偶者控除の適用を受けて納付すべき贈与税額がゼロとなる場合は、贈与税の申告書を提出する必要はない。", "a": false, "e": "誤りです。\n【根拠】贈与税の配偶者控除は、税額がゼロでも申告書の提出が必要です。\n【ひっかけ】相続時精算課税も、基礎控除（110万円）を超える贈与があれば申告が必要です。"}, {"id": "tf:9d3910e890", "c": 6, "s": "問題6-1", "st": 2, "q": "直系尊属から贈与を受けた、その年の1月1日において18歳以上の者は、暦年課税の贈与税の計算において特例税率を適用する。", "a": true, "e": "正しい記述です。\n【根拠】直系尊属（父母・祖父母など）からの贈与で受贈者が18歳以上なら、一般税率より低い特例税率です。\n【ひっかけ】兄弟姉妹や夫婦間の贈与は一般税率です。"}, {"id": "tf:9b0a1b39b8", "c": 6, "s": "問題6-1", "st": 1, "q": "定期贈与は、贈与者又は受贈者の死亡によって、その効力を失う。", "a": true, "e": "正しい記述です。\n【根拠】民法の規定です。\n【ひっかけ】毎年一定額を贈与する約束をすると、最初に全額の贈与があったとされる（定期金の贈与）場合もあります。"}, {"id": "tf:d841b0b4b3", "c": 6, "s": "問題6-1", "st": 2, "q": "負担付贈与により土地を取得した場合、その土地は相続税評価額（路線価など）で評価して、贈与税の課税価格を計算する。", "a": false, "e": "誤りです。\n【根拠】負担付贈与で取得した土地・建物は、通常の取引価額で評価します。\n【ひっかけ】課税価格は、通常の取引価額から負担額を差し引いた額です。"}, {"id": "tf:5b8ab1a7cd", "c": 6, "s": "問題6-1", "st": 2, "q": "個人から著しく低い価額で財産を譲り受けた場合、時価との差額は贈与により取得したものとみなされる。", "a": true, "e": "正しい記述です。\n【根拠】低額譲受のみなし贈与です。\n【ひっかけ】法人から低額で譲り受けた場合は、所得税（一時所得や給与所得）の対象です。"}, {"id": "tf:07a47173a4", "c": 6, "s": "問題6-1", "st": 1, "q": "親から借金を免除してもらった場合、免除を受けた金額は贈与税の課税対象となる。", "a": true, "e": "正しい記述です。\n【根拠】債務免除益は、みなし贈与財産です。\n【ひっかけ】資力を失って債務を弁済することが困難な場合などは、課税されないことがあります。"}, {"id": "tf:b4d6c0e7dd", "c": 6, "s": "問題6-1", "st": 2, "q": "扶養義務者から生活費や教育費として受けた贈与は、どのような使い方をしても贈与税は課されない。", "a": false, "e": "誤りです。\n【根拠】必要な都度、生活費や教育費に直接充てるものだけが非課税です。\n【ひっかけ】預金したり投資に回したりした分は、贈与税の対象になります。"}, {"id": "tf:4d8d5ed63b", "c": 6, "s": "問題6-1", "st": 1, "q": "離婚に伴う財産分与として受け取った財産には、原則として贈与税は課されない。", "a": true, "e": "正しい記述です。\n【根拠】夫婦の財産の清算などの性格があるためです。\n【ひっかけ】過当な部分や、贈与税を免れるための離婚と認められる場合は課税されます。"}, {"id": "tf:6a0b809c02", "c": 6, "s": "問題6-1", "st": 2, "q": "贈与税の配偶者控除における婚姻期間に1年未満の端数がある場合は、1年に切り上げて計算する。", "a": false, "e": "誤りです。\n【根拠】婚姻期間の1年未満の端数は切り捨てます。19年11か月なら19年で、適用を受けられません。\n【ひっかけ】退職所得控除の勤続年数（切上げ）と区別します。"}, {"id": "tf:e7bf56cc9a", "c": 6, "s": "問題6-1", "st": 1, "q": "贈与税の配偶者控除は、居住用不動産を取得するための金銭の贈与にも適用される。", "a": true, "e": "正しい記述です。\n【根拠】居住用不動産そのものだけでなく、その取得資金の贈与も対象です。\n【ひっかけ】翌年3月15日までに居住することが必要です。"}, {"id": "tf:357be785f7", "c": 6, "s": "問題6-1", "st": 2, "q": "住宅取得等資金の贈与の非課税の特例の受贈者は、贈与を受けた年の1月1日において18歳以上で、その年の合計所得金額が2,000万円以下の者である。", "a": true, "e": "正しい記述です。\n【根拠】床面積40㎡以上50㎡未満の場合は、合計所得金額1,000万円以下です。\n【ひっかけ】贈与者は直系尊属に限られます。"}, {"id": "tf:355fe460db", "c": 6, "s": "問題6-1", "st": 1, "q": "住宅取得等資金の贈与の非課税の特例は、相続時精算課税と併用することができない。", "a": false, "e": "誤りです。\n【根拠】暦年課税・相続時精算課税のどちらとも併用できます。\n【ひっかけ】併用すれば、非課税額を超える部分を精算課税の特別控除で吸収できます。"}, {"id": "tf:74692000d8", "c": 6, "s": "問題6-1", "st": 1, "q": "相続時精算課税を選択しようとする受贈者は、最初の贈与を受けた年の翌年2月1日から3月15日までに、相続時精算課税選択届出書を提出しなければならない。", "a": true, "e": "正しい記述です。\n【根拠】期限までに提出しないと、暦年課税となります。\n【ひっかけ】選択すると、その贈与者からの贈与は撤回できません。"}, {"id": "tf:1108f976c0", "c": 6, "s": "問題6-1", "st": 2, "q": "贈与税は、延納や物納によって納付することができる。", "a": false, "e": "誤りです。\n【根拠】贈与税の延納（最長5年）はできますが、物納はできません。\n【ひっかけ】相続税は延納・物納ともにできます。"}, {"id": "tf:e81df5d7ef", "c": 6, "s": "問題6-1", "st": 2, "q": "贈与税の納税義務者は、原則として財産を贈与した者である。", "a": false, "e": "誤りです。\n【根拠】贈与税の納税義務者は、財産をもらった受贈者です。\n【ひっかけ】暦年課税の基礎控除110万円も、受贈者1人あたりです。"}, {"id": "tf:2d740eb7e6", "c": 6, "s": "問題6-1", "st": 2, "q": "暦年課税の基礎控除110万円は、贈与者1人ごとに適用される。", "a": false, "e": "誤りです。\n【根拠】基礎控除は受贈者1人あたり年110万円です。父と母からそれぞれ110万円もらうと、合計220万円から110万円を控除します。\n【ひっかけ】相続時精算課税の基礎控除（110万円）は、暦年課税とは別枠です。"}, {"id": "tf:06952bd1fb", "c": 6, "s": "問題6-1", "st": 2, "q": "書面による贈与は、履行前であれば各当事者が自由に解除することができる。", "a": false, "e": "誤りです。\n【根拠】書面による贈与は、原則として解除できません。\n【ひっかけ】書面によらない贈与は、履行の終わっていない部分を解除できます。"}, {"id": "tf:0c71df23ee", "c": 6, "s": "問題6-1", "st": 1, "q": "死因贈与は、贈与者の死亡によって効力を生じる贈与であり、遺贈に関する規定が準用される。", "a": true, "e": "正しい記述です。\n【根拠】課税上は、相続税の対象です。\n【ひっかけ】遺言（遺贈）と違い、贈与者と受贈者の契約で成立します。"}, {"id": "tf:b27e6d6b19", "c": 6, "s": "問題6-1", "st": 1, "q": "贈与税の申告書は、贈与者の住所地を所轄する税務署長に提出する。", "a": false, "e": "誤りです。\n【根拠】贈与税の申告書は、受贈者の住所地を所轄する税務署長に提出します。\n【ひっかけ】相続税の申告書は、被相続人の住所地の税務署長に提出します。"}, {"id": "tf:68ede15e9f", "c": 6, "s": "問題6-1", "st": 1, "q": "贈与税の配偶者控除の適用を受けた財産は、その後に贈与者が死亡した場合、控除額に相当する部分は生前贈与加算の対象とならない。", "a": true, "e": "正しい記述です。\n【根拠】配偶者控除の適用を受けた部分（最高2,000万円）は、生前贈与加算の対象外です。\n【ひっかけ】基礎控除の110万円部分は加算の対象になりえます。"}, {"id": "tf:4853984120", "c": 6, "s": "問題6-1", "st": 2, "q": "相続時精算課税の特別控除額2,500万円は、毎年2,500万円まで適用することができる。", "a": false, "e": "誤りです。\n【根拠】特別控除額2,500万円は、贈与者ごとの累計額です。毎年110万円の基礎控除は別にあります。\n【ひっかけ】限度額を超えた部分には一律20％の贈与税がかかります。"}, {"id": "tf:0f6dbe32c0", "c": 6, "s": "問題6-1", "st": 2, "q": "相続時精算課税の適用を受けた贈与財産は、贈与者の相続時に、基礎控除後の贈与時の価額で相続財産に加算される。", "a": true, "e": "正しい記述です。\n【根拠】相続時の価額ではなく、贈与時の価額で加算されます。\n【ひっかけ】値上がりが見込まれる財産の贈与に向くとされます。"}, {"id": "tf:416785bdff", "c": 6, "s": "問題6-1", "st": 2, "q": "住宅取得等資金の贈与の非課税の特例は、配偶者からの贈与にも適用される。", "a": false, "e": "誤りです。\n【根拠】贈与者は受贈者の直系尊属（父母・祖父母など）に限られます。\n【ひっかけ】配偶者からの居住用不動産の贈与には、贈与税の配偶者控除があります。"}, {"id": "tf:3896437014", "c": 6, "s": "問題6-1", "st": 2, "q": "暦年課税の贈与税の税率は、直系尊属から贈与を受けた18歳以上の者とそれ以外の者とで異なる。", "a": true, "e": "正しい記述です。\n【根拠】直系尊属から18歳以上の者への贈与は特例税率（一般税率より低い）です。\n【ひっかけ】夫婦間や兄弟姉妹間の贈与は一般税率です。"}, {"id": "tf:1d85ffbb42", "c": 6, "s": "問題6-2", "st": 2, "q": "被相続人の配偶者と兄が相続人である場合、配偶者の法定相続分は3分の2である。", "a": false, "e": "誤りです。\n【根拠】配偶者と兄弟姉妹が相続人の場合、配偶者は4分の3、兄弟姉妹は4分の1です。\n【ひっかけ】3分の2は、配偶者と直系尊属が相続人の場合です。"}, {"id": "tf:7c4e05b600", "c": 6, "s": "問題6-2", "st": 2, "q": "相続を放棄した者の子は、放棄した者を代襲して相続人となる。", "a": false, "e": "誤りです。\n【根拠】相続放棄は代襲原因に当たらないため、放棄した者の子は代襲相続しません。\n【ひっかけ】代襲原因は、死亡・欠格・廃除の3つです。"}, {"id": "tf:8a17866229", "c": 6, "s": "問題6-2", "st": 2, "q": "兄弟姉妹が相続人となる場合の代襲相続は、兄弟姉妹の子（おい・めい）までに限られる。", "a": true, "e": "正しい記述です。\n【根拠】兄弟姉妹の代襲は1代限りで、おい・めいの子は代襲しません。\n【ひっかけ】子の代襲は、孫、ひ孫と続きます（再代襲）。"}, {"id": "tf:da2067c49d", "c": 6, "s": "問題6-2", "st": 2, "q": "相続の放棄をするためには、相続人全員が共同して家庭裁判所に申述しなければならない。", "a": false, "e": "誤りです。\n【根拠】相続の放棄は、各相続人が単独でできます。\n【ひっかけ】全員が共同して行う必要があるのは限定承認です。"}, {"id": "tf:b0516798f2", "c": 6, "s": "問題6-2", "st": 2, "q": "法務局で保管されている自筆証書遺言は、家庭裁判所の検認が不要である。", "a": true, "e": "正しい記述です。\n【根拠】自筆証書遺言書保管制度を利用した遺言書は、検認が不要です。\n【ひっかけ】公正証書遺言も検認不要です。法務局に保管していない自筆証書遺言は検認が必要です。"}, {"id": "tf:a8a47ef8b6", "c": 6, "s": "問題6-2", "st": 1, "q": "自筆証書遺言に添付する財産目録は、パソコンで作成することはできず、全文を自書しなければならない。", "a": false, "e": "誤りです。\n【根拠】財産目録は、パソコンでの作成や通帳のコピーの添付もできます。各ページに署名・押印が必要です。\n【ひっかけ】本文・日付・氏名は自書が必要です。"}, {"id": "tf:be2b331054", "c": 6, "s": "問題6-2", "st": 2, "q": "被相続人の兄弟姉妹には、遺留分が認められていない。", "a": true, "e": "正しい記述です。\n【根拠】遺留分権利者は、兄弟姉妹以外の相続人（配偶者・子・直系尊属）です。\n【ひっかけ】兄弟姉妹に財産を渡したくない場合は、遺言が特に有効です。"}, {"id": "tf:1edaa1faa1", "c": 6, "s": "問題6-2", "st": 2, "q": "相続人が被相続人の父母のみである場合、遺留分全体の割合は2分の1である。", "a": false, "e": "誤りです。\n【根拠】直系尊属のみが相続人の場合、遺留分全体の割合は3分の1です。\n【ひっかけ】それ以外の場合は2分の1です。"}, {"id": "tf:60fc82ac8a", "c": 6, "s": "問題6-2", "st": 1, "q": "相続開始時に胎児であった者は、相続については既に生まれたものとみなされる。", "a": true, "e": "正しい記述です。\n【根拠】胎児にも相続権があります（死産の場合を除く）。\n【ひっかけ】相続税の申告でも、胎児が生まれたものとして計算する場合があります。"}, {"id": "tf:476bc31f5f", "c": 6, "s": "問題6-2", "st": 2, "q": "普通養子縁組をした養子は、実父母との親族関係が終了するため、実父母の相続人とはならない。", "a": false, "e": "誤りです。\n【根拠】普通養子は実父母との関係が続き、実父母と養父母の両方の相続人となります。\n【ひっかけ】実父母との関係が終了するのは特別養子です。"}, {"id": "tf:c056a0923b", "c": 6, "s": "問題6-2", "st": 1, "q": "遺言は、遺言の方式に従えば、いつでもその全部又は一部を撤回することができる。", "a": true, "e": "正しい記述です。\n【根拠】遺言者は、いつでも遺言を撤回できます。前の遺言と抵触する遺言を作ると、その部分は撤回したものとみなされます。\n【ひっかけ】公正証書遺言を、自筆証書遺言で撤回することもできます。"}, {"id": "tf:399f43592f", "c": 6, "s": "問題6-2", "st": 1, "q": "秘密証書遺言は、証人2人以上の立会いが必要であり、家庭裁判所の検認も必要である。", "a": true, "e": "正しい記述です。\n【根拠】秘密証書遺言は、公証人と証人2人以上の前に提出して作成し、検認が必要です。\n【ひっかけ】公正証書遺言は検認が不要です。"}, {"id": "tf:292f50d0b5", "c": 6, "s": "問題6-2", "st": 2, "q": "被相続人の内縁の配偶者は、法定相続人とならない。", "a": true, "e": "正しい記述です。\n【根拠】法律上の婚姻関係にない配偶者には相続権がありません。\n【ひっかけ】特別縁故者として財産分与を受けられる場合はあります。"}, {"id": "tf:c9744f2fe6", "c": 6, "s": "問題6-2", "st": 2, "q": "被相続人の嫡出でない子の法定相続分は、嫡出子の法定相続分の2分の1である。", "a": false, "e": "誤りです。\n【根拠】2013年の民法改正で、嫡出でない子の相続分は嫡出子と同じになりました。\n【ひっかけ】父母の一方だけを同じくする兄弟姉妹の相続分は、双方を同じくする兄弟姉妹の2分の1です。"}, {"id": "tf:d74ea30061", "c": 6, "s": "問題6-2", "st": 1, "q": "相続人の廃除は、被相続人の請求又は遺言に基づいて、家庭裁判所が決定する。", "a": true, "e": "正しい記述です。\n【根拠】被相続人を虐待した場合などが対象です。廃除の対象は遺留分を有する推定相続人です。\n【ひっかけ】欠格は手続なしで当然に相続権を失います。"}, {"id": "tf:a1fdf467ab", "c": 6, "s": "問題6-2", "st": 2, "q": "相続人が相続財産の一部を売却した場合、単純承認したものとみなされる。", "a": true, "e": "正しい記述です。\n【根拠】相続財産を処分すると、単純承認とみなされ、相続放棄ができなくなります。\n【ひっかけ】3か月以内に限定承認・放棄をしなかった場合も単純承認とみなされます。"}, {"id": "tf:8a8a67a39f", "c": 6, "s": "問題6-2", "st": 1, "q": "一度家庭裁判所に受理された相続の放棄は、3か月以内であれば撤回することができる。", "a": false, "e": "誤りです。\n【根拠】相続の放棄は、受理された後は撤回できません。\n【ひっかけ】詐欺・強迫などによる場合は取り消せることがあります。"}, {"id": "tf:1d9dd714e7", "c": 6, "s": "問題6-2", "st": 1, "q": "遺産分割協議が成立した後でも、相続人全員の合意があれば、協議をやり直すことができる。", "a": true, "e": "正しい記述です。\n【根拠】民法上は全員の合意でやり直せます。\n【ひっかけ】やり直しで財産を移すと、贈与税や譲渡所得の課税関係が生じることがあります。"}, {"id": "tf:19401e4178", "c": 6, "s": "問題6-2", "st": 1, "q": "遺産分割協議がまとまらない場合は、家庭裁判所の調停や審判によって分割する。", "a": true, "e": "正しい記述です。\n【根拠】協議分割、調停分割、審判分割の順に進みます。\n【ひっかけ】遺言で分割方法が指定されていれば、それに従います（指定分割）。"}, {"id": "tf:567cbd7b8a", "c": 6, "s": "問題6-2", "st": 1, "q": "相続人は、遺産分割前であっても、1つの金融機関から150万円を上限に、相続預金の一定額の払戻しを受けることができる。", "a": true, "e": "正しい記述です。\n【根拠】葬儀費用などの支払に充てられるようにする制度です。\n【ひっかけ】上限は、相続開始時の預金額の3分の1に法定相続分を掛けた額と150万円のいずれか低い額です。"}, {"id": "tf:9a67f844ef", "c": 6, "s": "問題6-2", "st": 1, "q": "遺言は、15歳以上であれば、法定代理人の同意なしにすることができる。", "a": true, "e": "正しい記述です。\n【根拠】遺言能力は15歳以上にあります。\n【ひっかけ】2人以上の者が同じ証書で遺言をする共同遺言は禁止されています。"}, {"id": "tf:8d78722595", "c": 6, "s": "問題6-2", "st": 2, "q": "推定相続人は、公正証書遺言の証人になることができる。", "a": false, "e": "誤りです。\n【根拠】推定相続人・受遺者とその配偶者・直系血族は、証人になれません。\n【ひっかけ】FPや弁護士は証人になれます。"}, {"id": "tf:7a65efff27", "c": 6, "s": "問題6-2", "st": 2, "q": "相続開始前に遺留分を放棄するには、家庭裁判所の許可が必要である。", "a": true, "e": "正しい記述です。\n【根拠】生前の遺留分の放棄には家庭裁判所の許可が必要です。相続開始後は自由に放棄できます。\n【ひっかけ】遺留分を放棄しても、相続人の地位は失いません（相続放棄とは別）。"}, {"id": "tf:2cce9b6276", "c": 6, "s": "問題6-2", "st": 1, "q": "遺留分侵害額請求は、侵害された額に相当する金銭の支払を請求するものである。", "a": true, "e": "正しい記述です。\n【根拠】2019年の改正で、遺留分減殺請求（物の返還）から金銭請求に変わりました。\n【ひっかけ】請求権は、侵害を知った時から1年、相続開始から10年で消滅します。"}, {"id": "tf:e7441d1d6a", "c": 6, "s": "問題6-2", "st": 1, "q": "被相続人の事業に関する労務の提供や療養看護などにより、財産の維持・増加に特別の寄与をした相続人は、寄与分を主張できる。", "a": true, "e": "正しい記述です。\n【根拠】寄与分は相続人に認められます。\n【ひっかけ】相続人以外の親族は、特別寄与料を請求できます。"}, {"id": "tf:39e2c02df6", "c": 6, "s": "問題6-2", "st": 1, "q": "配偶者短期居住権により、被相続人の建物に無償で住んでいた配偶者は、最低6か月間はその建物に無償で住み続けることができる。", "a": true, "e": "正しい記述です。\n【根拠】登記がなくても当然に認められる権利です。\n【ひっかけ】配偶者居住権（原則終身）は、遺産分割や遺言で取得します。"}, {"id": "tf:b66ffb8f2d", "c": 6, "s": "問題6-2", "st": 2, "q": "被相続人の子が相続を放棄した場合、その子の子（被相続人の孫）が代襲相続人となる。", "a": false, "e": "誤りです。\n【根拠】相続放棄は代襲原因ではないため、放棄した者の子は代襲しません。\n【ひっかけ】代襲原因は死亡・欠格・廃除です。"}, {"id": "tf:02574966c1", "c": 6, "s": "問題6-2", "st": 2, "q": "被相続人に子も直系尊属もいない場合、配偶者と兄弟姉妹が相続人となる。", "a": true, "e": "正しい記述です。\n【根拠】配偶者は常に相続人で、第3順位の兄弟姉妹と共同で相続します。\n【ひっかけ】法定相続分は配偶者4分の3、兄弟姉妹4分の1です。"}, {"id": "tf:897539c888", "c": 6, "s": "問題6-2", "st": 2, "q": "特別養子縁組が成立した養子は、実父母の相続人にもなる。", "a": false, "e": "誤りです。\n【根拠】特別養子は実父母との親族関係が終了するため、実父母の相続人になりません。\n【ひっかけ】普通養子は、実父母と養父母の両方の相続人になります。"}, {"id": "tf:a19d3281bf", "c": 6, "s": "問題6-2", "st": 2, "q": "限定承認は、相続人のうち1人だけでも行うことができる。", "a": false, "e": "誤りです。\n【根拠】限定承認は、相続人全員が共同して行わなければなりません。\n【ひっかけ】相続の放棄は単独でできます。"}, {"id": "tf:cc4ce30f42", "c": 6, "s": "問題6-2", "st": 1, "q": "自筆証書遺言は、遺言者が全文・日付・氏名を自書し、押印しなければならない。", "a": true, "e": "正しい記述です。\n【根拠】財産目録はパソコンで作成できますが、各ページに署名・押印が必要です。\n【ひっかけ】日付を「吉日」とした遺言は無効です。"}, {"id": "tf:1579312c78", "c": 6, "s": "問題6-2", "st": 2, "q": "公正証書遺言は、家庭裁判所の検認が必要である。", "a": false, "e": "誤りです。\n【根拠】公正証書遺言は検認が不要です。\n【ひっかけ】検認が必要なのは、法務局に保管していない自筆証書遺言と秘密証書遺言です。"}, {"id": "tf:ca78f577ec", "c": 6, "s": "問題6-2", "st": 2, "q": "兄弟姉妹にも遺留分が認められている。", "a": false, "e": "誤りです。\n【根拠】兄弟姉妹には遺留分がありません。\n【ひっかけ】遺留分権利者は、配偶者・子（代襲相続人を含む）・直系尊属です。"}, {"id": "tf:6b09add7a8", "c": 6, "s": "問題6-2", "st": 2, "q": "相続人が配偶者と子の場合、遺留分全体の割合は相続財産の2分の1である。", "a": true, "e": "正しい記述です。\n【根拠】直系尊属だけが相続人の場合は3分の1です。\n【ひっかけ】各人の遺留分は、全体の割合に法定相続分を掛けて求めます。"}, {"id": "tf:bcadd8038a", "c": 6, "s": "問題6-3", "st": 2, "q": "相続人が受け取った死亡保険金のうち、500万円に法定相続人の数を乗じた金額までは、相続税が非課税となる。", "a": true, "e": "正しい記述です。\n【根拠】死亡保険金・死亡退職金それぞれについて、500万円×法定相続人の数が非課税です。\n【ひっかけ】相続を放棄した者が受け取った保険金には、非課税金額の適用はありません。"}, {"id": "tf:6504e69c79", "c": 6, "s": "問題6-3", "st": 2, "q": "相続税の計算上、相続を放棄した者は法定相続人の数に含めない。", "a": false, "e": "誤りです。\n【根拠】遺産に係る基礎控除額などの計算では、相続を放棄した者も法定相続人の数に含めます。\n【ひっかけ】放棄がなかったものとして数えます。"}, {"id": "tf:8fe737fbb8", "c": 6, "s": "問題6-3", "st": 2, "q": "被相続人に実子がいる場合、相続税の計算上、法定相続人の数に算入できる養子の数は1人までである。", "a": true, "e": "正しい記述です。\n【根拠】実子がいる場合は1人、実子がいない場合は2人までです。\n【ひっかけ】特別養子や配偶者の連れ子養子は、実子とみなされます。"}, {"id": "tf:ca820d2b70", "c": 6, "s": "問題6-3", "st": 2, "q": "法定相続人が配偶者と子2人の場合、遺産に係る基礎控除額は4,800万円である。", "a": true, "e": "正しい記述です。\n【根拠】3,000万円＋600万円×3人＝4,800万円です。\n【ひっかけ】「1,000万円×人数」としていたのは2014年以前の制度です。"}, {"id": "tf:a1f0b86f3d", "c": 6, "s": "問題6-3", "st": 2, "q": "葬式の際に受け取った香典の返礼費用（香典返し）は、債務控除の対象となる葬式費用に含まれる。", "a": false, "e": "誤りです。\n【根拠】香典返しの費用や法要（初七日・四十九日など）の費用は、葬式費用として控除できません。\n【ひっかけ】通夜・本葬の費用や火葬費用などは控除できます。"}, {"id": "tf:161bf1e06b", "c": 6, "s": "問題6-3", "st": 2, "q": "被相続人の孫（代襲相続人ではない）が遺贈により財産を取得した場合、その者の相続税額は2割加算の対象となる。", "a": true, "e": "正しい記述です。\n【根拠】配偶者と1親等の血族（代襲相続人の孫を含む）以外の者は、2割加算の対象です。\n【ひっかけ】代襲相続人となった孫は2割加算の対象外です。"}, {"id": "tf:e8edf354e9", "c": 6, "s": "問題6-3", "st": 2, "q": "配偶者に対する相続税額の軽減の適用を受けると、配偶者が取得した財産が1億円又は配偶者の法定相続分相当額のいずれか多い金額までは相続税がかからない。", "a": false, "e": "誤りです。\n【根拠】金額は1億6,000万円又は配偶者の法定相続分相当額のいずれか多い金額です。\n【ひっかけ】適用を受けるには、税額がゼロになる場合でも申告が必要です。"}, {"id": "tf:e610093c27", "c": 6, "s": "問題6-3", "st": 1, "q": "暦年課税による贈与財産の相続財産への加算期間は、相続開始前7年以内である。", "a": true, "e": "正しい記述です。\n【根拠】2024年1月1日以後の贈与から、加算期間が3年から7年に段階的に延長されています。\n【ひっかけ】延長された4年間に受けた贈与は、合計100万円まで加算されません。"}, {"id": "tf:9eaf6fef61", "c": 6, "s": "問題6-3", "st": 2, "q": "配偶者に対する相続税額の軽減の適用により納付すべき相続税額がゼロとなる場合でも、相続税の申告書を提出する必要がある。", "a": true, "e": "正しい記述です。\n【根拠】配偶者の税額軽減や小規模宅地等の特例は、申告することが適用の要件です。\n【ひっかけ】「税額がゼロなら申告不要」とする出題に注意します。"}, {"id": "tf:2c8652f151", "c": 6, "s": "問題6-3", "st": 2, "q": "被相続人の死亡後3年以内に支給が確定した死亡退職金は、相続税の課税対象となる。", "a": true, "e": "正しい記述です。\n【根拠】みなし相続財産として、相続税の対象です（非課税金額あり）。\n【ひっかけ】3年を経過した後に確定したものは、受け取った遺族の一時所得です。"}, {"id": "tf:75b7057ea4", "c": 6, "s": "問題6-3", "st": 2, "q": "被相続人の死亡が業務上の死亡である場合、弔慰金のうち普通給与の6か月分までは相続税の課税対象とならない。", "a": false, "e": "誤りです。\n【根拠】業務上の死亡は普通給与の3年分まで、業務外の死亡は6か月分までが非課税です。\n【ひっかけ】超える部分は退職手当金等として扱われます。"}, {"id": "tf:b1610924a2", "c": 6, "s": "問題6-3", "st": 2, "q": "墓地や仏壇などの祭祀財産は、相続税の非課税財産である。", "a": true, "e": "正しい記述です。\n【根拠】ただし、投資目的の骨とう品などは課税されます。\n【ひっかけ】生前に墓地を購入して未払いのまま死亡した場合、その未払金は債務控除できません。"}, {"id": "tf:51895f84bf", "c": 6, "s": "問題6-3", "st": 1, "q": "相続により取得した財産を、相続税の申告期限までに国に寄付した場合、その財産は相続税の課税対象とならない。", "a": true, "e": "正しい記述です。\n【根拠】国・地方公共団体や一定の公益法人に寄付した財産は非課税です。\n【ひっかけ】申告期限までに寄付することが要件です。"}, {"id": "tf:df80148a0b", "c": 6, "s": "問題6-3", "st": 1, "q": "被相続人に課される固定資産税で、相続開始時に未納のものは、債務控除の対象となる。", "a": true, "e": "正しい記述です。\n【根拠】被相続人の未払いの税金は控除できます。\n【ひっかけ】被相続人の準確定申告による所得税も控除できます。"}, {"id": "tf:c65debaf3e", "c": 6, "s": "問題6-3", "st": 1, "q": "通夜や本葬の費用、お布施などは、葬式費用として相続税の課税価格から控除することができる。", "a": true, "e": "正しい記述です。\n【根拠】香典返し、法要（初七日・四十九日など）の費用は控除できません。\n【ひっかけ】墓石の購入費も控除できません。"}, {"id": "tf:0dc7752fd2", "c": 6, "s": "問題6-3", "st": 1, "q": "相続を放棄した者は、自ら負担した葬式費用であっても、相続税の課税価格から控除することはできない。", "a": false, "e": "誤りです。\n【根拠】相続を放棄した者でも、遺贈などで財産を取得し、葬式費用を実際に負担した場合は控除できます。\n【ひっかけ】被相続人の債務は控除できません。"}, {"id": "tf:3e3786eca7", "c": 6, "s": "問題6-3", "st": 1, "q": "相次相続控除は、今回の相続開始前10年以内に被相続人が相続により財産を取得し、相続税を課されていた場合に適用される。", "a": true, "e": "正しい記述です。\n【根拠】短期間に続けて相続があった場合の税負担を軽減します。\n【ひっかけ】相続人であることが要件です。"}, {"id": "tf:043ee9d8e5", "c": 6, "s": "問題6-3", "st": 2, "q": "被相続人の養子となった孫（代襲相続人ではない）が相続により財産を取得した場合、その者の相続税額は2割加算の対象となる。", "a": true, "e": "正しい記述です。\n【根拠】孫養子は1親等の法定血族ですが、代襲相続人でなければ2割加算の対象です。\n【ひっかけ】代襲相続人となった孫は対象外です。"}, {"id": "tf:28011b6ac9", "c": 6, "s": "問題6-3", "st": 1, "q": "配偶者に対する相続税額の軽減は、内縁の配偶者にも適用される。", "a": false, "e": "誤りです。\n【根拠】法律上の婚姻関係にある配偶者だけが対象です。\n【ひっかけ】婚姻期間の長さは問いません。"}, {"id": "tf:ef084096d9", "c": 6, "s": "問題6-3", "st": 1, "q": "相続税の申告期限までに遺産が分割されていない場合でも、申告期限から3年以内に分割されれば、配偶者に対する相続税額の軽減の適用を受けることができる。", "a": true, "e": "正しい記述です。\n【根拠】申告書に「申告期限後3年以内の分割見込書」を添付しておく必要があります。\n【ひっかけ】小規模宅地等の特例も同様です。"}, {"id": "tf:5d44e5636e", "c": 6, "s": "問題6-3", "st": 2, "q": "相続税の総額は、課税遺産総額を各法定相続人が法定相続分どおりに取得したものとして計算する。", "a": true, "e": "正しい記述です。\n【根拠】実際の分割割合に関係なく、相続税の総額は同じになります。\n【ひっかけ】相続税の総額を、実際の取得割合で各人に按分します。"}, {"id": "tf:f2c9cf059e", "c": 6, "s": "問題6-3", "st": 2, "q": "暦年課税による生前贈与加算は、相続や遺贈により財産を取得しなかった者が受けた贈与についても適用される。", "a": false, "e": "誤りです。\n【根拠】生前贈与加算は、相続や遺贈により財産を取得した者が受けた贈与に限られます。\n【ひっかけ】財産を取得しない孫への贈与は、原則として加算されません。"}, {"id": "tf:cc69085d09", "c": 6, "s": "問題6-3", "st": 1, "q": "生前贈与加算の対象となった贈与財産について課された贈与税額は、相続税額から控除することができる。", "a": true, "e": "正しい記述です。\n【根拠】二重課税を防ぐための贈与税額控除です。\n【ひっかけ】暦年課税の贈与税額は控除しきれなくても還付されません。相続時精算課税の贈与税額は還付されます。"}, {"id": "tf:638ab963d8", "c": 6, "s": "問題6-3", "st": 2, "q": "相続人が受け取った生命保険金の非課税金額は、500万円に相続人の数（相続を放棄した者を除く）を乗じた額である。", "a": false, "e": "誤りです。\n【根拠】非課税金額の計算上の「法定相続人の数」には、相続を放棄した者も含めます。\n【ひっかけ】ただし、放棄した者が受け取った保険金には非課税の適用はありません。"}, {"id": "tf:56980569fb", "c": 6, "s": "問題6-3", "st": 1, "q": "法定相続人が配偶者と子3人の場合、遺産に係る基礎控除額は5,400万円である。", "a": true, "e": "正しい記述です。\n【根拠】3,000万円＋600万円×4人＝5,400万円です。\n【ひっかけ】生命保険金の非課税金額は500万円×4人＝2,000万円です。"}, {"id": "tf:cfb5309654", "c": 6, "s": "問題6-3", "st": 2, "q": "被相続人に実子がなく、養子が3人いる場合、相続税の計算上、法定相続人の数に算入できる養子の数は3人である。", "a": false, "e": "誤りです。\n【根拠】実子がいない場合に算入できる養子の数は2人までです。\n【ひっかけ】実子がいる場合は1人までです。"}, {"id": "tf:1286db0743", "c": 6, "s": "問題6-3", "st": 2, "q": "被相続人の兄弟姉妹が相続により財産を取得した場合、その者の相続税額は2割加算の対象となる。", "a": true, "e": "正しい記述です。\n【根拠】兄弟姉妹は、配偶者・1親等の血族に該当しないため2割加算の対象です。\n【ひっかけ】父母は1親等の血族なので対象外です。"}, {"id": "tf:ed286dee79", "c": 6, "s": "問題6-3", "st": 2, "q": "相続税の未成年者控除の額は、20歳に達するまでの年数1年につき10万円である。", "a": false, "e": "誤りです。\n【根拠】未成年者控除は、18歳に達するまでの年数1年につき10万円です。\n【ひっかけ】成年年齢の引下げに伴い、20歳から18歳に変わりました。"}, {"id": "tf:2858693daf", "c": 6, "s": "問題6-3", "st": 1, "q": "相続人が被相続人の債務を承継した場合、その債務は相続税の課税価格の計算上、控除することができる。", "a": true, "e": "正しい記述です。\n【根拠】確実と認められる債務は控除できます。\n【ひっかけ】保証債務は、原則として控除できません。"}, {"id": "tf:c9bf658979", "c": 6, "s": "問題6-3", "st": 2, "q": "相続税の申告期限は、相続の開始があったことを知った日の翌日から6か月以内である。", "a": false, "e": "誤りです。\n【根拠】相続税の申告期限は10か月以内です。\n【ひっかけ】準確定申告は4か月以内、相続放棄は3か月以内です。"}, {"id": "tf:949a6c89c1", "c": 6, "s": "問題6-4", "st": 2, "q": "貸家建付地の評価額は、自用地評価額×（1－借地権割合×借家権割合×賃貸割合）で求める。", "a": true, "e": "正しい記述です。\n【根拠】賃貸アパートなどの敷地は、この算式で評価を下げることができます。\n【ひっかけ】貸宅地（底地）は、自用地評価額×（1－借地権割合）です。"}, {"id": "tf:0f2aca44ca", "c": 6, "s": "問題6-4", "st": 2, "q": "小規模宅地等の特例において、特定居住用宅地等は400㎡を限度に80％減額される。", "a": false, "e": "誤りです。\n【根拠】特定居住用宅地等は330㎡を限度に80％減額です。\n【ひっかけ】400㎡・80％は特定事業用宅地等です。"}, {"id": "tf:2e8a6963ca", "c": 6, "s": "問題6-4", "st": 2, "q": "小規模宅地等の特例において、貸付事業用宅地等は200㎡を限度に50％減額される。", "a": true, "e": "正しい記述です。\n【根拠】貸付事業用宅地等は200㎡まで50％減額です。\n【ひっかけ】他の区分と併用する場合は、面積の調整計算が必要です。"}, {"id": "tf:32e5da291f", "c": 6, "s": "問題6-4", "st": 2, "q": "上場株式は、課税時期の最終価格と、課税時期の属する月以前3か月間の各月の毎日の最終価格の月平均額のうち、最も高い価額で評価する。", "a": false, "e": "誤りです。\n【根拠】4つの価額のうち、最も低い価額で評価します。\n【ひっかけ】「最も高い」とする出題に注意します。"}, {"id": "tf:2004d57ce7", "c": 6, "s": "問題6-4", "st": 1, "q": "同族株主以外の株主等が取得した取引相場のない株式は、原則として配当還元方式で評価する。", "a": true, "e": "正しい記述です。\n【根拠】少数株主の株式は、配当還元方式で評価します。\n【ひっかけ】同族株主等が取得した場合は、原則的評価方式です。"}, {"id": "tf:f1fd9489e9", "c": 6, "s": "問題6-4", "st": 1, "q": "相続開始時において保険事故が発生していない生命保険契約に関する権利は、既に払い込んだ保険料の総額で評価する。", "a": false, "e": "誤りです。\n【根拠】生命保険契約に関する権利は、解約返戻金相当額で評価します。\n【ひっかけ】払込保険料の総額ではありません。"}, {"id": "tf:13b0b6e42d", "c": 6, "s": "問題6-4", "st": 2, "q": "親の所有する土地を子が無償で借りて建物を建てた場合（使用貸借）、その土地は相続税の計算上、自用地として評価する。", "a": true, "e": "正しい記述です。\n【根拠】使用貸借による借地権の価額はゼロとされ、土地は自用地評価です。\n【ひっかけ】地代を払う普通の借地なら、貸宅地として評価します。"}, {"id": "tf:43fcd05d92", "c": 6, "s": "問題6-4", "st": 1, "q": "不特定多数の者の通行の用に供されている私道は、自用地評価額の30％で評価する。", "a": false, "e": "誤りです。\n【根拠】不特定多数の者の通行の用に供されている私道は評価しません（ゼロ）。\n【ひっかけ】それ以外の私道（特定の者の通行用）が30％評価です。"}, {"id": "tf:4743760ba9", "c": 6, "s": "問題6-4", "st": 1, "q": "建築中の家屋の相続税評価額は、その家屋の費用現価の70％に相当する金額である。", "a": true, "e": "正しい記述です。\n【根拠】建築中の家屋は、課税時期までにかかった建築費用（費用現価）の70％で評価します。\n【ひっかけ】完成している家屋は、固定資産税評価額×1.0です。"}, {"id": "tf:960a1744d5", "c": 6, "s": "問題6-4", "st": 1, "q": "取引相場のあるゴルフ会員権は、課税時期の通常の取引価格の70％相当額で評価する。", "a": true, "e": "正しい記述です。\n【根拠】取引価格に含まれない預託金等がある場合は、別に加算します。\n【ひっかけ】上場株式のように、月平均などを比べる評価方法ではありません。"}, {"id": "tf:0022ee34e0", "c": 6, "s": "問題6-4", "st": 2, "q": "被相続人の配偶者が特定居住用宅地等を取得した場合、相続税の申告期限まで保有・居住していなければ、小規模宅地等の特例の適用を受けることはできない。", "a": false, "e": "誤りです。\n【根拠】配偶者が取得した場合は、保有・居住の要件はありません。\n【ひっかけ】同居親族が取得した場合は、申告期限までの保有・居住が必要です。"}, {"id": "tf:620789d798", "c": 6, "s": "問題6-4", "st": 1, "q": "路線価方式において、2つの路線に面する宅地は、奥行価格補正後の価額が高いほうの路線を正面路線とする。", "a": true, "e": "正しい記述です。\n【根拠】正面路線を決めた後、側方路線影響加算などを行います。\n【ひっかけ】路線価が高いほうではなく、補正後の価額が高いほうです。"}, {"id": "tf:7877453180", "c": 6, "s": "問題6-4", "st": 1, "q": "角地は、側方路線影響加算により、評価額が加算される。", "a": true, "e": "正しい記述です。\n【根拠】角地は利用価値が高いため、加算されます。\n【ひっかけ】表と裏の両方が道路に面する場合は二方路線影響加算です。"}, {"id": "tf:b962b7a068", "c": 6, "s": "問題6-4", "st": 2, "q": "借地権の価額は、自用地評価額に借地権割合を乗じて求める。", "a": true, "e": "正しい記述です。\n【根拠】借地権＝自用地評価額×借地権割合です。\n【ひっかけ】貸宅地（底地）は、自用地評価額×（1－借地権割合）です。"}, {"id": "tf:c1ebf33f1c", "c": 6, "s": "問題6-4", "st": 2, "q": "被相続人と同居していた親族が特定居住用宅地等を取得した場合、相続税の申告期限まで保有し居住し続けなくても、小規模宅地等の特例の適用を受けられる。", "a": false, "e": "誤りです。\n【根拠】同居親族は、申告期限まで保有し居住し続けることが要件です。\n【ひっかけ】配偶者には、この要件はありません。"}, {"id": "tf:77d5b95434", "c": 6, "s": "問題6-4", "st": 1, "q": "被相続人に配偶者も同居親族もいない場合、相続開始前3年以内に自己や配偶者などの持家に住んだことがない別居の親族が取得した宅地は、特定居住用宅地等に該当しうる。", "a": true, "e": "正しい記述です。\n【根拠】いわゆる「家なき子」の特例です。申告期限まで保有することも要件です。\n【ひっかけ】相続開始時に住んでいる家屋を過去に所有していたことがないことも要件です。"}, {"id": "tf:5ba3f168e8", "c": 6, "s": "問題6-4", "st": 1, "q": "被相続人が要介護認定を受けて老人ホームに入居していた場合、もとの自宅の敷地は、一定の要件を満たせば特定居住用宅地等の対象となる。", "a": true, "e": "正しい記述です。\n【根拠】入居後に自宅を他の用途に使っていないことなどが要件です。\n【ひっかけ】要介護・要支援認定などを受けていることが必要です。"}, {"id": "tf:0200d06ddb", "c": 6, "s": "問題6-4", "st": 1, "q": "相続開始前3年以内に新たに貸付けを始めた宅地は、原則として貸付事業用宅地等の対象とならない。", "a": true, "e": "正しい記述です。\n【根拠】相続直前の駆け込みの賃貸を防ぐための規定です。\n【ひっかけ】3年を超えて事業的規模で貸付けを行っている者などは例外です。"}, {"id": "tf:c611843840", "c": 6, "s": "問題6-4", "st": 2, "q": "特定居住用宅地等と特定事業用宅地等を併用する場合、適用面積は最大730㎡となる。", "a": true, "e": "正しい記述です。\n【根拠】330㎡＋400㎡＝730㎡まで、それぞれ80％減額できます。\n【ひっかけ】貸付事業用宅地等を含めて併用する場合は、面積の調整計算が必要です。"}, {"id": "tf:627f145ee8", "c": 6, "s": "問題6-4", "st": 2, "q": "取引相場のない株式を同族株主等が取得した場合、大会社は原則として類似業種比準方式で評価する。", "a": true, "e": "正しい記述です。\n【根拠】大会社は純資産価額方式も選べます。中会社は併用方式、小会社は純資産価額方式（併用方式も選択可）です。\n【ひっかけ】同族株主以外の株主等が取得した場合は配当還元方式です。"}, {"id": "tf:ca3f2609a7", "c": 6, "s": "問題6-4", "st": 1, "q": "類似業種比準方式の比準要素は、1株当たりの配当金額・利益金額・純資産価額である。", "a": true, "e": "正しい記述です。\n【根拠】類似業種の株価に、これら3つの要素を比べた割合を掛けて評価します。\n【ひっかけ】利益や配当を減らすと、評価額が下がりやすくなります。"}, {"id": "tf:36c690a0dc", "c": 6, "s": "問題6-4", "st": 1, "q": "純資産価額方式では、評価差額に対する法人税等相当額として、その37％を控除する。", "a": true, "e": "正しい記述です。\n【根拠】相続税評価額による純資産と帳簿価額による純資産の差額（評価差額）の37％を控除します。\n【ひっかけ】数字を変える出題に注意します。"}, {"id": "tf:e87e23722f", "c": 6, "s": "問題6-4", "st": 1, "q": "外貨預金は、原則として課税時期のTTSで円換算して評価する。", "a": false, "e": "誤りです。\n【根拠】外貨預金は、原則としてTTB（対顧客直物電信買相場）で円換算します。\n【ひっかけ】取引金融機関が定める相場を使います。"}, {"id": "tf:dc36c8bb5f", "c": 6, "s": "問題6-4", "st": 1, "q": "借家権は、借家権の取引慣行がない地域においては、相続税の課税対象として評価しない。", "a": true, "e": "正しい記述です。\n【根拠】一般的な住宅の借家権は、取引慣行がないため評価しません。\n【ひっかけ】貸家の評価では、借家権割合を使って評価額を下げます。"}, {"id": "tf:bb8cc50262", "c": 6, "s": "問題6-4", "st": 2, "q": "貸宅地（底地）の評価額は、自用地評価額に借地権割合を乗じて求める。", "a": false, "e": "誤りです。\n【根拠】貸宅地は、自用地評価額×（1－借地権割合）で求めます。\n【ひっかけ】自用地評価額×借地権割合で求めるのは借地権です。"}, {"id": "tf:d6b1c16589", "c": 6, "s": "問題6-4", "st": 2, "q": "貸家の評価額は、固定資産税評価額×（1－借家権割合×賃貸割合）で求める。", "a": true, "e": "正しい記述です。\n【根拠】借家権割合は全国一律30％です。\n【ひっかけ】自用家屋は固定資産税評価額×1.0です。"}, {"id": "tf:415146c130", "c": 6, "s": "問題6-4", "st": 2, "q": "上場株式の相続税評価額は、課税時期の終値のみで評価する。", "a": false, "e": "誤りです。\n【根拠】課税時期の終値、課税時期の月・前月・前々月の終値の月平均額のうち、最も低い価額で評価します。\n【ひっかけ】取引相場のない株式とは評価方法が異なります。"}, {"id": "tf:aba8add749", "c": 6, "s": "問題6-4", "st": 1, "q": "生命保険契約に関する権利は、相続開始時の解約返戻金相当額で評価する。", "a": true, "e": "正しい記述です。\n【根拠】保険事故が発生していない契約の権利です。\n【ひっかけ】契約者が被保険者以外の場合に、契約者の相続財産となります。"}, {"id": "tf:db51d08658", "c": 6, "s": "問題6-4", "st": 1, "q": "定期預金は、相続開始時の預入高に、既経過利子の額（源泉徴収税額相当額を差し引いた額）を加えて評価する。", "a": true, "e": "正しい記述です。\n【根拠】普通預金は、既経過利子が少額なら預入高で評価します。\n【ひっかけ】外貨預金は、原則としてTTBで円換算します。"}, {"id": "tf:e5fe2e7648", "c": 6, "s": "問題6-4", "st": 2, "q": "小規模宅地等の特例の貸付事業用宅地等は、400㎡を限度に80％減額される。", "a": false, "e": "誤りです。\n【根拠】貸付事業用宅地等は、200㎡を限度に50％減額されます。\n【ひっかけ】400㎡・80％は特定事業用宅地等です。"}, {"id": "tf:898098ab0f", "c": 6, "s": "問題6-5", "st": 2, "q": "相続税の申告書は、相続の開始があったことを知った日の翌日から10か月以内に提出しなければならない。", "a": true, "e": "正しい記述です。\n【根拠】申告期限は10か月以内で、納付期限も同じです。\n【ひっかけ】準確定申告（4か月以内）と区別します。"}, {"id": "tf:24e0fa05b9", "c": 6, "s": "問題6-5", "st": 1, "q": "相続税の物納において、上場株式は第1順位の物納財産である。", "a": true, "e": "正しい記述です。\n【根拠】第1順位は、不動産・船舶・国債・地方債・上場株式等です。\n【ひっかけ】物納は、延納によっても金銭納付が困難な場合に限り認められます。"}, {"id": "tf:8430dcbaf6", "c": 6, "s": "問題6-5", "st": 1, "q": "相続税の取得費加算の特例は、相続税の申告期限の翌日から5年以内に相続財産を譲渡した場合に適用を受けられる。", "a": false, "e": "誤りです。\n【根拠】申告期限の翌日から3年以内に譲渡した場合に適用されます。\n【ひっかけ】相続開始から3年10か月以内と覚えることもできます。"}, {"id": "tf:36fb7a106d", "c": 6, "s": "問題6-5", "st": 1, "q": "経営承継円滑化法による遺留分に関する民法の特例の適用を受けるためには、推定相続人全員の合意、経済産業大臣の確認及び家庭裁判所の許可が必要である。", "a": true, "e": "正しい記述です。\n【根拠】除外合意・固定合意をするには、この3つが必要です。\n【ひっかけ】合意だけで効力が生じるわけではありません。"}, {"id": "tf:75ddc9ff8c", "c": 6, "s": "問題6-5", "st": 1, "q": "相続により取得した非上場株式を、相続税の申告期限の翌日から3年以内に発行会社に譲渡した場合、みなし配当課税は行われない。", "a": true, "e": "正しい記述です。\n【根拠】この特例により、譲渡所得（20.315％）として課税され、相続税の取得費加算も使えます。\n【ひっかけ】通常、発行会社への譲渡（自己株式の取得）にはみなし配当課税が行われます。"}, {"id": "tf:f17e9d27f8", "c": 6, "s": "問題6-5", "st": 2, "q": "相続税の申告書は、相続人の住所地を所轄する税務署長に提出する。", "a": false, "e": "誤りです。\n【根拠】被相続人の死亡時の住所地を所轄する税務署長に提出します。\n【ひっかけ】相続人が別々の地域に住んでいても、提出先は同じです。"}, {"id": "tf:fdc0304159", "c": 6, "s": "問題6-5", "st": 1, "q": "相続人は、相続により受けた利益の価額を限度として、他の相続人が納付すべき相続税について連帯して納付する義務を負う。", "a": true, "e": "正しい記述です。\n【根拠】連帯納付義務です。\n【ひっかけ】他の相続人が納めないと、自分が請求されることがあります。"}, {"id": "tf:933017f0b1", "c": 6, "s": "問題6-5", "st": 1, "q": "小規模宅地等の特例の適用を受けた土地を物納する場合の収納価額は、特例適用前の価額である。", "a": false, "e": "誤りです。\n【根拠】収納価額は、特例適用後の価額（課税価格の計算の基礎となった価額）です。\n【ひっかけ】そのため、特例を受けた土地の物納は不利になることがあります。"}, {"id": "tf:2748f4dfb2", "c": 6, "s": "問題6-5", "st": 2, "q": "非上場株式等の相続税の納税猶予の特例措置では、対象株式数の上限がなく、相続税の全額が猶予される。", "a": true, "e": "正しい記述です。\n【根拠】特例措置は全株・100％、一般措置は発行済議決権株式の3分の2まで・80％です。\n【ひっかけ】特例措置を受けるには、特例承継計画の提出などが必要です。"}, {"id": "tf:3661be6063", "c": 6, "s": "問題6-5", "st": 1, "q": "役員退職金を支給すると、会社の利益や純資産が減少するため、自社株の評価額が下がることがある。", "a": true, "e": "正しい記述です。\n【根拠】類似業種比準価額・純資産価額の両方が下がりやすくなります。\n【ひっかけ】退職金の額は、不相当に高額にならないよう注意が必要です。"}, {"id": "tf:b79ce6a240", "c": 6, "s": "問題6-5", "st": 1, "q": "相続税の納税資金を準備するため、被相続人を被保険者、相続人を受取人とする生命保険を活用することは有効である。", "a": true, "e": "正しい記述です。\n【根拠】死亡保険金は現金ですぐに受け取れ、非課税金額もあります。\n【ひっかけ】受取人を指定できるため、遺産分割の対策にもなります。"}, {"id": "tf:43a20475d7", "c": 6, "s": "問題6-5", "st": 1, "q": "相続税の延納の許可を受けるためには、原則として担保を提供する必要がある。", "a": true, "e": "正しい記述です。\n【根拠】延納税額が100万円以下で延納期間3年以下の場合は、担保は不要です。\n【ひっかけ】延納中は利子税がかかります。"}, {"id": "tf:1d0b42d5c7", "c": 6, "s": "問題6-5", "st": 2, "q": "相続税は、金銭一時納付が困難であれば、延納を経ずに直ちに物納を選択することができる。", "a": false, "e": "誤りです。\n【根拠】物納は、延納によっても金銭で納付することが困難な場合に限り認められます。\n【ひっかけ】延納が優先です。"}, {"id": "tf:c377827487", "c": 6, "s": "問題6-5", "st": 1, "q": "非上場株式等の相続税の納税猶予を受けた後継者が死亡した場合、猶予されていた相続税は免除される。", "a": true, "e": "正しい記述です。\n【根拠】後継者の死亡などの事由が生じると、猶予税額は免除されます。\n【ひっかけ】事業を継続しないなど一定の事由が生じると、猶予税額を納付しなければなりません。"}, {"id": "tf:b5089d76b1", "c": 6, "s": "問題6-6", "st": 1, "q": "被相続人は、遺言で、相続開始の時から10年間、遺産の分割を禁止することができる。", "a": false, "e": "誤りです。\n【根拠】遺言で分割を禁止できるのは、相続開始から5年を超えない期間です。\n【ひっかけ】数字を変える出題に注意します。"}, {"id": "tf:6d3d89e996", "c": 6, "s": "問題6-6", "st": 2, "q": "代償分割により、特定の相続人が他の相続人に代償金を支払った場合、代償金を受け取った相続人の相続税の課税価格には、その代償金の額が加算される。", "a": true, "e": "正しい記述です。\n【根拠】代償金を支払った者は課税価格から差し引き、受け取った者は加算します。\n【ひっかけ】代償金として土地などの資産を渡すと、渡した側に譲渡所得が生じます。"}, {"id": "tf:8527e2c4d4", "c": 6, "s": "問題6-6", "st": 1, "q": "配偶者居住権の存続期間は、別段の定めがない限り、配偶者の終身の間である。", "a": true, "e": "正しい記述です。\n【根拠】存続期間は原則として終身です。登記をすれば第三者に対抗できます。\n【ひっかけ】配偶者短期居住権とは別の制度です。"}, {"id": "tf:098996ef69", "c": 6, "s": "問題6-6", "st": 1, "q": "被相続人の療養看護に尽くした相続人以外の親族は、相続人に対して特別寄与料を請求することができる。", "a": true, "e": "正しい記述です。\n【根拠】特別寄与料は、相続人以外の親族（子の配偶者など）が請求できます。\n【ひっかけ】相続人の寄与は、寄与分として遺産分割で考慮されます。"}, {"id": "tf:d176e6f715", "c": 6, "s": "問題6-6", "st": 2, "q": "任意後見契約は、公正証書によって締結しなければならない。", "a": true, "e": "正しい記述です。\n【根拠】任意後見契約は公正証書で結びます。効力は、家庭裁判所が任意後見監督人を選任した時から生じます。\n【ひっかけ】法定後見は、家庭裁判所が後見人等を選任します。"}, {"id": "tf:b3caa11148", "c": 6, "s": "問題6-6", "st": 1, "q": "法定後見制度は、本人の判断能力の程度に応じて、後見・保佐・補助の3つの類型に分かれる。", "a": true, "e": "正しい記述です。\n【根拠】判断能力が最も低い場合が後見、次が保佐、軽い場合が補助です。\n【ひっかけ】任意後見には類型の区分はありません。"}, {"id": "tf:97c3bf3caa", "c": 6, "s": "問題6-6", "st": 1, "q": "後見開始の審判は、本人、配偶者、4親等内の親族などの請求により、家庭裁判所が行う。", "a": true, "e": "正しい記述です。\n【根拠】市町村長も申立てができます。\n【ひっかけ】成年後見人は家庭裁判所が選任します。"}, {"id": "tf:74368e2eb2", "c": 6, "s": "問題6-6", "st": 1, "q": "成年被後見人が日用品を購入した行為は、成年後見人が取り消すことができる。", "a": false, "e": "誤りです。\n【根拠】日用品の購入その他日常生活に関する行為は、取り消せません。\n【ひっかけ】それ以外の法律行為は取り消せます。"}, {"id": "tf:da9b017a84", "c": 6, "s": "問題6-6", "st": 1, "q": "被保佐人が不動産を売却するには、保佐人の同意が必要である。", "a": true, "e": "正しい記述です。\n【根拠】借金・保証・不動産の売買などの重要な行為には、保佐人の同意が必要です。\n【ひっかけ】補助人の同意が必要な行為は、家庭裁判所が定めます。"}, {"id": "tf:025aa41c78", "c": 6, "s": "問題6-6", "st": 1, "q": "民事信託（家族信託）において、信託財産から生じる利益は、原則として受託者に課税される。", "a": false, "e": "誤りです。\n【根拠】原則として、利益を受ける受益者に課税されます。\n【ひっかけ】委託者と受益者が同じなら、信託を設定しても課税は生じません（自益信託）。"}, {"id": "tf:248dfb64b5", "c": 6, "s": "問題6-6", "st": 2, "q": "任意後見契約は、本人の判断能力が低下した後に締結する。", "a": false, "e": "誤りです。\n【根拠】任意後見契約は、本人の判断能力が十分なうちに公正証書で締結します。\n【ひっかけ】判断能力が低下した後は、法定後見を利用します。"}], "mc": [{"id": "mc:35ba7903be", "c": 1, "s": "問題1-1", "st": 2, "q": "ファイナンシャル・プランナー（FP）の顧客に対する行為に関する次の記述のうち、関連法規に照らし、最も不適切なものはどれか。", "o": ["税理士資格を有しないFPが、顧客から無償で相談を受け、その顧客の所得税の具体的な納付税額を計算した。", "弁護士資格を有しないFPが、顧客の公正証書遺言作成の際に証人となった。", "生命保険募集人の登録を受けていないFPが、顧客の必要保障額を試算した。", "金融商品取引業の登録を受けていないFPが、景気動向や金利の見通しについて一般的な説明をした。"], "a": 0, "e": "正解は「税理士資格を有しないFPが、顧客から無償で相談を受け、その顧客の所得税の具体的な納付税額を計算した。」です。\n【根拠】個別具体的な税額計算は税務相談に当たり、無償でも税理士資格が必要です。\n【ひっかけ】証人・必要保障額の試算・一般的な経済の説明は、いずれも資格がなくても行えます。"}, {"id": "mc:356eb78f00", "c": 1, "s": "問題1-1", "st": 2, "q": "毎年一定額を複利で運用しながら積み立て、10年後に1,000万円を準備したい。毎年の積立額を求めるときに用いる係数として、最も適切なものはどれか。", "o": ["年金終価係数", "減債基金係数", "資本回収係数", "現価係数"], "a": 1, "e": "正解は「減債基金係数」です。\n【根拠】将来の目標額×減債基金係数＝毎年の積立額です。\n【ひっかけ】年金終価係数は、毎年の積立額から将来の元利合計を求めるときに使います（逆数の関係）。"}, {"id": "mc:0f08c6382a", "c": 1, "s": "問題1-1", "st": 2, "q": "1,000万円を年利2％で複利運用しながら、10年間にわたって毎年均等に取り崩す場合、毎年受け取れる金額として正しいものはどれか（係数：年利2％・10年の資本回収係数0.1113、年金現価係数8.9826、減債基金係数0.0913）。", "o": ["91.3万円", "100万円", "111.3万円", "898.3万円"], "a": 2, "e": "正解は「111.3万円」です。\n【根拠】現在の元本から毎年の取崩額を求めるには資本回収係数を使います。1,000万円×0.1113＝111.3万円です。\n【ひっかけ】減債基金係数を使うと91.3万円になります。どの係数を使うかを問う出題です。"}, {"id": "mc:88962a832f", "c": 1, "s": "問題1-1", "st": 2, "q": "毎年120万円を受け取るために、年利1％で複利運用する場合、10年間受け取るために現時点で必要な元本として正しいものはどれか（係数：年利1％・10年の年金現価係数9.4713、資本回収係数0.1056、年金終価係数10.4622）。", "o": ["1,136.6万円", "1,200.0万円", "1,255.5万円", "126.7万円"], "a": 0, "e": "正解は「1,136.6万円」です。\n【根拠】毎年の受取額×年金現価係数＝必要な元本。120万円×9.4713＝1,136.556万円≒1,136.6万円です。\n【ひっかけ】年金終価係数を使うと1,255.5万円になります。"}, {"id": "mc:e7fd8e63a8", "c": 1, "s": "問題1-1", "st": 2, "q": "毎年30万円を年利1％で複利運用しながら10年間積み立てた場合の10年後の元利合計額として、正しいものはどれか（年利1％・10年の年金終価係数10.4622、減債基金係数0.0956、終価係数1.1046）。", "o": ["300.0万円", "313.9万円", "331.4万円", "286.8万円"], "a": 1, "e": "正解は「313.9万円」です。\n【根拠】30万円×10.4622＝313.866万円≒313.9万円です。\n【ひっかけ】300万円×終価係数で計算すると331.4万円になりますが、毎年積み立てる場合は年金終価係数を使います。"}, {"id": "mc:e927e09c11", "c": 1, "s": "問題1-1", "st": 2, "q": "10年後に500万円を準備するために、年利2％で複利運用する場合、現時点で必要な元本として正しいものはどれか（年利2％・10年の現価係数0.8203、終価係数1.2190、年金現価係数8.9826）。", "o": ["410.2万円", "449.1万円", "609.5万円", "556.6万円"], "a": 0, "e": "正解は「410.2万円」です。\n【根拠】将来の目標額×現価係数＝現在必要な元本。500万円×0.8203＝410.15万円≒410.2万円です。\n【ひっかけ】終価係数で割っても同じ結果になりますが、掛けてしまうと609.5万円になります。"}, {"id": "mc:24d426fd71", "c": 1, "s": "問題1-1", "st": 2, "q": "10年後に1,000万円を準備するために、年利1％で複利運用しながら毎年積み立てる場合の毎年の積立額として正しいものはどれか（年利1％・10年の減債基金係数0.0956、資本回収係数0.1056）。", "o": ["95.6万円", "100.0万円", "105.6万円", "90.5万円"], "a": 0, "e": "正解は「95.6万円」です。\n【根拠】目標額×減債基金係数＝毎年の積立額。1,000万円×0.0956＝95.6万円です。\n【ひっかけ】資本回収係数を使うと105.6万円になります。"}, {"id": "mc:9af3f63f3f", "c": 1, "s": "問題1-2", "st": 2, "q": "全国健康保険協会管掌健康保険の給付に関する次の記述のうち、最も適切なものはどれか。", "o": ["傷病手当金は、連続して3日間休業した後、4日目から支給される。", "傷病手当金の支給期間は、支給開始日から通算して2年である。", "出産手当金は、出産日以前56日から出産日後42日までの期間に支給される。", "出産育児一時金の額は、産科医療補償制度に加入する医療機関で出産した場合、1児につき42万円である。"], "a": 0, "e": "正解は「傷病手当金は、連続して3日間休業した後、4日目から支給される。」です。\n【根拠】傷病手当金は連続3日の待期の後、4日目から支給されます。\n【ひっかけ】支給期間は通算1年6か月、出産手当金は産前42日・産後56日、出産育児一時金は50万円です。"}, {"id": "mc:0911a739d6", "c": 1, "s": "問題1-2", "st": 2, "q": "介護保険に関する次の記述のうち、最も適切なものはどれか。", "o": ["第1号被保険者は、60歳以上の者である。", "第2号被保険者は、要介護状態となった原因を問わず給付を受けられる。", "介護サービスの利用者負担は、原則として1割である。", "第2号被保険者の保険料は、年金から天引きされる。"], "a": 2, "e": "正解は「介護サービスの利用者負担は、原則として1割である。」です。\n【根拠】利用者負担は原則1割で、一定以上の所得がある第1号被保険者は2割又は3割です。\n【ひっかけ】第1号は65歳以上、第2号は特定疾病の場合のみ給付、第2号の保険料は医療保険料と一緒に徴収されます。"}, {"id": "mc:93da652454", "c": 1, "s": "問題1-2", "st": 2, "q": "退職後の公的医療保険に関する次の記述のうち、最も適切なものはどれか。", "o": ["任意継続被保険者の保険料は、事業主と折半して負担する。", "任意継続被保険者となるには、資格喪失日から14日以内に申し出る必要がある。", "要件を満たせば、家族の健康保険の被扶養者となることができる。", "国民健康保険の保険料は、加入者一人ひとりについて計算され、世帯で合算されない。"], "a": 2, "e": "正解は「要件を満たせば、家族の健康保険の被扶養者となることができる。」です。\n【根拠】年収要件などを満たせば、家族の被扶養者になれます。\n【ひっかけ】任意継続は全額自己負担・20日以内、国民健康保険の保険料は世帯単位です。"}, {"id": "mc:89e93d79a8", "c": 1, "s": "問題1-2", "st": 2, "q": "70歳未満で所得区分が一般（標準報酬月額28万円〜50万円）の者が、1か月の医療費100万円（保険診療・自己負担3割）を支払った場合の高額療養費の自己負担限度額として、正しいものはどれか。算式：80,100円＋（医療費－267,000円）×1％。", "o": ["80,100円", "87,430円", "90,100円", "300,000円"], "a": 1, "e": "正解は「87,430円」です。\n【根拠】80,100円＋（1,000,000円－267,000円）×1％＝80,100円＋7,330円＝87,430円です。\n【ひっかけ】窓口で払った30万円との差額212,570円が、高額療養費として払い戻されます。"}, {"id": "mc:10ee65775d", "c": 1, "s": "問題1-2", "st": 2, "q": "健康保険の傷病手当金に関する次の記述のうち、最も適切なものはどれか。", "o": ["連続3日間の待期期間には、有給休暇を充てることはできない。", "支給期間は、支給開始日から通算して1年6か月である。", "支給額は、1日につき標準報酬日額の2分の1相当額である。", "任意継続被保険者となった後に発病した病気についても支給される。"], "a": 1, "e": "正解は「支給期間は、支給開始日から通算して1年6か月である。」です。\n【根拠】支給期間は通算1年6か月です。\n【ひっかけ】待期は有給休暇でもよく、支給額は3分の2、任意継続被保険者には原則支給されません。"}, {"id": "mc:5f56308c7d", "c": 1, "s": "問題1-2", "st": 2, "q": "健康保険の給付に関する次の記述のうち、最も適切なものはどれか。", "o": ["傷病手当金は、業務上の病気にも支給される。", "出産手当金は、被扶養配偶者の出産にも支給される。", "被保険者が死亡した場合、埋葬を行う家族に埋葬料5万円が支給される。", "高額療養費の対象には、入院時の食事代も含まれる。"], "a": 2, "e": "正解は「被保険者が死亡した場合、埋葬を行う家族に埋葬料5万円が支給される。」です。\n【根拠】埋葬料は5万円です。\n【ひっかけ】傷病手当金は業務外、出産手当金は被保険者本人、高額療養費に食事代は含まれません。"}, {"id": "mc:0671fbc38d", "c": 1, "s": "問題1-2", "st": 2, "q": "支給開始日以前12か月の標準報酬月額の平均額が36万円である被保険者の、傷病手当金の1日あたりの額として正しいものはどれか。", "o": ["6,000円", "8,000円", "9,000円", "12,000円"], "a": 1, "e": "正解は「8,000円」です。\n【根拠】36万円÷30日＝12,000円、12,000円×2/3＝8,000円です。\n【ひっかけ】2/3を掛け忘れると12,000円になります。"}, {"id": "mc:acaded709a", "c": 1, "s": "問題1-2", "st": 2, "q": "健康保険の任意継続被保険者に関する次の記述のうち、最も適切なものはどれか。", "o": ["資格喪失日の前日まで継続して1年以上の被保険者期間が必要である。", "資格喪失日から20日以内に申し出る必要がある。", "加入できる期間は最長1年である。", "保険料は事業主と折半して負担する。"], "a": 1, "e": "正解は「資格喪失日から20日以内に申し出る必要がある。」です。\n【根拠】資格喪失日から20日以内の申出が必要です。\n【ひっかけ】被保険者期間は継続2か月以上、最長2年、保険料は全額自己負担です。"}, {"id": "mc:95ed57aa08", "c": 1, "s": "問題1-3", "st": 2, "q": "雇用保険に関する次の記述のうち、最も不適切なものはどれか。", "o": ["基本手当の受給資格は、原則として離職の日以前2年間に被保険者期間が通算12か月以上あることである。", "基本手当の待期期間は、通算7日間である。", "高年齢雇用継続基本給付金は、賃金が60歳到達時の75％未満に低下した場合に支給される。", "雇用保険の保険料は、全額を事業主が負担する。"], "a": 3, "e": "正解は「雇用保険の保険料は、全額を事業主が負担する。」です。\n【根拠】雇用保険の保険料は事業主と労働者の双方が負担します。\n【ひっかけ】全額事業主負担なのは労災保険です。"}, {"id": "mc:bfda78665d", "c": 1, "s": "問題1-3", "st": 2, "q": "雇用保険の給付に関する次の記述のうち、最も適切なものはどれか。", "o": ["基本手当の待期期間は通算14日間である。", "育児休業給付金は、休業開始から180日目までは賃金日額の67％相当額である。", "高年齢雇用継続基本給付金は、65歳以上の者に支給される。", "労災保険の保険料は、労使折半である。"], "a": 1, "e": "正解は「育児休業給付金は、休業開始から180日目までは賃金日額の67％相当額である。」です。\n【根拠】育児休業給付金は180日目まで67％、以後50％です。\n【ひっかけ】待期は7日間、高年齢雇用継続基本給付金は60歳以上65歳未満、労災保険料は全額事業主負担です。"}, {"id": "mc:7d25df1fdc", "c": 1, "s": "問題1-3", "st": 2, "q": "雇用保険の給付に関する次の記述のうち、最も不適切なものはどれか。", "o": ["基本手当の受給期間は、原則として離職の日の翌日から1年間である。", "65歳以上で離職した者には、高年齢求職者給付金が一時金で支給される。", "介護休業給付金は、同じ家族について通算93日、3回まで分割できる。", "自己都合退職で被保険者期間が15年の場合、所定給付日数は150日である。"], "a": 3, "e": "正解は「自己都合退職で被保険者期間が15年の場合、所定給付日数は150日である。」です。\n【根拠】自己都合退職で10年以上20年未満なら120日です。150日は20年以上の場合です。\n【ひっかけ】10年未満90日・10年以上20年未満120日・20年以上150日です。"}, {"id": "mc:05c373422c", "c": 1, "s": "問題1-3", "st": 2, "q": "労災保険に関する次の記述のうち、最も適切なものはどれか。", "o": ["療養補償給付を受ける場合、医療費の3割を自己負担する。", "保険料は労使折半で負担する。", "中小事業主は、特別加入することができる。", "障害補償給付は、障害等級にかかわらず年金で支給される。"], "a": 2, "e": "正解は「中小事業主は、特別加入することができる。」です。\n【根拠】中小事業主や一人親方などは特別加入できます。\n【ひっかけ】療養補償給付は自己負担なし、保険料は全額事業主負担、障害補償給付は8〜14級が一時金です。"}, {"id": "mc:9d3ad1ff74", "c": 1, "s": "問題1-3", "st": 2, "q": "雇用保険・労災保険に関する次の記述のうち、最も不適切なものはどれか。", "o": ["一般の受給資格者の基本手当の受給には、離職前2年間に被保険者期間12か月以上が必要である。", "高年齢雇用継続基本給付金は、65歳以上の被保険者に支給される。", "育児休業給付金は、父親も受けられる。", "単身赴任者の帰省先との往復も、要件を満たせば通勤とされる。"], "a": 1, "e": "正解は「高年齢雇用継続基本給付金は、65歳以上の被保険者に支給される。」です。\n【根拠】高年齢雇用継続基本給付金は、60歳以上65歳未満が対象です。\n【ひっかけ】65歳以上の離職者には高年齢求職者給付金があります。"}, {"id": "mc:3897587bb9", "c": 1, "s": "問題1-3", "st": 2, "q": "45歳で自己都合退職した者（被保険者期間8年）の雇用保険の基本手当の所定給付日数として、正しいものはどれか。", "o": ["90日", "120日", "150日", "180日"], "a": 0, "e": "正解は「90日」です。\n【根拠】自己都合退職などの一般の受給資格者で、被保険者期間10年未満は90日です。\n【ひっかけ】10年以上20年未満は120日、20年以上は150日です。"}, {"id": "mc:7a64d77839", "c": 1, "s": "問題1-4", "st": 2, "q": "公的年金に関する次の記述のうち、最も適切なものはどれか。", "o": ["老齢基礎年金の受給資格期間は25年である。", "老齢基礎年金を60歳0か月で繰上げ受給した場合の減額率は24％である（1962年4月2日以後生まれ）。", "老齢基礎年金の繰下げ受給による増額率は、1か月あたり0.4％である。", "合算対象期間は、老齢基礎年金の年金額の計算に反映される。"], "a": 1, "e": "正解は「老齢基礎年金を60歳0か月で繰上げ受給した場合の減額率は24％である（1962年4月2日以後生まれ）。」です。\n【根拠】0.4％×60か月＝24％です。\n【ひっかけ】受給資格期間は10年、繰下げの増額率は0.7％、合算対象期間は年金額に反映されません。"}, {"id": "mc:74d31a37c5", "c": 1, "s": "問題1-4", "st": 2, "q": "国民年金の付加年金に関する次の記述のうち、最も適切なものはどれか。", "o": ["付加保険料の額は月額200円である。", "付加年金の額は、400円に付加保険料納付月数を乗じた額である。", "国民年金基金の加入員は、付加保険料を納付することができない。", "第2号被保険者も付加保険料を納付することができる。"], "a": 2, "e": "正解は「国民年金基金の加入員は、付加保険料を納付することができない。」です。\n【根拠】国民年金基金の加入員は付加保険料を納付できません。\n【ひっかけ】付加保険料は月400円、付加年金は200円×納付月数です。対象は第1号被保険者（任意加入被保険者を含む）です。"}, {"id": "mc:99406d410b", "c": 1, "s": "問題1-4", "st": 2, "q": "国民年金に関する次の記述のうち、最も不適切なものはどれか。", "o": ["第3号被保険者は、自ら保険料を納付する必要はない。", "学生納付特例期間は、受給資格期間に算入される。", "老齢基礎年金の繰下げは、老齢厚生年金と別々に行うことができる。", "老齢基礎年金の繰上げは、老齢厚生年金と別々に行うことができる。"], "a": 3, "e": "正解は「老齢基礎年金の繰上げは、老齢厚生年金と別々に行うことができる。」です。\n【根拠】繰上げは老齢基礎年金と老齢厚生年金を同時に請求しなければなりません。\n【ひっかけ】繰下げは別々に行えます。"}, {"id": "mc:dac9197a65", "c": 1, "s": "問題1-4", "st": 2, "q": "老齢基礎年金を70歳0か月から繰り下げて受給した場合の増額率として、正しいものはどれか。", "o": ["24％", "30％", "42％", "84％"], "a": 2, "e": "正解は「42％」です。\n【根拠】0.7％×60か月＝42％です。\n【ひっかけ】24％は60歳0か月からの繰上げの減額率、84％は75歳0か月までの繰下げの増額率です。"}, {"id": "mc:1fb3c7e86a", "c": 1, "s": "問題1-4", "st": 2, "q": "国民年金の保険料の免除・猶予に関する次の記述のうち、最も適切なものはどれか。", "o": ["学生納付特例は、世帯主の所得も含めて判定する。", "納付猶予制度は、60歳未満の者が対象である。", "第1号被保険者の産前産後期間の保険料免除には、所得の要件がない。", "免除を受けた期間の保険料は、5年以内に限り追納できる。"], "a": 2, "e": "正解は「第1号被保険者の産前産後期間の保険料免除には、所得の要件がない。」です。\n【根拠】産前産後期間の免除は、所得にかかわらず受けられます。\n【ひっかけ】学生納付特例は本人の所得のみ、納付猶予は50歳未満、追納は10年以内です。"}, {"id": "mc:2dfd72e902", "c": 1, "s": "問題1-4", "st": 2, "q": "老齢年金に関する次の記述のうち、最も不適切なものはどれか。", "o": ["振替加算は、配偶者が1966年4月1日以前生まれであることが要件である。", "在職老齢年金の仕組みは、65歳以上の在職者にも適用される。", "老齢基礎年金の繰下げの申出は、65歳到達日の翌日から行うことができる。", "2009年4月以後の全額免除期間は、年金額にその2分の1が反映される。"], "a": 2, "e": "正解は「老齢基礎年金の繰下げの申出は、65歳到達日の翌日から行うことができる。」です。\n【根拠】繰下げの申出は、66歳到達日以後に行えます。\n【ひっかけ】65歳から1年を経過する前は繰下げの申出ができません。"}, {"id": "mc:7d91cac846", "c": 1, "s": "問題1-4", "st": 2, "q": "老齢年金の繰上げ・繰下げに関する次の記述のうち、最も適切なものはどれか。", "o": ["繰上げ請求は、受給開始前なら取り消すことができる。", "老齢厚生年金を繰り下げると、加給年金額も増額される。", "繰上げ受給者は、原則として事後重症の障害基礎年金を請求できない。", "在職老齢年金の仕組みでは、老齢基礎年金も支給停止される。"], "a": 2, "e": "正解は「繰上げ受給者は、原則として事後重症の障害基礎年金を請求できない。」です。\n【根拠】繰上げ受給者は65歳に達したものとみなされるため、事後重症の障害基礎年金などは請求できません。\n【ひっかけ】繰上げは取消不可、加給年金は増額されず、在職老齢年金で停止されるのは老齢厚生年金です。"}, {"id": "mc:ca951f2da9", "c": 1, "s": "問題1-4", "st": 2, "q": "老齢基礎年金の満額を80万円と仮定する。20歳から60歳までのうち、保険料納付済期間が400月、全額免除期間（2009年4月以後）が40月、未納期間が40月の場合の年金額として正しいものはどれか。", "o": ["66.7万円", "70.0万円", "73.3万円", "80.0万円"], "a": 1, "e": "正解は「70.0万円」です。\n【根拠】80万円×（400月＋40月×1/2）÷480月＝80万円×420/480＝70万円です。\n【ひっかけ】全額免除期間をそのまま数えると73.3万円、免除期間を無視すると66.7万円になります。"}, {"id": "mc:115234152c", "c": 1, "s": "問題1-4", "st": 2, "q": "1962年4月2日以後生まれの者が、老齢基礎年金を63歳0か月で繰上げ受給した場合の減額率として正しいものはどれか。", "o": ["8.4％", "9.6％", "14.4％", "24.0％"], "a": 1, "e": "正解は「9.6％」です。\n【根拠】65歳まで24か月の繰上げ。0.4％×24か月＝9.6％です。\n【ひっかけ】0.7％を使うと16.8％になります。0.7％は繰下げの増額率です。"}, {"id": "mc:a6b64f326d", "c": 1, "s": "問題1-5", "st": 2, "q": "遺族給付に関する次の記述のうち、最も不適切なものはどれか。", "o": ["遺族基礎年金は、子のある配偶者又は子に支給される。", "遺族厚生年金の額は、死亡した者の報酬比例部分の4分の3相当額である。", "夫の死亡当時30歳未満で子のない妻に支給される遺族厚生年金は、5年間の有期給付である。", "中高齢寡婦加算は、夫の死亡当時30歳以上65歳未満の妻に加算される。"], "a": 3, "e": "正解は「中高齢寡婦加算は、夫の死亡当時30歳以上65歳未満の妻に加算される。」です。\n【根拠】中高齢寡婦加算の対象は、夫の死亡当時40歳以上65歳未満で、遺族基礎年金を受けられない妻です。\n【ひっかけ】30歳は「子のない妻の5年有期給付」の基準となる年齢です。"}, {"id": "mc:8b9d040222", "c": 1, "s": "問題1-5", "st": 2, "q": "個人型確定拠出年金（iDeCo）に関する次の記述のうち、最も適切なものはどれか。", "o": ["掛金は、生命保険料控除の対象となる。", "老齢給付金を年金で受け取った場合は、雑所得として課税される。", "老齢給付金を一時金で受け取った場合は、一時所得として課税される。", "通算加入者等期間に関係なく、60歳から老齢給付金を受け取ることができる。"], "a": 1, "e": "正解は「老齢給付金を年金で受け取った場合は、雑所得として課税される。」です。\n【根拠】年金で受け取ると雑所得（公的年金等控除の対象）です。\n【ひっかけ】掛金は小規模企業共済等掛金控除、一時金は退職所得です。60歳から受け取るには通算加入者等期間10年以上が必要です。"}, {"id": "mc:2602b3c8be", "c": 1, "s": "問題1-5", "st": 2, "q": "国民年金の第1号被保険者の独自給付に関する次の記述のうち、最も適切なものはどれか。", "o": ["寡婦年金は、妻が65歳になってから支給される。", "寡婦年金の額は、夫の老齢基礎年金の額の3分の2である。", "死亡一時金は、第1号被保険者として36月以上保険料を納付した者が死亡した場合に支給される。", "寡婦年金と死亡一時金は、両方を受け取ることができる。"], "a": 2, "e": "正解は「死亡一時金は、第1号被保険者として36月以上保険料を納付した者が死亡した場合に支給される。」です。\n【根拠】死亡一時金は、36月以上の保険料納付が要件です。\n【ひっかけ】寡婦年金は60歳から65歳まで、額は4分の3、死亡一時金とは選択です。"}, {"id": "mc:298955ece7", "c": 1, "s": "問題1-5", "st": 2, "q": "公的年金と税金に関する次の記述のうち、最も不適切なものはどれか。", "o": ["老齢基礎年金は、雑所得として課税される。", "遺族厚生年金は、非課税である。", "障害基礎年金は、雑所得として課税される。", "公的年金等の収入金額が400万円以下で、他の所得が20万円以下なら、確定申告は不要である。"], "a": 2, "e": "正解は「障害基礎年金は、雑所得として課税される。」です。\n【根拠】障害年金は非課税です。\n【ひっかけ】課税されるのは老齢年金（公的年金等の雑所得）です。"}, {"id": "mc:7b41ac7961", "c": 1, "s": "問題1-5", "st": 2, "q": "中小企業の退職金準備の制度に関する次の記述のうち、最も適切なものはどれか。", "o": ["中小企業退職金共済には、事業主本人も加入できる。", "中小企業退職金共済の掛金は、従業員と事業主が折半して負担する。", "小規模企業共済の共済金を一括で受け取ると、退職所得として課税される。", "小規模企業共済の掛金は、生命保険料控除の対象となる。"], "a": 2, "e": "正解は「小規模企業共済の共済金を一括で受け取ると、退職所得として課税される。」です。\n【根拠】小規模企業共済の一括受取は退職所得です。\n【ひっかけ】中退共は従業員のみ・全額事業主負担、小規模企業共済の掛金は小規模企業共済等掛金控除の対象です。"}, {"id": "mc:da5a389f05", "c": 1, "s": "問題1-5", "st": 2, "q": "確定拠出年金に関する次の記述のうち、最も適切なものはどれか。", "o": ["iDeCoの掛金は、月額1,000円から設定できる。", "iDeCoの老齢給付金の受給開始は、75歳までの間で選択できる。", "企業型確定拠出年金の運用の指図は、事業主が行う。", "国民年金の第3号被保険者は、iDeCoに加入できない。"], "a": 1, "e": "正解は「iDeCoの老齢給付金の受給開始は、75歳までの間で選択できる。」です。\n【根拠】受給開始時期は60歳から75歳までの間で選べます。\n【ひっかけ】掛金は月5,000円以上、企業型DCの運用指図は加入者、第3号被保険者もiDeCoに加入できます。"}, {"id": "mc:5060ab984b", "c": 1, "s": "問題1-5", "st": 2, "q": "遺族年金に関する次の記述のうち、最も適切なものはどれか。", "o": ["遺族基礎年金は、子のある夫には支給されない。", "夫の死亡当時30歳未満で子のない妻の遺族厚生年金は、終身支給される。", "中高齢寡婦加算は、遺族基礎年金を受けている間は支給停止される。", "遺族厚生年金の額は、報酬比例部分の3分の2である。"], "a": 2, "e": "正解は「中高齢寡婦加算は、遺族基礎年金を受けている間は支給停止される。」です。\n【根拠】遺族基礎年金を受けている間、中高齢寡婦加算は支給停止されます。\n【ひっかけ】子のある夫にも遺族基礎年金が支給され、30歳未満で子のない妻は5年有期、額は4分の3です。"}, {"id": "mc:dee8146ad1", "c": 1, "s": "問題1-5", "st": 2, "q": "掛金と所得控除の組合せとして、最も適切なものはどれか。", "o": ["iDeCoの掛金―社会保険料控除", "国民年金基金の掛金―社会保険料控除", "小規模企業共済の掛金―社会保険料控除", "付加保険料―小規模企業共済等掛金控除"], "a": 1, "e": "正解は「国民年金基金の掛金―社会保険料控除」です。\n【根拠】国民年金基金の掛金は社会保険料控除です。\n【ひっかけ】iDeCo・小規模企業共済は小規模企業共済等掛金控除、付加保険料は社会保険料控除です。"}, {"id": "mc:000a8bf824", "c": 1, "s": "問題1-5", "st": 2, "q": "死亡した夫の老齢厚生年金の報酬比例部分の額が120万円である場合、妻が受ける遺族厚生年金の額として正しいものはどれか（中高齢寡婦加算などは考慮しない）。", "o": ["60万円", "80万円", "90万円", "120万円"], "a": 2, "e": "正解は「90万円」です。\n【根拠】遺族厚生年金＝報酬比例部分の4分の3＝120万円×3/4＝90万円です。\n【ひっかけ】3分の2で計算すると80万円になります。"}, {"id": "mc:2302c84aa9", "c": 1, "s": "問題1-6", "st": 2, "q": "住宅ローンに関する次の記述のうち、最も不適切なものはどれか。", "o": ["元利均等返済は、毎回の返済額が一定である。", "元金均等返済は、元利均等返済に比べて当初の返済額が多い。", "同額を繰上げ返済する場合、期間短縮型は返済額軽減型より利息の軽減効果が大きい。", "フラット35は、借入時から10年間だけ金利が固定される住宅ローンである。"], "a": 3, "e": "正解は「フラット35は、借入時から10年間だけ金利が固定される住宅ローンである。」です。\n【根拠】フラット35は全期間固定金利の住宅ローンです。\n【ひっかけ】「10年固定」は固定金利期間選択型の説明です。"}, {"id": "mc:1867f41910", "c": 1, "s": "問題1-6", "st": 2, "q": "フラット35に関する次の記述のうち、最も不適切なものはどれか。", "o": ["融資率が9割を超えると、金利が高くなる。", "保証人は不要である。", "中古住宅の購入資金には利用できない。", "他の住宅ローンからの借換えに利用できる。"], "a": 2, "e": "正解は「中古住宅の購入資金には利用できない。」です。\n【根拠】技術基準を満たす中古住宅の購入にも利用できます。\n【ひっかけ】繰上返済の手数料もかかりません。"}, {"id": "mc:97faa3551e", "c": 1, "s": "問題1-6", "st": 2, "q": "財形貯蓄に関する次の記述のうち、最も適切なものはどれか。", "o": ["一般財形貯蓄の利子は、元本550万円まで非課税である。", "財形年金貯蓄の契約は、契約時に55歳未満であることが要件である。", "財形住宅貯蓄の利子は、元本1,000万円まで非課税である。", "財形貯蓄は、自営業者も利用できる。"], "a": 1, "e": "正解は「財形年金貯蓄の契約は、契約時に55歳未満であることが要件である。」です。\n【根拠】財形年金貯蓄・財形住宅貯蓄は、契約時55歳未満の勤労者が対象です。\n【ひっかけ】非課税は年金・住宅を合わせて元本550万円まで、一般財形は非課税なし、自営業者は利用できません。"}, {"id": "mc:459da9787a", "c": 1, "s": "問題1-6", "st": 2, "q": "住宅ローンに関する次の記述のうち、最も適切なものはどれか。", "o": ["全期間固定金利型は、一般に変動金利型より当初の金利が低い。", "フラット35には、保証料が必要である。", "期間短縮型の繰上げ返済では、毎月の返済額は変わらない。", "元金均等返済は、毎回の返済額が一定である。"], "a": 2, "e": "正解は「期間短縮型の繰上げ返済では、毎月の返済額は変わらない。」です。\n【根拠】期間短縮型は、毎月の返済額は変わらず期間が短くなります。\n【ひっかけ】固定金利は当初金利が高め、フラット35は保証料不要、毎回の返済額が一定なのは元利均等返済です。"}, {"id": "mc:22ca2b2524", "c": 1, "s": "問題1-7", "st": 2, "q": "固定費が2,000万円、変動費率が60％の企業の損益分岐点売上高として、正しいものはどれか。", "o": ["3,333万円", "4,000万円", "5,000万円", "8,000万円"], "a": 2, "e": "正解は「5,000万円」です。\n【根拠】損益分岐点売上高＝固定費÷（1－変動費率）＝2,000万円÷0.4＝5,000万円です。\n【ひっかけ】変動費率で割ると3,333万円になります。分母は限界利益率（1－変動費率）です。"}, {"id": "mc:13b6c13653", "c": 1, "s": "問題1-7", "st": 2, "q": "次の財務データから求めたA社の流動比率として、正しいものはどれか。流動資産：6,000万円、うち当座資産：3,600万円、流動負債：4,000万円、総資本：2億円、自己資本：8,000万円。", "o": ["40％", "66.7％", "90％", "150％"], "a": 3, "e": "正解は「150％」です。\n【根拠】流動比率＝6,000万円÷4,000万円×100＝150％です。\n【ひっかけ】当座比率は3,600÷4,000＝90％、自己資本比率は8,000÷2億＝40％です。"}, {"id": "mc:b400cc6874", "c": 1, "s": "問題1-7", "st": 2, "q": "消費者信用に関する次の記述のうち、最も適切なものはどれか。", "o": ["総量規制は、銀行のカードローンにも適用される。", "クレジットカードのショッピング枠の利用は、総量規制の対象外である。", "総量規制により、貸金業者からの借入れは原則として年収の2分の1までとなる。", "リボルビング払いでは、利用残高にかかわらず手数料は発生しない。"], "a": 1, "e": "正解は「クレジットカードのショッピング枠の利用は、総量規制の対象外である。」です。\n【根拠】ショッピングは貸金業法の「貸付け」ではないため、総量規制の対象外です。\n【ひっかけ】総量規制は年収の3分の1まで、銀行は対象外、リボ払いは残高に手数料がかかります。"}, {"id": "mc:798220bea8", "c": 1, "s": "問題1-7", "st": 2, "q": "次の損益計算書のデータから求めた経常利益として、正しいものはどれか。売上高1億円、売上原価6,000万円、販売費及び一般管理費2,500万円、営業外収益200万円、営業外費用300万円。", "o": ["1,400万円", "1,500万円", "1,600万円", "4,000万円"], "a": 0, "e": "正解は「1,400万円」です。\n【根拠】営業利益＝1億－6,000万－2,500万＝1,500万円。経常利益＝1,500万＋200万－300万＝1,400万円です。\n【ひっかけ】営業利益の1,500万円で止めないように注意します。売上総利益は4,000万円です。"}, {"id": "mc:12fe3badb1", "c": 1, "s": "問題1-7", "st": 2, "q": "利息制限法の上限金利の組合せとして、正しいものはどれか（元本10万円未満／10万円以上100万円未満／100万円以上）。", "o": ["15％／18％／20％", "20％／18％／15％", "18％／15％／12％", "20％／20％／15％"], "a": 1, "e": "正解は「20％／18％／15％」です。\n【根拠】元本が少ないほど上限金利は高く、20％・18％・15％です。\n【ひっかけ】出資法の上限は20％です。"}, {"id": "mc:6708a731f8", "c": 1, "s": "問題1-7", "st": 2, "q": "次の貸借対照表のデータから求めたB社の固定比率として、正しいものはどれか。固定資産：1億2,000万円、自己資本：8,000万円、固定負債：4,000万円、流動負債：3,000万円。", "o": ["66.7％", "100％", "150％", "171.4％"], "a": 2, "e": "正解は「150％」です。\n【根拠】固定比率＝固定資産÷自己資本×100＝1億2,000万÷8,000万×100＝150％です。\n【ひっかけ】固定長期適合率は、固定資産÷（自己資本＋固定負債）＝1億2,000万÷1億2,000万＝100％です。"}, {"id": "mc:5a190c7d85", "c": 1, "s": "問題1-7", "st": 2, "q": "財務指標に関する次の記述のうち、最も不適切なものはどれか。", "o": ["流動比率は、一般に高いほど短期的な支払能力が高い。", "自己資本比率は、一般に高いほど財務の安定性が高い。", "固定費が増加すると、損益分岐点売上高は低下する。", "固定比率は、一般に低いほど財務の安全性が高い。"], "a": 2, "e": "正解は「固定費が増加すると、損益分岐点売上高は低下する。」です。\n【根拠】固定費が増えると、損益分岐点売上高は上昇します。\n【ひっかけ】損益分岐点売上高＝固定費÷（1－変動費率）です。"}, {"id": "mc:3865f4cf07", "c": 1, "s": "問題1-8", "st": 2, "q": "年収800万円、所得税35万円、住民税45万円、社会保険料115万円、生命保険料24万円の世帯の可処分所得として、正しいものはどれか。", "o": ["581万円", "605万円", "640万円", "685万円"], "a": 1, "e": "正解は「605万円」です。\n【根拠】可処分所得＝800－（35＋45＋115）＝605万円です。\n【ひっかけ】生命保険料まで差し引くと581万円になります。"}, {"id": "mc:0903bb2908", "c": 1, "s": "問題1-8", "st": 2, "q": "現在の年間生活費が300万円で、毎年2％ずつ上昇する場合、2年後の年間生活費として正しいものはどれか（万円未満四捨五入）。", "o": ["306万円", "310万円", "312万円", "318万円"], "a": 2, "e": "正解は「312万円」です。\n【根拠】300万円×1.02²＝300万円×1.0404＝312.12万円≒312万円です。\n【ひっかけ】単利で計算すると312万円と同じに見えますが、年数が長くなると差が出ます。"}, {"id": "mc:659f692e1a", "c": 1, "s": "問題1-8", "st": 2, "q": "前年末の金融資産残高が500万円、運用利率1％、その年の年間収支が＋40万円のとき、その年の年末の金融資産残高として正しいものはどれか。", "o": ["540万円", "545万円", "545.4万円", "550万円"], "a": 1, "e": "正解は「545万円」です。\n【根拠】500万円×1.01＋40万円＝505万円＋40万円＝545万円です。\n【ひっかけ】年間収支にも運用利率を掛けると545.4万円になります。"}, {"id": "mc:68c2f5071c", "c": 2, "s": "問題2-1", "st": 2, "q": "保険契約者保護機構に関する次の記述のうち、最も適切なものはどれか。", "o": ["生命保険契約は、原則として破綻時点の責任準備金等の80％まで補償される。", "家計地震保険は、保険金の100％が補償される。", "少額短期保険業者の保険契約も、補償の対象となる。", "国内で営業する外国保険会社の日本支店との契約は、補償の対象外である。"], "a": 1, "e": "正解は「家計地震保険は、保険金の100％が補償される。」です。\n【根拠】自賠責保険と家計地震保険は100％補償されます。\n【ひっかけ】生命保険は90％です。少額短期保険と共済は対象外、外国保険会社の日本支店との契約は対象です。"}, {"id": "mc:d588931e41", "c": 2, "s": "問題2-1", "st": 2, "q": "保険法・保険業法に関する次の記述のうち、最も不適切なものはどれか。", "o": ["保険法は、共済契約にも適用される。", "保険法の規定より保険契約者に不利な特約は無効となる。", "保険金を請求する権利は、5年間行使しないと時効により消滅する。", "保険業法は、保険会社等に意向把握義務を課している。"], "a": 2, "e": "正解は「保険金を請求する権利は、5年間行使しないと時効により消滅する。」です。\n【根拠】保険金を請求する権利の時効は3年です。\n【ひっかけ】公的年金の時効（5年）と混同しないようにします。"}, {"id": "mc:4a013fe728", "c": 2, "s": "問題2-1", "st": 2, "q": "保険契約者保護の制度に関する次の記述のうち、最も適切なものはどれか。", "o": ["クーリング・オフの期間は、申込日から8日以内で、書面の受領日は関係ない。", "生命保険会社が破綻した場合、責任準備金等の全額が補償される。", "ソルベンシー・マージン比率200％以上は、健全性の一つの基準である。", "少額短期保険の生命保険の保険期間は、最長5年である。"], "a": 2, "e": "正解は「ソルベンシー・マージン比率200％以上は、健全性の一つの基準である。」です。\n【根拠】200％以上が健全性の一つの基準です。\n【ひっかけ】クーリング・オフはいずれか遅い日から8日、補償は90％、少額短期の生命保険は1年です。"}, {"id": "mc:895da6423c", "c": 2, "s": "問題2-2", "st": 2, "q": "生命保険の保険料の払込みが困難になった場合の対応に関する次の記述のうち、最も不適切なものはどれか。", "o": ["払済保険に変更すると、保険期間は変わらず、保険金額が少なくなる。", "延長保険に変更すると、保険金額は変わらず、保険期間が元の契約より短くなることがある。", "自動振替貸付は、解約返戻金の範囲内で保険会社が保険料を立て替える制度である。", "失効した契約を復活させる場合、告知や診査は不要である。"], "a": 3, "e": "正解は「失効した契約を復活させる場合、告知や診査は不要である。」です。\n【根拠】復活には告知又は診査が必要です。\n【ひっかけ】復活後の保険料率は失効前と同じです。"}, {"id": "mc:179906aec2", "c": 2, "s": "問題2-2", "st": 2, "q": "生命保険の契約に関する次の記述のうち、最も適切なものはどれか。", "o": ["責任開始日は、保険会社が契約を承諾した日である。", "告知義務違反による解除権は、契約締結から5年を経過すると消滅する。", "予定利率を高く設定すると、保険料は高くなる。", "無配当保険は、有配当保険に比べて保険料が高い。"], "a": 1, "e": "正解は「告知義務違反による解除権は、契約締結から5年を経過すると消滅する。」です。\n【根拠】解除権は、原因を知った時から1か月、又は契約締結から5年で消滅します。\n【ひっかけ】責任開始日は3要件がそろった日、予定利率が高いと保険料は安く、無配当保険は保険料が割安です。"}, {"id": "mc:69cbe336be", "c": 2, "s": "問題2-2", "st": 2, "q": "個人年金保険に関する次の記述のうち、最も適切なものはどれか。", "o": ["確定年金は、被保険者が死亡すると年金の支払が終了する。", "有期年金は、被保険者の生死にかかわらず一定期間年金が支払われる。", "終身年金は、被保険者が生存している限り年金が支払われる。", "変額個人年金保険は、年金原資に最低保証がない商品に限られる。"], "a": 2, "e": "正解は「終身年金は、被保険者が生存している限り年金が支払われる。」です。\n【根拠】終身年金は、被保険者が生存している限り一生涯支払われます。\n【ひっかけ】確定年金は生死に関係なく一定期間、有期年金は生存中の一定期間です。変額個人年金には年金原資の最低保証があるものもあります。"}, {"id": "mc:5fdb4ce9ba", "c": 2, "s": "問題2-2", "st": 2, "q": "生命保険の保険料に関する次の記述のうち、最も適切なものはどれか。", "o": ["付加保険料は、予定死亡率をもとに計算される。", "予定利率を低く設定すると、保険料は安くなる。", "純保険料は、予定死亡率と予定利率をもとに計算される。", "前納した保険料は、全額が払込みの年の生命保険料控除の対象となる。"], "a": 2, "e": "正解は「純保険料は、予定死亡率と予定利率をもとに計算される。」です。\n【根拠】純保険料は予定死亡率と予定利率で計算します。\n【ひっかけ】付加保険料は予定事業費率、予定利率が低いと保険料は高く、前納は充当された年分だけが控除対象です。"}, {"id": "mc:a400e383ba", "c": 2, "s": "問題2-2", "st": 2, "q": "生命保険商品に関する次の記述のうち、最も適切なものはどれか。", "o": ["逓減定期保険は、保険金額とともに保険料も減少する。", "変額保険の資産は、一般勘定で運用される。", "市場価格調整（MVA）がある保険では、金利が上昇すると解約返戻金が減少する。", "契約転換制度を利用する場合、告知や診査は不要である。"], "a": 2, "e": "正解は「市場価格調整（MVA）がある保険では、金利が上昇すると解約返戻金が減少する。」です。\n【根拠】MVAでは、市場金利が上昇すると解約返戻金が減少します。\n【ひっかけ】逓減定期保険の保険料は一定、変額保険は特別勘定、転換時には告知・診査が必要です。"}, {"id": "mc:4f6421a2fe", "c": 2, "s": "問題2-2", "st": 2, "q": "必要保障額に関する次の記述のうち、最も適切なものはどれか。", "o": ["必要保障額は、遺族の収入見込額から支出総額を差し引いて求める。", "団体信用生命保険付きの住宅ローンの返済額は、遺族の支出に含める。", "必要保障額は、一般に子の成長とともに減少していく。", "遺族年金の見込額は、遺族の収入に含めない。"], "a": 2, "e": "正解は「必要保障額は、一般に子の成長とともに減少していく。」です。\n【根拠】子の教育費や生活費が必要な期間が短くなるため、必要保障額は一般に減少します。\n【ひっかけ】必要保障額＝支出総額－収入見込額です。遺族年金は収入に含め、団信付きのローン返済は支出に含めません。"}, {"id": "mc:14faa374e2", "c": 2, "s": "問題2-2", "st": 2, "q": "生命保険の商品に関する次の記述のうち、最も不適切なものはどれか。", "o": ["定期保険の更新時には、告知・診査は不要である。", "定期保険特約付終身保険の主契約は、定期保険である。", "特定疾病保険金を受け取ると、その特定疾病保障保険は消滅する。", "引受基準緩和型医療保険の保険料は、一般の医療保険より割高である。"]
